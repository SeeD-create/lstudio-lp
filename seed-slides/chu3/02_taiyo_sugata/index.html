<script id="slide-data" type="application/json">[{"title": "太陽のすがた", "scene": "cover", "states": [{"_step": 0}], "notes": [], "teacher": "太陽の表面に見える事実から、恒星・光球・黒点・自転・プロミネンス・コロナへ進む。太陽を直接見ない安全を最初に確認する。", "chapter": "太陽", "caption": ""}, {"title": "太陽を、直接見てはいけない", "scene": "safety", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["目を傷めるため、肉眼で直接見ない。", "望遠鏡・双眼鏡で直接見ると、特に危険。", {"text": "太陽投影板や適切な観察器具を使う。", "red": true}], "teacher": "サングラス・色つき下敷き・すすガラスも不可。望遠鏡は投影法を用い、ファインダーにはふたをする。生徒だけで実施させない。", "chapter": "① 観察の前に", "caption": "安全な方法を確認してから、太陽を調べる。"}, {"title": "太陽は、自ら光を出している", "scene": "star", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["地球や月は、太陽の光を反射して見える。", "太陽は、自ら光と熱を出している。", {"text": "自ら光を出す天体を「恒星」という。", "red": true}], "teacher": "「燃えている」と表現しない。太陽は高温のプラズマで、中心部の核融合によってエネルギーを生み出す。核融合の詳細は講師補足に留める。", "chapter": "② 太陽の全体像", "caption": "地球に最も近い恒星が、太陽。"}, {"title": "太陽は、高温のガスの球", "scene": "gas", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["主に水素とヘリウムからできている。", "地面のような、固い表面はない。", {"text": "光って見える層を「光球」という。", "red": true}], "teacher": "厳密には電離した気体であるプラズマ。「ガス」は中学校向け表現。光球も固体表面ではなく、可視光が主に出てくる層。", "chapter": "② 太陽の全体像", "caption": "太陽の「表面」は、固い地面ではない。"}, {"title": "直径は、地球の約109倍", "scene": "size", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["地球の直径は、約1万2700km。", "太陽の直径は、約140万km。", {"text": "地球を約109個並べた大きさ。", "red": true}], "teacher": "直径の比較。体積約130万倍と混同させない。図では地球を見失わない範囲で強調している。", "chapter": "② 太陽の全体像", "caption": "大きさは、直径どうしで比べる。"}, {"title": "地球から、約1億5000万km", "scene": "distance", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["太陽の光は、1秒に約30万km進む。", "太陽から地球まで、光でも約8分20秒。", {"text": "今見ている光は、約8分20秒前に出た光。", "red": true}], "teacher": "平均距離は約1億4960万km。地球の公転軌道が楕円なので距離は一定ではない。ここでは平均値を丸める。", "chapter": "② 太陽の全体像", "caption": "遠くても、地球に届く光と熱は大きい。"}, {"title": "光って見える層が、光球", "scene": "photosphere", "states": [{"zoom": 0, "_step": 0}, {"zoom": 1, "_step": 1}, {"zoom": 2, "_step": 2}, {"zoom": 3, "_step": 3}], "notes": ["太陽の丸い面として見えている部分。", "光球の温度は、およそ6000℃。", {"text": "光球には、暗い点が見えることがある。", "red": true}], "teacher": "画像は教材用生成画像。色・粒状感・黒点配置は模式的で実観測画像ではない。光球の有効温度は約5500℃、中学校では約6000℃と扱う。", "chapter": "③ 光球と黒点", "caption": "画像は観察特徴を示す科学教材用の生成素材。"}, {"title": "暗い点は、何だろう？", "scene": "sunspots", "states": [{"zoom": 0, "_step": 0}, {"zoom": 1, "_step": 1}, {"zoom": 2, "_step": 2}, {"zoom": 3, "_step": 3}], "notes": ["まわりより暗く見える部分がある。", "形も大きさも、一つずつ違う。", {"text": "この暗い部分を「黒点」という。", "red": true}], "teacher": "黒点は穴ではない。生成画像は暗部と半暗部を強調している。答えを言う前に観察させる。", "chapter": "③ 光球と黒点", "caption": "黒点の形と、まわりとの明るさを比べる。"}, {"title": "黒点は、なぜ暗く見える？", "scene": "temperature", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["光球は、およそ6000℃。", "黒点は、およそ4000℃。", {"text": "まわりより温度が低いため、暗く見える。", "red": true}], "teacher": "「黒点は冷たい」と言わない。約4000℃あり、単独なら非常に明るい。周囲との温度差による明暗。数値は概数。", "chapter": "③ 光球と黒点", "caption": "黒点も高温だが、まわりの光球はさらに高温。"}, {"title": "黒点は、端で細く見える", "scene": "sphere", "states": [{"phase": 0, "_step": 0}, {"phase": 1, "_step": 1}, {"phase": 2, "_step": 2}, {"phase": 3, "_step": 3}], "notes": ["中央では、黒点を正面から見る。", "端に近づくと、斜めから見る。", {"text": "太陽が球形だから、黒点は細く見える。", "red": true}], "teacher": "黒点そのものが短時間で押しつぶされるのではなく、球面上の模様を斜めから見る射影。周縁減光とは別の現象。", "chapter": "③ 光球と黒点", "caption": "球面上の模様は、端ほど細く見える。"}, {"title": "同じ黒点を、数日間追う", "scene": "rotation", "states": [{"day": 0, "_step": 0}, {"day": 0, "_step": 1}, {"day": 3, "_step": 2}, {"day": 6, "_step": 3}, {"day": 6, "_step": 4}], "notes": ["1日目：黒点群は、太陽の東側に見える。", "4日目：同じ黒点群が、中央付近へ移った。", "7日目：さらに、西側へ移っていった。", {"text": "太陽そのものが回転していると考えられる。", "red": true}], "teacher": "一つの大きな太陽上で同じ黒点群を追う模式演出。実際には黒点の形も変化する。太陽の東西は地上の方位と混同させず、画面では移動方向を矢印でも示す。天球上の日周運動とは別。", "chapter": "④ 黒点と自転", "caption": "一つの黒点群だけを追い、位置の変化を比べる。"}, {"title": "太陽も、自転している", "scene": "rotationPeriod", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["太陽は、東から西へ黒点が移る向きに自転する。", "赤道付近は、約25日で1回転する。", {"text": "気体なので、場所によって回転の速さが違う。", "red": true}], "teacher": "地球から黒点を追うと見かけは約27日。地球も公転しているため、恒星を基準にした赤道付近の約25日とずれる。中学生には約25日を主表示し差は補足。", "chapter": "④ 黒点と自転", "caption": "黒点の移動は、太陽の自転を示す手がかり。"}, {"title": "太陽の縁から、ガスが立ち上がる", "scene": "prominence", "states": [{"zoom": 0, "_step": 0}, {"zoom": 1, "_step": 1}, {"zoom": 2, "_step": 2}, {"zoom": 3, "_step": 3}], "notes": ["縁の外へ、大きな弧が伸びている。", "磁力に沿って、ガスが持ち上がっている。", {"text": "この現象を「プロミネンス」という。", "red": true}], "teacher": "炎ではなく、磁場に支えられた比較的低温で密度の高いプラズマ。日本語では紅炎。画像は教材用生成画像。", "chapter": "⑤ 太陽の外側", "caption": "炎のように見えても、燃焼ではない。"}, {"title": "プロミネンスは、炎ではない", "scene": "prominenceScale", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["太陽は、酸素を使って燃えているのではない。", "プロミネンスは、高温のガスの動き。", {"text": "太陽の磁力が、大きな弧をつくる。", "red": true}], "teacher": "「高温」は日常感覚との比較。プロミネンスは周囲のコロナより低温だが、約1万℃程度になる。磁力線そのものが光っているわけではない。", "chapter": "⑤ 太陽の外側", "caption": "見た目が炎に似ていても、しくみは違う。"}, {"title": "皆既日食で見える、白い広がり", "scene": "corona", "states": [{"zoom": 0, "_step": 0}, {"zoom": 1, "_step": 1}, {"zoom": 2, "_step": 2}, {"zoom": 3, "_step": 3}], "notes": ["月が、明るい光球をかくす。", "太陽の外側に、淡い光が広がって見える。", {"text": "太陽の外側の大気を「コロナ」という。", "red": true}], "teacher": "肉眼で日食を見る場合も認証された日食観察用眼鏡が必要。皆既中の扱いは観察計画・地域の指針に従う。画像は教材用生成画像。", "chapter": "⑤ 太陽の外側", "caption": "光球が隠れると、淡いコロナを観察できる。"}, {"title": "光球・プロミネンス・コロナ", "scene": "layers", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}, {"level": 4, "_step": 4}], "notes": ["光球：ふだん丸い面として見える層。", "プロミネンス：磁力に沿って立ち上がるガス。", "コロナ：太陽の外側へ広がる大気。", {"text": "見える条件と場所が、それぞれ違う。", "red": true}], "teacher": "プロミネンスは層の名称ではなく現象・構造。光球、彩層、コロナの厳密な層構造のうち、彩層は本教材では用語化しない。", "chapter": "⑤ 太陽の外側", "caption": "三つの名前を、位置と見え方で区別する。"}, {"title": "太陽の特徴を、つなげて整理する", "scene": "memory", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}, {"level": 4, "_step": 4}], "notes": [{"text": "太陽は、自ら光を出す恒星。", "red": true}, {"text": "光球には、まわりより低温の黒点が見える。", "red": true}, "黒点の移動から、太陽の自転が分かる。", "外側には、プロミネンスやコロナが見える。"], "teacher": "新しい用語を増やさず、観察事実と結論をつなぐ。安全な観察方法も口頭で再確認する。", "chapter": "⑥ 覚えること", "caption": "観察できる事実から、太陽のすがたを説明する。"}]</script><script src="sun-scenes.js"></script><script src="player.js"></script><script src="../../_shared/catalog-nav.js" defer></script></body></html>
