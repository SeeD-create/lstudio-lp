変わる", "!同じ倍率なら、近い金星ほど大きい"], "states": [{}, {}, {}, {}, {}], "teacher": "最初の問いに戻り、太陽・地球・金星の位置関係から生徒に説明してもらう。宵・明けの名称、内外惑星、光の反射、公転による位置変化も口頭確認。", "caption": "", "kind": "memory"}]}</script><script src="scenes.js?v=venus-story-20261014"></script><script src="constellations.js"></script><script src="player.js?v=venus-story-20261014"></script><script src="../../_shared/catalog-nav.js" defer></script></body></html>
