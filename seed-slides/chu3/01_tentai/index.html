<script id="slide-data" type="application/json">[{"title": "天体の一日の動き", "scene": "cover", "states": [{"_step": 0}], "notes": [], "teacher": "太陽・月・星の一日の見かけの動きを、観測者と宇宙の二つの視点で考える。年周運動は別教材。", "chapter": "天体", "caption": ""}, {"title": "天体は、どうして毎日動くの？", "scene": "sunDay", "states": [{"hour": 6, "_step": 0}, {"hour": 9, "_step": 1}, {"hour": 12, "_step": 2}, {"hour": 18, "_step": 3}, {"hour": 21, "_step": 4}], "notes": ["朝、太陽は東の空に見える。", "昼には、南の空の高いところへ。", {"text": "太陽は東から昇り、西に沈む。", "red": true}, "夜になると、太陽は地平線の下にある。"], "teacher": "発問：太陽が動いているのか、私たちが動いているのか。天体とは、太陽・月・星など宇宙にある物体。日本の春分・秋分ごろの模式図。太陽を直視させない。", "chapter": "① 見える動きから", "caption": "南を向いた空。クリックで朝 → 昼 → 夕方 → 夜。"}, {"title": "星の見える方向を、ひとつの球に写す", "scene": "sphereProjection", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}, {"level": 4, "_step": 4}], "notes": ["星までの本当の距離は、それぞれ違う。", "見える方向を変えず、同じ球面に写して考える。", {"text": "観測者を中心とする、見かけの球が「天球」。", "red": true}, "実在する壁ではない。空の位置や動きを表す模型。"], "teacher": "灰色は実際の星、赤色は同じ方向を球面に写した位置。赤い星が移る演出は模型への写し替えで、実際に星が近づくのではない。プラネタリウムの天井を思い浮かべさせる。図は上半分だが、天球は地平線の下まで含む球全体。距離や星の大きさは模式的。", "chapter": "① 見える動きから", "caption": "距離は違っても、見える「方向」はそのまま。"}, {"title": "天球の、場所の名前を知ろう", "scene": "sphereTerms", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}, {"level": 4, "_step": 4}], "notes": [{"text": "① 天頂：観測者の真上の点。", "red": true}, {"text": "② 地平線：水平な方向と天球が交わる線。", "red": true}, {"text": "③ 天の北極：地軸を延ばした、北側の点。", "red": true}, {"text": "④ 天の南極：地軸を延ばした、南側の点。", "red": true}], "teacher": "中心にいるのは観測者。水平な円は観測者を通る水平面と天球の交わり。地軸という言葉は次の地球の図で改めて説明する。天の北極・南極は地球の北極・南極そのものではなく、地軸と平行な方向を空に延ばした点。日本では天の南極は地平線の下にある。地球や観測者の大きさ・距離は模式表現。", "chapter": "① 見える動きから", "caption": "日本から見た模式図。地平線の下にも、天球は続く。"}, {"title": "太陽の位置を、透明半球に記録する", "scene": "recordSun", "states": [{"hour": 8, "_step": 0}, {"hour": 8, "_step": 1}, {"hour": 9, "_step": 2}, {"hour": 10, "_step": 3}, {"hour": 11, "_step": 4}], "notes": [{"text": "ペン先の影を、台紙の中心 O に合わせる。", "red": true}, "8時の印を残して、9時の位置へ。", "10時にも、影の先端を中心 O に合わせる。", "11時の印も残す。点をつなぐと道すじになる。"], "teacher": "最初は8時の位置。1クリック目で光線とペンの影を確認し、以後9時、10時、11時で停止。春分・秋分ごろ、北緯35度、地方太陽時。8時は真東から南側へ進んだ位置。ペン全体の影も台紙に描き、先端の影だけがOと一致する。", "chapter": "② 動きを記録する", "caption": "左：地上からの見え方　｜　右：その方向を半球に記録"}, {"title": "地球は、地軸のまわりを回っている", "scene": "axisLesson", "states": [{"level": 0, "spin": 0, "_step": 0}, {"level": 1, "spin": 0, "_step": 1}, {"level": 2, "spin": 0, "_step": 2}, {"level": 2, "spin": 180, "_step": 3}, {"level": 2, "spin": 360, "_step": 4}], "notes": ["北極と南極を結ぶ、回転の中心の軸がある。", {"text": "この軸を「地軸」という。", "red": true}, "地軸の向きはそのまま。地球の表面が回る。", {"text": "地球が地軸のまわりを回る運動が「自転」。", "red": true}], "teacher": "地軸は実在する棒ではない。地軸という語の表示後、次のクリックで回転開始。経線と色つき地点が動き、軸は固定。傾きは視点に応じた模式表現。", "chapter": "③ 動く原因を考える", "caption": "軸と、回る地表を分けて見よう。"}, {"title": "北極の上から見ると、反時計回り", "scene": "spinViews", "states": [{"hour": 6, "_step": 0}, {"hour": 9, "_step": 1}, {"hour": 12, "_step": 2}, {"hour": 18, "_step": 3}], "notes": ["北極の上から見ると、反時計回りに回る。", {"text": "地球の自転の向きは、西から東。", "red": true}, "同じ地点を、二つの視点で追ってみよう。"], "teacher": "左は北極上空、右は地軸を斜めから見た図。経度の変化を同期。見る方向を指定せずに反時計回りとだけ教えない。", "chapter": "③ 動く原因を考える", "caption": "左：北極側から　｜　右：地軸を斜めから"}, {"title": "地球が回ると、空は反対に動いて見える", "scene": "pairedDay", "states": [{"hour": 6, "_step": 0}, {"hour": 9, "_step": 1}, {"hour": 12, "_step": 2}, {"hour": 18, "_step": 3}, {"hour": 24, "_step": 4}], "notes": ["私たちは、地面といっしょに回っている。", "地上から見ると、太陽は東から西へ進む。", {"text": "天体の一日の見かけの動きが「日周運動」。", "red": true}, "日周運動が起こる原因は、地球の自転。"], "teacher": "左は北緯35度で南を向いた空。右は北極上空の地球。共通の時刻を使用。右の人は常に足元が地表、頭が外側。春分・秋分ごろの簡略図。月には公転による変化もあるが一日の大きな東西運動は自転による。", "chapter": "③ 動く原因を考える", "caption": "左：地上から見える空　｜　右：宇宙から見た地球"}, {"title": "東・南・西・北で、道すじを比べよう", "scene": "fourSky", "states": [{"hours": 0, "_step": 0}, {"hours": 1, "_step": 1}, {"hours": 2, "_step": 2}, {"hours": 3, "_step": 3}, {"hours": 4, "_step": 4}], "notes": ["東の空：星は右上がりに昇っていく。", "南の空：東側から西側へ、弧を描く。", "西の空：星は右下がりに沈んでいく。", {"text": "北の空：北極星の近くを中心に反時計回り。", "red": true}], "teacher": "日本の中緯度。東を向くと右が南、西を向くと左が南。北極星は天の北極の近くにあり完全な中心ではない。軌跡の形と移動方向を読む。", "chapter": "④ 空の向きと場所", "caption": "一つの自転が、見る方向によって違う道すじに見える。"}, {"title": "東の空を、大きく見てみよう", "scene": "sky", "states": [{"view": "east", "hours": 0, "_step": 0}, {"view": "east", "hours": 1, "_step": 1}, {"view": "east", "hours": 2, "_step": 2}, {"view": "east", "hours": 4, "_step": 3}], "notes": ["東を向くと、右側が南。", "明るい星を追って、動く向きを見よう。", {"text": "星は、左下から右上へ昇っていく。", "red": true}], "teacher": "日本の中緯度の模式図。比較スライドと同じ天文計算・同じ星を拡大する。クリックごとに1時間後、2時間後、4時間後へ。北極星は天の北極の近く。図の下の方位と星の軌跡を指して説明する。", "chapter": "④ 空の向きと場所", "caption": "星の動きと、残った軌跡を大きく見よう。"}, {"title": "南の空を、大きく見てみよう", "scene": "sky", "states": [{"view": "south", "hours": 0, "_step": 0}, {"view": "south", "hours": 1, "_step": 1}, {"view": "south", "hours": 2, "_step": 2}, {"view": "south", "hours": 4, "_step": 3}], "notes": ["南を向くと、左が東・右が西。", "明るい星を追って、動く向きを見よう。", {"text": "星は、東から西へ弧を描いて動く。", "red": true}], "teacher": "日本の中緯度の模式図。比較スライドと同じ天文計算・同じ星を拡大する。クリックごとに1時間後、2時間後、4時間後へ。北極星は天の北極の近く。図の下の方位と星の軌跡を指して説明する。", "chapter": "④ 空の向きと場所", "caption": "星の動きと、残った軌跡を大きく見よう。"}, {"title": "西の空を、大きく見てみよう", "scene": "sky", "states": [{"view": "west", "hours": 0, "_step": 0}, {"view": "west", "hours": 1, "_step": 1}, {"view": "west", "hours": 2, "_step": 2}, {"view": "west", "hours": 4, "_step": 3}], "notes": ["西を向くと、左側が南。", "明るい星を追って、動く向きを見よう。", {"text": "星は、左上から右下へ沈んでいく。", "red": true}], "teacher": "日本の中緯度の模式図。比較スライドと同じ天文計算・同じ星を拡大する。クリックごとに1時間後、2時間後、4時間後へ。北極星は天の北極の近く。図の下の方位と星の軌跡を指して説明する。", "chapter": "④ 空の向きと場所", "caption": "星の動きと、残った軌跡を大きく見よう。"}, {"title": "北の空を、大きく見てみよう", "scene": "sky", "states": [{"view": "north", "hours": 0, "_step": 0}, {"view": "north", "hours": 1, "_step": 1}, {"view": "north", "hours": 2, "_step": 2}, {"view": "north", "hours": 4, "_step": 3}], "notes": ["北を向くと、右が東・左が西。", "明るい星を追って、動く向きを見よう。", {"text": "星は、北極星の近くを中心に反時計回り。", "red": true}], "teacher": "日本の中緯度の模式図。比較スライドと同じ天文計算・同じ星を拡大する。クリックごとに1時間後、2時間後、4時間後へ。北極星は天の北極の近く。図の下の方位と星の軌跡を指して説明する。", "chapter": "④ 空の向きと場所", "caption": "星の動きと、残った軌跡を大きく見よう。"}, {"title": "北と南で、なぜ回る向きが逆になる？", "scene": "sphereViewpoint", "states": [{"hours": 0, "facing": 1, "_step": 0}, {"hours": 2, "facing": 1, "_step": 1}, {"hours": 2, "facing": -1, "_step": 2}, {"hours": 4, "facing": -1, "_step": 3}, {"hours": 6, "facing": -1, "_step": 4}], "notes": ["天球の中心から北を向くと、反時計回りに見える。", "同じ場所で振り向いて、南の空を見る。", "天球の回り方は同じ。南側では時計回りに見える。", {"text": "見る向きが反対なので、回転も逆向きに見える。", "red": true}], "teacher": "左は観測者を中心とする一つの天球。赤い矢印は見る向き、青い軸は天の両極を結ぶ。まず北を見て星を動かす。次のクリックは時刻を止めて観測者だけが南に振り向く。その後、同じ天球の回転を続ける。右の空は同じ時刻・同じ向きに対応。日本では天の南極は地平線下なので、南の空では回転円の上側の弧が見える。自転や天球の回転方向自体が逆になるのではない。", "chapter": "④ 空の向きと場所", "caption": "左：一つの天球と観測者　｜　右：その人が見ている空"}, {"title": "北極・赤道・南半球では、どう見える？", "scene": "latitudeLesson", "states": [{"hours": 0, "_step": 0}, {"hours": 2, "_step": 1}, {"hours": 4, "_step": 2}, {"hours": 6, "_step": 3}], "notes": ["北極：天の北極が真上。星は地平線と平行に回る。", "赤道：天の極は地平線上。星は垂直に昇り沈む。", "南半球：天の南極が地平線より上に見える。"], "teacher": "共通の赤道座標と自転から計算。実線は地平線上、点線は地平線下。南半球は南緯35度の例で北極星は見えない。北極の太陽も一日にはほぼ水平に回るが高さは季節で変わる。", "chapter": "④ 空の向きと場所", "caption": "地平線に対する、回転軸の傾きを見比べる。"}, {"title": "真南に来た太陽を「南中」という", "scene": "sunAltitude", "states": [{"hour": 9, "angle": 0, "_step": 0}, {"hour": 12, "angle": 0, "_step": 1}, {"hour": 12, "angle": 1, "_step": 2}, {"hour": 15, "angle": 1, "_step": 3}], "notes": [{"text": "太陽が真南に来ることを「南中」という。", "red": true}, {"text": "南中したときの高度が「南中高度」。", "red": true}, "日本では、太陽は南中すると一日で最も高くなる。"], "teacher": "高度は地平線から測る。南中していない角度は単に高度。南中時刻は時計の12時ちょうどとは限らない。北緯35度の春分秋分では南中高度55度。天頂と南中を区別。", "chapter": "⑤ 太陽の道すじ", "caption": "左：空での位置　｜　右：横から見た「高度」の角度"}, {"title": "季節で変わるのは、道すじの高さと長さ", "scene": "seasonPaths", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["夏：南中高度が高く、昼の時間が長い。", "冬：南中高度が低く、昼の時間が短い。", {"text": "一日の動きは自転。季節の違いは別に考える。", "red": true}], "teacher": "北緯35度の夏至・春分秋分・冬至。地軸が傾いたまま公転するため太陽の通り道が変わる。ここでは観測事実に絞り、公転との立体関係は次教材。夏も真東から昇ると誤解させない。", "chapter": "⑤ 太陽の道すじ", "caption": "日本の同じ場所で比べる。日の出・日の入りの方位も変わる。"}, {"title": "1時間で、何度動いて見える？", "scene": "rate", "states": [{"angle": 0, "_step": 0}, {"angle": 15, "_step": 1}, {"angle": 30, "_step": 2}, {"angle": 60, "_step": 3}], "notes": ["地球は、約24時間で360°回る。", {"text": "360° ÷ 24時間 ＝ 1時間に約15°。", "red": true}, "2時間で30°、4時間で60°。"], "teacher": "回転軸まわりの角度であり、高度が毎時15度変わる意味ではない。恒星に対する自転周期は約23時間56分だが、ここでは約24時間、毎時15度として計算。", "chapter": "⑥ 時刻と方位", "caption": "角度と時間を結びつける。"}, {"title": "位置から、朝・昼・夕方・夜を読む", "scene": "clockLesson", "states": [{"hour": 6, "_step": 0}, {"hour": 12, "_step": 1}, {"hour": 18, "_step": 2}, {"hour": 30, "_step": 3}], "notes": ["太陽に正面を向く側が昼、反対側が夜。", "明るい側から暗い側へ進むと、日の入り。", {"text": "暗い側から明るい側へ進むと、日の出。", "red": true}], "teacher": "太陽左の北極上空図で上が朝、左が昼、下が夕方、右が真夜中。春分秋分の簡略図。最後に朝の境目を指し、自転で明るい側へ入ることを確認。", "chapter": "⑥ 時刻と方位", "caption": "光の当たる側と、自転して進む向きから考える。"}, {"title": "北極上空の図で、東西を決める", "scene": "localDirections", "states": [{"hour": 6, "_step": 0}, {"hour": 12, "_step": 1}, {"hour": 18, "_step": 2}, {"hour": 24, "_step": 3}], "notes": ["北極へ向かう方向が北。反対が南。", {"text": "この地点では、進む向きが東。反対が西。", "red": true}, "紙の上・下・左・右だけで、方位を決めない。"], "teacher": "北極上空図の極点以外の地点における局所方位。北は地球表面に沿って北極へ向かう向きで、平面図では中心方向。人の足は地表、頭は外側。地点ごとに紙面上の方位が変わる。北極点では東西の向きを定められないため「地球のどこにいても」とは言わない。", "chapter": "⑥ 時刻と方位", "caption": "観測者を動かすと、その人にとっての方位も回る。"}, {"title": "練習①　星が75°動くのは、何時間？", "scene": "anglePractice", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["1時間に動く角度は、約15°。", {"text": "75° ÷ 15° ＝ 5時間。", "red": true}, "角度を求めるなら「時間 × 15°」。"], "teacher": "先に生徒が考える時間を取る。15度が何回分あるかを説明。北の空なので反時計回り。独自問題。", "chapter": "⑦ 図を使って解く", "caption": "答えだけでなく、計算を選ぶ理由を説明しよう。"}, {"title": "練習②　記録から、日の出の時刻を求める", "scene": "recordPractice", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["1時間で3cm進む。日の出から8時までは6cm。", {"text": "1時間で3cm。2倍の6cmなら、時間も2倍で2時間。", "red": true}, {"text": "8時の2時間前は、午前6時。", "red": true}], "teacher": "半球上の道すじに沿う距離で考える。観測曲線を日の出まで延長。画面を定規で測らせない。1時間で3cm、2時間で6cmと対応させ、両方が2倍になることを確認する。", "chapter": "⑦ 図を使って解く", "caption": "同じ時間なら、道すじ上を進む長さも同じ。"}, {"title": "練習③　日の入りから6時間後は、どこ？", "scene": "clockPractice", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}], "notes": ["北極の上から見た自転は、反時計回り。", {"text": "15° × 6時間 ＝ 90°。", "red": true}, {"text": "日の入りから90°進むと、真夜中側。", "red": true}], "teacher": "太陽は左。日の入りは下、6時間後は右。位置を丸暗記せず、光と自転で判定。昼夜が12時間ずつのモデル。", "chapter": "⑦ 図を使って解く", "caption": "① 視点　→　② 自転の向き　→　③ 回る角度"}, {"title": "覚えることは、つながりで整理する", "scene": "memory", "states": [{"level": 0, "_step": 0}, {"level": 1, "_step": 1}, {"level": 2, "_step": 2}, {"level": 3, "_step": 3}, {"level": 4, "_step": 4}], "notes": [{"text": "自転：地球が地軸のまわりを、西から東へ回る。", "red": true}, {"text": "日周運動：自転による、天体の一日の見かけの動き。", "red": true}, "天球は方向を表す模型。観測者を中心に考える。", "時刻の問題は、光・自転の向き・1時間15°から解く。"], "teacher": "新しい知識を追加せず、用語と問題を解く根拠を一度整理。図の視点を確かめる習慣を確認。", "chapter": "⑧ 覚えること", "caption": ""}]</script><script src="astronomy.js"></script><script src="lesson-scenes.js"></script><script src="player.js"></script><script src="../../_shared/catalog-nav.js" defer></script></body></html>
