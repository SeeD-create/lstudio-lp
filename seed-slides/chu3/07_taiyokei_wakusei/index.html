ありません", "kind": ""}, {"title": "太陽から近い順に", "scene": "newOrder", "notes": ["水星・金星・地球・火星", "木星・土星・天王星・海王星", "!水・金・地・火・木・土・天・海"], "states": [{}, {}, {}, {}], "teacher": "語呂だけでなく太陽から近い順だと確認。地球の位置を指してもらい、以後の内側・外側の基準にする。", "caption": "太陽からの順序を表示／間隔・直径は実比ではありません", "kind": ""}, {"title": "軌道を横から見てみよう", "scene": "newOrbit", "notes": ["上から見ると、別々の軌道を回る", "視点を、ゆっくり横へ動かす", "!軌道は、ほぼ同じ平面にある"], "states": [{"flat": 1, "a": 0}, {"flat": 1, "a": 25}, {"flat": 0.08, "a": 25}, {"flat": 0.08, "a": 25}], "teacher": "同じ軌道ではなく異なる軌道がほぼ同じ面に並ぶ。俯瞰から側面への連続的な視点変更で理解させる。軌道傾斜は省略したモデル。", "caption": "視点を変える模式図／軌道間隔・天体の大きさは実比ではありません", "kind": "", "motionMs": 3000}, {"title": "回る向きにも、共通点がある", "scene": "newOrbit", "notes": ["北極側から見下ろしてみる", "それぞれの軌道を、同じ向きに進む", "!どの惑星も、反時計回りに公転する"], "states": [{"flat": 1, "a": 0}, {"flat": 1, "a": 80}, {"flat": 1, "a": 230}, {"flat": 1, "a": 360}], "teacher": "内側ほど角速度を大きくするが実際の周期比は圧縮。全惑星が1年で一周する図ではない。自転方向とは区別する。公転周期の計算は扱わない。", "caption": "北極側から見る／公転の速さの差は説明用に圧縮", "kind": "", "motionMs": 4200}, {"title": "直径の小さい順に並べると？", "scene": "newRank", "notes": ["まず、地球の大きさを基準に見る", "直径の小さい順に、並べ替える", "!小さい4つと、大きい4つに分かれる"], "states": [{"sort": 0}, {"sort": 0}, {"sort": 1}, {"sort": 1}], "teacher": "直径順：水星、火星、金星、地球、海王星、天王星、土星、木星。土星の環を直径に含めない。全惑星の球本体を同じ縮尺で比較する。", "caption": "球本体の直径を同じ縮尺で比較／数値は地球＝1／環を除く", "kind": "", "metric": "diameter", "motionMs": 6500}, {"title": "大きい惑星ほど、密度も大きい？", "scene": "newDensityQuestion", "notes": ["木星は、地球よりずっと大きい", "同じ体積にそろえても、木星の方が重い？"], "states": [{}, {}, {}], "teacher": "答えをすぐ表示せず予想を聞く。総質量は木星の方が大きいが、問うのは単位体積あたりの質量。次の図で比べる条件をそろえる。", "caption": "地球と木星の直径比は約1：11／比べたいのは同じ体積あたりの質量", "kind": ""}, {"title": "密度は、同じ体積で比べる", "scene": "newDensity", "notes": ["両方を、同じ1cm³にそろえる", "地球は、1cm³あたり約5.51g", "木星は、1cm³あたり約1.33g", "!同じ体積なら、地球の方が重い"], "states": [{"reveal": 0}, {"reveal": 1}, {"reveal": 2}, {"reveal": 3}, {"reveal": 4}], "teacher": "惑星全体の平均密度を同体積の仮想試料で比較している。惑星から実際に均一な立方体を切り出せる意味ではない。左右の体積は同じ。単位量をそろえてから質量を比べる。", "caption": "惑星全体の平均密度／同じ1cm³に換算した比較", "kind": ""}, {"title": "表の数字を、読んでみよう", "scene": "newData", "notes": ["直径の1は、地球と同じ大きさ", "密度の5.51は、1cm³あたり5.51g", "!比べるときは、同じ列を見る"], "states": [{}, {}, {}, {}], "teacher": "表は太陽から近い順。列を一つずつ照らし、直径と平均密度の単位を読む。公転周期列は今回の比較に混ぜない。数字そのものの暗記は求めない。", "caption": "代表値の概数／直径は地球＝1／平均密度はg/cm³", "kind": ""}, {"title": "密度の大きい順に並べると？", "scene": "newRank", "notes": ["同じ1cm³あたりの質量を比べる", "密度の大きい順に、並べ替える", "!さっきの小さい4つが、密度の大きい4つ"], "states": [{"sort": 0}, {"sort": 0}, {"sort": 1}, {"sort": 1}], "teacher": "密度順：地球、水星、金星、火星、海王星、木星、天王星、土星。画像は共通サイズの識別用で直径を表さない。棒の長さと数字だけが密度を表す。", "caption": "棒は平均密度（g/cm³）／惑星画像は識別用・共通サイズ", "kind": "", "metric": "density", "motionMs": 6000}, {"title": "2つのグループは、何が違う？", "scene": "newGroups", "notes": ["水星・金星・地球・火星は、小さく密度が大きい", "主に岩石や金属でできた、地球型惑星", "外側の4つは、大きく密度が小さい", "!中学では、外側の4つを木星型惑星と呼ぶ"], "states": [{}, {}, {}, {}, {}], "teacher": "数値の共通点を生徒の言葉で説明してから名称を出す。木星・土星は水素やヘリウム主体、天王星・海王星は水・アンモニア・メタン等の成分に富む氷巨大惑星。外側4つが全て気体だけ、空洞、軽い総質量などとは説明しない。密度には組成と内部の圧縮が影響する。", "caption": "直径・平均密度の共通点から分類／画像の直径は比較していません", "kind": ""}, {"title": "地球型惑星、それぞれの特徴", "scene": "newFeatures", "notes": ["水星：太陽に最も近い", "金星：厚い雲に覆われ、表面は非常に高温", "地球：表面に液体の水が広く存在", "火星：表面は赤茶色"], "states": [{"reveal": 0}, {"reveal": 1}, {"reveal": 2}, {"reveal": 3}, {"reveal": 4}], "teacher": "導入で見た外観へ戻り、特徴と名前を結び付ける。水星の大気はごく薄い。金星の表面の高温には強い温室効果が関わる。火星の赤は酸化鉄を含む表面。", "caption": "生成画像による外観イメージ／惑星の直径は同じ縮尺ではありません", "kind": "", "group": "inner"}, {"title": "木星型惑星、それぞれの特徴", "scene": "newFeatures", "notes": ["木星：最大の惑星。雲のしま模様", "土星：氷の粒などでできた、目立つ環", "天王星：自転軸が大きく傾いている", "海王星：8惑星の中で最も外側"], "states": [{"reveal": 0}, {"reveal": 1}, {"reveal": 2}, {"reveal": 3}, {"reveal": 4}], "teacher": "木星型は中学での4惑星のまとめ方。巨大惑星は全て環を持つ。天王星の軸は模式表示で、公転方向とは区別。生成画像は観測写真ではない。", "caption": "生成画像による外観イメージ／直径・環・軸は模式的", "kind": "", "group": "outer"}, {"title": "問題", "scene": "newCheck", "notes": ["直径が大きく、平均密度が小さい", "!Aは木星型惑星", "!Bは地球型惑星"], "states": [{}, {}, {}, {}], "teacher": "Aは直径が地球の9.4倍で平均密度0.69、Bは0.95倍で5.24。数値の特徴から分類を答える。名前当ては主目的ではないがA土星・B金星。Aの総質量がBより小さいとは言えない。", "captio
