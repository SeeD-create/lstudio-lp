<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>泥炭地と客土 ── 土を入れかえる｜第19章 北海道地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gl-safe { inset: 70px 120px 74px; align-content: start; gap: 26px; }
  .gl-head { display: grid; gap: 10px; }
  .gl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start; }
  .word { background: var(--paper-hi); border: 3px solid var(--c); border-radius: 22px; padding: 26px 34px; box-shadow: 0 14px 32px rgba(40,30,10,.10); display: grid; gap: 14px; }
  .word .wh { display:flex; align-items:baseline; gap:16px; }
  .word .wh .tg { flex:none; background:var(--c); color:#fff; font-weight:900; font-size:20px; padding:6px 16px; border-radius:999px; }
  .word .wh .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); }
  .word .wb { font-size:27px; line-height:1.55; color:var(--sumi-soft); font-weight:600; }
  .word .wb .imp { color: var(--imp); font-weight:900; }
  .figbox { background: var(--paper-hi); border: 3px solid var(--sumi-mute); border-radius: 20px; padding: 18px 24px; }
  .figbox svg { display:block; width:100%; height:auto; }
  .gl-note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; font-size:26px; line-height:1.45; }
  .gl-note b { color:#fff; }
  .gl-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe gl-safe">
    <div class="gl-head" data-at="0">
      <span class="kicker"><span class="num">語句</span>　まずこの2語</span>
      <h1 class="headline" style="font-size:52px;">米ができない土を、<span class="em">土ごと</span>取りかえた</h1>
    </div>
    <div class="gl-row">
      <div class="word" style="--c:#4A4947" data-at="1" data-anim="pop">
        <div class="wh"><span class="tg">語句①</span><span class="nm">泥炭地</span></div>
        <div class="wb">植物の残がいが炭のようになって積もった土地。<span class="imp">水はけが悪く農業に適さない</span>。</div>
      </div>
      <div class="word" style="--c:#8E5F0B" data-at="2" data-anim="pop">
        <div class="wh"><span class="tg">語句②</span><span class="nm">客土</span></div>
        <div class="wb">植物が育ちにくい土地に<span class="imp">他の土を混ぜて土地を改良する</span>こと。</div>
      </div>
    </div>
    <div class="figbox" data-at="3" data-anim="pop">
      <svg viewBox="0 0 1500 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="1500" height="300" fill="#FBFBFA"/>
        <!-- before -->
        <text x="290" y="34" font-size="26" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">もとの石狩平野（泥炭地）</text>
        <rect x="60" y="60" width="460" height="34" fill="#9FC4DE"/>
        <rect x="60" y="94" width="460" height="120" fill="#5A4A38"/>
        <rect x="60" y="214" width="460" height="46" fill="#8B7B66"/>
        <text x="290" y="86" font-size="21" font-weight="900" fill="#134A72" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">水がたまる（水はけが悪い）</text>
        <text x="290" y="162" font-size="26" font-weight="900" fill="#F2E8D8" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">泥炭（植物の残がい）</text>
        <text x="290" y="245" font-size="20" font-weight="700" fill="#F2E8D8" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">地　　面</text>
        <!-- arrow -->
        <path d="M560,150 L660,150" stroke="#C4161C" stroke-width="9" stroke-linecap="round"/>
        <path d="M690,150 l-32,-19 v38 Z" fill="#C4161C"/>
        <text x="625" y="118" font-size="26" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">客土</text>
        <text x="625" y="196" font-size="19" font-weight="700" fill="#8E2A1E" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">よその土を運んで混ぜる</text>
        <!-- after -->
        <text x="1010" y="34" font-size="26" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">今の石狩平野（水田）</text>
        <rect x="780" y="60" width="460" height="34" fill="#9FC4DE"/>
        <rect x="780" y="94" width="460" height="72" fill="#C8A96A"/>
        <rect x="780" y="166" width="460" height="48" fill="#5A4A38"/>
        <rect x="780" y="214" width="460" height="46" fill="#8B7B66"/>
        <g stroke="#2C7A4A" stroke-width="5" stroke-linecap="round">
          <path d="M840,60 L840,26"/><path d="M900,60 L900,30"/><path d="M960,60 L960,24"/>
          <path d="M1020,60 L1020,30"/><path d="M1080,60 L1080,26"/><path d="M1140,60 L1140,30"/><path d="M1200,60 L1200,26"/>
        </g>
        <text x="1010" y="140" font-size="26" font-weight="900" fill="#4A3A18" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">運んできた土（客土）</text>
        <text x="1010" y="199" font-size="20" font-weight="700" fill="#F2E8D8" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">もとの泥炭</text>
        <text x="1330" y="94" font-size="24" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">稲作ができる</text>
        <text x="1330" y="128" font-size="24" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">土地になった</text>
      </svg>
    </div>
    <div class="gl-note" data-at="4" data-anim="fade"><span>ここが問われる</span><span>「かつて石狩平野の土は農業に適さなかった。何というか」＝<b>泥炭地</b>。<br>「その土を農業に適した土に入れかえることを何というか」＝<b>客土</b>。</span></div>
  </div>
  <div class="seed-foot"><span>第19章 北海道地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
</html>
