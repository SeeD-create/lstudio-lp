      <div class="mp-head" data-at="0">
        <span class="kicker"><span class="num">04</span>　位置と大きさ</span>
        <h1 class="headline" style="font-size:52px;">1つの道が、<span class="em">まるごと1地方</span></h1>
      </div>
      <div class="fx" style="--c:#3A3A39" data-at="1" data-anim="left"><span class="k">よび名</span><span class="v">都道府県で「道」はここだけ<small>北海道地方＝北海道1つで1つの地方。県はない。</small></span></div>
      <div class="fx" style="--c:#8E5F0B" data-at="2" data-anim="left"><span class="k">広さ</span><span class="v">日本の面積の<span class="imp">およそ5分の1</span><small>東北6県ぶんより広い。だから農業も「大規模」になる。</small></span></div>
      <div class="fx" style="--c:#1D4E72" data-at="3" data-anim="left"><span class="k">本州と</span><span class="v">間にあるのは<span class="imp">津軽海峡</span><small>青森県との間。ここを海底トンネルで結んでいる（→あとで出てくる）。</small></span></div>
      <div class="mp-note" data-at="4" data-anim="fade"><span>ここを意識</span><span>広い・寒い・新しく開拓した。この<b>3つが北海道の産業ぜんぶの理由</b>になる。</span></div>
