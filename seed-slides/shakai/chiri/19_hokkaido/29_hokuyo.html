      <div class="mp-head" data-at="0">
        <span class="kicker"><span class="num">ノート2</span>　水産業</span>
        <h1 class="headline" style="font-size:46px;">北の海へ、遠くまで<span class="em">とりに行く</span></h1>
      </div>
      <div class="row" style="--c:#1D4E72" data-at="1" data-anim="left"><span class="n">②</span><span class="b"><span class="h">オホーツク海や北太平洋で行う<span class="blank" data-fill="1"><b>北洋漁業</b></span></span><span class="d">遠くの海まで船で出かけて、さけ・ます・すけとうだらなどをとる</span></span></div>
      <div class="row" style="--c:#C4161C" data-at="2" data-anim="left"><span class="n">①</span><span class="b"><span class="h">その基地となる都市が<span class="blank" data-fill="2"><b>釧路</b></span>市</span><span class="d">北海道で水揚げ量がもっとも多い港。函館・根室・稚内も基地</span></span></div>
      <div class="row" style="--c:#8E2A1E" data-at="3" data-anim="left"><span class="n">③</span><span class="b"><span class="h">1976年以降、排他的経済水域が<span class="blank" data-fill="3"><b>200</b></span>海里に</span><span class="d">外国の海で自由にとれなくなり、<span class="imp">水揚げ量が大きく減った</span></span></span></div>
      <div class="figure mp-fig" data-at="4" data-anim="pop"><img src="assets/hokuyo.webp" alt="北の海へ向かう北洋漁業の漁船"></div>
      <div class="note" data-at="5" data-anim="fade"><span>記述で問われる</span><span>「この港の水揚げ量が減ったのはなぜか」→ <b>各国が排他的経済水域を設定し、外国の近海で自由に漁ができなくなったから。</b></span></div>
