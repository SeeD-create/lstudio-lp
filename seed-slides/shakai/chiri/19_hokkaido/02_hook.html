<title>北海道ってどんな地方？｜第19章 北海道地方</title>

<style>
  .hk-safe { inset: 110px 150px 100px; align-content: center; gap: 46px; }
  .hk-head { display: grid; gap: 14px; }
  .hk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .fact { background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.10); padding: 40px 40px; display: grid; gap: 14px; align-content: start; }
  .fact .fnum { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:72px; line-height:1; color: var(--imp); }
  .fact .fttl { font-size: 34px; font-weight: 900; color: var(--sumi); }
  .fact .fbody { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); }
  .hk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:29px; line-height:1.5; }
  .hk-note b { color: var(--gold-soft); }
  .hk-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　導入</span>
      <h1 class="headline" style="font-size:70px;">北海道は、<span class="em">寒さ</span>と<span class="em">火山灰</span>との勝負だった</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">冷帯</div><div class="fttl">日本でただ1つの冷帯</div><div class="fbody">世界の気候帯で見ると冷帯（亜寒帯）。冬の寒さがたいへんきびしい。そのかわり<b>梅雨がない</b>。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">開拓</div><div class="fttl">明治から切り開いた大地</div><div class="fbody">もとはアイヌ民族の土地。明治時代に屯田兵の村がつくられ、札幌や旭川が生まれた。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">食料</div><div class="fttl">全国1位がずらり</div><div class="fbody">じゃがいも・小麦・たまねぎ・乳牛・肉牛…。日本の食料をささえる大規模農業の地方。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span>この単元のねらい</span><span>北海道は<b>「自然（寒さ・火山灰・泥炭地）→ どう工夫したか → 何が育つか」</b>が1本の線でつながる。工夫を追いかければ、丸暗記しなくても答えが出る。</span></div>
  </div>
  <div class="seed-foot"><span>第19章 北海道地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
