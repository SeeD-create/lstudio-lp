<!DOCTYPE html>
<html lang="ja">
<head>

<title>アイヌ民族 ── もとから住んでいた人々｜第19章 北海道地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sd-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .sd-txt { display: grid; gap: 26px; }
  .sd-fig { height: 560px; border-radius: 28px; border: 3px solid var(--cat); box-shadow: 0 18px 40px rgba(40,30,10,.14); }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 38px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 36px; line-height: 1.75; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 38px; min-width: 260px; }
  .def .em { color: var(--imp); font-weight: 900; }
  .sd-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .sd-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .sd-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .sd-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sd-safe">
    <div class="sd-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート1　北海道の開拓</span>
        <h1 class="headline" style="font-size:50px;margin-top:16px;">北海道に<span class="em">もとから</span>住んでいた人々</h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        もともと北海道には、先住民である<br>
        <span class="blank" data-fill="2"><span class="bnum">⑬</span><b>アイヌ</b></span>民族が住んでいた。
      </div>
      <div class="def" data-at="3" data-anim="fade" style="font-size:30px;line-height:1.6;">
        やがて東北地方などからの<span class="em">移住者</span>が増えだし、<br>今の<span class="em">函館</span>あたりに住むようになった。
      </div>
      <div class="sd-note" data-at="4" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb">「北海道にもとから住んでいた人たちを何というか」を答える。<br>独自の言語と文化をもち、地名にもその言葉が多く残っている。</span>
      </div>
    </div>
    <div class="figure sd-fig" data-at="0" data-anim="right"><img src="assets/ainu.webp" alt="北海道の先住民・アイヌ民族 ── 独自の言葉と文化をもつ人々"></div>
  </div>
  <div class="seed-foot"><span>第19章 北海道地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
