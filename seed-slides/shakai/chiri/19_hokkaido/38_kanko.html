  .kn-safe { inset: 80px 130px 84px; grid-template-columns: 1fr 520px; align-content: center; gap: 52px; align-items: center; }

  .kn-fig { height: 520px; border-radius: 28px; border: 3px solid var(--cat); box-shadow: 0 18px 40px rgba(40,30,10,.14); }

  .row .b .d { font-size:21px; line-height:1.45; color:var(--sumi-mute); font-weight:600; }
  .row .b .d .imp { color: var(--imp); }
  .note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 28px; font-size:24px; line-height:1.45; }

  .note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }

<div class="seed-stage"><div class="seed-slide" data-cat="new">

      </div>
      <div class="row" style="--c:#4A4947" data-at="1" data-anim="left"><span class="n">下地</span><span class="b"><span class="h">火山・湖・温泉が多く、冬は各地で<span class="imp">スキー</span>ができる</span><span class="d">流氷やラベンダーなど、季節ごとの見どころも多い</span></span></div>
