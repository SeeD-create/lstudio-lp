      <div class="mp-head" data-at="0">
        <span class="kicker"><span class="num">練習問題</span>　農業地域</span>
        <h1 class="headline" style="font-size:42px;">説明から<span class="em">ⓐ〜ⓓ</span>を当てられるか</h1>
      </div>
      <div class="q" style="--c:#8E5F0B" data-at="1" data-anim="left">
        <div class="qh">①かつては<span class="imp">泥炭地</span>だったが、<span class="imp">客土</span>によって土を入れかえ、米づくりが盛んになった地域。</div>
        <div class="qa"><span class="lt">ⓐ</span><span class="blank" data-fill="1"><b>石狩平野</b></span></div>
      </div>
      <div class="q" style="--c:#1D4E72" data-at="2" data-anim="left">
        <div class="qh">②<span class="imp">品種改良</span>により寒さに強い品種が作られ、稲作が盛んになった内陸の盆地。中心都市は旭川市。</div>
        <div class="qa"><span class="lt">ⓑ</span><span class="blank" data-fill="2"><b>上川盆地</b></span></div>
      </div>
      <div class="q" style="--c:#7A4E14" data-at="3" data-anim="left">
        <div class="qh">③<span class="imp">火山灰地</span>が広がり、北海道の畑作の中心となっている地域。ちがう作物を順番に作る<span class="imp">輪作</span>を行う。</div>
        <div class="qa"><span class="lt">ⓒ</span><span class="blank" data-fill="3"><b>十勝平野</b></span></div>
      </div>
      <div class="q" style="--c:#2C6B27" data-at="4" data-anim="left">
        <div class="qh">④夏でも<span class="imp">濃霧</span>ですずしく、乳牛を飼う<span class="imp">酪農</span>が盛んな台地。</div>
        <div class="qa"><span class="lt">ⓓ</span><span class="blank" data-fill="4"><b>根釧台地</b></span></div>
      </div>
      <div class="q" style="--c:#C4161C" data-at="5" data-anim="left">
        <div class="qh">⑤北海道が全国の<span class="imp">約80％</span>を生産するいもをＡ、<span class="imp">約65％</span>を生産するパンの原料をＢとする。それぞれ何か。</div>
        <div class="qa"><span class="lt">Ａ</span><span class="blank" data-fill="5"><b>じゃがいも</b></span><span class="lt">Ｂ</span><span class="blank" data-fill="5"><b>小麦</b></span></div>
      </div>
