<!DOCTYPE html>

<head>

<title>北海道の開拓 ── 開拓使と屯田兵｜第19章 北海道地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sd-safe { inset: 80px 130px 80px; grid-template-columns: 1fr 520px; align-content: center; gap: 52px; align-items: center; }
  .sd-txt { display: grid; gap: 22px; }
  .sd-fig { height: 520px; border-radius: 28px; border: 3px solid var(--cat); box-shadow: 0 18px 40px rgba(40,30,10,.14); }
  .row { display:flex; align-items:flex-start; gap:20px; background: var(--paper-hi); border-left: 9px solid var(--c); border-radius: 0 16px 16px 0; padding: 22px 28px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .row .n { flex:none; width:52px; height:52px; border-radius:50%; background:var(--c); color:#fff; font-weight:900; font-size:22px; display:flex; align-items:center; justify-content:center; }
  .row .b { display:grid; gap:6px; }
  .row .b .h { font-size:30px; font-weight:900; color:var(--sumi); line-height:1.35; }
  .row .b .h .blank { font-size:32px; min-width:240px; }
  .row .b .d { font-size:22px; line-height:1.45; color:var(--sumi-mute); font-weight:600; }
  .row .b .d .imp { color: var(--imp); }
  .note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 28px; font-size:24px; line-height:1.45; }
  .note b { color:#fff; }
  .note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sd-safe">
    <div class="sd-txt">
      <div data-at="0">
        <span class="kicker"><span class="num">ノート1</span>　北海道の開拓</span>
        <h1 class="headline" style="font-size:52px;margin-top:12px;">明治時代、<span class="em">村ごと</span>つくって開拓した</h1>
      </div>
      <div class="row" style="--c:#4A4947" data-at="1" data-anim="left"><span class="n">役所</span><span class="b"><span class="h">明治政府は開拓の役所<span class="imp">開拓使</span>を置いた</span><span class="d">札幌に置かれ、道路・鉄道・農場づくりを進めた（発展）</span></span></div>
      <div class="row" style="--c:#8E5F0B" data-at="2" data-anim="left"><span class="n">⑭</span><span class="b"><span class="h">開拓のために<span class="blank" data-fill="3"><b>屯田兵</b></span>村が各地に作られた</span><span class="d"><span class="imp">北方の警備</span>と<span class="imp">農村の開拓</span>を兼ねた人たちの村</span></span></div>
      <div class="row" style="--c:#1D4E72" data-at="4" data-anim="left"><span class="n">都市</span><span class="b"><span class="h">そして<span class="imp">札幌</span>や<span class="imp">旭川</span>などの都市が作られた</span><span class="d">碁盤の目のような区画は開拓のときにつくられたもの</span></span></div>
      <div class="note" data-at="5" data-anim="fade"><span>★ テスト頻出</span><span>「明治時代に<b>北方の警備と農村の開拓</b>のために作られた村」を答える。<br>先住民→移住者→開拓の兵→札幌・旭川、の順番でおさえる。</span></div>
    </div>
    <div class="figure sd-fig" data-at="0" data-anim="right"><img src="assets/tonden.webp" alt="雪原を切りひらく屯田兵 ── 警備をしながら畑をつくった"></div>
  </div>
  <div class="seed-foot"><span>第19章 北海道地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
