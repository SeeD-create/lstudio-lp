<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .std-safe{inset:86px 118px 96px;align-content:start;gap:28px}
  .std-head{display:grid;gap:12px}
  .h2{font-size:60px}.h3{font-size:52px}.h4{font-size:44px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .card{position:relative;background:var(--paper-hi);border-radius:22px;border:3px solid var(--c,var(--cat));box-shadow:0 14px 32px rgba(40,30,10,.10);padding:28px 30px 26px;display:grid;gap:12px;align-content:start;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;right:0;height:10px;background:var(--c,var(--cat))}
  .card .cn{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:28px;color:var(--c,var(--cat));opacity:.65;line-height:1}
  .card .ct{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:34px;color:var(--sumi);line-height:1.2}
  .card .cb{font-size:25px;line-height:1.5;color:var(--sumi-soft)}
  .card .cb b{color:var(--sumi)}
  .rowl{display:flex;align-items:center;gap:20px;background:var(--paper-hi);border-left:9px solid var(--c,var(--cat));border-radius:0 14px 14px 0;padding:16px 24px;box-shadow:0 8px 20px rgba(40,30,10,.07)}
  .rowl .rt{flex:none;font-weight:900;color:var(--sumi);font-size:28px;white-space:nowrap}
  .rowl .rb{color:var(--sumi-soft);font-size:24px;line-height:1.35}
  .rowl .chip{flex:none;width:34px;height:34px;border-radius:8px;background:var(--c,var(--cat));border:2px solid rgba(0,0,0,.18)}
  .note{display:flex;align-items:center;gap:24px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:20px 32px;font-size:27px;line-height:1.45}
  .note .nt{flex:none;font-family:'Zen Old Mincho',serif;font-weight:900;font-size:25px;color:var(--gold-soft);letter-spacing:.08em;white-space:nowrap}
  .note b{color:#fff}
  .figbox{background:#fff;border:3px solid var(--sumi);border-radius:20px;box-shadow:0 14px 34px rgba(40,30,10,.12);padding:14px 16px}
  .figbox svg{display:block;width:100%;height:auto}
  .mapbox{background:#E4EEF5;border:3px solid var(--sumi);border-radius:20px;box-shadow:0 14px 34px rgba(40,30,10,.12);padding:10px}
  .mapbox svg{display:block;width:100%;height:auto}
  .hint{font-size:23px;color:var(--sumi-mute);line-height:1.4}
  .star{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:999px;background:var(--imp);color:#fff;font-weight:900;font-size:22px;letter-spacing:.06em}
  .yeartag{display:inline-flex;padding:5px 14px;border-radius:8px;background:var(--paper-lo);color:var(--sumi-soft);font-weight:900;font-size:21px}
  .chk-safe{align-content:center;gap:38px;justify-items:center}
  .qcard{width:1520px;background:var(--sumi);color:var(--paper-hi);border-radius:28px;padding:46px 58px;box-shadow:0 22px 50px rgba(40,30,10,.22)}
  .qcard .qlabel{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:30px;color:var(--gold-soft);letter-spacing:.1em}
  .qcard .qtext{font-size:44px;line-height:1.5;font-weight:700;margin-top:16px}
  .qcard .qtext .u{color:var(--gold-soft);border-bottom:4px solid var(--gold-deep)}
  .ans{margin-top:32px;display:flex;align-items:center;gap:26px}
  .ans .mark{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:86px;line-height:1;color:#fff}
  .ans .exp{font-size:31px;line-height:1.45;color:rgba(251,246,236,.92)}
  .ans .exp b{color:var(--gold-soft)}
  .qrow{display:flex;align-items:center;gap:24px;background:var(--sumi);color:var(--paper-hi);border-radius:18px;padding:20px 30px}
  .qrow .qn{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gold-soft);color:var(--sumi);font-family:'Zen Old Mincho',serif;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center}
  .qrow .qq{flex:1;font-size:28px;font-weight:700;line-height:1.4}
  .qrow .qq .u{color:var(--gold-soft)}
  .qrow .qa{flex:none;display:flex;align-items:center;gap:14px;min-width:280px;justify-content:flex-end}
  .qrow .qa .mk{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:50px;line-height:1;color:#fff}
  .qrow .qa .fix{font-size:23px;color:var(--gold-soft);font-weight:900;max-width:250px;line-height:1.3;text-align:right}
.sa-safe{inset:92px 130px 96px;align-content:center;gap:32px}
    .fill-line{background:var(--paper-hi);border-left:10px solid #2E8B57;border-radius:0 16px 16px 0;padding:26px 34px;font-size:33px;line-height:1.55;color:var(--sumi);box-shadow:0 10px 26px rgba(40,30,10,.08)}
    .en{background:var(--paper-hi);border:3px solid #2E8B57;border-radius:18px;padding:24px 12px;text-align:center;box-shadow:0 12px 26px rgba(40,30,10,.09)}
    .en .en1{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:34px;color:var(--sumi)}
    .en .en2{font-size:21px;color:var(--sumi-mute);font-weight:900;margin-top:6px}</style>
</head>
