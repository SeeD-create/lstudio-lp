<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>経度 ── 本初子午線を0度に、経線で東西をはかる｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kd-safe { inset: 80px 130px 80px; grid-template-columns: 500px 1fr; align-content: center; gap: 56px; align-items: center; }
  .kd-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:24px; display:grid; justify-items:center; gap:10px; }
  .kd-fig svg { width:420px; height:420px; }
  .kd-fig .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); }
  .kd-txt { display:grid; gap:16px; }
  .kd-head { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:16px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .row .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); text-align:center; line-height:1.15; }
  .row .tx { font-size:26px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .row .tx .blank { font-size:28px; min-width:120px; }
  .row.hot { border-color:var(--imp); } .row.hot .yr { color:var(--imp); }
  .kd-note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:16px 28px; font-size:24px; line-height:1.5; }
  .kd-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe kd-safe">
    <div class="kd-fig" data-at="1" data-anim="left">
      <svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
        <circle cx="210" cy="210" r="180" fill="#EAF2F8" stroke="#2c6489" stroke-width="4"/>
        <g stroke="#7a9ab0" stroke-width="1.8" fill="none">
          <path d="M210,30 Q40,210 210,390"/>
          <path d="M210,30 Q115,210 210,390"/>
          <path d="M210,30 Q305,210 210,390"/>
          <path d="M210,30 Q380,210 210,390"/>
        </g>
        <path d="M30,210 h360" stroke="#8aa" stroke-width="1.4"/>
        <!-- 0°の線（答えは①〜④の凡例で） -->
        <line x1="210" y1="30" x2="210" y2="390" stroke="#C4161C" stroke-width="4"/>
        <circle cx="210" cy="150" r="6" fill="#C4161C"/>
        <text x="222" y="146" font-size="17" font-weight="900" fill="#C4161C">ロンドン</text>
        <line x1="210" y1="336" x2="132" y2="390" stroke="#C4161C" stroke-width="1.6"/>
        <text x="126" y="398" text-anchor="end" font-size="18" font-weight="900" fill="#C4161C">② 0°</text>
        <!-- ①＝たての線を指す -->
        <circle cx="170" cy="138" r="5" fill="#4a6d85"/>
        <line x1="170" y1="138" x2="76" y2="72" stroke="#4a6d85" stroke-width="1.6"/>
        <text x="72" y="70" text-anchor="end" font-size="20" font-weight="900" fill="#4a6d85">①</text>
        <text x="210" y="20" text-anchor="middle" font-size="15" font-weight="800" fill="#2c6489">北極</text>
        <text x="210" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="#2c6489">南極</text>
        <text x="300" y="255" text-anchor="middle" font-size="22" font-weight="900" fill="#2f6a2f">③</text>
        <text x="120" y="255" text-anchor="middle" font-size="22" font-weight="900" fill="#8a52a0">④</text>
      </svg>
      <div class="kd-fig cap" style="border:none;box-shadow:none;padding:0;">①〜④の名前を答えよう</div>
    </div>
    <div class="kd-txt">
      <div class="kd-head" data-at="0">
        <span class="kicker"><span class="num">Ⅴ-2</span>　経度</span>
        <h1 class="headline" style="font-size:46px;"><span class="em">東西</span>の位置は経度ではかる</h1>
      </div>
      <div class="row" data-at="2" data-anim="left"><span class="yr">縦の線</span><span class="tx">北極と南極を結ぶ縦の線＝<span class="blank" data-fill="2"><span class="bnum">①</span><b>経線</b></span></span></div>
      <div class="row hot" data-at="3" data-anim="left"><span class="yr">0°の線</span><span class="tx">経度0°の線＝<span class="blank" data-fill="3"><span class="bnum">②</span><b>本初子午線</b></span>（ロンドンを通る）</span></div>
      <div class="row" data-at="4" data-anim="left"><span class="yr">東と西</span><span class="tx">0°より東は<span class="blank" data-fill="4"><span class="bnum">③</span><b>東経</b></span>、西は<span class="blank" data-fill="4"><span class="bnum">④</span><b>西経</b></span>（各0〜180°）</span></div>
      <div class="kd-note" data-at="5"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">セット</span><span>緯度＝<b>赤道</b>が0°、経度＝<b>②の線</b>が0°。この2つの基準線が全ての出発点。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
