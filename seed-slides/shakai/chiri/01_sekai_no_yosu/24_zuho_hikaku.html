<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2つの図法をくらべる ── どちらがどんな用途か｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hk-safe { inset: 80px 130px 80px; align-content: center; gap: 26px; }
  .hk-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .cmp { display:grid; grid-template-columns:230px 1fr 1fr; gap:0; border:3px solid var(--sumi); border-radius:20px; overflow:hidden; box-shadow:0 16px 36px rgba(40,30,10,.12); }
  .cmp > div { padding:20px 26px; border-bottom:2px solid var(--hair); }
  .cmp .hcell { background:var(--sumi); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; text-align:center; border-bottom:none; }
  .cmp .hcell small { display:block; font-size:20px; color:var(--gold-soft); font-weight:700; }
  .cmp .rlabel { background:var(--paper-lo); font-weight:900; font-size:25px; color:var(--sumi); display:flex; align-items:center; }
  .cmp .cell { font-size:26px; font-weight:700; color:var(--sumi); line-height:1.4; display:flex; align-items:center; }
  .cmp .cell b { color:var(--imp); }
  .cmp .cell .blank { min-width:70px; padding:0 8px 2px; margin:0 4px; }
  .cmp .col-a { background:#FBF3F0; }
  .cmp .r0 { border-bottom:none; }
  .use-row { display:grid; grid-template-columns:repeat(2,1fr); gap:30px; }
  .use { display:grid; gap:10px; }
  .use .ufig { height:300px; border-radius:20px; border:3px solid var(--sumi); }
  .use .ulab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--sumi); text-align:center; }
  .use .ulab b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-4</span>　2つの図法くらべ</span>
      <h1 class="headline" style="font-size:46px;">用途で選ぶ ── <span class="em">2つの図法</span>は何が正しくて、何に使うのか</h1>
    </div>
    <div class="cmp">
      <div class="hcell" data-at="1">くらべる</div>
      <div class="hcell col-a" data-at="1">正距方位図法<small>まる い 図（中心が東京）</small></div>
      <div class="hcell" data-at="1">メルカトル図法<small>四角い 方眼の 図</small></div>

      <div class="rlabel" data-at="2">正しいもの</div>
      <div class="cell col-a" data-at="2">中心からの<span class="blank" data-fill="2"><b>距離と方位</b></span></div>
      <div class="cell" data-at="2">経線との<span class="blank" data-fill="2"><b>角度</b></span></div>

      <div class="rlabel" data-at="3">ゆがみ</div>
      <div class="cell col-a" data-at="3">外側ほど形・面積がゆがむ</div>
      <div class="cell" data-at="3">高緯度ほど面積が拡大</div>

      <div class="rlabel r0" data-at="4">おもな用途</div>
      <div class="cell col-a r0" data-at="4"><span class="blank" data-fill="4"><b>航空機</b></span>の航路（航空図）</div>
      <div class="cell r0" data-at="4"><span class="blank" data-fill="4"><b>航海</b></span>（船の地図）</div>
    </div>
    <div class="use-row">
      <div class="use" data-at="4" data-anim="left">
        <div class="figure ufig"><img src="assets/koukuuki.webp" alt="空を飛ぶ旅客機 ── 航空図には正距方位図法"></div>
        <div class="ulab">空をとぶ → <b>正距方位図法</b></div>
      </div>
      <div class="use" data-at="4" data-anim="right">
        <div class="figure ufig"><img src="assets/koukaisen.webp" alt="海をゆく大型船 ── 航海図にはメルカトル図法"></div>
        <div class="ulab">海をゆく → <b>メルカトル図法</b></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
