<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>面積の小さい国とバチカン市国・人口の多い国トップ3｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sj-safe { inset: 84px 130px 84px; grid-template-columns: 640px 1fr; align-content: center; gap: 50px; align-items: center; }
  .panel { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:34px 40px; box-shadow:0 14px 30px rgba(40,30,10,.10); display:grid; gap:18px; }
  .panel .ph { display:flex; align-items:center; gap:14px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--cat); }
  .small-big { display:grid; justify-items:center; gap:14px; text-align:center; }
  .small-big .sbfig { width:100%; height:340px; border-radius:18px; border:3px solid var(--cat); }
  .small-big .nm { font-size:34px; font-weight:900; color:var(--sumi); }
  .small-big .nm .blank { font-size:38px; min-width:230px; }
  .small-big .sub { font-size:24px; color:var(--sumi-soft); font-weight:600; line-height:1.45; }
  .jrow { display:grid; grid-template-columns:60px 1fr auto; gap:20px; align-items:center; background:var(--paper-hi); border-left:8px solid var(--cat); border-radius:0 14px 14px 0; padding:16px 24px; box-shadow:0 8px 18px rgba(40,30,10,.06); }
  .jrow .rk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--cat); text-align:center; }
  .jrow .jn { font-size:34px; font-weight:900; color:var(--sumi); }
  .jrow .jn .blank { font-size:36px; min-width:180px; }
  .jrow .jp { font-size:26px; font-weight:800; color:var(--sumi-mute); }
  .sj-txt { display:grid; gap:16px; }
  .sj-head { display:grid; gap:10px; }
  .sj-cap { font-size:24px; color:var(--sumi-soft); font-weight:700; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sj-safe">
    <div class="panel" data-at="1" data-anim="left">
      <div class="ph">世界でいちばん小さい国</div>
      <div class="small-big">
        <div class="figure sbfig"><img src="assets/vatican.webp" alt="バチカン市国 ── 大きなドームの聖堂と円形の広場"></div>
        <div class="nm"><span class="blank" data-fill="1"><b>バチカン市国</b></span></div>
        <div class="sub">イタリアの首都<b>ローマ</b>市内にある、世界最小の国</div>
      </div>
    </div>
    <div class="sj-txt">
      <div class="sj-head" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-2</span>　小さい国・多い人口</span>
        <h1 class="headline" style="font-size:46px;"><span class="em">最小の国</span>と、<span class="em">人口</span>の多い国</h1>
      </div>
      <div class="sj-cap" data-at="2">人口の多い国 トップ3（2024年・世界の人口は約77.1億人）</div>
      <div class="jrow" data-at="2" data-anim="left"><span class="rk">1</span><span class="jn"><span class="blank" data-fill="2"><b>中国</b></span></span><span class="jp">約14.3億人</span></div>
      <div class="jrow" data-at="3" data-anim="left"><span class="rk">2</span><span class="jn"><span class="blank" data-fill="3"><b>インド</b></span></span><span class="jp">約14.3億人</span></div>
      <div class="jrow" data-at="4" data-anim="left"><span class="rk">3</span><span class="jn"><span class="blank" data-fill="4"><b>アメリカ</b></span></span><span class="jp">約3.4億人</span></div>
      <div class="sj-cap" data-at="5" style="color:var(--imp);font-weight:900;">1位と2位がほぼ並ぶ2強。3位の国とは大きく差がある。</div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
