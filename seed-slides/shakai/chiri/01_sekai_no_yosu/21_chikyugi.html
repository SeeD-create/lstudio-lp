<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地球儀 ── すべて正しいが、平面には表せない｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cg-safe { inset: 84px 130px 84px; grid-template-columns: 560px 1fr; align-content: center; gap: 60px; align-items: center; }
  .cg-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:28px; display:grid; justify-items:center; gap:12px; }
  .cg-fig .cgimg { width:100%; height:440px; border-radius:18px; border:2px solid var(--hair); }
  .cg-fig .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .cg-txt { display:grid; gap:20px; }
  .cg-head { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:22px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:20px 28px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .row .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); text-align:center; line-height:1.15; }
  .row .tx { font-size:28px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .row .tx .blank { font-size:30px; min-width:150px; }
  .row.imp-row { border-color:var(--imp); }
  .row.imp-row .yr { color:var(--imp); }
  .cg-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 30px; font-size:25px; line-height:1.5; }
  .cg-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe cg-safe">
    <div class="cg-fig" data-at="0" data-anim="left">
      <div class="figure cgimg"><img src="assets/chikyugi.webp" alt="地球儀 ── 台にのった地球の模型"></div>
      <div class="cap">地球の模型</div>
    </div>
    <div class="cg-txt">
      <div class="cg-head" data-at="0">
        <span class="kicker"><span class="num">Ⅳ-1</span>　まずはこれ</span>
        <h1 class="headline" style="font-size:48px;">まずは<span class="em">地球の模型</span>を知る</h1>
      </div>
      <div class="row" data-at="1" data-anim="left"><span class="yr">正体</span><span class="tx"><span class="blank" data-fill="1"><span class="bnum">①</span><b>地球儀</b></span>＝地球をそのまま小さくした模型。</span></div>
      <div class="row" data-at="2" data-anim="left"><span class="yr">長所</span><span class="tx">距離・面積・方位・形などが<b>すべて正しい</b>。</span></div>
      <div class="row imp-row" data-at="3" data-anim="left"><span class="yr">短所</span><span class="tx">丸いので<span class="blank" data-fill="2"><span class="bnum">②</span><b>平面</b></span>には表せない（持ち運びや比較に不便）。</span></div>
      <div class="cg-note" data-at="4"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">だから</span><span>目的（距離・方位・角度…）に合わせて、<b>いろいろな地図（図法）</b>を使い分ける。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
