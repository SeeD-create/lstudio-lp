<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>この単元とは ── 大陸と海・国・地図・緯度と経度｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tw-safe { inset: 96px 130px 92px; align-content: center; gap: 40px; }
  .tw-head { display: grid; gap: 14px; }
  .tw-lead { font-size: 38px; line-height: 1.55; color: var(--sumi-soft); font-weight: 500; max-width: 1560px; }
  .tw-lead .em { color: var(--imp); font-weight: 900; }
  .flow { display:flex; align-items:stretch; gap: 16px; }
  .fstep { flex:1; background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:24px 20px; display:grid; gap:8px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .fstep .fn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); }
  .fstep .ft { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:33px; color:var(--sumi); line-height:1.15; }
  .fstep .fd { font-size:21px; color:var(--sumi-soft); line-height:1.4; font-weight:500; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　この単元とは</span>
      <h1 class="headline" style="font-size:64px;">地球を<span class="em">5枚のカード</span>でつかむ</h1>
    </div>
    <p class="tw-lead" data-at="1">まず<span class="em">大陸と海</span>で地球全体をつかみ、それを<span class="em">6つの州</span>に分ける。次にその中の<span class="em">国々</span>を面積・人口で見て、丸い地球を平面にうつす<span class="em">地図（図法）</span>を学ぶ。最後に、地球上の位置を数字で表す<span class="em">緯度と経度</span>まで。</p>
    <div class="flow">
      <div class="fstep" data-at="2" data-anim="pop"><div class="fn">CARD Ⅰ</div><div class="ft">大陸と海</div><div class="fd">6つの大陸・3つの海洋・地球の数字</div></div>
      <div class="fstep" data-at="2" data-anim="pop"><div class="fn">CARD Ⅱ</div><div class="ft">地域区分</div><div class="fd">世界を6つの州に分ける</div></div>
      <div class="fstep" data-at="3" data-anim="pop"><div class="fn">CARD Ⅲ</div><div class="ft">いろいろな国</div><div class="fd">面積・人口・内陸国と島国・国の数</div></div>
      <div class="fstep" data-at="3" data-anim="pop"><div class="fn">CARD Ⅳ</div><div class="ft">いろいろな地図</div><div class="fd">地球儀・正距方位図法・メルカトル図法</div></div>
      <div class="fstep" data-at="3" data-anim="pop"><div class="fn">CARD Ⅴ</div><div class="ft">緯度と経度</div><div class="fd">赤道・本初子午線・緯線と経線</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
