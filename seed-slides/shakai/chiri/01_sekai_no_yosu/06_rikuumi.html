<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>陸と海 ── 6つの大陸と3つの海洋、海：陸＝7：3｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ru-safe { inset: 84px 130px 84px; grid-template-columns: 1fr 620px; align-content: center; gap: 60px; align-items: center; }
  .ru-txt { display: grid; gap: 22px; }
  .ru-head { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:22px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:20px 28px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .row .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); text-align:center; line-height:1.15; }
  .row .tx { font-size:29px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .row .tx .blank { font-size:31px; min-width:150px; }
  .ru-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; font-size:26px; line-height:1.5; }
  .ru-note b { color:var(--gold-soft); }
  .ru-right { display:grid; gap:22px; align-content:center; }
  .ru-fig { height:300px; border-radius:22px; border:3px solid var(--sumi); box-shadow:0 16px 38px rgba(40,30,10,.12); }
  .pie { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:26px; display:grid; gap:14px; justify-items:center; }
  .pie svg { width:100%; max-width:420px; height:auto; display:block; }
  .pie .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .pie .cap b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ru-safe">
    <div class="ru-txt">
      <div class="ru-head" data-at="0">
        <span class="kicker"><span class="num">Ⅰ-1</span>　陸と海</span>
        <h1 class="headline" style="font-size:52px;">地球は<span class="em">陸</span>と<span class="em">海</span>でできている</h1>
      </div>
      <div class="row" data-at="1" data-anim="left">
        <span class="yr">陸地</span>
        <span class="tx">大きな陸地＝大陸は全部で<span class="blank" data-fill="1"><span class="bnum">①</span><b>6</b></span>つ（六大陸）。</span>
      </div>
      <div class="row" data-at="2" data-anim="left">
        <span class="yr">海</span>
        <span class="tx">大きな海＝海洋は全部で<span class="blank" data-fill="2"><span class="bnum">②</span><b>3</b></span>つ（三大洋）。</span>
      </div>
      <div class="ru-note" data-at="3"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">割合</span><span>地球の表面は<b>海のほうが広い</b>。海：陸の割合はおよそ<b style="color:#ff8a8f;">7：3</b>。</span></div>
    </div>
    <div class="ru-right">
    <div class="figure ru-fig" data-at="0" data-anim="right"><img src="assets/riku_umi.webp" alt="海と陸のさかい目 ── 上空から見た海岸線"></div>
    <div class="pie" data-at="4" data-anim="right">
      <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <!-- 海 70% -->
        <path d="M160,160 L160,20 A140,140 0 1,1 46.5,226 Z" fill="#5B9BD5" stroke="#2c6489" stroke-width="3"/>
        <!-- 陸 30% -->
        <path d="M160,160 L46.5,226 A140,140 0 0,1 160,20 Z" fill="#8FB86B" stroke="#4f7a2e" stroke-width="3"/>
        <text x="205" y="150" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="30" fill="#fff">海</text>
        <text x="205" y="185" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="24" fill="#fff">7</text>
        <text x="96" y="150" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="26" fill="#fff">陸</text>
        <text x="96" y="182" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#fff">3</text>
      </svg>
      <div class="cap">海：陸 ＝ <b>7：3</b></div>
    </div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
