<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>数字カード早見 ── 世界の様子で覚える数字｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nz-safe { inset: 84px 130px 84px; align-content: center; gap: 34px; }
  .nz-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .nc { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; padding:30px 28px; display:grid; gap:10px; justify-items:center; text-align:center; box-shadow:0 14px 30px rgba(40,30,10,.10); min-height:210px; align-content:center; }
  .nc .nl { font-size:28px; font-weight:800; color:var(--sumi-soft); }
  .nc .nv { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; color:var(--imp); line-height:1; }
  .nc .nv small { font-size:30px; }
  .nc .ns { font-size:22px; color:var(--sumi-mute); font-weight:600; }
  .nc .nv .blank { min-width:80px; padding:0 10px 2px; margin:0 4px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe nz-safe">
    <div class="nz-head" data-at="0">
      <span class="kicker"><span class="num">早見</span>　数字カード</span>
      <h1 class="headline" style="font-size:54px;">この章の<span class="em">数字</span>を、まとめて暗記</h1>
    </div>
    <div class="grid">
      <div class="nc" data-at="1" data-anim="pop"><div class="nl">大陸と海洋の数</div><div class="nv"><span class="blank" data-fill="1"><b>6</b></span><small>大陸</small>／<span class="blank" data-fill="1"><b>3</b></span><small>大洋</small></div><div class="ns">陸のかたまりと海の数</div></div>
      <div class="nc" data-at="2" data-anim="pop"><div class="nl">地球一周</div><div class="nv">約<span class="blank" data-fill="2"><b>4万</b></span><small>km</small></div><div class="ns">まわりの長さ</div></div>
      <div class="nc" data-at="3" data-anim="pop"><div class="nl">表面積</div><div class="nv">約<span class="blank" data-fill="3"><b>5.1億</b></span><small>km²</small></div></div>
      <div class="nc" data-at="4" data-anim="pop"><div class="nl">半径</div><div class="nv">約<span class="blank" data-fill="4"><b>6400</b></span><small>km</small></div></div>
      <div class="nc" data-at="5" data-anim="pop"><div class="nl">海：陸の割合</div><div class="nv"><span class="blank" data-fill="5"><b>7：3</b></span></div><div class="ns">海のほうが広い</div></div>
      <div class="nc" data-at="5" data-anim="pop"><div class="nl">世界の国の数</div><div class="nv">約<span class="blank" data-fill="5"><b>197</b></span><small>か国</small></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
