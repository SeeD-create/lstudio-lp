<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地球の数字 ── 一周4万km・表面積5.1億km²・半径6400km｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .dt-safe { inset: 84px 130px 84px; align-content: center; gap: 34px; }
  .dt-head { display:grid; gap:10px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:26px; }
  .dc { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:30px 40px; display:grid; grid-template-columns:96px 1fr; gap:26px; align-items:center; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .dc .ic { width:96px; height:96px; }
  .dc .dd { display:grid; gap:6px; }
  .dc .dl { font-size:28px; font-weight:800; color:var(--sumi-soft); }
  .dc .dv { font-size:40px; font-weight:900; color:var(--sumi); }
  .dc .dv .blank { font-size:44px; min-width:180px; }
  .dt-note .blank { min-width:60px; padding:0 10px 2px; margin:0 4px; }
  .dt-note .blank b { color:var(--imp); font-family:inherit; }
  .dt-note { display:flex; align-items:center; gap:20px; background:var(--paper-hi); color:var(--sumi); border:3px solid var(--sumi); border-radius:16px; padding:17px 31px; font-size:26px; line-height:1.5; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .dt-note b { color:var(--sumi); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe dt-safe">
    <div class="dt-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-4</span>　地球の数字</span>
      <h1 class="headline" style="font-size:52px;">地球の大きさを<span class="em">数字</span>でおさえる</h1>
    </div>
    <div class="grid">
      <div class="dc" data-at="1" data-anim="pop">
        <svg class="ic" viewBox="0 0 96 96"><circle cx="48" cy="48" r="34" fill="none" stroke="#4a4a48" stroke-width="4"/><path d="M20,48 a28,10 0 0,0 56,0" fill="none" stroke="#C4161C" stroke-width="4"/><path d="M14,48 h68" stroke="#8a8a88" stroke-width="2"/></svg>
        <div class="dd"><div class="dl">地球一周（まわりの長さ）</div><div class="dv">約 <span class="blank" data-fill="1"><span class="bnum">①</span><b>4万</b></span> km</div></div>
      </div>
      <div class="dc" data-at="2" data-anim="pop">
        <svg class="ic" viewBox="0 0 96 96"><circle cx="48" cy="48" r="34" fill="#CFE0EC" stroke="#4a4a48" stroke-width="4"/><path d="M28,36 q14,-6 26,2 q10,6 6,16 q-16,6 -26,-2 q-10,-8 -6,-16 Z" fill="#8FB86B"/></svg>
        <div class="dd"><div class="dl">表面積</div><div class="dv">約 <span class="blank" data-fill="2"><span class="bnum">②</span><b>5.1億</b></span> km²</div></div>
      </div>
      <div class="dc" data-at="3" data-anim="pop">
        <svg class="ic" viewBox="0 0 96 96"><circle cx="48" cy="48" r="34" fill="none" stroke="#4a4a48" stroke-width="4"/><line x1="48" y1="48" x2="82" y2="48" stroke="#C4161C" stroke-width="4"/><circle cx="48" cy="48" r="4" fill="#C4161C"/></svg>
        <div class="dd"><div class="dl">半径</div><div class="dv">約 <span class="blank" data-fill="3"><span class="bnum">③</span><b>6400</b></span> km</div></div>
      </div>
      <div class="dc" data-at="4" data-anim="pop">
        <svg class="ic" viewBox="0 0 96 96"><g fill="#6b6a67"><circle cx="34" cy="34" r="12"/><circle cx="62" cy="34" r="12"/><path d="M18,72 a16,18 0 0,1 32,0 Z"/><path d="M46,72 a16,18 0 0,1 32,0 Z"/></g></svg>
        <div class="dd"><div class="dl">人口（2024年）</div><div class="dv">約 <span class="blank" data-fill="4"><span class="bnum">④</span><b>77.1億</b></span> 人</div></div>
      </div>
    </div>
    <div class="dt-note" data-at="5"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--imp);white-space:nowrap;">セット暗記</span><span>一周<span class="blank" data-fill="5"><b>4万km</b></span>・表面積<span class="blank" data-fill="5"><b>5.1億km²</b></span>・半径<span class="blank" data-fill="5"><b>6400km</b></span>。海：陸＝<span class="blank" data-fill="5"><b>7：3</b></span>。この4つは頻出。</span></div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
