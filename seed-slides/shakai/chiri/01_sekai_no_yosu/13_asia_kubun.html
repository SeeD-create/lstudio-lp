<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アジア州の区分 ── 東・東南・南・西アジア｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ak-safe { inset: 84px 130px 84px; align-content: center; gap: 32px; }
  .ak-head { display:grid; gap:10px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
  .ac { background:var(--paper-hi); border:3px solid var(--c); border-radius:20px; padding:26px 32px; display:grid; grid-template-columns:230px 1fr; column-gap:26px; align-items:center; box-shadow:0 12px 26px rgba(40,30,10,.08); position:relative; }
  .ac::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--c); border-radius:17px 0 0 17px; }
  .acfig { height:230px; border-radius:14px; border:2px solid var(--c); }
  .acd { display:grid; gap:10px; }
  .ac .an { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--c); }
  .ac .at { font-size:38px; font-weight:900; color:var(--sumi); }
  .ac .at .blank { font-size:40px; min-width:230px; }
  .ac .ae { font-size:24px; color:var(--sumi-soft); font-weight:600; line-height:1.4; }
  .ak-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; font-size:25px; line-height:1.5; }
  .ak-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ak-safe">
    <div class="ak-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-2</span>　アジア州の区分</span>
      <h1 class="headline" style="font-size:50px;">最大の<span class="em">アジア州</span>は、さらに4つに分ける</h1>
    </div>
    <div class="grid">
      <div class="ac" style="--c:#3f7d55" data-at="1" data-anim="pop"><div class="figure acfig"><img src="assets/asia_higashi.webp" alt="東アジアの景観 ── 瓦屋根の町なみと雪をいただく山"></div><div class="acd"><div class="an">①</div><div class="at"><span class="blank" data-fill="1"><b>東アジア</b></span></div><div class="ae">日本・中国・韓国・モンゴルなど</div></div></div>
      <div class="ac" style="--c:#b07f2a" data-at="2" data-anim="pop"><div class="figure acfig"><img src="assets/asia_tonan.webp" alt="東南アジアの景観 ── ヤシの木と水をはった棚田"></div><div class="acd"><div class="an">②</div><div class="at"><span class="blank" data-fill="2"><b>東南アジア</b></span></div><div class="ae">タイ・ベトナム・インドネシアなど</div></div></div>
      <div class="ac" style="--c:#3a6b9f" data-at="3" data-anim="pop"><div class="figure acfig"><img src="assets/asia_minami.webp" alt="南アジアの景観 ── 大きな川ぞいの石づくりの寺院"></div><div class="acd"><div class="an">③</div><div class="at"><span class="blank" data-fill="3"><b>南アジア</b></span></div><div class="ae">インド・パキスタンなど</div></div></div>
      <div class="ac" style="--c:#8a52a0" data-at="4" data-anim="pop"><div class="figure acfig"><img src="assets/asia_nishi.webp" alt="西アジアの景観 ── 砂漠と石油の掘削やぐら"></div><div class="acd"><div class="an">④</div><div class="at"><span class="blank" data-fill="4"><b>西アジア</b></span></div><div class="ae">サウジアラビア・イランなど（石油）</div></div></div>
    </div>
    <div class="ak-note" data-at="5"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">位置で覚える</span><span>日本があるのは<b>①</b>。方角の名前（東・東南・南・西）＝アジアの中でのおよその位置。</span></div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
