<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世界の様子 ── 地球を、1枚ずつ集めていこう｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cover-safe { inset: 120px 150px 120px; grid-template-columns: 1fr 640px; align-content: center; gap: 72px; align-items: center; }
  .cover-txt { display: grid; gap: 32px; }
  .cover-kicker { font-size: 30px; letter-spacing:.3em; }
  .cover-title { font-size: 118px; line-height: 1.04; }
  .cover-title .goldem { color: var(--gold-deep); }
  .cover-lead { font-size: 37px; }
  .seal { display:inline-flex; align-items:center; gap:16px; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-deep); font-size:28px; letter-spacing:.06em; }
  .seal .ring { width:56px;height:56px;border-radius:50%;border:4px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:28px; }
  .cover-fig { height: 640px; border-radius: 32px; border:3px solid var(--sumi); box-shadow:0 20px 50px rgba(40,30,10,.18); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cover-safe">
    <div class="cover-txt">
      <span class="kicker cover-kicker">中1 地理　<span class="num">第1章</span></span>
      <h1 class="headline cover-title">世界の<br><span class="goldem">様子</span></h1>
      <p class="lead cover-lead">わたしたちがくらす<span class="strong">地球</span>のすがた ── <span class="strong">大陸と海・国・地図・緯度と経度</span>を1枚ずつカードにして集めよう。</p>
      <span class="seal"><span class="ring">地</span>6つの大陸・3つの海洋・約197か国</span>
    </div>
    <div class="figure cover-fig" data-at="0" data-anim="right"><img src="assets/chikyu_uchu.webp" alt="宇宙から見た地球 ── 青い海と白い雲におおわれた惑星"></div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(1);</script>
</body>
</html>
