<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>緯度 ── 赤道を0度に、緯線で南北をはかる｜中1地理 第1章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .id-safe { inset: 80px 130px 80px; grid-template-columns: 500px 1fr; align-content: center; gap: 56px; align-items: center; }
  .id-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:24px; display:grid; justify-items:center; gap:10px; }
  .id-fig svg { width:420px; height:420px; }
  .id-fig .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); }
  .id-txt { display:grid; gap:16px; }
  .id-head { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:16px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .row .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); text-align:center; line-height:1.15; }
  .row .tx { font-size:26px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .row .tx .blank { font-size:28px; min-width:120px; }
  .row.hot { border-color:var(--imp); } .row.hot .yr { color:var(--imp); }
  .id-note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:16px 28px; font-size:24px; line-height:1.5; }
  .id-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe id-safe">
    <div class="id-fig" data-at="1" data-anim="left">
      <svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
        <circle cx="210" cy="210" r="180" fill="#EAF2F8" stroke="#2c6489" stroke-width="4"/>
        <g stroke="#7a9ab0" stroke-width="1.8" fill="none">
          <path d="M76,90 Q210,102 344,90"/>
          <path d="M40,150 Q210,164 380,150"/>
          <path d="M40,270 Q210,256 380,270"/>
          <path d="M76,330 Q210,318 344,330"/>
        </g>
        <!-- 0°の線（答えは①〜④の凡例で） -->
        <path d="M30,210 Q210,224 390,210" stroke="#C4161C" stroke-width="4" fill="none"/>
        <text x="392" y="204" text-anchor="end" font-size="18" font-weight="900" fill="#C4161C">② 0°</text>
        <!-- 回帰線（破線） -->
        <path d="M52,168 Q210,180 368,168" stroke="#b07f2a" stroke-width="2.4" stroke-dasharray="7 5" fill="none"/>
        <path d="M52,252 Q210,240 368,252" stroke="#3a6b9f" stroke-width="2.4" stroke-dasharray="7 5" fill="none"/>
        <!-- ①＝横の線を指す -->
        <circle cx="300" cy="93" r="5" fill="#4a6d85"/>
        <line x1="300" y1="93" x2="352" y2="74" stroke="#4a6d85" stroke-width="1.6"/>
        <text x="356" y="80" font-size="20" font-weight="900" fill="#4a6d85">①</text>
        <text x="210" y="120" text-anchor="middle" font-size="22" font-weight="900" fill="#2f6a2f">③</text>
        <text x="210" y="308" text-anchor="middle" font-size="22" font-weight="900" fill="#8a52a0">④</text>
        <text x="210" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#2c6489">北極 90°</text>
        <text x="210" y="404" text-anchor="middle" font-size="16" font-weight="800" fill="#2c6489">南極 90°</text>
      </svg>
      <div class="id-fig cap" style="border:none;box-shadow:none;padding:0;">①〜④の名前を答えよう</div>
    </div>
    <div class="id-txt">
      <div class="id-head" data-at="0">
        <span class="kicker"><span class="num">Ⅴ-1</span>　緯度</span>
        <h1 class="headline" style="font-size:46px;"><span class="em">南北</span>の位置は緯度ではかる</h1>
      </div>
      <div class="row" data-at="2" data-anim="left"><span class="yr">横の線</span><span class="tx">②に平行な横の線＝<span class="blank" data-fill="2"><span class="bnum">①</span><b>緯線</b></span></span></div>
      <div class="row hot" data-at="3" data-anim="left"><span class="yr">0°の線</span><span class="tx">緯度0°の線＝<span class="blank" data-fill="3"><span class="bnum">②</span><b>赤道</b></span></span></div>
      <div class="row" data-at="4" data-anim="left"><span class="yr">北と南</span><span class="tx">②より北は<span class="blank" data-fill="4"><span class="bnum">③</span><b>北緯</b></span>、南は<span class="blank" data-fill="4"><span class="bnum">④</span><b>南緯</b></span>（各0〜90°）</span></div>
      <div class="id-note" data-at="5"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">回帰線</span><span>夏至に太陽が真上にくる<b>北回帰線</b>、冬至に真上にくる<b>南回帰線</b>もおさえる。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 世界の様子</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
