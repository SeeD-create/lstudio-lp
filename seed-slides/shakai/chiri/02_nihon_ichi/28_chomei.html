<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>県名と県庁所在地名がちがう県 ── 頻出リスト｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cm-safe { inset: 80px 130px 80px; align-content: center; gap: 30px; }
  .cm-head { display:grid; gap:10px; }
  .cols { display:grid; grid-template-columns: 1fr 1fr 400px; gap: 36px; align-items:center; }
  .cm-fig { height: 500px; border-radius: 20px; border:3px solid var(--cat); box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .tbl { width:100%; border-collapse: collapse; background: var(--paper-hi); border-radius: 16px; overflow: hidden; box-shadow: 0 14px 30px rgba(40,30,10,.10); }
  .tbl th, .tbl td { border: 2px solid var(--hair); padding: 14px 22px; text-align: center; }
  .tbl thead th { background: var(--sumi); color: var(--paper-hi); font-size: 26px; font-weight: 900; }
  .tbl td.ken { font-size: 30px; font-weight: 900; color: var(--sumi); }
  .tbl td.cap { font-size: 30px; }
  .tbl td.cap .blank { font-size: 30px; min-width: 200px; }
  .tbl tbody tr:nth-child(even) td { background: var(--paper-lo); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe cm-safe">
    <div class="cm-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ-3　県名 ≠ 県庁所在地名</span>
      <h1 class="headline" style="font-size:48px;">名前が<span class="em">ちがう</span>県は、必ず出る</h1>
    </div>
    <div class="cols">
      <table class="tbl" data-at="1">
        <thead><tr><th>都道府県名</th><th>県庁所在地</th></tr></thead>
        <tbody>
          <tr><td class="ken">北海道</td><td class="cap"><span class="blank" data-fill="2"><b>札幌市</b></span></td></tr>
          <tr><td class="ken">岩手県</td><td class="cap"><span class="blank" data-fill="2"><b>盛岡市</b></span></td></tr>
          <tr><td class="ken">宮城県</td><td class="cap"><span class="blank" data-fill="2"><b>仙台市</b></span></td></tr>
          <tr><td class="ken">神奈川県</td><td class="cap"><span class="blank" data-fill="2"><b>横浜市</b></span></td></tr>
          <tr><td class="ken">愛知県</td><td class="cap"><span class="blank" data-fill="2"><b>名古屋市</b></span></td></tr>
        </tbody>
      </table>
      <table class="tbl" data-at="1">
        <thead><tr><th>都道府県名</th><th>県庁所在地</th></tr></thead>
        <tbody>
          <tr><td class="ken">三重県</td><td class="cap"><span class="blank" data-fill="3"><b>津市</b></span></td></tr>
          <tr><td class="ken">滋賀県</td><td class="cap"><span class="blank" data-fill="3"><b>大津市</b></span></td></tr>
          <tr><td class="ken">兵庫県</td><td class="cap"><span class="blank" data-fill="3"><b>神戸市</b></span></td></tr>
          <tr><td class="ken">香川県</td><td class="cap"><span class="blank" data-fill="3"><b>高松市</b></span></td></tr>
          <tr><td class="ken">沖縄県</td><td class="cap"><span class="blank" data-fill="3"><b>那覇市</b></span></td></tr>
        </tbody>
      </table>
      <div class="figure cm-fig" data-at="1" data-anim="right"><img src="assets/kencho_toshi.webp" alt="県庁所在地の街 ── 駅前にビルと路面電車が集まる県の中心都市"></div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:16px 30px;font-size:24px;line-height:1.4;" data-at="4" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">他にも</span><span>栃木＝<b style="color:#fff;">宇都宮市</b>、群馬＝<b style="color:#fff;">前橋市</b>、茨城＝<b style="color:#fff;">水戸市</b>、山梨＝<b style="color:#fff;">甲府市</b>、石川＝<b style="color:#fff;">金沢市</b>、島根＝<b style="color:#fff;">松江市</b>、愛媛＝<b style="color:#fff;">松山市</b>など。</span></div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
