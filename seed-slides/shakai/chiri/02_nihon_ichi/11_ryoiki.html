<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>領域とは ── 領土・領海・領空の3つ｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ry-safe { inset: 84px 130px 84px; grid-template-columns: 860px 1fr; align-content: center; gap: 52px; align-items: center; }
  .figbox { background: #EAF2F8; border: 3px solid var(--sumi); border-radius: 24px; box-shadow: 0 16px 38px rgba(40,30,10,.12); padding: 16px; }
  .figbox svg { display:block; width:100%; height:auto; }
  .fl { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; }
  .ry-txt { display:grid; gap:18px; }
  .ry-head { display:grid; gap:10px; }
  .rrow { display:flex; align-items:center; gap:18px; background: var(--paper-hi); border-left: 8px solid var(--c); border-radius: 0 14px 14px 0; padding: 16px 24px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .rrow .sw { flex:none; width:38px; height:38px; border-radius:8px; background:var(--c); border:2px solid rgba(0,0,0,.2); }
  .rrow .lt { font-size:30px; font-weight:900; color:var(--sumi); line-height:1.3; display:flex; align-items:baseline; flex-wrap:wrap; }
  .rrow .lt .blank { font-size:32px; min-width:190px; }
  .rrow .lt small { width:100%; font-size:22px; color:var(--sumi-mute); font-weight:600; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ry-safe">
    <div class="figbox" data-at="0" data-anim="left">
      <svg viewBox="0 0 840 560" xmlns="http://www.w3.org/2000/svg">
        <!-- 空 -->
        <rect x="0" y="0" width="840" height="560" fill="#EAF2F8"/>
        <!-- 領空 -->
        <rect x="40" y="30" width="560" height="230" fill="#F6E4A8" opacity=".55" stroke="#b78a2a" stroke-width="2.5" data-at="3"/>
        <g data-at="3"><circle cx="320" cy="140" r="30" fill="#fff" stroke="#b78a2a" stroke-width="4"/><text class="fl" x="320" y="152" fill="#7a5a12" font-size="38" text-anchor="middle">③</text></g>
        <line x1="320" y1="30" x2="320" y2="18" stroke="#b78a2a" stroke-width="2" data-at="3"/>
        <text class="fl" x="320" y="14" fill="#7a5a12" font-size="17" text-anchor="middle" data-at="3">大気圏内（約300kmまで）</text>
        <!-- 海 -->
        <rect x="360" y="260" width="440" height="260" fill="#9FC7E0"/>
        <!-- 領海 -->
        <rect x="360" y="260" width="240" height="260" fill="#5AA0CC" stroke="#2c6489" stroke-width="2.5" data-at="2"/>
        <g data-at="2"><circle cx="480" cy="390" r="30" fill="#fff" stroke="#2c6489" stroke-width="4"/><text class="fl" x="480" y="402" fill="#153f5a" font-size="38" text-anchor="middle">②</text></g>
        <!-- 公海 -->
        <text class="fl" x="700" y="400" fill="#2c6489" font-size="26" text-anchor="middle">公海</text>
        <!-- 領土（陸） -->
        <path d="M40,260 L360,260 L360,520 L40,520 Z" fill="#A8D5A2" stroke="#3f7a3f" stroke-width="2.5" data-at="1"/>
        <path d="M40,260 Q140,235 240,255 Q320,268 360,260 L360,300 L40,300 Z" fill="#8FC489" data-at="1"/>
        <g data-at="1"><circle cx="200" cy="410" r="30" fill="#fff" stroke="#3f7a3f" stroke-width="4"/><text class="fl" x="200" y="422" fill="#2c5a2c" font-size="38" text-anchor="middle">①</text></g>
        <!-- 海面線 -->
        <line x1="0" y1="260" x2="840" y2="260" stroke="#2c6489" stroke-width="2" stroke-dasharray="7 5"/>
      </svg>
    </div>
    <div class="ry-txt">
      <div class="ry-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ-6　領域とは</span>
        <h1 class="headline" style="font-size:46px;margin-top:10px;">国の<span class="em">領域</span>は3つでできている</h1>
      </div>
      <div class="rrow" style="--c:#3f7a3f" data-at="1" data-anim="left"><span class="sw"></span><span class="lt"><span class="blank" data-fill="1"><span class="bnum">①</span><b>領土</b></span><small>その国が持つ陸地の範囲</small></span></div>
      <div class="rrow" style="--c:#2c6489" data-at="2" data-anim="left"><span class="sw"></span><span class="lt"><span class="blank" data-fill="2"><span class="bnum">②</span><b>領海</b></span><small>海岸から一定の範囲の海</small></span></div>
      <div class="rrow" style="--c:#b78a2a" data-at="3" data-anim="left"><span class="sw"></span><span class="lt"><span class="blank" data-fill="3"><span class="bnum">③</span><b>領空</b></span><small>①と②の上空・大気圏内（約300kmまで）</small></span></div>
      <div style="display:flex;align-items:center;gap:18px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:18px 28px;font-size:25px;line-height:1.45;" data-at="4" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">300kmの外は</span><span>大気圏をこえると<b style="color:var(--gold-soft);">宇宙空間</b>。ここはどの国のものでもない。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
