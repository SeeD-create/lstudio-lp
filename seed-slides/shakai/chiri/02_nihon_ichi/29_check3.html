<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 都道府県と県庁所在地｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1520px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:45px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 33px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .ans { margin-top: 30px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 31px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { padding: 6px 14px; }
  .ans .row .av .blank--para b { color: var(--imp); }
  .ans .row .av .blank--para .hl { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 都道府県と県庁所在地</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext">① 47都道府県は「1都1道2府43県」。2つの「府」はどこ？<br>② 宮城県・愛知県の県庁所在地は？<br>③ 北から順に7つの地方を言える？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">大阪府・京都府</span>　（都＝東京都、道＝北海道）</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b>宮城県＝<span class="hl">仙台市</span>／愛知県＝<span class="hl">名古屋市</span></b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">北海道→東北→関東→中部→近畿→中国四国→九州</span></b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
