<head>

<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ic-safe { inset: 84px 130px 84px; grid-template-columns: 1fr 520px; align-content: center; align-items: center; gap: 56px; }
  .ic-txt { display:grid; gap: 28px; }
  .ic-fig { height: 560px; border-radius: 26px; border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); }
  .ic-head { display:grid; gap:12px; }
  .def { font-size: 40px; font-weight: 700; color: var(--sumi); line-height: 1.55; }
  .def .blank { font-size: 42px; min-width: 220px; }
  .def .em { color: var(--imp); font-weight:900; }
  .note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:27px; line-height:1.5; }
  .note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ic-safe">
    <div class="ic-txt">
    <div class="ic-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 位置と領域　授業ノート1 ⑴</span>
      <h1 class="headline" style="font-size:56px;margin-top:14px;">日本は「どこ」にあるのか</h1>
    </div>
    <p class="def" data-at="1">日本は
      <span class="blank" data-fill="2"><span class="bnum">①</span><b>ユーラシア</b></span>大陸の
      <span class="blank" data-fill="3"><span class="bnum">②</span><b>東</b></span>に位置する、面積が約
      <span class="blank" data-fill="4"><span class="bnum">③</span><b>38万</b></span>km²の<span class="em">島国</span>である。</p>
    <p class="def" data-at="5">領土は
      <span class="blank" data-fill="5" style="min-width:600px;"><span class="bnum">④</span><b>北海道・本州・四国・九州</b></span>
      の4つの島と、その他の小さな島々からなる。</p>
    <div class="note" data-at="5" data-anim="fade">
      <span class="bt">覚え方</span>
      <span>大陸の<b>東</b>にある「島の国」。面積はドイツとほぼ同じで、世界では中くらい。海に囲まれているのが日本の最大の特徴。</span>
    </div>
    </div>
    <div class="figure ic-fig" data-at="0" data-anim="right"><img src="assets/shimaguni_umi.webp" alt="海に囲まれた島国 ── 岬から見わたす青い海と島影"></div>
  </div>
