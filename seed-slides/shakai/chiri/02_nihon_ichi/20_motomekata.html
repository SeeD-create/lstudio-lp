<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>時差の求め方 ── 経度差÷15、同じ側は引き、またぐ側は足す｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mt-safe { inset: 90px 150px 90px; align-content: center; gap: 34px; }
  .mt-head { display:grid; gap:10px; }
  .steps { display:grid; gap:22px; }
  .mstep { display:grid; grid-template-columns: 90px 1fr; align-items:center; gap:28px; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:24px 32px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .mstep .sn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--cat); text-align:center; }
  .mstep .sc { font-size:33px; font-weight:700; color:var(--sumi); line-height:1.5; }
  .mstep .sc .r { color:var(--imp); font-weight:900; }
  .mstep .sc small { display:block; font-size:24px; color:var(--sumi-mute); font-weight:600; margin-top:4px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe mt-safe">
    <div class="mt-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ-4　時差の求め方</span>
      <h1 class="headline" style="font-size:50px;margin-top:10px;">時差は<span class="em">3ステップ</span>で求まる</h1>
    </div>
    <div class="steps">
      <div class="mstep" data-at="1" data-anim="left"><span class="sn">1</span><span class="sc">2つの地点の<span class="r">経度の差</span>を求める<small>同じ東経どうし → 引き算　／　東経と西経 → 足し算</small></span></div>
      <div class="mstep" data-at="2" data-anim="left"><span class="sn">2</span><span class="sc">経度の差を <span class="r">÷15</span> する<small>15度で1時間だから。答えが「時差（何時間）」になる</small></span></div>
      <div class="mstep" data-at="3" data-anim="left"><span class="sn">3</span><span class="sc"><span class="r">東</span>にある地点ほど時間が<span class="r">進んでいる</span><small>日本(東経135°)は西のイギリス(0°)より進んでいる＝時刻が先</small></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:18px 30px;font-size:26px;line-height:1.45;" data-at="4" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">合言葉</span><span><b style="color:#fff;">「差を15で割る」</b>。同じ側は引く、またぐ（東経＋西経）は足す。東が進んでいる。この3つだけ。</span></div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
