<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>この単元とは ── 位置・領域・時差・都道府県｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tw-safe { inset: 96px 150px 92px; align-content: center; gap: 40px; }
  .tw-head { display: grid; gap: 14px; }
  .tw-lead { font-size: 40px; line-height: 1.55; color: var(--sumi-soft); font-weight: 500; max-width: 1500px; }
  .tw-lead .em { color: var(--imp); font-weight: 900; }
  .flow { display:flex; align-items:stretch; gap: 20px; }
  .fstep { flex:1; background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:26px 24px; display:grid; gap:10px; box-shadow:0 12px 28px rgba(40,30,10,.10); position:relative; }
  .fstep .fn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .fstep .ft { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); line-height:1.15; }
  .fstep .fd { font-size:23px; color:var(--sumi-soft); line-height:1.45; font-weight:500; }
  .arw { align-self:center; font-size:40px; color:var(--sumi-mute); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　この単元とは</span>
      <h1 class="headline" style="font-size:66px;">日本を<span class="em">数字と線</span>でつかむ4ステップ</h1>
    </div>
    <p class="tw-lead" data-at="1">「なんとなくアジア」ではなく、<span class="em">緯度・経度・海里・度</span>という数字で日本を表す練習をする。位置がわかれば領域が引け、経度がわかれば時差が計算でき、最後は<span class="em">47都道府県</span>で日本の中身を分ける。</p>
    <div class="flow">
      <div class="fstep" data-at="2" data-anim="pop"><div class="fn">STEP 1</div><div class="ft">位置</div><div class="fd">ユーラシア大陸の東・4つの島・東西南北の端</div></div>
      <div class="arw" data-at="2">›</div>
      <div class="fstep" data-at="3" data-anim="pop"><div class="fn">STEP 2</div><div class="ft">領域</div><div class="fd">領土・領海・領空・排他的経済水域と領土問題</div></div>
      <div class="arw" data-at="3">›</div>
      <div class="fstep" data-at="4" data-anim="pop"><div class="fn">STEP 3</div><div class="ft">時差</div><div class="fd">標準時＝東経135度。経度15度で1時間ずれる</div></div>
      <div class="arw" data-at="4">›</div>
      <div class="fstep" data-at="4" data-anim="pop"><div class="fn">STEP 4</div><div class="ft">都道府県</div><div class="fd">47都道府県と県庁所在地・7つの地方区分</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
