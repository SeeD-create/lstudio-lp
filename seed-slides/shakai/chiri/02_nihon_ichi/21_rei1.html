<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>例題① ── 日本とイギリス・マレーシアの時差｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rx-safe { inset: 90px 150px 90px; align-content: center; gap: 32px; }
  .rx-head { display:grid; gap:10px; }
  .exwrap { display:grid; grid-template-columns: repeat(2,1fr); gap: 34px; }
  .excard { background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:28px 30px; display:grid; grid-template-columns:230px 1fr; column-gap:26px; align-items:center; box-shadow:0 14px 32px rgba(40,30,10,.10); }
  .exfig { height:280px; border-radius:16px; border:2px solid var(--cat); box-shadow:0 10px 22px rgba(40,30,10,.10); }
  .exd { display:grid; gap:16px; }
  .excard .q { font-size:29px; font-weight:900; color:var(--sumi); line-height:1.45; }
  .excard .calc { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); line-height:1.6; }
  .excard .calc .r { color:var(--imp); }
  .excard .ans { display:flex; align-items:baseline; gap:16px; font-size:34px; font-weight:900; }
  .excard .ans .lab { color:var(--sumi-mute); font-size:28px; }
  .excard .ans .blank { font-size:40px; min-width:220px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe rx-safe">
    <div class="rx-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ-5　例題①　同じ側は引き算</span>
      <h1 class="headline" style="font-size:48px;margin-top:10px;">日本と<span class="em">イギリス・マレーシア</span>の時差</h1>
    </div>
    <div class="exwrap">
      <div class="excard" data-at="1" data-anim="pop">
        <div class="figure exfig"><img src="assets/igirisu_machi.webp" alt="イギリスの街なみ ── 石だたみの通りとれんがの建物"></div>
        <div class="exd">
          <div class="q">日本（東経135°）とイギリス（0°）の時差は？</div>
          <div class="calc" data-at="2">135° − 0° ＝ <span class="r">135°</span><br>135 ÷ 15 ＝ <span class="r">9</span></div>
          <div class="ans" data-at="2"><span class="lab">答え</span><span class="blank" data-fill="2"><b>9時間</b></span></div>
        </div>
      </div>
      <div class="excard" data-at="3" data-anim="pop">
        <div class="figure exfig"><img src="assets/malaysia_machi.webp" alt="マレーシアの街なみ ── 熱帯の高層ビルとヤシの木"></div>
        <div class="exd">
          <div class="q">日本（東経135°）とマレーシア（東経105°）の時差は？</div>
          <div class="calc" data-at="4">135° − 105° ＝ <span class="r">30°</span><br>30 ÷ 15 ＝ <span class="r">2</span></div>
          <div class="ans" data-at="4"><span class="lab">答え</span><span class="blank" data-fill="4"><b>2時間</b></span></div>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:18px 30px;font-size:25px;line-height:1.45;" data-at="4" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">ここが要点</span><span>どちらも<b style="color:#fff;">東経どうし（または0°）</b>だから<b style="color:#fff;">引き算</b>。差を15で割るだけ。</span></div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
