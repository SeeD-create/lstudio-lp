      <div class="hj-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅱ-1　時刻の基準</span>
        <h1 class="headline" style="font-size:48px;margin-top:10px;">日本の時刻の<span class="em">基準</span></h1>
      </div>
      <p class="def" data-at="1">国の時刻の基準を
        <span class="blank" data-fill="1"><span class="bnum">①</span><b>標準時</b></span> という。</p>
      <p class="def" data-at="2">日本の時刻の基準は
        <span class="blank" data-fill="2"><span class="bnum">②</span><b>東経135度</b></span> の経線が基準。</p>
      <p class="def" data-at="3">この線は
        <span class="blank" data-fill="3"><span class="bnum">③</span><b>兵庫県明石市</b></span> を通る。</p>
      <div class="hit" data-at="4" data-anim="fade">
        <span class="bt">覚え方</span>
        <span>「時刻の基準＝<b>経度</b>＝<b>その経線が通る市</b>」の3点セットで覚える。①の基準になる経線を<span class="blank" data-fill="4"><b>標準時子午線</b></span>という。</span>
      </div>
