<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>竹島と尖閣諸島 ── 韓国・中国台湾との領土問題｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { inset: 90px 150px 90px; align-content: center; gap: 34px; }
  .tk-head { display:grid; gap:10px; }
  .cards { display:grid; grid-template-columns: repeat(2,1fr); gap: 34px; }
  .pc { background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:34px 34px 32px; display:grid; grid-template-columns:250px 1fr; column-gap:26px; align-items:center; box-shadow:0 14px 32px rgba(40,30,10,.10); position:relative; }
  .pcfig { height:300px; border-radius:16px; border:2px solid var(--c); box-shadow:0 10px 22px rgba(40,30,10,.10); }
  .pcd { display:grid; gap:14px; }
  .pc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .pc .pt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--sumi); }
  .pc .loc { font-size:26px; color:var(--sumi-mute); font-weight:700; }
  .pc .st { font-size:30px; color:var(--sumi); font-weight:700; line-height:1.5; display:flex; align-items:baseline; flex-wrap:wrap; }
  .pc .st .blank { font-size:34px; min-width:250px; }
  .pc .bd { font-size:24px; color:var(--sumi-soft); font-weight:500; line-height:1.45; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tk-safe">
    <div class="tk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ-9　領土問題②・③</span>
      <h1 class="headline" style="font-size:50px;margin-top:10px;">もう2つの<span class="em">領土問題</span> ── 竹島と尖閣諸島</h1>
    </div>
    <div class="cards">
      <div class="pc" style="--c:#b5433f" data-at="1" data-anim="pop">
        <div class="figure pcfig"><img src="assets/takeshima_shima.webp" alt="日本海にうかぶ小さな岩の島"></div>
        <div class="pcd">
          <span class="pt">竹島</span>
          <span class="loc">島根県／日本海上・朝鮮半島との間</span>
          <span class="st">今は <span class="blank" data-fill="1"><b>韓国</b></span> が実効支配している</span>
          <span class="bd">日本固有の領土だが、となりの国が占拠している。日本は返還を求めている。</span>
        </div>
      </div>
      <div class="pc" style="--c:#2c6489" data-at="2" data-anim="pop">
        <div class="figure pcfig"><img src="assets/senkaku_shima.webp" alt="東シナ海にうかぶ緑におおわれた無人の島"></div>
        <div class="pcd">
          <span class="pt">尖閣諸島</span>
          <span class="loc">沖縄県／東シナ海上・台湾の北</span>
          <span class="st"><span class="blank" data-fill="2" style="min-width:340px;"><b>中国・台湾</b></span> が領有権を主張</span>
          <span class="bd">日本が有効に支配しているが、中国と台湾が「自分の領土だ」と主張している。</span>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:20px 32px;font-size:26px;line-height:1.45;" data-at="3" data-anim="fade">
      <span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">3つセットで</span>
      <span>領土問題は<b style="color:#fff;">北方領土</b>／<b style="color:#fff;">竹島</b>／<b style="color:#fff;">尖閣諸島</b>の3つ。相手の国名を必ずセットで覚える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
