<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 時差の計算｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1520px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:45px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 33px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .ans { margin-top: 30px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 30px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av small { color: var(--sumi); font-weight:600; font-size:24px; }
  .ans .row .av .blank--para { padding: 6px 14px; }
  .ans .row .av .blank--para b { color: var(--imp); }
  .ans .row .av .blank--para .hl { color: var(--imp); }
  .ans .row .av .blank--para small { display:inline; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 時差の計算</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つを計算しよう</div>
      <p class="qtext">① 東経30°のエジプトと0°のイギリスの時差は？<br>② 東経15°のドイツと東経135°の日本の時差は？<br>③ 日本（東経135°）が4月20日午後3時のとき、イギリス（0°）は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">2時間</span>　<small>30 ÷ 15 ＝ 2（同じ東経側なので引き算＝差は30°）</small></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">8時間</span>　<small>（135 − 15）÷ 15 ＝ 120 ÷ 15 ＝ 8</small></b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">4月20日 午前6時</span>　<small>時差9時間・イギリスは遅れ → 15時 − 9時間 ＝ 6時</small></b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
