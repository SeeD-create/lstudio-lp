<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>47都道府県 ── 1都1道2府43県｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fr-safe { inset: 90px 150px 90px; align-content: center; gap: 40px; }
  .fr-head { display:grid; gap:10px; }
  .bignum { display:flex; align-items:center; gap:36px; }
  .bignum .num { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:180px; line-height:.9; color:var(--imp); }
  .bignum .lab { font-size:44px; font-weight:900; color:var(--sumi); line-height:1.3; }
  .bignum .lab small { display:block; font-size:28px; color:var(--sumi-mute); font-weight:600; margin-top:8px; }
  .brk { display:grid; grid-template-columns: repeat(4,1fr); gap:24px; }
  .bc { background:var(--paper-hi); border:3px solid var(--c); border-radius:18px; padding:24px 26px; display:grid; gap:8px; box-shadow:0 12px 26px rgba(40,30,10,.10); text-align:center; }
  .bc .cnt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--c); }
  .bc .knd { font-size:30px; font-weight:900; color:var(--sumi); }
  .bc .exm { font-size:23px; color:var(--sumi-soft); font-weight:600; line-height:1.35; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe fr-safe">
    <div class="fr-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ-1　都道府県の数　授業ノート3</span>
      <h1 class="headline" style="font-size:50px;">日本はいくつの<span class="em">都道府県</span>に分かれる？</h1>
    </div>
    <div class="bignum" data-at="1">
      <span class="num"><span class="blank" data-fill="1" style="min-width:200px;border:none;background:none;"><b style="color:var(--imp);font-size:180px;">47</b></span></span>
      <span class="lab">都道府県<small>「1都・1道・2府・43県」の合計</small></span>
    </div>
    <div class="brk">
      <div class="bc" style="--c:#1A1A1A" data-at="2" data-anim="pop"><span class="cnt">1都</span><span class="knd">都</span><span class="exm">東京都</span></div>
      <div class="bc" style="--c:#3A3A39" data-at="3" data-anim="pop"><span class="cnt">1道</span><span class="knd">道</span><span class="exm">北海道</span></div>
      <div class="bc" style="--c:#535250" data-at="4" data-anim="pop"><span class="cnt">2府</span><span class="knd">府</span><span class="exm">大阪府・京都府</span></div>
      <div class="bc" style="--c:#6B6A67" data-at="5" data-anim="pop"><span class="cnt">43県</span><span class="knd">県</span><span class="exm">残りの43</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:18px 30px;font-size:26px;line-height:1.45;" data-at="5" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">覚え方</span><span>都は<b style="color:#fff;">東京</b>、道は<b style="color:#fff;">北海道</b>、府は<b style="color:#fff;">大阪・京都</b>の2つだけ。あとは全部「県」で<b style="color:#fff;">43</b>。足すと①の数になる。</span></div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
