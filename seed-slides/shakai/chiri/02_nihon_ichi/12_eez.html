    </div>

    <div style="display:flex;align-items:center;gap:18px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:16px 28px;font-size:24px;line-height:1.4;" data-at="4" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">島が大事な理由</span><span>小さな島でも、そのまわり<b style="color:var(--gold-soft);">②のきょり</b>が排他的経済水域になる。だから<b style="color:var(--gold-soft);">沖ノ鳥島</b>を護岸工事で守っている。</span></div>
