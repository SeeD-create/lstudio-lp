<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 日本の位置と領域｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1520px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:45px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 34px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .ans { margin-top: 30px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 31px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { padding: 6px 14px; }
  .ans .row .av .blank--para b { color: var(--imp); }
  .ans .row .av .blank--para .hl { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 日本の位置と領域</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext">① 領海は海岸から何海里？　排他的経済水域は何海里？<br>② 北方領土の4島をすべて言える？　実効支配している国は？<br>③ 竹島と尖閣諸島、それぞれ相手の国は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b>領海＝<span class="hl">12海里</span>／排他的経済水域＝<span class="hl">200海里</span>（1海里＝1852m）</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">択捉島・国後島・色丹島・歯舞群島</span>　── 実効支配は<span class="hl">ロシア</span></b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b>竹島＝<span class="hl">韓国</span>が実効支配／尖閣諸島＝<span class="hl">中国・台湾</span>が領有権を主張</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
