<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>例題② ── 日本とロサンゼルス（西経）の時差｜中1地理 第2章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rx-safe { inset: 84px 130px 84px; align-content: center; gap: 30px; }
  .rx-head { display:grid; gap:10px; }
  .figbox { background:#EAF2F8; border:3px solid var(--sumi); border-radius:20px; box-shadow:0 12px 28px rgba(40,30,10,.10); padding:14px; }
  .figbox svg { display:block; width:100%; height:auto; }
  .fl { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; }
  .body { display:grid; grid-template-columns: 1fr 620px; gap: 44px; align-items:center; }
  .calcbox { background:var(--paper-hi); border:3px solid var(--imp); border-radius:18px; padding:28px 34px; display:grid; gap:14px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .calcbox .q { font-size:29px; font-weight:900; color:var(--sumi); line-height:1.4; }
  .calcbox .calc { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); line-height:1.55; }
  .calcbox .calc .r { color:var(--imp); }
  .calcbox .ans { display:flex; align-items:baseline; gap:16px; font-size:36px; font-weight:900; }
  .calcbox .ans .lab { color:var(--sumi-mute); font-size:28px; }
  .calcbox .ans .blank { font-size:44px; min-width:240px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe rx-safe">
    <div class="rx-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ-6　例題②　またぐときは足し算</span>
      <h1 class="headline" style="font-size:46px;margin-top:10px;">日本と<span class="em">ロサンゼルス（西経120°）</span>の時差</h1>
    </div>
    <div class="body">
      <div class="calcbox" data-at="1">
        <div class="q">東経と西経は本初子午線（0°）をはさむ → <span style="color:var(--imp);">足し算</span></div>
        <div class="calc" data-at="2">135° ＋ 120° ＝ <span class="r">255°</span></div>
        <div class="calc" data-at="3">255 ÷ 15 ＝ <span class="r">17</span></div>
        <div class="ans" data-at="4"><span class="lab">答え</span><span class="blank" data-fill="4"><b>17時間</b></span></div>
      </div>
      <div class="figbox" data-at="0" data-anim="right">
        <svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="600" height="360" fill="#EAF2F8"/>
          <rect x="40" y="150" width="520" height="80" fill="#CFE0EC" stroke="#2c6489" stroke-width="2"/>
          <line x1="300" y1="130" x2="300" y2="250" stroke="#4a4947" stroke-width="3" stroke-dasharray="7 5"/>
          <text class="fl" x="300" y="120" fill="#4a4947" font-size="20" text-anchor="middle">0°（本初子午線）</text>
          <!-- ロサンゼルス（西・左） -->
          <line x1="140" y1="140" x2="140" y2="240" stroke="#b5433f" stroke-width="4" data-at="1"/>
          <circle cx="140" cy="190" r="12" fill="#b5433f" data-at="1"/>
          <text class="fl" x="140" y="275" fill="#8a2f2b" font-size="20" text-anchor="middle" data-at="1">ロサンゼルス</text>
          <text class="fl" x="140" y="300" fill="#8a2f2b" font-size="18" text-anchor="middle" data-at="1">西経120°</text>
          <!-- 日本（東・右） -->
          <line x1="460" y1="140" x2="460" y2="240" stroke="#2c6489" stroke-width="4" data-at="1"/>
          <circle cx="460" cy="190" r="12" fill="#2c6489" data-at="1"/>
          <text class="fl" x="460" y="275" fill="#20516f" font-size="20" text-anchor="middle" data-at="1">日本</text>
          <text class="fl" x="460" y="300" fill="#20516f" font-size="18" text-anchor="middle" data-at="1">東経135°</text>
          <!-- 差の矢印 -->
          <line x1="140" y1="110" x2="460" y2="110" stroke="#C4161C" stroke-width="3" data-at="2"/>
          <text class="fl" x="300" y="100" fill="#C4161C" font-size="22" text-anchor="middle" data-at="2">120° ＋ 135° ＝ 255°</text>
        </svg>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:16px 30px;font-size:25px;line-height:1.4;" data-at="4" data-anim="fade"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">まちがえやすい</span><span>東経と西経を<b style="color:#fff;">引いてしまうミス</b>に注意。0°をまたぐときは必ず<b style="color:#fff;">足す</b>。</span></div>
  </div>
  <div class="seed-foot"><span>第2章 日本の位置と地域</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
