<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>島々の課題・地球温暖化｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kn-safe { inset: 96px 150px 90px; align-content: center; gap: 36px; }
  .kn-head { display: grid; gap: 12px; }
  .kn-main { display:grid; grid-template-columns:1fr 480px; align-items:center; gap:50px; }
  .kn-fig { height: 470px; border-radius:24px; border:3px solid var(--imp); box-shadow:0 16px 38px rgba(40,30,10,.16); }
  .flow { display:grid; align-items:center; gap:14px; }
  .fbox { border-radius:22px; padding:34px 36px; display:grid; gap:12px; box-shadow:0 14px 30px rgba(40,30,10,.1); }
  .f-cause { background:var(--paper-hi); border:3px solid var(--sumi-mute); }
  .f-effect { background:var(--paper-hi); border:3px solid var(--imp); }
  .fbox .fh { font-size:24px; font-weight:900; letter-spacing:.08em; }
  .f-cause .fh { color:var(--sumi-mute); }
  .f-effect .fh { color:var(--imp); }
  .fbox .fw { font-size:44px; font-weight:900; color:var(--sumi); line-height:1.25; }
  .fbox .fw .blank { font-size:46px; }
  .fbox .fb { font-size:24px; color:var(--sumi-soft); line-height:1.5; font-weight:600; }
  .ar { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; line-height:1; color:var(--imp); text-align:center; }
  .kn-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:28px; line-height:1.5; }
  .kn-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kn-safe">
    <div class="kn-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-3</span>　島々の課題</span>
      <h1 class="headline" style="font-size:52px;">島がしずむ？　<span class="em">気候変動</span>の危機</h1>
    </div>
    <div class="kn-main">
      <div class="flow">
        <div class="fbox f-cause" data-at="1" data-anim="left"><div class="fh">原因</div><div class="fw">地球<span class="blank" data-fill="1"><b>温暖化</b></span></div><div class="fb">二酸化炭素などで気温が上がり、南極などの氷がとけて海の水が増える。</div></div>
        <div class="ar" data-at="2" data-anim="pop">▼</div>
        <div class="fbox f-effect" data-at="3" data-anim="left"><div class="fh">結果</div><div class="fw"><span class="blank" data-fill="3"><b>海面上昇</b></span></div><div class="fb">低いサンゴ礁の島（ツバルなど）が海にしずむおそれ。人々のくらしが危ない。</div></div>
      </div>
      <div class="figure kn-fig" data-at="0" data-anim="right"><img src="assets/teii_shima.webp" alt="低いサンゴ礁の島 ── すぐそばまで海が迫る砂の岸とヤシの木"></div>
    </div>
    <div class="kn-note" data-at="4"><span>もう一つの被害</span><span>海水温が上がると<b>サンゴが白くなって死ぬ</b>（白化）。グレートバリアリーフでも被害が出ている。</span></div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
