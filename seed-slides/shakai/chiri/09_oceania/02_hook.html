<div class="seed-stage"><div class="seed-slide" data-cat="eq">

      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">南半球</div><div class="fttl">日本と季節が逆</div><div class="fbody">赤道より南にあるので、日本が夏のとき、オーストラリアは冬。クリスマスは真夏。</div></div>
