<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>オーストラリアの鉱業｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kg-safe { inset: 90px 140px 86px; align-content: center; gap: 30px; }
  .kg-head { display: grid; gap: 12px; }
  .kg-row { display:grid; grid-template-columns: repeat(3,1fr); gap:28px; }
  .kcard { background:var(--paper-hi); border-radius:22px; border:3px solid var(--c); box-shadow:0 14px 30px rgba(40,30,10,.1); overflow:hidden; display:grid; align-content:start; }
  .kcard .ch { background:var(--c); color:#fff; padding:18px 24px; display:grid; gap:2px; }
  .kcard .ch .pl { font-family:'Zen Old Mincho',serif; font-size:22px; opacity:.9; }
  .kcard .ch .nm { font-size:33px; font-weight:900; }
  .kcard .ch .nm .blank { font-size:35px; }
  .kfig { height: 286px; border-radius: 0; box-shadow: none; border-bottom: 3px solid var(--c); }
  .kcard .cb { padding:22px 26px; display:grid; gap:11px; }
  .kcard .cb li { list-style:none; font-size:24px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .kcard .cb li small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .kcard .cb li .imp { color:var(--imp); }
  .kg-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; font-size:27px; line-height:1.5; }
  .kg-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe kg-safe">
    <div class="kg-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-8</span>　鉱業（地下資源）</span>
      <h1 class="headline" style="font-size:50px;">地面をけずる、<span class="em">資源大国</span></h1>
    </div>
    <div class="kg-row">
      <div class="kcard" style="--c:#a0492f" data-at="1" data-anim="pop">
        <div class="ch"><span class="pl">西部で産出</span><span class="nm"><span class="blank" data-fill="1"><b>鉄鉱石</b></span></span></div>
        <div class="figure kfig"><img src="assets/tekkoseki_rotenbori.webp" alt="鉄鉱石の露天掘り ── 階段状にけずられた赤茶色の巨大な採掘場"></div>
        <div class="cb"><ul style="padding:0;margin:0;display:grid;gap:11px;">
          <li>製鉄（鉄をつくる）の原料<small>世界一の生産量</small></li>
          <li>西部のピルバラ地区で多く産出<small>日本の重要な輸入相手</small></li>
        </ul></div>
      </div>
      <div class="kcard" style="--c:#3a3a3a" data-at="2" data-anim="pop">
        <div class="ch"><span class="pl">東部で産出</span><span class="nm"><span class="blank" data-fill="2"><b>石炭</b></span></span></div>
        <div class="figure kfig"><img src="assets/sekitan_rotenbori.webp" alt="石炭の露天掘り ── 黒い地層があらわれた段々の斜面と大型ショベル"></div>
        <div class="cb"><ul style="padding:0;margin:0;display:grid;gap:11px;">
          <li>発電などに使うエネルギー資源<small>火力発電の燃料</small></li>
          <li>東部で多く産出<small>日本の輸入の第1位</small></li>
        </ul></div>
      </div>
      <div class="kcard" style="--c:#c9a83e" data-at="3" data-anim="pop">
        <div class="ch"><span class="pl">北部で産出</span><span class="nm"><span class="blank" data-fill="3"><b>ボーキサイト</b></span></span></div>
        <div class="figure kfig"><img src="assets/bauxite.webp" alt="ボーキサイト ── 赤褐色の鉱石の塊と、そこからつくられる銀色のアルミ"></div>
        <div class="cb"><ul style="padding:0;margin:0;display:grid;gap:11px;">
          <li><span class="imp">アルミニウム</span>の原料となる資源<small>世界有数の生産量</small></li>
          <li>北部で多く産出<small>軽い金属アルミのもと</small></li>
        </ul></div>
      </div>
    </div>
    <div class="kg-note" data-at="4"><span>採り方</span><span>地表をけずって直接ほり出す<b>露天掘り</b>（掘り込み式）で採る。大きな穴をほって、大型機械で一気にかき出す。</span></div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
