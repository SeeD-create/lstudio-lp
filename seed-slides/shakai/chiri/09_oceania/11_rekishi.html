<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>オーストラリアの歴史｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rk-safe { inset: 88px 150px 86px; align-content: center; gap: 38px; }
  .rk-head { display: grid; gap: 14px; }
  .tl { display:grid; grid-template-columns: repeat(3,1fr); gap:30px; position:relative; }
  .tl::before { content:""; position:absolute; left:6%; right:6%; top:64px; height:5px; background:var(--gold); border-radius:3px; }
  .tcard { background: var(--paper-hi); border-radius:22px; border:3px solid var(--sumi); box-shadow:0 14px 30px rgba(40,30,10,.1); padding:30px 28px; display:grid; gap:14px; align-content:start; position:relative; }
  .tfig { height: 206px; border-radius: 14px; border: 2px solid var(--hair); box-shadow: 0 8px 18px rgba(40,30,10,.08); }
  .tcard .era { display:inline-flex; align-items:center; justify-content:center; height:56px; padding:0 26px; border-radius:28px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; justify-self:start; }
  .tcard .tt { font-size:32px; font-weight:900; color:var(--sumi); line-height:1.35; }
  .tcard .tb { font-size:25px; line-height:1.5; color:var(--sumi-soft); }
  .tcard .blank { font-size:33px; }
  .rk-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:29px; line-height:1.5; }
  .rk-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe rk-safe">
    <div class="rk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-4</span>　歴史</span>
      <h1 class="headline" style="font-size:58px;">先住民の大陸に、<span class="em">ヨーロッパ人</span>がやってきた</h1>
    </div>
    <div class="tl">
      <div class="tcard" data-at="1" data-anim="pop"><span class="era">大昔から</span><div class="figure tfig"><img src="assets/senjumin_daichi.webp" alt="先住民の大地 ── 赤い岩肌の壁画と木のブーメラン"></div><div class="tt">先住民<span class="blank" data-fill="1"><b>アボリジニ</b></span>が暮らす</div><div class="tb">狩りや採集で数万年前から住んでいた、オーストラリアの先住民。</div></div>
      <div class="tcard" data-at="2" data-anim="pop"><span class="era">18世紀後半〜</span><div class="figure tfig"><img src="assets/shokuminchi.webp" alt="植民地のはじまり ── 入り江に停泊する帆船と木造の家々"></div><div class="tt"><span class="blank" data-fill="2"><b>イギリス</b></span>の植民地に</div><div class="tb">白人が移り住み、先住民の土地をうばって植民地にした。英語が広まる。</div></div>
      <div class="tcard" data-at="3" data-anim="pop"><span class="era" style="background:var(--imp);"><span class="blank" data-fill="3"><b>1901</b></span>年</span><div class="figure tfig"><img src="assets/renpo_seiritsu.webp" alt="連邦の成立 ── 石造りの議事堂ふうの建物と広場"></div><div class="tt">独立して国になる</div><div class="tb">本国から独立し、オーストラリア連邦が成立した。</div></div>
    </div>
    <div class="rk-note" data-at="3"><span>ポイント</span><span>先住民の名前、もとの本国、独立の年。この3点セットで覚える。</span></div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
