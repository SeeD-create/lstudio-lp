<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>多文化社会へ｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tb-safe { inset: 100px 150px 96px; align-content: center; gap: 40px; }
  .tb-head { display: grid; gap: 14px; }
  .arrow { display:grid; grid-template-columns: 1fr 120px 1fr; align-items:center; gap:20px; }
  .abox { border-radius:22px; padding:34px 38px; display:grid; gap:12px; box-shadow:0 14px 30px rgba(40,30,10,.1); }
  .a-old { background:var(--paper-lo); border:3px solid var(--sumi-mute); }
  .a-new { background:var(--paper-hi); border:3px solid var(--imp); }
  .abox .ah { font-size:26px; font-weight:900; letter-spacing:.06em; }
  .a-old .ah { color:var(--sumi-mute); }
  .a-new .ah { color:var(--imp); }
  .abox .ab { font-size:31px; font-weight:800; color:var(--sumi); line-height:1.45; }
  .abox .ab small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:600; margin-top:6px; }
  .abox .blank { font-size:33px; }
  .ar { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; color:var(--imp); text-align:center; }
  .tb-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:29px; line-height:1.5; }
  .tb-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe tb-safe">
    <div class="tb-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-6</span>　社会の変化</span>
      <h1 class="headline" style="font-size:56px;">白豪主義をやめて、<span class="em">多文化</span>の国へ</h1>
    </div>
    <div class="arrow">
      <div class="abox a-old" data-at="1" data-anim="left"><div class="ah">かつて</div><div class="ab">白豪主義<small>白人中心。アジア系の移民を制限していた</small></div></div>
      <div class="ar" data-at="2" data-anim="pop">▶</div>
      <div class="abox a-new" data-at="3" data-anim="right"><div class="ah">現在</div><div class="ab"><span class="blank" data-fill="3"><b>多文化社会</b></span><small>さまざまな民族が、たがいの文化を認め合って暮らす</small></div></div>
    </div>
    <div class="tb-note" data-at="4"><span>今のすがた</span><span>近年は<b>アジアからの移民</b>が増加。中国語やベトナム語も飛びかう。先住民<b>アボリジニ</b>の文化を守る動きも進む。</span></div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
