<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日本との貿易（輸入品）｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bk-safe { inset: 92px 150px 88px; align-content: center; gap: 30px; }
  .bk-head { display: grid; gap: 12px; }
  .bk-row { display:grid; grid-template-columns: 1fr 1fr; gap:44px; }
  .chart { background:var(--paper-hi); border-radius:22px; border:3px solid var(--sumi); box-shadow:0 14px 30px rgba(40,30,10,.1); padding:28px 32px; display:grid; gap:16px; }
  .chart .ctt { font-size:30px; font-weight:900; color:var(--sumi); display:flex; align-items:center; gap:14px; }
  .chart .ctt .pin { font-family:'Zen Old Mincho',serif; font-size:22px; color:#fff; background:var(--c); border-radius:8px; padding:4px 14px; }
  .bars { display:grid; gap:12px; }
  .bar { display:grid; grid-template-columns: 190px 1fr; align-items:center; gap:16px; }
  .bar .bl { font-size:24px; font-weight:800; color:var(--sumi); text-align:right; }
  .bar .bl .blank { font-size:25px; }
  .bar .bt { height:44px; border-radius:8px; background:var(--c); display:flex; align-items:center; justify-content:flex-end; padding-right:14px; color:#fff; font-weight:900; font-size:22px; min-width:64px; }
  .bar.sub .bt { background:var(--sumi-mute); }
  .bar.oth .bt { background:var(--paper-lo); color:var(--sumi-mute); }
  .bk-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; font-size:28px; line-height:1.5; }
  .bk-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe bk-safe">
    <div class="bk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-9</span>　日本との貿易</span>
      <h1 class="headline" style="font-size:50px;">石炭も鉄鉱石も、<span class="em">日本の輸入相手は同じ国</span></h1>
    </div>
    <div class="bk-row">
      <div class="chart" style="--c:#3a3a3a" data-at="1" data-anim="pop">
        <div class="ctt"><span class="pin">石炭</span>日本の輸入相手（2022年）</div>
        <div class="bars">
          <div class="bar"><span class="bl"><span class="blank" data-fill="1"><b>オーストラリア</b></span></span><span class="bt" style="width:100%;">67％</span></div>
          <div class="bar sub"><span class="bl">インドネシア</span><span class="bt" style="width:21%;">14</span></div>
          <div class="bar sub"><span class="bl">ロシア</span><span class="bt" style="width:10%;">6</span></div>
          <div class="bar oth"><span class="bl">その他</span><span class="bt" style="width:19%;">13</span></div>
        </div>
      </div>
      <div class="chart" style="--c:#a0492f" data-at="2" data-anim="pop">
        <div class="ctt"><span class="pin">鉄鉱石</span>日本の輸入相手（2022年）</div>
        <div class="bars">
          <div class="bar"><span class="bl"><span class="blank" data-fill="2"><b>オーストラリア</b></span></span><span class="bt" style="width:100%;">58％</span></div>
          <div class="bar sub"><span class="bl">ブラジル</span><span class="bt" style="width:48%;">28</span></div>
          <div class="bar sub"><span class="bl">カナダ</span><span class="bt" style="width:14%;">8</span></div>
          <div class="bar oth"><span class="bl">その他</span><span class="bt" style="width:12%;">6</span></div>
        </div>
      </div>
    </div>
    <div class="bk-note" data-at="3"><span>ここが大事</span><span>日本は資源のとぼしい国。<b>石炭・鉄鉱石</b>という工業のもとを、この国から大量に運んでいる。</span></div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
