<title>白豪主義｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hg-safe { inset: 96px 150px 92px; grid-template-columns: 1fr 620px; align-content: center; gap: 60px; align-items: center; }
  .hg-left { display:grid; gap:26px; align-content:center; }
  .hg-word { display:grid; gap:12px; }
  .hg-word .lb { font-size:26px; font-weight:900; letter-spacing:.1em; color:var(--cat); }
  .hg-word .bg { font-size:120px; font-weight:900; line-height:1; color:var(--sumi); font-family:'Zen Old Mincho',serif; }
  .hg-word .bg .blank { font-size:120px; }
  .hg-def { background:var(--sumi); color:var(--paper-hi); border-radius:22px; padding:34px 40px; font-size:34px; line-height:1.6; }
  .hg-def b { color:var(--gold-soft); }
  .hg-right { display:grid; gap:18px; }
  .pt { display:flex; gap:20px; align-items:flex-start; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 16px 16px 0; padding:24px 30px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .pt .ic { flex:none; width:52px; height:52px; border-radius:50%; background:var(--c); color:#fff; font-weight:900; font-size:28px; display:flex; align-items:center; justify-content:center; }
  .pt .tx { font-size:28px; font-weight:700; color:var(--sumi); line-height:1.45; }
  .pt .tx small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:600; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe hg-safe">
    <div class="hg-left">
      <div class="hg-word" data-at="0">
        <span class="lb">Ⅰ-5　かつての政策</span>
        <span class="bg"><span class="blank" data-fill="1"><b>白豪主義</b></span></span>
      </div>
      <div class="hg-def" data-at="2" data-anim="pop">白人を中心に国をつくろうとして、<b>白人以外（アジアなど）の移民を制限</b>した政策。「白い豪州（オーストラリア）」という意味。</div>
    </div>
    <div class="hg-right">
      <div class="pt" style="--c:#8f8f8b" data-at="3" data-anim="left"><span class="ic">背</span><span class="tx">もとはイギリスの植民地<small>白人中心の社会がつくられた</small></span></div>
      <div class="pt" style="--c:#c4161c" data-at="4" data-anim="left"><span class="ic">中</span><span class="tx"><span class="imp">アジア系の移民</span>を受け入れなかった<small>労働者として来る人々を制限した</small></span></div>
      <div class="pt" style="--c:#5f9a52" data-at="5" data-anim="left"><span class="ic">後</span><span class="tx">1970年代に<span class="imp">廃止</span>された<small>やがて多くの民族を受け入れる国へ</small></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
