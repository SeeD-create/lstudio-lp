<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>太平洋の島々とサンゴ礁｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sm-safe { inset: 90px 150px 86px; grid-template-columns: 1fr 620px; align-content: center; gap: 52px; align-items: center; }
  .sm-left { display:grid; gap:20px; align-content:center; }
  .sm-head { display:grid; gap:12px; }
  .types { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .tp { background:var(--paper-hi); border-radius:16px; border:3px solid var(--c); padding:20px 22px; display:grid; gap:6px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .tp .th { font-size:26px; font-weight:900; color:var(--c); }
  .tp .tb { font-size:22px; color:var(--sumi-soft); line-height:1.4; font-weight:600; }
  .tp .blank { font-size:26px; }
  .sm-def { background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:24px 28px; font-size:26px; line-height:1.55; }
  .sm-def b { color:var(--gold-soft); }
  .gbr { border-radius:24px; overflow:hidden; border:3px solid var(--sumi); box-shadow:0 16px 38px rgba(40,30,10,.14); }
  .gbr .pic { height:420px; position:relative; overflow:hidden; }
  .gbr .pic img { display:block; width:100%; height:100%; object-fit:cover; }
  .gbr .pic .cap { position:absolute; left:22px; top:20px; color:#fff; font-weight:900; font-size:24px; text-shadow:0 2px 8px rgba(0,0,0,.55); }
  .gbr .body { background:var(--paper-hi); padding:24px 30px; display:grid; gap:10px; }
  .gbr .body .gt { font-size:34px; font-weight:900; color:var(--sumi); }
  .gbr .body .gt .blank { font-size:36px; }
  .gbr .body .gb { font-size:24px; color:var(--sumi-soft); line-height:1.5; font-weight:600; }
  .gbr .body .gb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sm-safe">
    <div class="sm-left">
      <div class="sm-head" data-at="0">
        <span class="kicker"><span class="num">Ⅱ-2</span>　太平洋の島々</span>
        <h1 class="headline" style="font-size:46px;">海にうかぶ<span class="em">サンゴ</span>の島</h1>
      </div>
      <div class="types" data-at="1" data-anim="pop">
        <div class="tp" style="--c:#8a6b3a"><div class="th">火山の島</div><div class="tb">噴火でできた高い島。土地が高い</div></div>
        <div class="tp" style="--c:#2f9fc4"><div class="th"><span class="blank" data-fill="1"><b>サンゴ礁</b></span>の島</div><div class="tb">サンゴが作る低く平らな島</div></div>
      </div>
      <div class="sm-def" data-at="2" data-anim="pop">①は、あたたかく浅い海でサンゴが育ってできる地形。美しい海が広がり、多くの島が<b>観光地</b>になっている。</div>
    </div>
    <div class="gbr" data-at="3" data-anim="right">
      <div class="pic"><img src="assets/sangosho.webp" alt="サンゴ礁 ── 白い浅瀬とサンゴが透ける青い海"><span class="cap">オーストラリア北東の沖</span></div>
      <div class="body">
        <div class="gt"><span class="blank" data-fill="3"><b>グレートバリアリーフ</b></span></div>
        <div class="gb">オーストラリア北東の沖に広がる<b>世界最大のもの</b>。世界遺産に登録され、世界じゅうから観光客が訪れる。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
