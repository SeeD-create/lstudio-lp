<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ニュージーランド｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nz-safe { inset: 90px 150px 88px; grid-template-columns: 460px 1fr; align-content: center; gap: 56px; align-items: center; }
  .nz-head { display: grid; gap: 18px; align-content: start; }
  .nz-fig { width: 420px; height: 278px; border-radius: 20px; border: 3px solid var(--cat);
    box-shadow: 0 16px 34px rgba(40,30,10,.14); }
  .nz-flag { width: 420px; height: 264px; border-radius:16px; background:#12224f; border:3px solid var(--sumi); box-shadow:0 16px 34px rgba(40,30,10,.16); position:relative; overflow:hidden; }
  .nz-flag .uj { position:absolute; left:0; top:0; width:200px; height:132px; background:#26438f; }
  .nz-flag .uj::before{content:"";position:absolute;inset:0;background:
    linear-gradient(to bottom right,transparent calc(50% - 3px),#fff calc(50% - 3px),#fff calc(50% + 3px),transparent calc(50% + 3px)),
    linear-gradient(to bottom left,transparent calc(50% - 3px),#fff calc(50% - 3px),#fff calc(50% + 3px),transparent calc(50% + 3px));}
  .nz-flag .uj::after{content:"";position:absolute;left:50%;top:0;width:22px;height:100%;transform:translateX(-50%);background:#C8102E;box-shadow:0 0 0 4px #fff;}
  .nz-flag .ujc{position:absolute;left:0;top:50%;width:200px;height:22px;transform:translateY(-50%);background:#C8102E;box-shadow:0 0 0 4px #fff;}
  .nz-flag .st{position:absolute;color:#C8102E;font-size:40px;-webkit-text-stroke:2px #fff;}
  .nz-rows { display: grid; gap: 15px; }
  .prow { display:flex; align-items:center; gap:24px; background: var(--paper-hi); border-left: 9px solid var(--cat); border-radius: 0 16px 16px 0; padding: 17px 30px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .prow .k { flex:none; width:130px; font-size:26px; font-weight:900; color:var(--cat); }
  .prow .v { font-size:29px; font-weight:700; color:var(--sumi); line-height:1.35; }
  .prow .v small { display:block; color:var(--sumi-mute); font-size:22px; font-weight:600; }
  .prow .v .blank { font-size:31px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe nz-safe">
    <div class="nz-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-1</span>　ニュージーランド</span>
      <h1 class="headline" style="font-size:48px;"><span class="em">先住民</span>と羊の国</h1>
      <div class="figure nz-fig" data-at="0" data-anim="pop"><img src="assets/nz_bokujo.webp" alt="ニュージーランドの牧場 ── 緑の丘に広がる羊の群れと奥の雪山"></div>
      <div class="nz-flag"><span class="uj"></span><span class="ujc"></span><span class="st" style="right:24px;bottom:20px;">★</span><span class="st" style="right:96px;top:26px;font-size:26px;">★</span><span class="st" style="right:52px;top:88px;font-size:26px;">★</span><span class="st" style="right:120px;bottom:34px;font-size:26px;">★</span></div>
    </div>
    <div class="nz-rows">
      <div class="prow" data-at="1" data-anim="left"><span class="k">先住民</span><span class="v"><span class="blank" data-fill="1"><b>マオリ</b></span>　<small>独自の言葉・文化をもつ。その言葉も公用語</small></span></div>
      <div class="prow" data-at="2" data-anim="left"><span class="k">農業</span><span class="v">牧羊と<span class="blank" data-fill="2"><b>酪農</b></span>がさかん　<small>羊の数は人口よりずっと多い</small></span></div>
      <div class="prow" data-at="3" data-anim="left"><span class="k">輸出品</span><span class="v">羊毛・バター・チーズ・肉　<small>牧場でつくる品が中心</small></span></div>
      <div class="prow" data-at="4" data-anim="left"><span class="k">自然</span><span class="v">火山や温泉が多い　<small>日本と同じく地震も。緑ゆたかで観光もさかん</small></span></div>
      <div class="prow" data-at="5" data-anim="left"><span class="k">歴史</span><span class="v">もとは<span class="imp">イギリス</span>の植民地　<small>英語が公用語。ラグビーが有名</small></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
