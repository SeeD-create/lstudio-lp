<div class="seed-stage"><div class="seed-slide" data-cat="eq">

      <h1 class="headline" style="font-size:54px;">大洋にうかぶ<br><span class="em">4つ</span>のまとまり</h1>
      <div class="mn-def" data-at="1" data-anim="pop">オセアニア＝<b>「大洋州」</b>。<br>大きな大陸①と、太平洋にちらばる<b>3つの島々</b>でできている。島々は言葉の意味で名づけられている。</div>
    </div>
