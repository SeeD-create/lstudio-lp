<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>総仕上げ ── オセアニア州○×クイズ｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fq-safe { inset: 84px 130px 84px; align-content: center; gap: 30px; }
  .fq-head { display: grid; gap: 10px; justify-items:center; text-align:center; }
  .fq-grid { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .fqc { background:var(--paper-hi); border-radius:20px; border:3px solid var(--sumi); box-shadow:0 12px 26px rgba(40,30,10,.1); padding:28px 32px; display:grid; grid-template-columns:1fr 120px; align-items:center; gap:20px; }
  .fqc .q { font-size:29px; font-weight:800; color:var(--sumi); line-height:1.45; }
  .fqc .q .u { color:var(--imp); }
  .fqc .m { justify-self:center; }
  .fqc .m .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; }
  .fqc .m .mk.o { color:#2f7d4f; }
  .fqc .m .mk.x { color:var(--imp); }
  .fqc .m .ex { font-size:20px; color:var(--sumi-mute); font-weight:700; line-height:1.3; text-align:center; margin-top:4px; }
  .fqc .m .blank { min-width:96px; padding:0 10px 4px; margin:0; }
  .fqc .m .ex.blank--para { padding:2px 8px; min-width:110px; text-align:center; }
  .fqc .m .blank--para b { color:var(--sumi-mute); font-family:inherit; font-weight:700; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fq-safe">
    <div class="fq-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>総仕上げ・○×クイズ</span>
      <h1 class="headline" style="font-size:48px;">オセアニア州、<span class="em">最終チェック</span></h1>
    </div>
    <div class="fq-grid">
      <div class="fqc" data-at="1" data-anim="pop">
        <div class="q">① オーストラリアの先住民は<span class="u">マオリ</span>である。</div>
        <div class="m"><div class="mk x blank" data-fill="1"><b>×</b></div><div class="ex blank blank--para" data-fill="1"><b>正しくは<br>アボリジニ</b></div></div>
      </div>
      <div class="fqc" data-at="2" data-anim="pop">
        <div class="q">② オーストラリア<span class="u">西部</span>では鉄鉱石が多くとれる。</div>
        <div class="m"><div class="mk o blank" data-fill="2"><b>○</b></div><div class="ex blank blank--para" data-fill="2"><b>東部は石炭</b></div></div>
      </div>
      <div class="fqc" data-at="3" data-anim="pop">
        <div class="q">③ かつての<span class="u">白豪主義</span>は、今も続いている。</div>
        <div class="m"><div class="mk x blank" data-fill="3"><b>×</b></div><div class="ex blank blank--para" data-fill="3"><b>廃止→<br>多文化社会</b></div></div>
      </div>
      <div class="fqc" data-at="4" data-anim="pop">
        <div class="q">④ 世界最大のサンゴ礁を<span class="u">グレートバリアリーフ</span>という。</div>
        <div class="m"><div class="mk o blank" data-fill="4"><b>○</b></div><div class="ex blank blank--para" data-fill="4"><b>豪州北東の沖</b></div></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
