<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>オーストラリアの農業｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ng-safe { inset: 92px 140px 88px; align-content: center; gap: 34px; }
  .ng-head { display: grid; gap: 12px; }
  .ng-row { display:grid; grid-template-columns: repeat(3,1fr); gap:30px; }
  .ncard { background:var(--paper-hi); border-radius:22px; border:3px solid var(--c); box-shadow:0 14px 30px rgba(40,30,10,.1); overflow:hidden; display:grid; align-content:start; }
  .ncard .ch { background:var(--c); color:#fff; padding:20px 26px; display:flex; align-items:center; gap:16px; }
  .ncard .ch .em2 { font-size:46px; }
  .ncard .ch .nm { font-size:34px; font-weight:900; }
  .ncard .ch .nm .blank { font-size:36px; }
  .nfig { height: 286px; border-radius: 0; box-shadow: none; border-bottom: 3px solid var(--c); }
  .ncard .cb { padding:24px 28px; display:grid; gap:12px; }
  .ncard .cb li { list-style:none; font-size:25px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .ncard .cb li small { display:block; font-size:20px; color:var(--sumi-mute); font-weight:600; }
  .ncard .cb li .imp { color:var(--imp); }
  .ng-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; font-size:28px; line-height:1.5; }
  .ng-note b { color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ng-safe">
    <div class="ng-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-7</span>　農業</span>
      <h1 class="headline" style="font-size:52px;">羊・牛・穀物の<span class="em">三本柱</span></h1>
    </div>
    <div class="ng-row">
      <div class="ncard" style="--c:#8f8f8b" data-at="1" data-anim="pop">
        <div class="ch"><span class="em2">🐑</span><span class="nm"><span class="blank" data-fill="1"><b>羊</b></span></span></div>
        <div class="figure nfig"><img src="assets/bokuyo_hitsuji.webp" alt="牧羊 ── かわいた草原に広がる羊の大群"></div>
        <div class="cb"><ul style="padding:0;margin:0;display:grid;gap:12px;">
          <li>世界有数の<span class="imp">羊毛</span>の生産国<small>牧羊（羊の放牧）がさかん</small></li>
          <li>内陸の乾燥地帯や南部で飼育<small>掘り抜き井戸の地下水を利用</small></li>
        </ul></div>
      </div>
      <div class="ncard" style="--c:#b7813e" data-at="2" data-anim="pop">
        <div class="ch"><span class="em2">🐄</span><span class="nm"><span class="blank" data-fill="2"><b>牛</b></span></span></div>
        <div class="figure nfig"><img src="assets/hoboku_ushi.webp" alt="北部の放牧 ── まばらな木が立つ草原と肉牛の群れ"></div>
        <div class="cb"><ul style="padding:0;margin:0;display:grid;gap:12px;">
          <li>北部の<span class="imp">熱帯</span>で放牧<small>食用に飼われる家畜</small></li>
          <li>牛肉（肉類）を日本へ輸出<small>日本の輸入牛肉の上位</small></li>
        </ul></div>
      </div>
      <div class="ncard" style="--c:#c9a83e" data-at="3" data-anim="pop">
        <div class="ch"><span class="em2">🌾</span><span class="nm"><span class="blank" data-fill="3"><b>小麦</b></span></span></div>
        <div class="figure nfig"><img src="assets/komugi_batake.webp" alt="小麦畑 ── 地平線まで続く黄金色の畑と大型のコンバイン"></div>
        <div class="cb"><ul style="padding:0;margin:0;display:grid;gap:12px;">
          <li>南西部・南東部で大規模栽培<small>雨のある温帯の地域</small></li>
          <li>大型機械で広い畑を耕す<small>日本へも輸出する</small></li>
        </ul></div>
      </div>
    </div>
    <div class="ng-note" data-at="4"><span>覚え方</span><span>かわいた<b>内陸＝羊</b>／あつい<b>北部＝牛</b>／雨のある<b>南＝麦</b>。気候と農業がセットになっている。</span></div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
