<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>オーストラリアの気候｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 86px 150px 86px; grid-template-columns: 540px 1fr; align-content: center; gap: 56px; align-items: center; }
  .kk-head { display: grid; gap: 16px; align-content:start; }
  .kk-fig { width: 500px; border-radius: 20px; overflow:hidden; border:3px solid var(--sumi); box-shadow:0 14px 30px rgba(40,30,10,.12); }
  .kk-fig .band { padding: 30px 26px; display:flex; align-items:center; gap:16px; color:#2a2a2a; font-weight:900; }
  .kk-fig .band .tag { font-family:'Zen Old Mincho',serif; font-size:22px; opacity:.7; }
  .kk-fig .band .nm { font-size:32px; }
  .b-trop { background:#CDE7C4; }
  .b-arid { background:#EBD9A6; padding-top:46px !important; padding-bottom:46px !important; }
  .b-temp { background:#BFD6E8; }
  .kk-photo { width: 500px; height: 252px; border-radius: 20px; border: 3px solid var(--sumi);
    box-shadow: 0 14px 30px rgba(40,30,10,.12); }
  .kk-rows { display: grid; gap: 16px; }
  .krow { display:flex; align-items:center; gap:22px; background: var(--paper-hi); border-left: 9px solid var(--c); border-radius: 0 16px 16px 0; padding: 20px 30px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .krow .k { flex:none; width:190px; font-size:26px; font-weight:900; color:var(--sumi); line-height:1.3; }
  .krow .v { font-size:29px; font-weight:700; color:var(--sumi); line-height:1.35; }
  .krow .v small { display:block; color:var(--sumi-mute); font-size:22px; font-weight:600; }
  .krow .v .blank { font-size:31px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-2</span>　気候</span>
      <h1 class="headline" style="font-size:50px;">北は暑く、<br>内陸は<span class="em">砂漠</span></h1>
      <div class="kk-fig" data-at="1" data-anim="pop">
        <div class="band b-trop"><span class="tag">北</span><span class="nm">①</span></div>
        <div class="band b-arid"><span class="tag">中・西（内陸）</span><span class="nm">②（砂漠）</span></div>
        <div class="band b-temp"><span class="tag">南西・南東</span><span class="nm">③</span></div>
      </div>
      <div class="figure kk-photo" data-at="3" data-anim="pop"><img src="assets/naikoku_sabaku.webp" alt="内陸の乾燥帯 ── 赤茶けた砂と低木が広がる砂漠"></div>
    </div>
    <div class="kk-rows">
      <div class="krow" style="--c:#5f9a52" data-at="2" data-anim="left"><span class="k">北部</span><span class="v"><span class="blank" data-fill="2"><b>熱帯</b></span><small>赤道に近く、一年じゅう高温で雨が多い</small></span></div>
      <div class="krow" style="--c:#c9a83e" data-at="3" data-anim="left"><span class="k">中央・西部（内陸）</span><span class="v"><span class="blank" data-fill="3"><b>乾燥帯</b></span><small>国土の大半を占める砂漠。雨がとても少ない</small></span></div>
      <div class="krow" style="--c:#4f7fa8" data-at="4" data-anim="left"><span class="k">南西部・南東部</span><span class="v"><span class="blank" data-fill="4"><b>温帯</b></span><small>過ごしやすく、大都市や畑・牧場が集まる</small></span></div>
      <div class="krow" style="--c:#8f8f8b" data-at="5" data-anim="left"><span class="k">要点</span><span class="v">国土の多くは<span class="imp">乾燥</span>していて人が住みにくい<small>人口は雨の多い南東部の海ぞいに集中する</small></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
