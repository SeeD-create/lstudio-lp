<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>貿易相手の変化とAPEC｜中1地理 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ba-safe { inset: 92px 150px 88px; align-content: center; gap: 34px; }
  .ba-head { display: grid; gap: 12px; }
  .arrow { display:grid; grid-template-columns: 1fr 110px 1fr; align-items:center; gap:20px; }
  .abox { border-radius:22px; padding:32px 36px; display:grid; gap:10px; box-shadow:0 14px 30px rgba(40,30,10,.1); }
  .a-old { background:var(--paper-lo); border:3px solid var(--sumi-mute); }
  .a-new { background:var(--paper-hi); border:3px solid var(--imp); }
  .abox .ah { font-size:25px; font-weight:900; letter-spacing:.06em; }
  .a-old .ah { color:var(--sumi-mute); }
  .a-new .ah { color:var(--imp); }
  .abox .ab { font-size:30px; font-weight:800; color:var(--sumi); line-height:1.4; }
  .abox .ab small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:600; margin-top:6px; }
  .abox .blank { font-size:32px; }
  .ar { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:80px; color:var(--imp); text-align:center; }
  .apec { display:flex; align-items:center; gap:26px; background: var(--paper-hi); color: var(--sumi); border-radius:20px; padding:25px 37px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .apec .big { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color: var(--sumi); white-space:nowrap; }
  .apec .big .blank { font-size:52px; }
  .apec .tx { font-size:27px; line-height:1.5; color: var(--sumi); }
  .apec .tx b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe ba-safe">
    <div class="ba-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-10</span>　貿易相手の変化</span>
      <h1 class="headline" style="font-size:52px;">遠い本国から、<span class="em">近い国々</span>へ</h1>
    </div>
    <div class="arrow">
      <div class="abox a-old" data-at="1" data-anim="left"><div class="ah">かつて</div><div class="ab">本国<span class="blank" data-fill="1"><b>イギリス</b></span>が貿易の中心<small>羊毛などを本国へ運んでいた</small></div></div>
      <div class="ar" data-at="2" data-anim="pop">▶</div>
      <div class="abox a-new" data-at="3" data-anim="right"><div class="ah">現在</div><div class="ab">近くの<span class="blank" data-fill="3"><b>アジア</b></span>が中心に<small>最大の相手は中国。日本とも結びつきが強い</small></div></div>
    </div>
    <div class="apec" data-at="4" data-anim="pop">
      <span class="big"><span class="blank" data-fill="4"><b>APEC</b></span></span>
      <span class="tx"><b>太平洋をかこむ国々の経済協力の会議</b>。太平洋をとりかこむ国々（日本・オーストラリア・アメリカなど）が経済で協力する集まり。オーストラリアも参加している。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 オセアニア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
