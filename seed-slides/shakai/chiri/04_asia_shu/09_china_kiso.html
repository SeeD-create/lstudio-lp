<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中国のプロフィール ── 14億人の大国｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .pr-safe { inset: 90px 150px 88px; grid-template-columns: 520px 1fr; align-content: center; gap: 56px; align-items: center; }
  .pr-head { display: grid; gap: 16px; align-content: start; }
  .flag { width: 460px; height: 300px; border-radius: 18px; background:#DE2910; border:3px solid var(--sumi); box-shadow:0 16px 34px rgba(40,30,10,.16); position:relative; }
  .flag .big { position:absolute; left:70px; top:70px; color:#FFDE00; font-size:60px; }
  .flag .sm { position:absolute; color:#FFDE00; font-size:24px; }
  .pr-rows { display: grid; gap: 15px; }
  .prow { display:flex; align-items:center; gap:24px; background: var(--paper-hi); border-left: 9px solid var(--cat); border-radius: 0 16px 16px 0; padding: 18px 30px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .prow .k { flex:none; width:150px; font-size:27px; font-weight:900; color:var(--cat); }
  .prow .v { font-size:31px; font-weight:700; color:var(--sumi); line-height:1.3; }
  .prow .v small { color:var(--sumi-mute); font-size:24px; font-weight:600; }
  .prow .v .blank { font-size:33px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe pr-safe">
    <div class="pr-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-1</span>　中国</span>
      <h1 class="headline" style="font-size:56px;">中国 ── アジア最大の<br><span class="em">人口大国</span></h1>
      <div class="flag"><span class="big">★</span><span class="sm" style="left:150px;top:48px;">★</span><span class="sm" style="left:172px;top:82px;">★</span><span class="sm" style="left:172px;top:120px;">★</span><span class="sm" style="left:150px;top:150px;">★</span></div>
    </div>
    <div class="pr-rows">
      <div class="prow" data-at="1" data-anim="left"><span class="k">首都</span><span class="v"><span class="blank" data-fill="1"><span class="bnum">①</span><b>ペキン（北京）</b></span></span></div>
      <div class="prow" data-at="2" data-anim="left"><span class="k">面積</span><span class="v">約960万km²　<small>日本の約25倍・世界第4位の広さ</small></span></div>
      <div class="prow" data-at="3" data-anim="left"><span class="k">人口</span><span class="v">約<span class="blank" data-fill="3"><span class="bnum">③</span><b>14億</b></span>人　<small>世界有数の人口大国</small></span></div>
      <div class="prow" data-at="4" data-anim="left"><span class="k">人口政策</span><span class="v"><span class="blank" data-fill="4"><span class="bnum">④</span><b>一人っ子政策</b></span>　<small>人口増加をおさえた。2016年に廃止</small></span></div>
      <div class="prow" data-at="5" data-anim="left"><span class="k">民族</span><span class="v">約90％が<span class="blank" data-fill="5"><span class="bnum">⑤</span><b>漢民族</b></span>　<small>ほか50超の少数民族</small></span></div>
      <div class="prow" data-at="6" data-anim="left"><span class="k">気候</span><span class="v">季節風（モンスーン）で<span class="imp">はっきりした四季</span></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
