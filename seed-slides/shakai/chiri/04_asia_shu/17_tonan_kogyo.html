<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>商品作物と工業 ── 天然ゴム・アジアNIES｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { inset: 90px 130px 88px; align-content: start; gap: 28px; }
  .tk-head { display: grid; gap: 12px; }
  .tk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .cc { position:relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 28px 34px; display:grid; grid-template-columns: 318px 1fr; column-gap: 28px; align-items:center; }
  .cc .cfig { height: 296px; border-radius: 16px; border: 3px solid var(--c); }
  .cc .crow { display:flex; align-items:center; gap:26px; }
  .cc .ci { flex:none; width:76px; height:76px; border-radius:50%; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center; font-size:40px; }
  .cc .ct { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); line-height:1.2; }
  .cc .ct .blank { font-size:36px; }
  .cc .ct small { display:block; font-size:23px; color:var(--sumi-soft); font-weight:600; margin-top:4px; }
  .kbox { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.10); padding: 28px 40px; display:flex; align-items:center; gap:34px; }
  .kbox .kt { flex:none; width:340px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--cat); }
  .kbox .kt .blank { font-size:40px; }
  .kbox .kd { font-size: 28px; line-height: 1.5; color: var(--sumi-soft); }
  .kbox .kd b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe tk-safe">
    <div class="tk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-3</span>　商品作物と工業</span>
      <h1 class="headline" style="font-size:54px;">世界に売る<span class="em">作物</span>と、急成長した<span class="em">工業</span></h1>
    </div>
    <div class="tk-row">
      <div class="cc" style="--c:#3A7D44" data-at="1" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/tonan_gomu.webp" alt="天然ゴム ── 幹の切り口から白い樹液を集める"></div>
        <div class="crow">
          <div class="ci">ゴ</div>
          <div class="ct"><span class="blank" data-fill="1"><span class="bnum">⑥</span><b>天然ゴム</b></span><small>タイ・インドネシア・ベトナムで世界の約70％を生産</small></div>
        </div>
      </div>
      <div class="cc" style="--c:#C9902A" data-at="2" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/tonan_aburayashi.webp" alt="油やし ── 赤いオレンジ色の実の房とヤシの林"></div>
        <div class="crow">
          <div class="ci">油</div>
          <div class="ct"><span class="blank" data-fill="2"><span class="bnum">⑦</span><b>油やし</b></span><small>実をしぼった「パーム油」の原料になる</small></div>
        </div>
      </div>
    </div>
    <div class="kbox" data-at="3" data-anim="left">
      <span class="kt"><span class="blank" data-fill="3"><span class="bnum">⑨</span><b>アジアNIES</b></span></span>
      <span class="kd" data-at="4"><b>シンガポール</b>は工業がとても盛んで、台湾・韓国・ホンコンと同じく急速に工業化・経済発展したグループの1つ。</span>
    </div>
    <div class="example" data-at="5" style="--cat:#535250; border-left-color:#535250;">
      <span class="ex-tag">つながり</span>
      <span>大農園でとれる<span class="imp">ゴムやパーム油</span>を輸出。工業国の代表が<span class="imp">シンガポール</span>。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
