<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>南アジアの農業 ── 綿花・茶・稲・小麦｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ng-safe { inset: 90px 130px 88px; align-content: start; gap: 32px; }
  .ng-head { display: grid; gap: 12px; }
  .ng-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .cc { position:relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 26px 24px 28px; display: grid; gap: 12px; align-content: start; min-height: 320px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:11px; background:var(--c); border-radius:18px 18px 0 0; }
  .cc .cfig { height: 278px; border-radius: 16px; border: 3px solid var(--c); }
  .cc .ci { width:64px; height:64px; border-radius:50%; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .cc .cz { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  .cc .cz .blank { font-size:36px; }
  .cc .cb { font-size: 24px; line-height: 1.5; color: var(--sumi-soft); }
  .ng-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:28px; line-height:1.5; }
  .ng-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe ng-safe">
    <div class="ng-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-4</span>　南アジアの農業</span>
      <h1 class="headline" style="font-size:54px;">場所ごとに<span class="em">育てる作物</span>が変わる</h1>
    </div>
    <div class="ng-row">
      <div class="cc" style="--c:#D98BB0" data-at="1" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/minami_menka.webp" alt="綿花 ── 白い綿がはじけた畑"></div>
        <div class="ci">綿</div>
        <div class="cz"><span class="blank" data-fill="1"><span class="bnum">⑤</span><b>綿花</b></span></div>
        <div class="cb">デカン高原で栽培。繊維（せんい）の原料になる。</div>
      </div>
      <div class="cc" style="--c:#3A7D44" data-at="2" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/minami_cha.webp" alt="茶 ── 斜面に段々に広がる茶畑"></div>
        <div class="ci">茶</div>
        <div class="cz"><span class="blank" data-fill="2"><span class="bnum">⑥</span><b>茶</b></span></div>
        <div class="cb">インド北部（アッサム）やスリランカで盛ん。</div>
      </div>
      <div class="cc" style="--c:#C9A227" data-at="3" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/minami_inasaku.webp" alt="稲作 ── 大河の下流に広がる水田"></div>
        <div class="ci">米</div>
        <div class="cz"><span class="blank" data-fill="3"><span class="bnum">⑦</span><b>稲作（米）</b></span></div>
        <div class="cb">ガンジス川下流。雨が多い地域で盛ん。</div>
      </div>
      <div class="cc" style="--c:#B8860B" data-at="4" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/minami_komugi.webp" alt="小麦 ── 雨の少ない乾いた土地の小麦畑"></div>
        <div class="ci">麦</div>
        <div class="cz"><span class="blank" data-fill="4"><span class="bnum">⑧</span><b>小麦</b></span></div>
        <div class="cb">ガンジス川上流やインダス川流域。雨が少なめの地域で。</div>
      </div>
    </div>
    <div class="ng-note" data-at="5" data-anim="fade">
      <span>ポイント</span>
      <span>川の<b>下流（雨多い）</b>と<b>上流（雨少ない）</b>で作物がちがう。デカン高原の作物もセットで。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
