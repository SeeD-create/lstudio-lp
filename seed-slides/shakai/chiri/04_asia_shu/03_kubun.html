<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アジアの区分 ── 5つの地域｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 96px 130px 96px; align-content: start; gap: 40px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 28px 24px 30px; min-height: 470px; display: grid; align-content: start; gap: 16px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--c); opacity:.5; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); line-height:1.15; }
  .cc__ttl .blank { font-size:30px; }
  .cc__ess { font-size:25px; color:var(--sumi-soft); line-height:1.45; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:7px 16px; border-radius:999px; background:var(--c); color:#fff; font-weight:900; font-size:21px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　アジアの区分</span>
      <h1 class="headline" style="font-size:64px;">広いアジアは、大きく<span class="goldem">5つの地域</span>に分ける</h1>
    </div>
    <div class="deck-row">
      <div class="cc" style="--c:#C0392B" data-at="1" data-anim="pop">
        <div class="cc__no">Ⅰ</div>
        <div class="cc__ttl"><span class="blank" data-fill="1"><span class="bnum">①</span><b>東アジア</b></span></div>
        <div class="cc__ess">中国・韓国・モンゴル・台湾・日本。世界の工場・稲作の本場。</div>
        <span class="cc__pill">中国</span>
      </div>
      <div class="cc" style="--c:#2E8B57" data-at="2" data-anim="pop">
        <div class="cc__no">Ⅱ</div>
        <div class="cc__ttl"><span class="blank" data-fill="2"><span class="bnum">②</span><b>東南アジア</b></span></div>
        <div class="cc__ess">ASEAN 10か国。熱帯の稲作とプランテーション。</div>
        <span class="cc__pill">ASEAN</span>
      </div>
      <div class="cc" style="--c:#E67E22" data-at="3" data-anim="pop">
        <div class="cc__no">Ⅲ</div>
        <div class="cc__ttl"><span class="blank" data-fill="3"><span class="bnum">③</span><b>南アジア</b></span></div>
        <div class="cc__ess">インドが中心。ヒンドゥー教とICT産業。</div>
        <span class="cc__pill">インド</span>
      </div>
      <div class="cc" style="--c:#C9A227" data-at="4" data-anim="pop">
        <div class="cc__no">Ⅳ</div>
        <div class="cc__ttl"><span class="blank" data-fill="4"><span class="bnum">④</span><b>西アジア</b></span></div>
        <div class="cc__ess">石油とイスラム教。ペルシャ湾ぞいの産油国。</div>
        <span class="cc__pill">石油</span>
      </div>
      <div class="cc" style="--c:#7D5BA6" data-at="5" data-anim="pop">
        <div class="cc__no">Ⅴ</div>
        <div class="cc__ttl"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>中央アジア</b></span></div>
        <div class="cc__ess">内陸の乾燥した地域。かつてシルクロードが通った。</div>
        <span class="cc__pill">内陸</span>
      </div>
    </div>
    <div class="example" data-at="6" style="--cat:#1A1A1A; border-left-color:#1A1A1A;">
      <span class="ex-tag">つかみ方</span>
      <span>「<span class="imp">東・東南・南・西・中央</span>」の5方向でおさえる。まずは①の地域から順に集めていこう。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
