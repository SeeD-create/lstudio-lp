<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アジア州 ── 世界最大の州をカードで集める｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cover-safe { inset: 120px 150px 120px; grid-template-columns: 1fr 780px; align-content: center; gap: 70px; align-items: center; }
  .cover-txt { display: grid; gap: 34px; }
  .cover-kicker { font-size: 30px; letter-spacing:.3em; }
  .cover-title { font-size: 150px; line-height: 1.04; }
  .cover-title .goldem { color: var(--gold-deep); }
  .cover-lead { font-size: 40px; }
  .seal { display:inline-flex; align-items:center; gap:16px; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-deep); font-size:30px; letter-spacing:.08em; }
  .seal .ring { width:56px;height:56px;border-radius:50%;border:4px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:28px; }
  .cover-map { height: 760px; border-radius: 32px; background:#EAF1F6; border:3px solid var(--sumi); box-shadow:0 20px 50px rgba(40,30,10,.18); padding:16px; }
  .cover-map svg { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cover-safe">
    <div class="cover-txt">
      <span class="kicker cover-kicker"><span class="num">第4章</span>　世界の諸地域</span>
      <h1 class="headline cover-title">アジア<span class="goldem">州</span></h1>
      <p class="lead cover-lead">世界の人口の<span class="strong">約6割</span>が住む、地球で最も大きな州。<br>5つの地域を、1枚ずつカードにして集めていこう。</p>
      <span class="seal"><span class="ring">州</span>東・東南・南・西・中央アジア</span>
    </div>
    <div class="cover-map">
      <svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="760" height="760" fill="#EAF1F6"/>
        <!-- ユーラシア東部 大陸ざっくり -->
        <path d="M120,120 Q300,90 520,120 Q640,140 690,240 Q660,300 560,300 Q560,360 620,400 Q560,470 470,470 Q420,540 340,540 Q260,560 210,500 Q120,470 120,360 Q90,240 120,120 Z" fill="#E7C98F" stroke="#9c7b2f" stroke-width="3"/>
        <!-- インド亜大陸 -->
        <path d="M340,540 Q360,600 400,660 Q380,700 350,690 Q320,640 320,560 Z" fill="#E7A06a" stroke="#a85f2a" stroke-width="3"/>
        <!-- アラビア半島 -->
        <path d="M120,360 Q130,470 210,500 Q180,560 130,540 Q90,470 90,400 Z" fill="#E7D06a" stroke="#a8902a" stroke-width="3"/>
        <text x="410" y="230" fill="#7a5a12" font-size="40" font-weight="900" text-anchor="middle" font-family="'Zen Old Mincho',serif">ASIA</text>
        <text x="380" y="620" fill="#8a4f22" font-size="24" font-weight="900" text-anchor="middle">南</text>
        <text x="150" y="470" fill="#8a7222" font-size="24" font-weight="900" text-anchor="middle">西</text>
        <text x="560" y="220" fill="#7a5a12" font-size="24" font-weight="900" text-anchor="middle">東</text>
      </svg>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
