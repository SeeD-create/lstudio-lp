<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>東南アジアの宗教と華僑｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 90px 130px 88px; align-content: start; gap: 28px; }
  .sk-head { display: grid; gap: 12px; }
  .sk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .rc { position:relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 28px 28px;
        display: grid; grid-template-columns: 214px 1fr; column-gap: 22px; row-gap: 10px; align-content:start; min-height: 260px; }
  .rc::before { content:""; position:absolute; left:0; top:0; right:0; height:11px; background:var(--c); border-radius:18px 18px 0 0; }
  .rc .rfig { grid-row: 1 / span 2; align-self: start; height: 292px; border-radius: 14px; border: 3px solid var(--c); }
  .rc .rz { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--c); }
  .rc .rz .blank { font-size:34px; }
  .rc .rl { font-size: 24px; line-height: 1.45; color: var(--sumi-soft); font-weight:600; }
  .kbox { background: var(--paper-hi); color: var(--sumi); border-radius: 20px; padding:23px 37px; display:flex; align-items:center; gap:34px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .kbox .kt { flex:none; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color: var(--sumi); }
  .kbox .kt .blank { font-size:40px; }
  .kbox .kt .blank b { color: var(--imp); }
  .kbox .kd { font-size: 28px; line-height: 1.5; color: var(--sumi); }
  .kbox .kd b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-4</span>　宗教と人々</span>
      <h1 class="headline" style="font-size:56px;">国ごとに<span class="em">宗教</span>がちがう</h1>
    </div>
    <div class="sk-row">
      <div class="rc" style="--c:#C9902A" data-at="1" data-anim="pop">
        <div class="figure figure--soft rfig"><img src="assets/shukyo_bukkyo.webp" alt="仏教 ── 金色の屋根と塔をもつ寺院の外観"></div>
        <div class="rz"><span class="blank" data-fill="1"><b>仏教</b></span></div>
        <div class="rl">タイ・ベトナム・カンボジア・ミャンマー<br>（インドシナ半島の国々に多い）</div>
      </div>
      <div class="rc" style="--c:#5B7DB1" data-at="2" data-anim="pop">
        <div class="figure figure--soft rfig"><img src="assets/shukyo_kirisuto.webp" alt="キリスト教 ── 白い石づくりの教会の外観"></div>
        <div class="rz"><span class="blank" data-fill="2"><b>キリスト教</b></span></div>
        <div class="rl">フィリピン<br>（かつてスペインの植民地だった影響）</div>
      </div>
      <div class="rc" style="--c:#2E8B57" data-at="3" data-anim="pop">
        <div class="figure figure--soft rfig"><img src="assets/shukyo_islam.webp" alt="イスラム教 ── ドームと細い塔をもつモスクの外観"></div>
        <div class="rz"><span class="blank" data-fill="3"><b>イスラム教</b></span></div>
        <div class="rl">インドネシア・マレーシア<br>（インドネシアはこの宗教の信者が世界最多）</div>
      </div>
    </div>
    <div class="kbox" data-at="4" data-anim="left">
      <span class="kt"><span class="blank" data-fill="4"><span class="bnum">華</span><b>華僑</b></span></span>
      <span class="kd">中国から移住してきた人の子孫。東南アジアで経済活動を盛んに行う。とくに<b>シンガポールでは約80％</b>を占める。</span>
    </div>
    <div class="example" data-at="5" style="--cat:#535250; border-left-color:#535250;">
      <span class="ex-tag">覚え方</span>
      <span>島国（<span class="imp">インドネシア・マレーシア</span>）＝イスラム、<span class="imp">フィリピン</span>＝キリスト、半島は寺院の宗教。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
