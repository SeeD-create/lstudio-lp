<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アジアの気候 ── 季節風（モンスーン）｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 92px 150px 90px; align-content: start; gap: 26px; }
  .kk-head { display: grid; gap: 12px; }
  .kk-def { font-size: 34px; line-height: 1.45; color: var(--sumi); font-weight: 700; }
  .kk-def .blank { font-size: 38px; }
  .kk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .clim { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 24px 30px; display: grid; gap: 12px; align-content: start; }
  .clim .cfig { height: 186px; border-radius: 16px; border: 3px solid var(--c); }
  .clim .ch { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--c); }
  .clim .cz { font-size: 34px; font-weight: 900; color: var(--sumi); }
  .clim .cz .blank { font-size: 34px; }
  .clim .cb { font-size: 25px; line-height: 1.5; color: var(--sumi-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　アジアの気候</span>
      <h1 class="headline" style="font-size:62px;">季節でふく向きが変わる風＝<span class="em">季節風</span></h1>
    </div>
    <p class="kk-def" data-at="1">アジアの気候を決めるのは、季節によってふく向きが変わる風。これを
      <span class="blank" data-fill="1"><span class="bnum">⑯</span><b>季節風（モンスーン）</b></span>
      という。夏は海から湿った風がふき、多くの雨をもたらす。</p>
    <div class="kk-row">
      <div class="clim" style="--c:#2E8B57" data-at="2" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/kikou_nettai.webp" alt="熱帯 ── 東南アジアのジャングルとスコール"></div>
        <div class="ch">東南アジア・南アジア</div>
        <div class="cz"><span class="blank" data-fill="2"><span class="bnum">⑩</span><b>熱帯</b></span></div>
        <div class="cb">赤道付近はジャングルが茂り、雨季と乾季がある。南アジアはモンスーンで降水量が多い。</div>
      </div>
      <div class="clim" style="--c:#C0392B" data-at="3" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/kikou_shiki.webp" alt="四季 ── 季節風がもたらす東アジアの実りの秋"></div>
        <div class="ch">東アジア（中国・日本）</div>
        <div class="cz">四季がある</div>
        <div class="cb">季節風の影響で、はっきりとした四季がある。夏は蒸し暑く、冬は乾いて寒い。</div>
      </div>
      <div class="clim" style="--c:#C9A227" data-at="4" data-anim="pop">
        <div class="figure figure--soft cfig"><img src="assets/kikou_kanso.webp" alt="乾燥帯 ── 砂漠とオアシス、らくだの遊牧"></div>
        <div class="ch">西アジア・中央アジア</div>
        <div class="cz"><span class="blank" data-fill="4"><span class="bnum">⑰</span><b>乾燥帯（砂漠）</b></span></div>
        <div class="cb">雨がほとんど降らず、大部分が砂漠。ベドウィンがらくだや羊の遊牧をして暮らす。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
