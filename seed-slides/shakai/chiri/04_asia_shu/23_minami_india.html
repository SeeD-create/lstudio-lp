<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>インドの発展 ── ICT産業と世界一の人口｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .in-safe { inset: 90px 150px 88px; grid-template-columns: 1fr 440px; align-content: center; align-items: center; gap: 44px; }
  .in-main { display: grid; gap: 28px; align-content: center; }
  .in-fig { height: 640px; border-radius: 26px; border: 3px solid var(--cat); }
  .in-head { display: grid; gap: 12px; }
  .fbox { position:relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat); box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 32px 44px; display:flex; align-items:center; gap:36px; }
  .fbox::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius: 19px 0 0 19px; }
  .fbox .ft { flex:none; width:360px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--cat); line-height:1.15; }
  .fbox .ft .blank { font-size:44px; }
  .fbox .fd { font-size: 29px; line-height: 1.55; color: var(--sumi-soft); }
  .fbox .fd b { color: var(--imp); }
  .in-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:29px; line-height:1.5; }
  .in-note b { color: var(--gold-soft); }
  .in-note > span:first-child { white-space: nowrap; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe in-safe">
   <div class="in-main">
    <div class="in-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-3</span>　インドの発展</span>
      <h1 class="headline" style="font-size:56px;">インドは今、<span class="em">急成長</span>している</h1>
    </div>
    <div class="fbox" data-at="1" data-anim="left">
      <span class="ft"><span class="blank" data-fill="1"><span class="bnum">④</span><b>ICT産業</b></span><br><small style="font-size:23px;color:var(--sumi-mute);">（情報通信技術）</small></span>
      <span class="fd" data-at="2">近年とても盛ん。<b>英語が使える人が多い・数学教育が強い・賃金が安い・アメリカと約半日の時差</b>で24時間開発できる、などが理由。ソフトウェア開発の拠点に。</span>
    </div>
    <div class="fbox" data-at="3" data-anim="left">
      <span class="ft">人口<br><span class="blank" data-fill="3"><b>世界一</b></span></span>
      <span class="fd">出生率が高く、<b>中国を抜いて世界最大の人口</b>になった（約14億人）。若い働き手が多く、これからの発展が期待される。</span>
    </div>
    <div class="in-note" data-at="4" data-anim="fade">
      <span>頻出</span>
      <span>インドといえば<b>情報通信の産業</b>と<b>人口の多さ</b>。「情報通信技術＝ICT」も答えられるように。</span>
    </div>
   </div>
   <div class="figure in-fig" data-at="0" data-anim="right"><img src="assets/india_ict.webp" alt="ICT産業 ── ガラス張りのオフィスが並ぶ南インドのIT地区"></div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
