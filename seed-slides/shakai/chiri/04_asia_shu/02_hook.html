  .hk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:30px; line-height:1.5; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　導入</span>
      <h1 class="headline" style="font-size:70px;">アジアって、どれくらい<span class="em">大きい</span>の？</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">6割</div><div class="fttl">世界人口の約60％</div><div class="fbody">約80億人の世界のうち、半分以上がアジアで暮らす。中国とインドだけで約28億人。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">最大</div><div class="fttl">世界最大の州</div><div class="fbody">ユーラシア大陸の東半分をしめる、地球でいちばん広い州。日本もこの中にある。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">多様</div><div class="fttl">気候も宗教もバラバラ</div><div class="fbody">熱帯のジャングルから砂漠まで。仏教・イスラム教・ヒンドゥー教が入り交じる。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span>ねらい</span><span>広すぎて覚えられない？　だから<b>5つの地域に分けて</b>、地域ごとにカードで集めるのがコツ。</span></div>
  </div>
