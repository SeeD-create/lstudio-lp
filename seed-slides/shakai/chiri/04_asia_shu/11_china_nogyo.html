<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中国の農業 ── 畑作・稲作・二期作｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ng-safe { inset: 90px 130px 88px; align-content: start; gap: 34px; }
  .ng-head { display: grid; gap: 12px; }
  .ng-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .zc { position:relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 26px 26px 28px; display: grid; gap: 12px; align-content: start; min-height: 340px; }
  .zc::before { content:""; position:absolute; left:0; top:0; right:0; height:11px; background:var(--c); border-radius:18px 18px 0 0; }
  .zc .zfig { height: 288px; border-radius: 16px; border: 3px solid var(--c); }
  .zc .zh { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--c); }
  .zc .zk { font-size: 40px; font-weight: 900; color: var(--sumi); }
  .zc .zk .blank { font-size: 38px; }
  .zc .zb { font-size: 24px; line-height: 1.5; color: var(--sumi-soft); }
  .ng-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:29px; line-height:1.5; }
  .ng-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ng-safe">
    <div class="ng-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-3</span>　中国の農業</span>
      <h1 class="headline" style="font-size:56px;">農業は<span class="em">西→東・北→南</span>で変わる</h1>
    </div>
    <div class="ng-row">
      <div class="zc" style="--c:#8B7355" data-at="1" data-anim="pop">
        <div class="figure figure--soft zfig"><img src="assets/china_bokuchiku.webp" alt="牧畜 ── 内陸の草原と羊の群れ"></div>
        <div class="zh">内陸部（西）</div>
        <div class="zk"><span class="blank" data-fill="1"><span class="bnum">①</span><b>牧畜</b></span></div>
        <div class="zb">乾燥して雨が少ない。羊やヤギの遊牧が中心。</div>
      </div>
      <div class="zc" style="--c:#C9A227" data-at="2" data-anim="pop">
        <div class="figure figure--soft zfig"><img src="assets/china_hatasaku.webp" alt="畑作 ── 北部に広がる小麦畑"></div>
        <div class="zh">東北・華北（北）</div>
        <div class="zk"><span class="blank" data-fill="2"><span class="bnum">②</span><b>畑作</b></span></div>
        <div class="zb">雨が少なめ。小麦・とうもろこしなどの畑の作物が中心。</div>
      </div>
      <div class="zc" style="--c:#2E8B57" data-at="3" data-anim="pop">
        <div class="figure figure--soft zfig"><img src="assets/china_inasaku.webp" alt="稲作 ── 南部の棚田と茶畑"></div>
        <div class="zh">華中・華南（南）</div>
        <div class="zk"><span class="blank" data-fill="3"><span class="bnum">③</span><b>稲作</b></span></div>
        <div class="zb">雨が多く温暖。米づくりと茶の栽培が盛ん。</div>
      </div>
      <div class="zc" style="--c:#1F7A3F" data-at="4" data-anim="pop">
        <div class="figure figure--soft zfig"><img src="assets/china_nikisaku.webp" alt="二期作 ── 収穫直後の田と田植え直後の田がとなり合う"></div>
        <div class="zh">華南（最南）</div>
        <div class="zk"><span class="blank" data-fill="4"><span class="bnum">④</span><b>二期作</b></span></div>
        <div class="zb">特に暖かく、同じ田で米を年2回つくる。</div>
      </div>
    </div>
    <div class="ng-note" data-at="5" data-anim="fade">
      <span>ポイント</span>
      <span>分け目は<b>降水量</b>。雨の多い南が<b>③</b>、少ない北が<b>②</b>、乾いた西が<b>①</b>。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
