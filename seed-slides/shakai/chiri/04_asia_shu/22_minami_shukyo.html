<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>南アジアの宗教 ── ヒンドゥー教とカースト｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 90px 150px 88px; align-content: start; gap: 26px; }
  .sk-head { display: grid; gap: 12px; }
  .rrow { display:flex; align-items:center; gap:26px; background: var(--paper-hi); border-left: 9px solid var(--c); border-radius: 0 16px 16px 0; padding: 20px 34px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .rrow .rk { flex:none; width:330px; font-size:28px; font-weight:900; color:var(--c); }
  .rrow .rv { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  .rrow .rv .blank { font-size:38px; }
  .kbox { background: var(--paper-hi); color: var(--sumi); border-radius: 20px; padding:23px 37px; display:flex; align-items:center; gap:30px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .kbox .kt { flex:none; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color: var(--sumi); }
  .kbox .kt .blank { font-size:40px; }
  .kbox .kt .blank b { color: var(--imp); }
  .kbox .kd { font-size: 27px; line-height: 1.5; color: var(--sumi); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-2</span>　南アジアの宗教</span>
      <h1 class="headline" style="font-size:56px;">国ごとに信仰する<span class="em">宗教</span>がちがう</h1>
    </div>
    <div class="rrow" style="--c:#E67E22" data-at="1" data-anim="left"><span class="rk">インド</span><span class="rv"><span class="blank" data-fill="1"><span class="bnum">①</span><b>ヒンドゥー教</b></span></span></div>
    <div class="rrow" style="--c:#C9A227" data-at="2" data-anim="left"><span class="rk">スリランカ</span><span class="rv"><span class="blank" data-fill="2"><span class="bnum">②</span><b>仏教</b></span></span></div>
    <div class="rrow" style="--c:#2E8B57" data-at="3" data-anim="left"><span class="rk">バングラデシュ・パキスタン</span><span class="rv"><span class="blank" data-fill="3"><span class="bnum">③</span><b>イスラム教</b></span></span></div>
    <div class="kbox" data-at="4" data-anim="left">
      <span class="kt"><span class="blank" data-fill="4"><span class="bnum">制</span><b>カースト制</b></span></span>
      <span class="kd">インドに古くから残る身分制度。生まれた身分によって職業などが決められてきた。今は憲法で禁止されているが、影響は残る。</span>
    </div>
    <div class="example" data-at="5" style="--cat:#6B6A67; border-left-color:#6B6A67;">
      <span class="ex-tag">頻出</span>
      <span>インド＝<span class="imp">宗教＋身分制度</span>の組み合わせは、テストの定番。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
