<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>稲作とプランテーション ── 東南アジアの二大農業｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tn-safe { inset: 90px 130px 88px; align-content: start; gap: 30px; }
  .tn-head { display: grid; gap: 12px; }
  .tn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; align-items: stretch; }
  .bcard { position:relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c); box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 34px 40px; display: grid; gap: 16px; align-content: start; }
  .bcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--c); border-radius: 19px 0 0 19px; }
  .bcard .bfig { height: 286px; border-radius: 18px; border: 3px solid var(--c); }
  .bcard .bh { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--c); }
  .bcard .bh .blank { font-size:44px; }
  .bcard .bd { font-size: 29px; line-height: 1.55; color: var(--sumi-soft); }
  .bcard .bd b { color: var(--imp); }
  .tn-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:29px; line-height:1.5; }
  .tn-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe tn-safe">
    <div class="tn-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-2</span>　東南アジアの農業</span>
      <h1 class="headline" style="font-size:56px;">農業は<span class="em">稲作</span>と<span class="em">大農園</span>の二本立て</h1>
    </div>
    <div class="tn-row">
      <div class="bcard" style="--c:#2E8B57" data-at="1" data-anim="left">
        <div class="figure figure--soft bfig"><img src="assets/tonan_suiden.webp" alt="稲作 ── 大河の三角州に広がる水田"></div>
        <div class="bh">① 稲作</div>
        <div class="bd">メコン川・チャオプラヤ川の<b>三角州</b>で米づくりが盛ん。タイやベトナムは<b>米の輸出大国</b>（世界有数）。</div>
      </div>
      <div class="bcard" style="--c:#B8860B" data-at="2" data-anim="left">
        <div class="figure figure--soft bfig"><img src="assets/tonan_plantation.webp" alt="プランテーション ── 同じ木が整然と並ぶ大農園"></div>
        <div class="bh">② <span class="blank" data-fill="2"><span class="bnum">⑦</span><b>プランテーション</b></span></div>
        <div class="bd" data-at="3">植民地時代に<b>欧米の資本</b>で開かれた大農園。<span data-at="4">現地の人々を<b>安い賃金</b>でやとい、<b>輸出用の作物</b>（天然ゴム・パーム油など）を栽培する。</span></div>
      </div>
    </div>
    <div class="tn-note" data-at="5" data-anim="fade">
      <span>対比</span>
      <span>米は<b>自分たちが食べる＋輸出</b>、大農園は<b>輸出でもうけるためのもの</b>。作物は次のスライドで。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
