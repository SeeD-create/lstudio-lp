<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>石油とOPEC ── オイルマネーの国々｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sy-safe { inset: 90px 150px 88px; grid-template-columns: 1fr 440px; align-content: center; align-items: center; gap: 44px; }
  .sy-main { display: grid; gap: 22px; align-content: center; }
  .sy-fig { height: 660px; border-radius: 26px; border: 3px solid var(--cat); }
  .sy-head { display: grid; gap: 12px; }
  .sbox { position:relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.10); padding: 22px 34px; display:flex; align-items:center; gap:30px; }
  .sbox .st { flex:none; width:300px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); line-height:1.15; }
  .sbox .st .blank { font-size:40px; }
  .sbox .st small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:600; }
  .sbox .sd { font-size: 26px; line-height: 1.45; color: var(--sumi-soft); }
  .sbox .sd b { color: var(--imp); }
  .sy-note { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:19px 29px; font-size:26px; line-height:1.5; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .sy-note b { color: var(--imp); }
  .sy-note > span:first-child { white-space: nowrap; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe sy-safe">
   <div class="sy-main">
    <div class="sy-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-2</span>　地下の富</span>
      <h1 class="headline" style="font-size:56px;">世界を動かす<span class="em">地下資源</span>のパワー</h1>
    </div>
    <div class="sbox" data-at="1" data-anim="left">
      <span class="st"><span class="blank" data-fill="1"><span class="bnum">②</span><b>石油</b></span></span>
      <span class="sd">ペルシャ湾沿岸で大量に産出。世界の産出量の約3割、<b>埋蔵量は世界の約半分</b>がこの地域に集まる。日本も多くを輸入。</span>
    </div>
    <div class="sbox" data-at="2" data-anim="left">
      <span class="st">オイルマネー</span>
      <span class="sd">これを輸出して得た大きな資金。この<b>オイルマネー</b>で道路・ビル・学校などをつくり、国の近代化を進めてきた。</span>
    </div>
    <div class="sbox" data-at="3" data-anim="left">
      <span class="st"><span class="blank" data-fill="3"><span class="bnum">③</span><b>OPEC</b></span><small><span class="blank" data-fill="3"><b>（石油輸出国機構）</b></span></small></span>
      <span class="sd" data-at="4"><b>1960年</b>に西アジアの産油国が中心となって結成。<b>産出量や価格</b>を話し合って決め、世界への影響力をもつ。</span>
    </div>
    <div class="sy-note" data-at="5" data-anim="fade">
      <span>頻出</span>
      <span><span class="blank" data-fill="5"><b>OPEC＝石油輸出国機構</b></span>、<b>1960年結成</b>。ペルシャ湾・原油・組織名の3点セットで覚える。</span>
    </div>
   </div>
   <div class="figure sy-fig" data-at="0" data-anim="right"><img src="assets/nishi_yuden.webp" alt="石油 ── 砂漠の油田とパイプライン、石油タンク"></div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
