        <span class="kicker"><span class="num">Ⅰ-2</span>　中国の都市</span>
        <h1 class="headline" style="font-size:42px;">4つの都市を<span class="em">位置</span>でおさえる</h1>
      </div>
      <div class="lg" style="--c:#C4161C" data-at="1" data-anim="left"><span class="n">①</span><span class="t"><span class="blank" data-fill="1"><b>ペキン（北京）</b></span><small>中国の首都・各種工業が発達</small></span></div>
      <div class="lg" style="--c:#C4161C" data-at="2" data-anim="left"><span class="n">④</span><span class="t"><span class="blank" data-fill="2"><b>シャンハイ（上海）</b></span><small>長江の河口。中国最大の商工業都市</small></span></div>
      <div class="lg" style="--c:#C4161C" data-at="3" data-anim="left"><span class="n">②</span><span class="t"><span class="blank" data-fill="3"><b>ホンコン（香港）</b></span><small>アヘン戦争でイギリス領→1997年に中国へ返還</small></span></div>
