        <span class="kicker"><span class="num">Ⅳ-1</span>　西アジアの地図</span>
        <h1 class="headline" style="font-size:42px;">産油国が集まる<span class="em">大きな湾</span></h1>
      </div>
      <div class="lg" style="--c:#3a7fa8" data-at="1" data-anim="left"><span class="n">Ａ</span><span class="t"><span class="blank" data-fill="1"><b>ペルシャ湾</b></span><small>沿岸で石油が豊富。多くの石油タンカーが通る</small></span></div>
      <div class="lg" style="--c:#a8892a" data-at="2" data-anim="left"><span class="n">Ｃ</span><span class="t"><span class="blank" data-fill="2"><b>サウジアラビア</b></span><small>石油の産出が多い。大部分が砂漠</small></span></div>
      <div class="lg" style="--c:#C0392B" data-at="3" data-anim="left"><span class="n">Ｂ</span><span class="t"><span class="blank" data-fill="3"><b>イスラエル</b></span><small>1948年にユダヤ人のために作られた国</small></span></div>
      <div class="lg" style="--c:#E6B45E" data-at="4" data-anim="left"><span class="n">周</span><span class="t"><b class="imp">イラン・イラク</b>など<small>湾ぞいに産油国が集まる</small></span></div>
      <div class="mp-note" data-at="5" data-anim="fade"><span>気候</span><span>西アジアはほとんどが<b>乾燥帯（砂漠）</b>。ベドウィンがらくだや羊を遊牧する。</span></div>
