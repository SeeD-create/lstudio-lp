<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>西アジアの宗教 ── イスラム教とユダヤ教｜中1地理 第4章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 90px 150px 88px; align-content: start; gap: 28px; }
  .sk-head { display: grid; gap: 12px; }
  .rbox { position:relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c); box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 32px 44px; display:flex; align-items:center; gap:36px; }
  .rbox::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--c); border-radius: 19px 0 0 19px; }
  .rbox .rt { flex:none; width:360px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--c); line-height:1.15; }
  .rbox .rt .blank { font-size:44px; }
  .rbox .rt small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:600; }
  .rbox .rd { font-size: 28px; line-height: 1.55; color: var(--sumi-soft); }
  .rbox .rd b { color: var(--imp); }
  .sk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:28px; line-height:1.5; }
  .sk-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-3</span>　西アジアの宗教</span>
      <h1 class="headline" style="font-size:56px;">2つの宗教が<span class="em">となり合う</span>地域</h1>
    </div>
    <div class="rbox" style="--c:#2E8B57" data-at="1" data-anim="left">
      <span class="rt"><span class="blank" data-fill="1"><span class="bnum">①</span><b>イスラム教</b></span></span>
      <span class="rd" data-at="2">西アジアのほとんどの地域で信仰されている。1日5回の礼拝や、豚肉を食べないなどの決まりがある。</span>
    </div>
    <div class="rbox" style="--c:#5B7DB1" data-at="3" data-anim="left">
      <span class="rt"><span class="blank" data-fill="3"><b>ユダヤ教</b></span><small>イスラエル</small></span>
      <span class="rd" data-at="4"><b>イスラエル</b>（1948年にユダヤ人のために作られた国）で信仰。周りのアラブ諸国とは宗教や土地をめぐって<b>何度も戦争</b>が起きている。</span>
    </div>
    <div class="sk-note" data-at="5" data-anim="fade">
      <span>整理</span>
      <span>西アジアはほぼ1つの宗教でまとまり、その中で<b>イスラエルだけ別の宗教</b>。だから対立が生まれやすい。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 アジア州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
