<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 中部の農林水産業｜中1地理 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1460px; background: var(--paper-hi); color: var(--sumi); border: 4px solid var(--sumi); border-radius: 28px; padding: 46px 58px; box-shadow: 0 22px 50px rgba(40,30,10,.14); }
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:31px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 46px; line-height: 1.5; font-weight: 700; margin-top: 16px; color: var(--sumi); }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:92px; line-height:1; color:var(--sumi); }
  .ans .exp { font-size: 31px; line-height: 1.45; color: var(--sumi-soft); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認・農林水産業</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. ○か×か</div>
      <p class="qtext" data-at="0">甲府盆地では<span class="u">りんご</span>の栽培が盛んで、<br>山梨県の生産量は全国1位である。</p>
      <div class="ans" data-at="0">
        <span class="mark blank" data-fill="1"><b>×</b></span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b>甲府盆地（山梨県）で全国1位なのは「もも」と「ぶどう」。りんごが盛んなのは長野盆地（長野県）で、全国では青森県に次いで2位。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第16章 中部地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
