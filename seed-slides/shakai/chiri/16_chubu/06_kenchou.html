<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>県名とちがう県庁所在地は3つだけ｜中1地理 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .kc-safe { inset: 84px 130px 84px; align-content: start; gap: 20px; }
  .kc-head { display: grid; gap: 8px; }
  .kc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 34px; }
  .kc { display:flex; align-items:center; gap:18px; background:var(--paper-hi); border-radius:16px; border:3px solid var(--c); padding:14px 24px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .kc .kn { font-size:31px; font-weight:900; color:var(--sumi); white-space:nowrap; }
  .kc .ar { font-size:26px; color:var(--sumi-mute); font-weight:900; }
  .kc .blank { font-size:31px; min-width:210px; }
  .kc-note { display:flex; align-items:center; gap:22px; background:var(--imp); color:#fff; border-radius:16px; padding:16px 34px; font-size:28px; line-height:1.4; }
  .kc-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; opacity:.85; letter-spacing:.1em; }
  .kc-band { font-size:26px; font-weight:900; color:var(--c2); letter-spacing:.1em; margin-top:6px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kc-safe">
    <div class="kc-head" data-at="0">
      <span class="kicker"><span class="num">05</span>　県庁所在地</span>
      <h1 class="headline" style="font-size:54px;">県名とちがう県庁所在地は、<span class="em">3つだけ</span></h1>
    </div>
    <div class="kc-band" style="--c2:#17537F" data-at="1">■ 北陸</div>
    <div class="kc-grid">
      <div class="kc" style="--c:#8FC0E0" data-at="1"><span class="kn">新潟県</span><span class="ar">▶</span><span class="blank" data-fill="1"><b>新潟市</b></span></div>
      <div class="kc" style="--c:#8FC0E0" data-at="1"><span class="kn">富山県</span><span class="ar">▶</span><span class="blank" data-fill="1"><b>富山市</b></span></div>
      <div class="kc" style="--c:#8FC0E0" data-at="1"><span class="kn">石川県</span><span class="ar">▶</span><span class="blank" data-fill="1"><b>金沢市</b></span></div>
      <div class="kc" style="--c:#8FC0E0" data-at="1"><span class="kn">福井県</span><span class="ar">▶</span><span class="blank" data-fill="1"><b>福井市</b></span></div>
    </div>
    <div class="kc-band" style="--c2:#2F5A22" data-at="2">■ 中央高地</div>
    <div class="kc-grid">
      <div class="kc" style="--c:#A9D8A2" data-at="2"><span class="kn">山梨県</span><span class="ar">▶</span><span class="blank" data-fill="2"><b>甲府市</b></span></div>
      <div class="kc" style="--c:#A9D8A2" data-at="2"><span class="kn">長野県</span><span class="ar">▶</span><span class="blank" data-fill="2"><b>長野市</b></span></div>
      <div class="kc" style="--c:#A9D8A2" data-at="2"><span class="kn">岐阜県</span><span class="ar">▶</span><span class="blank" data-fill="2"><b>岐阜市</b></span></div>
    </div>
    <div class="kc-band" style="--c2:#8E5411" data-at="3">■ 東海</div>
    <div class="kc-grid">
      <div class="kc" style="--c:#F2C08A" data-at="3"><span class="kn">静岡県</span><span class="ar">▶</span><span class="blank" data-fill="3"><b>静岡市</b></span></div>
      <div class="kc" style="--c:#F2C08A" data-at="3"><span class="kn">愛知県</span><span class="ar">▶</span><span class="blank" data-fill="3"><b>名古屋市</b></span></div>
    </div>
    <div class="kc-note" data-at="4"><span>ここが出る</span><span>県名とちがうのは<b>石川県・山梨県・愛知県</b>の3つだけ。あとの6県は県名と同じ。</span></div>
  </div>
  <div class="seed-foot"><span>第16章 中部地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
