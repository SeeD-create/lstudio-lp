    </div>
    <p class="df-def" data-at="1"><span class="imp">中部国際空港</span>…<span class="blank" data-fill="1"><b>2005</b></span>年に開港した国際空港。<span class="imp">若狭湾</span>…<span class="blank" data-fill="2"><b>原子力発電所</b></span>が多くあり、<span class="blank" data-fill="3"><b>近畿</b></span>地方に電力を供給している。</p>

      <div class="pt" style="--c:#2E6DA4" data-at="4" data-anim="pop"><div class="ph">若狭湾は福井県</div><div class="pb"><b>リアス海岸</b>で水深が深く、冷却水がとりやすい。だから発電所が集まった。</div></div>

    </div>
