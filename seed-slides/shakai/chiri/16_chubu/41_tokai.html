  .df-safe { inset: 76px 130px 76px; align-content: start; gap: 26px; grid-template-columns: 1fr 440px; column-gap: 44px; align-items: start; }

  .df-def { font-size: 38px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 28px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }

  .df-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }

  .df-note.red { background: var(--imp); }
  .df-note.red > span:first-child { color: rgba(255,255,255,.85); }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }

  .df-safe { grid-template-columns: 1fr 400px; column-gap: 36px; }
  .df-def { font-size: 34px; padding: 24px 34px; }
  .df-def .blank { font-size: 36px; }

  .pt .pb { font-size: 23px; }

<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-main">
      <div class="df-head" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-8</span>　東海工業地域</span>
        <h1 class="headline" style="font-size:54px;"><span class="em">東海工業地域</span>は太平洋岸にのびる</h1>
      </div>
      <p class="df-def" data-at="1"><span class="imp">東海工業地域</span>…<span class="blank" data-fill="1"><b>静岡</b></span>県を中心とする、<span class="blank" data-fill="2"><b>第二次世界大戦後</b></span>に広がった工業地域。</p>

      <div class="df-row">
        <div class="pt" style="--c:#2E6DA4" data-at="3" data-anim="pop"><div class="ph">浜松市</div><div class="pb"><b>楽器</b>と<b>オートバイ</b>の生産が盛ん。世界的な楽器メーカーが生まれたまち。</div></div>
        <div class="pt" style="--c:#2E8B57" data-at="3" data-anim="pop"><div class="ph">富士市</div><div class="pb"><b>製紙・パルプ工業</b>が盛ん。富士山からのゆたかな水を使う。</div></div>
        <div class="pt" style="--c:#B9770E" data-at="3" data-anim="pop"><div class="ph">県庁のある市</div><div class="pb">県庁所在地。食品・プラモデルなど。お茶の集散地でもある。</div></div>
      </div>
      <div class="df-note" data-at="4"><span>グラフ</span><span>パルプ・紙の出荷額は<b>この県が11.9%で全国1位</b>。電気機械も<b>全国2位</b>（12.7%）。</span></div>
      <div class="df-note red" data-at="5"><span>ここが出る</span><span><b>浜松＝楽器・オートバイ</b>／<b>富士＝製紙</b>。都市とつくる物をセットで。</span></div>
    </div>
