<title>長野盆地 ── りんごは青森に次いで全国2位｜中1地理 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .df-safe { inset: 76px 130px 76px; align-content: start; gap: 26px; grid-template-columns: 1fr 440px; column-gap: 44px; align-items: start; }
  .df-main { display: grid; gap: 26px; align-content: start; }
  .df-fig { align-self: center; height: 600px; border-radius: 26px; border: 3px solid var(--cat); box-shadow: 0 18px 40px rgba(40,30,10,.14); overflow: hidden; }
  .df-figs { align-self: center; display: grid; gap: 24px; }
  .df-figs .figure { height: 300px; border-radius: 22px; border: 3px solid var(--cat); box-shadow: 0 16px 34px rgba(40,30,10,.13); overflow: hidden; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 38px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 28px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 40px; }
  .df-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .pt { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); padding: 24px 28px; display:grid; gap:10px; box-shadow:0 12px 28px rgba(40,30,10,.08); align-content:start; }
  .pt .ph { font-weight:900; font-size:29px; color:var(--c); }
  .pt .pb { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .df-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .df-note b { color:#fff; }
  .df-note.red { background: var(--imp); }
  .df-note.red > span:first-child { color: rgba(255,255,255,.85); }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe df-safe">
    <div class="df-main">
      <div class="df-head" data-at="0">
        <span class="kicker"><span class="num">Ⅱ-2</span>　中央高地の農業</span>
        <h1 class="headline" style="font-size:56px;">長野盆地は<span class="em">くだもの</span>づくりが盛ん</h1>
      </div>
      <p class="df-def" data-at="1"><span class="imp">長野盆地</span>…<span class="blank" data-fill="1"><b>りんご</b></span>やぶどうの栽培が盛ん。</p>

      <div class="df-row">
        <div class="pt" style="--c:#C0392B" data-at="3" data-anim="pop"><div class="ph">全国2位のくだもの</div><div class="pb">1位は<b>青森県</b>、2位が<b>長野県</b>。この順番がそのままテストに出る。</div></div>
        <div class="pt" style="--c:#2E8B57" data-at="3" data-anim="pop"><div class="ph">すずしいから育つ</div><div class="pb">この赤い実は<b>すずしい気候</b>を好む。標高が高くて夏もすずしい長野はぴったり。</div></div>
        <div class="pt" style="--c:#2E6DA4" data-at="3" data-anim="pop"><div class="ph">ぶどうも上位</div><div class="pb">ぶどうは1位が<b>山梨県</b>、2位が<b>長野県</b>。中部の2県で全国の4割をこえる。</div></div>
      </div>
      <div class="df-note red" data-at="4"><span>ひとことで</span><span>長野は<b>くだもの2位・ぶどう2位・レタス1位・はくさい1位</b>。「2位と1位の宝庫」。</span></div>
    </div>
    <div class="figure df-fig" data-at="0" data-anim="right"><img src="assets/ringoen.webp" alt="長野盆地のりんご園 ── 赤く実ったりんごがならぶ"></div>
  </div>
  <div class="seed-foot"><span>第16章 中部地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
