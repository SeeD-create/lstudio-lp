        <h1 class="headline" style="font-size:54px;">豊田市は<span class="em">1つの会社</span>とともに大きくなった</h1>
      </div>

      <div class="df-row">
        <div class="pt" style="--c:#C0392B" data-at="3" data-anim="pop"><div class="ph">市の名前が変わった</div><div class="pb">もとは挙母市。ある会社の発展にともない、1959年に<b>豊田市</b>と改名した。</div></div>
        <div class="pt" style="--c:#2E6DA4" data-at="3" data-anim="pop"><div class="ph">関連工場が集まる</div><div class="pb">部品をつくる工場が周りに集まる。車1台に約3万個の部品が必要だから。</div></div>
        <div class="pt" style="--c:#2E8B57" data-at="3" data-anim="pop"><div class="ph">輸送用機械 全国1位</div><div class="pb">愛知県は輸送用機械の出荷額が<b>40.0%</b>で全国1位。2位の静岡（6.5%）を大きく上回る。</div></div>
