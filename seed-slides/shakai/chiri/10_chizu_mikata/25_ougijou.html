<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>扇状地 ── 山から平地に出るところ｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .og-safe { inset: 80px 130px 76px; grid-template-columns: 640px 1fr; align-content: center; gap: 56px; align-items: center; }
  .og-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:20px; }
  .og-fig svg { width:100%; height:auto; display:block; }
  .og-txt { display:grid; gap:24px; }
  .og-head { display:grid; gap:12px; }
  .og-lead { font-size:33px; color:var(--sumi-soft); font-weight:600; line-height:1.55; }
  .og-lead .blank { font-size:36px; min-width:170px; }
  .og-lead .imp { color:var(--imp); font-weight:900; }
  .og-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:29px; line-height:1.5; }
  .og-note b { color:#ff8a8f; }
  .og-photo { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .og-photo .pc { display:grid; gap:8px; }
  .og-photo .cap { font-size:22px; font-weight:900; color:var(--sumi-mute); text-align:center; }
  .og-photo .cap b { color:var(--sumi); }
  .og-photo .figure { height:250px; border-radius:18px; border:3px solid var(--sumi);
    box-shadow:0 14px 30px rgba(40,30,10,.14); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe og-safe">
    <div class="og-fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="592" height="472" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
        <!-- 山地(密な等高線) -->
        <g fill="none" stroke="#9c7a3c" stroke-width="2.2">
          <path d="M60,60 Q300,30 540,60"/>
          <path d="M70,95 Q300,68 530,95"/>
          <path d="M85,130 Q300,105 515,130"/>
        </g>
        <text x="300" y="52" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#9c7a3c">山地（等高線が密）</text>
        <!-- 扇状地(扇形にひらく等高線) -->
        <g fill="none" stroke="#b98a34" stroke-width="2.6">
          <path d="M170,150 Q300,175 430,150" />
          <path d="M140,210 Q300,255 460,210"/>
          <path d="M110,275 Q300,335 490,275"/>
          <path d="M85,340 Q300,410 515,340"/>
        </g>
        <!-- 川(山から平地へ、扇の要から放射) -->
        <path d="M300,120 L300,175" stroke="#2f7fbf" stroke-width="6" fill="none"/>
        <g stroke="#2f7fbf" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".85">
          <path d="M300,175 Q250,300 190,410"/>
          <path d="M300,175 Q300,300 300,415"/>
          <path d="M300,175 Q350,300 410,410"/>
        </g>
        <circle cx="300" cy="175" r="7" fill="#c4161c"/>
        <text x="322" y="172" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#c4161c">扇の要（谷口）</text>
        <text x="300" y="452" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#b98a34">平地に扇形に広がる</text>
      </svg>
    </div>
    <div class="og-txt">
      <div class="og-head" data-at="0">
        <span class="kicker"><span class="num">Ⅴ-1</span>　地形を読む</span>
        <h1 class="headline" style="font-size:50px;">川がつくる<span class="em">扇の地形</span></h1>
      </div>
      <p class="og-lead" data-at="1">川が<span class="imp">山地から平地に出るところ</span>に、運んできた土砂がたまってできる扇形の地形を<span class="blank" data-fill="2"><span class="bnum">①</span><b>扇状地</b></span>という。</p>
      <div class="og-photo" data-at="3" data-anim="fade">
        <div class="pc">
          <div class="figure"><img src="assets/ougijou.webp" alt="山地から平地に出たところに土砂が扇形に広がった地形を上空から見たようす"></div>
          <span class="cap">山ぎわの地形</span>
        </div>
        <div class="pc">
          <div class="figure"><img src="assets/sankakusu.webp" alt="河口で川がいくつにも枝分かれし、その間に低い平地が広がるようすを上空から見た"></div>
          <span class="cap">河口＝<b>三角州</b></span>
        </div>
      </div>
      <div class="og-note" data-at="3"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">まちがえ注意</span><span>川が<b>海や湖に出る河口</b>にできる平地は<b>三角州</b>。「①＝山ぎわ／三角州＝河口」で区別。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
