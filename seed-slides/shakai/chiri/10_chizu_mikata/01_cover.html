<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地図の見方 ── 地形図を読みとく5つの道具｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cover-safe { inset: 120px 150px 120px; grid-template-columns: 1fr 660px; align-content: center; gap: 72px; align-items: center; }
  .cover-txt { display: grid; gap: 32px; }
  .cover-kicker { font-size: 30px; letter-spacing:.3em; }
  .cover-title { font-size: 118px; line-height: 1.04; }
  .cover-title .goldem { color: var(--gold-deep); }
  .cover-lead { font-size: 37px; }
  .seal { display:inline-flex; align-items:center; gap:16px; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-deep); font-size:28px; letter-spacing:.06em; }
  .seal .ring { width:56px;height:56px;border-radius:50%;border:4px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:28px; }
  .cover-fig { height: 660px; border-radius: 32px; display:grid; place-content:center;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--sumi); box-shadow:0 20px 50px rgba(40,30,10,.18); position:relative; overflow:hidden; }
  .cover-fig::before { content:""; position:absolute; inset:16px; border:2px solid var(--hair); border-radius:24px; }
  .cover-fig svg { width:580px; height:580px; z-index:1; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cover-safe">
    <div class="cover-txt">
      <span class="kicker cover-kicker">中1 地理　<span class="num">第10章</span></span>
      <h1 class="headline cover-title">地図の<br><span class="goldem">見方</span></h1>
      <p class="lead cover-lead">一枚の<span class="strong">地形図</span>には、高さ・向き・きょり・土地のようすが暗号で書いてある。<span class="strong">方位・縮尺・等高線・地図記号</span>を手に入れて、地図を読みとこう。</p>
      <span class="seal"><span class="ring">図</span>国土地理院がつくる2万5千分の1の地形図</span>
    </div>
    <div class="cover-fig" data-at="0" data-anim="right">
      <svg viewBox="0 0 580 580" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="40" width="500" height="500" rx="18" fill="#F4F1EA" stroke="#3a3a39" stroke-width="4"/>
        <!-- 等高線 -->
        <g fill="none" stroke="#9c7a3c" stroke-width="2.4">
          <path d="M120,470 Q290,300 250,180 Q235,120 300,110 Q380,120 360,210 Q330,320 470,440"/>
          <path d="M150,470 Q300,320 270,200 Q258,150 300,142 Q360,150 342,215 Q315,330 440,460"/>
          <path d="M185,470 Q310,340 292,220 Q285,180 305,175 Q345,182 330,225 Q305,340 410,470"/>
        </g>
        <path d="M255,175 Q300,120 348,180" fill="none" stroke="#c4161c" stroke-width="3.4"/>
        <!-- 方位マーク -->
        <g transform="translate(478,118)">
          <circle r="42" fill="#fff" stroke="#3a3a39" stroke-width="3"/>
          <path d="M0,-34 L11,0 L0,-8 L-11,0 Z" fill="#c4161c"/>
          <path d="M0,34 L11,0 L0,8 L-11,0 Z" fill="#3a3a39"/>
          <text x="0" y="-46" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#3a3a39">北</text>
        </g>
        <!-- 地図記号ちらし -->
        <g transform="translate(110,120)" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900">
          <circle r="26" fill="#fff" stroke="#3a3a39" stroke-width="3"/><text y="10" text-anchor="middle" font-size="30" fill="#3a3a39">文</text>
        </g>
        <g transform="translate(470,470)">
          <path d="M-26,6 h52 M-14,6 v-26 h28 v26 M0,-20 l0,-14" fill="none" stroke="#3a3a39" stroke-width="3.4"/>
          <path d="M-26,6 q26,-20 52,0" fill="none" stroke="#3a3a39" stroke-width="3.4"/>
        </g>
        <!-- スケールバー -->
        <g transform="translate(120,510)">
          <rect x="0" y="-6" width="120" height="10" fill="#3a3a39"/>
          <rect x="0" y="-6" width="60" height="10" fill="#fff" stroke="#3a3a39" stroke-width="2"/>
          <text x="60" y="-14" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="18" fill="#3a3a39">1km</text>
        </g>
      </svg>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(1);</script>
</body>
</html>
