<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>等高線 ── 計曲線と主曲線｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { inset: 78px 120px 74px; grid-template-columns: 720px 1fr; align-content: center; gap: 56px; align-items: center; }
  .tk-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:22px; }
  .tk-fig svg { width:100%; height:auto; display:block; }
  .tk-txt { display:grid; gap:22px; }
  .tk-head { display:grid; gap:10px; }
  .tk-lead { font-size:31px; color:var(--sumi-soft); font-weight:600; line-height:1.5; }
  .tk-lead .imp { color:var(--imp); font-weight:900; }
  table.tt { border-collapse:collapse; width:100%; font-weight:700; }
  table.tt th, table.tt td { border:2px solid var(--sumi-mute); padding:14px 12px; text-align:center; font-size:27px; }
  table.tt th { background:var(--sumi); color:var(--paper-hi); }
  table.tt .rowh { background:var(--paper-lo); font-weight:900; color:var(--sumi); }
  table.tt .blank { font-size:27px; min-width:96px; }
  .tk-photo { display:grid; gap:10px; }
  .tk-photo .cap { font-size:21px; font-weight:900; color:var(--sumi-mute); }
  .tk-photo .figure { height:286px; border-radius:18px; border:3px solid var(--sumi);
    box-shadow:0 14px 30px rgba(40,30,10,.14); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe tk-safe">
    <div class="tk-fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="628" height="508" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
        <!-- 主曲線(細)と計曲線(太)の同心の丘 -->
        <g fill="none">
          <ellipse cx="320" cy="270" rx="290" ry="228" stroke="#9c7a3c" stroke-width="2"/>
          <ellipse cx="320" cy="266" rx="248" ry="192" stroke="#9c7a3c" stroke-width="2"/>
          <ellipse cx="322" cy="262" rx="206" ry="158" stroke="#9c7a3c" stroke-width="2"/>
          <ellipse cx="324" cy="258" rx="164" ry="124" stroke="#9c7a3c" stroke-width="2"/>
          <ellipse cx="326" cy="256" rx="122" ry="92"  stroke="#c4161c" stroke-width="4.5"/>
          <ellipse cx="328" cy="252" rx="84"  ry="62"  stroke="#9c7a3c" stroke-width="2"/>
          <ellipse cx="330" cy="250" rx="48"  ry="34"  stroke="#9c7a3c" stroke-width="2"/>
        </g>
        <circle cx="332" cy="248" r="5" fill="#3a3a39"/>
        <text x="352" y="244" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="24" fill="#3a3a39">山頂</text>
        <!-- ラベル -->
        <text x="326" y="182" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#c4161c">計曲線(太)</text>
        <text x="320" y="502" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#9c7a3c">主曲線(細)</text>
      </svg>
    </div>
    <div class="tk-txt">
      <div class="tk-head" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-1</span>　等高線</span>
        <h1 class="headline" style="font-size:52px;">同じ<span class="em">高さ</span>を結んだ線</h1>
      </div>
      <p class="tk-lead" data-at="1">太い実線を<span class="imp">計曲線</span>、細い実線を<span class="imp">主曲線</span>という。計曲線は5本ごとに1本引かれ、高さを数える目印になる。</p>
      <table class="tt" data-at="2">
        <tr><th></th><th>2万5千分の1</th><th>5万分の1</th></tr>
        <tr><td class="rowh">計曲線</td>
          <td><span class="blank" data-fill="2"><span class="bnum">①</span><b>50m</b></span>ごと</td>
          <td><span class="blank" data-fill="3"><span class="bnum">②</span><b>100m</b></span>ごと</td></tr>
        <tr><td class="rowh">主曲線</td>
          <td><span class="blank" data-fill="4"><span class="bnum">③</span><b>10m</b></span>ごと</td>
          <td><span class="blank" data-fill="5"><span class="bnum">④</span><b>20m</b></span>ごと</td></tr>
      </table>
      <div class="tk-photo" data-at="1" data-anim="right">
        <span class="cap">左の図は、この丘を「同じ高さ」で輪切りにしたもの</span>
        <div class="figure"><img src="assets/oka_kuukan.webp" alt="なだらかな独立した丘を斜め上空から見たようす"></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
