<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>尾根と谷 ── 等高線のふくらむ向き｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ot-safe { inset: 78px 120px 74px; grid-template-columns: 1fr 560px; align-content: center; gap: 52px; align-items: center; }
  .ot-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:20px; }
  .ot-fig svg { width:100%; height:auto; display:block; }
  .ot-txt { display:grid; gap:22px; }
  .ot-head { display:grid; gap:10px; }
  .orow { display:grid; grid-template-columns:130px 1fr; gap:20px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:22px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .orow .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); text-align:center; }
  .orow .tx { font-size:28px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .orow .blank { font-size:30px; min-width:110px; }
  .orow .tx .imp { color:var(--imp); font-weight:900; }
  .ot-photo { display:grid; gap:10px; }
  .ot-photo .cap { font-size:21px; font-weight:900; color:var(--sumi-mute); }
  .ot-photo .figure { height:250px; border-radius:18px; border:3px solid var(--sumi);
    box-shadow:0 14px 30px rgba(40,30,10,.14); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ot-safe">
    <div class="ot-fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="792" height="462" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
        <!-- 高低の矢印 -->
        <g font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="24" fill="#3a3a39">
          <line x1="40" y1="120" x2="40" y2="360" stroke="#3a3a39" stroke-width="2.5"/>
          <path d="M40,110 l-8,16 h16 Z" fill="#3a3a39"/>
          <text x="20" y="120">高</text><text x="20" y="360">低</text>
        </g>
        <!-- 等高線 5本(高→低は上→下) -->
        <g fill="none" stroke="#9c7a3c" stroke-width="3">
          <path d="M80,130 L200,130 Q270,185 340,130 L500,130 Q570,75 640,130 L760,130"/>
          <path d="M80,185 L200,185 Q270,240 340,185 L500,185 Q570,130 640,185 L760,185"/>
          <path d="M80,240 L200,240 Q270,295 340,240 L500,240 Q570,185 640,240 L760,240"/>
          <path d="M80,295 L200,295 Q270,350 340,295 L500,295 Q570,240 640,295 L760,295"/>
        </g>
        <!-- 川(谷にそって流れる) -->
        <path d="M570,60 Q568,150 570,240 Q572,320 570,410" fill="none" stroke="#2f7fbf" stroke-width="5" stroke-linecap="round"/>
        <path d="M570,405 l-9,-16 M570,405 l9,-16" stroke="#2f7fbf" stroke-width="5" fill="none"/>
        <!-- 尾根線 -->
        <path d="M270,120 L270,360" fill="none" stroke="#c4161c" stroke-width="3" stroke-dasharray="8 6"/>
        <text x="200" y="407" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#c4161c">①</text>
        <text x="640" y="407" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#2f7fbf">②</text>
        <text x="420" y="450" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="20" fill="#8b8a88">①②の名前は右の穴に　／　青い線は川</text>
      </svg>
    </div>
    <div class="ot-txt">
      <div class="ot-head" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-3</span>　等高線のふくらむ向き</span>
        <h1 class="headline" style="font-size:48px;">線の<span class="em">ふくらむ向き</span>で見分ける</h1>
      </div>
      <div class="orow" data-at="1" data-anim="right">
        <span class="yr">①</span>
        <span class="tx">等高線が<span class="imp">低い方へ張り出す</span>＝まわりより高い。山の背＝<span class="blank" data-fill="1"><span class="bnum">①</span><b>尾根</b></span>。</span>
      </div>
      <div class="orow" data-at="2" data-anim="right">
        <span class="yr">谷</span>
        <span class="tx">等高線が<span class="imp">高い方へ入り込む</span>＝まわりより低い。川が流れるのが<span class="blank" data-fill="2"><span class="bnum">②</span><b>谷</b></span>。</span>
      </div>
      <div class="ot-photo" data-at="2" data-anim="right">
        <span class="cap">実物を見れば一目 ── 高くのびる背と、川の通るくぼみ</span>
        <div class="figure"><img src="assets/one_tani.webp" alt="山地の尾根すじと、その間を刻むV字の谷・谷底を流れる川"></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(3);</script>
</body>
</html>
