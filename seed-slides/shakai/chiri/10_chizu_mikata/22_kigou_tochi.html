<!DOCTYPE html>

<head>

<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mk-safe { inset: 76px 110px 72px; align-content: start; gap: 26px; }
  .mk-head { display:grid; gap:10px; }
  .mk-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:18px; }
  .mk { background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:20px 12px 18px; box-shadow:0 12px 26px rgba(40,30,10,.09); display:grid; justify-items:center; gap:12px; }
  .mk .ic { width:96px; height:96px; }
  .mk .ic svg { width:100%; height:100%; display:block; }
  .mk .blank { font-size:27px; min-width:130px; }
  .mk-photo { display:grid; gap:12px; margin-top:4px; }
  .mk-photo .cap { font-size:22px; font-weight:900; color:var(--sumi-mute); }
  .mk-photo .prow { display:grid; grid-template-columns:repeat(5,1fr); gap:18px; }
  .mk-photo .figure { height:228px; border-radius:16px; border:3px solid var(--sumi);
    box-shadow:0 12px 26px rgba(40,30,10,.13); overflow:hidden; }
</style>
</head>
