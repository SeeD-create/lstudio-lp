<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地形図を読む ── 総合練習｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .yr-safe { inset: 70px 110px 66px; grid-template-columns: 780px 1fr; align-content: center; gap: 48px; align-items: center; }
  .yr-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:14px; }
  .yr-fig svg { width:100%; height:auto; display:block; }
  .yr-fig text { font-family:'Zen Kaku Gothic New',sans-serif; }
  .yr-txt { display:grid; gap:16px; align-content:center; }
  .yr-head { display:grid; gap:8px; }
  .qr { display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:14px; padding:15px 20px; box-shadow:0 8px 18px rgba(40,30,10,.07); }
  .qr .n { width:40px; height:40px; border-radius:50%; background:var(--cat); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:22px; display:flex; align-items:center; justify-content:center; }
  .qr .t { font-size:25px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .qr .blank { font-size:26px; min-width:120px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe yr-safe">
    <div class="yr-fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 780 600" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="772" height="592" rx="12" fill="#F6F3EC" stroke="#3a3a39" stroke-width="3"/>
        <!-- 方位 -->
        <g transform="translate(710,70)"><circle r="34" fill="#fff" stroke="#3a3a39" stroke-width="3"/><path d="M0,-26 L9,0 L0,-6 L-9,0 Z" fill="#c4161c"/><path d="M0,26 L9,0 L0,6 L-9,0 Z" fill="#3a3a39"/><text x="0" y="-38" text-anchor="middle" font-weight="900" font-size="18" fill="#3a3a39">北</text></g>
        <!-- 凡例：太線＝計曲線／細線＝主曲線（値は書かない＝生徒が縮尺から思い出す） -->
        <g transform="translate(30,44)">
          <line x1="0" y1="0" x2="34" y2="0" stroke="#9c7a3c" stroke-width="4.2" stroke-linecap="round"/>
          <text x="42" y="7" font-weight="900" font-size="19" fill="#6b5325">計曲線</text>
          <line x1="124" y1="0" x2="158" y2="0" stroke="#9c7a3c" stroke-width="1.9"/>
          <text x="166" y="7" font-weight="900" font-size="19" fill="#6b5325">主曲線</text>
        </g>
        <!-- 北山：2万5千分の1（主曲線10m・計曲線50m）／外側の計曲線400m〜内側の計曲線450m -->
        <g fill="none" stroke="#9c7a3c">
          <ellipse cx="200" cy="250" rx="150" ry="130" stroke-width="4.2"/>
          <ellipse cx="200" cy="248" rx="126" ry="109" stroke-width="1.9"/>
          <ellipse cx="200" cy="246" rx="102" ry="88" stroke-width="1.9"/>
          <ellipse cx="200" cy="245" rx="78" ry="67" stroke-width="1.9"/>
          <ellipse cx="200" cy="244" rx="54" ry="46" stroke-width="1.9"/>
          <ellipse cx="200" cy="243" rx="30" ry="25" stroke-width="4.2"/>
        </g>
        <text x="224" y="234" font-weight="900" font-size="22" fill="#3a3a39" stroke="#F6F3EC" stroke-width="5" paint-order="stroke">北山</text>
        <g transform="translate(200,243)"><circle r="15" fill="#c4161c"/><text y="7" text-anchor="middle" font-weight="900" font-size="19" fill="#fff">2</text></g>
        <!-- 高木山：外側の計曲線400m〜主曲線430m、山頂の標高点436m -->
        <g fill="none" stroke="#9c7a3c">
          <ellipse cx="580" cy="300" rx="120" ry="150" stroke-width="4.2"/>
          <ellipse cx="580" cy="298" rx="92" ry="116" stroke-width="1.9"/>
          <ellipse cx="580" cy="296" rx="64" ry="82" stroke-width="1.9"/>
          <ellipse cx="580" cy="295" rx="36" ry="48" stroke-width="1.9"/>
        </g>
        <circle cx="580" cy="293" r="5" fill="#3a3a39"/>
        <text x="600" y="288" font-weight="900" font-size="22" fill="#3a3a39" stroke="#F6F3EC" stroke-width="5" paint-order="stroke">高木山 436m</text>
        <!-- 等高線の高さ（与えデータ・計曲線だけに数値） -->
        <g font-weight="900" font-size="21" fill="#6b5325" stroke="#F6F3EC" stroke-width="6" paint-order="stroke" text-anchor="middle">
          <text x="96" y="165">400m</text>
          <text x="497" y="202">400m</text>
        </g>
        <!-- 大平川 -->
        <path d="M400,40 Q392,180 400,320 Q408,450 400,560" fill="none" stroke="#2f7fbf" stroke-width="6" stroke-linecap="round"/>
        <path d="M400,555 l-9,-16 M400,555 l9,-16" stroke="#2f7fbf" stroke-width="6" fill="none"/>
        <text x="356" y="120" font-weight="900" font-size="20" fill="#2f7fbf">大平川</text>
        <!-- 記号: 寺院(卍) 南東の北山 -->
        <g transform="translate(300,400)"><path d="M0,-18 V18 M-18,0 H18 M0,-18 H-11 M18,0 V-11 M0,18 H11 M-18,0 V11" fill="none" stroke="#2b2b2a" stroke-width="4" stroke-linecap="round"/></g>
        <text x="300" y="448" text-anchor="middle" font-weight="900" font-size="18" fill="#2b2b2a">寺院</text>
        <!-- 神社(鳥居) -->
        <g transform="translate(470,470)"><path d="M-18,-14 Q0,-19 18,-14" fill="none" stroke="#2b2b2a" stroke-width="4" stroke-linecap="round"/><path d="M-13,-5 H13" stroke="#2b2b2a" stroke-width="4" stroke-linecap="round"/><path d="M-9,-14 V16 M9,-14 V16" stroke="#2b2b2a" stroke-width="4" stroke-linecap="round"/></g>
        <text x="470" y="510" text-anchor="middle" font-weight="900" font-size="18" fill="#2b2b2a">神社</text>
        <!-- 病院 -->
        <g transform="translate(600,480)"><rect x="-18" y="-18" width="36" height="36" rx="6" fill="none" stroke="#2b2b2a" stroke-width="4"/><path d="M0,-11 V11 M-11,0 H11" stroke="#2b2b2a" stroke-width="4.5" stroke-linecap="round"/></g>
        <text x="600" y="518" text-anchor="middle" font-weight="900" font-size="18" fill="#2b2b2a">病院</text>
        <!-- 学校(文) -->
        <text x="130" y="470" text-anchor="middle" font-weight="900" font-size="40" fill="#2b2b2a">文</text>
        <text x="130" y="500" text-anchor="middle" font-weight="900" font-size="18" fill="#2b2b2a">学校</text>
        <!-- スケール -->
        <g transform="translate(70,555)"><rect x="0" y="-6" width="120" height="9" fill="#3a3a39"/><rect x="0" y="-6" width="60" height="9" fill="#fff" stroke="#3a3a39" stroke-width="2"/><text x="60" y="-13" text-anchor="middle" font-weight="900" font-size="18" fill="#3a3a39">縮尺 1:25000</text></g>
      </svg>
    </div>
    <div class="yr-txt">
      <div class="yr-head" data-at="0">
        <span class="kicker"><span class="num">Ⅴ-2</span>　総合練習</span>
        <h1 class="headline" style="font-size:40px;">4つの道具で、地図を読む</h1>
        <p style="font-size:23px;font-weight:700;color:var(--sumi-mute);line-height:1.4;">※ この地形図の縮尺は 2万5千分の1</p>
      </div>
      <div class="qr" data-at="1"><span class="n">1</span><span class="t">北山から見て寺院は？　→　<span class="blank" data-fill="2"><span class="bnum">1</span><b>南東</b></span></span></div>
      <div class="qr" data-at="3"><span class="n">2</span><span class="t">北山の山頂は何mより高い？　→　<span class="blank" data-fill="4"><span class="bnum">2</span><b>450mより高い</b></span></span></div>
      <div class="qr" data-at="5"><span class="n">3</span><span class="t">病院〜神社は地図上3cm。実際は？　→　<span class="blank" data-fill="6"><span class="bnum">3</span><b>750m</b></span></span></div>
      <div class="qr" data-at="7"><span class="n">4</span><span class="t">大平川はどの方角へ流れる？　→　<span class="blank" data-fill="8"><span class="bnum">4</span><b>北から南</b></span></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(9);</script>
</body>
</html>
