<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>距離を計算する ── 練習4問｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kc-safe { inset: 78px 130px 74px; align-content: start; gap: 24px; }
  .kc-head { display:grid; gap:10px; }
  .kc-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .pc { background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:26px 32px; box-shadow:0 14px 30px rgba(40,30,10,.10); display:grid; gap:12px; }
  .pc .pq { font-size:29px; font-weight:900; color:var(--sumi); line-height:1.4; }
  .pc .pq .s { color:var(--cat); }
  .pc .pcalc { font-size:33px; font-weight:900; color:var(--sumi-soft); font-family:'Zen Old Mincho',serif; }
  .pc .pcalc .imp { color:var(--imp); }
  .pc .blank { font-size:34px; min-width:150px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe kc-safe">
    <div class="kc-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-3</span>　距離の計算</span>
      <h1 class="headline" style="font-size:52px;">「長さ×分母」で、4問とも解ける</h1>
    </div>
    <div class="kc-grid">
      <div class="pc" data-at="1" data-anim="pop">
        <div class="pq"><span class="s">問1</span>　5万分の1の地図で、地図上3cm。実際は？</div>
        <div class="pcalc">3×<span class="imp">50000</span>＝150000cm＝<span class="blank" data-fill="1"><span class="bnum">1</span><b>1500m</b></span></div>
      </div>
      <div class="pc" data-at="2" data-anim="pop">
        <div class="pq"><span class="s">問2</span>　2万5千分の1の地図で、地図上8cm。実際は？</div>
        <div class="pcalc">8×<span class="imp">25000</span>＝200000cm＝<span class="blank" data-fill="2"><span class="bnum">2</span><b>2km</b></span></div>
      </div>
      <div class="pc" data-at="3" data-anim="pop">
        <div class="pq"><span class="s">問3</span>　5万分の1の地図で、地図上6cm。実際は？</div>
        <div class="pcalc">6×<span class="imp">50000</span>＝300000cm＝<span class="blank" data-fill="3"><span class="bnum">3</span><b>3km</b></span></div>
      </div>
      <div class="pc" data-at="4" data-anim="pop">
        <div class="pq"><span class="s">問4</span>　2万5千分の1の地図で、地図上6cm。実際は？</div>
        <div class="pcalc">6×<span class="imp">25000</span>＝150000cm＝<span class="blank" data-fill="4"><span class="bnum">4</span><b>1500m</b></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
