<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>縮尺とは ── 実際の距離を縮めた割合｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sh-safe { inset: 84px 130px 80px; align-content: center; gap: 26px; }
  .sh-head { display:grid; gap:12px; }
  .sh-lead { font-size:33px; color:var(--sumi-soft); font-weight:600; line-height:1.5; }
  .sh-lead .imp { color:var(--imp); font-weight:900; }
  .sh-tbl { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .sc { background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:28px 34px; box-shadow:0 14px 30px rgba(40,30,10,.10); display:grid; gap:14px; }
  .sc .sc-t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); }
  .sc .sc-b { font-size:30px; line-height:1.5; color:var(--sumi-soft); font-weight:700; }
  .sc .blank { font-size:32px; min-width:130px; }
  .sh-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:30px; line-height:1.5; }
  .sh-note b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sh-safe">
    <div class="sh-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-1</span>　縮尺</span>
      <h1 class="headline" style="font-size:56px;">実際の長さを、どれだけ<span class="em">縮めた</span >か</h1>
    </div>
    <p class="sh-lead" data-at="1">実際の距離を地図の上に縮めた割合を<span class="imp">縮尺</span>という。「2万5千分の1」なら、実際の<span class="imp">25000cm</span>を地図上の<span class="imp">1cm</span >に縮めたという意味。</p>
    <div class="sh-tbl">
      <div class="sc" data-at="2" data-anim="left">
        <div class="sc-t">2万5千分の1</div>
        <div class="sc-b">地図上の1cm＝実際に<span class="blank" data-fill="2"><span class="bnum">①</span><b>250m</b></span>（25000cm）。</div>
        <div class="sc-b">せまい範囲を<span class="imp">くわしく</span>表す。</div>
      </div>
      <div class="sc" data-at="3" data-anim="right">
        <div class="sc-t">5万分の1</div>
        <div class="sc-b">地図上の1cm＝実際に<span class="blank" data-fill="3"><span class="bnum">②</span><b>500m</b></span>（50000cm）。</div>
        <div class="sc-b">広い範囲を<span class="imp">おおまか</span>に表す。</div>
      </div>
    </div>
    <div class="sh-note" data-at="4"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">くらべる</span><span>同じ場所なら、分母が小さい<b>2万5千分の1</b>のほうが大きく・くわしく描かれる。</span></div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
