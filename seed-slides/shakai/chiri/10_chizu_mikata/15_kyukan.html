<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>等高線の間隔 ── せまい＝急、広い＝ゆるやか｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 78px 120px 74px; grid-template-columns: 1fr 560px; align-content: center; gap: 52px; align-items: center; }
  .kk-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:20px; }
  .kk-fig svg { width:100%; height:auto; display:block; }
  .kk-txt { display:grid; gap:22px; }
  .kk-head { display:grid; gap:10px; }
  .krow { display:grid; grid-template-columns:150px 1fr; gap:22px; align-items:center; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:22px 28px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .krow .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); text-align:center; line-height:1.2; }
  .krow .tx { font-size:29px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .krow .blank { font-size:31px; min-width:150px; }
  .kk-photo { display:grid; gap:10px; }
  .kk-photo .cap { font-size:21px; font-weight:900; color:var(--sumi-mute); }
  .kk-photo .figure { height:196px; border-radius:18px; border:3px solid var(--sumi);
    box-shadow:0 14px 30px rgba(40,30,10,.14); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kk-safe">
    <div class="kk-fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="792" height="462" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
        <!-- 断面(側面) -->
        <path d="M180,250 L340,60 L720,250 Z" fill="#e8e2d4" stroke="#3a3a39" stroke-width="3"/>
        <!-- 高さ線(水平) -->
        <g stroke="#8b8a88" stroke-width="1.6" stroke-dasharray="6 5">
          <line x1="206.7" y1="210" x2="656.7" y2="210"/>
          <line x1="233.3" y1="180" x2="593.3" y2="180"/>
          <line x1="260" y1="150" x2="530" y2="150"/>
          <line x1="286.7" y1="120" x2="466.7" y2="120"/>
          <line x1="313.3" y1="90" x2="403.3" y2="90"/>
        </g>
        <!-- 投影(垂直) -->
        <g stroke="#c4161c" stroke-width="1.3" stroke-dasharray="3 4" opacity=".8">
          <line x1="206.7" y1="210" x2="206.7" y2="330"/><line x1="233.3" y1="180" x2="233.3" y2="330"/>
          <line x1="260" y1="150" x2="260" y2="330"/><line x1="286.7" y1="120" x2="286.7" y2="330"/>
          <line x1="313.3" y1="90" x2="313.3" y2="330"/>
          <line x1="656.7" y1="210" x2="656.7" y2="330"/><line x1="593.3" y1="180" x2="593.3" y2="330"/>
          <line x1="530" y1="150" x2="530" y2="330"/><line x1="466.7" y1="120" x2="466.7" y2="330"/>
          <line x1="403.3" y1="90" x2="403.3" y2="330"/>
        </g>
        <!-- 地図上の等高線(平面) -->
        <line x1="120" y1="330" x2="720" y2="330" stroke="#3a3a39" stroke-width="2.5"/>
        <g stroke="#9c7a3c" stroke-width="4">
          <line x1="206.7" y1="322" x2="206.7" y2="352"/><line x1="233.3" y1="322" x2="233.3" y2="352"/>
          <line x1="260" y1="322" x2="260" y2="352"/><line x1="286.7" y1="322" x2="286.7" y2="352"/>
          <line x1="313.3" y1="322" x2="313.3" y2="352"/>
          <line x1="656.7" y1="322" x2="656.7" y2="352"/><line x1="593.3" y1="322" x2="593.3" y2="352"/>
          <line x1="530" y1="322" x2="530" y2="352"/><line x1="466.7" y1="322" x2="466.7" y2="352"/>
          <line x1="403.3" y1="322" x2="403.3" y2="352"/>
        </g>
        <text x="360" y="120" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="26" fill="#3a3a39">山頂</text>
        <text x="230" y="290" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="40" fill="#c4161c">A</text>
        <text x="560" y="290" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="40" fill="#3a3a39">B</text>
        <text x="255" y="392" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#c4161c">間隔せまい＝<tspan font-size="26">①</tspan></text>
        <text x="545" y="392" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#3a3a39">間隔広い＝<tspan font-size="26">②</tspan></text>
        <text x="400" y="440" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="21" fill="#8b8a88">↑ 地図上の等高線（真上から見た間隔）</text>
      </svg>
    </div>
    <div class="kk-txt">
      <div class="kk-head" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-2</span>　等高線の間隔</span>
        <h1 class="headline" style="font-size:48px;">つまってる所ほど<span class="em">急</span></h1>
      </div>
      <div class="krow" data-at="1" data-anim="right">
        <span class="yr">間隔が<br>せまい</span>
        <span class="tx">同じ高さ差を短い距離でのぼる＝斜面は<span class="blank" data-fill="1"><span class="bnum">①</span><b>急</b></span>（Aの斜面）。</span>
      </div>
      <div class="krow" data-at="2" data-anim="right">
        <span class="yr">間隔が<br>広い</span>
        <span class="tx">同じ高さ差を長い距離でのぼる＝斜面は<span class="blank" data-fill="2"><span class="bnum">②</span><b>ゆるやか</b></span>（Bの斜面）。</span>
      </div>
      <div class="kk-photo" data-at="2" data-anim="right">
        <span class="cap">実際の山も、左右で斜面のかたむきがちがう</span>
        <div class="figure"><img src="assets/shamen_kyu_yuru.webp" alt="片側が切り立った急斜面、反対側がなだらかに長くのびる斜面の山"></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
