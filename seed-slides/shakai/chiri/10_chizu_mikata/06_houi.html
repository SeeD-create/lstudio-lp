<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>8方位 ── 北を基準に向きを表す｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ho-safe { inset: 84px 130px 80px; grid-template-columns: 900px 1fr; align-content: center; gap: 60px; align-items: center; }
  .ho-grid { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:14px; width:820px; height:820px; }
  .cell { display:flex; align-items:center; justify-content:center; background:var(--paper-hi); border:3px solid var(--hair); border-radius:16px; }
  .cell .blank { font-size:44px; min-width:150px; }
  .cell.mid { background:transparent; border:none; }
  .cell.mid svg { width:250px; height:250px; }
  .ho-txt { display:grid; gap:26px; }
  .ho-head { display:grid; gap:12px; }
  .ho-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:24px 32px; font-size:31px; line-height:1.5; }
  .ho-note b { color:#ff8a8f; }
  .ho-list { display:grid; gap:14px; font-size:29px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .ho-list .k { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ho-safe">
    <div class="ho-grid" data-at="0">
      <div class="cell"><span class="blank" data-fill="2"><span class="bnum">⑧</span><b>北西</b></span></div>
      <div class="cell"><span class="blank" data-fill="1"><span class="bnum">①</span><b>北</b></span></div>
      <div class="cell"><span class="blank" data-fill="2"><span class="bnum">②</span><b>北東</b></span></div>
      <div class="cell"><span class="blank" data-fill="1"><span class="bnum">⑦</span><b>西</b></span></div>
      <div class="cell mid">
        <svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
          <circle cx="125" cy="125" r="112" fill="#fff" stroke="#3a3a39" stroke-width="4"/>
          <circle cx="125" cy="125" r="78" fill="none" stroke="#d8d7d3" stroke-width="2"/>
          <g stroke="#8b8a88" stroke-width="2">
            <line x1="125" y1="13" x2="125" y2="237"/>
            <line x1="13" y1="125" x2="237" y2="125"/>
            <line x1="46" y1="46" x2="204" y2="204"/>
            <line x1="204" y1="46" x2="46" y2="204"/>
          </g>
          <path d="M125,30 L143,125 L125,108 L107,125 Z" fill="#c4161c"/>
          <path d="M125,220 L143,125 L125,142 L107,125 Z" fill="#3a3a39"/>
          <text x="125" y="126" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="30" fill="#3a3a39">方位</text>
        </svg>
      </div>
      <div class="cell"><span class="blank" data-fill="1"><span class="bnum">③</span><b>東</b></span></div>
      <div class="cell"><span class="blank" data-fill="2"><span class="bnum">⑥</span><b>南西</b></span></div>
      <div class="cell"><span class="blank" data-fill="1"><span class="bnum">⑤</span><b>南</b></span></div>
      <div class="cell"><span class="blank" data-fill="2"><span class="bnum">④</span><b>南東</b></span></div>
    </div>
    <div class="ho-txt">
      <div class="ho-head" data-at="0">
        <span class="kicker"><span class="num">Ⅰ-1</span>　8方位</span>
        <h1 class="headline" style="font-size:56px;">北・南・東・西と、その<span class="em">間</span></h1>
      </div>
      <div class="ho-list">
        <div data-at="1">まず基本の<span class="k">4方位</span>（北・南・東・西）。</div>
        <div data-at="2">その間を入れると<span class="k">8方位</span>（4つの斜めの方位を足す）。</div>
      </div>
      <div class="ho-note" data-at="3"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">大原則</span><span>ことわりがなければ、地図は<b>上が北・下が南</b>。左が西・右が東。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
