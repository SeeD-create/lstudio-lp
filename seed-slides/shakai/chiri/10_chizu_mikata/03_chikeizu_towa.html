  .tw-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:29px; line-height:1.5; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　土地のようすを表す地図</span>
      <h1 class="headline" style="font-size:60px;">土地のようすを、正確にうつした地図</h1>
    </div>
    <div class="row" data-at="1" data-anim="left">
      <span class="yr">①</span>
      <span class="tx">山・川・道・建物など土地のようすを、決まったルールで正確に表した地図を<span class="blank" data-fill="1"><span class="bnum">①</span><b>地形図</b></span>という。</span>
    </div>
    <div class="row" data-at="2" data-anim="left">
      <span class="yr">つくる<br>ところ</span>
      <span class="tx">日本の国土を測量し、①をつくっている国の機関を<span class="blank" data-fill="2"><span class="bnum">②</span><b>国土地理院</b></span>という。</span>
    </div>
    <div class="row" data-at="3" data-anim="left">
      <span class="yr">縮尺の<br>種類</span>
      <span class="tx">よく使う縮尺は<span class="blank" data-fill="3"><span class="bnum">③</span><b>2万5千分の1</b></span>と<span class="blank" data-fill="4"><span class="bnum">④</span><b>5万分の1</b></span>の2種類。</span>
    </div>
    <div class="tw-note" data-at="4"><span style="font-family:'Zen Old Mincho',serif;font-weight:900;color:var(--gold-soft);white-space:nowrap;">合言葉</span><span>この地図を読む道具は<b>方位・縮尺・等高線・地図記号</b>の4つ。次からこれを1枚ずつ手に入れていく。</span></div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
