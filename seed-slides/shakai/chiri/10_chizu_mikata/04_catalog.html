<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地図の見方カタログ ── 集める5枚｜中1地理 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 96px 110px 96px; align-content: start; gap: 40px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 30px 22px 32px; min-height: 480px; display: grid; align-content: start; gap: 16px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--cat); opacity:.35; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); line-height:1.15; margin-top:4px; }
  .cc__ess { font-size:24px; color:var(--sumi-soft); line-height:1.45; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:7px 16px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:20px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">04</span>　地図の見方カタログ</span>
      <h1 class="headline" style="font-size:62px;">地図を読む道具は、大きく<span class="em">5種類</span></h1>
    </div>
    <div class="deck-row">
      <div class="cc" data-cat="eq"  data-at="1" data-anim="pop"><div class="cc__no">Ⅰ</div><div class="cc__ttl">方位</div><div class="cc__ess">北・南・東・西と、その間の8方位。上が北が基本。</div><span class="cc__pill">8方位</span></div>
      <div class="cc" data-cat="lib" data-at="2" data-anim="pop"><div class="cc__no">Ⅱ</div><div class="cc__ttl">縮尺</div><div class="cc__ess">実際の長さをどれだけ縮めたか。距離の計算に使う。</div><span class="cc__pill">2万5千分の1</span></div>
      <div class="cc" data-cat="soc" data-at="3" data-anim="pop"><div class="cc__no">Ⅲ</div><div class="cc__ttl">等高線</div><div class="cc__ess">同じ高さを結んだ線。高さ・傾斜・尾根と谷が読める。</div><span class="cc__pill">計曲線・主曲線</span></div>
      <div class="cc" data-cat="par" data-at="4" data-anim="pop"><div class="cc__no">Ⅳ</div><div class="cc__ttl">地図記号</div><div class="cc__ess">建物や土地の使い方を、小さな記号で表す。</div><span class="cc__pill">文・卍・田・畑</span></div>
      <div class="cc" data-cat="new" data-at="5" data-anim="pop"><div class="cc__no">Ⅴ</div><div class="cc__ttl">地形図を<br>読む</div><div class="cc__ess">4つの道具を全部使って、実際の地形図を読みとく。</div><span class="cc__pill">総合読解</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 地図の見方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
