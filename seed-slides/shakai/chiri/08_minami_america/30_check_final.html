<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>総仕上げ ── 南アメリカ州○×クイズ｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fq-safe { align-content:center; gap:30px; justify-items:center; }
  .fq-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .fq-list { display:grid; gap:22px; width:1500px; }
  .fq-row { display:grid; grid-template-columns:1fr 120px; align-items:center; gap:30px; background:var(--paper-hi); border:3px solid var(--sumi); border-radius:20px; padding:26px 36px; box-shadow:0 12px 28px rgba(40,30,10,.08); }
  .fq-q { font-size:33px; font-weight:700; color:var(--sumi); line-height:1.4; }
  .fq-q b { color:var(--imp); }
  .fq-a { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:76px; line-height:1; text-align:center; }
  .fq-a .ex { display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:20px; font-weight:800; color:var(--sumi-mute); margin-top:6px; line-height:1.3; }
  .ok { color:#1f7a3f; } .ng { color:var(--imp); }
  .fq-a .blank { min-width:96px; padding:0 10px 4px; margin:0; }
  .fq-a .ex .blank--para { padding:2px 8px; min-width:120px; }
  .fq-a .ex .blank--para b { color:var(--sumi-mute); font-family:inherit; font-weight:800; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe fq-safe">
    <div class="fq-head" data-at="0">
      <span class="kicker"><span class="num">総仕上げ</span>　南アメリカ州○×クイズ</span>
      <h1 class="headline" style="font-size:52px;">3問で、今日のカードを<span class="em">確かめる</span></h1>
    </div>
    <div class="fq-list">
      <div class="fq-row">
        <div class="fq-q">① 南アメリカ州を占領した2つの国は、スペインと<b>イギリス</b>である。</div>
        <div class="fq-a" data-at="1" data-anim="pop"><span class="ng blank" data-fill="1"><b>×</b></span><span class="ex"><span class="blank blank--para" data-fill="1"><b>正=スペインとポルトガル</b></span></span></div>
      </div>
      <div class="fq-row">
        <div class="fq-q">② ラプラタ川流域に広がる温帯の草原を<b>パンパ</b>という。</div>
        <div class="fq-a" data-at="2" data-anim="pop"><span class="ok blank" data-fill="2"><b>○</b></span><span class="ex"><span class="blank blank--para" data-fill="2"><b>パンパ＝小麦・牛の放牧</b></span></span></div>
      </div>
      <div class="fq-row">
        <div class="fq-q">③ ブラジルで豊富に産出し、日本が最も多く輸入している資源は<b>石油</b>である。</div>
        <div class="fq-a" data-at="3" data-anim="pop"><span class="ng blank" data-fill="3"><b>×</b></span><span class="ex"><span class="blank blank--para" data-fill="3"><b>正=鉄鉱石（石油はベネズエラ）</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
