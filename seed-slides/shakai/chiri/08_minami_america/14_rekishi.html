<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>占領の歴史 ── インカ帝国とヨーロッパ人｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rk-safe { align-content:center; gap:36px; }
  .rk-head { display:grid; gap:12px; }
  .rk-flow { display:grid; grid-template-columns:1fr 60px 1fr 60px 1fr; align-items:stretch; gap:0; }
  .rk-node { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:30px 34px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:12px; align-content:start; }
  .rk-fig { height:230px; border-radius:16px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.12); overflow:hidden; }
  .rk-node .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); }
  .rk-node .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); line-height:1.15; }
  .rk-node .bd { font-size:26px; color:var(--sumi-soft); line-height:1.5; }
  .rk-node .bd b { color:var(--imp); }
  .rk-arrow { display:flex; align-items:center; justify-content:center; font-size:52px; color:var(--sumi-mute); font-weight:900; }
  .blank { font-size:29px; } .blank b { font-size:28px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe rk-safe">
    <div class="rk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-1</span>　占領の歴史</span>
      <h1 class="headline" style="font-size:52px;">先住民の帝国が、ヨーロッパ人に<span class="em">占領</span>された</h1>
    </div>
    <div class="rk-flow">
      <div class="rk-node" data-at="1" data-anim="pop">
        <div class="figure rk-fig"><img src="assets/inca_iseki.webp" alt="先住民の文明 ── 山の尾根に築かれた石積みの遺跡と段々畑"></div>
        <span class="yr">15世紀</span>
        <span class="tt">先住民の文明</span>
        <span class="bd">古くからの先住民が、<b>インカ帝国</b>などの文明を築いていた。</span>
      </div>
      <div class="rk-arrow" data-at="2">→</div>
      <div class="rk-node" data-at="2" data-anim="pop">
        <div class="figure rk-fig"><img src="assets/shokuminchi.webp" alt="占領 ── ヨーロッパ風の石造りの教会と石畳の広場"></div>
        <span class="yr">16世紀</span>
        <span class="tt">占領される</span>
        <span class="bd"><span class="blank" data-fill="1"><b>スペイン</b></span>と<span class="blank" data-fill="2"><b>ポルトガル</b></span>が、ほとんどの地域を占領した。</span>
      </div>
      <div class="rk-arrow" data-at="3">→</div>
      <div class="rk-node" data-at="3" data-anim="pop">
        <div class="figure rk-fig"><img src="assets/ichiba.webp" alt="多様な社会 ── 色とりどりの織物と作物が並ぶ市場"></div>
        <span class="yr">その後</span>
        <span class="tt">混血が進む</span>
        <span class="bd">先住民とヨーロッパ人の<b>混血</b>が進み、多様な人々の社会が生まれた。</span>
      </div>
    </div>
    <div class="example" data-at="4" style="font-size:28px;"><span class="imp">★頻出</span>：占領した2国は①と②。だから今も、南アメリカの多くの国は<b>①の言葉</b>、ブラジルだけ<b>②の言葉</b>を話す。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
