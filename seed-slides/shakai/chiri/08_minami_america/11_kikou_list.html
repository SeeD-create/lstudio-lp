<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>高山気候のしくみ ── 標高で変わる気候｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ka-safe { align-content:center; gap:30px; }
  .ka-head { display:grid; gap:12px; }
  .ka-figbox { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; box-shadow:0 14px 32px rgba(40,30,10,.10); padding:20px 26px; }
  .ka-figbox svg { display:block; width:100%; height:auto; }
  .ka-note { display:flex; gap:20px; align-items:center; }
  .ka-note .example { flex:1; font-size:28px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ka-safe">
    <div class="ka-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-2</span>　高山気候のしくみ</span>
      <h1 class="headline" style="font-size:52px;">同じ赤道の下でも、<span class="em">のぼれば別世界</span></h1>
    </div>
    <div class="ka-figbox" data-at="0">
      <svg viewBox="0 0 1560 470" xmlns="http://www.w3.org/2000/svg">
        <!-- 断面図：西（アンデス・高地）→ 東（アマゾン低地） -->
        <!-- 空 -->
        <rect x="0" y="0" width="1560" height="470" fill="#eef4f7"/>
        <!-- 地面の山型（左が高い） -->
        <path d="M0,150 L120,150 L360,120 L560,300 L900,380 L1560,410 L1560,470 L0,470 Z" fill="#c9bfa4" stroke="#8a7a52" stroke-width="3"/>
        <!-- 標高帯の色 -->
        <path d="M120,150 L360,120 L360,150 Z" fill="#e9edf2" opacity="0.9"/>
        <!-- 熱帯雨林（東の低地）data-at 1 -->
        <g class="fz" data-at="1">
          <circle cx="1180" cy="360" r="30" fill="#2f7f4a"/><circle cx="1250" cy="352" r="36" fill="#3f8f5a"/><circle cx="1330" cy="362" r="30" fill="#2f7f4a"/><circle cx="1420" cy="356" r="34" fill="#3f8f5a"/>
          <rect x="1245" y="366" width="9" height="30" fill="#6b4f22"/><rect x="1325" y="370" width="8" height="26" fill="#6b4f22"/>
          <text x="1300" y="445" font-size="30" font-weight="900" fill="#1f6a3f" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif">低地＝熱帯（セルバ）</text>
        </g>
        <!-- 中腹 温帯的 data-at 2 -->
        <g class="fz" data-at="2">
          <rect x="640" y="300" width="200" height="14" fill="#8fae4a"/>
          <text x="740" y="360" font-size="28" font-weight="900" fill="#5a7a2a" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif">中腹＝すずしい</text>
        </g>
        <!-- 高地 高山気候 data-at 3 -->
        <g class="fz" data-at="3">
          <path d="M300,150 L360,120 L420,150 Z" fill="#ffffff" stroke="#b0c0d0" stroke-width="2"/>
          <text x="360" y="95" font-size="30" font-weight="900" fill="#4a2f70" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif">高地＝高山気候（1年中すずしい）</text>
        </g>
        <!-- 矢印・標高軸 -->
        <line x1="60" y1="440" x2="60" y2="80" stroke="#8B8A88" stroke-width="3"/>
        <text x="46" y="80" font-size="24" font-weight="800" fill="#8B8A88" text-anchor="end" font-family="'Zen Kaku Gothic New',sans-serif">高</text>
        <text x="46" y="440" font-size="24" font-weight="800" fill="#8B8A88" text-anchor="end" font-family="'Zen Kaku Gothic New',sans-serif">低</text>
        <text x="120" y="200" font-size="26" font-weight="900" fill="#8a6b3a" font-family="'Zen Kaku Gothic New',sans-serif">← 西 アンデス山脈</text>
        <text x="1540" y="200" font-size="26" font-weight="900" fill="#8a6b3a" text-anchor="end" font-family="'Zen Kaku Gothic New',sans-serif">東 アマゾン低地 →</text>
      </svg>
    </div>
    <div class="ka-note">
      <div class="example" data-at="4"><span class="imp">★ポイント</span>：気温は<b>標高が100m上がるごとに約0.6℃下がる</b>。だから赤道直下のアンデス山中でも、標高が高ければ<b>高山気候</b>になる。</div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5, function(step){
  document.querySelectorAll('svg .fz[data-at]').forEach(function(el){
    el.style.opacity = (step >= +el.dataset.at) ? 1 : 0;
    el.style.transition = 'opacity .5s';
  });
});</script>
</body>
</html>
