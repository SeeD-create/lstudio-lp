<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>混血と言語 ── メスチソとポルトガル語｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mz-safe { align-content:center; gap:34px; }
  .mz-head { display:grid; gap:12px; }
  .mz-row { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:stretch; }
  .mz-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:34px 40px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:16px; align-content:start; }
  .mz-card h3 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); margin:0; }
  .mz-eq { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:28px; color:var(--sumi-soft); font-weight:800; }
  .mz-eq .p { background:var(--paper-lo); border-radius:12px; padding:10px 20px; color:var(--sumi); }
  .mz-eq .op { font-size:34px; color:var(--sumi-mute); }
  .mz-lang { display:grid; gap:14px; }
  .mz-lang .l { display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; font-size:29px; color:var(--sumi-soft); }
  .mz-lang .l .k { font-weight:900; color:var(--sumi); background:var(--paper-lo); border-radius:10px; padding:8px 18px; white-space:nowrap; }
  .blank { font-size:31px; } .blank b { font-size:30px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe mz-safe">
    <div class="mz-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-2</span>　混血と言語</span>
      <h1 class="headline" style="font-size:52px;">混ざり合って生まれた、<span class="em">多様な人々</span></h1>
    </div>
    <div class="mz-row">
      <div class="mz-card" data-at="1" data-anim="pop">
        <h3>先住民と白人の混血</h3>
        <div class="mz-eq">
          <span class="p">先住民</span><span class="op">＋</span><span class="p">ヨーロッパ人（白人）</span>
        </div>
        <div class="mz-eq"><span class="op">＝</span><span class="blank" data-fill="1" style="font-size:40px;"><b>メスチソ</b></span></div>
        <p class="lead" style="font-size:25px;margin-top:4px;">占領のあと混血が進み、南アメリカの人々の多くをしめるようになった。</p>
      </div>
      <div class="mz-card" data-at="2" data-anim="pop">
        <h3>公用語（占領した国の言葉）</h3>
        <div class="mz-lang">
          <div class="l" data-at="3"><span class="k">ブラジル</span><span><span class="blank" data-fill="2"><b>ポルトガル語</b></span>（ポルトガルが占領）</span></div>
          <div class="l" data-at="4"><span class="k">その他の多くの国</span><span><span class="blank" data-fill="3"><b>スペイン語</b></span>（スペインが占領）</span></div>
        </div>
        <p class="lead" style="font-size:25px;margin-top:4px;"><span class="imp">★頻出</span>：ブラジルだけ言葉がちがう理由＝<b>占領した国がポルトガルだったから</b>。</p>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
