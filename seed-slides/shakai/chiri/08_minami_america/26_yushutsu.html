<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日本のブラジルからの輸入 ── 鉄鉱石とコーヒー｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .yu-safe { inset: 66px 120px 74px; grid-template-columns: 620px 1fr; align-content:center; gap:56px; align-items:center; }
  .yu-chart { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; box-shadow:0 14px 32px rgba(40,30,10,.10); padding:26px; }
  .yu-chart svg { display:block; width:100%; height:auto; }
  .yu-list { display:grid; gap:16px; align-content:center; }
  .yu-list h2 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:42px; margin:0 0 4px; color:var(--sumi); }
  .yu-item { display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; font-size:29px; color:var(--sumi-soft); border-bottom:2px solid var(--hair); padding-bottom:10px; }
  .yu-item .sw { width:26px; height:26px; border-radius:6px; }
  .yu-item .nm { font-weight:800; color:var(--sumi); }
  .yu-item .pc { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .yu-item.imp .nm, .yu-item.imp .pc { color:var(--imp); }
  .blank { font-size:31px; } .blank b { font-size:30px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe yu-safe">
    <div class="yu-chart" data-at="0" data-anim="left">
      <svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
        <text x="200" y="34" font-size="23" font-weight="900" fill="#141414" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif">ブラジルからの輸入品（2022年）</text>
        <!-- ドーナツ：鉄鉱石を赤で強調 -->
        <g transform="translate(200,220)">
          <!-- 円全体（グレー） -->
          <circle r="140" fill="none" stroke="#d7d5d0" stroke-width="80"/>
          <!-- 鉄鉱石 39.9% = 0.399*360=143.6°：上から時計回り -->
          <circle r="140" fill="none" stroke="#C4161C" stroke-width="80"
            stroke-dasharray="350.8 528.6" transform="rotate(-90)" />
          <text x="0" y="-4" font-size="46" font-weight="900" fill="#C4161C" text-anchor="middle" font-family="'Zen Old Mincho',serif">39.9%</text>
          <text x="0" y="36" font-size="30" font-weight="900" fill="#C4161C" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif">①</text>
        </g>
      </svg>
    </div>
    <div class="yu-list">
      <h2 data-at="0">日本が輸入する上位品目</h2>
      <div class="yu-item imp" data-at="1"><span class="sw" style="background:#C4161C;"></span><span class="nm">① 地下資源</span><span class="pc">39.9%</span></div>
      <div class="yu-item" data-at="2"><span class="sw" style="background:#b8b6b1;"></span><span class="nm">肉類</span><span class="pc">11.9%</span></div>
      <div class="yu-item" data-at="3"><span class="sw" style="background:#c9c7c2;"></span><span class="nm">有機化合物</span><span class="pc">9.6%</span></div>
      <div class="yu-item" data-at="4"><span class="sw" style="background:#7a3b12;"></span><span class="nm">② 農作物</span><span class="pc">ほか</span></div>
      <p class="lead" data-at="4" style="font-size:26px;margin-top:2px;"><span class="imp">★頻出</span>：日本がブラジルから輸入する最大の品目①は<span class="blank" data-fill="1"><b>鉄鉱石</b></span>。農作物②では<span class="blank" data-fill="2"><b>コーヒー</b></span>が代表。</p>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
