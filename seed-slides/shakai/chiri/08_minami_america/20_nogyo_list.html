<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2つの農業地帯 ── カンポとパンパ、そして大豆｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nl-safe { align-content:center; gap:32px; }
  .nl-head { display:grid; gap:12px; }
  .nl-row { display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  .nl-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:30px 34px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; grid-template-columns:320px 1fr; gap:28px; align-items:center; }
  .nl-fig { height:240px; border-radius:18px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.12); overflow:hidden; }
  .nl-txt { display:grid; gap:14px; align-content:center; }
  .nl-card h3 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); margin:0; display:flex; align-items:baseline; gap:14px; }
  .nl-card h3 small { font-size:24px; color:var(--sumi-mute); font-weight:700; }
  .nl-card .bd { font-size:28px; color:var(--sumi-soft); line-height:1.5; }
  .nl-card .bd b { color:var(--imp); }
  .nl-daizu { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:29px; line-height:1.5; }
  .nl-daizu .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; font-size:34px; }
  .nl-daizu b { color:#ff8a8f; }
  .blank { font-size:30px; } .blank b { font-size:29px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe nl-safe">
    <div class="nl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-2</span>　2つの農業地帯</span>
      <h1 class="headline" style="font-size:52px;">草原ごとに、<span class="em">作るものがちがう</span></h1>
    </div>
    <div class="nl-row">
      <div class="nl-card" data-at="1" data-anim="pop">
        <div class="figure nl-fig"><img src="assets/coffee_nouen.webp" alt="コーヒー農園 ── 丘に列をなす低木と赤く熟した実"></div>
        <div class="nl-txt">
          <h3>カンポ <small>ブラジル高原</small></h3>
          <span class="bd"><span class="blank" data-fill="1"><b>コーヒー</b></span>の大農園が広がる。近年は<b>大豆</b>の栽培も急増している。</span>
        </div>
      </div>
      <div class="nl-card" data-at="2" data-anim="pop">
        <div class="figure nl-fig"><img src="assets/pampa_bokujo.webp" alt="パンパ ── 小麦畑と牛の放牧が広がる温帯の草原"></div>
        <div class="nl-txt">
          <h3>パンパ <small>ラプラタ川流域</small></h3>
          <span class="bd"><span class="blank" data-fill="2"><b>小麦</b></span>の栽培や、<span class="blank" data-fill="3"><b>牛</b></span>の放牧が盛ん。（主にアルゼンチン）</span>
        </div>
      </div>
    </div>
    <div class="nl-daizu" data-at="3"><span class="k">★世界一</span><span>ブラジルは<b>大豆の生産量が世界1位</b>（約34.6％・2022年）。とうもろこしの生産も世界有数。</span></div>
    <div class="example" data-at="4" style="font-size:27px;"><span class="imp">★整理</span>：<b>高原の農業</b>と<b>草原の農業</b>を区別する。「豆は高原、牛は南の草原」と覚える。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
