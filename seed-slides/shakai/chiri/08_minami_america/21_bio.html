<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>バイオエタノール ── さとうきびから作る新燃料｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bo-safe { align-content:center; gap:38px; }
  .bo-head { display:grid; gap:12px; }
  .bo-flow { display:grid; grid-template-columns:1fr 70px 1fr 70px 1fr; align-items:center; gap:0; }
  .bo-node { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:30px 30px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:14px; justify-items:center; text-align:center; }
  .bo-fig { width:100%; height:250px; border-radius:16px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.12); overflow:hidden; }
  .bo-node .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); line-height:1.15; }
  .bo-node .bd { font-size:24px; color:var(--sumi-soft); line-height:1.45; }
  .bo-arrow { display:flex; align-items:center; justify-content:center; font-size:52px; color:var(--sumi-mute); font-weight:900; }
  .blank { font-size:34px; } .blank b { font-size:33px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe bo-safe">
    <div class="bo-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-3</span>　石油に代わるエネルギー</span>
      <h1 class="headline" style="font-size:52px;">さとうきびが、<span class="em">車の燃料</span>になる</h1>
    </div>
    <div class="bo-flow">
      <div class="bo-node" data-at="1" data-anim="pop">
        <div class="figure bo-fig"><img src="assets/satoukibi.webp" alt="さとうきび畑 ── 背の高い茎が一面に育つ"></div>
        <span class="tt">さとうきび</span>
        <span class="bd">ブラジルで大量に栽培される、育つのが早い作物。</span>
      </div>
      <div class="bo-arrow" data-at="2">→</div>
      <div class="bo-node" data-at="2" data-anim="pop">
        <div class="figure bo-fig"><img src="assets/ethanol_kojo.webp" alt="バイオエタノールをつくる工場 ── タンクと蒸留塔が並ぶ"></div>
        <span class="tt"><span class="blank" data-fill="1"><b>バイオエタノール</b></span></span>
        <span class="bd">さとうきびを原料に作る<b>再生可能な燃料</b>（バイオ燃料）。</span>
      </div>
      <div class="bo-arrow" data-at="3">→</div>
      <div class="bo-node" data-at="3" data-anim="pop">
        <div class="figure bo-fig"><img src="assets/kyuyu.webp" alt="車の燃料として使う ── 給油ノズルを差しこむようす"></div>
        <span class="tt">石油の代わり</span>
        <span class="bd"><b>石油に代わるエネルギー源</b>として、自動車の燃料などに使われる。</span>
      </div>
    </div>
    <div class="example" data-at="4" style="font-size:28px;"><span class="imp">★頻出フレーズ</span>：「<b>さとうきびを原料とした再生可能燃料で、石油に代わるエネルギー源</b>」がその答え。植物由来なので、燃やしても大気中のCO₂を増やしにくいとされる。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
