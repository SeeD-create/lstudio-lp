<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3つの地下資源 ── 鉄鉱石・銅・石油｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sh-safe { align-content:center; gap:36px; }
  .sh-head { display:grid; gap:12px; }
  .sh-row { display:grid; grid-template-columns:repeat(3,1fr); gap:34px; }
  .sh-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:30px 34px 32px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:14px; align-content:start; }
  .sh-fig { height:210px; border-radius:18px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.12); overflow:hidden; }
  .sh-name { display:flex; align-items:center; gap:16px; }
  .sh-card .ic { flex:none; width:58px; height:58px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:30px; color:#fff; }
  .sh-card .res { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); }
  .sh-card .cty { font-size:30px; font-weight:800; color:var(--imp); }
  .sh-card .bd { font-size:26px; color:var(--sumi-soft); line-height:1.5; }
  .blank { font-size:32px; } .blank b { font-size:31px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe sh-safe">
    <div class="sh-head" data-at="0">
      <span class="kicker"><span class="num">Ⅴ-1</span>　地下資源</span>
      <h1 class="headline" style="font-size:52px;">国ごとに、<span class="em">得意な資源</span>がある</h1>
    </div>
    <div class="sh-row">
      <div class="sh-card" data-at="1" data-anim="pop">
        <div class="figure sh-fig"><img src="assets/tekkozan.webp" alt="鉄鉱石の露天掘り ── 赤茶色の階段状に掘りひらかれた鉱山"></div>
        <span class="sh-name"><span class="ic" style="background:#8a2318;">鉄</span>
        <span class="res"><span class="blank" data-fill="1"><b>鉄鉱石</b></span></span></span>
        <span class="cty">ブラジル</span>
        <span class="bd">製鉄に必要な原料。ブラジルは<b>世界有数の産出国</b>で、日本へも多く輸出。</span>
      </div>
      <div class="sh-card" data-at="2" data-anim="pop">
        <div class="figure sh-fig"><img src="assets/douzan.webp" alt="銅の露天掘り ── アンデス高地のすり鉢状の巨大な鉱山"></div>
        <span class="sh-name"><span class="ic" style="background:#b8651f;">銅</span>
        <span class="res"><span class="blank" data-fill="2"><b>銅</b></span></span></span>
        <span class="cty">チリ</span>
        <span class="bd">アンデス山中で多く産出。<b>チリは世界最大級の銅の産出国</b>。</span>
      </div>
      <div class="sh-card" data-at="3" data-anim="pop">
        <div class="figure sh-fig"><img src="assets/yuden.webp" alt="油田 ── ポンプが並ぶ石油の採掘地"></div>
        <span class="sh-name"><span class="ic" style="background:#333;">油</span>
        <span class="res"><span class="blank" data-fill="3"><b>石油</b></span></span></span>
        <span class="cty">ベネズエラ</span>
        <span class="bd">大陸北部のベネズエラで多く産出。国の経済を支える資源。</span>
      </div>
    </div>
    <div class="example" data-at="4" style="font-size:28px;"><span class="imp">★セットで覚える</span>：<b>①＝ブラジル</b>／<b>銅＝チリ</b>／<b>③＝ベネズエラ</b>。国名と資源をひもづけて暗記。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
