<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nk-safe { align-content:center; gap:34px; }
  .nk-head { display:grid; gap:12px; }
  .nk-row { display:grid; grid-template-columns:1.15fr 1fr; gap:40px; align-items:stretch; }
  .nk-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:34px 40px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:16px; align-content:start; }
  .nk-card h3 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); margin:0; }
  .nk-card .bd { font-size:28px; color:var(--sumi-soft); line-height:1.55; }
  .nk-card .bd b { color:var(--imp); }
  .nk-big { display:flex; align-items:baseline; gap:14px; }
  .nk-big .num { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:96px; color:var(--imp); line-height:1; }
  .nk-big .u { font-size:34px; font-weight:800; color:var(--sumi); }
  .blank { font-size:31px; } .blank b { font-size:30px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe nk-safe">
    <div class="nk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-3</span>　日系人とブラジルの発展</span>
      <h1 class="headline" style="font-size:52px;">日本とつながる大国、<span class="em">ブラジル</span></h1>
    </div>
    <div class="nk-row">
      <div class="nk-card" data-at="1" data-anim="pop">
        <h3>ブラジルへわたった人々</h3>
        <span class="bd"><b>1908年</b>からブラジルへの<span class="blank" data-fill="1"><b>移民</b></span>が始まった。現在では2世・3世など、<b>日系人</b>が多く暮らしている。</span>
        <div class="nk-big" data-at="2"><span class="num">約190</span><span class="u">万人の日系人が暮らす</span></div>
      </div>
      <div class="nk-card" data-at="3" data-anim="pop">
        <h3>成長する経済大国</h3>
        <span class="bd">ブラジルは産業がめざましく発展し、<span class="blank" data-fill="2"><b>BRICS</b></span>の1つに数えられる新興国。</span>
        <span class="bd" data-at="4">公用語は<span class="blank" data-fill="3"><b>ポルトガル語</b></span>。南アメリカ最大の面積・人口をもつ。</span>
      </div>
    </div>
    <div class="example" data-at="4" style="font-size:27px;"><span class="imp">★新興5か国とは</span>：発展がめざましい5つの新興国 ── <b>ブラジル・ロシア・インド・中国・南アフリカ共和国</b> の頭文字。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
