<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アマゾンの開発と森林破壊 ── 発展と環境のジレンマ｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { align-content:center; gap:34px; }
  .kk-head { display:grid; gap:12px; }
  .kk-flow { display:grid; grid-template-columns:1fr 64px 1fr 64px 1fr; align-items:center; gap:0; }
  .kk-node { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:28px 30px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:12px; justify-items:center; text-align:center; }
  .kk-fig { width:100%; height:245px; border-radius:16px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.12); overflow:hidden; }
  .kk-node .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); line-height:1.15; }
  .kk-node .bd { font-size:24px; color:var(--sumi-soft); line-height:1.45; }
  .kk-node.bad { border-color:var(--imp); }
  .kk-node.bad .tt { color:var(--imp); }
  .kk-arrow { display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--sumi-mute); font-weight:900; }
  .blank { font-size:32px; } .blank b { font-size:31px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅴ-3</span>　開発と環境</span>
      <h1 class="headline" style="font-size:52px;">アマゾンの開発が生んだ、<span class="em">大きな課題</span></h1>
    </div>
    <div class="kk-flow">
      <div class="kk-node" data-at="1" data-anim="pop">
        <div class="figure kk-fig"><img src="assets/kaihatsu_douro.webp" alt="アマゾンの開発 ── 熱帯雨林をつらぬく赤土の道路"></div>
        <span class="tt">アマゾンの開発</span>
        <span class="bd">道路づくり・農地・牧場・鉱山の開発を進めた。</span>
      </div>
      <div class="kk-arrow" data-at="2">→</div>
      <div class="kk-node" data-at="2" data-anim="pop">
        <div class="figure kk-fig"><img src="assets/yakihata.webp" alt="熱帯雨林を伐採・焼く ── 煙が立ちのぼる焼けた土地"></div>
        <span class="tt">熱帯雨林を伐採</span>
        <span class="bd">広大な<b>セルバ（熱帯雨林）</b>が切りひらかれ、焼かれた。</span>
      </div>
      <div class="kk-arrow" data-at="3">→</div>
      <div class="kk-node bad" data-at="3" data-anim="pop">
        <div class="figure kk-fig"><img src="assets/shinrin_hakai.webp" alt="森林破壊 ── 森が切り取られ裸地が広がる空からのながめ"></div>
        <span class="tt"><span class="blank" data-fill="1"><b>森林破壊</b></span></span>
        <span class="bd">生き物のすみかが失われ、地球温暖化にもつながる問題に。</span>
      </div>
    </div>
    <div class="example" data-at="4" style="font-size:28px;"><span class="imp">★ジレンマ</span>：<b>経済の発展</b>のための開発が、①という環境問題を引き起こす。ブラジルは「発展」と「環境保護」の両立という課題をかかえている。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
