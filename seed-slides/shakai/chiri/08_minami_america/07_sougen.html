<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3つの植生 ── セルバ・カンポ・パンパの使い分け｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sg-safe { align-content:center; gap:36px; }
  .sg-head { display:grid; gap:12px; }
  .sg-row { display:grid; grid-template-columns:repeat(3,1fr); gap:34px; }
  .sg-card { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; padding:0 0 30px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:16px; overflow:hidden; }
  .sg-vis { height:220px; border-bottom:3px solid var(--sumi); overflow:hidden; box-shadow:none; border-radius:0; }
  .sg-vis img { display:block; width:100%; height:100%; object-fit:cover; }
  .sg-body { padding:0 34px; display:grid; gap:12px; }
  .sg-card .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); }
  .sg-card .tag { align-self:start; }
  .sg-card .bd { font-size:28px; color:var(--sumi-soft); line-height:1.5; }
  .sg-card .bd b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sg-safe">
    <div class="sg-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-2</span>　植生の使い分け</span>
      <h1 class="headline" style="font-size:54px;">「森」と「草原」を、名前で見分ける</h1>
    </div>
    <div class="sg-row">
      <div class="sg-card" data-at="1" data-anim="pop">
        <div class="figure sg-vis"><img src="assets/selva.webp" alt="セルバ ── うっそうとした熱帯雨林"></div>
        <div class="sg-body">
          <span class="tag tag--cat">熱帯雨林</span>
          <span class="tt">セルバ</span>
          <span class="bd"><b>アマゾン川</b>の流域に広がる、うっそうとした<b>熱帯雨林</b>。赤道付近の暑く雨が多い気候が育てる。</span>
        </div>
      </div>
      <div class="sg-card" data-at="2" data-anim="pop">
        <div class="figure sg-vis"><img src="assets/campo.webp" alt="カンポ ── まばらに木が立つサバナの草原"></div>
        <div class="sg-body">
          <span class="tag tag--cat">サバナ（草原）</span>
          <span class="tt">カンポ</span>
          <span class="bd"><b>ブラジル高原</b>に広がる草原。まばらに木が生える。近年は<b>コーヒー・大豆</b>の大農園に開かれた。</span>
        </div>
      </div>
      <div class="sg-card" data-at="3" data-anim="pop">
        <div class="figure sg-vis"><img src="assets/pampa.webp" alt="パンパ ── 地平線まで続く温帯の草原"></div>
        <div class="sg-body">
          <span class="tag tag--cat">温帯草原</span>
          <span class="tt">パンパ</span>
          <span class="bd"><b>ラプラタ川</b>流域（アルゼンチン）に広がる温帯の草原。<b>小麦の栽培や牛の放牧</b>が盛ん。</span>
        </div>
      </div>
    </div>
    <div class="example" data-at="4" style="font-size:29px;"><span class="imp">★区別のコツ</span>：<b>セルバ＝森（熱帯雨林）</b>／<b>カンポ・パンパ＝草原</b>。カンポは赤道寄りのブラジル高原、パンパは南のラプラタ川流域。</div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
