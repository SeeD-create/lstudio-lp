<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>南アメリカってどんな州？ ── 地球の裏側の大陸｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hk-safe { align-content:center; gap:40px; }
  .hk-head { display:grid; gap:14px; }
  .hk-lead { font-size:36px; color:var(--sumi-soft); line-height:1.55; max-width:1560px; }
  .hk-lead .strong { color:var(--sumi); font-weight:900; }
  .hk-lead .imp { color:var(--imp); font-weight:900; }
  .hk-row { display:grid; grid-template-columns:repeat(3,1fr); gap:34px; }
  .hk-card { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; padding:30px 34px 32px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:14px; }
  .hk-fig { height:160px; border-radius:18px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.12); overflow:hidden; }
  .hk-name { display:flex; align-items:baseline; gap:16px; }
  .hk-card .ic { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--imp); }
  .hk-card .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .hk-card .bd { font-size:28px; color:var(--sumi-soft); line-height:1.5; }
  .hk-card .bd b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">第8章</span>　南アメリカ州とは</span>
      <h1 class="headline" style="font-size:70px;">日本の<span class="em">真裏</span>にある、自然のスケールが桁ちがいの大陸</h1>
      <p class="hk-lead">太平洋と大西洋にはさまれ、<span class="strong">赤道が北部を横切る</span>大陸。「世界一」がいくつもある ── その顔ぶれを、まずはざっと見てみよう。</p>
    </div>
    <div class="hk-row">
      <div class="hk-card" data-at="1" data-anim="pop">
        <div class="figure hk-fig"><img src="assets/andes.webp" alt="アンデス山脈 ── 雪をいただく7000m級の山なみ"></div>
        <span class="hk-name"><span class="ic">山</span><span class="tt">アンデス山脈</span></span>
        <span class="bd">大陸の西を南北に走る、<b>7000m級</b>の山々。世界最長クラスの山脈。</span></div>
      <div class="hk-card" data-at="2" data-anim="pop">
        <div class="figure hk-fig"><img src="assets/amazon_kawa.webp" alt="アマゾン川 ── 熱帯雨林の中を蛇行する巨大な川"></div>
        <span class="hk-name"><span class="ic">川</span><span class="tt">アマゾン川</span></span>
        <span class="bd"><b>世界で最も流域面積が広い</b>川。流域には広大な熱帯雨林が広がる。</span></div>
      <div class="hk-card" data-at="3" data-anim="pop">
        <div class="figure hk-fig"><img src="assets/brazil_toshi.webp" alt="ブラジル ── 海に面した大都市の町なみ"></div>
        <span class="hk-name"><span class="ic">人</span><span class="tt">ブラジル</span></span>
        <span class="bd">南アメリカ最大の国。<b>約190万人の日系人</b>が暮らし、日本とも縁が深い。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
