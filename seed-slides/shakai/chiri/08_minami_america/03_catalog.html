<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>南アメリカ州カタログ ── 集める5枚｜中1地理 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ct-safe { align-content:center; gap:36px; }
  .ct-head { display:grid; gap:12px; justify-items:center; text-align:center; }
  .ct-row { display:grid; grid-template-columns:repeat(5,1fr); gap:22px; }
  .ct-card { position:relative; background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:28px 24px 26px; box-shadow:0 14px 30px rgba(40,30,10,.12); display:grid; gap:12px; overflow:hidden; }
  .ct-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); }
  .ct-card .rn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); letter-spacing:.04em; }
  .ct-card .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); line-height:1.1; }
  .ct-card .rb { font-size:22px; color:var(--sumi-soft); line-height:1.45; }
  .ct-card .rk { display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .ct-card .rk span { font-size:18px; font-weight:800; color:var(--sumi); background:var(--paper-lo); border-radius:9px; padding:5px 12px; }
  .ct-plate { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:120px; color:var(--cat); opacity:.08; position:absolute; right:6px; bottom:-24px; line-height:1; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe ct-safe">
    <div class="ct-head" data-at="0">
      <span class="kicker"><span class="num">CATALOG</span>　集める5枚</span>
      <h1 class="headline" style="font-size:64px;">この5枚がそろえば、南アメリカは<span class="em">完成</span></h1>
    </div>
    <div class="ct-row">
      <div class="ct-card" data-cat="eq" data-at="1" data-anim="pop"><span class="rn">CARD Ⅰ</span><span class="rt">自然</span><span class="rb">世界一のスケール。山・川・草原。</span><span class="rk"><span>アンデス</span><span>アマゾン</span><span>パンパ</span></span><span class="ct-plate">Ⅰ</span></div>
      <div class="ct-card" data-cat="lib" data-at="2" data-anim="pop"><span class="rn">CARD Ⅱ</span><span class="rt">気候</span><span class="rb">赤道の熱帯と、標高が決める高山気候。</span><span class="rk"><span>熱帯</span><span>温帯</span><span>高山</span></span><span class="ct-plate">Ⅱ</span></div>
      <div class="ct-card" data-cat="soc" data-at="3" data-anim="pop"><span class="rn">CARD Ⅲ</span><span class="rt">歴史と人々</span><span class="rb">占領・混血・移民。多様な人々。</span><span class="rk"><span>メスチソ</span><span>日系人</span><span>ポルトガル語</span></span><span class="ct-plate">Ⅲ</span></div>
      <div class="ct-card" data-cat="par" data-at="4" data-anim="pop"><span class="rn">CARD Ⅳ</span><span class="rt">農業</span><span class="rb">コーヒー・大豆・牛。そして新燃料。</span><span class="rk"><span>コーヒー</span><span>大豆</span><span>バイオ燃料</span></span><span class="ct-plate">Ⅳ</span></div>
      <div class="ct-card" data-cat="new" data-at="5" data-anim="pop"><span class="rn">CARD Ⅴ</span><span class="rt">資源とブラジル</span><span class="rb">鉄鉱石・銅、そしてBRICSの大国。</span><span class="rk"><span>鉄鉱石</span><span>BRICS</span><span>森林破壊</span></span><span class="ct-plate">Ⅴ</span></div>
    </div>
    <p class="lead" data-at="6" style="justify-self:center;text-align:center;font-size:30px;">まずは <span class="strong">CARD Ⅰ・自然</span> から集めていこう。</p>
  </div>
  <div class="seed-foot"><span>第8章 南アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
