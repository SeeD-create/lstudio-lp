<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>梅雨と台風 ── 水の災害が集まる季節｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tt-safe { inset: 78px 120px 74px; align-content: center; gap: 40px; }
  .hd { display:grid; gap:10px; }
  .row2 { display:grid; grid-template-columns: repeat(2,1fr); gap: 40px; }
  .cd { background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; box-shadow:0 16px 34px rgba(40,30,10,.12); overflow:hidden; display:grid; align-content:start; min-height: 500px; }
  .cd .h { background:var(--c); color:#fff; padding:16px 28px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; display:flex; align-items:baseline; gap:16px; }
  .cd .h small { font-size:22px; font-weight:700; opacity:.9; }
  .cd .b { padding:26px 30px 28px; display:grid; grid-template-columns: 1fr 330px; gap:26px; align-items:start; }
  .cd .bt { display:grid; gap:20px; }
  .cd .b p { margin:0; font-size:29px; line-height:1.55; color:var(--sumi-soft); font-weight:600; }
  .cd .b p .blank { font-size:31px; }
  .cdfig { height:470px; border-radius:16px; border:2px solid var(--hair);
    box-shadow:0 10px 26px rgba(40,30,10,.12); overflow:hidden; }
  .dm { display:flex; flex-wrap:wrap; gap:12px; }
  .dm span { padding:10px 20px; border-radius:999px; background:var(--imp-bg); color:var(--imp); font-weight:900; font-size:25px; border:2px solid var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe tt-safe">
    <div class="hd" data-at="0">
      <span class="kicker"><span class="num">Ⅴ-5</span>　水の災害が集まる季節</span>
      <h1 class="headline" style="font-size:56px;">日本の<span class="em">水の災害</span>は、季節でやってくる</h1>
    </div>
    <div class="row2">
      <div class="cd" style="--c:#1F6FB2" data-at="1" data-anim="pop">
        <div class="h">⑶ 6月中ごろ〜約1か月 <small>長雨</small></div>
        <div class="b">
          <div class="bt">
            <p>この時期を<span class="blank" data-fill="1"><span class="bnum">①</span><b>梅雨</b></span>といい、長雨が続く。</p>
            <p data-at="2">このとき起きる災害</p>
            <div class="dm" data-at="2">
              <span><span class="blank" data-fill="2" style="min-width:120px"><span class="bnum">②</span><b>洪水</b></span></span>
              <span><span class="blank" data-fill="3" style="min-width:120px"><span class="bnum">③</span><b>がけ</b></span>くずれ</span>
            </div>
            <p data-at="3" style="font-size:24px;color:var(--sumi-mute);">前線が日本の上に長くとどまり、同じ場所で雨が降り続く。</p>
          </div>
          <div class="figure cdfig"><img src="assets/tsuyu.webp" alt="低くたれこめた雨雲から降り続く雨と、水かさの増した川"></div>
        </div>
      </div>
      <div class="cd" style="--c:#C4161C" data-at="4" data-anim="pop">
        <div class="h">⑷ 夏から秋にかけて <small>熱帯低気圧</small></div>
        <div class="b">
          <div class="bt">
            <p><span class="blank" data-fill="4"><span class="bnum">①</span><b>台風</b></span>がきて、強い風と大雨をもたらす。</p>
            <p data-at="5">このとき起きる災害</p>
            <div class="dm" data-at="5">
              <span><span class="blank" data-fill="5" style="min-width:120px"><span class="bnum">②</span><b>洪水</b></span></span>
              <span><span class="blank" data-fill="5" style="min-width:120px"><span class="bnum">③</span><b>がけ</b></span>くずれ</span>
              <span><span class="blank" data-fill="6" style="min-width:120px"><span class="bnum">④</span><b>高潮</b></span></span>
            </div>
            <p data-at="6" style="font-size:24px;color:var(--sumi-mute);">これは低い気圧と強風で<span class="imp">海水面が上昇</span>し、海水が陸におしよせる。</p>
          </div>
          <div class="figure cdfig"><img src="assets/taifu.webp" alt="台風の暗い空と強風にしなる木々、白く波立つ海"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
