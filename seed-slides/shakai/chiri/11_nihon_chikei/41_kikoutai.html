<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世界の気候帯でみた日本 ── 冷帯と温帯｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kt-safe { inset: 80px 130px 76px; align-content: center; gap: 36px; }
  .hd { display:grid; gap:10px; }
  .row2 { display:grid; grid-template-columns: repeat(2,1fr); gap: 44px; }
  .cd { background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; box-shadow:0 16px 34px rgba(40,30,10,.12); overflow:hidden; display:grid; align-content:start; }
  .cd .h { background:var(--c); color:#fff; padding:16px 28px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; }
  .cd .b { padding:26px 30px 30px; display:grid; gap:18px; }
  .cd .b .a { font-size:36px; }
  .cd .b p { margin:0; font-size:26px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .cd .b p .imp { color:var(--imp); font-weight:900; }
  .foot { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:17px 29px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .foot .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color: var(--sumi); white-space:nowrap; }
  .foot .bb { font-size:26px; line-height:1.45; }
  .foot .bb .blank { font-size:28px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kt-safe">
    <div class="hd" data-at="0">
      <span class="kicker"><span class="num">Ⅵ-1</span>　世界の気候帯でみると</span>
      <h1 class="headline" style="font-size:58px;">日本は<span class="em">2つの気候帯</span>にまたがる国</h1>
    </div>
    <div class="row2">
      <div class="cd" style="--c:#5B7FBF" data-at="1" data-anim="pop">
        <div class="h">北海道と東北地方の北部</div>
        <div class="b">
          <div><span class="blank a" data-fill="1"><span class="bnum">①</span><b>冷帯（亜寒帯）</b></span></div>
          <p>夏が短く、<span class="imp">冬の寒さがきびしい</span>。<br>針葉樹の森が広がる。</p>
        </div>
      </div>
      <div class="cd" style="--c:#D2564F" data-at="2" data-anim="pop">
        <div class="h">その他の地域</div>
        <div class="b">
          <div><span class="blank a" data-fill="2"><span class="bnum">②</span><b>温帯</b></span></div>
          <p>くわしくは<span class="imp">温暖湿潤気候</span>。<br>降水量が比較的多く、<span class="imp">四季の変化がはっきり</span>している。</p>
        </div>
      </div>
    </div>
    <div class="foot" data-at="3"><span class="tt">⑵ そして</span><span class="bb">日本の気候は<span class="blank" data-fill="3"><b>季節風（モンスーン）</b></span>の影響を強く受けた気候である。</span></div>
    <div class="foot" data-at="4" style="background:var(--paper-hi);color:var(--sumi);border:3px solid var(--sumi-mute);"><span class="tt" style="color:var(--imp)">ここに注意</span><span class="bb" style="font-size:24px;">世界の5つの気候帯と、日本の中の6つの気候区分は<span class="imp">別もの</span>。問題文が「世界の気候帯でみると」なら答えは①と②。</span></div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
