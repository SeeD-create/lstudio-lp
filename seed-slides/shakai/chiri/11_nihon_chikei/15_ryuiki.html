<style>

  .fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:18px; }

  .hd { display:grid; gap:10px; }
  .ln { font-size:32px; color:var(--sumi-soft); font-weight:600; line-height:1.55; }
  .ln .blank { font-size:34px; }
  .rank { display:grid; gap:12px; }
  .rk { display:grid; grid-template-columns: 130px 1fr; align-items:center; gap:18px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:16px 24px; box-shadow:0 8px 20px rgba(40,30,10,.07); }

</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ry-safe">
    <div class="fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="752" height="512" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>

        <path d="M60,80 Q120,60 175,95 Q215,145 195,215 Q150,265 90,240 Q45,180 60,80 Z" fill="#E3DFD6" stroke="#8B8A88" stroke-width="2.5"/>

        <text x="122" y="182" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="19" fill="#8B8A88">の流域</text>
        <!-- 流域B(大) -->
        <path d="M225,60 Q400,35 545,90 Q640,175 600,300 Q470,400 320,360 Q215,270 225,60 Z" fill="#F3D9D8" stroke="#C4161C" stroke-width="3.5"/>

        <text x="410" y="216" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="21" fill="#8c2b26">の流域＝いちばん広い</text>

        <g fill="none" stroke="#1F6FB2" stroke-width="5" stroke-linecap="round">
          <path d="M120,105 L128,175 L112,235 L128,300 L150,430"/>

          <path d="M660,150 L648,235 L668,310 L640,430"/>

    <div class="tx">
      <div class="hd" data-at="0">
        <span class="kicker"><span class="num">Ⅱ-2</span>　雨が集まってくる広さ</span>
        <h1 class="headline" style="font-size:52px;">雨が<span class="em">集まってくる</span><br>土地の広さ</h1>
      </div>
      <p class="ln" data-at="1">降った雨がその川に集まる区域の面積を<span class="blank" data-fill="1"><b>流域面積</b></span>という。図ではＢ川がいちばん広い。</p>
      <div class="rank">
        <div class="rk" style="--c:#C4161C" data-at="2"><span class="h">長さ 日本一</span><span class="v"><span class="imp">信濃川</span>（約367km）</span></div>
        <div class="rk" style="--c:#C4161C" data-at="3"><span class="h">この面積が日本一</span><span class="v"><span class="imp">利根川</span>（約16840km²）</span></div>
      </div>
      <p class="ln" data-at="4">流域が広いほど集まる水が多く、<span class="imp">大雨のときに洪水</span>が起きやすい。</p>
