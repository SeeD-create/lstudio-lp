<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大陸棚と海溝 ── 海底のかたち｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .td-safe { inset: 70px 100px 70px; grid-template-columns: 830px 1fr; align-content: center; gap: 46px; align-items: center; }
  .fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:18px; }
  .fig svg { width:100%; height:auto; display:block; }
  .tx { display:grid; gap:16px; }
  .hd { display:grid; gap:10px; }
  .w { display:grid; gap:8px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:14px 22px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .w .k { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--c); display:flex; align-items:center; gap:14px; }
  .w .k .mk { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:30px; color:var(--c); }
  .w .v { font-size:22px; line-height:1.45; color:var(--sumi-soft); font-weight:600; }
  .w .v b { color:var(--imp); }
  .ln { font-size:24px; color:var(--sumi-soft); font-weight:600; line-height:1.5; }
  .ln .blank { font-size:30px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe td-safe">
    <div class="fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="872" height="472" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
        <!-- 海面 -->
        <line x1="20" y1="90" x2="860" y2="90" stroke="#1F6FB2" stroke-width="4"/>
        <text x="40" y="78" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#1F6FB2">海面</text>
        <!-- 海水 -->
        <path d="M20,90 H860 V460 H20 Z" fill="#D6E6F2"/>
        <!-- 海底 -->
        <path d="M20,460 V60 H150 L300,140 L470,150 L560,300 L610,430 L660,300 L760,230 L860,215 V460 Z" fill="#CFCBBF" stroke="#3a3a39" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- 大陸棚ハッチ -->
        <path d="M300,140 L470,150 L470,90 L300,90 Z" fill="#B8D48A" fill-opacity=".55"/>
        <text x="90" y="40" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="26" fill="#4A4947">陸　地</text>
        <text x="385" y="126" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#2C6437">Ａ</text>
        <text x="385" y="182" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="20" fill="#2C6437">水深200mぐらいまで・よい漁場</text>
        <!-- 200m線 -->
        <line x1="300" y1="152" x2="500" y2="152" stroke="#2C7A3F" stroke-width="2.5" stroke-dasharray="8 6"/>
        <text x="516" y="158" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="19" fill="#2C6437">200m</text>
        <!-- 海溝 -->
        <text x="610" y="468" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#C4161C">Ｂ</text>
        <line x1="610" y1="430" x2="610" y2="446" stroke="#C4161C" stroke-width="3"/>
        <text x="745" y="330" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="20" fill="#4A4947">細長くて深い溝</text>
        <text x="745" y="358" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="20" fill="#4A4947">水深10000m以上の所も</text>
      </svg>
    </div>
    <div class="tx">
      <div class="hd" data-at="0">
        <span class="kicker"><span class="num">Ⅳ-3</span>　海底のかたち</span>
        <h1 class="headline" style="font-size:44px;">浅い<span class="em">たな</span>と深い<span class="em">みぞ</span></h1>
      </div>
      <div class="w" style="--c:#2C7A3F" data-at="1"><span class="k"><span class="mk">Ａ</span><span class="blank" data-fill="1"><b>大陸棚</b></span></span><span class="v">水深<b>200m</b>ぐらいまでの平らな海底。日光が届きプランクトンが多いので<b>よい漁場</b>。東シナ海に広がる。</span></div>
      <div class="w" style="--c:#C4161C" data-at="2"><span class="k"><span class="mk">Ｂ</span><span class="blank" data-fill="2"><b>海溝</b></span></span><span class="v">海底にある細長くて深い溝。水深<b>10000m</b>以上の所もある。</span></div>
      <p class="ln" data-at="3">日本の東には<span class="imp">日本海こう</span>、南には<span class="imp">伊豆小笠原海こう</span>。プレートが沈みこむ場所で、<span class="imp">地震</span>が多い。</p>
      <div style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:16px 26px;" data-at="4">
        <span style="font-family:'Zen Old Mincho',serif;font-weight:900;font-size:22px;color:var(--gold-soft);white-space:nowrap;">セットで</span>
        <span style="font-size:22px;line-height:1.45;">「<b style="color:#ff8a8f">①＝200m・よい漁場</b>」「<b style="color:#ff8a8f">②＝細長く深い溝</b>」。数字で聞かれる。</span>
      </div>
      <p class="ln" data-at="5">リアス海岸の沖にもゆるやかな海底が広がり、<span class="imp">三陸海岸</span>は日本有数の漁場。</p>
    </div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
