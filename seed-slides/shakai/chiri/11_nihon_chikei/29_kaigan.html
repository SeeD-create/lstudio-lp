<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>海岸の3タイプ ── 岩石・砂浜・リアス｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kg-safe { inset: 78px 110px 74px; align-content: center; gap: 30px; }
  .hd { display:grid; gap:10px; }
  .row3 { display:grid; grid-template-columns: repeat(3,1fr); gap: 26px; }
  .cd { background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; box-shadow:0 16px 34px rgba(40,30,10,.12); overflow:hidden; display:grid; align-content:start; }
  .cd .h { background:var(--c); color:#fff; padding:14px 22px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; }
  .cd .b { padding:18px 22px 22px; display:grid; gap:14px; }
  .cd .b svg { width:100%; height:auto; display:block; }
  .cd .b .q { font-size:25px; line-height:1.45; color:var(--sumi-soft); font-weight:600; margin:0; }
  .cd .b .a { font-size:26px; }
  .cd .b .n { font-size:22px; color:var(--sumi-mute); font-weight:600; line-height:1.4; margin:0; }
  .cd .b .n b { color:var(--imp); }
  .foot { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 30px; }
  .foot .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:23px; color:var(--gold-soft); white-space:nowrap; }
  .foot .bb { font-size:24px; line-height:1.45; }
  .foot .bb b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe kg-safe">
    <div class="hd" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-2</span>　海岸のかたち</span>
      <h1 class="headline" style="font-size:56px;">海岸は<span class="em">3タイプ</span>で覚える</h1>
    </div>
    <div class="row3">
      <div class="cd" style="--c:#6B6A67" data-at="1" data-anim="pop">
        <div class="h">⑴ 岩が多く切り立った崖</div>
        <div class="b">
          <svg viewBox="0 0 340 160">
            <rect x="0" y="0" width="340" height="160" rx="10" fill="#F6F3EC"/>
            <rect x="0" y="105" width="340" height="55" fill="#D6E6F2"/>
            <path d="M0,20 H190 L200,105 H0 Z" fill="#CFCBBF" stroke="#6B6A67" stroke-width="3"/>
            <path d="M190,20 L200,105" stroke="#3a3a39" stroke-width="4" fill="none"/>
            <text x="270" y="80" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#144e80">海</text>
            <text x="95" y="70" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#4A4947">陸（がけ）</text>
          </svg>
          <p class="q">→ <span class="blank a" data-fill="1"><b>岩石海岸</b></span></p>
          <p class="n">波が岩をけずってできる。海食がい。</p>
        </div>
      </div>
      <div class="cd" style="--c:#B3541E" data-at="2" data-anim="pop">
        <div class="h">⑵ 一面が砂でおおわれる</div>
        <div class="b">
          <svg viewBox="0 0 340 160">
            <rect x="0" y="0" width="340" height="160" rx="10" fill="#F6F3EC"/>
            <rect x="0" y="105" width="340" height="55" fill="#D6E6F2"/>
            <path d="M0,45 H150 Q230,60 340,110 H0 Z" fill="#F0DCC4" stroke="#B3541E" stroke-width="3"/>
            <g fill="#B3541E"><circle cx="200" cy="88" r="3"/><circle cx="230" cy="96" r="3"/><circle cx="170" cy="80" r="3"/><circle cx="255" cy="103" r="3"/></g>
            <text x="290" y="86" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#144e80">海</text>
            <text x="80" y="88" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#8F3F0E">砂浜</text>
          </svg>
          <p class="q">→ <span class="blank a" data-fill="2"><b>砂浜海岸</b></span></p>
          <p class="n">川が運んだ砂が波でならされる。<b>砂丘</b>も。</p>
        </div>
      </div>
      <div class="cd" style="--c:#C4161C" data-at="3" data-anim="pop">
        <div class="h">出入りが多い・陸が沈む</div>
        <div class="b">
          <svg viewBox="0 0 340 160">
            <rect x="0" y="0" width="340" height="160" rx="10" fill="#F6F3EC"/>
            <rect x="0" y="0" width="340" height="160" fill="#D6E6F2"/>
            <path d="M0,20 H340 V50 L300,52 L280,90 L250,54 L215,56 L195,100 L165,58 L130,60 L110,105 L80,62 L45,64 L28,95 L0,66 Z" fill="#E3DFD6" stroke="#C4161C" stroke-width="3"/>
            <text x="60" y="40" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#4A4947">陸　地</text>
            <text x="230" y="140" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#144e80">海</text>
          </svg>
          <p class="q">→ <span class="blank a" data-fill="3"><b>リアス海岸</b></span></p>
          <p class="n">三陸海岸・若狭湾・志摩半島。<b>養殖</b>に適するが<b>津波</b>に弱い。</p>
        </div>
      </div>
    </div>
    <div class="foot" data-at="4"><span class="tt">説明の言い方</span><span class="bb">「<b>出入りの多い海岸線</b>をもつ地形で、<b>陸地が海に沈んで</b>できた」。この一文がそのまま答案になる。</span></div>
    <div class="foot" data-at="5" style="background:var(--paper-hi);color:var(--sumi);border:3px solid var(--sumi-mute);"><span class="tt" style="color:var(--imp)">⑶ 2つの海流がぶつかる所</span><span class="bb">暖流と寒流がぶつかる所を<span class="blank" data-fill="5"><b>潮境</b></span>という。プランクトンが多く、よい漁場になる。</span></div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
