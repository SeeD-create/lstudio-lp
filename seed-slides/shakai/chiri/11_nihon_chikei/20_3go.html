<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>平野・盆地・台地 ── 3つの平地の見分け方｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sg-safe { inset: 80px 120px 76px; align-content: center; gap: 38px; }
  .hd { display:grid; gap:10px; }
  .row3 { display:grid; grid-template-columns: repeat(3,1fr); gap: 30px; }
  .cd { background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; box-shadow:0 16px 34px rgba(40,30,10,.12); overflow:hidden; display:grid; align-content:start; }
  .cd .h { background:var(--c); color:#fff; padding:16px 24px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; }
  .cd .b { padding:22px 26px 26px; display:grid; gap:16px; }
  .cd .b svg { width:100%; height:auto; display:block; }
  .cd .b p { margin:0; font-size:27px; line-height:1.45; color:var(--sumi-soft); font-weight:600; }
  .cd .b p .imp { color:var(--imp); font-weight:900; }
  .foot { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 30px; }
  .foot .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:23px; color:var(--gold-soft); white-space:nowrap; }
  .foot .bb { font-size:24px; line-height:1.45; }
  .foot .bb b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sg-safe">
    <div class="hd" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-1</span>　平地の3タイプ</span>
      <h1 class="headline" style="font-size:58px;">平野・盆地・台地は<span class="em">まわりとの高さ</span>で見分ける</h1>
    </div>
    <div class="row3">
      <div class="cd" style="--c:#2C7A3F" data-at="1" data-anim="pop">
        <div class="h">平野</div>
        <div class="b">
          <svg viewBox="0 0 340 150">
            <rect x="0" y="0" width="340" height="150" rx="10" fill="#F6F3EC"/>
            <rect x="0" y="95" width="180" height="55" fill="#D6E6F2"/>
            <path d="M180,95 H340 V150 H180 Z" fill="#E3DFD6" stroke="#8B8A88" stroke-width="2"/>
            <path d="M300,95 L340,55 V95 Z" fill="#CFCBBF" stroke="#8B8A88" stroke-width="2"/>
            <text x="88" y="130" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#144e80">海</text>
            <text x="248" y="128" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#2C7A3F">平野</text>
          </svg>
          <p><span class="imp">海に面した</span>平地。<br>例）関東平野・石狩平野</p>
        </div>
      </div>
      <div class="cd" style="--c:#8A4FA8" data-at="2" data-anim="pop">
        <div class="h">盆地</div>
        <div class="b">
          <svg viewBox="0 0 340 150">
            <rect x="0" y="0" width="340" height="150" rx="10" fill="#F6F3EC"/>
            <path d="M0,150 L0,90 L60,40 L120,95 H220 L280,40 L340,90 L340,150 Z" fill="#CFCBBF" stroke="#8B8A88" stroke-width="2"/>
            <rect x="120" y="95" width="100" height="55" fill="#E3DFD6" stroke="#8B8A88" stroke-width="2"/>
            <text x="170" y="128" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#6C3D8A">盆地</text>
          </svg>
          <p><span class="imp">山に囲まれた</span>平地。<br>例）甲府盆地・長野盆地</p>
        </div>
      </div>
      <div class="cd" style="--c:#B3541E" data-at="3" data-anim="pop">
        <div class="h">台地</div>
        <div class="b">
          <svg viewBox="0 0 340 150">
            <rect x="0" y="0" width="340" height="150" rx="10" fill="#F6F3EC"/>
            <path d="M0,150 V115 H150 L180,70 H340 V150 Z" fill="#E3DFD6" stroke="#8B8A88" stroke-width="2"/>
            <text x="70" y="140" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="18" fill="#4A4947">平野</text>
            <text x="260" y="112" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="20" fill="#8F3F0E">台地</text>
          </svg>
          <p>平野よりも<span class="imp">一段と高い</span>平地。<br>例）根釧台地・シラス台地</p>
        </div>
      </div>
    </div>
    <div class="foot" data-at="4"><span class="tt">ここが決め手</span><span class="bb">平野＝<b>海に面する</b>／盆地＝<b>山に囲まれる</b>／台地＝<b>まわりより一段高い</b>。名前の最後の2文字を見れば、どこにあるかが読める。</span></div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
