        <span class="kicker"><span class="num">Ⅰ-5b</span>　東日本と西日本の境</span>
        <h1 class="headline" style="font-size:50px;">日本を東西に分ける<br><span class="em">大きな溝</span></h1>
      </div>
      <p class="ln" data-at="1">本州の中央部にある、土地が大きく落ちこんだ所を<span class="blank" data-fill="1"><span class="bnum">⑩</span><b>フォッサマグナ</b></span>という。</p>
      <p class="ln" data-at="2">その西のふちは、地図の<span class="mk">Ａ</span><span class="blank" data-fill="2"><b>糸魚川市</b></span>から<span class="mk">Ｂ</span><span class="blank" data-fill="2"><b>静岡市</b></span>を結ぶ線。</p>
      <ul class="pt" data-at="3">
        <li>ここを境に、<span class="imp">東日本と西日本</span>で地形や地質が異なる</li>
        <li>この地帯の西どなりに<span class="imp">3000m級の山脈</span>がそびえる</li>
      </ul>
      <div class="tipbar" data-at="4"><span class="tt">テスト頻出</span><span class="bb">「2つの市を結ぶ線を西端とする、土地の落ちこんだ所」がその答え。3つの山脈とセットで問われる。</span></div>
