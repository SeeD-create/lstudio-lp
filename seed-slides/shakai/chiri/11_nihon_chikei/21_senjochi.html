<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>扇状地 ── 山から平地へ出る所の扇｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sj-safe { inset: 76px 120px 72px; grid-template-columns: 640px 1fr; align-content: center; gap: 50px; align-items: center; }
  .lc { display:grid; gap:20px; }
  .fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:18px; }
  .fig svg { width:100%; height:auto; display:block; }
  .photo { height:400px; border-radius:24px; border:3px solid var(--sumi);
    box-shadow:0 16px 38px rgba(40,30,10,.14); overflow:hidden; }
  .tx { display:grid; gap:24px; }
  .hd { display:grid; gap:10px; }
  .ln { font-size:32px; color:var(--sumi-soft); font-weight:600; line-height:1.55; }
  .ln .blank { font-size:34px; }
  .mk { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:30px; color:var(--imp); }
  .pt { display:grid; gap:14px; margin:0; padding:0; }
  .pt li { list-style:none; font-size:28px; font-weight:700; color:var(--sumi); display:flex; gap:14px; align-items:baseline; line-height:1.4; }
  .pt li::before { content:"▶"; color:var(--cat); font-size:20px; flex:none; }
  .pt li .imp { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sj-safe">
    <div class="lc">
    <div class="fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="752" height="512" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
        <!-- 山地 -->
        <path d="M20,20 H740 V150 Q560,215 380,150 Q200,90 20,160 Z" fill="#CFCBBF" stroke="#8B8A88" stroke-width="2.5"/>
        <text x="140" y="80" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="30" fill="#4A4947">山　地</text>
        <!-- 扇状地 -->
        <path d="M380,155 L620,430 H140 Z" fill="#F0DCC4" stroke="#B3541E" stroke-width="4"/>
        <text x="380" y="336" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="46" fill="#8F3F0E">Ａ</text>
        <text x="380" y="392" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="22" fill="#8F3F0E" paint-order="stroke" stroke="#F0DCC4" stroke-width="5">砂や石が積もる</text>
        <!-- 川 -->
        <path d="M300,30 L340,110 L380,158 L400,290 L420,430 L430,490" fill="none" stroke="#1F6FB2" stroke-width="7" stroke-linecap="round"/>
        <!-- 扇の要 -->
        <circle cx="380" cy="156" r="10" fill="#C4161C"/>
        <text x="398" y="146" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#C4161C">山地から平地へ出る所</text>
        <!-- 果樹 -->
        <g fill="#2C7A3F">
          <circle cx="252" cy="348" r="13"/><circle cx="296" cy="374" r="13"/><circle cx="488" cy="348" r="13"/><circle cx="532" cy="374" r="13"/>
        </g>
        <text x="248" y="416" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#2C7A3F">Ｂ</text>
        <text x="518" y="416" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="34" fill="#2C7A3F">Ｂ</text>
        <!-- 平地 -->
        <path d="M20,430 H740 V500 H20 Z" fill="#E3DFD6" stroke="#8B8A88" stroke-width="2"/>
        <text x="90" y="474" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="24" fill="#4A4947">平　地</text>
      </svg>
    </div>
      <div class="figure photo" data-at="0" data-anim="left"><img src="assets/senjochi.webp" alt="山あいから平地へ扇形に広がる扇状地と、そこに広がる果樹園"></div>
    </div>
    <div class="tx">
      <div class="hd" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-2</span>　山から平地へ出る所</span>
        <h1 class="headline" style="font-size:52px;">山から平地へ出る所に<br>できる<span class="em">扇</span></h1>
      </div>
      <p class="ln" data-at="1">⑴ 川が山地から平地へ流れ出る所にできた、傾斜のゆるい扇状の地形（図の<span class="mk">Ａ</span>）を<span class="blank" data-fill="1"><b>扇状地</b></span>という。</p>
      <p class="ln" data-at="2">砂や石が積もっているので<span class="blank" data-fill="2"><b>水はけ</b></span>がよく、図の<span class="mk">Ｂ</span>のように<span class="blank" data-fill="3"><b>果樹</b></span>栽培に適している。</p>
      <ul class="pt" data-at="4">
        <li>代表例＝<span class="imp">甲府盆地</span>（ぶどう・もも）</li>
        <li>水が地下にしみこむので、<span class="imp">水田には向かない</span></li>
      </ul>
      <div class="tipbar" data-at="5" style="display:flex;align-items:center;gap:20px;background:var(--sumi);color:var(--paper-hi);border-radius:16px;padding:16px 28px;">
        <span style="font-family:'Zen Old Mincho',serif;font-weight:900;font-size:22px;color:var(--gold-soft);white-space:nowrap;">テスト頻出</span>
        <span style="font-size:23px;line-height:1.45;">「山ぎわ＝<b style="color:#ff8a8f">くだものの畑</b>」「河口＝<b style="color:#ff8a8f">水田や市街地</b>」でセット暗記。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
