<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe hk-safe">
    <div class="hk-txt">
      <div class="hk-q" data-at="0">日本には、なぜ<span class="em">地震</span>と<span class="em">火山</span>と<br><span class="em">温泉</span>がこんなに多いのか。</div>
      <p class="hk-sub" data-at="1">答えは「日本が立っている場所」にある。日本列島は、地球の表面をおおう<span class="strong">プレート</span>どうしがぶつかる境目にのっている。だから山ができ、川は急になり、平地はせまく、海はすぐそこにある。</p>
      <div class="hk-card" data-at="2">山・川・平野・海・風・気候は、<b>ぜんぶつながっている</b>。<br>この6枚をそろえると、日本の自然が1本の線でつながる。</div>
    </div>
