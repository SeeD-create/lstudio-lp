<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>国土の約4分の3が山地 ── 山地・山脈・高地｜中1地理 第11章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sc-safe { inset: 76px 130px 74px; align-content: center; gap: 34px; }
  .hd { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns: 430px 470px 1fr; gap: 40px; align-items: center; }
  .fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; box-shadow:0 16px 38px rgba(40,30,10,.12); padding:18px; }
  .fig svg { width:100%; height:auto; display:block; }
  .photo { height:430px; border-radius:24px; border:3px solid var(--sumi);
    box-shadow:0 16px 38px rgba(40,30,10,.14); overflow:hidden; }
  .rt { display:grid; gap:20px; }
  .ln { font-size:33px; color:var(--sumi-soft); font-weight:600; line-height:1.5; }
  .ln .blank { font-size:35px; }
  .words { display:grid; gap:14px; }
  .w { display:grid; grid-template-columns: 190px 1fr; gap:20px; align-items:center; background:var(--paper-hi); border-left:9px solid var(--cat); border-radius:0 14px 14px 0; padding:16px 24px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .w .k { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); }
  .w .v { font-size:25px; line-height:1.4; color:var(--sumi-soft); font-weight:600; }
  .w .v b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sc-safe">
    <div class="hd" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-2</span>　日本の山地</span>
      <h1 class="headline" style="font-size:60px;">国土の約<span class="em">4分の3</span>が山地</h1>
    </div>
    <div class="row">
      <div class="figure photo" data-at="1" data-anim="left"><img src="assets/sanchi.webp" alt="幾重にもつらなるけわしい山地と深い谷"></div>
      <div class="fig" data-at="1" data-anim="pop">
        <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="512" height="332" rx="14" fill="#F6F3EC" stroke="#d8d7d3" stroke-width="2"/>
          <!-- 円グラフ 山地75% / 平地25% -->
          <g transform="translate(170,172)">
            <circle r="130" fill="#E6E5E2" stroke="#3a3a39" stroke-width="3"/>
            <path d="M0,0 L0,-130 A130,130 0 1,1 -130,0 Z" fill="#C4161C" stroke="#3a3a39" stroke-width="3"/>
            <text x="34" y="56" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="52" fill="#fff">？％</text>
            <text x="34" y="98" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="28" fill="#fff">山地</text>
            <text x="-62" y="-52" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="24" fill="#3a3a39">平地</text>
          </g>
          <text x="390" y="120" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="24" fill="#C4161C">約4分の3</text>
          <text x="390" y="158" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="21" fill="#4A4947">が山地</text>
          <text x="390" y="230" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="20" fill="#4A4947">だから平地は</text>
          <text x="390" y="258" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#3a3a39">せまく貴重</text>
        </svg>
      </div>
      <div class="rt">
        <p class="ln" data-at="2">日本の国土の約<span class="blank" data-fill="2"><span class="bnum">①</span><b>75</b></span>％は山地である。</p>
        <div class="words">
          <div class="w" data-at="3"><span class="k">山地</span><span class="v">平野・高原・丘陵にくらべて<b>起伏が大きく</b>、傾斜の急な斜面をもった広い土地の高まり。</span></div>
          <div class="w" data-at="4"><span class="k">山脈</span><span class="v">多くの山が<b>つらなって脈状</b>をなしている山地。</span></div>
          <div class="w" data-at="5"><span class="k">高地</span><span class="v">海抜の高い土地。周囲にくらべて<b>小高く丘</b>になった土地。</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第11章 日本の地形・自然の特色</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
