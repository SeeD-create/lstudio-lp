<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset:84px 150px 100px; align-content:center; gap:26px; }
  .sk-head { display:grid; gap:8px; justify-items:center; text-align:center; }
  .sk-lead { font-size:30px; color:var(--sumi-soft); }
  .sk-lead b { color:var(--imp); font-weight:900; }
  .sk-row { display:grid; grid-template-columns:repeat(3,1fr); gap:36px; }
  .sk-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:24px 30px 26px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:8px; justify-items:center; text-align:center; }
  .sk-fig { width:200px; height:200px; border:3px solid var(--hair); border-radius:18px; }
  .sk-card .reg { font-size:28px; font-weight:900; color:var(--sumi); background:var(--paper-lo); border-radius:999px; padding:8px 26px; }
  .sk-card .arw { font-size:34px; color:var(--sumi-mute); }
  .sk-card .mz { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .sk-card .rel { font-size:25px; color:var(--sumi-soft); line-height:1.4; }
  .blank { font-size:38px; } .blank b { font-size:37px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-2</span>　宗教カタログ</span>
      <h1 class="headline" style="font-size:50px;">民族ごとに、信じる<span class="em">キリスト教</span>がちがう</h1>
      <p class="sk-lead">ヨーロッパの人々の多くは<b>キリスト教</b>。ただし、地域によって宗派が分かれる。</p>
    </div>
    <div class="sk-row">
      <div class="sk-card" data-at="1" data-anim="pop"><div class="figure sk-fig"><img src="assets/kyokai_kita.webp" alt="北ヨーロッパの村の教会 ── 白いかべと細く高い塔の簡素なつくり"></div><span class="reg">北・ゲルマン系</span><span class="arw">↓</span><span class="mz"><span class="blank" data-fill="1"><b>プロテスタント</b></span></span><span class="rel">宗教改革で生まれた宗派。<br>ドイツ・北欧・イギリスに多い。</span></div>
      <div class="sk-card" data-at="2" data-anim="pop"><div class="figure sk-fig"><img src="assets/kyokai_minami.webp" alt="南ヨーロッパの町の大聖堂 ── 石づくりでとがったアーチと大きな丸窓"></div><span class="reg">南・ラテン系</span><span class="arw">↓</span><span class="mz"><span class="blank" data-fill="2"><b>カトリック</b></span></span><span class="rel">ローマ教皇を中心とする宗派。<br>イタリア・スペイン・フランスに多い。</span></div>
      <div class="sk-card" data-at="3" data-anim="pop"><div class="figure sk-fig"><img src="assets/kyokai_higashi.webp" alt="東ヨーロッパの教会 ── たまねぎ形の丸い屋根がいくつも並ぶ"></div><span class="reg">東・スラブ系</span><span class="arw">↓</span><span class="mz"><span class="blank" data-fill="3"><b>正教会</b></span></span><span class="rel">東方正教（ギリシャ正教など）。<br>ロシア・ギリシャ・東欧に多い。</span></div>
    </div>
    <p class="lead" data-at="4" style="justify-self:center;text-align:center;font-size:25px;"><span class="imp">★頻出</span>：<b>北・南・東で信じる宗派がちがう</b>。民族の並びとセットで覚える。</p>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
