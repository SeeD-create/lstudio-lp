<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>EU統合 年表 ── 1948〜1993をつなぐ｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { align-content:center; gap:26px; }
  .np-head { display:grid; gap:8px; }
  .np-line { display:grid; gap:16px; max-width:1500px; }
  .np-row { display:grid; grid-template-columns:180px 1fr; align-items:center; gap:30px; }
  .np-year { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--imp); text-align:right; }
  .np-bar { background:var(--paper-hi); border:3px solid var(--cat); border-left:12px solid var(--cat); border-radius:14px; padding:18px 30px; box-shadow:0 8px 20px rgba(40,30,10,.08); display:flex; align-items:baseline; gap:20px; }
  .np-bar .ab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); min-width:150px; }
  .np-bar .tx { font-size:28px; color:var(--sumi-soft); line-height:1.4; }
  .np-bar .tx b { color:var(--sumi); font-weight:900; }
  .np-bar.big { border-width:4px; background:#fff; }
  .np-bar.big .ab { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">まとめ①</span>　EU統合の年表</span>
      <h1 class="headline" style="font-size:56px;">小さな一歩から、<span class="em">EU</span>、そして今へ</h1>
    </div>
    <div class="np-line">
      <div class="np-row" data-at="1"><span class="np-year">1948</span><div class="np-bar"><span class="ab">関税同盟</span><span class="tx"><b>ベネルクス3国</b>（ベルギー・オランダ・ルクセンブルク）が関税同盟を結ぶ</span></div></div>
      <div class="np-row" data-at="2"><span class="np-year">1958</span><div class="np-bar"><span class="ab">EEC</span><span class="tx"><b>ヨーロッパ経済共同体</b>が発足</span></div></div>
      <div class="np-row" data-at="3"><span class="np-year">1967</span><div class="np-bar"><span class="ab">EC</span><span class="tx"><b>ヨーロッパ共同体</b>へ発展</span></div></div>
      <div class="np-row" data-at="4"><span class="np-year">1993</span><div class="np-bar big"><span class="ab">EU</span><span class="tx"><b>ヨーロッパ連合</b>が誕生（本部＝ベルギーのブリュッセル）</span></div></div>
      <div class="np-row" data-at="5"><span class="np-year">その後</span><div class="np-bar"><span class="ab">ユーロ</span><span class="tx">多くの加盟国で<b>共通通貨ユーロ</b>を導入</span></div></div>
      <div class="np-row" data-at="6"><span class="np-year">2020</span><div class="np-bar" style="border-color:var(--imp);"><span class="ab" style="color:var(--imp);">離脱</span><span class="tx"><b>イギリスがEUを離脱</b>した</span></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
