<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>フランスとロシア ── EU最大の農業国と穀倉地帯｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fr-safe { align-content:center; gap:30px; }
  .fr-head { display:grid; gap:10px; }
  .fr-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:36px; }
  .fr-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:28px 30px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; grid-template-columns:262px 1fr; gap:26px; align-items:center; }
  .fr-fig { height:290px; border:3px solid var(--hair); border-radius:18px; }
  .fr-body { display:grid; gap:14px; }
  .fr-card .cn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); }
  .fr-card .cn small { display:block; font-size:24px; color:var(--imp); font-weight:900; margin-top:4px; }
  .fr-card .cb { font-size:27px; color:var(--sumi-soft); line-height:1.5; }
  .fr-card .cb b { color:var(--sumi); font-weight:900; }
  .blank { font-size:30px; } .blank b { font-size:29px; }
  .fr-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.5; }
  .fr-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .fr-note b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe fr-safe">
    <div class="fr-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-3</span>　2つの農業大国</span>
      <h1 class="headline" style="font-size:58px;">フランスとロシア、それぞれの<span class="em">得意</span></h1>
    </div>
    <div class="fr-grid">
      <div class="fr-card" data-at="1" data-anim="pop">
        <div class="figure fr-fig"><img src="assets/komugi_batake.webp" alt="地平線まで続く、黄金色にみのった小麦畑"></div>
        <div class="fr-body">
          <span class="cn">フランス<small>EU最大の農業国</small></span>
          <span class="cb"><span class="blank" data-fill="1"><b>小麦</b></span>を他のEU諸国へ輸出。<br><b>ワイン</b>や乳製品の生産も多い、EUの食料庫。</span>
        </div>
      </div>
      <div class="fr-card" data-at="2" data-anim="pop">
        <div class="figure fr-fig"><img src="assets/russia_ringyo.webp" alt="針葉樹林と、切り出して積み上げられた丸太"></div>
        <div class="fr-body">
          <span class="cn">ロシア</span>
          <span class="cb">西部は穀倉地帯で<span class="blank" data-fill="2"><b>小麦</b></span>の生産が多い。<br>中央部のシベリアは<b>タイガ</b>が広がり<span class="blank" data-fill="2"><b>林業</b></span>が盛ん。</span>
        </div>
      </div>
    </div>
    <div class="fr-note" data-at="3"><span class="k">データ</span><span>この作物の生産量1位は<b>中国</b>、次いでインド・ロシア。輸出では<b>ロシアが世界1位</b>、フランスも上位。ヨーロッパは世界のパンを支えている。</span></div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
