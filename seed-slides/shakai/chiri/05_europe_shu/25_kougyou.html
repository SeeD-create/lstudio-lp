<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>EUの産業 ── 工業とフランクフルト｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kg-safe { align-content:center; gap:30px; }
  .kg-head { display:grid; gap:10px; }
  .kg-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:36px; }
  .kg-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:28px 32px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; grid-template-columns:300px 1fr; gap:30px; align-items:center; }
  .kg-fig { height:300px; border:3px solid var(--hair); border-radius:18px; }
  .kg-body { display:grid; gap:14px; }
  .kg-card .ct { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); }
  .kg-card .cb { font-size:29px; color:var(--sumi-soft); line-height:1.5; }
  .kg-card .cb b { color:var(--sumi); font-weight:900; }
  .kg-card .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .kg-card .chips span { font-size:23px; font-weight:800; color:var(--sumi); background:var(--paper-lo); border-radius:10px; padding:6px 16px; }
  .blank { font-size:36px; } .blank b { font-size:35px; }
  .kg-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.5; }
  .kg-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kg-note b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kg-safe">
    <div class="kg-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-4</span>　EUの産業</span>
      <h1 class="headline" style="font-size:58px;">EUは、国どうしで<span class="em">分担</span>してものをつくる</h1>
    </div>
    <div class="kg-grid">
      <div class="kg-card" data-at="1" data-anim="pop">
        <div class="figure kg-fig"><img src="assets/kougyo_kojo.webp" alt="ロボットアームが並ぶ、明るく広い自動車の組み立てライン"></div>
        <div class="kg-body">
          <span class="ct"><span class="blank" data-fill="1"><b>工業</b></span></span>
          <span class="cb">自動車・コンピュータ・航空機・医薬品など、はば広い産業が盛ん。</span>
          <div class="chips"><span>自動車</span><span>コンピュータ</span><span>航空機</span><span>医薬品</span></div>
        </div>
      </div>
      <div class="kg-card" data-at="2" data-anim="pop">
        <div class="figure kg-fig"><img src="assets/kinyu_gai.webp" alt="川ごしに見る、ガラスばりの高層ビルが並ぶ金融街"></div>
        <div class="kg-body">
          <span class="ct"><span class="blank" data-fill="2"><b>フランクフルト</b></span></span>
          <span class="cb"><b>ヨーロッパ中央銀行</b>があり、EUの<b>金融・経済の中心地</b>となっている都市（ドイツ）。</span>
        </div>
      </div>
    </div>
    <div class="kg-note" data-at="3"><span class="k">国際分業</span><span><b>航空機（エアバス）</b>は、翼・機体・部品を各国が分担してつくり、1機に組み立てる。国どうしの協力の代表例。</span></div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
