<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>気候カタログ ── 北部・中部・南部・ロシア（白夜とタイガ）｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kl-safe { align-content:center; gap:22px; }
  .kl-head { display:grid; gap:8px; }
  .kl-body { display:grid; grid-template-columns:1fr 370px; gap:30px; align-items:center; }
  .kl-rows { display:grid; gap:18px; }
  .kl-figs { display:grid; gap:22px; }
  .kf { display:grid; gap:8px; }
  .kf-fig { height:230px; border:3px solid var(--hair); border-radius:18px; }
  .kfc { font-size:22px; font-weight:800; color:var(--sumi-mute); text-align:center; letter-spacing:.04em; }
  .kl-row { display:grid; grid-template-columns:150px 1fr; align-items:center; gap:24px; background:var(--paper-hi); border:2.5px solid var(--hair); border-left:12px solid var(--cat); border-radius:16px; padding:20px 30px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .kl-row .rg { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); }
  .kl-row .rb { font-size:30px; color:var(--sumi-soft); line-height:1.5; }
  .kl-row .rb b { color:var(--sumi); font-weight:900; }
  .blank { font-size:33px; } .blank b { font-size:32px; }
  .kl-note { display:flex; gap:30px; }
  .kl-chip { flex:1; display:flex; align-items:center; gap:18px; background: var(--paper-hi); color: var(--sumi); border-radius:14px; padding:13px 23px; font-size:25px; line-height:1.4; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .kl-chip .k { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); white-space:nowrap; }
  .kl-chip b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kl-safe">
    <div class="kl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-3</span>　気候カタログ</span>
      <h1 class="headline" style="font-size:58px;">4つの地域で、気候をおさえる</h1>
    </div>
    <div class="kl-body">
      <div class="kl-rows">
        <div class="kl-row" data-at="1"><span class="rg">北部</span><span class="rb"><span class="blank" data-fill="1"><b>冷帯（亜寒帯）</b></span>気候。高緯度地方では夏に<span class="blank" data-fill="1"><b>白夜</b></span>がみられる。</span></div>
        <div class="kl-row" data-at="2"><span class="rg">中部</span><span class="rb"><span class="blank" data-fill="2"><b>西岸海洋性</b></span>気候（温帯）。暖流の<b>北大西洋海流</b>と<b>偏西風</b>で、高緯度でも冬の寒さがきびしくない。</span></div>
        <div class="kl-row" data-at="3"><span class="rg">南部</span><span class="rb"><span class="blank" data-fill="3"><b>地中海性</b></span>気候（温帯）。夏は<b>乾燥</b>し、冬に降水量が多くなる。</span></div>
        <div class="kl-row" data-at="4"><span class="rg">ロシア</span><span class="rb"><span class="blank" data-fill="4"><b>冷帯（亜寒帯）</b></span>気候。国土の中央部には<span class="blank" data-fill="4"><b>タイガ</b></span>と呼ばれる針葉樹林が広がる。</span></div>
      </div>
      <div class="kl-figs">
        <div class="kf" data-at="1" data-anim="right">
          <div class="figure kf-fig"><img src="assets/byakuya.webp" alt="真夜中でも太陽がしずみきらず、空がうす明るい高緯度の夏"></div>
          <div class="kfc">真夜中でも、空がうす明るい</div>
        </div>
        <div class="kf" data-at="4" data-anim="right">
          <div class="figure kf-fig"><img src="assets/taiga.webp" alt="地平線まで続く針葉樹林と、その間を流れる川"></div>
          <div class="kfc">地平線まで続く針葉樹林</div>
        </div>
      </div>
    </div>
    <div class="kl-note" data-at="5">
      <div class="kl-chip"><span class="k"><span class="blank" data-fill="5"><b>白夜</b></span></span><span>夏、太陽がしずんでも<b>うす明るい</b>状態が続くこと。高緯度地方の特徴。</span></div>
      <div class="kl-chip"><span class="k"><span class="blank" data-fill="5"><b>タイガ</b></span></span><span>冷帯に広がる<b>針葉樹林</b>。ロシア〜シベリアに広がり、林業が盛ん。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
