<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>環境問題 ── 酸性雨・水質汚染・地球温暖化・ごみ問題｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { align-content:center; gap:28px; }
  .kk-head { display:grid; gap:10px; }
  .kk-body { display:grid; grid-template-columns:1fr 380px; gap:30px; align-items:center; }
  .kk-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
  .kk-figs { display:grid; gap:24px; }
  .kk-fig { height:250px; border:3px solid var(--hair); border-radius:18px; }
  .kk-card { display:grid; grid-template-columns:64px 1fr; gap:22px; align-items:start; background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:24px 30px; box-shadow:0 12px 26px rgba(40,30,10,.09); }
  .kk-card .no { width:64px; height:64px; border-radius:14px; background:var(--cat); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; }
  .kk-card .bd { display:grid; gap:6px; }
  .kk-card .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; }
  .kk-card .ds { font-size:25px; color:var(--sumi-soft); line-height:1.4; }
  .kk-card .ds b { color:var(--sumi); font-weight:900; }
  .blank { font-size:32px; } .blank b { font-size:31px; }
  .kk-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 32px; font-size:26px; line-height:1.5; }
  .kk-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kk-note b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-5</span>　持続可能な社会へ</span>
      <h1 class="headline" style="font-size:56px;">国境をこえて、みんなで<span class="em">環境</span>を守る</h1>
    </div>
    <div class="kk-body">
      <div class="kk-grid">
        <div class="kk-card" data-at="1" data-anim="pop"><span class="no">①</span><div class="bd"><span class="tt"><span class="blank" data-fill="1"><b>酸性雨</b></span></span><span class="ds">工場や自動車の<b>亜硫酸ガス</b>が原因。森林が枯れ、湖の魚が死ぬ。</span></div></div>
        <div class="kk-card" data-at="2" data-anim="pop"><span class="no">②</span><div class="bd"><span class="tt"><span class="blank" data-fill="2"><b>水質汚染</b></span></span><span class="ds"><b>ライン川</b>など、利用する国が協力して水質改善を行う。</span></div></div>
        <div class="kk-card" data-at="3" data-anim="pop"><span class="no">③</span><div class="bd"><span class="tt"><span class="blank" data-fill="3"><b>地球温暖化</b></span></span><span class="ds"><b>温室効果ガス</b>を減らすため、<b>風力発電</b>などが盛ん。</span></div></div>
        <div class="kk-card" data-at="4" data-anim="pop"><span class="no">④</span><div class="bd"><span class="tt"><span class="blank" data-fill="4"><b>ごみ問題</b></span></span><span class="ds"><b>リサイクル率</b>が高い。渋滞・大気汚染対策に<b>自転車</b>も活用。</span></div></div>
      </div>
      <div class="kk-figs">
        <div class="figure kk-fig" data-at="1" data-anim="right"><img src="assets/sanseiu.webp" alt="酸性雨で立ち枯れた山の針葉樹林と、どんよりした空"></div>
        <div class="figure kk-fig" data-at="3" data-anim="right"><img src="assets/furyoku.webp" alt="緑の丘に並び立つ、白い風力発電の風車"></div>
      </div>
    </div>
    <div class="kk-note" data-at="5"><span class="k">共通点</span><span>どれも<b>1国だけでは解決できない</b>問題。だからEUの国々は<b>協力</b>して取り組む。これが「持続可能な社会」への道。</span></div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
