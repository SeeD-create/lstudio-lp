<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>EUの課題 ── 経済格差と移民｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kd-safe { align-content:center; gap:32px; }
  .kd-head { display:grid; gap:10px; }
  .kd-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:36px; }
  .kd-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:34px 38px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:16px; }
  .kd-card .ct { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); }
  .kd-card .cb { font-size:29px; color:var(--sumi-soft); line-height:1.5; }
  .kd-card .cb b { color:var(--sumi); font-weight:900; }
  .blank { font-size:38px; } .blank b { font-size:37px; }
  .kd-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.5; }
  .kd-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kd-note b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kd-safe">
    <div class="kd-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-6</span>　EUのなやみ</span>
      <h1 class="headline" style="font-size:58px;">まとまったからこそ、生まれた<span class="em">課題</span></h1>
    </div>
    <div class="kd-grid">
      <div class="kd-card" data-at="1" data-anim="pop">
        <span class="ct"><span class="blank" data-fill="1"><b>経済格差</b></span></span>
        <span class="cb">加盟国の間で<b>国民総所得（GNI）</b>にかなりの開きがある。豊かな国と、そうでない国の差。</span>
      </div>
      <div class="kd-card" data-at="2" data-anim="pop">
        <span class="ct"><span class="blank" data-fill="2"><b>移民</b></span>問題</span>
        <span class="cb">EU内は移動が自由なため、<b>旧植民地から移り住む人</b>も多い。仕事や文化のちがいで摩擦も。</span>
      </div>
    </div>
    <div class="kd-note" data-at="3"><span class="k">つながり</span><span>豊かな国へ人が集まり、<b>①</b>と<b>②</b>の問題は結びついている。「自由な移動」の光と影。</span></div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
