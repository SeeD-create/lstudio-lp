<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>EUの統合 ── ユーロ・移動の自由・ユーロトンネル｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tg-safe { align-content:center; gap:32px; }
  .tg-head { display:grid; gap:10px; }
  .tg-body { display:grid; grid-template-columns:1fr 400px; gap:30px; align-items:center; }
  .tg-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:26px; }
  .tg-fig { height:380px; border:3px solid var(--hair); border-radius:20px; }
  .tg-card { display:grid; grid-template-columns:88px 1fr; align-items:center; gap:24px; background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:26px 32px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .tg-card .ic { width:88px; height:88px; border-radius:18px; background:var(--cat); color:#fff; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:900; }
  .tg-card .bd { font-size:29px; color:var(--sumi-soft); line-height:1.45; }
  .tg-card .bd .tt { display:block; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); margin-bottom:4px; }
  .tg-card .bd b { color:var(--imp); font-weight:900; }
  .blank { font-size:33px; } .blank b { font-size:32px; }
  .tg-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:28px; line-height:1.5; }
  .tg-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .tg-note b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe tg-safe">
    <div class="tg-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-4</span>　EUの統合</span>
      <h1 class="headline" style="font-size:60px;">まるで<span class="em">1つの国</span>のように、行き来できる</h1>
    </div>
    <div class="tg-body">
      <div class="tg-grid">
        <div class="tg-card" data-at="1" data-anim="pop"><span class="ic">€</span><span class="bd"><span class="tt">共通通貨</span>多くの国で共通のお金<span class="blank" data-fill="1"><b>ユーロ</b></span>を使う。両替がいらない。</span></div>
        <div class="tg-card" data-at="2" data-anim="pop"><span class="ic">⇄</span><span class="bd"><span class="tt">移動の自由</span><b>物資・資金・人</b>が国境をこえて自由に移動できる。</span></div>
        <div class="tg-card" data-at="3" data-anim="pop"><span class="ic">開</span><span class="bd"><span class="tt">国境フリー</span><b>パスポートなし</b>で、自由に国境を通過できる。</span></div>
        <div class="tg-card" data-at="4" data-anim="pop"><span class="ic">鉄</span><span class="bd"><span class="tt">海底トンネル</span>英仏を結ぶ<span class="blank" data-fill="4"><b>ユーロトンネル</b></span>。高速鉄道が走る。</span></div>
      </div>
      <div class="figure tg-fig" data-at="4" data-anim="right"><img src="assets/eurotunnel.webp" alt="海底トンネルの出入り口から姿をあらわす高速列車"></div>
    </div>
    <div class="tg-note" data-at="5"><span class="k">ねらい</span><span>加盟国が協力して、<b>アメリカや中国に負けない大きな経済圏</b>をつくること。人・モノ・お金の動きを1つにまとめた。</span></div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
