<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 民族と宗教｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content:center; gap:44px; justify-items:center; }
  .qcard { width:1400px; background: var(--paper-hi); color: var(--sumi); border-radius:28px; padding:49px 59px; box-shadow:0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size:46px; line-height:1.5; font-weight:700; margin-top:16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top:36px; display:flex; align-items:center; gap:28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:96px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size:33px; line-height:1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
  .ans .mark.blank { min-width: 120px; padding: 0 14px 4px; margin: 0; }
  .ans .exp .blank--para { padding: 6px 14px; }
  .ans .exp .blank--para b { color: var(--imp); }
  .ans .exp .blank--para .hl { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 民族と宗教</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. ○か×か</div>
      <p class="qtext" data-at="0">ヨーロッパ南部には<span class="u">スラブ系</span>民族が多く、<br>キリスト教の<span class="u">正教会</span>を信仰する人が多い。</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-fill="1"><b>×</b></span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b>南部は<span class="hl">ラテン系民族</span>で<span class="hl">カトリック</span>が多い。<br>スラブ系・正教会が多いのは<span class="hl">東部</span>。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(3);</script>
</body>
</html>
