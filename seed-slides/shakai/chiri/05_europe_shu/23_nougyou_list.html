<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>農業カタログ ── 3つの農業のしくみ｜中1地理 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nl-safe { align-content:center; gap:30px; }
  .nl-head { display:grid; gap:10px; }
  .nl-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .nl-card { background:var(--paper-hi); border:3px solid var(--cat); border-top:14px solid var(--cat); border-radius:18px; padding:24px 28px 28px; box-shadow:0 12px 28px rgba(40,30,10,.10); display:grid; gap:16px; justify-items:center; text-align:center; align-content:start; }
  .nl-fig { width:100%; height:330px; border:3px solid var(--hair); border-radius:16px; }
  .nl-card .q { font-size:29px; color:var(--sumi-soft); line-height:1.45; }
  .nl-card .q b { color:var(--sumi); font-weight:900; }
  .blank { font-size:40px; } .blank b { font-size:38px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe nl-safe">
    <div class="nl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-2</span>　農業カタログ</span>
      <h1 class="headline" style="font-size:60px;">3つの農業を、しくみで区別する</h1>
    </div>
    <div class="nl-grid">
      <div class="nl-card" data-at="1" data-anim="pop">
        <div class="figure nl-fig"><img src="assets/kongo_nogyo.webp" alt="作物の畑と、柵で区切られた家畜の牧草地がとなり合う農場"></div>
        <span class="q"><b>畑作</b>と<b>家畜の飼育</b>を<br>組み合わせる農業</span>
        <span class="a"><span class="blank" data-fill="1"><b>混合農業</b></span></span>
      </div>
      <div class="nl-card" data-at="2" data-anim="pop">
        <div class="figure nl-fig"><img src="assets/rakuno.webp" alt="牧草地の乳牛と、ミルク缶・チーズなどの乳製品"></div>
        <span class="q"><b>乳牛</b>を飼育し、<br><b>乳製品</b>をつくる農業</span>
        <span class="a"><span class="blank" data-fill="2"><b>酪農</b></span></span>
      </div>
      <div class="nl-card" data-at="3" data-anim="pop">
        <div class="figure nl-fig"><img src="assets/chichukai_nogyo.webp" alt="地中海ぞいの丘に広がるオリーブの木とぶどう畑"></div>
        <span class="q">夏に<b>オリーブ</b>など、<br>冬に<b>小麦</b>を栽培する農業</span>
        <span class="a"><span class="blank" data-fill="3"><b>地中海式農業</b></span></span>
      </div>
    </div>
    <p class="lead" data-at="4" style="font-size:28px;"><span class="imp">★頻出</span>：この農業は「夏は暑くて乾く」気候に合わせ、<b>乾燥に強いオリーブ・ぶどう</b>を夏に、<b>雨が多い冬に小麦</b>を育てる。</p>
  </div>
  <div class="seed-foot"><span>第5章 ヨーロッパ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
