<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tx-safe { inset: 78px 130px 82px; align-content: start; gap: 26px; }

  .tx-def { font-size: 38px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .tx-def .blank { font-size: 42px; }
  .tx-row { display:grid; grid-template-columns: repeat(var(--n,3),1fr); gap: 26px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 26px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); align-content:start; }

  .pt .pb { font-size:24px; line-height:1.45; color:var(--sumi-soft); }
  .pt .pb b { color: var(--imp); }
  .tx-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .tx-note b { color:#fff; }
  .tx-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
  .tx-note.imp { background: var(--imp); }
  .tx-note.imp > span:first-child { color:#fff; opacity:.85; }
  .figbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 22px; box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 14px 20px; }
  .figbox svg { display:block; width:100%; height:auto; }

  /* --- AI画像枠 --- */
  .tx-safe { grid-template-columns: 1fr 500px; column-gap: 52px; align-items: start; }
  .tx-main { display: grid; gap: 26px; align-content: start; }
  .tx-fig { height: 620px; align-self: start; border: 3px solid var(--cat); border-radius: 26px;
    box-shadow: 0 18px 40px rgba(40,30,10,.14); }
</style>
</head>

<div class="seed-stage"><div class="seed-slide" data-cat="new">
