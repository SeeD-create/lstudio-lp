<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>再開発と都心回帰｜中1地理 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tx-safe { inset: 78px 130px 82px; align-content: start; gap: 26px; }
  .tx-head { display: grid; gap: 10px; }
  .tx-def { font-size: 38px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .tx-def .blank { font-size: 42px; }
  .tx-row { display:grid; grid-template-columns: repeat(var(--n,3),1fr); gap: 26px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 26px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); align-content:start; }
  .pt .ph { font-weight:900; font-size:29px; color:var(--c); }
  .pt .pb { font-size:24px; line-height:1.45; color:var(--sumi-soft); }
  .pt .pb b { color: var(--imp); }
  .tx-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .tx-note b { color:#fff; }
  .tx-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
  .tx-note.imp { background: var(--imp); }
  .tx-note.imp > span:first-child { color:#fff; opacity:.85; }
  .figbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 22px; box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 14px 20px; }
  .figbox svg { display:block; width:100%; height:auto; }

  /* --- AI画像枠 --- */
  .tx-safe { grid-template-columns: 1fr 500px; column-gap: 52px; align-items: start; }
  .tx-main { display: grid; gap: 26px; align-content: start; }
  .tx-fig { height: 620px; align-self: start; border: 3px solid var(--cat); border-radius: 26px;
    box-shadow: 0 18px 40px rgba(40,30,10,.14); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe tx-safe">
    <div class="tx-main">
    <div class="tx-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-6</span>　変わる東京</span>
      <h1 class="headline" style="font-size:46px;">臨海部が変わり、人が<span class="em">都心にもどる</span></h1>
    </div>
    <p class="tx-def" data-at="1">臨海部を中心に<span class="blank" data-fill="1" style="min-width:260px"><b>再開発</b></span>が盛んに行われ、<span class="imp">都心回帰</span>が進んでいる。</p>
    <div class="tx-row" style="--n:3;">
      <div class="pt" style="--c:#2E6DA4" data-at="2" data-anim="pop"><div class="ph">街を作りなおす</div><div class="pb">古い建物や使われなくなった工場・倉庫の跡地を、住宅・オフィス・商業施設に<b>作りかえる</b>こと</div></div>
      <div class="pt" style="--c:#C9862B" data-at="2" data-anim="pop"><div class="ph">都心回帰とは</div><div class="pb">郊外へ出ていった人が、便利な<b>都心の高層マンション</b>にもどってくる動き</div></div>
      <div class="pt" style="--c:#B03A2E" data-at="3" data-anim="pop"><div class="ph">代表例</div><div class="pb">東京臨海副都心（<b>お台場</b>）・汐留・六本木。工場や倉庫の跡地が高層ビル群になった</div></div>
    </div>
    <div class="tx-note imp" data-at="4"><span>つながり</span><span>作りなおしが進む海沿いの地域をまとめて<b>ウォーターフロント</b>という。カードⅣでもう一度出てくる。</span></div>
    </div>
    <div class="figure tx-fig" data-at="0" data-anim="right"><img src="assets/rinkai_saikaihatsu.webp" alt="臨海部の再開発 ── 水辺に建ちならぶ高層マンション"></div>
  </div>
  <div class="seed-foot"><span>第17章 関東地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
