<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　導入</span>
      <h1 class="headline" style="font-size:68px;">関東地方は、日本の<span class="em">「いまの中心」</span></h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">1都6県</div><div class="fttl">「都」があるのはここだけ</div><div class="fbody">東京都と、神奈川・埼玉・千葉・茨城・栃木・群馬の6県。日本でただ一つの「都」が置かれている。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">約1395万人</div><div class="fttl">東京都の人口（23区は約965万人）</div><div class="fbody">関東全体では日本の人口のおよそ3分の1。人も会社も学校も、ここに集まっている。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">日本の首都</div><div class="fttl">明治時代から東京が首都</div><div class="fbody">政治・経済・文化のすべてが集中。ニューヨークやロンドンとならぶ世界の大都市でもある。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span>この章のねらい</span><span>関東を<b>自然・東京の中心部・農林水産業・都市開発・商工業</b>の5枚のカードに分けて、1枚ずつ集めていく。</span></div>
