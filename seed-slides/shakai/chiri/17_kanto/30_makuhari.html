<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>幕張新都心 ── 千葉市の埋め立て地｜中1地理 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tx-safe { inset: 78px 130px 82px; align-content: start; gap: 26px; }
  .tx-head { display: grid; gap: 10px; }
  .tx-def { font-size: 38px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .tx-def .blank { font-size: 42px; }
  .tx-row { display:grid; grid-template-columns: repeat(var(--n,3),1fr); gap: 26px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 26px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); align-content:start; }
  .pt .ph { font-weight:900; font-size:29px; color:var(--c); }
  .pt .pb { font-size:24px; line-height:1.45; color:var(--sumi-soft); }
  .pt .pb b { color: var(--imp); }
  .tx-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .tx-note b { color:#fff; }
  .tx-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
  .tx-note.imp { background: var(--imp); }
  .tx-note.imp > span:first-child { color:#fff; opacity:.85; }
  .figbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 22px; box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 14px 20px; }
  .figbox svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe tx-safe">
    <div class="tx-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-5</span>　都市開発</span>
      <h1 class="headline" style="font-size:56px;">海をうめて作った、<span class="em">見本市</span>のまち</h1>
    </div>
    <p class="tx-def" data-at="1">④ <span class="blank" data-fill="1" style="min-width:320px"><b>幕張新都心</b></span>　…　<span class="imp">千葉市</span>に作られた埋め立て地。</p>
    <div class="tx-row" style="--n:3;">
      <div class="pt" style="--c:#B9770E" data-at="2" data-anim="pop"><div class="ph">何がある</div><div class="pb"><b>幕張メッセ</b>（見本市会場）・オフィスビル・高層住宅・大学</div></div>
      <div class="pt" style="--c:#C9862B" data-at="2" data-anim="pop"><div class="ph">見本市とは</div><div class="pb">企業が新製品を持ちよって展示する大きな催し。国際会議も開かれる</div></div>
      <div class="pt" style="--c:#2E6DA4" data-at="3" data-anim="pop"><div class="ph">交通</div><div class="pb">JR京葉線で東京駅と直結。成田・羽田の両空港にも行きやすい</div></div>
    </div>
    <div class="tx-note" data-at="4"><span>場所の確認</span><span><b>幕張＝千葉市</b>。あとで出る<b>みなとみらい21＝横浜市</b>と必ずセットで区別する。</span></div>
  </div>
  <div class="seed-foot"><span>第17章 関東地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
