      <div class="mp-head" data-at="0">
        <span class="kicker"><span class="num">Ⅲ-3</span>　高原野菜</span>
        <h1 class="headline" style="font-size:46px;">すずしさを売る、<span class="em">夏の高原野菜</span></h1>
      </div>
      <div class="lg" style="--c:#C0392B" data-at="1" data-anim="left"><span class="n">①</span><span class="t"><span class="blank" data-fill="1"><b>キャベツ</b></span><small>群馬県<b>嬬恋村</b>で栽培が盛んな<b>高原野菜</b>の代表</small></span></div>
      <div class="lg" style="--c:#2E7D32" data-at="2" data-anim="left"><span class="n">理</span><span class="t">標高が高く、夏でもすずしい<small>嬬恋村は標高約1000m。平地では暑すぎて夏にこの野菜が作れない</small></span></div>
      <div class="lg" style="--c:#B9770E" data-at="3" data-anim="left"><span class="n">戦</span><span class="t">ほかの産地が出せない時期に出荷<small>出荷時期をずらす＝<b>抑制栽培</b>。高く売れる</small></span></div>
      <div class="mp-note" data-at="4"><span>もう1つの例</span><span>長野県の<b>八ヶ岳</b>のふもとでも同じように高原野菜（レタス・はくさい）を作っている。</span></div>
      <div class="mp-note" data-at="5" style="background:var(--imp);"><span>区別</span><span>平地の<b>近郊農業</b>＝近さで勝負／高原の<b>高原野菜</b>＝すずしさ（時期）で勝負。どちらも同じ関東。</span></div>
