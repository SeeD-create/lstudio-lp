<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アフリカの歩み 年表 ── 奴隷貿易からAUへ｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { align-content:center; gap:22px; }
  .np-head { display:grid; gap:8px; }
  .np-line { display:grid; gap:15px; max-width:1560px; }
  .np-row { display:grid; grid-template-columns:210px 1fr; align-items:center; gap:30px; }
  .np-year { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--imp); text-align:right; line-height:1.15; }
  .np-bar { background:var(--paper-hi); border:3px solid var(--cat); border-left:12px solid var(--cat); border-radius:14px; padding:16px 30px; box-shadow:0 8px 20px rgba(40,30,10,.08); display:flex; align-items:baseline; gap:20px; }
  .np-bar .ab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi); min-width:180px; }
  .np-bar .tx { font-size:27px; color:var(--sumi-soft); line-height:1.4; }
  .np-bar .tx b { color:var(--sumi); font-weight:900; }
  .np-bar.big { border-width:4px; background:#fff; }
  .np-bar.big .ab { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">まとめ①</span>　アフリカの歩み 年表</span>
      <h1 class="headline" style="font-size:54px;">連れ去りの歴史から、<span class="em">協力の未来</span>へ</h1>
    </div>
    <div class="np-line">
      <div class="np-row" data-at="1"><span class="np-year">16世紀〜</span><div class="np-bar"><span class="ab">奴隷貿易</span><span class="tx">ヨーロッパ人が黒人を<b>奴隷</b>として<b>南北アメリカ</b>へ連れ去る</span></div></div>
      <div class="np-row" data-at="2"><span class="np-year">19世紀</span><div class="np-bar"><span class="ab">植民地化</span><span class="tx">ヨーロッパの国々が資源を求め、ほとんどの地域を<b>植民地</b>に</span></div></div>
      <div class="np-row" data-at="3"><span class="np-year">1960</span><div class="np-bar big"><span class="ab">アフリカの年</span><span class="tx"><b>17か国</b>が独立。民族自決の考えが広がる</span></div></div>
      <div class="np-row" data-at="4"><span class="np-year">独立後</span><div class="np-bar"><span class="ab">内戦・難民</span><span class="tx">直線的な国境が原因で民族が分断され、<b>難民</b>が発生した地域も</span></div></div>
      <div class="np-row" data-at="5"><span class="np-year">2002</span><div class="np-bar" style="border-color:var(--imp);"><span class="ab" style="color:var(--imp);">AU結成</span><span class="tx">EUを参考に<b>アフリカ連合（AU）</b>を結成し、協力を進める</span></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
