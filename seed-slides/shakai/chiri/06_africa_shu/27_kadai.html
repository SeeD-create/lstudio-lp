<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アフリカの課題とこれから ── 悩みと希望｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kd-safe { align-content:center; gap:34px; }
  .kd-head { display:grid; gap:10px; }
  .kd-row { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .kd-c { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; padding:30px 32px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:12px; }
  .kd-c .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--imp); }
  .kd-c .bd { font-size:27px; color:var(--sumi-soft); line-height:1.5; }
  .kd-c .bd b { color:var(--sumi); font-weight:900; }
  .kd-hope { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 40px; font-size:30px; line-height:1.5; }
  .kd-hope .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kd-hope b { color:#ff9a9e; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kd-safe">
    <div class="kd-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-7</span>　課題とこれから</span>
      <h1 class="headline" style="font-size:58px;">悩みをこえて、<span class="em">成長する大陸</span>へ</h1>
    </div>
    <div class="kd-row">
      <div class="kd-c" data-at="1"><span class="tt">人口の問題</span><span class="bd"><b>人口爆発</b>で食料が足りず、都市では<b>スラム</b>など都市問題も起きている。</span></div>
      <div class="kd-c" data-at="2"><span class="tt">経済の弱さ</span><span class="bd"><b>モノカルチャー経済</b>で、価格が下がると国の収入が不安定になる。</span></div>
      <div class="kd-c" data-at="3"><span class="tt">環境と紛争</span><span class="bd"><b>砂漠化</b>が進み、植民地時代の国境が原因の<b>紛争・難民</b>も残る。</span></div>
    </div>
    <div class="kd-hope" data-at="4"><span class="k">★でも</span><span>アフリカは世界で<b>最も若く、人口が増える大陸</b>。豊かな資源を生かし、AUで協力しながら成長を続けている。</span></div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
