<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>奴隷貿易と植民地化 ── 連れ去られた人々｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rk-safe { align-content:center; gap:24px; }
  .rk-head { display:grid; gap:8px; }
  .rk-line { display:grid; gap:18px; max-width:1560px; }
  .rk-row { display:grid; grid-template-columns:210px 1fr; align-items:center; gap:28px; }
  .rk-era { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--imp); text-align:right; line-height:1.2; }
  .rk-bar { background:var(--paper-hi); border:3px solid var(--cat); border-left:12px solid var(--cat); border-radius:14px; padding:20px 30px; box-shadow:0 8px 20px rgba(40,30,10,.08); font-size:30px; color:var(--sumi-soft); line-height:1.5; }
  .rk-bar b { color:var(--sumi); font-weight:900; }
  .rk-bar .blank { font-size:32px; } .rk-bar .blank b { font-size:31px; color:var(--imp); }
  .ph-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:34px; width:1322px; margin-left:238px; }
  .ph { height:296px; border-radius:20px; border:2.5px solid var(--hair); box-shadow:0 12px 28px rgba(40,30,10,.10); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe rk-safe">
    <div class="rk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-1</span>　連れ去られた人々</span>
      <h1 class="headline" style="font-size:58px;">アフリカの歴史は、<span class="em">連れ去り</span>から始まった</h1>
    </div>
    <div class="rk-line">
      <div class="rk-row" data-at="1"><span class="rk-era">〜15世紀</span><div class="rk-bar">サハラ砂漠より南の中南アフリカには、多くの<b>黒人王国</b>が栄えていた。</div></div>
      <div class="rk-row" data-at="2"><span class="rk-era">16世紀初め〜</span><div class="rk-bar"><span class="blank" data-fill="2"><b>ヨーロッパ</b></span>人が、多くの黒人を<span class="blank" data-fill="3"><b>奴隷</b></span>として<span class="blank" data-fill="4"><b>南北アメリカ</b></span>へ連れ去った（この取引を「③貿易」とよぶ）。</div></div>
      <div class="rk-row" data-at="5"><span class="rk-era">19世紀</span><div class="rk-bar">欧米の国々が資源を求め、アフリカのほとんどの地域を<span class="blank" data-fill="5"><b>植民地</b></span>とした。</div></div>
    </div>
    <div class="ph-strip" data-at="0" data-anim="fade">
      <div class="figure ph"><img src="assets/koeki_toride.webp" alt="奴隷貿易の拠点となった西アフリカ海岸の石造りの砦"></div>
      <div class="figure ph"><img src="assets/shokuminchi_kouwan.webp" alt="植民地時代につくられた鉄道と、資源を積み出す港の設備"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
