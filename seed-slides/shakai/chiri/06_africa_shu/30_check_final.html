<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>総仕上げ ── アフリカ州○×クイズ｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fq-safe { inset: 84px 150px 84px; align-content: start; gap: 24px; }
  .fq-head { display: grid; gap: 12px; }
  .qrow { display:flex; align-items:center; gap:28px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:19px 33px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .qrow .qn { flex:none; width:56px; height:56px; border-radius:50%; background:var(--gold-soft); color:var(--sumi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; display:flex; align-items:center; justify-content:center; }
  .qrow .qq { flex:1; font-size:29px; font-weight:700; line-height:1.4; }
  .qrow .qq .u { color: var(--sumi); }
  .qrow .qa { flex:none; display:flex; align-items:center; gap:16px; }
  .qrow .qa .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; line-height:1; color: var(--sumi); }
  .qrow .qa .fix { font-size:23px; color: var(--sumi); font-weight:900; max-width:260px; line-height:1.3; }
  .qrow .qa .mk.blank { min-width:88px; padding:0 10px 4px; margin:0; }
  .qrow .qa .fix .blank--para { padding:3px 10px; min-width:140px; }
  .qrow .qa .fix .blank--para b { color: var(--imp); font-family:inherit; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe fq-safe">
    <div class="fq-head" data-at="0">
      <span class="kicker"><span class="num">総仕上げ</span>　アフリカ州</span>
      <h1 class="headline" style="font-size:56px;">○×で最終チェック</h1>
    </div>
    <div class="qrow" data-at="1" data-anim="left">
      <span class="qn">1</span>
      <span class="qq">アフリカ大陸の北部を流れる<span class="u">ナイル川</span>は、世界でもっとも長い川である。</span>
      <span class="qa"><span class="mk blank" data-fill="1"><b>○</b></span></span>
    </div>
    <div class="qrow" data-at="2" data-anim="left">
      <span class="qn">2</span>
      <span class="qq">輸出品が特定の産物にかたよっている経済を<span class="u">プランテーション</span>という。</span>
      <span class="qa"><span class="mk blank" data-fill="2"><b>×</b></span><span class="fix"><span class="blank blank--para" data-fill="2"><b>→ モノカルチャー経済</b></span></span></span>
    </div>
    <div class="qrow" data-at="3" data-anim="left">
      <span class="qn">3</span>
      <span class="qq">EUを参考に2002年に結成された地域統合を<span class="u">アフリカ連合（AU）</span>という。</span>
      <span class="qa"><span class="mk blank" data-fill="3"><b>○</b></span></span>
    </div>
    <div class="qrow" data-at="4" data-anim="left">
      <span class="qn">4</span>
      <span class="qq">南アフリカ共和国でかつて行われた人種隔離政策を<span class="u">アパルトヘイト</span>という。</span>
      <span class="qa"><span class="mk blank" data-fill="4"><b>○</b></span></span>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
