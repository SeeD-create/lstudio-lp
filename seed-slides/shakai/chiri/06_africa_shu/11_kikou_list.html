<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>気候カタログ ── 熱帯雨林・サバナ・ステップ｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kl-safe { align-content:center; gap:22px; }
  .kl-head { display:grid; gap:8px; }
  .kl-row { display:grid; grid-template-columns:170px 1fr; align-items:center; gap:24px; background:var(--paper-hi); border:2.5px solid var(--hair); border-left:12px solid var(--cat); border-radius:16px; padding:20px 30px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .kl-row .rg { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .kl-row .rb { font-size:29px; color:var(--sumi-soft); line-height:1.5; }
  .kl-row .rb b { color:var(--sumi); font-weight:900; }
  .blank { font-size:32px; } .blank b { font-size:31px; }
  .kl-note { display:flex; gap:30px; }
  .kl-chip { flex:1; display:flex; align-items:center; gap:18px; background: var(--paper-hi); color: var(--sumi); border-radius:14px; padding:13px 23px; font-size:25px; line-height:1.4; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .kl-chip .k { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); white-space:nowrap; }
  .kl-chip b { color:#ff8a8f; }
  .ph-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:30px; }
  .ph { height:242px; border-radius:20px; border:2.5px solid var(--hair); box-shadow:0 12px 28px rgba(40,30,10,.10); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kl-safe">
    <div class="kl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-4</span>　気候カタログ</span>
      <h1 class="headline" style="font-size:56px;">赤道から外へ、植物がどう変わる？</h1>
    </div>
    <div class="kl-row" data-at="1"><span class="rg">熱帯</span><span class="rb">赤道付近は<span class="blank" data-fill="1"><b>熱帯雨林</b></span>。その外側は、まばらな樹木の草原＝<span class="blank" data-fill="1"><b>サバナ</b></span>。</span></div>
    <div class="kl-row" data-at="2"><span class="rg">乾燥帯</span><span class="rb">中心は雨のほぼ降らない<b>砂漠</b>。そのまわりは、背の低い草が生える<span class="blank" data-fill="2"><b>ステップ</b></span>。</span></div>
    <div class="kl-row" data-at="3"><span class="rg">温帯</span><span class="rb">大陸の南北のはし。夏に乾燥する<span class="blank" data-fill="3"><b>地中海性</b></span>気候などがみられる。</span></div>
    <div class="kl-note" data-at="4">
      <div class="kl-chip"><span class="k"><span class="blank" data-fill="4"><b>サバナ</b></span></span><span>まばらに樹木が生えた<b>草原</b>。森林の外側に広がる。</span></div>
      <div class="kl-chip"><span class="k"><span class="blank" data-fill="4"><b>ステップ</b></span></span><span>背の低い草の生えた<b>草原</b>。砂漠のまわりに広がる。</span></div>
    </div>
    <div class="ph-strip" data-at="0" data-anim="fade">
      <div class="figure ph"><img src="assets/savanna.webp" alt="サバナ ── まばらなアカシアの木が立つ広い草原と、キリンやシマウマ"></div>
      <div class="figure ph"><img src="assets/steppe.webp" alt="ステップ ── 背の低い草がまばらに生える、砂漠のまわりの乾いた草原"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
