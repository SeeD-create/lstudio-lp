<head>

<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rm-safe { grid-template-columns:1fr 450px; align-content:center; align-items:center; gap:52px; }
  .rm-txt { display:grid; gap:32px; }
  .rm-fig { height:520px; border-radius:26px; border:3px solid var(--hair); box-shadow:0 18px 42px rgba(40,30,10,.16); overflow:hidden; }
  .rm-head { display:grid; gap:10px; }
  .rm-def { background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:30px 42px; box-shadow:0 12px 30px rgba(40,30,10,.10); font-size:34px; line-height:1.6; color:var(--sumi-soft); }
  .rm-def b { color:var(--sumi); font-weight:900; }
  .rm-def .blank { font-size:36px; } .rm-def .blank b { font-size:35px; color:var(--imp); }
  .rm-chips { display:flex; gap:20px; justify-content:center; }
  .rm-chip { background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; }
  .rm-note { display:flex; align-items:center; gap:26px; background:var(--paper-hi); border-left:10px solid var(--imp); border-radius:0 16px 16px 0; padding:24px 34px; font-size:30px; color:var(--sumi-soft); line-height:1.5; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .rm-note b { color:var(--imp); font-weight:900; }
  .rm-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--sumi); white-space:nowrap; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe rm-safe">

    <div class="rm-head" data-at="0">

    <div class="rm-chips" data-at="2">

      <div class="rm-chip">ニッケル</div>
      <div class="rm-chip">クロム</div>

    </div>
    <div class="figure rm-fig" data-at="0" data-anim="right"><img src="assets/rare_metal_ore.webp" alt="レアメタルの鉱石 ── 金属光沢のある鉱石の塊と、精錬された金属のかけら"></div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
