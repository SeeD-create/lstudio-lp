<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sa-safe { align-content:center; gap:26px; }
  .sa-head { display:grid; gap:10px; }
  .sa-lead { font-size:34px; color:var(--sumi-soft); line-height:1.5; }
  .sa-lead b { color:var(--sumi); font-weight:900; }
  .sa-lead .blank { font-size:36px; } .sa-lead .blank b { font-size:35px; color:var(--imp); }
  .sa-row { display:grid; grid-template-columns:repeat(2,1fr); gap:28px; }
  .sa-c { background:var(--paper-hi); border:2.5px solid var(--hair); border-left:12px solid var(--cat); border-radius:18px; padding:26px 32px; box-shadow:0 10px 24px rgba(40,30,10,.08); display:grid; gap:8px; }
  .sa-c .tt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .sa-c .bd { font-size:28px; color:var(--sumi-soft); line-height:1.45; }
  .sa-c .bd b { color:var(--sumi); font-weight:900; }
  .sa-c.imp { border-left-color:var(--imp); }
  .sa-c .bd .blank { font-size:30px; } .sa-c .bd .blank b { font-size:29px; color:var(--imp); }
  .ph-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:30px; }
  .ph { height:280px; border-radius:20px; border:2.5px solid var(--hair); box-shadow:0 12px 28px rgba(40,30,10,.10); overflow:hidden; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sa-safe">
    <div class="sa-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-6</span>　大陸最南端の資源大国</span>
      <h1 class="headline" style="font-size:56px;">アフリカ最南端の、<span class="em">資源大国</span></h1>
    </div>
    <p class="sa-lead" data-at="1">アフリカ最南端の<span class="blank" data-fill="1"><b>南アフリカ共和国</b></span>は、<b>金・ダイヤモンド・レアメタル</b>の産出が多く、アフリカで最も工業が発達した国。</p>
    <div class="sa-row">
      <div class="sa-c" data-at="2"><span class="tt">資源</span><span class="bd"><b>金</b>の産出は世界有数。<b>ダイヤモンド</b>や<b>レアメタル</b>も豊富で、工業がさかん。</span></div>
      <div class="sa-c imp" data-at="3"><span class="tt">かつての差別</span><span class="bd">かつて白人以外を差別する<b>人種隔離政策</b>＝<span class="blank" data-fill="3"><b>アパルトヘイト</b></span>があったが、今は<b>廃止</b>された。</span></div>
    </div>
    <div class="ph-strip" data-at="0" data-anim="fade">
      <div class="figure ph"><img src="assets/gold.webp" alt="金 ── 金を含む鉱石と、精錬された金のかたまり"></div>
      <div class="figure ph"><img src="assets/diamond.webp" alt="ダイヤモンド ── 採れたままの原石と、カットされた透明な石"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
