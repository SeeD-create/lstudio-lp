<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">第6章</span>　アフリカ州とは</span>
      <h1 class="headline" style="font-size:74px;">アフリカ州を、<span class="em">3枚のカード</span>で集める</h1>

    </div>

      <div class="tw-card" data-at="2" data-anim="pop"><span class="no">Ⅱ</span><span class="tt">歩みと国々</span><span class="bd">奴隷貿易・<b>植民地</b>支配・独立。国境線に残る歴史のきず。</span></div>

    </div>
