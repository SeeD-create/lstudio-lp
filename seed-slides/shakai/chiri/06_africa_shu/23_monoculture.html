<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>モノカルチャー経済 ── かたよった輸出｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mc-safe { align-content:center; gap:26px; }
  .mc-head { display:grid; gap:10px; }
  .mc-graphs { display:grid; grid-template-columns:repeat(2,1fr); gap:34px; }
  .mc-g { background:var(--paper-hi); border:2.5px solid var(--hair); border-radius:18px; padding:24px 30px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .mc-g .cn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi); margin-bottom:14px; }
  .mc-g svg { display:block; width:100%; height:auto; }
  .mc-def { display:flex; align-items:center; gap:30px; background: var(--paper-hi); color: var(--sumi); border-radius:20px; padding:23px 37px; box-shadow:0 14px 32px rgba(40,30,10,.14); border: 3px solid var(--sumi);}
  .mc-def .tx { font-size:31px; line-height:1.5; }
  .mc-def .tx b { color:#ff9a9e; font-weight:900; }
  .mc-def .tx .blank { font-size:34px; } .mc-def .tx .blank b { font-size:33px; color: var(--imp); background: linear-gradient(180deg, rgba(200,162,75,.10), rgba(200,162,75,.02)); border-bottom-color: var(--imp); }
  .ph-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:34px; }
  .ph { height:280px; border-radius:20px; border:2.5px solid var(--hair); box-shadow:0 12px 28px rgba(40,30,10,.10); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe mc-safe">
    <div class="mc-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-4</span>　かたよった輸出</span>
      <h1 class="headline" style="font-size:56px;">1つの産物に、国の経済が<span class="em">まるごと</span>のる</h1>
    </div>
    <div class="mc-graphs">
      <div class="mc-g" data-at="1">
        <div class="cn">ザンビアの輸出品</div>
        <svg viewBox="0 0 600 90" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="20" width="486" height="50" rx="6" fill="#D08A3A"/>
          <rect x="486" y="20" width="114" height="50" rx="6" fill="#C9C7C0"/>
          <text x="243" y="53" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" font-family="'Zen Kaku Gothic New',sans-serif">銅　81%</text>
          <text x="543" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#5a5a58" font-family="'Zen Kaku Gothic New',sans-serif">その他</text>
        </svg>
      </div>
      <div class="mc-g" data-at="2">
        <div class="cn">ナイジェリアの輸出品</div>
        <svg viewBox="0 0 600 90" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="20" width="472" height="50" rx="6" fill="#43423f"/>
          <rect x="472" y="20" width="128" height="50" rx="6" fill="#C9C7C0"/>
          <text x="236" y="53" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" font-family="'Zen Kaku Gothic New',sans-serif">石油　79%</text>
          <text x="536" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#5a5a58" font-family="'Zen Kaku Gothic New',sans-serif">その他</text>
        </svg>
      </div>
    </div>
    <div class="ph-strip" data-at="0" data-anim="fade">
      <div class="figure ph"><img src="assets/copper_mine.webp" alt="銅の露天掘り鉱山 ── らせん状に段々がついた巨大なすり鉢状の穴"></div>
      <div class="figure ph"><img src="assets/oil_facility.webp" alt="石油の生産施設 ── 大きな貯蔵タンクとパイプライン、くみ上げ装置"></div>
    </div>
    <div class="mc-def" data-at="3">
      <span class="tx">このように、輸出品が<b>特定の産物にかたよっている</b>経済を<span class="blank" data-fill="3"><b>モノカルチャー経済</b></span>という。<br><b>国際価格の変動</b>の影響を受けやすく、国の収入が不安定になりやすい。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
