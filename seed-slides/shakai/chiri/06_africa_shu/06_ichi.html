<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アフリカの位置と大きさ ── 赤道が真ん中を通る大陸｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ic-safe { align-content:center; gap:34px; }
  .ic-head { display:grid; gap:12px; }
  .ic-row { display:grid; grid-template-columns:repeat(2,1fr); gap:30px; }
  .ic-card { display:grid; grid-template-columns:76px 1fr; align-items:center; gap:24px; background:var(--paper-hi); border:2.5px solid var(--hair); border-left:12px solid var(--cat); border-radius:18px; padding:26px 34px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .ic-card .ic { width:76px; height:76px; border-radius:16px; background:var(--cat); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; display:flex; align-items:center; justify-content:center; }
  .ic-card .tx { font-size:32px; color:var(--sumi-soft); line-height:1.45; }
  .ic-card .tx b { color:var(--imp); font-weight:900; }
  .ic-card .tx .s { color:var(--sumi); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ic-safe">
    <div class="ic-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-1</span>　アフリカの位置と大きさ</span>
      <h1 class="headline" style="font-size:64px;">赤道が、大陸の<span class="em">真ん中</span>を通る</h1>
    </div>
    <div class="ic-row">
      <div class="ic-card" data-at="1"><span class="ic">大</span><span class="tx"><span class="s">世界で2番目に大きい大陸</span>。ユーラシアに次ぐ広さで、<b>54以上の国</b>がある。</span></div>
      <div class="ic-card" data-at="2"><span class="ic">赤</span><span class="tx"><b>赤道</b>が大陸のほぼ<span class="s">中央</span>を通る。だから南北で気候が対称にならぶ。</span></div>
      <div class="ic-card" data-at="3"><span class="ic">海</span><span class="tx">まわりを<span class="s">大西洋・インド洋・地中海</span>が囲む。北は地中海をはさんでヨーロッパと向き合う。</span></div>
      <div class="ic-card" data-at="4"><span class="ic">近</span><span class="tx">北のはしは<span class="s">ヨーロッパに近い</span>。この近さが、のちの植民地支配につながっていく。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
