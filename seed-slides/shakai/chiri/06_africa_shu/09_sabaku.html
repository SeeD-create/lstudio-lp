<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>サヘルと砂漠化 ── 進む砂漠のふち｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sb-safe { align-content:center; gap:34px; }
  .sb-head { display:grid; gap:12px; }
  .sb-def { background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:30px 40px; box-shadow:0 12px 30px rgba(40,30,10,.10); font-size:34px; line-height:1.6; color:var(--sumi-soft); }
  .sb-def b { color:var(--sumi); font-weight:900; }
  .sb-def .blank { font-size:36px; } .sb-def .blank b { font-size:34px; }
  .sb-flow { display:grid; grid-template-columns:1fr 60px 1fr 60px 1fr; align-items:center; gap:0 6px; }
  .sb-box { background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:21px 17px; text-align:center; font-size:28px; font-weight:800; line-height:1.4; min-height:120px; display:flex; align-items:center; justify-content:center; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .sb-box.imp { background:var(--imp); }
  .sb-box small { display:block; font-size:22px; font-weight:600; color: var(--sumi); margin-top:6px; }
  .sb-box.imp small { color:#ffd; }
  .sb-arrow { font-size:44px; color:var(--sumi-mute); text-align:center; font-weight:900; }
  .ph-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:30px; }
  .ph { height:288px; border-radius:20px; border:2.5px solid var(--hair); box-shadow:0 12px 28px rgba(40,30,10,.10); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sb-safe">
    <div class="sb-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-3</span>　サハラのふちで起きていること</span>
      <h1 class="headline" style="font-size:60px;">砂漠のふちで、いま<span class="em">問題</span>が起きている</h1>
    </div>
    <div class="sb-def" data-at="1">サハラ砂漠の南のふちに広がる、少しだけ草が生える地域を<span class="blank" data-fill="1"><b>サヘル</b></span>という。ここで大きな問題になっているのが<span class="blank" data-fill="2"><b>砂漠化</b></span>だ。</div>
    <div class="sb-flow">
      <div class="sb-box" data-at="3"><div><span class="blank" data-fill="3" style="font-size:30px;"><b>干ばつ</b></span>が続く<small>1960年代からの気候</small></div></div>
      <div class="sb-arrow" data-at="4">＋</div>
      <div class="sb-box" data-at="4"><div>人口増加で<br><b style="color:#ff8a8f;">家畜が増える</b><small>草を食べつくす</small></div></div>
      <div class="sb-arrow" data-at="5">→</div>
      <div class="sb-box imp" data-at="5"><div><span class="blank" data-fill="5" style="font-size:30px;background:rgba(255,255,255,.18);border-bottom-color:#fff;"><b style="color:#fff;">砂漠化</b></span>が進む<small>緑が失われていく</small></div></div>
    </div>
    <div class="ph-strip" data-at="0" data-anim="fade">
      <div class="figure ph"><img src="assets/sahel.webp" alt="サヘル ── 砂漠の南のふちに広がる、まばらな草とやせた低木の乾いた大地"></div>
      <div class="figure ph"><img src="assets/sabakuka.webp" alt="砂漠化 ── 草地が砂に埋もれ、ひび割れた土と枯れ木だけが残る"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
