<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>自然カタログ ── 特徴でおさえる｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gl-safe { align-content:center; gap:26px; }
  .gl-head { display:grid; gap:10px; }
  .gl-row { display:grid; grid-template-columns:repeat(2,1fr); gap:22px 30px; }
  .gc { background:var(--paper-hi); border:2.5px solid var(--hair); border-left:12px solid var(--cat); border-radius:16px; padding:20px 28px; box-shadow:0 8px 20px rgba(40,30,10,.07); display:grid; gap:6px; }
  .gc .nm { font-size:29px; }
  .gc .nm .blank { font-size:31px; } .gc .nm .blank b { font-size:30px; }
  .gc .ds { font-size:25px; color:var(--sumi-soft); line-height:1.4; }
  .gc .ds b { color:var(--sumi); font-weight:900; }
  .ph-strip { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .ph { height:250px; border-radius:18px; border:2.5px solid var(--hair); box-shadow:0 10px 24px rgba(40,30,10,.10); overflow:hidden; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe gl-safe">
    <div class="gl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-2</span>　自然カタログ</span>
      <h1 class="headline" style="font-size:58px;">6つの自然を、<span class="em">特徴</span>でおさえる</h1>
    </div>
    <div class="gl-row">
      <div class="gc" data-at="1"><span class="nm">① <span class="blank" data-fill="1"><b>サハラ砂漠</b></span></span><span class="ds"><b>世界最大</b>の砂漠。大陸北部に広がる。</span></div>
      <div class="gc" data-at="2"><span class="nm">② <span class="blank" data-fill="2"><b>ナイル川</b></span></span><span class="ds"><b>世界最長</b>の川。北東部を流れ、古代<b>エジプト文明</b>が栄えた。</span></div>
      <div class="gc" data-at="3"><span class="nm">③ <span class="blank" data-fill="3"><b>ギニア湾</b></span></span><span class="ds">西アフリカ沿岸。かつて<b>奴隷貿易</b>の拠点となった。</span></div>
      <div class="gc" data-at="4"><span class="nm">④ <span class="blank" data-fill="4"><b>コンゴ盆地</b></span></span><span class="ds">赤道直下の低地。<b>熱帯雨林</b>が広がる。</span></div>
      <div class="gc" data-at="5"><span class="nm">⑤ <span class="blank" data-fill="5"><b>エチオピア高原</b></span></span><span class="ds">標高が高く、赤道近くでも過ごしやすい。</span></div>
      <div class="gc" data-at="6"><span class="nm">⑥ <span class="blank" data-fill="6"><b>マダガスカル島</b></span></span><span class="ds">南東沖にうかぶ大きな島。独自の生き物が多い。</span></div>
    </div>
    <div class="ph-strip" data-at="0" data-anim="fade">
      <div class="figure ph"><img src="assets/sahara_oasis.webp" alt="サハラ砂漠 ── 果てしない砂丘と、ナツメヤシが茂るオアシス"></div>
      <div class="figure ph"><img src="assets/nile.webp" alt="ナイル川 ── 砂漠の中を流れる大河と、川ぞいだけに続く緑の帯"></div>
      <div class="figure ph"><img src="assets/congo_rainforest.webp" alt="コンゴ盆地 ── 赤道直下に広がる熱帯雨林"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
