<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アフリカの農業 ── 焼畑農業とプランテーション｜中1地理 第6章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ng-safe { grid-template-columns:1fr 470px; align-content:center; align-items:center; gap:52px; }
  .ng-txt { display:grid; gap:26px; }
  .ng-fig { height:560px; border-radius:26px; border:3px solid var(--hair); box-shadow:0 18px 42px rgba(40,30,10,.16); overflow:hidden; }
  .ng-head { display:grid; gap:10px; }
  .ng-row { display:grid; grid-template-columns:262px 1fr; align-items:center; gap:22px; background:var(--paper-hi); border:2.5px solid var(--hair); border-left:12px solid var(--cat); border-radius:18px; padding:24px 30px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .ng-row .rg { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--sumi); text-align:center; }
  .ng-row .rg .blank { font-size:27px; min-width:0; } .ng-row .rg .blank b { font-size:26px; color:var(--imp); }
  .ng-row .tx { font-size:29px; color:var(--sumi-soft); line-height:1.5; }
  .ng-row .tx b { color:var(--sumi); font-weight:900; }
  .ng-row .tx .blank { font-size:31px; } .ng-row .tx .blank b { font-size:30px; color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ng-safe">
    <div class="ng-txt">
    <div class="ng-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-1</span>　アフリカの農業</span>
      <h1 class="headline" style="font-size:52px;">2つの農業で、アフリカをつかむ</h1>
    </div>
    <div class="ng-row" data-at="1"><span class="rg"><span class="blank" data-fill="1"><b>焼畑農業</b></span></span><span class="tx">森林や草原を<b>焼いて、その灰を肥料</b>にして作物を育てる農業。<b>ヤムイモ・キャッサバ</b>などを栽培する。</span></div>
    <div class="ng-row" data-at="2"><span class="rg"><span class="blank" data-fill="2"><b>プランテーション</b></span></span><span class="tx"><b>カカオ・コーヒー・綿花・油ヤシ</b>などを、輸出向けに大規模に栽培する農園。植民地時代に作られた。</span></div>
    <div class="ng-row" data-at="3"><span class="rg">カカオ</span><span class="tx"><span class="blank" data-fill="3"><b>コートジボワール</b></span>・ガーナで生産が盛ん。<b>チョコレートの原料</b>で、③の国が世界1位。</span></div>
    </div>
    <div class="figure ng-fig" data-at="0" data-anim="right"><img src="assets/plantation.webp" alt="プランテーション ── 輸出用の作物を等間隔に植えた大規模な農園"></div>
  </div>
  <div class="seed-foot"><span>第6章 アフリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
