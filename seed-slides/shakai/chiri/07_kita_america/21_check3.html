<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── アメリカの農業｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 46px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--gold-soft); border-bottom: 4px solid var(--gold-deep); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:92px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size: 33px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
  .ans .mark.blank { min-width: 120px; padding: 0 14px 4px; margin: 0; }
  .ans .exp .blank--para { padding: 6px 14px; }
  .ans .exp .blank--para b { color: var(--imp); }
  .ans .exp .blank--para .hl { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認・農業</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 　　　　に入る語は？</div>
      <p class="qtext" data-at="0">その土地の自然条件に合った作物を栽培することを<br>　　　　といい、アメリカ農業の大きな特色である。</p>
      <div class="ans" data-at="1">
        <span class="mark" data-at="1" data-anim="pop">答</span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b><span class="hl">適地適作</span>。<br>地下水で円形に散水するかんがいは<span class="hl">センターピボット</span>、家畜を太らせる施設は<span class="hl">フィードロット</span>。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(3);</script>
</body>
</html>
