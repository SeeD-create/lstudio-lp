<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世界の食料庫 ── 農産物の生産と輸出｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ss-safe { inset: 90px 150px 88px; align-content:center; gap:30px; }
  .ss-head { display:grid; gap:12px; }
  .ss-body { display:grid; grid-template-columns: 1fr 460px; gap:46px; align-items:center; }
  .ss-fig { height: 460px; border-radius: 26px; border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); }
  .bars { display:grid; gap:22px; }
  .bar { display:grid; grid-template-columns: 260px 1fr; align-items:center; gap:26px; }
  .bar .lb { font-size:30px; font-weight:900; color:var(--sumi); text-align:right; }
  .bar .lb small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:700; }
  .track { position:relative; height:52px; background:var(--paper-lo); border-radius:12px; overflow:hidden; box-shadow:inset 0 0 0 2px var(--hair); }
  .fill { position:absolute; left:0; top:0; bottom:0; border-radius:12px; display:flex; align-items:center; justify-content:flex-end; padding-right:18px; color:#fff; font-weight:900; font-size:26px; }
  .fill.us { background:#C4161C; }
  .fill.other { background:#9AA0A6; }
  .rank { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--sumi); }
  .ss-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 40px; font-size:31px; line-height:1.5; }
  .ss-note .k { flex:none; font-weight:900; color:var(--gold-soft); letter-spacing:.08em; }
  .cap { font-size:22px; color:var(--sumi-mute); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ss-safe">
    <div class="ss-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-3</span>　世界の食料庫</span>
      <h1 class="headline" style="font-size:54px;">アメリカは<span class="em">輸出</span>で世界を支える <span class="cap">（世界にしめる割合）</span></h1>
    </div>
    <div class="ss-body">
    <div class="bars">
      <div class="bar" data-at="1"><span class="lb">とうもろこし<small>生産量</small></span><div class="track"><div class="fill us" style="width:30%;">30%</div><span class="rank" style="left:33%;">世界1位</span></div></div>
      <div class="bar" data-at="2"><span class="lb">とうもろこし<small>輸出量</small></span><div class="track"><div class="fill us" style="width:28%;">28%</div><span class="rank" style="left:31%;">世界1位</span></div></div>
      <div class="bar" data-at="3"><span class="lb">大豆<small>輸出量</small></span><div class="track"><div class="fill us" style="width:36%;">36%</div><span class="rank" style="left:39%;">世界2位</span></div></div>
      <div class="bar" data-at="4"><span class="lb">小麦<small>輸出量</small></span><div class="track"><div class="fill us" style="width:11%;">11%</div><span class="rank" style="left:14%;">上位の輸出国</span></div></div>
    </div>
    <div class="figure ss-fig" data-at="0" data-anim="right"><img src="assets/yushutsu_silo.webp" alt="輸出へ ── 巨大な穀物サイロと、穀物を積み込む長い貨物列車"></div>
    </div>
    <div class="ss-note" data-at="4"><span class="k">だから</span><span>大量の農作物を世界へ輸出するアメリカは、<span class="imp">「世界の食料庫」</span>とよばれる。</span></div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
