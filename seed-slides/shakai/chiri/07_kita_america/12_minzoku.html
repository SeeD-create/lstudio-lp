<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>多民族国家アメリカ｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mz-safe { inset: 96px 140px 92px; align-content: center; gap: 34px; }
  .mz-head { display:grid; gap:12px; }
  .mz-row { display:grid; grid-template-columns: repeat(4,1fr); gap: 26px; }
  .mcard { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; padding:30px 28px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:12px; align-content:start; }
  .mcard .pct { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; line-height:1; color:var(--imp); }
  .mcard .nm { font-size:24px; }
  .mcard .nm .blank { font-size:30px; }
  .mcard .nm .blank b { font-size:29px; }
  .mcard .ds { font-size:23px; color:var(--sumi-soft); line-height:1.45; }
  .mz-note { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 35px; font-size:30px; line-height:1.5; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .mz-note .k { flex:none; font-weight:900; color: var(--sumi); letter-spacing:.08em; }
  .mz-note .blank { font-size:32px; }
  .mz-note .blank b { color:#ff6b6b; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe mz-safe">
    <div class="mz-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-2</span>　民族</span>
      <h1 class="headline" style="font-size:58px;">さまざまな人々が暮らす<span class="em">人種のサラダボウル</span></h1>
    </div>
    <div class="mz-row">
      <div class="mcard" data-at="1" data-anim="pop"><span class="pct">約80%</span><span class="nm">ヨーロッパ系の<br><span class="blank" data-fill="1"><span class="bnum">④</span><b>白人</b></span></span><span class="ds">人口の大多数をしめる。植民地時代にヨーロッパから移住してきた人々の子孫。</span></div>
      <div class="mcard" data-at="2" data-anim="pop"><span class="pct">約13%</span><span class="nm">アフリカ系の<br><span class="blank" data-fill="2"><span class="bnum">⑤</span><b>黒人</b></span></span><span class="ds">アフリカから奴隷として連れてこられた人々の子孫。</span></div>
      <div class="mcard" data-at="3" data-anim="pop"><span class="pct">先住民</span><span class="nm">アメリカの先住民<br><span class="blank" data-fill="3"><span class="bnum">⑥</span><b>ネイティブアメリカン</b></span></span><span class="ds">ヨーロッパ人が来る前から住んでいた人々。土地を奪われた。</span></div>
      <div class="mcard" data-at="4" data-anim="pop"><span class="pct">増加中</span><span class="nm">スペイン語系の<br><span class="blank" data-fill="4"><span class="bnum">⑦</span><b>ヒスパニック</b></span></span><span class="ds">メキシコなど中南米から来た人々。近年とくに増えている。</span></div>
    </div>
    <div class="mz-note" data-at="5"><span class="k">まとめ</span><span>さまざまな民族が共に暮らす国＝<span class="blank" data-fill="5"><b>多民族国家</b></span>。それぞれの文化が混じり合っている。</span></div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
