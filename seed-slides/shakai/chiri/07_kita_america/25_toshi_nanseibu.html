<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>南部・太平洋岸の都市｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ci-safe { inset: 88px 150px 86px; align-content:center; gap:26px; }
  .ci-head { display:grid; gap:10px; }
  .ci-body { display:grid; grid-template-columns: 1fr 500px; gap:46px; align-items:center; }
  .ci-fig { height: 520px; border-radius: 26px; border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); }
  .ci-grid { display:grid; grid-template-columns: 1fr; gap:16px; }
  .ci { display:grid; grid-template-columns: 54px 1fr; align-items:center; gap:22px; background:var(--paper-hi); border:2.5px solid var(--hair); border-radius:14px; padding:16px 26px; box-shadow:0 8px 20px rgba(40,30,10,.06); }
  .ci .ic { width:54px; height:54px; border-radius:50%; background:var(--sumi); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; }
  .ci .tx { font-size:27px; color:var(--sumi-soft); line-height:1.3; }
  .ci .tx .q { color:var(--sumi); font-weight:800; }
  .ci .blank { font-size:31px; } .ci .blank b { font-size:30px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe ci-safe">
    <div class="ci-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-2</span>　南部・太平洋岸の都市</span>
      <h1 class="headline" style="font-size:52px;">新しい産業が育つ<span class="em">南と西</span>のまち</h1>
    </div>
    <div class="ci-body">
    <div class="ci-grid">
      <div class="ci" data-at="1" data-anim="left"><span class="ic">⑦</span><span class="tx"><span class="q">航空機産業が盛ん（ボーイング）</span>　→　<span class="blank" data-fill="1"><b>シアトル</b></span></span></div>
      <div class="ci" data-at="2" data-anim="left"><span class="ic">⑧</span><span class="tx"><span class="q">第2の都市・航空機・ICT産業が盛ん</span>　→　<span class="blank" data-fill="2"><b>ロサンゼルス</b></span></span></div>
      <div class="ci" data-at="3" data-anim="left"><span class="ic">⑨</span><span class="tx"><span class="q">郊外にシリコンバレーが広がる</span>　→　<span class="blank" data-fill="3"><b>サンフランシスコ</b></span></span></div>
      <div class="ci" data-at="4" data-anim="left"><span class="ic">⑩</span><span class="tx"><span class="q">石油化学・宇宙産業が盛ん（メキシコ湾岸）</span>　→　<span class="blank" data-fill="4"><b>ヒューストン</b></span></span></div>
      <div class="ci" data-at="5" data-anim="left"><span class="ic">⑪</span><span class="tx"><span class="q">コカコーラ本社・南部の商業・経済の中心</span>　→　<span class="blank" data-fill="5"><b>アトランタ</b></span></span></div>
    </div>
    <div class="figure ci-fig" data-at="0" data-anim="right"><img src="assets/kouku_kojo.webp" alt="航空機の組み立て工場 ── 巨大な格納庫にならぶ製造中の旅客機"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
