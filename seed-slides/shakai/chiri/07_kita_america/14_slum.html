<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>人種差別とスラム｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sl-safe { inset: 92px 140px 88px; grid-template-columns: 1fr 620px; align-content:center; gap:56px; align-items:center; }
  .sl-left { display:grid; gap:22px; }
  .sl-right { display:grid; gap:26px; align-content:center; }
  .sl-fig { height: 420px; border-radius: 26px; border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.16); }
  .sl-head { display:grid; gap:12px; }
  .srow { display:flex; align-items:center; gap:22px; background:var(--paper-hi); border-left:9px solid var(--sumi); border-radius:0 16px 16px 0; padding:20px 30px; box-shadow:0 8px 20px rgba(40,30,10,.07); }
  .srow .n { flex:none; width:52px; height:52px; border-radius:50%; background:var(--sumi); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; }
  .srow .t { font-size:28px; color:var(--sumi-soft); line-height:1.4; }
  .srow .t .blank { font-size:31px; }
  .srow .t b { color:var(--sumi); font-weight:900; }
  .slum { background: var(--paper-hi); color: var(--sumi); border-radius:26px; padding:41px 45px; box-shadow:0 20px 46px rgba(40,30,10,.22); display:grid; gap:18px; border: 3px solid var(--sumi);}
  .slum .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--sumi); letter-spacing:.08em; }
  .slum .big { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:60px; }
  .slum .big .blank { font-size:60px; }
  .slum .big .blank b { color:#ff6b6b; }
  .slum .ds { font-size:30px; line-height:1.55; color: var(--sumi); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sl-safe">
    <div class="sl-left">
      <div class="sl-head" data-at="0">
        <span class="kicker"><span class="num">Ⅱ-4</span>　人種差別と都市の課題</span>
        <h1 class="headline" style="font-size:52px;">奴隷制がのこした<span class="em">課題</span></h1>
      </div>
      <div class="srow" data-at="1" data-anim="left"><span class="n">1</span><span class="t">17世紀、多くの黒人が<span class="blank" data-fill="1"><span class="bnum">⑭</span><b>アフリカ</b></span>から<b>奴隷</b>として連れてこられた。</span></div>
      <div class="srow" data-at="2" data-anim="left"><span class="n">2</span><span class="t"><b>1863年</b>に奴隷解放宣言が出されたが、その後も差別は根強く残った。</span></div>
      <div class="srow" data-at="3" data-anim="left"><span class="n">3</span><span class="t">黒人は全人口の約<b>13%</b>。経済的に貧しい人が多く、都心の安く古いアパートに住みついた。</span></div>
    </div>
    <div class="sl-right">
      <div class="figure sl-fig" data-at="0" data-anim="right"><img src="assets/toshin_apart.webp" alt="都心の古びた集合住宅が立ちならぶ通り"></div>
      <div class="slum" data-at="4" data-anim="pop">
        <span class="lab">KEY WORD</span>
        <span class="big"><span class="blank" data-fill="4"><b>スラム</b></span></span>
        <span class="ds">貧しい人々が都心の安く古いアパートに住みつき、生活環境や治安が悪くなった地区のこと。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
