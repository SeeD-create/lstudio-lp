<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>北アメリカ州 ── 世界の食料庫と最大の経済大国｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cover-safe { inset: 120px 150px 120px; grid-template-columns: 1fr 900px; align-content: center; gap: 60px; align-items: center; }
  .cover-txt { display: grid; gap: 34px; }
  .cover-kicker { font-size: 30px; letter-spacing:.3em; }
  .cover-title { font-size: 150px; line-height: 1.04; }
  .cover-title .goldem { color: var(--gold-deep); }
  .cover-lead { font-size: 36px; }
  .seal { display:inline-flex; align-items:center; gap:16px; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-deep); font-size:30px; letter-spacing:.08em; }
  .seal .ring { width:56px;height:56px;border-radius:50%;border:4px solid var(--sumi);display:inline-flex;align-items:center;justify-content:center;color:var(--sumi);font-size:28px; }
  .cover-right { display:grid; grid-template-rows: 460px 1fr; gap:26px; height:840px; }
  .cover-fig { border-radius:32px; border:3px solid var(--sumi); box-shadow:0 20px 50px rgba(40,30,10,.18); }
  .cover-cards { display:grid; grid-template-columns: repeat(2,1fr); gap:26px; }
  .ccard { border-radius:28px; border:3px solid var(--sumi); box-shadow:0 20px 46px rgba(40,30,10,.16); background:var(--paper-hi); padding:28px 34px; display:grid; align-content:center; gap:12px; position:relative; overflow:hidden; }
  .ccard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:16px; background:var(--sumi); }
  .ccard .big { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:66px; line-height:1; color:var(--imp); }
  .ccard .ct { font-size:30px; font-weight:900; color:var(--sumi); line-height:1.2; }
  .ccard .cb { font-size:24px; color:var(--sumi-soft); line-height:1.45; }
  .ccard .pl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:160px; color:var(--sumi); opacity:.07; position:absolute; right:16px; bottom:-36px; line-height:1; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cover-safe">
    <div class="cover-txt">
      <span class="kicker cover-kicker"><span class="num">第7章</span>　世界の諸地域</span>
      <h1 class="headline cover-title">北アメリカ<span class="goldem">州</span></h1>
      <p class="lead cover-lead"><span class="strong">「世界の食料庫」</span>と、世界一の<span class="strong">経済大国</span>。<br>アメリカ合衆国を中心に、1枚ずつカードで集めよう。</p>
      <span class="seal"><span class="ring">州</span>自然・民族・農業・工業</span>
    </div>
    <div class="cover-right">
      <div class="figure cover-fig" data-at="0" data-anim="right"><img src="assets/hero_kita_america.webp" alt="地平線まで続く大平原の小麦畑を、大型コンバインが列をなして刈り取る"></div>
      <div class="cover-cards">
        <div class="ccard"><span class="big">食料庫</span><span class="ct">世界の食料庫</span><span class="cb">大規模な農業で、大量の農作物を世界へ輸出する農業大国。</span><span class="pl">農</span></div>
        <div class="ccard"><span class="big">最先端</span><span class="ct">世界の経済・技術の中心</span><span class="cb">多国籍企業とシリコンバレー。世界の経済をリードする工業国。</span><span class="pl">工</span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(1);</script>
</body>
</html>
