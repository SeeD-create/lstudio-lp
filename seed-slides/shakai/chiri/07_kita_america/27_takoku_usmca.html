<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>多国籍企業・ドル・USMCA｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { inset: 90px 140px 88px; align-content:center; gap:30px; }
  .tk-head { display:grid; gap:12px; }
  .tk-row { display:grid; grid-template-columns: repeat(3,1fr); gap:30px; }
  .kcard { background:var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:34px 32px; box-shadow:0 16px 34px rgba(40,30,10,.11); display:grid; gap:14px; align-content:start; position:relative; overflow:hidden; }
  .kcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); }
  .kcard .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); letter-spacing:.06em; }
  .kcard .nm .blank { font-size:36px; } .kcard .nm .blank b { font-size:34px; }
  .kcard .bd { font-size:25px; color:var(--sumi-soft); line-height:1.5; }
  .tk-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:31px; line-height:1.5; }
  .tk-note .k { flex:none; font-weight:900; color:var(--gold-soft); letter-spacing:.08em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe tk-safe">
    <div class="tk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-4</span>　世界とつながる経済</span>
      <h1 class="headline" style="font-size:56px;">アメリカ経済は、<span class="em">世界とつながる</span></h1>
    </div>
    <div class="tk-row">
      <div class="kcard" data-at="1" data-anim="pop"><span class="lab">企業</span><span class="nm"><span class="blank" data-fill="1"><b>多国籍企業</b></span></span><span class="bd">コカコーラやマクドナルドのように、世界各国に進出して多くの利益をあげる企業。</span></div>
      <div class="kcard" data-at="2" data-anim="pop"><span class="lab">通貨</span><span class="nm"><span class="blank" data-fill="2"><b>ドル</b></span></span><span class="bd">アメリカの通貨。国際間の貿易の支払いに広く使われ、世界経済に大きな影響をあたえる。</span></div>
      <div class="kcard" data-at="3" data-anim="pop"><span class="lab">貿易協定</span><span class="nm"><span class="blank" data-fill="3"><b>USMCA</b></span></span><span class="bd">アメリカ・メキシコ・カナダの3か国による自由貿易協定。貿易圏をつくった。</span></div>
    </div>
    <div class="tk-note" data-at="4"><span class="k">まとめ</span><span>アメリカは<span class="imp">①の企業</span>と<span class="imp">②の通貨</span>を通じて、世界の経済を大きく動かしている。</span></div>
    <p class="lead" data-at="5" style="font-size:27px;">この協定は、以前のNAFTA（北米自由貿易協定）にかわる新しい3か国の取り決め。</p>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
