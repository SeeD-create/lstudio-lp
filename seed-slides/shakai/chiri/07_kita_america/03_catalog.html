<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>北アメリカ州カタログ ── 集める4枚｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ct-safe { align-content: center; gap: 40px; }
  .ct-head { display:grid; gap:12px; justify-items:center; text-align:center; }
  .ct-row { display:grid; grid-template-columns: repeat(4,1fr); gap: 30px; }
  .ct-card { position:relative; background: var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:36px 32px 30px; box-shadow:0 16px 36px rgba(40,30,10,.12); display:grid; gap:14px; overflow:hidden; align-content:start; }
  .ct-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); }
  .ct-card .rn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); letter-spacing:.06em; }
  .ct-card .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); line-height:1.1; }
  .ct-card .rb { font-size:24px; color:var(--sumi-soft); line-height:1.5; }
  .ct-card .rk { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .ct-card .rk span { font-size:20px; font-weight:800; color:var(--sumi); background:var(--paper-lo); border-radius:9px; padding:5px 13px; }
  .ct-plate { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:130px; color:var(--cat); opacity:.09; position:absolute; right:14px; bottom:-26px; line-height:1; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe ct-safe">
    <div class="ct-head" data-at="0">
      <span class="kicker"><span class="num">CATALOG</span>　集める4枚</span>
      <h1 class="headline" style="font-size:66px;">この4枚がそろえば、北アメリカは<span class="em">完成</span></h1>
    </div>
    <div class="ct-row">
      <div class="ct-card" data-cat="eq" data-at="1" data-anim="pop">
        <span class="rn">CARD Ⅰ</span><span class="rt">自然と気候</span>
        <span class="rb">東西の2つの山脈と、中央の大平原・大河・五大湖。</span>
        <span class="rk"><span>ロッキー</span><span>ミシシッピ川</span><span>五大湖</span><span>プレーリー</span></span>
        <span class="ct-plate">Ⅰ</span>
      </div>
      <div class="ct-card" data-cat="lib" data-at="2" data-anim="pop">
        <span class="rn">CARD Ⅱ</span><span class="rt">民族と歴史</span>
        <span class="rb">4つの人々が暮らす多民族国家。13州から西へ広がった。</span>
        <span class="rk"><span>多民族国家</span><span>ヒスパニック</span><span>13州</span><span>スラム</span></span>
        <span class="ct-plate">Ⅱ</span>
      </div>
      <div class="ct-card" data-cat="soc" data-at="3" data-anim="pop">
        <span class="rn">CARD Ⅲ</span><span class="rt">農業</span>
        <span class="rb">適地適作の企業的農業。世界の食料庫とよばれる大農業国。</span>
        <span class="rk"><span>適地適作</span><span>企業的農業</span><span>センターピボット</span></span>
        <span class="ct-plate">Ⅲ</span>
      </div>
      <div class="ct-card" data-cat="par" data-at="4" data-anim="pop">
        <span class="rn">CARD Ⅳ</span><span class="rt">工業と都市</span>
        <span class="rb">五大湖の古い工業から、南のサンベルト・先端技術へ。</span>
        <span class="rk"><span>シリコンバレー</span><span>サンベルト</span><span>多国籍企業</span><span>USMCA</span></span>
        <span class="ct-plate">Ⅳ</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
