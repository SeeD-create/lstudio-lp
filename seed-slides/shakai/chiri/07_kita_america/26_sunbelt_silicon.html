<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>サンベルトとシリコンバレー｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sb-safe { inset: 90px 140px 88px; align-content:center; gap:30px; }
  .sb-head { display:grid; gap:12px; }
  .sb-row { display:grid; grid-template-columns: 1fr 1fr; gap:36px; }
  .bcard { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; padding:30px 32px; box-shadow:0 16px 34px rgba(40,30,10,.11); display:grid; grid-template-columns: 1fr 290px; gap:26px; align-items:center; }
  .btx { display:grid; gap:14px; align-content:start; }
  .bfig { height:290px; border-radius:20px; border:2.5px solid var(--sumi); box-shadow:0 12px 28px rgba(40,30,10,.12); }
  .bcard .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--imp); letter-spacing:.06em; }
  .bcard .nm .blank { font-size:44px; } .bcard .nm .blank b { font-size:42px; }
  .bcard .bd { font-size:27px; color:var(--sumi-soft); line-height:1.5; }
  .bcard .bd .imp { color:var(--imp); font-weight:900; }
  .sb-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:31px; line-height:1.5; }
  .sb-note .k { flex:none; font-weight:900; color:var(--gold-soft); letter-spacing:.08em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe sb-safe">
    <div class="sb-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-3</span>　先端産業の南進</span>
      <h1 class="headline" style="font-size:56px;">産業の中心は、<span class="em">北から南</span>へ動いた</h1>
    </div>
    <div class="sb-row">
      <div class="bcard" data-at="1" data-anim="left">
        <div class="btx">
          <span class="lab">AREA</span>
          <span class="nm"><span class="blank" data-fill="1"><b>サンベルト</b></span></span>
          <span class="bd">およそ<span class="imp">北緯37度より南</span>の地域。温暖な気候で、近年、商工業が急速に発達した。</span>
        </div>
        <div class="figure bfig"><img src="assets/sunbelt.webp" alt="サンベルト ── 青空とヤシの木が続く、温暖な南部の新しい街"></div>
      </div>
      <div class="bcard" data-at="2" data-anim="right">
        <div class="btx">
          <span class="lab">SPOT</span>
          <span class="nm"><span class="blank" data-fill="2"><b>シリコンバレー</b></span></span>
          <span class="bd">サンフランシスコの郊外。<span class="imp">ICT産業</span>（情報通信技術）の企業が集中する、世界的な先端技術の中心地。</span>
        </div>
        <div class="figure bfig"><img src="assets/silicon_valley.webp" alt="シリコンバレー ── ガラス張りの研究施設と半導体の集まる先端技術の街"></div>
      </div>
    </div>
    <div class="sb-note" data-at="3"><span class="k">流れ</span><span>古い工業がおとろえた北東部にかわり、温暖な<span class="imp">南部の地域</span>で先端産業やICT産業が発展した。</span></div>
    <p class="lead" data-at="4" style="font-size:27px;">ヒューストンの<span class="imp">宇宙産業</span>、ロサンゼルスの<span class="imp">航空機・ICT</span>も、この南部の発展を代表する産業。</p>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
