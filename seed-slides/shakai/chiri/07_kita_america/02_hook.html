<div class="seed-stage"><div class="seed-slide" data-cat="eq">

      <h1 class="headline" style="font-size:70px;">北アメリカ州は、なぜ<span class="em">世界をリード</span>するの？</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">3国</div><div class="fttl">大きく3つの国</div><div class="fbody"><b>アメリカ合衆国</b>・<b>カナダ</b>・<b>メキシコ</b>を中心に、南に西インド諸島や中央アメリカの国々が広がる。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">食料庫</div><div class="fttl">世界の食料庫</div><div class="fbody">大規模な農業で、小麦・とうもろこし・大豆を大量生産。世界じゅうに農作物を輸出する。</div></div>
