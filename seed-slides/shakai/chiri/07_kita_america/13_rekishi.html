<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アメリカの歩み ── 13州から西へ｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rk-safe { inset: 96px 130px 92px; align-content: center; gap: 40px; }
  .rk-head { display:grid; gap:12px; }
  .rk-flow { display:grid; grid-template-columns: repeat(4, 1fr); gap: 0; align-items:stretch; }
  .step { position:relative; background:var(--paper-hi); border:3px solid var(--sumi); border-radius:20px; padding:28px 26px; margin-right:44px; box-shadow:0 12px 28px rgba(40,30,10,.10); display:grid; gap:12px; align-content:start; }
  .step:last-child { margin-right:0; }
  .step::after { content:"▶"; position:absolute; right:-38px; top:50%; transform:translateY(-50%); font-size:30px; color:var(--sumi-mute); }
  .step:last-child::after { content:""; }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--imp); }
  .step .st { font-size:26px; color:var(--sumi-soft); line-height:1.45; }
  .step .st .blank { font-size:29px; }
  .step .st .blank b { font-size:28px; }
  .rk-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:30px; line-height:1.5; }
  .rk-note .k { flex:none; font-weight:900; color:var(--gold-soft); letter-spacing:.08em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe rk-safe">
    <div class="rk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-3</span>　歴史</span>
      <h1 class="headline" style="font-size:58px;">東部のわずかな州から、<span class="em">西へ</span>広がった国</h1>
    </div>
    <div class="rk-flow">
      <div class="step" data-at="1" data-anim="pop"><span class="yr">17世紀</span><span class="st"><span class="blank" data-fill="1"><span class="bnum">⑧</span><b>イギリス</b></span>の植民地として開発が進んだ。</span></div>
      <div class="step" data-at="2" data-anim="pop"><span class="yr">1776年</span><span class="st">独立を宣言。東部の<span class="blank" data-fill="2"><span class="bnum">⑨</span><b>13</b></span>州で合衆国をつくった。</span></div>
      <div class="step" data-at="3" data-anim="pop"><span class="yr">19世紀</span><span class="st">先住民から土地を奪いながら、<span class="imp">西へ開拓</span>を進めた。</span></div>
      <div class="step" data-at="4" data-anim="pop"><span class="yr">現在</span><span class="st">白人・ヒスパニック・黒人などが暮らす<span class="imp">世界有数の大国</span>に。</span></div>
    </div>
    <div class="rk-note" data-at="5"><span class="k">ポイント</span><span>アメリカは移民の国。ヨーロッパからの移民が、東から西へと国土を広げていった。</span></div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
