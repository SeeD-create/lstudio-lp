<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大農業の技術 ── センターピボット・フィードロット｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tc-safe { inset: 90px 130px 88px; align-content:center; gap:32px; }
  .tc-head { display:grid; gap:12px; }
  .tc-row { display:grid; grid-template-columns: repeat(3,1fr); gap:30px; }
  .tcard { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:24px; padding:30px 30px; box-shadow:0 16px 34px rgba(40,30,10,.11); display:grid; gap:14px; align-content:start; }
  .tcard .tfig { height:300px; border-radius:18px; border:2.5px solid var(--cat); box-shadow:0 12px 28px rgba(40,30,10,.12); }
  .tcard .no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--imp); }
  .tcard .tt .blank { font-size:33px; } .tcard .tt .blank b { font-size:32px; }
  .tcard .bd { font-size:24px; color:var(--sumi-soft); line-height:1.5; }
  .tc-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 40px; font-size:30px; line-height:1.5; }
  .tc-note .k { flex:none; font-weight:900; color:var(--gold-soft); letter-spacing:.08em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe tc-safe">
    <div class="tc-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-2</span>　大農業の技術</span>
      <h1 class="headline" style="font-size:56px;">大地をうるおし、家畜を太らせる<span class="em">技術</span></h1>
    </div>
    <div class="tc-row">
      <div class="tcard" data-at="1" data-anim="pop">
        <div class="figure tfig"><img src="assets/center_pivot.webp" alt="センターピボット ── 空から見た円形の農地がならぶ乾燥地"></div>
        <span class="no">④</span><span class="tt"><span class="blank" data-fill="1"><b>センターピボット</b></span></span>
        <span class="bd">地下水をくみ上げ、自走式の散水器で円形に散水するかんがい。乾燥地でも農業ができる。</span>
      </div>
      <div class="tcard" data-at="2" data-anim="pop">
        <div class="figure tfig"><img src="assets/feedlot.webp" alt="フィードロット ── 柵で区切られた肥育場にひしめく肉牛"></div>
        <span class="no">⑤</span><span class="tt"><span class="blank" data-fill="2"><b>フィードロット</b></span></span>
        <span class="bd">家畜を囲い込んで運動量を減らし、飼料をあたえて太らせる肥育施設。効率よく肉牛を育てる。</span>
      </div>
      <div class="tcard" data-at="3" data-anim="pop">
        <div class="figure tfig"><img src="assets/biotech.webp" alt="バイオテクノロジー ── 農業研究所で培養容器に育つ作物の芽"></div>
        <span class="no">⑥</span><span class="tt"><span class="blank" data-fill="3"><b>バイオテクノロジー</b></span></span>
        <span class="bd">新種の農作物の開発や、食品の加工技術に利用される先端技術。生産をさらに高める。</span>
      </div>
    </div>
    <div class="tc-note" data-at="4"><span class="k">つながり</span><span>広い土地×大型機械に、これらの<span class="imp">先端技術</span>が加わって、アメリカ農業はさらに大規模になった。</span></div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
