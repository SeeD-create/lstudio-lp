<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>北東部・五大湖の都市｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ci-safe { inset: 84px 140px 84px; align-content:center; gap:24px; }
  .ci-head { display:grid; gap:10px; }
  .ci-body { display:grid; grid-template-columns: 1fr 500px; gap:44px; align-items:center; }
  .ci-figs { display:grid; grid-template-rows: 1fr 1fr; gap:20px; height:640px; }
  .ci-fig { border-radius:24px; border:3px solid var(--cat); box-shadow:0 16px 36px rgba(40,30,10,.14); }
  .ci-grid { display:grid; grid-template-columns: 1fr; gap:13px; }
  .ci { display:grid; grid-template-columns: 54px 1fr; align-items:center; gap:18px; background:var(--paper-hi); border:2.5px solid var(--hair); border-radius:14px; padding:11px 22px; box-shadow:0 8px 20px rgba(40,30,10,.06); }
  .ci .ic { width:54px; height:54px; border-radius:50%; background:var(--sumi); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; }
  .ci .tx { font-size:25px; color:var(--sumi-soft); line-height:1.35; }
  .ci .tx .q { color:var(--sumi); font-weight:800; }
  .ci .blank { font-size:31px; } .ci .blank b { font-size:30px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe ci-safe">
    <div class="ci-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-1</span>　北東部・五大湖の都市</span>
      <h1 class="headline" style="font-size:52px;">歴史の古い<span class="em">工業と経済</span>のまち</h1>
    </div>
    <div class="ci-body">
    <div class="ci-grid">
      <div class="ci" data-at="1" data-anim="left"><span class="ic">①</span><span class="tx"><span class="q">歴史が古く、金融・医療が盛ん</span><br><span class="blank" data-fill="1"><b>ボストン</b></span></span></div>
      <div class="ci" data-at="2" data-anim="left"><span class="ic">②</span><span class="tx"><span class="q">最大の都市・経済と文化の中心（ウォール街・国連本部）</span><br><span class="blank" data-fill="2"><b>ニューヨーク</b></span></span></div>
      <div class="ci" data-at="3" data-anim="left"><span class="ic">③</span><span class="tx"><span class="q">アメリカ合衆国の首都</span><br><span class="blank" data-fill="3"><b>ワシントンD.C.</b></span></span></div>
      <div class="ci" data-at="4" data-anim="left"><span class="ic">④</span><span class="tx"><span class="q">鉄鋼業が盛ん（アパラチア炭田）</span><br><span class="blank" data-fill="4"><b>ピッツバーグ</b></span></span></div>
      <div class="ci" data-at="5" data-anim="left"><span class="ic">⑤</span><span class="tx"><span class="q">自動車産業の中心（大量生産）</span><br><span class="blank" data-fill="5"><b>デトロイト</b></span></span></div>
      <div class="ci" data-at="6" data-anim="left"><span class="ic">⑥</span><span class="tx"><span class="q">五大湖（ミシガン湖）畔・食品産業が盛ん</span><br><span class="blank" data-fill="6"><b>シカゴ</b></span></span></div>
    </div>
    <div class="ci-figs">
      <div class="figure ci-fig" data-at="0" data-anim="right"><img src="assets/matenro.webp" alt="大西洋岸の大都市 ── 川ぞいにそびえる摩天楼の群れ"></div>
      <div class="figure ci-fig" data-at="0" data-anim="right"><img src="assets/jidosha_kojo.webp" alt="自動車工場 ── ベルトコンベアで車体が流れる大量生産のライン"></div>
    </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
