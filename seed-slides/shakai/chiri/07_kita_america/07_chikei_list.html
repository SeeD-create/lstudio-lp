<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地形カタログ ── 東西の山脈と中央の大平原｜中1地理 第7章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gl-safe { inset: 84px 130px 84px; align-content: center; gap: 26px; }
  .gl-head { display:grid; gap:10px; }
  .gl-body { display:grid; grid-template-columns: 1fr 480px; gap: 44px; align-items:center; }
  .gl-fig { height: 500px; border-radius: 26px; border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); }
  .gl-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; }
  .gr { display:grid; grid-template-columns: 52px 1fr; align-items:center; gap:18px; background:var(--paper-hi); border:2.5px solid var(--hair); border-radius:14px; padding:15px 22px; box-shadow:0 8px 20px rgba(40,30,10,.06); }
  .gr .ic { width:52px; height:52px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:#fff; background:var(--sumi); }
  .gr .ic.mt { background:#7a5a2a; } .gr .ic.rv { background:#2f6fa8; } .gr .ic.pl { background:#5a7a3a; } .gr .ic.is { background:#3a7a8a; }
  .gr .tx { font-size:26px; color:var(--sumi-soft); line-height:1.35; }
  .gr .tx .q { color:var(--sumi); font-weight:800; }
  .gr .blank { font-size:30px; }
  .gr .blank b { font-size:29px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe gl-safe">
    <div class="gl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-2</span>　地形カタログ</span>
      <h1 class="headline" style="font-size:52px;">東西に<span class="em">2つの山脈</span>、中央に<span class="em">大平原</span>と大河</h1>
    </div>
    <div class="gl-body">
    <div class="gl-grid">
      <div class="gr" data-at="1" data-anim="left"><span class="ic mt">①</span><span class="tx"><span class="q">西部・4000m級のけわしい山脈</span><br><span class="blank" data-fill="1"><b>ロッキー山脈</b></span></span></div>
      <div class="gr" data-at="2" data-anim="left"><span class="ic mt">②</span><span class="tx"><span class="q">東部・なだらか（付近に炭田）</span><br><span class="blank" data-fill="2"><b>アパラチア山脈</b></span></span></div>
      <div class="gr" data-at="3" data-anim="left"><span class="ic rv">③</span><span class="tx"><span class="q">中央部を南北に流れる最大の川</span><br><span class="blank" data-fill="3"><b>ミシシッピ川</b></span></span></div>
      <div class="gr" data-at="4" data-anim="left"><span class="ic rv">④</span><span class="tx"><span class="q">アメリカとカナダの国境の湖</span><br><span class="blank" data-fill="4"><b>五大湖</b></span></span></div>
      <div class="gr" data-at="5" data-anim="left"><span class="ic pl">⑤</span><span class="tx"><span class="q">ロッキーの東・肉牛の放牧地帯</span><br><span class="blank" data-fill="5"><b>グレートプレーンズ</b></span></span></div>
      <div class="gr" data-at="6" data-anim="left"><span class="ic pl">⑥</span><span class="tx"><span class="q">その東・広大な小麦地帯</span><br><span class="blank" data-fill="6"><b>プレーリー</b></span></span></div>
      <div class="gr" data-at="7" data-anim="left"><span class="ic pl">⑦</span><span class="tx"><span class="q">③の大河が流れる広大な平原</span><br><span class="blank" data-fill="7"><b>中央平原</b></span></span></div>
      <div class="gr" data-at="8" data-anim="left"><span class="ic is">⑧</span><span class="tx"><span class="q">南に広がる島々</span><br><span class="blank" data-fill="8"><b>西インド諸島</b></span></span></div>
    </div>
    <div class="figure gl-fig" data-at="0" data-anim="right"><img src="assets/rocky_plains.webp" alt="ロッキー山脈のけわしい峰と、その東に広がる大平原"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 北アメリカ州</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(9);</script>
</body>
</html>
