<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>イスラム教 ── 豚肉を食べず1日5回礼拝｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rl-safe { inset: 74px 120px 74px; grid-template-columns: 370px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .rl-fig { height: 480px; border-radius: 24px; border: 3px solid #2E9E6B; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .rl-side { background:#2E9E6B; color:#fff; border-radius:24px; padding:42px 32px; display:grid; gap:16px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .rl-side .sym { font-size:110px; line-height:1; }
  .rl-side .name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:54px; }
  .rl-side .num { font-size:24px; font-weight:700; opacity:.9; letter-spacing:.08em; }
  .rl-list { display:grid; gap:16px; }
  .rlc { position:relative; background:var(--paper-hi); border:3px solid #2E9E6B; border-radius:18px; padding:22px 32px; box-shadow:0 10px 24px rgba(40,30,10,.10); }
  .rlc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:11px; background:#2E9E6B; border-radius:15px 0 0 15px; }
  .rlc .cn { display:flex; align-items:baseline; gap:16px; }
  .rlc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:#1e6e49; }
  .rlc .t { font-size:29px; color:var(--sumi-soft); line-height:1.5; margin-top:8px; }
  .rlc .t b { color:var(--imp); font-weight:900; }
  .rlc .t .r { color:#1e6e49; font-weight:800; }
  .blank { font-size:38px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe rl-safe">
    <div class="rl-side" data-at="0" data-anim="left">
      <div class="sym">☪</div>
      <div class="name">モスクと礼拝</div>
      <div class="num">三大宗教｜聖典はコーラン</div>
    </div>
    <div class="rl-list">
      <div class="rlc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">宗教②</span>
          <span class="blank" data-fill="2"><span class="bnum">②</span><b>イスラム教</b></span></div>
        <div class="t"><span class="r">分布</span>　<b>西アジアから北アフリカ</b>にかけて信仰されている。</div>
      </div>
      <div class="rlc" data-at="3" data-anim="pop">
        <div class="t"><span class="r">戒律・食</span>　<b>豚肉を食べない</b>などの戒律があり、酒も禁じられている。</div>
      </div>
      <div class="rlc" data-at="4" data-anim="pop">
        <div class="t"><span class="r">礼拝</span>　1日に<b>5回、メッカの方角</b>に向かって礼拝する。</div>
      </div>
      <div class="rlc" data-at="5" data-anim="pop">
        <div class="t"><span class="r">くらし</span>　女性は肌をかくす衣服を身につけ、モスクに集まって祈る。</div>
      </div>
    </div>
    <div class="figure rl-fig" data-at="0" data-anim="right"><img src="assets/islam_mosque.webp" alt="モスク（イスラム教の礼拝の場）"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
