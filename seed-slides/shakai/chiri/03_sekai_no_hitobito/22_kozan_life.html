<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>高山に暮らす人々 ── アンデスとインカ帝国｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lf-safe { inset: 74px 120px 74px; grid-template-columns: 340px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .lf-fig { height: 470px; border-radius: 24px; border: 3px solid #9B6B4A; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .lf-side { background:#9B6B4A; color:#fff; border-radius:24px; padding:38px 30px; display:grid; gap:14px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .lf-side .zicon { font-size:88px; }
  .lf-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; }
  .lf-side .zsub { font-size:25px; font-weight:700; line-height:1.4; opacity:.96; }
  .lf-list { display:grid; gap:16px; }
  .lfc { position:relative; background:var(--paper-hi); border:3px solid #9B6B4A; border-radius:18px; padding:22px 32px; box-shadow:0 10px 24px rgba(40,30,10,.10); }
  .lfc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:11px; background:#9B6B4A; border-radius:15px 0 0 15px; }
  .lfc .t { font-size:29px; color:var(--sumi-soft); line-height:1.5; }
  .lfc .t b { color:var(--imp); font-weight:900; }
  .lfc .t .r { color:#6e4a30; font-weight:800; }
  .lf-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:15px; padding:20px 30px; font-size:27px; line-height:1.5; }
  .lf-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .lf-note b { color:#ffcf9a; }
  .blank { font-size:36px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe lf-safe">
    <div class="lf-side" data-at="0" data-anim="left">
      <div class="zicon">🦙</div>
      <div class="zone">高山</div>
      <div class="zsub">南アメリカのアンデス山脈。<br>標高が高くすずしい高地。</div>
    </div>
    <div class="lf-list">
      <div class="lfc" data-at="1" data-anim="pop">
        <div class="t"><span class="r">文明</span>　アンデス山脈には先住民がいて、
          <span class="blank" data-fill="2"><span class="bnum">⑨</span><b>インカ</b></span>
          帝国などの高度な文明を築いたが、<b>スペイン人</b>にほろぼされた。</div>
      </div>
      <div class="lf-note" data-at="3" data-anim="fade">
        <span class="k">農業</span>
        <span><b>ジャガイモ</b>やトウモロコシを栽培し、<b>リャマ</b>やアルパカを放牧して暮らす。</span>
      </div>
      <div class="lf-note" data-at="4" data-anim="fade" style="background:#6e4a30;">
        <span class="k">衣服</span>
        <span>気温差が大きいので、リャマやアルパカの毛でつくった<b>ポンチョ</b>を着る。</span>
      </div>
    </div>
    <div class="figure lf-fig" data-at="0" data-anim="right"><img src="assets/kozan_andes.webp" alt="アンデスの段々畑とリャマ"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
