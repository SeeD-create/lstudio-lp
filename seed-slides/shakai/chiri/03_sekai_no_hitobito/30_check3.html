<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 三大宗教とヒンドゥー教｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content:center; gap: 34px; justify-items:center; }
  .chk-head { justify-self:center; }
  .qwrap { width: 1500px; display:grid; gap: 20px; }
  .qrow { display:grid; grid-template-columns: 1fr 360px; align-items:center; gap: 30px; background: var(--paper-hi); color: var(--sumi); border-radius:20px; padding:21px 37px; box-shadow:0 16px 34px rgba(40,30,10,.18); border: 3px solid var(--sumi);}
  .qrow .qq { font-size:31px; line-height:1.45; font-weight:700; }
  .qrow .qq .u { color: var(--sumi); }
  .qrow .qa { justify-self:end; }
  .qrow .qa .blank { font-size:40px; }
  .qrow .qa .blank b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe chk-safe">
    <span class="cat-badge chk-head" data-at="0"><span class="dot"></span>ミニ確認 ── 世界の宗教</span>
    <div class="qwrap">
      <div class="qrow" data-at="0" data-anim="pop">
        <div class="qq">南北アメリカ・ヨーロッパで信仰され、<span class="u">信者が世界最多</span>の宗教は？</div>
        <div class="qa"><span class="blank" data-fill="1"><b>キリスト教</b></span></div>
      </div>
      <div class="qrow" data-at="1" data-anim="pop">
        <div class="qq"><span class="u">豚肉を食べず</span>、1日5回メッカに向かって礼拝する宗教は？</div>
        <div class="qa"><span class="blank" data-fill="2"><b>イスラム教</b></span></div>
      </div>
      <div class="qrow" data-at="2" data-anim="pop">
        <div class="qq">タイの男子が一生に1回<span class="u">出家</span>する、東・東南アジアの宗教は？</div>
        <div class="qa"><span class="blank" data-fill="3"><b>仏教</b></span></div>
      </div>
      <div class="qrow" data-at="3" data-anim="pop">
        <div class="qq">インドで信仰され、<span class="u">牛を神聖</span>とし、カースト制が残る宗教は？</div>
        <div class="qa"><span class="blank" data-fill="4"><b>ヒンドゥー教</b></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
