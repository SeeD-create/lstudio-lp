<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>温帯に暮らす人々 ── 生活しやすい地域｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lf-safe { inset: 78px 120px 78px; grid-template-columns: 340px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .lf-fig { height: 470px; border-radius: 24px; border: 3px solid #E67E22; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .lf-side { background:#E67E22; color:#fff; border-radius:24px; padding:40px 32px; display:grid; gap:16px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .lf-side .zicon { font-size:96px; }
  .lf-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; }
  .lf-side .zsub { font-size:25px; font-weight:700; line-height:1.4; opacity:.96; }
  .lf-list { display:grid; gap:20px; }
  .lfc { position:relative; background:var(--paper-hi); border:3px solid #E67E22; border-radius:20px; padding:26px 34px; box-shadow:0 12px 26px rgba(40,30,10,.10); }
  .lfc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#E67E22; border-radius:17px 0 0 17px; }
  .lfc .t { font-size:31px; color:var(--sumi-soft); line-height:1.5; }
  .lfc .t b { color:var(--imp); font-weight:900; }
  .lfc .t .r { color:#a85410; font-weight:800; }
  .lf-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:28px; line-height:1.5; }
  .lf-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .lf-note b { color:#ffcf9a; }
  .blank { font-size:38px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe lf-safe">
    <div class="lf-side" data-at="0" data-anim="left">
      <div class="zicon">🏡</div>
      <div class="zone">温帯</div>
      <div class="zsub">日本やヨーロッパ。<br>樹木や作物が育つ、<br>人々が生活しやすい地域。</div>
    </div>
    <div class="lf-list">
      <div class="lfc" data-at="1" data-anim="pop">
        <div class="t"><span class="r">日本型</span>　同じ温帯でも、日本のように降水量の
          <span class="blank" data-fill="2"><span class="bnum">④</span><b>多い</b></span>
          地域は、稲作がさかんで四季がはっきりしている。</div>
      </div>
      <div class="lf-note" data-at="3" data-anim="fade">
        <span class="k">地中海型</span>
        <span>地中海沿岸は<b>夏は乾燥し、冬に雨がふる</b>。乾燥に強いオリーブやぶどうを栽培する。</span>
      </div>
    </div>
    <div class="figure lf-fig" data-at="0" data-anim="right"><img src="assets/ontai_chichukai.webp" alt="地中海沿岸のオリーブ畑と白い家"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
