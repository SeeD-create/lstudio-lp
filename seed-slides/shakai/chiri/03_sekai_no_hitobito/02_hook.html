<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .hk-row { display: flex; gap: 40px; }
  .hk-card { width: 380px; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 34px 30px; display:grid; gap:16px; justify-items:center; }

<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe hk-safe">
    <p class="hk-q" data-at="0">きみが暑い砂漠に生まれたら？<br><span class="em">寒い北極</span>に生まれたら？</p>
    <div class="hk-row">
      <div class="hk-card" data-at="1" data-anim="pop"><div class="ic">🏜️</div><div class="t">乾燥した土地</div><div class="d">水が少ない。<br>遊牧でくらす。</div></div>
      <div class="hk-card" data-at="1" data-anim="pop"><div class="ic">🌴</div><div class="t">暑い島</div><div class="d">いもを育て、<br>草の家に住む。</div></div>
      <div class="hk-card" data-at="1" data-anim="pop"><div class="ic">🧊</div><div class="t">こおる大地</div><div class="d">雪の家をつくり、<br>生肉を食べる。</div></div>
    </div>
    <p class="hk-note" data-at="2">世界の暮らしは、その土地の<b>気候</b>で大きく変わる。<br>この章では「気候 → 暮らし → 宗教」を1枚ずつ集めていこう。</p>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
