<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>乾燥帯に暮らす人々 ── ゲル・サヘル・砂漠化｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lf-safe { inset: 74px 120px 74px; grid-template-columns: 340px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .lf-fig { height: 470px; border-radius: 24px; border: 3px solid #D9A431; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .lf-side { background:#D9A431; color:#3a2b06; border-radius:24px; padding:38px 30px; display:grid; gap:14px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .lf-side .zicon { font-size:88px; }
  .lf-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:50px; }
  .lf-side .zsub { font-size:25px; font-weight:700; line-height:1.4; }
  .lf-list { display:grid; gap:16px; }
  .lfc { position:relative; background:var(--paper-hi); border:3px solid #D9A431; border-radius:18px; padding:22px 32px; box-shadow:0 10px 24px rgba(40,30,10,.10); }
  .lfc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:11px; background:#D9A431; border-radius:15px 0 0 15px; }
  .lfc .t { font-size:29px; color:var(--sumi-soft); line-height:1.5; }
  .lfc .t b { color:var(--imp); font-weight:900; }
  .lfc .t .r { color:#8a6a12; font-weight:800; }
  .blank { font-size:36px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe lf-safe">
    <div class="lf-side" data-at="0" data-anim="left">
      <div class="zicon">🐫</div>
      <div class="zone">乾燥帯</div>
      <div class="zsub">モンゴルやサハラ砂漠。<br>水が少なく、家畜とともに<br>移動して暮らす人々も。</div>
    </div>
    <div class="lf-list">
      <div class="lfc" data-at="1" data-anim="pop">
        <div class="t"><span class="r">遊牧</span>　モンゴルでは遊牧民が
          <span class="blank" data-fill="2"><span class="bnum">⑤</span><b>ゲル</b></span>
          とよばれる組み立て式のテントでくらしている。</div>
      </div>
      <div class="lfc" data-at="3" data-anim="pop">
        <div class="t"><span class="r">サハラ南</span>　アフリカのサハラ砂漠の南の
          <span class="blank" data-fill="4"><span class="bnum">⑥</span><b>サヘル</b></span>
          では、干ばつと人口・家畜の増加が原因で
          <span class="blank" data-fill="5"><span class="bnum">⑦</span><b>砂漠化</b></span>
          が進行している。</div>
      </div>
    </div>
    <div class="figure lf-fig" data-at="0" data-anim="right"><img src="assets/kanso_gel.webp" alt="モンゴルの移動式住居ゲル"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
