<!DOCTYPE html>

<head>

<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cover-safe { inset: 120px 150px 120px; grid-template-columns: 1fr 760px; align-content: center; gap: 80px; align-items: center; }

  .cover-fig { height: 720px; border-radius: 32px; background:#EAF2F6; display:flex; align-items:center; justify-content:center; }
  .cover-fig svg { width: 96%; height: auto; }
  .seal { display:inline-flex; align-items:center; gap:16px; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-deep); font-size:28px; letter-spacing:.1em; }
  .seal .ring { width:56px;height:56px;border-radius:50%;border:4px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:28px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">

  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
