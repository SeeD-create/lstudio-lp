<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>温帯 ── 地中海性・温暖湿潤・西岸海洋性｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cl-safe { inset: 74px 120px 72px; grid-template-columns: 400px 1fr; align-content:center; gap: 50px; align-items:center; }
  .cl-side { background:#E67E22; color:#fff; border-radius:24px; padding:40px 34px; display:grid; gap:18px; box-shadow:0 16px 34px rgba(40,30,10,.18); }
  .cl-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:84px; line-height:1; }
  .cl-side .zsub { font-size:27px; font-weight:700; opacity:.96; line-height:1.4; }
  .cl-side .zicon { font-size:70px; }
  .cl-list { display:grid; gap:18px; }
  .clc { position:relative; background:var(--paper-hi); border:3px solid #E67E22; border-radius:18px; padding:22px 30px; box-shadow:0 10px 24px rgba(40,30,10,.10); }
  .clc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:11px; background:#E67E22; border-radius:15px 0 0 15px; }
  .clc .cn { display:flex; align-items:baseline; gap:14px; }
  .clc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:#a85410; }
  .clc .desc { font-size:26px; color:var(--sumi-soft); line-height:1.45; margin-top:8px; }
  .clc .desc b { color:var(--imp); font-weight:900; }
  .clc .desc .r { color:#a85410; font-weight:800; }
  .blank { font-size:36px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cl-safe">
    <div class="cl-side" data-at="0" data-anim="left">
      <div class="zicon">🍂</div>
      <div class="zone">温帯</div>
      <div class="zsub">中緯度。四季がはっきりし、樹木や作物が育つ、人々が生活しやすい地域。</div>
    </div>
    <div class="cl-list">
      <div class="clc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">気候区⑤</span>
          <span class="blank" data-fill="2"><span class="bnum">⑤</span><b>地中海性気候</b></span></div>
        <div class="desc"><b>夏に雨が少なく乾燥</b>し、冬に雨が多い。<span class="r">例：地中海沿岸</span></div>
      </div>
      <div class="clc" data-at="3" data-anim="pop">
        <div class="cn"><span class="lab">気候区⑥</span>
          <span class="blank" data-fill="4"><span class="bnum">⑥</span><b>温暖湿潤気候</b></span></div>
        <div class="desc">降水量が比較的多く、<b>四季の変化がはっきり</b>している。<span class="r">例：日本</span></div>
      </div>
      <div class="clc" data-at="5" data-anim="pop">
        <div class="cn"><span class="lab">気候区⑦</span>
          <span class="blank" data-fill="6"><span class="bnum">⑦</span><b>西岸海洋性気候</b></span></div>
        <div class="desc"><b>暖流と偏西風</b>の影響で、高緯度のわりに過ごしやすい。<span class="r">例：西ヨーロッパ</span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
