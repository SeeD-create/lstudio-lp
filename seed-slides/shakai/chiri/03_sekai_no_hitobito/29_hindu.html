<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ヒンドゥー教 ── インド・牛が神聖・カースト制｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rl-safe { inset: 74px 120px 74px; grid-template-columns: 370px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .rl-fig { height: 480px; border-radius: 24px; border: 3px solid #C0503A; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .rl-side { background:#C0503A; color:#fff; border-radius:24px; padding:42px 32px; display:grid; gap:16px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .rl-side .sym { font-size:110px; line-height:1; }
  .rl-side .name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; }
  .rl-side .num { font-size:24px; font-weight:700; opacity:.9; letter-spacing:.06em; }
  .rl-list { display:grid; gap:16px; }
  .rlc { position:relative; background:var(--paper-hi); border:3px solid #C0503A; border-radius:18px; padding:22px 32px; box-shadow:0 10px 24px rgba(40,30,10,.10); }
  .rlc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:11px; background:#C0503A; border-radius:15px 0 0 15px; }
  .rlc .cn { display:flex; align-items:baseline; gap:16px; }
  .rlc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:#933524; }
  .rlc .t { font-size:29px; color:var(--sumi-soft); line-height:1.5; margin-top:8px; }
  .rlc .t b { color:var(--imp); font-weight:900; }
  .rlc .t .r { color:#933524; font-weight:800; }
  .blank { font-size:38px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe rl-safe">
    <div class="rl-side" data-at="0" data-anim="left">
      <div class="sym">🕉</div>
      <div class="name">インドの民族宗教</div>
      <div class="num">おもにインドの民族宗教</div>
    </div>
    <div class="rl-list">
      <div class="rlc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">宗教④</span>
          <span class="blank" data-fill="2"><span class="bnum">④</span><b>ヒンドゥー教</b></span></div>
        <div class="t"><span class="r">分布</span>　おもに<b>インド</b>で信仰されている。三大宗教にはふくまれない。</div>
      </div>
      <div class="rlc" data-at="3" data-anim="pop">
        <div class="t"><span class="r">戒律・食</span>　<b>牛が神聖な動物</b>とされ、<b>牛肉を食べない</b>。</div>
      </div>
      <div class="rlc" data-at="4" data-anim="pop">
        <div class="t"><span class="r">社会</span>　<b>カースト制</b>という身分制度が今も残っている。</div>
      </div>
      <div class="rlc" data-at="5" data-anim="pop">
        <div class="t"><span class="r">くらし</span>　ガンジス川で身を清める沐浴（もくよく）の習慣がある。</div>
      </div>
    </div>
    <div class="figure rl-fig" data-at="0" data-anim="right"><img src="assets/hindu_ganges.webp" alt="ガンジス川の沐浴場とヒンドゥー寺院"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
