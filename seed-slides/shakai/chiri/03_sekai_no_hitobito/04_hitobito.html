<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世界の人々 ── 人種・民族・言語のちがい｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hb-safe { inset: 96px 140px 90px; align-content: center; gap: 40px; }
  .hb-head { display:grid; gap:14px; }
  .hb-row { display:grid; grid-template-columns: repeat(3,1fr); gap: 32px; }
  .hb-card { background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--sumi); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 34px 34px; display:grid; gap:16px; align-content:start; min-height: 330px; }
  .hb-t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color: var(--sumi); }
  .hb-t .imp { color: var(--imp); }
  .hb-d { font-size: 29px; color: var(--sumi-soft); line-height: 1.55; }
  .hb-d b { color: var(--imp); font-weight: 900; }
  .hb-chip { display:inline-flex; gap:10px; flex-wrap:wrap; }
  .hb-chip span { background: var(--paper-lo); color: var(--sumi); font-weight:800; font-size:24px; padding:7px 16px; border-radius:999px; }
  .hb-note { display:flex; align-items:center; gap:22px; background: var(--sumi); color: var(--paper-hi); border-radius:18px; padding:24px 38px; font-size:30px; line-height:1.5; }
  .hb-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--gold-soft); white-space:nowrap; }
  .hb-note b { color:#ff9a9d; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe hb-safe">
    <div class="hb-head" data-at="0">
      <span class="kicker"><span class="num">導入</span>　人々のちがい</span>
      <h1 class="headline" style="font-size:60px;">世界の人々は、<span class="em">人種・民族・言語</span>でちがう</h1>
    </div>
    <div class="hb-row">
      <div class="hb-card" data-at="1" data-anim="pop">
        <div class="hb-t"><span class="imp">人種</span></div>
        <div class="hb-d">肌や髪など<b>体の特ちょう</b>による分け方。もともとどこにも優劣はない。</div>
        <div class="hb-chip"><span>アジア系</span><span>ヨーロッパ系</span><span>アフリカ系</span></div>
      </div>
      <div class="hb-card" data-at="2" data-anim="pop">
        <div class="hb-t"><span class="imp">民族</span></div>
        <div class="hb-d">同じ<b>言語・宗教・生活習慣</b>を持つ人々のまとまり。国の中に複数あることも多い。</div>
        <div class="hb-chip"><span>言語</span><span>宗教</span><span>くらしの文化</span></div>
      </div>
      <div class="hb-card" data-at="3" data-anim="pop">
        <div class="hb-t"><span class="imp">言語</span></div>
        <div class="hb-d">世界には数千の言語。<b>英語・中国語・スペイン語</b>などは多くの国で使われる。</div>
        <div class="hb-chip"><span>公用語</span><span>母語</span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
