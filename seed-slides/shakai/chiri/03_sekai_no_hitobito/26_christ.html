<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>キリスト教 ── 世界最多の信者｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rl-safe { inset: 78px 120px 78px; grid-template-columns: 370px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .rl-fig { height: 480px; border-radius: 24px; border: 3px solid #4A6FB5; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .rl-side { background:#4A6FB5; color:#fff; border-radius:24px; padding:44px 34px; display:grid; gap:18px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .rl-side .sym { font-size:120px; line-height:1; }
  .rl-side .name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; }
  .rl-side .num { font-size:24px; font-weight:700; opacity:.9; letter-spacing:.1em; }
  .rl-list { display:grid; gap:20px; }
  .rlc { position:relative; background:var(--paper-hi); border:3px solid #4A6FB5; border-radius:20px; padding:26px 34px; box-shadow:0 12px 26px rgba(40,30,10,.10); }
  .rlc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#4A6FB5; border-radius:17px 0 0 17px; }
  .rlc .cn { display:flex; align-items:baseline; gap:16px; }
  .rlc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:#33518a; }
  .rlc .t { font-size:30px; color:var(--sumi-soft); line-height:1.5; margin-top:10px; }
  .rlc .t b { color:var(--imp); font-weight:900; }
  .rlc .t .r { color:#33518a; font-weight:800; }
  .blank { font-size:40px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe rl-safe">
    <div class="rl-side" data-at="0" data-anim="left">
      <div class="sym">✝</div>
      <div class="name">教会と聖書</div>
      <div class="num">三大宗教｜信者が世界最多</div>
    </div>
    <div class="rl-list">
      <div class="rlc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">宗教①</span>
          <span class="blank" data-fill="2"><span class="bnum">①</span><b>キリスト教</b></span></div>
        <div class="t"><span class="r">分布</span>　おもに<b>南北アメリカ・ヨーロッパ</b>などで信仰されている。</div>
      </div>
      <div class="rlc" data-at="3" data-anim="pop">
        <div class="t"><span class="r">宗派</span>　<b>プロテスタント</b>と<b>カトリック</b>の区別がある。聖書を教えとし、日曜日に教会で礼拝する。</div>
      </div>
      <div class="rlc" data-at="4" data-anim="pop">
        <div class="t"><span class="r">くらし</span>　クリスマスや日曜礼拝など、生活の中に行事が根づいている。</div>
      </div>
    </div>
    <div class="figure rl-fig" data-at="0" data-anim="right"><img src="assets/christ_church.webp" alt="ヨーロッパの教会"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
