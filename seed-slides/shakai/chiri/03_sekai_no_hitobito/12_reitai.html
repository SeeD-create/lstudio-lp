<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>冷帯（亜寒帯）── タイガの針葉樹林｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cl-safe { inset: 84px 130px 82px; grid-template-columns: 360px 1fr 420px; align-content:center; gap: 44px; align-items:center; }
  .cl-fig { height: 470px; border-radius: 24px; border: 3px solid #4E82AE; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .cl-side { background:#4E82AE; color:#fff; border-radius:24px; padding:44px 36px; display:grid; gap:22px; box-shadow:0 16px 34px rgba(40,30,10,.18); }
  .cl-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; line-height:1.05; }
  .cl-side .zsub { font-size:27px; font-weight:700; opacity:.96; line-height:1.4; }
  .cl-side .zicon { font-size:76px; }
  .cl-list { display:grid; gap:24px; }
  .clc { position:relative; background:var(--paper-hi); border:3px solid #4E82AE; border-radius:20px; padding:28px 34px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .clc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#4E82AE; border-radius:17px 0 0 17px; }
  .clc .cn { display:flex; align-items:baseline; gap:16px; }
  .clc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:#2f5c80; }
  .clc .desc { font-size:29px; color:var(--sumi-soft); line-height:1.5; margin-top:12px; }
  .clc .desc b { color:var(--imp); font-weight:900; }
  .cl-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:28px; line-height:1.5; }
  .cl-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .cl-note b { color:#8ec5ff; }
  .blank { font-size:40px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cl-safe">
    <div class="cl-side" data-at="0" data-anim="left">
      <div class="zicon">🌲</div>
      <div class="zone">冷帯<br>（亜寒帯）</div>
      <div class="zsub">高緯度。冬が長く寒さが厳しい。<br>北半球にだけ広がる。</div>
    </div>
    <div class="cl-list">
      <div class="clc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">気候帯⑧</span>
          <span class="blank" data-fill="2"><span class="bnum">⑧</span><b>冷帯（亜寒帯）</b></span></div>
        <div class="desc"><b>夏が短く、冬は寒さが厳しい。</b>夏と冬の気温差が大きい。<span style="color:#2f5c80;font-weight:800;">例：シベリア・カナダ北部</span></div>
      </div>
      <div class="cl-note" data-at="3" data-anim="fade">
        <span class="k">キーワード</span>
        <span>冷帯には<b>タイガ</b>とよばれる広大な<b>針葉樹林</b>が広がる。</span>
      </div>
      <div class="cl-note" data-at="4" data-anim="fade" style="background:#2f5c80;">
        <span class="k">雨温図</span>
        <span>気温の折れ線は<b>山型が大きく落ちこむ</b>（冬がとても寒い）。</span>
      </div>
    </div>
    <div class="figure cl-fig" data-at="0" data-anim="right"><img src="assets/reitai_taiga.webp" alt="タイガの針葉樹林"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
