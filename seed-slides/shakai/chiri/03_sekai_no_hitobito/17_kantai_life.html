<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>寒帯に暮らす人々 ── イヌイットとイグルー・ツンドラ｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lf-safe { inset: 78px 120px 78px; grid-template-columns: 340px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .lf-fig { height: 470px; border-radius: 24px; border: 3px solid #8FA9C0; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .lf-side { background:#8FA9C0; color:#16222e; border-radius:24px; padding:40px 32px; display:grid; gap:16px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .lf-side .zicon { font-size:96px; }
  .lf-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; }
  .lf-side .zsub { font-size:25px; font-weight:700; line-height:1.4; }
  .lf-list { display:grid; gap:20px; }
  .lfc { position:relative; background:var(--paper-hi); border:3px solid #8FA9C0; border-radius:20px; padding:26px 34px; box-shadow:0 12px 26px rgba(40,30,10,.10); }
  .lfc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#8FA9C0; border-radius:17px 0 0 17px; }
  .lfc .t { font-size:31px; color:var(--sumi-soft); line-height:1.5; }
  .lfc .t b { color:var(--imp); font-weight:900; }
  .lfc .t .r { color:#4a6178; font-weight:800; }
  .lf-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:28px; line-height:1.5; }
  .lf-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .lf-note b { color:#8ec5ff; }
  .blank { font-size:38px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe lf-safe">
    <div class="lf-side" data-at="0" data-anim="left">
      <div class="zicon">🛖</div>
      <div class="zone">寒帯</div>
      <div class="zsub">カナダ北部・ロシア北部。<br>樹木が育たない極寒の地。</div>
    </div>
    <div class="lf-list">
      <div class="lfc" data-at="1" data-anim="pop">
        <div class="t"><span class="r">先住民</span>　カナダ北部には
          <span class="blank" data-fill="2"><span class="bnum">①</span><b>イヌイット</b></span>
          とよばれる先住民がいて、トナカイ（カリブー）の<b>生肉</b>などを食べる。</div>
      </div>
      <div class="lfc" data-at="3" data-anim="pop">
        <div class="t"><span class="r">大地</span>　ロシア北部の寒帯では樹木が育たず、夏に氷がとけて草やコケが育つ。この地域を
          <span class="blank" data-fill="4"><span class="bnum">②</span><b>ツンドラ</b></span>
          という。</div>
      </div>
      <div class="lf-note" data-at="5" data-anim="fade">
        <span class="k">住まい</span>
        <span>ふだんは丸太づくりの家。冬の狩りのときは雪でつくる家＝<b>イグルー</b>に住む。</span>
      </div>
    </div>
    <div class="figure lf-fig" data-at="0" data-anim="right"><img src="assets/kantai_igloo.webp" alt="雪でつくる家イグルー"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
