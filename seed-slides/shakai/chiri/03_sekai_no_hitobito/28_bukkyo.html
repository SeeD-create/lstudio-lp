<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>仏教 ── 東南〜東アジア・タイの男子は出家｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rl-safe { inset: 78px 120px 78px; grid-template-columns: 370px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .rl-fig { height: 480px; border-radius: 24px; border: 3px solid #E0A030; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .rl-side { background:#E0A030; color:#3a2b06; border-radius:24px; padding:44px 34px; display:grid; gap:18px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .rl-side .sym { font-size:120px; line-height:1; }
  .rl-side .name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; }
  .rl-side .num { font-size:24px; font-weight:700; opacity:.85; letter-spacing:.08em; }
  .rl-list { display:grid; gap:20px; }
  .rlc { position:relative; background:var(--paper-hi); border:3px solid #E0A030; border-radius:20px; padding:26px 34px; box-shadow:0 12px 26px rgba(40,30,10,.10); }
  .rlc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#E0A030; border-radius:17px 0 0 17px; }
  .rlc .cn { display:flex; align-items:baseline; gap:16px; }
  .rlc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:#9a6c10; }
  .rlc .t { font-size:30px; color:var(--sumi-soft); line-height:1.5; margin-top:10px; }
  .rlc .t b { color:var(--imp); font-weight:900; }
  .rlc .t .r { color:#9a6c10; font-weight:800; }
  .blank { font-size:40px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe rl-safe">
    <div class="rl-side" data-at="0" data-anim="left">
      <div class="sym">☸</div>
      <div class="name">寺院と出家</div>
      <div class="num">三大宗教｜開祖はシャカ</div>
    </div>
    <div class="rl-list">
      <div class="rlc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">宗教③</span>
          <span class="blank" data-fill="2"><span class="bnum">③</span><b>仏教</b></span></div>
        <div class="t"><span class="r">分布</span>　<b>東南アジアから東アジア</b>にかけて信仰されている。</div>
      </div>
      <div class="rlc" data-at="3" data-anim="pop">
        <div class="t"><span class="r">習わし</span>　<b>タイの男子</b>は、一生のうちに必ず1回は出家して修行しなければならない。</div>
      </div>
      <div class="rlc" data-at="4" data-anim="pop">
        <div class="t"><span class="r">くらし</span>　寺院を中心に信仰され、日本の生活にも深く根づいている。</div>
      </div>
    </div>
    <div class="figure rl-fig" data-at="0" data-anim="right"><img src="assets/bukkyo_tera.webp" alt="東南アジアの仏教寺院"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
