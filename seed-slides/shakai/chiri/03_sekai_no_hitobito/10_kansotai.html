<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>乾燥帯 ── 砂漠気候とステップ気候｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cl-safe { inset: 84px 130px 82px; grid-template-columns: 360px 1fr 420px; align-content:center; gap: 44px; align-items:center; }
  .cl-fig { height: 470px; border-radius: 24px; border: 3px solid #D9A431; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .cl-side { background:#D9A431; color:#3a2b06; border-radius:24px; padding:44px 36px; display:grid; gap:22px; box-shadow:0 16px 34px rgba(40,30,10,.18); }
  .cl-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:78px; line-height:1; }
  .cl-side .zsub { font-size:28px; font-weight:700; line-height:1.4; }
  .cl-side .zicon { font-size:76px; }
  .cl-list { display:grid; gap:24px; }
  .clc { position:relative; background:var(--paper-hi); border:3px solid #D9A431; border-radius:20px; padding:28px 34px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .clc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#D9A431; border-radius:17px 0 0 17px; }
  .clc .cn { display:flex; align-items:baseline; gap:16px; }
  .clc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:#8a6a12; }
  .clc .desc { font-size:29px; color:var(--sumi-soft); line-height:1.5; margin-top:12px; }
  .clc .desc b { color:var(--imp); font-weight:900; }
  .blank { font-size:40px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cl-safe">
    <div class="cl-side" data-at="0" data-anim="left">
      <div class="zicon">🏜️</div>
      <div class="zone">乾燥帯</div>
      <div class="zsub">雨がとても少ない地域。<br>回帰線付近に広がる。</div>
    </div>
    <div class="cl-list">
      <div class="clc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">気候区③</span>
          <span class="blank" data-fill="2"><span class="bnum">③</span><b>砂漠気候</b></span></div>
        <div class="desc"><b>昼と夜の気温の差</b>が大きく、砂漠が広がる。雨はほとんど降らない。<span style="color:#8a6a12;font-weight:800;">例：サハラ砂漠</span></div>
      </div>
      <div class="clc" data-at="3" data-anim="pop">
        <div class="cn"><span class="lab">気候区④</span>
          <span class="blank" data-fill="4"><span class="bnum">④</span><b>ステップ気候</b></span></div>
        <div class="desc">降水量が少しあるため、乾燥に強い<b>背の低い草（ステップ）</b>が育つ。<span style="color:#8a6a12;font-weight:800;">例：モンゴル</span></div>
      </div>
    </div>
    <div class="figure cl-fig" data-at="0" data-anim="right"><img src="assets/kanso_sabaku.webp" alt="砂漠のようす"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
