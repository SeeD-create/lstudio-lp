<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 5つの気候帯を見分ける｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content:center; gap: 34px; justify-items:center; }
  .chk-head { justify-self:center; }
  .qwrap { width: 1440px; display:grid; gap: 22px; }
  .qrow { display:grid; grid-template-columns: 1fr 320px; align-items:center; gap: 30px; background: var(--paper-hi); color: var(--sumi); border-radius:20px; padding:23px 37px; box-shadow:0 16px 34px rgba(40,30,10,.18); border: 3px solid var(--sumi);}
  .qrow .qq { font-size:33px; line-height:1.45; font-weight:700; }
  .qrow .qq .u { color: var(--sumi); }
  .qrow .qa { justify-self:end; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:#ffd27a; }
  .qrow .qa .blank { font-size:46px; }
  .qrow .qa .blank b { color:#ff8a8f; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe chk-safe">
    <span class="cat-badge chk-head" data-at="0"><span class="dot"></span>ミニ確認 ── 気候帯を見分ける</span>
    <div class="qwrap">
      <div class="qrow" data-at="0" data-anim="pop">
        <div class="qq">① 一年を通して気温が高く、降水量も多い。四季は見られない。</div>
        <div class="qa"><span class="blank" data-fill="1"><b>熱帯</b></span></div>
      </div>
      <div class="qrow" data-at="1" data-anim="pop">
        <div class="qq">② すごしやすい気候で、一般に<span class="u">四季の変化</span>が見られる。</div>
        <div class="qa"><span class="blank" data-fill="2"><b>温帯</b></span></div>
      </div>
      <div class="qrow" data-at="2" data-anim="pop">
        <div class="qq">③ 夏でもすずしく、冬の寒さが厳しい。<span class="u">針葉樹林帯</span>が広がる。</div>
        <div class="qa"><span class="blank" data-fill="3"><b>冷帯</b></span></div>
      </div>
      <div class="qrow" data-at="2" data-anim="pop">
        <div class="qq">④ 降水量がきわめて少なく、<span class="u">昼と夜の気温差</span>が大きい。</div>
        <div class="qa"><span class="blank" data-fill="3"><b>乾燥帯</b></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
