<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>熱帯 ── 熱帯雨林気候とサバナ気候｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cl-safe { inset: 84px 130px 82px; grid-template-columns: 360px 1fr 420px; align-content:center; gap: 44px; align-items:center; }
  .cl-fig { height: 470px; border-radius: 24px; border: 3px solid #3FA05A; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .cl-side { background:#3FA05A; color:#fff; border-radius:24px; padding:44px 36px; display:grid; gap:22px; box-shadow:0 16px 34px rgba(40,30,10,.18); }
  .cl-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; }
  .cl-side .zsub { font-size:28px; font-weight:700; opacity:.95; line-height:1.4; }
  .cl-side .zicon { font-size:76px; }
  .cl-list { display:grid; gap:24px; }
  .clc { position:relative; background:var(--paper-hi); border:3px solid #3FA05A; border-radius:20px; padding:28px 34px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .clc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#3FA05A; border-radius:17px 0 0 17px; }
  .clc .cn { display:flex; align-items:baseline; gap:16px; }
  .clc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:#2b6a48; }
  .clc .desc { font-size:29px; color:var(--sumi-soft); line-height:1.5; margin-top:12px; }
  .clc .desc b { color:var(--imp); font-weight:900; }
  .blank { font-size:40px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cl-safe">
    <div class="cl-side" data-at="0" data-anim="left">
      <div class="zicon">🌴</div>
      <div class="zone">熱帯</div>
      <div class="zsub">赤道付近。一年中気温が高い。<br>気温の年間の差が小さい。</div>
    </div>
    <div class="cl-list">
      <div class="clc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">気候区①</span>
          <span class="blank" data-fill="2"><span class="bnum">①</span><b>熱帯雨林気候</b></span></div>
        <div class="desc">年じゅう<b>高温多湿</b>で、ジャングル（熱帯雨林）が生いしげる。<span style="color:#2b6a48;font-weight:800;">例：アマゾン・東南アジア</span></div>
      </div>
      <div class="clc" data-at="3" data-anim="pop">
        <div class="cn"><span class="lab">気候区②</span>
          <span class="blank" data-fill="4"><span class="bnum">②</span><b>サバナ気候</b></span></div>
        <div class="desc"><b>乾季と雨季</b>があり、木がまばらに生える草原（サバナ）が広がる。<span style="color:#2b6a48;font-weight:800;">例：アフリカ中部</span></div>
      </div>
    </div>
    <div class="figure cl-fig" data-at="0" data-anim="right"><img src="assets/nettai_jungle.webp" alt="熱帯雨林のようす"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
