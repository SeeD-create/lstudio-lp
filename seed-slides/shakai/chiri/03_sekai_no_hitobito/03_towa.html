<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>この単元とは ── 気候・暮らし・宗教の3枚を集める｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tw-safe { inset: 96px 140px 90px; align-content: center; gap: 46px; }
  .tw-head { display:grid; gap:14px; }
  .tw-lead { font-size: 40px; color: var(--sumi-soft); line-height: 1.5; }
  .tw-lead b { color: var(--imp); font-weight: 900; }
  .tw-row { display:grid; grid-template-columns: repeat(3,1fr); gap: 34px; }
  .tw-card { position:relative; background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 40px 38px; display:grid; gap:18px; align-content:start; min-height: 360px; }
  .tw-card::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; border-radius:21px 21px 0 0; }
  .tw-card.c1::before { background:#3FA05A; } .tw-card.c2::before { background:#E67E22; } .tw-card.c3::before { background:#5B6EC8; }
  .tw-no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color: var(--sumi-mute); }
  .tw-ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color: var(--sumi); }
  .tw-d { font-size: 30px; color: var(--sumi-soft); line-height: 1.55; }
  .tw-d .k { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">第3章</span>　世界の人々とは</span>
      <p class="tw-lead">世界の暮らしのちがいは、大きく <b>3つのテーマ</b> で読み解ける。</p>
    </div>
    <div class="tw-row">
      <div class="tw-card c1" data-at="1" data-anim="pop"><div class="tw-no">CARD Ⅰ</div><div class="tw-ttl">世界の気候</div><div class="tw-d"><span class="k">熱帯・乾燥帯・温帯・冷帯・寒帯</span>の5つの気候帯と、そのしくみ。</div></div>
      <div class="tw-card c2" data-at="2" data-anim="pop"><div class="tw-no">CARD Ⅱ</div><div class="tw-ttl">世界の暮らし</div><div class="tw-d">その気候に合わせた <span class="k">衣・食・住</span>。イヌイット・遊牧・アンデスなど。</div></div>
      <div class="tw-card c3" data-at="3" data-anim="pop"><div class="tw-no">CARD Ⅲ</div><div class="tw-ttl">世界の宗教</div><div class="tw-d"><span class="k">キリスト教・イスラム教・仏教</span>の三大宗教＋ヒンドゥー教。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
