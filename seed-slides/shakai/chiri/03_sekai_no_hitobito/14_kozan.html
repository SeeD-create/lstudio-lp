<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>高山気候 ── 標高が高く一年中すずしい｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cl-safe { inset: 84px 130px 82px; grid-template-columns: 420px 1fr; align-content:center; gap: 56px; align-items:center; }
  .cl-side { background:#9B6B4A; color:#fff; border-radius:24px; padding:44px 36px; display:grid; gap:22px; box-shadow:0 16px 34px rgba(40,30,10,.18); }
  .cl-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:74px; line-height:1; }
  .cl-side .zsub { font-size:27px; font-weight:700; opacity:.96; line-height:1.4; }
  .cl-side .zicon { font-size:76px; }
  .cl-list { display:grid; gap:24px; }
  .clc { position:relative; background:var(--paper-hi); border:3px solid #9B6B4A; border-radius:20px; padding:28px 34px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .clc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#9B6B4A; border-radius:17px 0 0 17px; }
  .clc .cn { display:flex; align-items:baseline; gap:16px; }
  .clc .cn .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:#6e4a30; }
  .clc .desc { font-size:29px; color:var(--sumi-soft); line-height:1.5; margin-top:12px; }
  .clc .desc b { color:var(--imp); font-weight:900; }
  .cl-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:28px; line-height:1.5; }
  .cl-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .cl-note b { color:#ffcf9a; }
  .blank { font-size:40px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cl-safe">
    <div class="cl-side" data-at="0" data-anim="left">
      <div class="zicon">⛰️</div>
      <div class="zone">標高が高い所</div>
      <div class="zsub">赤道近くでも、標高が高いと<br>すずしくなる特別な気候。</div>
    </div>
    <div class="cl-list">
      <div class="clc" data-at="1" data-anim="pop">
        <div class="cn"><span class="lab">気候区⑪</span>
          <span class="blank" data-fill="2"><span class="bnum">⑪</span><b>高山気候</b></span></div>
        <div class="desc"><b>10℃前後で気温が一年中安定</b>し、すごしやすい。標高が高いほど気温は下がる。<span style="color:#6e4a30;font-weight:800;">例：アンデス山脈</span></div>
      </div>
      <div class="cl-note" data-at="3" data-anim="fade">
        <span class="k">ポイント</span>
        <span>同じ緯度でも<b>標高が100m上がるごとに約0.6℃下がる</b>。だから赤道近くでもすずしい。</span>
      </div>
      <div class="cl-note" data-at="4" data-anim="fade" style="background:#6e4a30;">
        <span class="k">くらし</span>
        <span>アンデスでは<b>リャマ</b>を放牧し、<b>ジャガイモ</b>を栽培して暮らす。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
