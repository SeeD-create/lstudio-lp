<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>冷帯に暮らす人々 ── シベリアのタイガ｜中1地理 第3章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lf-safe { inset: 78px 120px 78px; grid-template-columns: 340px 1fr 400px; align-content:center; gap: 44px; align-items:center; }
  .lf-fig { height: 470px; border-radius: 24px; border: 3px solid #4E82AE; box-shadow: 0 16px 34px rgba(40,30,10,.18); }
  .lf-side { background:#4E82AE; color:#fff; border-radius:24px; padding:40px 32px; display:grid; gap:16px; box-shadow:0 16px 34px rgba(40,30,10,.18); justify-items:center; text-align:center; }
  .lf-side .zicon { font-size:96px; }
  .lf-side .zone { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; }
  .lf-side .zsub { font-size:25px; font-weight:700; line-height:1.4; opacity:.96; }
  .lf-list { display:grid; gap:20px; }
  .lfc { position:relative; background:var(--paper-hi); border:3px solid #4E82AE; border-radius:20px; padding:26px 34px; box-shadow:0 12px 26px rgba(40,30,10,.10); }
  .lfc::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:#4E82AE; border-radius:17px 0 0 17px; }
  .lfc .t { font-size:31px; color:var(--sumi-soft); line-height:1.5; }
  .lfc .t b { color:var(--imp); font-weight:900; }
  .lfc .t .r { color:#2f5c80; font-weight:800; }
  .lf-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; font-size:28px; line-height:1.5; }
  .lf-note .k { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .lf-note b { color:#8ec5ff; }
  .blank { font-size:38px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe lf-safe">
    <div class="lf-side" data-at="0" data-anim="left">
      <div class="zicon">🌲</div>
      <div class="zone">冷帯</div>
      <div class="zsub">ロシア西部のシベリア。<br>夏は気温が高く樹木が育つ。</div>
    </div>
    <div class="lf-list">
      <div class="lfc" data-at="1" data-anim="pop">
        <div class="t"><span class="r">森林</span>　シベリアでは、夏は気温が高いので樹木が育ち、広い<b>針葉樹林</b>が広がる。これを
          <span class="blank" data-fill="2"><span class="bnum">③</span><b>タイガ</b></span>
          という。</div>
      </div>
      <div class="lf-note" data-at="3" data-anim="fade">
        <span class="k">くらし</span>
        <span>木材を利用した<b>丸太の家（ログハウス）</b>で暮らす。永久凍土がとけないよう高床にする工夫もある。</span>
      </div>
    </div>
    <div class="figure lf-fig" data-at="0" data-anim="right"><img src="assets/reitai_marutagoya.webp" alt="シベリアの高床の丸太の家"></div>
  </div>
  <div class="seed-foot"><span>第3章 世界の人々</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
