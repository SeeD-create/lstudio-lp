<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>工業団地 ── 高速道路のそばに工場が集まる｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kd-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .kd-txt { display: grid; gap: 24px; }
  .kd-fig { height: 540px; border-radius: 28px; border:3px solid var(--cat);
    box-shadow:0 18px 40px rgba(40,30,10,.14); overflow:hidden; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 28px 34px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 33px; line-height: 1.75; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 35px; min-width: 250px; }
  .step { display:flex; align-items:center; gap:18px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:16px 26px; box-shadow:0 8px 20px rgba(40,30,10,.07); font-size:27px; font-weight:900; color:var(--sumi); }
  .step .k { flex:none; font-size:21px; color:#fff; background:var(--c); border-radius:8px; padding:4px 14px; white-space:nowrap; }
  .step small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .kd-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 30px; }
  .kd-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .kd-note .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .kd-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kd-safe">
    <div class="kd-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート3　工業</span>
        <h1 class="headline" style="font-size:52px;margin-top:16px;">道ができると、<span class="em">工場が来る</span></h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        交通の便が良い場所に、いろいろな工場が<br>
        集まったところを<span class="blank" data-fill="1"><b>工業団地</b></span>という。
      </div>
      <div class="step" style="--c:#535250" data-at="2" data-anim="left"><span class="k">何の工場？</span><span><span class="blank" data-fill="2"><b>半導体</b></span>工場・自動車工場など<small>小型・軽量で高価な製品はトラック輸送でも採算が合う</small></span></div>
      <div class="step" style="--c:#1F6FB2" data-at="3" data-anim="left"><span class="k">きっかけ</span><span>東北自動車道・東北新幹線の開通<small>東京との結びつきが強まり、内陸部に工場が進出した</small></span></div>
      <div class="kd-note" data-at="4" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb">「交通の便が良い場所に、いろいろな工場が集まったところ」を答える。<b>高速道路のインターチェンジ付近</b>がキーワード。</span>
      </div>
    </div>
    <div class="figure kd-fig" data-at="0" data-anim="right"><img src="assets/kogyodanchi.webp" alt="工業団地 ── 高速道路のインターチェンジぞいに並ぶ工場"></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
