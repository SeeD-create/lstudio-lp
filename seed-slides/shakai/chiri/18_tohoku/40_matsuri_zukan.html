<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>夏祭りずかん ── 名前を答えられるか｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mz-safe { inset: 84px 120px 88px; align-content: center; gap: 30px; }
  .mz-head { display: grid; gap: 8px; }
  .mz-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
  .mz { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 16px 18px 18px; display: grid; gap: 12px; position:relative; }
  .mzfig { height: 370px; border-radius: 14px; border:2px solid var(--hair);
    background: var(--paper-lo); box-shadow:none; overflow:hidden; }
  .mzw { font-size:23px; font-weight:900; color:var(--c); text-align:center; }
  .mzb { text-align:center; }
  .mzb .blank { font-size:27px; min-width:200px; }
  .mzt { position:absolute; top:-14px; right:14px; background:var(--imp); color:#fff; font-weight:900; font-size:18px; border-radius:999px; padding:4px 14px; }
  .mz-note { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:15px 27px; font-size:26px; line-height:1.45; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .mz-note b { color: var(--imp); }
  .mz-note .blank { font-size:28px; min-width:230px; }
  .mz-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color: var(--imp); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe mz-safe">
    <div class="mz-head" data-at="0">
      <span class="kicker"><span class="num">ノート4</span>　夏祭り②</span>
      <h1 class="headline" style="font-size:50px;">今度は<span class="em">祭りの名前</span>を答える</h1>
    </div>
    <div class="mz-row">
      <div class="mz" style="--c:#8E2A1E" data-at="0" data-anim="pop">
        <span class="mzt">三大祭り</span>
        <div class="figure mzfig"><img src="assets/nebuta.webp" alt="ねぶた祭 ── 内側から光る巨大な武者の灯ろうが夜の街をねり歩く"></div>
        <div class="mzw">青森県・青森</div>
        <div class="mzb" data-at="1"><span class="blank" data-fill="1"><b>ねぶた祭</b></span></div>
      </div>
      <div class="mz" style="--c:#7A5A12" data-at="0" data-anim="pop">
        <span class="mzt">三大祭り</span>
        <div class="figure mzfig"><img src="assets/kanto.webp" alt="竿灯まつり ── 稲穂の形に提灯をつるした長い竿を夜空へかかげる"></div>
        <div class="mzw">秋田県・秋田</div>
        <div class="mzb" data-at="2"><span class="blank" data-fill="2"><b>竿灯まつり</b></span></div>
      </div>
      <div class="mz" style="--c:#1D4E72" data-at="0" data-anim="pop">
        <span class="mzt">三大祭り</span>
        <div class="figure mzfig"><img src="assets/tanabata.webp" alt="七夕まつり ── 商店街に色とりどりのくす玉と吹き流しが下がる"></div>
        <div class="mzw">宮城県・仙台</div>
        <div class="mzb" data-at="3"><span class="blank" data-fill="3"><b>七夕まつり</b></span></div>
      </div>
      <div class="mz" style="--c:#2F7A22" data-at="0" data-anim="pop">
        <div class="figure mzfig"><img src="assets/hanagasa.webp" alt="花笠まつり ── 赤い花をつけたすげ笠を手に列になっておどる"></div>
        <div class="mzw">山形県・山形</div>
        <div class="mzb" data-at="4"><span class="blank" data-fill="4"><b>花笠まつり</b></span></div>
      </div>
    </div>
    <div class="mz-note" data-at="4"><span>3つ合わせて</span><span>青森・秋田・仙台の3つを合わせて<span class="blank" data-fill="4"><b>東北三大祭り</b></span>という。</span></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
