<title>東北ってどんな地方？ ── 米・果物・祭り｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hk-safe { inset: 110px 150px 100px; align-content: center; gap: 46px; }
  .hk-head { display: grid; gap: 14px; }
  .hk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .fact { background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.10); padding: 40px 40px; display: grid; gap: 14px; align-content: start; }
  .fact .fnum { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:80px; line-height:1; color: var(--imp); }
  .fact .fttl { font-size: 34px; font-weight: 900; color: var(--sumi); }
  .fact .fbody { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); }
  .hk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:29px; line-height:1.5; }
  .hk-note b { color: var(--gold-soft); }
  .hk-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　導入</span>
      <h1 class="headline" style="font-size:70px;">東北は、日本の<span class="em">ごはん</span>を作っている</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">米</div><div class="fttl">日本の穀倉地帯</div><div class="fbody">全国の米の約4分の1が東北産。秋田平野・庄内平野・仙台平野は、米だけを作る「単作地帯」。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">果物</div><div class="fttl">果物の三兄弟</div><div class="fbody">青森のりんご、山形のさくらんぼ、福島のもも。どれも全国トップクラスの生産量。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">風</div><div class="fttl">やませという敵</div><div class="fbody">夏に北東から吹く冷たい風。長く吹くと稲が育たず「冷害」になる。東北最大の弱点。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span>この単元のねらい</span><span>東北は<b>「奥羽山脈（自然）→気候→米と果物→祭り」</b>が1本の線でつながる。地図の上に名前を置いていけば、丸暗記しなくても答えが出る。</span></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
