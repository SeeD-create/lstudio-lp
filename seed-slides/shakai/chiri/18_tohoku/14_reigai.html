<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>冷害 ── やませが長引くと米が育たない｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rg-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .rg-txt { display: grid; gap: 24px; }
  .rg-fig { height: 540px; border-radius: 28px; border:3px solid var(--cat);
    box-shadow:0 18px 40px rgba(40,30,10,.14); overflow:hidden; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 28px 34px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 34px; line-height: 1.8; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 36px; min-width: 260px; }
  .step { display:flex; align-items:center; gap:18px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:16px 26px; box-shadow:0 8px 20px rgba(40,30,10,.07); font-size:28px; font-weight:900; color:var(--sumi); }
  .step .k { flex:none; font-size:22px; color:#fff; background:var(--c); border-radius:8px; padding:4px 14px; }
  .step .blank { font-size:29px; min-width:230px; }
  .step small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .rg-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 30px; }
  .rg-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .rg-note .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .rg-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe rg-safe">
    <div class="rg-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート1　夏の低温の害</span>
        <h1 class="headline" style="font-size:52px;margin-top:16px;">夏がこない年、<span class="em">米が実らない</span></h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        やませの吹く期間が長引くと米の生育が悪くなる。<br>
        これを<span class="blank" data-fill="1"><b>冷害</b></span>という。
      </div>
      <div class="step" style="--c:#2F7A22" data-at="2" data-anim="left"><span class="k">対策①</span><span><span class="blank" data-fill="2"><b>品種改良</b></span><small>寒さに強い品種をつくる</small></span></div>
      <div class="step" style="--c:#1F6FB2" data-at="3" data-anim="left"><span class="k">対策②</span><span><span class="blank" data-fill="3"><b>気象情報</b></span>を利用<small>やませの監視を行い、早めに手を打つ</small></span></div>
      <div class="rg-note" data-at="4" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb">「冷たい風が長く吹くとどんな害が起こるか」を答える。対策は<b>寒さに強い品種をつくること</b>と<b>天気予報での監視</b>。</span>
      </div>
    </div>
    <div class="figure rg-fig" data-at="0" data-anim="right"><img src="assets/reigai.webp" alt="冷害 ── 穂が実らずうつむいた稲と、どんよりした夏の空"></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
