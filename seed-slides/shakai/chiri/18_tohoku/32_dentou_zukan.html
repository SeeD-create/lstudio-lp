<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>伝統工芸品ずかん ── 4つを言えるか｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .zk-safe { inset: 84px 120px 88px; align-content: center; gap: 30px; }
  .zk-head { display: grid; gap: 8px; }
  .zk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
  .zk { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 16px 18px 18px; display: grid; gap: 12px; }
  .zkfig { height: 380px; border-radius: 14px; border:2px solid var(--hair);
    background: var(--paper-lo); box-shadow:none; overflow:hidden; }
  .zkw { font-size:22px; font-weight:900; color:var(--c); text-align:center; }
  .zkb { text-align:center; }
  .zkb .blank { font-size:27px; min-width:190px; }
  .zk-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 30px; font-size:25px; line-height:1.45; }
  .zk-note b { color:#fff; }
  .zk-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe zk-safe">
    <div class="zk-head" data-at="0">
      <span class="kicker"><span class="num">ノート3</span>　伝統工芸品②</span>
      <h1 class="headline" style="font-size:50px;">今度は<span class="em">工芸品の名前</span>を答える</h1>
    </div>
    <div class="zk-row">
      <div class="zk" style="--c:#8E2A1E" data-at="0" data-anim="pop">
        <div class="figure zkfig"><img src="assets/tsugarunuri.webp" alt="津軽塗 ── 黒・朱・黄がまだらにかさなるとぎ出し模様の漆器"></div>
        <div class="zkw">青森県・弘前市</div>
        <div class="zkb" data-at="1"><span class="blank" data-fill="1"><b>津軽塗</b></span></div>
      </div>
      <div class="zk" style="--c:#1D4E72" data-at="0" data-anim="pop">
        <div class="figure zkfig"><img src="assets/nanbutekki.webp" alt="南部鉄器 ── あられ模様の鉄びん"></div>
        <div class="zkw">岩手県・盛岡市</div>
        <div class="zkb" data-at="2"><span class="blank" data-fill="2"><b>南部鉄器</b></span></div>
      </div>
      <div class="zk" style="--c:#7A5A12" data-at="0" data-anim="pop">
        <div class="figure zkfig"><img src="assets/shogikoma.webp" alt="将棋の駒 ── 木目のうつくしい五角形の木の駒"></div>
        <div class="zkw">山形県・天童市</div>
        <div class="zkb" data-at="3"><span class="blank" data-fill="3"><b>将棋の駒</b></span></div>
      </div>
      <div class="zk" style="--c:#4A3273" data-at="0" data-anim="pop">
        <div class="figure zkfig"><img src="assets/aizunuri.webp" alt="会津塗 ── 朱と黒の漆に金の蒔絵をほどこした重箱と椀"></div>
        <div class="zkw">福島県・会津若松市</div>
        <div class="zkb" data-at="4"><span class="blank" data-fill="4"><b>会津塗</b></span></div>
      </div>
    </div>
    <div class="zk-note" data-at="4"><span>ひとまとめ</span><span>青森・岩手・山形・福島に1つずつ。塗り物が2つあるので、県までセットで覚える。</span></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
