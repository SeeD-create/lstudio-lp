<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>八戸市 ── 東北地方最大の漁港｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hc-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .hc-txt { display: grid; gap: 26px; }
  .hc-fig { height: 520px; border-radius: 28px; border:3px solid var(--cat);
    box-shadow:0 18px 40px rgba(40,30,10,.14); overflow:hidden; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 36px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 36px; line-height: 1.8; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 38px; min-width: 250px; }
  .step { display:flex; align-items:center; gap:18px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:18px 26px; box-shadow:0 8px 20px rgba(40,30,10,.07); font-size:28px; font-weight:900; color:var(--sumi); }
  .step .k { flex:none; font-size:22px; color:#fff; background:var(--c); border-radius:8px; padding:4px 14px; }
  .step small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .hc-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .hc-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hc-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hc-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe hc-safe">
    <div class="hc-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート2　水産業②</span>
        <h1 class="headline" style="font-size:54px;margin-top:16px;">東北で<span class="em">いちばん大きい漁港</span></h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        東北地方最大の漁港をもつ都市は<br>
        <span class="blank" data-fill="1"><b>八戸市</b></span>（<span class="blank" data-fill="2"><b>青森</b></span>県）。
      </div>
      <div class="step" style="--c:#1B6B44" data-at="2" data-anim="left"><span class="k">なぜ？</span><span>三陸沖の潮境がすぐ目の前<small>さば・いか・いわしなどが大量に水あげされる</small></span></div>
      <div class="hc-note" data-at="3" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb">「東北地方最大の漁港をもつ都市」を答える。北の県の<b>太平洋がわ</b>にあることも地図でおさえる。</span>
      </div>
    </div>
    <div class="figure hc-fig" data-at="0" data-anim="right"><img src="assets/hachinohe.webp" alt="八戸港の水あげ ── 漁船と青い箱に並ぶさば・いわし"></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
