<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sd-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .sd-txt { display: grid; gap: 24px; }
  .sd-fig { height: 540px; border-radius: 28px; border:3px solid var(--cat);
    box-shadow:0 18px 40px rgba(40,30,10,.14); overflow:hidden; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 28px 34px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 34px; line-height: 1.8; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 36px; min-width: 260px; }
  .step { display:flex; align-items:center; gap:18px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:16px 26px; box-shadow:0 8px 20px rgba(40,30,10,.07); font-size:27px; font-weight:900; color:var(--sumi); }
  .step .k { flex:none; font-size:21px; color:#fff; background:var(--c); border-radius:8px; padding:4px 14px; white-space:nowrap; }
  .step small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .sd-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 30px; }
  .sd-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .sd-note .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .sd-note .bb b { color:#fff; }
</style>
</head>

<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sd-safe">
    <div class="sd-txt">
      <div data-at="0">

        <h1 class="headline" style="font-size:54px;margin-top:16px;">東北のすべてが<span class="em">集まる街</span></h1>
      </div>

        東北地方の中心都市は<span class="blank" data-fill="1"><b>仙台市</b></span>（宮城県）。<br>

        <span class="blank" data-fill="2"><b>地方中枢都市</b></span>の1つである。

    </div>
