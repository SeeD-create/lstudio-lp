<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .row .t small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .ch-note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:14px; padding:16px 26px; font-size:24px; line-height:1.45; }
