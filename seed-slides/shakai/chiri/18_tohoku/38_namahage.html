<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>なまはげ ── 男鹿半島にのこる伝統行事｜第18章 東北地方</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nh-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .nh-txt { display: grid; gap: 26px; }
  .nh-fig { height: 540px; border-radius: 28px; border:3px solid var(--cat);
    box-shadow:0 18px 40px rgba(40,30,10,.14); overflow:hidden; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 36px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 34px; line-height: 1.8; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 36px; min-width: 250px; }
  .step { display:flex; align-items:center; gap:18px; background:var(--paper-hi); border-left:9px solid var(--c); border-radius:0 14px 14px 0; padding:18px 26px; box-shadow:0 8px 20px rgba(40,30,10,.07); font-size:28px; font-weight:900; color:var(--sumi); }
  .step .k { flex:none; font-size:21px; color:#fff; background:var(--c); border-radius:8px; padding:4px 14px; white-space:nowrap; }
  .step small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:600; }
  .nh-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .nh-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .nh-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .nh-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe nh-safe">
    <div class="nh-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート4　伝統行事</span>
        <h1 class="headline" style="font-size:54px;margin-top:16px;">「泣く子はいねがー」の<span class="em">正体</span></h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        秋田県の<span class="blank" data-fill="1"><b>男鹿半島</b></span>にのこる伝統行事を<br>
        <span class="blank" data-fill="2"><b>なまはげ</b></span>という。
      </div>
      <div class="step" style="--c:#6B6A67" data-at="2" data-anim="left"><span class="k">位置づけ</span><span>重要無形文化財に指定されている<small>大みそかに面をつけた若者が家々をまわる、年の変わり目の行事</small></span></div>
      <div class="nh-note" data-at="3" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb">「秋田の半島で行われる伝統行事」を答える。夏祭りではなく<b>伝統行事</b>という区分で出る。</span>
      </div>
    </div>
    <div class="figure nh-fig" data-at="0" data-anim="right"><img src="assets/namahage.webp" alt="なまはげ ── 鬼の面とわらのみのをまとい雪の夜に家々をまわる"></div>
  </div>
  <div class="seed-foot"><span>第18章 東北地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
