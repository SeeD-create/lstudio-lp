<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>交通網の整備 ── 中国自動車道｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kt-safe { inset: 96px 140px 92px; align-content: center; gap: 36px; }
  .kt-head { display:grid; gap:12px; }
  .big { display:flex; align-items:center; gap:36px; background:var(--paper-hi); border:4px solid var(--imp); border-radius:22px; padding:30px 40px; box-shadow:0 16px 34px rgba(40,30,10,.12); }
  .big .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:58px; color:var(--imp); line-height:1; white-space:nowrap; }
  .big .k { font-size:60px; }
  .big .k .blank { font-size:56px; }
  .kt-row { display:grid; grid-template-columns:1fr 1fr; gap:34px; }
  .kc { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:20px; padding:26px 30px; display:grid; gap:12px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .kc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:17px 17px 0 0; }
  .kc .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--c); margin-top:8px; }
  .kc .b { font-size:25px; line-height:1.5; color:var(--sumi-soft); }
  .kc .b .imp { color:var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kt-safe">
    <div class="kt-head" data-at="0">
      <span class="kicker"><span class="num">3-8</span>　交通網の整備</span>
      <h1 class="headline" style="font-size:54px;">この地方を<span class="em">東西</span>につらぬく高速道路</h1>
    </div>
    <div class="big" data-at="1" data-anim="pop">
      <span class="yr">1983年<br><span style="font-size:24px;color:var(--sumi-mute)">全線開通</span></span>
      <span class="k"><span class="blank" data-fill="1"><span class="bnum">⑫</span><b>中国</b></span>自動車道</span>
    </div>
    <div class="kt-row">
      <div class="kc" style="--c:#3A7D2C" data-at="2" data-anim="pop">
        <div class="h">どこを通るか</div>
        <div class="b">大阪から山口県・下関まで、<span class="imp">山地の南がわ</span>を東西に走る。山あいの町も高速道路でつながった。</div>
      </div>
      <div class="kc" style="--c:#C4161C" data-at="3" data-anim="pop">
        <div class="h">何が変わったか</div>
        <div class="b">本四連絡橋とあわせて、<span class="imp">産業や人・物資の流れ</span>が大きく変わった。<br>一方で、買い物や通院で大都市へ人が吸い寄せられる<span class="imp">ストロー現象</span>も起きた。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
