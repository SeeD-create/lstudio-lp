<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>養殖の名産 ── 広島湾のかき、愛媛のたい・真珠｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ys-safe { inset: 92px 130px 88px; align-content: center; gap: 38px; }
  .ys-head { display:grid; gap:12px; }
  .ys-row { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
  .yc { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:28px 28px 30px; display:grid; gap:12px; align-content:start; min-height:430px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .yc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .yc .pl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--c); margin-top:8px; }
  .yc .k { font-size:40px; }
  .yc .k .blank { font-size:38px; }
  .yc-fig { height:206px; border-radius:14px; border:2px solid var(--hair); background:var(--paper-lo);
            box-shadow:0 6px 16px rgba(40,30,10,.08); overflow:hidden; }
  .yc .b { font-size:23px; line-height:1.45; color:var(--sumi-soft); }
  .yc .b .imp { color:var(--imp); font-weight:900; }
  .ys-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.5; }
  .ys-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .ys-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ys-safe">
    <div class="ys-head" data-at="0">
      <span class="kicker"><span class="num">2-9</span>　養殖の名産</span>
      <h1 class="headline" style="font-size:54px;">どの海で、<span class="em">何</span>を育てているか</h1>
    </div>
    <div class="ys-row">
      <div class="yc" style="--c:#6B7B8C" data-at="1" data-anim="pop">
        <div class="pl">広島湾（広島県）</div>
        <div class="k"><span class="blank" data-fill="1"><span class="bnum">⑬</span><b>かき</b></span></div>
        <div class="figure yc-fig"><img src="assets/kaki.webp" alt="かき ── からをひらいた大きなかきの身。広島湾で養殖される貝"></div>
        <div class="b">この貝の養殖生産量は<span class="imp">全国1位（約6割）</span>。岡山県も3位。おだやかな内海が育てる。</div>
      </div>
      <div class="yc" style="--c:#C0504D" data-at="2" data-anim="pop">
        <div class="pl">宇和海など（愛媛県）</div>
        <div class="k">たい</div>
        <div class="figure yc-fig"><img src="assets/tai.webp" alt="まだい ── 銀色にかがやく赤い体の魚。愛媛県の宇和海で養殖される"></div>
        <div class="b">まだいの養殖は愛媛県が<span class="imp">全国1位（5割超）</span>。高知県も3位。真珠の養殖も全国1位。</div>
      </div>
      <div class="yc" style="--c:#8C7BA6" data-at="3" data-anim="pop">
        <div class="pl">愛媛・長崎・三重</div>
        <div class="k">真珠</div>
        <div class="figure yc-fig"><img src="assets/shinju.webp" alt="真珠 ── ひらいた貝の中に白くかがやく真珠がおさまっている"></div>
        <div class="b">真珠の養殖は愛媛県が<span class="imp">全国1位</span>（長崎・三重が続く）。あたたかい入り江で育てる。</div>
      </div>
    </div>
    <div class="ys-note" data-at="4"><span class="lab">★頻出</span><span>「広島湾で養殖がさかんな<b>貝</b>」は⑬。愛媛は<b>たい・真珠・ぶり</b>と海の名産が多い県。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
