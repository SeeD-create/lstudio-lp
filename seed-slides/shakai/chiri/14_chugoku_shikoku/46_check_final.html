<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>総仕上げ ── 中国・四国地方○×クイズ｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fq-safe { inset: 88px 130px 84px; align-content: center; gap: 26px; }
  .fq-head { display:grid; gap:10px; }
  .q { display:grid; grid-template-columns: 1fr 220px; gap:26px; align-items:center; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 31px; box-shadow:0 14px 30px rgba(40,30,10,.16); border: 3px solid var(--sumi);}
  .q .txt { font-size:31px; line-height:1.45; font-weight:700; }
  .q .txt .u { color: var(--sumi); border-bottom: 3px solid var(--imp); }
  .q .res { display:flex; align-items:center; justify-content:flex-end; gap:14px; }
  .q .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:62px; line-height:1; color: var(--sumi); }
  .q .cor { font-size:21px; line-height:1.3; color: var(--sumi); font-weight:700; text-align:left; }
  .q .mk.blank { min-width:80px; padding:0 10px 4px; margin:0; }
  .q .cor.blank--para { padding:3px 10px; min-width:150px; }
  .q .cor.blank--para b { color: var(--imp); font-family:inherit; }
</style>
<style data-swrepair>
.cor.blank.blank--para b{color:var(--imp) !important;}</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fq-safe">
    <div class="fq-head" data-at="0">
      <span class="kicker"><span class="num">総仕上げ</span>　○×クイズ</span>
      <h1 class="headline" style="font-size:52px;">まちがえやすい<span class="em">3問</span>で最終チェック</h1>
    </div>
    <div class="q" data-at="0" data-anim="pop">
      <span class="txt">① 讃岐平野に多い、かんがい用の池を<span class="u">ため池</span>という。</span>
      <span class="res"><span class="mk blank" data-fill="1"><b>○</b></span><span class="cor blank blank--para" data-fill="1"><b>香川用水（吉野川から）も<br>セットで覚える</b></span></span>
    </div>
    <div class="q" data-at="0" data-anim="pop">
      <span class="txt">② 広島湾で養殖がさかんな貝は<span class="u">真珠</span>である。</span>
      <span class="res"><span class="mk blank" data-fill="2"><b>×</b></span><span class="cor blank blank--para" data-fill="2"><b>正しくは<b style="color:#fff">かき</b>。<br>真珠は愛媛県が全国1位</b></span></span>
    </div>
    <div class="q" data-at="0" data-anim="pop">
      <span class="txt">③ 中国地方の中心都市で自動車工業がさかんなのは<span class="u">岡山市</span>である。</span>
      <span class="res"><span class="mk blank" data-fill="3"><b>×</b></span><span class="cor blank blank--para" data-fill="3"><b>正しくは<b style="color:#fff">広島市</b>。<br>地方中枢都市の1つ</b></span></span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
