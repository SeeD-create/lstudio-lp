<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>本州四国連絡橋の3ルート｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hn-safe { inset: 88px 110px 84px; align-content: center; gap: 32px; }
  .hn-head { display:grid; gap:12px; }
  .hn-row { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .rt { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:26px 26px 28px; display:grid; gap:12px; align-content:start; min-height:470px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .rt::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .rt .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--c); margin-top:8px; }
  .rt .k { font-size:31px; line-height:1.3; }
  .rt .k .blank { font-size:29px; min-width:170px; }
  .rt-fig { height:190px; border-radius:14px; border:2px solid var(--hair); background:var(--paper-lo);
            box-shadow:0 6px 16px rgba(40,30,10,.08); overflow:hidden; }
  .rt .br { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--sumi); }
  .rt .b { font-size:22px; line-height:1.45; color:var(--sumi-soft); }
  .rt .b .imp { color:var(--imp); font-weight:900; }
  .hn-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.5; }
  .hn-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .hn-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe hn-safe">
    <div class="hn-head" data-at="0">
      <span class="kicker"><span class="num">3-9</span>　本州四国連絡橋</span>
      <h1 class="headline" style="font-size:54px;">本州と四国をむすぶ<span class="em">3本</span>のルート</h1>
    </div>
    <div class="hn-row">
      <div class="rt" style="--c:#C4161C" data-at="1" data-anim="pop">
        <div class="yr">1988年開通<span style="font-size:20px;color:var(--sumi-mute)">（いちばん早い）</span></div>
        <div class="k"><span class="blank" data-fill="1"><span class="bnum">⑭</span><b>児島・坂出</b></span>ルート</div>
        <div class="figure rt-fig"><img src="assets/hashi_dourotetsudo.webp" alt="道路と鉄道が2段になった長い海上橋 ── 児島・坂出ルート（瀬戸大橋）"></div>
        <div class="br">瀬戸大橋</div>
        <div class="b"><span class="imp">道路と鉄道の両方</span>が通る唯一のルート。岡山県と香川県を結ぶ。</div>
      </div>
      <div class="rt" style="--c:#7B3FA0" data-at="2" data-anim="pop">
        <div class="yr">1998年開通</div>
        <div class="k"><span class="blank" data-fill="2"><span class="bnum">⑮</span><b>神戸・鳴門</b></span>ルート</div>
        <div class="figure rt-fig"><img src="assets/hashi_tsuribashi.webp" alt="海峡をまたぐ世界最大級のつり橋 ── 神戸・鳴門ルート（明石海峡大橋）"></div>
        <div class="br">明石海峡大橋・大鳴門橋</div>
        <div class="b">兵庫県から<span class="imp">淡路島</span>を通って徳島県へ。明石海峡大橋は世界最大級のつり橋。</div>
      </div>
      <div class="rt" style="--c:#1F6FB2" data-at="3" data-anim="pop">
        <div class="yr">1999年開通<span style="font-size:20px;color:var(--sumi-mute)">（いちばん遅い）</span></div>
        <div class="k"><span class="blank" data-fill="3"><span class="bnum">⑬</span><b>尾道・今治</b></span>ルート</div>
        <div class="figure rt-fig"><img src="assets/hashi_shimadutai.webp" alt="島から島へ橋がつながる島づたいのルート ── 尾道・今治ルート（しまなみ海道）"></div>
        <div class="br">しまなみ海道</div>
        <div class="b">広島県と愛媛県を、<span class="imp">島づたい</span>にいくつもの橋で結ぶ。自転車でも渡れる。</div>
      </div>
    </div>
    <div class="hn-note" data-at="4"><span class="lab">★頻出</span><span>開通の順は <b>1988（瀬戸大橋）→ 1998 → 1999</b>。年号と県の組み合わせで出る。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
