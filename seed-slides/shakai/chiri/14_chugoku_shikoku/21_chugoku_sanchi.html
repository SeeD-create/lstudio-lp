<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中国山地 ── 肉牛の放牧と過疎｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cs-safe { inset: 90px 140px 86px; align-content: center; gap: 36px; }
  .cs-head { display:grid; gap:12px; }
  .cs-row { display:grid; grid-template-columns:1fr 1fr; gap:36px; }
  .cd { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:32px 34px 34px; display:grid; gap:14px; align-content:start; min-height:340px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .cd::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .cd .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--c); margin-top:8px; }
  .cd-fig { height:158px; border-radius:14px; border:2px solid var(--hair); background:var(--paper-lo);
            box-shadow:0 6px 16px rgba(40,30,10,.08); overflow:hidden; }
  .cd .k { font-size:44px; }
  .cd .k .blank { font-size:40px; }
  .cd .b { font-size:26px; line-height:1.5; color:var(--sumi-soft); }
  .cs-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.5; }
  .cs-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .cs-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe cs-safe">
    <div class="cs-head" data-at="0">
      <span class="kicker"><span class="num">2-2</span>　中国山地</span>
      <h1 class="headline" style="font-size:56px;">なだらかな山地だから<span class="em">牛が飼える</span></h1>
    </div>
    <div class="cs-row">
      <div class="cd" style="--c:#8a6b2f" data-at="1" data-anim="pop">
        <div class="h">産業</div>
        <div class="figure cd-fig"><img src="assets/houboku.webp" alt="中国山地の放牧 ── なだらかな草地の斜面で草をはむ黒い肉牛"></div>
        <div class="k"><span class="blank" data-fill="1"><span class="bnum">③</span><b>肉牛</b></span>の放牧が盛ん</div>
        <div class="b">中国山地は低くてなだらか。斜面がゆるいので牧場をひらきやすい。<br>「千屋牛」「見蘭牛」など銘柄牛も育つ。</div>
      </div>
      <div class="cd" style="--c:#C4161C" data-at="2" data-anim="pop">
        <div class="h">問題</div>
        <div class="figure cd-fig"><img src="assets/kaso.webp" alt="過疎の集落 ── 人けのない山あいの村と、荒れた棚田・戸を閉じた家"></div>
        <div class="k"><span class="blank" data-fill="2"><span class="bnum">④</span><b>過疎</b></span>化が進む</div>
        <div class="b">若い人が都市へ出ていき、人口が減りすぎている。<br>バスや病院・学校がなくなり、生活が不便に。</div>
      </div>
    </div>
    <div class="cs-note" data-at="3"><span class="lab">つながり</span><span>山地の農業（放牧）＋ 山地の課題（④）は<b>セットで出題</b>される。「Aは何山地か」＝<b>中国山地</b>。</span></div>
    <div class="cs-note" data-at="4"><span class="lab">対策</span><span>町おこし・村おこし、<b>Iターン・Uターン</b>のよびかけ、道の駅や観光での立て直しが進む。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
