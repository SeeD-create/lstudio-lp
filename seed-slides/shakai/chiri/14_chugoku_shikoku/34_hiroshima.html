<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>広島市 ── 中国・四国地方の中心都市｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hs-safe { inset: 92px 130px 88px; align-content: center; gap: 34px; }
  .hs-head { display:grid; gap:12px; }
  .hs-big { display:flex; align-items:center; gap:34px; background:var(--paper-hi); border:3px solid var(--imp); border-radius:22px; padding:26px 36px; box-shadow:0 16px 34px rgba(40,30,10,.12); }
  .hs-big .num { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:80px; color:var(--imp); line-height:1; }
  .hs-big .k { font-size:66px; }
  .hs-big .k .blank { font-size:62px; }
  .hs-row { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .hc { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:20px; padding:26px 28px 28px; display:grid; gap:12px; align-content:start; min-height:300px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .hc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:17px 17px 0 0; }
  .hc .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--c); margin-top:8px; }
  .hc .b { font-size:25px; line-height:1.5; color:var(--sumi-soft); }
  .hc .b .imp { color:var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe hs-safe">
    <div class="hs-head" data-at="0">
      <span class="kicker"><span class="num">3-1</span>　中心都市</span>
      <h1 class="headline" style="font-size:56px;">この地方の<span class="em">首都</span>にあたる都市</h1>
    </div>
    <div class="hs-big" data-at="1" data-anim="pop">
      <span class="num">①</span>
      <span class="k"><span class="blank" data-fill="1"><b>広島市</b></span>（広島県）</span>
    </div>
    <div class="hs-row">
      <div class="hc" style="--c:#3A3A39" data-at="2" data-anim="pop">
        <div class="h">立場</div>
        <div class="b">中国・四国地方の<span class="imp">中心都市</span>。<span class="imp">地方中枢都市</span>の1つで、大企業の支社や国の出先機関が集まる。人口約119万人。</div>
      </div>
      <div class="hc" style="--c:#1F6FB2" data-at="3" data-anim="pop">
        <div class="h">産業</div>
        <div class="b"><span class="imp">自動車工業</span>が盛ん（マツダ）。ほかに機械工業も発達。太田川の三角州の上に広がる都市。</div>
      </div>
      <div class="hc" style="--c:#C4161C" data-at="4" data-anim="pop">
        <div class="h">歴史</div>
        <div class="b">第二次世界大戦中の<span class="imp">1945年8月6日</span>、世界で初めて<span class="imp">原子爆弾</span>を投下された。原爆ドームは世界文化遺産。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
