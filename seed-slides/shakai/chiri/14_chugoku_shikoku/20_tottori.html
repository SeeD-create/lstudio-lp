<!DOCTYPE html>

<head>

<title>鳥取平野 ── 砂丘の農業｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tt-safe { inset: 86px 130px 82px; align-content: start; gap: 32px; }
  .tt-head { display:grid; gap:12px; }
  .tt-body { display:grid; grid-template-columns: 700px 1fr; gap:46px; align-items:start; }
  .tt-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; box-shadow:0 14px 34px rgba(40,30,10,.12); padding:14px; }
  .tt-fig svg { width:100%; height:auto; display:block; }
  .tt-list { display:grid; gap:22px; align-content:start; }
  .it { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:18px; padding:22px 26px; display:grid; gap:8px; box-shadow:0 12px 26px rgba(40,30,10,.09); }
  .it::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--c); border-radius:15px 0 0 15px; }
  .it .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color:var(--c); padding-left:8px; }
  .it .k { font-size:36px; padding-left:8px; }
  .it .k .blank { font-size:34px; }
  .it .b { font-size:23px; line-height:1.45; color:var(--sumi-soft); padding-left:8px; }
  .tt-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.5; }
  .tt-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .tt-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe tt-safe">
    <div class="tt-head" data-at="0">
      <span class="kicker"><span class="num">2-1</span>　鳥取平野</span>
      <h1 class="headline" style="font-size:56px;">砂の畑で作るもの、<span class="em">平野で作るもの</span></h1>
    </div>
    <div class="tt-body">
      <div class="tt-fig" data-at="0" data-anim="left">
        <svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="700" height="430" fill="#F6F5F1"/>
          <!-- 空 -->
          <rect x="0" y="0" width="700" height="150" fill="#DCEAF4"/>
          <!-- 海 -->
          <rect x="0" y="150" width="700" height="52" fill="#8FC0DE"/>
          <text x="60" y="182" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="22" fill="#0f5480">日本海</text>

          <path d="M0,202 C90,180 170,196 250,214 C330,232 410,238 500,236 L700,236 L700,300 L0,300 Z" fill="#E8D9AE" stroke="#B79E63" stroke-width="2.5"/>
          <text x="220" y="272" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="30" fill="#8a6b2f">砂丘</text>
          <!-- 平野 -->
          <rect x="0" y="300" width="700" height="130" fill="#D6E3C6" stroke="#8FA872" stroke-width="2.5"/>
          <text x="120" y="352" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="28" fill="#4e6b34">鳥取平野</text>
          <!-- スプリンクラー -->
          <g data-at="1">
            <line x1="430" y1="236" x2="430" y2="196" stroke="#8B8A88" stroke-width="5"/>
            <circle cx="430" cy="192" r="9" fill="#5B93C7"/>
            <g stroke="#5B93C7" stroke-width="3.4" stroke-linecap="round" fill="none">

              <path d="M430,186 C460,176 488,190 498,214"/>

          </g>
          <!-- 作物 -->
          <g data-at="1">
            <circle cx="150" cy="250" r="23" fill="#C0504D" stroke="#fff" stroke-width="3.2"/>
            <text x="150" y="259" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="26" fill="#fff">①</text>
          </g>
          <g data-at="2">
            <circle cx="430" cy="342" r="23" fill="#2E8B57" stroke="#fff" stroke-width="3.2"/>
            <text x="430" y="351" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="26" fill="#fff">②</text>
            <text x="430" y="374" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="700" font-size="19" fill="#C4161C" paint-order="stroke" stroke="#D6E3C6" stroke-width="5">全国6位</text>
            <g fill="#C4A24A" stroke="#7a5f20" stroke-width="2">

          </g>

      <div class="tt-list">
        <div class="it" style="--c:#C0504D" data-at="1" data-anim="pop">
          <div class="h">砂丘では</div>
          <div class="k"><span class="blank" data-fill="1"><span class="bnum">①</span><b>らっきょう</b></span></div>
          <div class="b">長いもの栽培も盛ん。水はけがよすぎる砂地なので、<span class="imp">スプリンクラー</span>で散水する。</div>
        </div>
        <div class="it" style="--c:#2E8B57" data-at="2" data-anim="pop">
          <div class="h">平野部では</div>
          <div class="k"><span class="blank" data-fill="2"><span class="bnum">②</span><b>なし</b></span></div>
          <div class="b">鳥取県はこの果物の生産量<span class="imp">全国6位</span>。「二十世紀」という品種が有名。</div>
        </div>
      </div>
    </div>
    <div class="tt-note" data-at="3"><span class="lab">★頻出</span><span>「砂丘＝①の作物」「平野部＝②の果物」。どっちが砂丘の作物かを必ず区別する。</span></div>
  </div>
