<!DOCTYPE html>

<title>養殖業と栽培漁業のちがい｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gy-safe { inset: 86px 110px 82px; align-content: center; gap: 30px; justify-items:center; }
  .gy-head { display:grid; gap:12px; width:100%; }
  .gy-row { display:grid; grid-template-columns:1fr 1fr; gap:34px; width:100%; }
  .gc { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:28px 30px 30px; display:grid; gap:14px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .gc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .gc .k { font-size:44px; margin-top:8px; }
  .gc .k .blank { font-size:40px; }
  .gc .d { font-size:25px; line-height:1.5; color:var(--sumi-soft); }
  .gc .d .imp { color:var(--imp); font-weight:900; }
  .gc svg { width:100%; height:auto; display:block; }
  .gy-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.5; width:100%; }
  .gy-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .gy-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe gy-safe">
    <div class="gy-head" data-at="0">
      <span class="kicker"><span class="num">2-8</span>　瀬戸内海の漁業</span>
      <h1 class="headline" style="font-size:54px;">「育てる漁業」は<span class="em">2種類</span>ある</h1>
    </div>
    <div class="gy-row">
      <div class="gc" style="--c:#1F6FB2" data-at="1" data-anim="pop">
        <div class="k"><span class="blank" data-fill="1"><span class="bnum">⑨</span><b>養殖</b></span>（＝いけすで育てる漁業）</div>
        <svg viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="680" height="190" fill="#E4F0F8"/>
          <rect x="30" y="30" width="620" height="130" rx="14" fill="#BBD9EC" stroke="#1F6FB2" stroke-width="4"/>
          <g stroke="#1F6FB2" stroke-width="3" fill="none">
            <line x1="30" y1="60" x2="650" y2="60"/><line x1="30" y1="95" x2="650" y2="95"/><line x1="30" y1="130" x2="650" y2="130"/>
          </g>
          <g fill="#C4161C">
            <path d="M140,78 l30,14 l-30,14 l8,-14 Z"/><path d="M300,110 l34,16 l-34,16 l9,-16 Z"/>
            <path d="M460,60 l38,18 l-38,18 l10,-18 Z"/>
          </g>
          <text x="340" y="180" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="21" fill="#134a78">いけす（囲いの中）でずっと育てる</text>
        </svg>
        <div class="d">魚・貝・のりなどを<span class="imp">大きくなるまで育てて</span>出荷する漁業。ずっと人が世話をする。</div>
      </div>
      <div class="gc" style="--c:#2E8B57" data-at="2" data-anim="pop">
        <div class="k"><span class="blank" data-fill="2"><span class="bnum">⑩</span><b>栽培漁業</b></span></div>
        <svg viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="680" height="190" fill="#E4F0F8"/>
          <rect x="30" y="30" width="220" height="130" rx="14" fill="#BBD9EC" stroke="#2E8B57" stroke-width="4"/>
          <text x="140" y="24" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="19" fill="#1c5c38">① 稚魚を育てる</text>
          <g fill="#2E8B57"><path d="M90,92 l18,9 l-18,9 l5,-9 Z"/><path d="M160,72 l18,9 l-18,9 l5,-9 Z"/><path d="M170,118 l18,9 l-18,9 l5,-9 Z"/></g>
          <defs><marker id="ahS" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker></defs>
          <path d="M262,95 L330,95" stroke="#2E8B57" stroke-width="6" marker-end="url(#ahS)"/>
          <text x="296" y="76" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="17" fill="#1c5c38">② 放流</text>
          <rect x="350" y="30" width="300" height="130" rx="14" fill="#9FCBE0" stroke="#1F6FB2" stroke-width="3"/>
          <g fill="#C4161C"><path d="M400,70 l30,15 l-30,15 l8,-15 Z"/><path d="M500,110 l34,16 l-34,16 l9,-16 Z"/><path d="M560,64 l36,17 l-36,17 l10,-17 Z"/></g>
          <text x="500" y="24" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="19" fill="#134a78">③ 海で大きく育ってからとる</text>
        </svg>
        <div class="d">ある程度の大きさまで育てた後、<span class="imp">海に放流</span>し、大きく育ってから計画的に漁をする漁業。</div>
      </div>
    </div>
    <div class="gy-note" data-at="3"><span class="lab">ちがい</span><span><b>⑨＝出荷まで囲いの中</b>／<b>⑩＝とちゅうで海に放す</b>。「放流するかどうか」が分かれ目。</span></div>
    <div class="gy-note" data-at="4"><span class="lab">場所</span><span>波がおだやかな<b>瀬戸内海</b>は、育てる漁業にぴったりの海。両方とも盛ん。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
