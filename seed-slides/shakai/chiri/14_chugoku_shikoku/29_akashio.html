<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>赤潮 ── 瀬戸内海の公害｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ak-safe { inset: 92px 130px 88px; grid-template-columns: 840px 1fr; align-content: center; gap: 54px; align-items: center; }
  .ak-fig { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; box-shadow:0 14px 34px rgba(40,30,10,.12); padding:14px; }
  .ak-fig svg { width:100%; height:auto; display:block; }
  .ak-txt { display:grid; gap:24px; align-content:center; }
  .ak-head { display:grid; gap:12px; }
  .big { position:relative; background:var(--paper-hi); border:3px solid var(--imp); border-radius:20px; padding:26px 30px; display:grid; gap:10px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .big::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--imp); border-radius:17px 0 0 17px; }
  .big .k { font-size:56px; padding-left:10px; }
  .big .k .blank { font-size:52px; }
  .big .b { font-size:25px; line-height:1.5; color:var(--sumi-soft); padding-left:10px; }
  .stp { display:grid; grid-template-columns:52px 1fr; gap:16px; align-items:center; background:var(--paper-hi); border:3px solid var(--sumi-mute); border-radius:14px; padding:14px 20px; }
  .stp .n { width:50px; height:50px; border-radius:50%; background:var(--sumi); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; }
  .stp .t { font-size:24px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .stp .t .imp { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ak-safe">
    <div class="ak-fig" data-at="0" data-anim="left">
      <svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="820" height="470" fill="#F6F5F1"/>
        <rect x="0" y="0" width="820" height="120" fill="#DCEAF4"/>
        <!-- 工場・都市 -->
        <g>
          <rect x="40" y="52" width="120" height="68" fill="#B9B7B1" stroke="#6b6a67" stroke-width="3"/>
          <rect x="180" y="70" width="90" height="50" fill="#C9C7C1" stroke="#6b6a67" stroke-width="3"/>
          <rect x="66" y="20" width="18" height="34" fill="#8B8A88"/>
          <rect x="112" y="26" width="18" height="28" fill="#8B8A88"/>
          <text x="150" y="16" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="19" fill="#4A4947">工場・住宅地</text>
        </g>
        <!-- 海 -->
        <rect x="0" y="120" width="820" height="350" fill="#9FCBE0"/>
        <!-- 排水 -->
        <g data-at="1">
          <defs><marker id="ahA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a6b2f"/></marker></defs>
          <path d="M270,110 C330,120 360,140 396,166" fill="none" stroke="#8a6b2f" stroke-width="8" marker-end="url(#ahA)"/>
          <text x="300" y="98" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="21" fill="#7a5f20">生活排水・工場排水（栄養が多い）</text>
        </g>
        <!-- プランクトン増殖 -->
        <g data-at="2">
          <g fill="#C4161C" opacity=".78">
            <circle cx="420" cy="200" r="16"/><circle cx="480" cy="176" r="22"/><circle cx="540" cy="212" r="18"/>
            <circle cx="600" cy="182" r="24"/><circle cx="660" cy="216" r="16"/><circle cx="720" cy="188" r="20"/>
            <circle cx="450" cy="248" r="20"/><circle cx="520" cy="268" r="16"/><circle cx="590" cy="252" r="22"/>
            <circle cx="660" cy="278" r="18"/><circle cx="730" cy="252" r="16"/><circle cx="380" cy="232" r="14"/>
          </g>
          <text x="580" y="150" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="30" fill="#C4161C" paint-order="stroke" stroke="#9FCBE0" stroke-width="6">プランクトンの異常発生</text>
        </g>
        <!-- 魚が死ぬ -->
        <g data-at="3">
          <g fill="#5A5955" stroke="#3a3a39" stroke-width="2.5">
            <path d="M200,360 C240,330 320,330 356,358 L390,336 L382,358 L390,382 L356,360 C320,388 240,388 200,360 Z"/>
          </g>
          <g stroke="#fff" stroke-width="4" stroke-linecap="round">
            <line x1="244" y1="348" x2="258" y2="362"/><line x1="258" y1="348" x2="244" y2="362"/>
          </g>
          <text x="290" y="424" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="23" fill="#2b2b2a" paint-order="stroke" stroke="#9FCBE0" stroke-width="6">酸素が足りず、魚や貝が死ぬ</text>
        </g>
      </svg>
    </div>
    <div class="ak-txt">
      <div class="ak-head" data-at="0">
        <span class="kicker"><span class="num">2-10</span>　瀬戸内海の公害</span>
        <h1 class="headline" style="font-size:50px;">海が<span class="em">赤く</span>そまる公害</h1>
      </div>
      <div class="big" data-at="2" data-anim="pop">
        <div class="k"><span class="blank" data-fill="2"><span class="bnum">⑪</span><b>赤潮</b></span></div>
        <div class="b">プランクトンの<span style="color:var(--imp);font-weight:900">異常発生</span>で海が汚れ、魚や貝に大きな被害を出す現象。</div>
      </div>
      <div class="stp" data-at="1"><span class="n">1</span><span class="t">生活排水・工場排水が海に流れこみ、<span class="imp">栄養が多すぎる海</span>になる。</span></div>
      <div class="stp" data-at="2"><span class="n">2</span><span class="t">プランクトンが大量に発生し、海が赤茶色に見える。</span></div>
      <div class="stp" data-at="3"><span class="n">3</span><span class="t">水中の<span class="imp">酸素が不足</span>し、養殖の魚まで死んでしまう。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
