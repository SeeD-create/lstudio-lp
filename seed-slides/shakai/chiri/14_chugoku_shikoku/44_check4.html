<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 商工業と交通｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1450px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 36px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:96px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size: 31px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
  .ans .mark.blank { min-width: 120px; padding: 0 14px 4px; margin: 0; }
  .ans .exp .blank--para { padding: 6px 14px; }
  .ans .exp .blank--para b { color: var(--imp); }
  .ans .exp .blank--para .hl { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認・商工業と交通</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 一問一答</div>
      <p class="qtext" data-at="0">1988年に開通し、<span class="u">岡山県と香川県</span>を結ぶ本四連絡橋は<br>何ルートか。また、そこにかかる橋の名前は？</p>
      <div class="ans" data-at="1">
        <span class="mark" data-at="1" data-anim="pop">A</span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b><span class="hl">児島・坂出ルート</span>／橋は<span class="hl">瀬戸大橋</span>。<br>ついでに、1999年の広島県⇄愛媛県は<span class="hl">尾道・今治ルート（しまなみ海道）</span>。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
