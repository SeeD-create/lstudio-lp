<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中国・四国地方の3区分｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 92px 130px 92px; align-content: start; gap: 36px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 30px 30px 32px; min-height: 430px; display: grid; align-content: start; gap: 18px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--c); opacity:.55; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); line-height:1.15; }
  .cc__ttl .blank { font-size:34px; }
  .cc__ess { font-size:26px; color:var(--sumi-soft); line-height:1.5; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:8px 18px; border-radius:999px; background:var(--c); color:#fff; font-weight:900; font-size:22px; }
  .ex2 { --cat:#1A1A1A; border-left-color:#1A1A1A; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　地域区分</span>
      <h1 class="headline" style="font-size:60px;">中国・四国地方は、<span class="goldem">3つ</span>に分けられる</h1>
    </div>
    <div class="deck-row">
      <div class="cc" style="--c:#2E6DA4" data-at="1" data-anim="pop">
        <div class="cc__no">北</div>
        <div class="cc__ttl"><span class="blank" data-fill="1"><span class="bnum">①</span><b>山陰</b></span></div>
        <div class="cc__ess">中国山地より<b>北</b>＝日本海がわ。<br>鳥取県・島根県。</div>
        <span class="cc__pill">日本海側の気候</span>
      </div>
      <div class="cc" style="--c:#D98324" data-at="2" data-anim="pop">
        <div class="cc__no">中</div>
        <div class="cc__ttl"><span class="blank" data-fill="2"><span class="bnum">②</span><b>瀬戸内</b></span></div>
        <div class="cc__ess">2つの山地に<b>はさまれた</b>まん中。<br>内海をかこむ地域。</div>
        <span class="cc__pill">まん中の気候</span>
      </div>
      <div class="cc" style="--c:#2E8B57" data-at="3" data-anim="pop">
        <div class="cc__no">南</div>
        <div class="cc__ttl"><span class="blank" data-fill="3"><span class="bnum">③</span><b>南四国</b></span></div>
        <div class="cc__ess">四国山地より<b>南</b>＝太平洋がわ。<br>高知県・徳島県南部。</div>
        <span class="cc__pill">太平洋側の気候</span>
      </div>
    </div>
    <div class="example ex2" data-at="4">
      <span class="ex-tag">名前もう1つ</span>
      <span>まん中のうち<b>本州側</b>だけを、とくに<span class="blank" data-fill="4"><span class="bnum">④</span><b>山陽</b></span>という。（「陰」と対になる言葉）</span>
    </div>
    <div class="example ex2" data-at="5">
      <span class="ex-tag">つかみ方</span>
      <span>県で分けるのではなく、<span class="imp">中国山地・四国山地という2本の線</span>で「北・まん中・南」に切ると考える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
