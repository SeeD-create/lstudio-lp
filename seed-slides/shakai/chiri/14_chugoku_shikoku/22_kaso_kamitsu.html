<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>語句 ── 過疎と過密｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kg-safe { inset: 96px 140px 92px; align-content: center; gap: 40px; }
  .kg-head { display:grid; gap:12px; }
  .kg-row { display:grid; grid-template-columns:1fr 96px 1fr; gap:26px; align-items:center; }
  .wd { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:32px 34px; display:grid; gap:14px; min-height:330px; align-content:start; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .wd::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .wd .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; color:var(--c); margin-top:10px; }
  .wd .d { font-size:28px; line-height:1.55; color:var(--sumi-soft); }
  .wd .d .imp { color:var(--imp); font-weight:900; }
  .wd .ex { font-size:24px; color:var(--sumi); background:var(--paper-lo); border-radius:12px; padding:12px 18px; font-weight:700; }
  .vs { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi-mute); text-align:center; }
  .kg-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.5; }
  .kg-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kg-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe kg-safe">
    <div class="kg-head" data-at="0">
      <span class="kicker"><span class="num">2-3</span>　語句</span>
      <h1 class="headline" style="font-size:56px;">人が<span class="em">減りすぎ</span>と<span class="em">集まりすぎ</span></h1>
    </div>
    <div class="kg-row">
      <div class="wd" style="--c:#C4161C" data-at="1" data-anim="pop">
        <div class="t"><span class="blank" data-fill="1"><b>過疎</b></span></div>
        <div class="d">人口が<span class="imp">極端に減り</span>、日常生活が不便になるような現象。</div>
        <div class="ex">例：中国山地の山あいの村。バスが廃止、学校が統合、店が閉まる。</div>
      </div>
      <div class="vs" data-at="2">⇔</div>
      <div class="wd" style="--c:#3A3A39" data-at="2" data-anim="pop">
        <div class="t"><span class="blank" data-fill="2"><b>過密</b></span></div>
        <div class="d">人口が<span class="imp">集中しすぎ</span>、ゴミの問題・土地の値段が高くなるなどの問題が起きる現象。</div>
        <div class="ex">例：大都市。住宅不足・通勤ラッシュ・交通渋滞。</div>
      </div>
    </div>
    <div class="kg-note" data-at="3"><span class="lab">★頻出</span><span>記述で問われる。「<b>人口が減って社会生活が困難になる現象</b>」を漢字2字で。漢字も書けるように。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
