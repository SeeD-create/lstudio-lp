<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>同じ地方なのに、雨の量が3倍ちがう｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hk-safe { inset: 110px 150px 100px; align-content: center; gap: 46px; }
  .hk-head { display: grid; gap: 14px; }
  .hk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .fact { background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.10); padding: 38px 40px; display: grid; gap: 14px; align-content: start; }
  .fact .fnum { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:92px; line-height:1; color: var(--imp); }
  .fact .fttl { font-size: 34px; font-weight: 900; color: var(--sumi); }
  .fact .fbody { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); }
  .hk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:30px; line-height:1.5; }
  .hk-note b { color: #fff; }
  .hk-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　導入</span>
      <h1 class="headline" style="font-size:66px;">同じ地方なのに、雨の量が<span class="em">3倍</span>ちがう？</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">2666</div><div class="fttl">高知（南四国）</div><div class="fbody">年間降水量 約2666mm。日本でもトップクラスの雨。夏の台風でどしゃぶり。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">1143</div><div class="fttl">岡山（瀬戸内）</div><div class="fbody">年間降水量 約1143mm。全国でいちばん雨が少ないグループ。水不足になりやすい。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">1931</div><div class="fttl">鳥取（山陰）</div><div class="fbody">年間降水量 約1931mm。しかも<span class="imp">冬</span>に多い。日本海側だから雪が降る。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span class="lab">ねらい</span><span>犯人は<b>中国山地</b>と<b>四国山地</b>。この2つの山地が地方を3本の帯に切り、<b>気候も産業もぜんぶ変える</b>。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
