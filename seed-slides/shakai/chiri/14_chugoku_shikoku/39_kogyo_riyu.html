<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>なぜ瀬戸内に工業地域ができたのか｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ry-safe { inset: 92px 130px 88px; align-content: center; gap: 34px; }
  .ry-head { display:grid; gap:12px; }
  .ry-row { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .rc { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:20px; padding:26px 28px 28px; display:grid; gap:14px; align-content:start; min-height:330px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .rc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:17px 17px 0 0; }
  .rc .n { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--c); opacity:.5; line-height:1; margin-top:8px; }
  .rc .h { font-size:32px; font-weight:900; color:var(--sumi); }
  .rc .b { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .rc .b .imp { color:var(--imp); font-weight:900; }
  .ans { background:var(--paper-hi); border:4px solid var(--imp); border-radius:20px; padding:26px 34px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .ans .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--imp); letter-spacing:.1em; }
  .ans .txt { font-size:30px; line-height:1.5; color:var(--sumi); font-weight:700; margin-top:8px; }
  .ans .txt .blank { font-size:29px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ry-safe">
    <div class="ry-head" data-at="0">
      <span class="kicker"><span class="num">3-6</span>　⑪　発達した理由</span>
      <h1 class="headline" style="font-size:54px;">なぜ<span class="em">ここ</span>に工業地域ができたのか</h1>
    </div>
    <div class="ry-row">
      <div class="rc" style="--c:#2E8B57" data-at="1" data-anim="pop">
        <div class="n">1</div>
        <div class="h">広い土地が手に入った</div>
        <div class="b">塩田のあと地や、遠浅の海の<span class="imp">埋め立て地</span>を工業用地にできた。<br>（水島地区・徳山など）</div>
      </div>
      <div class="rc" style="--c:#1F6FB2" data-at="2" data-anim="pop">
        <div class="n">2</div>
        <div class="h">海の輸送に便利</div>
        <div class="b">工場が海に面しているので、原料の<span class="imp">輸入</span>と製品の<span class="imp">輸送</span>を大型船でそのまま行える。</div>
      </div>
      <div class="rc" style="--c:#D98324" data-at="3" data-anim="pop">
        <div class="n">3</div>
        <div class="h">海がおだやか・気候がよい</div>
        <div class="b">瀬戸内海は波がおだやかで、雨も少ない。船も工場も動かしやすい。</div>
      </div>
    </div>
    <div class="ans" data-at="3">
      <div class="lab">記述の答え方</div>
      <div class="txt">「<span class="blank" data-fill="3"><b>塩田のあと地や遠浅の海の埋め立てで広い工業用地が得られ、海に面していて原料の輸入や製品の輸送に便利だった</b></span>から。」</div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
