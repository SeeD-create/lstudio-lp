<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>語句 ── 地方中枢都市｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ch-safe { inset: 96px 140px 92px; align-content: center; gap: 38px; }
  .ch-head { display:grid; gap:12px; }
  .def { background:var(--paper-hi); border:4px solid var(--sumi); border-radius:22px; padding:30px 38px; box-shadow:0 14px 30px rgba(40,30,10,.10); display:grid; gap:12px; }
  .def .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); }
  .def .d { font-size:29px; line-height:1.55; color:var(--sumi-soft); }
  .def .d .imp { color:var(--imp); font-weight:900; }
  .cty-row { display:grid; grid-template-columns:repeat(4,1fr); gap:26px; }
  .cty { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:18px; padding:22px 24px; display:grid; gap:8px; box-shadow:0 12px 26px rgba(40,30,10,.09); text-align:center; }
  .cty::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--c); border-radius:15px 15px 0 0; }
  .cty .rg { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:21px; color:var(--sumi-mute); margin-top:8px; }
  .cty .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--c); }
  .ch-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.5; }
  .ch-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .ch-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ch-safe">
    <div class="ch-head" data-at="0">
      <span class="kicker"><span class="num">3-7</span>　語句</span>
      <h1 class="headline" style="font-size:54px;">地方の<span class="em">かなめ</span>になる都市</h1>
    </div>
    <div class="def" data-at="1" data-anim="pop">
      <div class="t"><span class="blank" data-fill="1"><b>地方中枢都市</b></span></div>
      <div class="d">地方の<span class="imp">政治や経済の中心</span>となる都市で、大企業の支社や中央官庁の出先機関などがある。</div>
    </div>
    <div class="cty-row">
      <div class="cty" style="--c:#C0504D" data-at="2" data-anim="pop"><div class="rg">北海道地方</div><div class="nm">札幌</div></div>
      <div class="cty" style="--c:#4F81BD" data-at="2" data-anim="pop"><div class="rg">東北地方</div><div class="nm">仙台</div></div>
      <div class="cty" style="--c:#C4161C" data-at="3" data-anim="pop"><div class="rg">中国・四国地方</div><div class="nm">広島</div></div>
      <div class="cty" style="--c:#2E8B57" data-at="4" data-anim="pop"><div class="rg">九州地方</div><div class="nm">福岡・北九州</div></div>
    </div>
    <div class="ch-note" data-at="4"><span class="lab">★頻出</span><span>4つセットで <b>札幌・仙台・広島・福岡（北九州）</b>。この単元では<b>広島</b>が答えになる。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
