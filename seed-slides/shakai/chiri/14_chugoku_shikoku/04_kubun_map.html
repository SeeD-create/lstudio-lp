        <h1 class="headline" style="font-size:50px;">3本の帯を、<span class="em">上から</span>のせていく</h1>
      </div>
      <div class="band" style="--c:#2E6DA4" data-at="1"><span class="bar"></span><span class="t"><span class="nm">山陰</span><span class="ds">鳥取県・島根県。<span class="imp">中国山地の北</span>。</span></span></div>
      <div class="band" style="--c:#D98324" data-at="2"><span class="bar"></span><span class="t"><span class="nm">瀬戸内</span><span class="ds">瀬戸内海のまわり。<span class="imp">2つの山地の間</span>。</span></span></div>
      <div class="band" style="--c:#2E8B57" data-at="3"><span class="bar"></span><span class="t"><span class="nm">南四国</span><span class="ds">高知県など。<span class="imp">四国山地の南</span>。</span></span></div>
      <div class="mp-note" data-at="4"><b>山陽</b>＝瀬戸内のうち<b>本州側</b>。「山陰／山陽」はセットで覚える。</div>
