<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>呉市と福山市 ── 造船と鉄鋼｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kf-safe { inset: 96px 140px 92px; align-content: center; gap: 38px; }
  .kf-head { display:grid; gap:12px; }
  .kf-row { display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  .tc { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:30px 32px 32px; display:grid; gap:14px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .tc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .tc .no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--c); margin-top:8px; }
  .tc .k { font-size:54px; }
  .tc .k .blank { font-size:50px; }
  .tc-fig { height:240px; border-radius:16px; border:2px solid var(--hair); background:var(--paper-lo);
            box-shadow:0 8px 20px rgba(40,30,10,.09); overflow:hidden; }
  .tc .b { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .tc .b .imp { color:var(--imp); font-weight:900; }
  .kf-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.5; }
  .kf-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kf-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kf-safe">
    <div class="kf-head" data-at="0">
      <span class="kicker"><span class="num">3-2</span>　広島県の工業都市</span>
      <h1 class="headline" style="font-size:56px;">同じ広島県でも、<span class="em">都市ごとに得意</span>がちがう</h1>
    </div>
    <div class="kf-row">
      <div class="tc" style="--c:#1F6FB2" data-at="1" data-anim="pop">
        <div class="no">②　造船業が盛ん</div>
        <div class="k"><span class="blank" data-fill="1"><b>呉市</b></span></div>
        <div class="figure tc-fig"><img src="assets/zosen.webp" alt="造船所 ── ドックに置かれた建造中の大型船と、赤い大型クレーン"></div>
        <div class="b">明治から軍港・造船の町。<span class="imp">第一次世界大戦のころ</span>から造船業が発達した。</div>
      </div>
      <div class="tc" style="--c:#8B5A2B" data-at="2" data-anim="pop">
        <div class="no">③　鉄鋼業が盛ん</div>
        <div class="k"><span class="blank" data-fill="2"><b>福山市</b></span></div>
        <div class="figure tc-fig"><img src="assets/seitetsu.webp" alt="製鉄所 ── 高炉と煙突がならぶ工場と、オレンジ色に光るとけた鉄"></div>
        <div class="b">第二次世界大戦後、大きな<span class="imp">製鉄所</span>がつくられた。鉄鋼業の町として発展。</div>
      </div>
    </div>
    <div class="kf-note" data-at="3"><span class="lab">★頻出</span><span>「造船＝<b>呉</b>」「鉄鋼＝<b>福山</b>」「自動車＝<b>広島</b>」。広島県の3都市はセットで問われる。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
