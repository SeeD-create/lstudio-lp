<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3つの気候 ── 帯ごとに気候が変わる｜中1地理 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 92px 130px 88px; align-content: center; gap: 40px; }
  .kk-head { display:grid; gap:12px; }
  .kk-row { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .kb { position:relative; background:var(--paper-hi); border:3px solid var(--c); border-radius:22px; padding:30px 28px 32px; display:grid; gap:14px; align-content:start; min-height:400px; box-shadow:0 14px 30px rgba(40,30,10,.10); }
  .kb::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:19px 19px 0 0; }
  .kb .area { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--c); margin-top:8px; }
  .kb-fig { height:190px; border-radius:14px; border:2px solid var(--hair); background:var(--paper-lo);
            box-shadow:0 6px 16px rgba(40,30,10,.08); overflow:hidden; }
  .kb .k { font-size:34px; font-weight:900; }
  .kb .k .blank { font-size:31px; }
  .kb .b { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .kb .pill { justify-self:start; margin-top:auto; padding:8px 18px; border-radius:999px; background:var(--c); color:#fff; font-weight:900; font-size:21px; }
  .kk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; font-size:28px; line-height:1.5; }
  .kk-note .lab { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--gold-soft); white-space:nowrap; }
  .kk-note b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="kicker"><span class="num">1-6</span>　気候</span>
      <h1 class="headline" style="font-size:58px;">帯が変われば、<span class="em">気候</span>も変わる</h1>
    </div>
    <div class="kk-row">
      <div class="kb" style="--c:#2E6DA4" data-at="1" data-anim="pop">
        <div class="area">山陰</div>
        <div class="figure kb-fig"><img src="assets/sanin_fuyu.webp" alt="山陰の冬 ── 雪におおわれた日本海側の海辺の町と荒れた海"></div>
        <div class="k"><span class="blank" data-fill="1"><span class="bnum">①</span><b>日本海側の気候</b></span></div>
        <div class="b"><span class="imp">冬</span>に雨や雪が多い。北西の季節風が日本海の水蒸気を運んでくる。</div>
        <span class="pill">冬に多い</span>
      </div>
      <div class="kb" style="--c:#D98324" data-at="2" data-anim="pop">
        <div class="area">瀬戸内</div>
        <div class="figure kb-fig"><img src="assets/setouchi_tatoukai.webp" alt="瀬戸内海 ── おだやかな内海に小さな島がいくつも浮かぶ多島海"></div>
        <div class="k"><span class="blank" data-fill="2"><span class="bnum">②</span><b>瀬戸内の気候</b></span></div>
        <div class="b">1年を通して<span class="imp">雨が少ない</span>。あたたかいが水不足になりやすい。</div>
        <span class="pill">少雨</span>
      </div>
      <div class="kb" style="--c:#2E8B57" data-at="3" data-anim="pop">
        <div class="area">南四国</div>
        <div class="figure kb-fig"><img src="assets/nankoku_ooame.webp" alt="南四国 ── 台風の大雨で白くけむる太平洋がわの海岸"></div>
        <div class="k"><span class="blank" data-fill="3"><span class="bnum">③</span><b>太平洋側の気候</b></span></div>
        <div class="b"><span class="imp">夏</span>に雨が多い。南東の季節風と台風。冬もあたたかい。</div>
        <span class="pill">夏に多い</span>
      </div>
    </div>
    <div class="kk-note" data-at="4"><span class="lab">対応表</span><span>山陰＝<b>日本海側</b>／瀬戸内＝<b>瀬戸内</b>／南四国＝<b>太平洋側</b>。区分の名前とセットで丸ごと覚える。</span></div>
  </div>
  <div class="seed-foot"><span>第14章 中国・四国地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
