      </div>

      <div class="pf" style="--c:#4F81BD" data-at="2"><span class="bar"></span><span class="t"><span class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>徳島県</b></span></span><span class="ds"><span class="imp">吉野川</span>が流れる。神戸・鳴門ルートで本州へ。</span></span></div>
