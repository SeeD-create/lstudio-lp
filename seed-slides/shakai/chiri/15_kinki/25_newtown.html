<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ニュータウン ── 郊外の計画都市｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 88px 140px 88px; align-content: start; gap: 32px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 39px; line-height: 1.6; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 28px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 42px; }
  .nt-row { display:grid; grid-template-columns: repeat(6,1fr); gap: 20px; }
  .nt { background: var(--paper-hi); border-radius: 16px; border: 3px solid #2E7D32; padding: 20px 12px; text-align:center; box-shadow:0 10px 22px rgba(40,30,10,.08); }
  .nt .nh { font-weight:900; font-size:30px; color:#1E5B22; }
  .nt .nb { font-size:19px; color:var(--sumi-mute); font-weight:700; margin-top:6px; }
  .df-row { display:grid; grid-template-columns: repeat(2,1fr) 420px; gap: 30px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 28px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); align-content:start; min-height: 340px; }
  .pt .ph { font-weight:900; font-size:28px; color:var(--c); }
  .pt .pb { font-size:25px; line-height:1.45; color:var(--sumi-soft); }
  .df-fig { position:relative; min-height: 340px; border-radius: 18px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.12); overflow: hidden; }
  .df-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-5</span>　開発④</span>
      <h1 class="headline" style="font-size:58px;">郊外に、まるごと<span class="em">新しい町</span>をつくる</h1>
    </div>
    <p class="df-def" data-at="1"><span class="blank" data-fill="1"><span class="bnum">⑤</span><b>ニュータウン</b></span>…大都市の<span class="imp">郊外</span>に計画的に作られた住宅地（地図中■印）。</p>
    <div class="nt-row">
      <div class="nt" data-at="2" data-anim="pop"><div class="nh">千里</div><div class="nb">大阪府北部</div></div>
      <div class="nt" data-at="2" data-anim="pop"><div class="nh">泉北</div><div class="nb">大阪府南部</div></div>
      <div class="nt" data-at="3" data-anim="pop"><div class="nh">西神</div><div class="nb">神戸市西部</div></div>
      <div class="nt" data-at="3" data-anim="pop"><div class="nh">須磨</div><div class="nb">神戸市西部</div></div>
      <div class="nt" data-at="4" data-anim="pop"><div class="nh">平城・相楽</div><div class="nb">奈良県北部</div></div>
      <div class="nt" data-at="4" data-anim="pop"><div class="nh">洛西</div><div class="nb">京都市西部</div></div>
    </div>
    <div class="df-row">
      <div class="pt" style="--c:#2E7D32" data-at="5" data-anim="pop"><div class="ph">なぜ作られた？</div><div class="pb">高度経済成長期、大阪・神戸・京都に人が集まりすぎて住宅が足りなくなったから。</div></div>
      <div class="pt" style="--c:#C0392B" data-at="5" data-anim="pop"><div class="ph">今のなやみ</div><div class="pb">同じ時期に入居した人がいっせいに年をとり、<b>高齢化</b>と<b>建物の老朽化</b>が進んでいる。</div></div>
      <div class="figure df-fig" data-at="2" data-anim="pop"><img src="assets/newtown.webp" alt="ニュータウン ── 郊外の丘に計画的に並ぶ集合住宅"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
