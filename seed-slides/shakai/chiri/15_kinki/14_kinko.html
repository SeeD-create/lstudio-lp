<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>近郊農業 ── 大阪平野｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 90px 140px 90px; align-content: start; gap: 34px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 40px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 30px 40px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 42px; }
  .df-row { display: grid; grid-template-columns: repeat(3, 1fr) 400px; gap: 30px; }
  .pt { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); padding: 26px 30px; display:grid; gap:10px; box-shadow:0 12px 28px rgba(40,30,10,.08); align-content:start; min-height: 275px; }
  .pt .ph { font-weight:900; font-size:29px; color:var(--c); }
  .pt .pb { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .df-fig { position:relative; min-height: 275px; border-radius: 20px; border: 3px solid var(--cat); box-shadow: 0 14px 32px rgba(40,30,10,.12); overflow: hidden; }
  .df-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:28px; line-height:1.45; }
  .df-note b { color:#fff; }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-1</span>　農業</span>
      <h1 class="headline" style="font-size:60px;">大阪平野は<span class="em">近郊農業</span>が盛ん</h1>
    </div>
    <p class="df-def" data-at="1"><span class="imp">近郊農業</span>…<span class="blank" data-fill="1"><b>大都市</b></span>の周辺で行われる農業で、都市へ出荷することを目的に、<span class="blank" data-fill="2"><b>野菜や花</b></span>などの<span class="blank" data-fill="3"><b>商品作物</b></span>を栽培する。</p>
    <div class="df-row">
      <div class="pt" style="--c:#2E8B57" data-at="4" data-anim="pop"><div class="ph">近い＝新鮮</div><div class="pb">まちのすぐそばだから、とれたてをその日のうちに届けられる。</div></div>
      <div class="pt" style="--c:#B9770E" data-at="4" data-anim="pop"><div class="ph">近い＝安い</div><div class="pb">運ぶ距離が短く、輸送費がおさえられる。</div></div>
      <div class="pt" style="--c:#C0392B" data-at="4" data-anim="pop"><div class="ph">近畿では大阪平野</div><div class="pb">大阪を中心とする大きな消費地が、すぐ目の前にある。</div></div>
      <div class="figure df-fig" data-at="2" data-anim="pop"><img src="assets/kinko_nogyo.webp" alt="近郊農業 ── 大都市のすぐそばに広がる野菜畑"></div>
    </div>
    <div class="df-note" data-at="4"><span>ひとことで</span><span>この農業＝<b>まちのとなりで、作物をつくって売る農業</b>。「近郊」＝「近くの郊外」と読む。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
</html>
