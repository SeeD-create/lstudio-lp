<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">

      <h1 class="headline" style="font-size:58px;">海の上の空港 ── <span class="em">1994年開港</span></h1>
    </div>
    <p class="df-def" data-at="1"><span class="blank" data-fill="1"><span class="bnum">④</span><b>関西国際空港</b></span>…<span class="imp">1994年</span>に開港した、日本初の<span class="imp">24時間</span>離着陸できる空港。</p>
