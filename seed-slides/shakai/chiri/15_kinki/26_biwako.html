<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>琵琶湖を守る ── リンをふくむ合成洗剤の禁止｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 84px 130px 84px; align-content: start; gap: 28px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 38px; line-height: 1.6; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 26px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 40px; }
  .flow { display:grid; grid-template-columns: 1fr 60px 1fr 60px 1fr 428px; align-items:stretch; }
  .fbox { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 24px; display:grid; gap:8px; box-shadow:0 12px 26px rgba(40,30,10,.08); min-height: 362px; align-content:start; }
  .fbox .fh { font-weight:900; font-size:26px; color:var(--c); }
  .fbox .fb { font-size:23px; line-height:1.45; color:var(--sumi-soft); }
  .bw-fig { position:relative; margin-left: 28px; min-height: 362px; border-radius: 18px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.12); overflow: hidden; }
  .bw-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .arrow { display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--imp); font-weight:900; }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .df-note b { color:#fff; }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-6</span>　保全①</span>
      <h1 class="headline" style="font-size:56px;">日本一の湖 ── <span class="em">京阪神の水がめ</span>を守る</h1>
    </div>
    <p class="df-def" data-at="1"><span class="blank" data-fill="1"><span class="bnum">⑥</span><b>琵琶湖</b></span>…汚染がひどいため、滋賀県は<span class="blank" data-fill="2"><span class="bnum">⑦</span><b>リン</b></span>をふくむ合成洗剤を禁止した。</p>
    <div class="flow">
      <div class="fbox" style="--c:#1F6FB2" data-at="2" data-anim="pop"><div class="fh">日本一大きい湖</div><div class="fb">滋賀県のまん中にある。ここから<b>淀川</b>が流れ出て、京都・大阪・神戸の水道水になる。だから「<b>京阪神の水がめ</b>」。</div></div>
      <div class="arrow" data-at="3">▶</div>
      <div class="fbox" style="--c:#B9770E" data-at="3" data-anim="pop"><div class="fh">水が汚れた</div><div class="fb">生活排水にふくまれる<b>ある成分</b>が流れこみ、プランクトンが異常に増えて赤潮が発生した。</div></div>
      <div class="arrow" data-at="4">▶</div>
      <div class="fbox" style="--c:#2E7D32" data-at="4" data-anim="pop"><div class="fh">県が動いた</div><div class="fb">滋賀県は<b>その成分をふくむ合成洗剤を禁止</b>。住民も粉せっけんに切りかえ、水質はよくなってきた。</div></div>
      <div class="figure bw-fig" data-at="2" data-anim="pop"><img src="assets/biwako.webp" alt="琵琶湖 ── 湖をとりかこむ水源の森と山なみ"></div>
    </div>
    <div class="df-note" data-at="5"><span>テスト頻出</span><span>問われ方は2つ。「日本最大の湖は？」と「滋賀県がとった対策は？」の2つ。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
