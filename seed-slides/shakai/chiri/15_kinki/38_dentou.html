<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>京都と奈良の伝統工業｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 88px 130px 88px; align-content: start; gap: 32px; }
  .df-head { display: grid; gap: 10px; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  .card { background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c); padding: 30px 34px; box-shadow: 0 14px 32px rgba(40,30,10,.10); display:grid; gap:16px; align-content:start; }
  .card .ch { display:flex; align-items:center; gap:16px; }
  .card .ch .cn { width:56px; height:56px; border-radius:50%; background:var(--c); color:#fff; font-weight:900; font-size:27px; display:flex; align-items:center; justify-content:center; flex:none; }
  .card .ch .ct { font-size:38px; font-weight:900; color:var(--sumi); display:flex; align-items:baseline; }
  .card .ch .ct .blank { font-size:38px; min-width:220px; }
  .cfig { position:relative; height: 240px; border-radius: 16px; border: 2px solid var(--hair); box-shadow: 0 10px 24px rgba(40,30,10,.10); overflow: hidden; }
  .cfig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .items { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .item { background: var(--paper-lo); border-radius:14px; padding:16px 18px; }
  .item .ih { font-size:28px; font-weight:900; color:var(--c); }
  .item .ib { font-size:21px; color:var(--sumi-soft); line-height:1.4; margin-top:5px; }
  .card .cnote { font-size:24px; color:var(--sumi-soft); line-height:1.45; }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .df-note b { color:#fff; }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-8</span>　伝統工業</span>
      <h1 class="headline" style="font-size:54px;">都だった町には、<span class="em">伝統工業</span>が残る</h1>
    </div>
    <div class="two">
      <div class="card" style="--c:#7D5BA6" data-at="1" data-anim="left">
        <div class="ch"><span class="cn">⑧</span><span class="ct"><span class="blank" data-fill="1"><b>京都市</b></span></span></div>
        <div class="figure cfig"><img src="assets/nishijinori.webp" alt="西陣織 ── 木製の織機にかけられた金糸入りの絹織物"></div>
        <div class="items">
          <div class="item" data-at="2"><div class="ih">西陣織</div><div class="ib">高級な絹織物。平安京のころからの技術。</div></div>
          <div class="item" data-at="2"><div class="ih">清水焼</div><div class="ib">清水寺のふもとで発展した焼き物。</div></div>
        </div>
        <div class="cnote" data-at="3">1000年以上、都が置かれた町。貴族や寺社が高級品を注文し続けたことで、職人の技が受けつがれた。</div>
      </div>
      <div class="card" style="--c:#B9770E" data-at="4" data-anim="right">
        <div class="ch"><span class="cn">⑥</span><span class="ct"><span class="blank" data-fill="4"><b>奈良市</b></span></span></div>
        <div class="figure cfig"><img src="assets/narafude.webp" alt="奈良の筆と墨 ── 白い背景に置かれた書道の筆と黒い墨"></div>
        <div class="items">
          <div class="item" data-at="5"><div class="ih">筆</div><div class="ib">書道に使う筆。奈良筆として有名。</div></div>
          <div class="item" data-at="5"><div class="ih">墨</div><div class="ib">奈良墨。全国の生産の大部分をしめる。</div></div>
        </div>
        <div class="cnote" data-at="5">かつて<b>平城京</b>が置かれた町。寺で写経に使う筆と墨が必要だったことから生産が始まった。</div>
      </div>
    </div>
    <div class="df-note" data-at="5"><span>混同注意</span><span><b>京都＝西陣織・清水焼</b>／<b>奈良＝筆・墨</b>。「筆・墨といえば？」で都市名が出てくるように。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
