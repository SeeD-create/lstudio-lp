<style>

  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-3</span>　開発②</span>
      <h1 class="headline" style="font-size:56px;">山をけずって、海をうめる ── <span class="em">2つの人工島</span></h1>
    </div>
    <p class="df-def" data-at="1"><span class="blank" data-fill="1"><span class="bnum">②</span><b>ポートアイランド</b></span>・<span class="blank" data-fill="2"><span class="bnum">③</span><b>六甲アイランド</b></span>…<span class="imp">六甲山</span>を切り開いた土砂を使って海を埋め立てた。</p>
    <div class="figbox" data-at="3">
      <svg viewBox="0 0 1580 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="1580" height="300" fill="#FBFBFA"/>

        <path d="M60,250 L240,60 L420,250 Z" fill="#C8B48C" stroke="#7A5A12" stroke-width="3"/>

        <!-- 矢印1 -->
        <path d="M450,170 L600,170" stroke="#C4161C" stroke-width="8" stroke-linecap="round"/>
        <path d="M582,148 L612,170 L582,192 Z" fill="#C4161C"/>
        <text x="530" y="140" font-size="24" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">土砂を運ぶ</text>
        <!-- 海と埋め立て -->
        <rect x="640" y="120" width="900" height="140" fill="#CFE3F0"/>
        <rect x="640" y="60" width="900" height="60" fill="#DEDDD8" stroke="#7c8189" stroke-width="2"/>
        <text x="1090" y="100" font-size="26" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">神戸市の市街地</text>
        <rect x="770" y="150" width="290" height="86" rx="10" fill="#E4867A" stroke="#8E2A1E" stroke-width="3"/>
        <text x="915" y="208" font-size="40" font-weight="900" fill="#fff" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">②</text>
        <rect x="1120" y="150" width="290" height="86" rx="10" fill="#E4867A" stroke="#8E2A1E" stroke-width="3"/>
        <text x="1265" y="208" font-size="40" font-weight="900" fill="#fff" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">③</text>
        <text x="1090" y="284" font-size="22" font-weight="900" fill="#0B4A85" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">大阪湾（埋め立てて人工島に）</text>
      </svg>
    </div>
    <div class="df-note" data-at="4"><span>一石二鳥</span><span>山をけずれば<b>住宅地</b>ができ、その土砂で海を埋めれば<b>港や工業用地</b>ができる。せまい神戸ならではの開発。</span></div>
  </div>
