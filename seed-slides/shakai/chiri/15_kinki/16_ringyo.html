<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>紀伊山地の林業｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 84px 140px 84px; align-content: start; gap: 28px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 38px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 26px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 40px; }
  .flow { display:grid; grid-template-columns: 1fr 70px 1fr 70px 1fr 428px; align-items:stretch; gap: 0; }
  .fbox { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 24px; display:grid; gap:8px; box-shadow:0 12px 26px rgba(40,30,10,.08); min-height: 336px; align-content:start; }
  .fbox .fh { font-weight:900; font-size:26px; color:var(--c); }
  .fbox .fb { font-size:23px; line-height:1.45; color:var(--sumi-soft); }
  .rg-fig { position:relative; margin-left: 28px; min-height: 336px; border-radius: 18px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.12); overflow: hidden; }
  .rg-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .arrow { display:flex; align-items:center; justify-content:center; font-size:44px; color:var(--imp); font-weight:900; }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .df-note b { color:#fff; }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-3</span>　山の仕事</span>
      <h1 class="headline" style="font-size:56px;">紀伊山地の山の仕事と、その<span class="em">なやみ</span></h1>
    </div>
    <p class="df-def" data-at="1">紀伊山地…<span class="blank" data-fill="1"><span class="bnum">③</span><b>林業</b></span>が盛ん。近年は外国産の安い木材の輸入が増え、働く人が<span class="blank" data-fill="2"><span class="bnum">④</span><b>減少</b></span>している。</p>
    <div class="flow">
      <div class="fbox" style="--c:#2E7D32" data-at="3" data-anim="pop"><div class="fh">すぎ・ひのきの産地</div><div class="fb">雨が多く木がよく育つ。吉野すぎ・尾鷲ひのきが有名。<b>私有林</b>が多いのが特徴。</div></div>
      <div class="arrow" data-at="4">▶</div>
      <div class="fbox" style="--c:#B9770E" data-at="4" data-anim="pop"><div class="fh">外国産の安い木材</div><div class="fb">輸入がふえ、国産の木材が売れにくくなった。木の値段が下がる。</div></div>
      <div class="arrow" data-at="5">▶</div>
      <div class="fbox" style="--c:#C0392B" data-at="5" data-anim="pop"><div class="fh">働く人が減る</div><div class="fb">木材が売れず生活しにくくなり、<b>働く人が減った</b>。高齢化も進んでいる。</div></div>
      <div class="figure rg-fig" data-at="2" data-anim="pop"><img src="assets/kii_ringyo.webp" alt="紀伊山地の人工林 ── まっすぐに育ったすぎ・ひのきの並ぶ森"></div>
    </div>
    <div class="df-note" data-at="5"><span>語句</span><span><b>私有林</b>＝個人や会社が所有する森林／<b>国有林</b>＝国が所有する森林。紀伊山地は<b>私有林</b>が多い。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
