<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>和歌山県のみかん ── 全国1位｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gr-safe { inset: 88px 140px 88px; align-content: start; gap: 34px; }
  .gr-head { display: grid; gap: 10px; }
  .gr-def { font-size: 38px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .gr-def .blank { font-size: 42px; }
  .chartbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 20px; padding: 26px 34px 20px; box-shadow: 0 14px 32px rgba(40,30,10,.10); display:grid; gap:12px; }
  .chartbox .ct { font-size: 28px; font-weight: 900; color: var(--sumi); display:flex; justify-content:space-between; align-items:baseline; }
  .chartbox .ct small { font-size:21px; color:var(--sumi-mute); font-weight:700; }
  .chartbox svg { display:block; width:100%; height:auto; }
  .gr-row { display:grid; grid-template-columns: repeat(3,1fr) 360px; gap: 28px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 26px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); align-content:start; min-height: 246px; }
  .pt .ph { font-weight:900; font-size:26px; color:var(--c); }
  .pt .pb { font-size:23px; line-height:1.45; color:var(--sumi-soft); }
  .gr-fig { position:relative; min-height: 246px; border-radius: 18px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.12); overflow: hidden; }
  .gr-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe gr-safe">
    <div class="gr-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-2</span>　果樹栽培</span>

    </div>
    <p class="gr-def" data-at="1">和歌山県…<span class="imp">紀ノ川</span>流域などで<span class="blank" data-fill="2"><span class="bnum">②</span><b>みかん</b></span>の栽培が盛ん。</p>
    <div class="chartbox" data-at="2">
      <div class="ct"><span>この果物の生産量の割合</span><small>（2022年）</small></div>
      <svg viewBox="0 0 1400 132" xmlns="http://www.w3.org/2000/svg">
        <g>
          <rect x="0"     y="0" width="313.6" height="72" fill="#E8781F" stroke="#fff" stroke-width="2"/>
          <rect x="313.6" y="0" width="224.0" height="72" fill="#F0A860" stroke="#fff" stroke-width="2"/>
          <rect x="537.6" y="0" width="211.4" height="72" fill="#F5C48F" stroke="#fff" stroke-width="2"/>
          <rect x="749.0" y="0" width="154.0" height="72" fill="#EBD8BC" stroke="#fff" stroke-width="2"/>

          <rect x="985.6" y="0" width="414.4" height="72" fill="#C9C7C1" stroke="#fff" stroke-width="2"/>
        </g>
        <text x="156"   y="46" font-size="30" font-weight="900" fill="#fff"     text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">和歌山 22.4%</text>
        <text x="425"   y="46" font-size="25" font-weight="900" fill="#5E3208" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">静岡 16.0</text>
        <text x="643"   y="46" font-size="25" font-weight="900" fill="#5E3208" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">愛媛 15.1</text>
        <text x="826"   y="46" font-size="23" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">熊本 11.0</text>
        <text x="944"   y="112" font-size="20" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">長崎 5.9</text>

    <div class="gr-row">
      <div class="pt" style="--c:#E8781F" data-at="3" data-anim="pop"><div class="ph">なぜ和歌山？</div><div class="pb">冬でも暖かい太平洋側の気候と、日当たりのよい斜面が、この栽培に向いている。</div></div>
      <div class="pt" style="--c:#2E8B57" data-at="3" data-anim="pop"><div class="ph">場所は紀ノ川流域</div><div class="pb">果物の名前だけでなく、<b>紀ノ川</b>という川の名前までセットで覚える。</div></div>
      <div class="pt" style="--c:#C0392B" data-at="4" data-anim="pop"><div class="ph">上位の顔ぶれ</div><div class="pb">和歌山・静岡・愛媛・熊本・長崎。<b>あたたかい地方</b>ばかりが並ぶ。</div></div>
      <div class="figure gr-fig" data-at="2" data-anim="pop"><img src="assets/mikan_dandan.webp" alt="みかんの段々畑 ── 海を見おろす日当たりのよい斜面"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
