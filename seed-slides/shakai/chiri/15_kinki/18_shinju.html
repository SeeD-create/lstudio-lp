<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>志摩半島の真珠の養殖｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gr-safe { inset: 88px 140px 88px; align-content: start; gap: 32px; }
  .gr-head { display: grid; gap: 10px; }
  .gr-def { font-size: 39px; line-height: 1.6; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 28px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .gr-def .blank { font-size: 42px; }
  .chartbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 20px; padding: 24px 34px 18px; box-shadow: 0 14px 32px rgba(40,30,10,.10); display:grid; gap:12px; }
  .chartbox .ct { font-size: 27px; font-weight: 900; color: var(--sumi); display:flex; justify-content:space-between; align-items:baseline; }
  .chartbox .ct small { font-size:21px; color:var(--sumi-mute); font-weight:700; }
  .chartbox svg { display:block; width:100%; height:auto; }
  .gr-row { display:grid; grid-template-columns: repeat(2,1fr) 400px; gap: 30px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 22px 28px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); align-content:start; min-height: 255px; }
  .pt .ph { font-weight:900; font-size:28px; color:var(--c); }
  .pt .pb { font-size:25px; line-height:1.45; color:var(--sumi-soft); }
  .gr-fig { position:relative; min-height: 255px; border-radius: 18px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.12); overflow: hidden; }
  .gr-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe gr-safe">
    <div class="gr-head" data-at="0">
      <span class="kicker"><span class="num">Ⅱ-5</span>　水産業②</span>
      <h1 class="headline" style="font-size:58px;">志摩半島 ── 貝からできる宝石</h1>
    </div>
    <p class="gr-def" data-at="1">志摩半島…波の静かな入り江で<span class="blank" data-fill="1"><span class="bnum">⑤</span><b>真珠</b></span>の養殖が盛ん。</p>
    <div class="chartbox" data-at="2">
      <div class="ct"><span>この養殖の収穫量の割合</span><small>（2021年）</small></div>
      <svg viewBox="0 0 1400 92" xmlns="http://www.w3.org/2000/svg">
        <rect x="0"      y="0" width="567.0" height="70" fill="#7D5BA6" stroke="#fff" stroke-width="2"/>
        <rect x="567.0"  y="0" width="477.4" height="70" fill="#A98FD0" stroke="#fff" stroke-width="2"/>
        <rect x="1044.4" y="0" width="222.6" height="70" fill="#C4161C" stroke="#fff" stroke-width="2"/>
        <rect x="1267.0" y="0" width="133.0" height="70" fill="#C9C7C1" stroke="#fff" stroke-width="2"/>
        <text x="283"  y="45" font-size="29" font-weight="900" fill="#fff" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">長崎 40.5%</text>
        <text x="805"  y="45" font-size="28" font-weight="900" fill="#2A1650" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">愛媛 34.1</text>
        <text x="1155" y="45" font-size="26" font-weight="900" fill="#fff" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">三重 15.9</text>
        <text x="1333" y="45" font-size="20" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">その他</text>
      </svg>
    </div>
    <div class="gr-row">
      <div class="pt" style="--c:#C4161C" data-at="3" data-anim="pop"><div class="ph">三重県は全国3位</div><div class="pb">志摩半島（三重県）はこの養殖の発祥の地。全国のおよそ<b>16％</b>をしめる。</div></div>
      <div class="pt" style="--c:#1F6FB2" data-at="4" data-anim="pop"><div class="ph">なぜ入り江なのか</div><div class="pb"><b>リアス海岸</b>の入り江は波が静か。いかだが流されず、貝をじっくり育てられる。</div></div>
      <div class="figure gr-fig" data-at="2" data-anim="pop"><img src="assets/shinju_ikada.webp" alt="真珠の養殖 ── リアス海岸の静かな入り江に浮かぶ養殖いかだ"></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
