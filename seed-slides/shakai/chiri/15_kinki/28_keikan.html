<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>京都市 ── 景観を守る｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 90px 130px 90px; align-content: start; gap: 34px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 40px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 28px 40px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 42px; }
  .figbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 22px; padding: 16px 24px; box-shadow: 0 14px 32px rgba(40,30,10,.10); }
  .figbox svg { display:block; width:100%; height:auto; }
  .kk-row { display:grid; grid-template-columns: 1fr 420px; gap: 30px; align-items: center; }
  .kk-fig { position:relative; min-height: 340px; border-radius: 22px; border: 3px solid var(--cat); box-shadow: 0 14px 32px rgba(40,30,10,.12); overflow: hidden; }
  .kk-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--imp); color:#fff; border-radius:16px; padding:22px 34px; font-size:28px; line-height:1.45; }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; opacity:.85; letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-8</span>　保全②</span>
      <h1 class="headline" style="font-size:58px;">千年の都 ── <span class="em">高さ</span>と<span class="em">看板</span>を制限する</h1>
    </div>
    <p class="df-def" data-at="1"><span class="blank" data-fill="1"><span class="bnum">⑪</span><b>京都市</b></span>…<span class="imp">景観</span>を守るため、建物の高さなどを制限している。</p>
    <div class="kk-row">
    <div class="figbox" data-at="2">
      <svg viewBox="0 0 1600 290" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="1600" height="290" fill="#FBFBFA"/>
        <!-- 左：制限がなければ -->
        <text x="380" y="34" font-size="26" font-weight="900" fill="#8B8A88" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">もし制限がなければ…</text>
        <line x1="60" y1="250" x2="700" y2="250" stroke="#4A4947" stroke-width="3"/>
        <rect x="90"  y="70"  width="90" height="180" fill="#C9C7C1" stroke="#8B8A88" stroke-width="2"/>
        <rect x="200" y="50"  width="90" height="200" fill="#C9C7C1" stroke="#8B8A88" stroke-width="2"/>
        <rect x="310" y="110" width="90" height="140" fill="#C9C7C1" stroke="#8B8A88" stroke-width="2"/>
        <rect x="420" y="60"  width="90" height="190" fill="#C9C7C1" stroke="#8B8A88" stroke-width="2"/>
        <path d="M540,250 L610,180 L680,250 Z" fill="#B9C8B0" stroke="#5A7A52" stroke-width="2"/>
        <text x="610" y="272" font-size="20" font-weight="900" fill="#3E5A38" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">寺・山</text>
        <text x="255" y="274" font-size="22" font-weight="900" fill="#8B8A88" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">高層ビルが寺や山をかくす</text>
        <!-- 矢印 -->
        <path d="M740,150 L830,150" stroke="#C4161C" stroke-width="8" stroke-linecap="round"/>
        <path d="M812,128 L842,150 L812,172 Z" fill="#C4161C"/>
        <text x="790" y="118" font-size="22" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">制限</text>
        <!-- 右：制限あり -->
        <text x="1220" y="34" font-size="26" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">建物の高さを制限した京都</text>
        <line x1="880" y1="250" x2="1540" y2="250" stroke="#4A4947" stroke-width="3"/>
        <line x1="880" y1="170" x2="1540" y2="170" stroke="#C4161C" stroke-width="4" stroke-dasharray="12 8"/>
        <text x="1540" y="160" font-size="20" font-weight="900" fill="#C4161C" text-anchor="end" style="font-family:'Zen Kaku Gothic New',sans-serif">高さの上限</text>
        <rect x="910"  y="185" width="90" height="65" fill="#E0D6C4" stroke="#8E5F0B" stroke-width="2"/>
        <rect x="1020" y="180" width="90" height="70" fill="#E0D6C4" stroke="#8E5F0B" stroke-width="2"/>
        <rect x="1130" y="190" width="90" height="60" fill="#E0D6C4" stroke="#8E5F0B" stroke-width="2"/>
        <rect x="1240" y="182" width="90" height="68" fill="#E0D6C4" stroke="#8E5F0B" stroke-width="2"/>
        <path d="M1360,250 L1440,150 L1520,250 Z" fill="#9EBF92" stroke="#3E5A38" stroke-width="2"/>
        <text x="1440" y="272" font-size="20" font-weight="900" fill="#3E5A38" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">寺・山が見える</text>
      </svg>
    </div>
      <div class="figure kk-fig" data-at="2" data-anim="pop"><img src="assets/kyoto_machinami.webp" alt="古都の町なみ ── 瓦屋根の木造家屋と、その奥に見える木造の塔"></div>
    </div>
    <div class="df-note" data-at="3"><span>ポイント</span><span>1000年以上、都が置かれた町。<b>古い町なみと自然の見え方（景観）</b>そのものが、京都の観光資源になっている。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</html>
