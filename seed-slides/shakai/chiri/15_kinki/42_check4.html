<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 商工業｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1460px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 36px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; line-height:1.1; color: var(--sumi); white-space:nowrap; }
  .ans .exp { font-size: 31px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
  .ans .mark.blank { min-width: 120px; padding: 0 14px 4px; margin: 0; }
  .ans .exp .blank--para { padding: 6px 14px; }
  .ans .exp .blank--para b { color: var(--imp); }
  .ans .exp .blank--para .hl { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認・商工業</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 都市名を答えよ</div>
      <p class="qtext" data-at="0">①<span class="u">筆・墨</span>の生産が盛んな都市　②<span class="u">中小企業</span>が多く集まる都市<br>③<span class="u">西陣織</span>などの伝統工業が盛んな都市</p>
      <div class="ans" data-at="1">
        <span class="mark" data-at="1" data-anim="pop">①奈良市<br>②東大阪市<br>③京都市</span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b>「筆・墨＝奈良」「中小企業＝東大阪」「西陣織・清水焼＝京都」は<span class="hl">そのまま出る3点セット</span>。<br>都市名は必ず「◯◯市」まで書く。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(3);</script>
</body>
</html>
