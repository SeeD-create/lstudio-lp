<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>リアス海岸とは｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rs-safe { inset: 84px 130px 84px; align-content: start; gap: 30px; }
  .rs-head { display: grid; gap: 10px; }
  .rs-def { font-size: 38px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .rs-def .blank { font-size: 42px; }
  .figbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 22px; box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 14px 20px; }
  .figbox svg { display:block; width:100%; height:auto; }
  .rs-row { display:grid; grid-template-columns: repeat(3,1fr); gap: 26px; }
  .pt { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--c); padding: 20px 24px; display:grid; gap:8px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .pt .ph { font-weight:900; font-size:27px; color:var(--c); }
  .pt .pb { font-size:24px; line-height:1.45; color:var(--sumi-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe rs-safe">
    <div class="rs-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ-4</span>　語句</span>
      <h1 class="headline" style="font-size:58px;">リアス海岸 ── <span class="em">陸が海に沈んで</span>できた地形</h1>
    </div>
    <p class="rs-def" data-at="1">陸地が海に沈んでできた、<span class="blank" data-fill="1"><b>出入りの多い</b></span>海岸線を持つ地形を<span class="imp">リアス海岸</span>という。</p>
    <div class="figbox" data-at="2">
      <svg viewBox="0 0 1580 330" xmlns="http://www.w3.org/2000/svg">
        <!-- 左：もとの地形 -->
        <g>
          <text x="360" y="34" font-size="26" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">① もとの地形（谷が刻まれた山地）</text>
          <path d="M30,300 L100,110 L165,270 L235,90 L305,260 L375,120 L445,275 L515,140 L585,290 L655,170 L700,300 Z" fill="#C8B48C" stroke="#7A5A12" stroke-width="3"/>
          <rect x="30" y="288" width="670" height="30" fill="#7FB6DA"/>
          <line x1="30" y1="288" x2="700" y2="288" stroke="#0B4A85" stroke-width="3"/>
          <text x="60" y="312" font-size="20" font-weight="900" fill="#0B4A85" style="font-family:'Zen Kaku Gothic New',sans-serif">海</text>
          <text x="165" y="252" font-size="20" font-weight="900" fill="#5E4409" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" style="font-family:'Zen Kaku Gothic New',sans-serif">谷</text>
          <text x="375" y="102" font-size="20" font-weight="900" fill="#5E4409" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" style="font-family:'Zen Kaku Gothic New',sans-serif">山</text>
        </g>
        <!-- 矢印 -->
        <g>
          <path d="M735,190 L825,190" stroke="#C4161C" stroke-width="8" stroke-linecap="round"/>
          <path d="M805,168 L835,190 L805,212 Z" fill="#C4161C"/>
          <text x="785" y="150" font-size="24" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">沈む</text>
        </g>
        <!-- 右：沈んだあと -->
        <g>
          <text x="1225" y="34" font-size="26" font-weight="900" fill="#4A4947" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">② 沈んで、谷に海水が入りこむ</text>
          <path d="M880,300 L950,110 L1015,270 L1085,90 L1155,260 L1225,120 L1295,275 L1365,140 L1435,290 L1505,170 L1550,300 Z" fill="#C8B48C" stroke="#7A5A12" stroke-width="3"/>
          <path d="M880,215 L1550,215 L1550,318 L880,318 Z" fill="#7FB6DA" fill-opacity="0.72"/>
          <line x1="880" y1="215" x2="1550" y2="215" stroke="#0B4A85" stroke-width="4"/>
          <text x="905" y="205" font-size="20" font-weight="900" fill="#0B4A85" style="font-family:'Zen Kaku Gothic New',sans-serif">海面が上がる</text>
          <text x="1015" y="253" font-size="20" font-weight="900" fill="#C4161C" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" style="font-family:'Zen Kaku Gothic New',sans-serif">入り江</text>
          <text x="1295" y="258" font-size="20" font-weight="900" fill="#C4161C" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" style="font-family:'Zen Kaku Gothic New',sans-serif">入り江</text>
        </g>
      </svg>
    </div>
    <div class="rs-row">
      <div class="pt" style="--c:#1F6FB2" data-at="3" data-anim="pop"><div class="ph">波が静か</div><div class="pb">入り江の奥は外海の波がとどかず、水面がおだやか。</div></div>
      <div class="pt" style="--c:#2E8B57" data-at="3" data-anim="pop"><div class="ph">養殖に向く</div><div class="pb">志摩半島では<b>真珠</b>の養殖。いかだが波で流されにくい。</div></div>
      <div class="pt" style="--c:#C0392B" data-at="3" data-anim="pop"><div class="ph">近畿では2か所</div><div class="pb"><b>若狭湾</b>と<b>志摩半島</b>。どちらもリアス海岸。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
</html>
