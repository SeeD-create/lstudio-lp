<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>総仕上げ ── 近畿地方○×クイズ｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fq-safe { inset: 92px 130px 92px; align-content: start; gap: 30px; }
  .fq-head { display: grid; gap: 10px; }
  .qrow { display: grid; grid-template-columns: 1fr 190px; gap: 26px; align-items: center; background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--sumi); padding: 22px 30px; box-shadow: 0 10px 24px rgba(40,30,10,.08); }
  .qrow .q { font-size: 29px; line-height: 1.4; font-weight: 700; color: var(--sumi); }
  .qrow .q .u { border-bottom: 3px solid var(--imp); }
  .qrow .a { text-align: center; }
  .qrow .a .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; line-height:1; color: var(--imp); }
  .qrow .a .sub { display:block; font-size:19px; color: var(--sumi-soft); font-weight:700; margin-top:6px; line-height:1.3; }
  .qrow .a .mk.blank { min-width:76px; padding:0 10px 4px; margin:0; }
  .qrow .a .sub.blank--para { padding:3px 10px; margin-top:6px; }
  .qrow .a .sub.blank--para b { color:var(--sumi-soft); font-family:inherit; font-weight:700; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fq-safe">
    <div class="fq-head" data-at="0">
      <span class="kicker"><span class="num">総仕上げ</span>　○×クイズ</span>
      <h1 class="headline" style="font-size:56px;">まちがえやすい<span class="em">3問</span>で最終チェック</h1>
    </div>
    <div class="qrow" data-at="0">
      <div class="q">Q1．日本最大の湖である<span class="u">琵琶湖</span>を水源とし、大阪湾に注ぐ川は<span class="u">紀ノ川</span>である。</div>
      <div class="a" data-at="1" data-anim="pop"><span class="mk blank" data-fill="1"><b>×</b></span><span class="sub blank blank--para" data-fill="1"><b>正しくは<b>淀川</b>。<br>紀ノ川はみかんの川。</b></span></div>
    </div>
    <div class="qrow" data-at="1">
      <div class="q">Q2．阪神工業地帯は、<span class="u">自動車工業や石油化学工業</span>の割合が低いことが、伸びなやみの理由の一つである。</div>
      <div class="a" data-at="2" data-anim="pop"><span class="mk blank" data-fill="2"><b>○</b></span><span class="sub blank blank--para" data-fill="2"><b>地下水のくみ上げによる<b>地盤沈下</b>も理由。</b></span></div>
    </div>
    <div class="qrow" data-at="2">
      <div class="q">Q3．1994年に開港した日本初の24時間空港は<span class="u">関西国際空港</span>で、1998年に開通した本州と淡路島を結ぶ橋は<span class="u">明石海峡大橋</span>である。</div>
      <div class="a" data-at="3" data-anim="pop"><span class="mk blank" data-fill="3"><b>○</b></span><span class="sub blank blank--para" data-fill="3"><b>94＝空港／95＝震災／<br>98＝橋、で覚える。</b></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
