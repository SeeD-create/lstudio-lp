<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>京阪神大都市圏｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 92px 140px 92px; align-content: start; gap: 34px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 38px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 28px 38px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }
  .df-def .blank { font-size: 42px; }
  .df-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .pt { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); padding: 26px 30px; display:grid; gap:12px; box-shadow:0 12px 28px rgba(40,30,10,.08); align-content:start; min-height: 260px; }
  .pt .pn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; line-height:1; color:var(--c); }
  .pt .ph { font-weight:900; font-size:28px; color:var(--sumi); }
  .pt .pb { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
  .df-note b { color:#fff; }
  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅳ-10</span>　都市圏</span>
      <h1 class="headline" style="font-size:56px;">3つの都市がつながって<span class="em">1つの圏</span>に</h1>
    </div>
    <p class="df-def" data-at="1">大阪・神戸・京都をふくめた都市圏を<span class="blank" data-fill="1"><b>京阪神大都市圏</b></span>という。（大阪市を中心とする部分は<span class="imp">大阪大都市圏</span>）</p>
    <div class="df-row">
      <div class="pt" style="--c:#C0392B" data-at="2" data-anim="pop"><div class="pn">京</div><div class="ph">京都 ── 文化の都</div><div class="pb">1000年以上、都が置かれた町。観光・伝統工業・大学が集まる。</div></div>
      <div class="pt" style="--c:#B9770E" data-at="3" data-anim="pop"><div class="pn">阪</div><div class="ph">大阪 ── 商業の中心</div><div class="pb">西日本の商業の中心で卸売業が盛ん。江戸時代は「<b>天下の台所</b>」。</div></div>
      <div class="pt" style="--c:#1F6FB2" data-at="4" data-anim="pop"><div class="pn">神</div><div class="ph">神戸 ── 貿易の港</div><div class="pb">明治時代に貿易港として栄え、国際色豊かな都市に。近畿最大の貿易港。</div></div>
    </div>
    <div class="df-note" data-at="4"><span>読み方</span><span><b>けいはんしん</b>大都市圏。「京＝京都・阪＝大阪・神＝神戸」の頭文字を並べた呼び名。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
