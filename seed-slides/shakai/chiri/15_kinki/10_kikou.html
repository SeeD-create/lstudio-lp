        <span class="kicker"><span class="num">Ⅰ-5</span>　近畿の気候</span>
        <h1 class="headline" style="font-size:44px;">1つの地方に、気候が<span class="em">3つ</span></h1>
      </div>
      <div class="lg" style="--c:#1F6FB2" data-at="1" data-anim="left"><span class="n">①</span><span class="t"><span class="blank" data-fill="1"><b>日本海側の気候</b></span><small>兵庫・京都・滋賀の<b>北部</b>。冬に雪や雨が多い　例：舞鶴</small></span></div>
      <div class="lg" style="--c:#B9770E" data-at="2" data-anim="left"><span class="n">②</span><span class="t"><span class="blank" data-fill="2"><b>瀬戸内の気候</b></span><small>兵庫<b>南部</b>・大阪付近。一年を通して雨が少ない　例：大阪</small></span></div>
      <div class="lg" style="--c:#C0392B" data-at="3" data-anim="left"><span class="n">③</span><span class="t"><span class="blank" data-fill="3"><b>太平洋側の気候</b></span><small>和歌山・三重付近。夏に雨が多い　例：尾鷲</small></span></div>
      <div class="mp-note" data-at="4"><span>テスト頻出</span><span><b>紀伊半島の南東部</b>は、日本でも最も雨の多い地域の一つ。夏の季節風が紀伊山地にぶつかるため。</span></div>
