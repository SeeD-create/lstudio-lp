<title>近畿地方ってどんな地方？｜中1地理 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hk-safe { inset: 110px 150px 100px; align-content: center; gap: 46px; }
  .hk-head { display: grid; gap: 14px; }
  .hk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .fact { background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.10); padding: 40px; display: grid; gap: 14px; align-content: start; }
  .fact .fnum { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:92px; line-height:1; color: var(--imp); }
  .fact .fttl { font-size: 34px; font-weight: 900; color: var(--sumi); }
  .fact .fbody { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); }
  .hk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:30px; line-height:1.5; }
  .hk-note b { color: #fff; }
  .hk-note > span:first-child { flex:none; font-weight:900; color: var(--gold-soft); letter-spacing:.12em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　導入</span>
      <h1 class="headline" style="font-size:68px;">近畿地方は、日本の<span class="em">「元・中心」</span>だった</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">2府5県</div><div class="fttl">「府」が2つある地方</div><div class="fbody">大阪府・京都府と、兵庫・滋賀・三重・奈良・和歌山の5県。日本で「府」があるのはここだけ。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">1300年</div><div class="fttl">奈良・京都に都があった</div><div class="fbody">平城京（奈良）・平安京（京都）。1000年以上、日本の政治と文化の中心だった。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">天下の台所</div><div class="fttl">大阪は西日本の商業の中心</div><div class="fbody">江戸時代から商業のまち。今も卸売業が盛んで、大阪大都市圏をつくっている。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span>この章のねらい</span><span>近畿を<b>自然・農林水産業・開発と保全・商工業</b>の4枚のカードに分けて、1枚ずつ集めていく。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
