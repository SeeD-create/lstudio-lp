        <span class="kicker"><span class="num">Ⅳ-9</span>　電力</span>
        <h1 class="headline" style="font-size:48px;">近畿の電気は<span class="em">北の湾</span>から</h1>
      </div>
      <p class="df-def" data-at="1">Ａ<span class="blank" data-fill="1"><span class="bnum">⑨</span><b>若狭湾</b></span>…<span class="imp">原子力発電所</span>が多くあり、近畿地方に電力を供給している。</p>
      <div class="pt" style="--c:#1F6FB2" data-at="2" data-anim="left"><div class="ph">なぜこの湾に集まる？</div><div class="pb">リアス海岸で冷却用の海水が得やすく、人口の少ない海岸が続くから。「原発銀座」とよばれる。</div></div>
      <div class="pt" style="--c:#C0392B" data-at="3" data-anim="left"><div class="ph">つくる場所と使う場所</div><div class="pb">発電するのは<b>北の湾</b>、電気を使うのは<b>大阪・京都・神戸</b>。送電線で運ばれている。</div></div>
