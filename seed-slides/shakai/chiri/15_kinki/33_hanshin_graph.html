<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gr-safe { inset: 82px 130px 82px; align-content: start; gap: 26px; }

  .gr-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:27px; line-height:1.45; }
