<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 96px 140px 96px; align-content: start; gap: 38px; }
  .df-head { display: grid; gap: 10px; }
  .df-def { font-size: 40px; line-height: 1.62; color: var(--sumi); font-weight: 700; background: var(--paper-hi); border-left: 12px solid var(--imp); border-radius: 0 18px 18px 0; padding: 30px 40px; box-shadow: 0 12px 28px rgba(40,30,10,.08); }

  .df-row { display: grid; grid-template-columns: repeat(3, 1fr) 420px; gap: 30px; }
  .pt { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); padding: 24px 28px; display:grid; gap:10px; box-shadow:0 12px 28px rgba(40,30,10,.08); align-content:start; min-height:340px; }
  .pt .ph { font-weight:900; font-size:28px; color:var(--c); }
  .pt .pb { font-size:24px; line-height:1.5; color:var(--sumi-soft); }
  .df-fig { position:relative; min-height: 340px; border-radius: 20px; border: 3px solid var(--cat); box-shadow: 0 14px 32px rgba(40,30,10,.12); overflow: hidden; }
  .df-fig img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .df-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.45; }

  .df-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); letter-spacing:.1em; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ-7</span>　開発⑤</span>
      <h1 class="headline" style="font-size:58px;">近畿の中心都市 ── 駅前が<span class="em">生まれ変わる</span></h1>
    </div>
    <p class="df-def" data-at="1"><span class="blank" data-fill="1"><span class="bnum">⑧</span><b>大阪市</b></span>…<span class="blank" data-fill="2"><span class="bnum">⑨</span><b>ターミナル駅</b></span>の周辺で<span class="blank" data-fill="3"><span class="bnum">⑩</span><b>再開発</b></span>が盛んに行われている。</p>
    <div class="df-row">
      <div class="pt" style="--c:#C0392B" data-at="4" data-anim="pop"><div class="ph">乗りかえの起点の駅</div><div class="pb">たくさんの路線が集まり、乗りかえの起点になる大きな駅。大阪駅（梅田）・難波・天王寺など。</div></div>
      <div class="pt" style="--c:#B9770E" data-at="4" data-anim="pop"><div class="ph">街を作りなおす</div><div class="pb">古くなった街を、いちど整理して作りなおすこと。工場や貨物駅のあとに高層ビルを建てる。</div></div>
      <div class="pt" style="--c:#1F6FB2" data-at="4" data-anim="pop"><div class="ph">近畿の中心都市</div><div class="pb">この都市は近畿地方の中心。人が集まる駅前をみがくことで、東京への流出に対抗している。</div></div>
      <div class="figure df-fig" data-at="2" data-anim="pop"><img src="assets/osaka_ekimae.webp" alt="再開発された駅前 ── ターミナル駅の上に建つ高層ビルと広場"></div>
    </div>
    <div class="df-note" data-at="4"><span>問われ方</span><span>「近畿地方の中心都市で、<b>大きな駅の周辺の作りなおし</b>が盛んな都市は？」を答える。</span></div>
  </div>
  <div class="seed-foot"><span>第15章 近畿地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
