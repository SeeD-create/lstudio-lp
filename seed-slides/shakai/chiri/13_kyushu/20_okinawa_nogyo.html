<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>沖縄の農業 ── さとうきびとパイナップル｜中2地理 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ok-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .ok-head { display: grid; gap: 12px; }
  .ok-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .ok { background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c); box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 34px 34px; display: grid; gap: 14px; align-content: start; min-height: 330px; }
  .ok .ic { height: 300px; border-radius: 16px; border: 3px solid var(--c); box-shadow: 0 12px 26px rgba(40,30,10,.12); }
  .ok .h { font-size: 40px; font-weight: 900; color: var(--sumi); }
  .ok .h .blank { font-size: 40px; min-width: 300px; }
  .ok .d { font-size: 24px; line-height: 1.5; color: var(--sumi-soft); font-weight:600; }
  .ok-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; font-size:26px; line-height:1.45; }
  .ok-note b { color:#fff; }
  .ok-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ok-safe">
    <div class="ok-head" data-at="0">
      <span class="kicker"><span class="num">ノート2</span>　沖縄の農業</span>
      <h1 class="headline" style="font-size:60px;">あたたかい島だから作れる<span class="em">3つ</span></h1>
    </div>
    <div class="ok-row">
      <div class="ok" style="--c:#3f7a52" data-at="1" data-anim="pop"><span class="figure ic"><img src="assets/satoukibi.webp" alt="さとうきび畑 ── 背の高い緑のさとうきびが青空の下にならぶ"></span><span class="h"><span class="blank" data-fill="1"><b>さとうきび</b></span></span><span class="d">沖縄を代表する作物。<span class="imp">砂糖の原料</span>になる。あたたかく雨の多い気候に合う。</span></div>
      <div class="ok" style="--c:#D4A64B" data-at="2" data-anim="pop"><span class="figure ic"><img src="assets/pineapple.webp" alt="パイナップル畑 ── とがった葉の株の中央に実がなっている"></span><span class="h">パイナップル</span><span class="d">亜熱帯の果物。①とセットで沖縄の代表作物として出る。</span></div>
      <div class="ok" style="--c:#C4658F" data-at="3" data-anim="pop"><span class="figure ic"><img src="assets/okinawa_kiku.webp" alt="菊の栽培 ── ビニールハウスの中でならんで咲く白い菊"></span><span class="h">花（菊など）</span><span class="d">最近は<span class="imp">花の栽培</span>も多い。あたたかさを生かし、冬に本州へ出荷する。</span></div>
    </div>
    <div class="ok-note" data-at="4" data-anim="fade"><span>入試ではこう聞かれる</span><span>「南西諸島で盛んに栽培されている、<b>砂糖の原料</b>となる農作物は？」が①の答え。</span></div>
  </div>
  <div class="seed-foot"><span>第13章 九州地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
