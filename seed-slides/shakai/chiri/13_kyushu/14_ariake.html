<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>有明海 ── 干拓とのりの養殖｜中2地理 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tp-safe { inset: 80px 130px 80px; grid-template-columns: 620px 1fr; align-content: center; gap: 56px; align-items: center; }
  .tp-left { display: grid; gap: 24px; align-content: center; }
  .tp-badge { justify-self:start; background: var(--cat); color:#fff; font-weight:900; font-size:24px; padding:8px 22px; border-radius:999px; letter-spacing:.08em; }
  .tp-name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:96px; line-height:1.05; color: var(--sumi); }
  .tp-sub { font-size:29px; line-height:1.5; color: var(--sumi-soft); font-weight:700; }
  .tp-sub .imp { color: var(--imp); }
  .tp-rows { display: grid; gap: 20px; }
  .row { display:flex; align-items:flex-start; gap:20px; background: var(--paper-hi); border-left: 9px solid var(--c); border-radius: 0 16px 16px 0; padding: 22px 28px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .row .n { flex:none; width:46px; height:46px; border-radius:50%; background:var(--c); color:#fff; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:22px; display:flex; align-items:center; justify-content:center; }
  .row .b { display:grid; gap:6px; }
  .row .b .h { font-size:30px; font-weight:900; color:var(--sumi); line-height:1.3; }
  .row .b .h .blank { font-size:32px; min-width:220px; }
  .row .b .d { font-size:23px; line-height:1.45; color:var(--sumi-mute); font-weight:600; }
  .fig2 { background: var(--paper-hi); border: 3px solid var(--sumi-mute); border-radius: 18px; padding: 16px 20px; }
  .fig2 svg { display:block; width:100%; height:auto; }
  .tp-fig { height: 270px; border-radius: 22px; border: 3px solid var(--cat); box-shadow: 0 16px 36px rgba(40,30,10,.13); }
  .bar { display:grid; gap:10px; background: var(--paper-hi); border:3px solid var(--sumi-mute); border-radius:16px; padding:18px 24px; }
  .bar .bt { font-size:24px; font-weight:900; color:var(--sumi); }
  .bar .track { display:flex; height:44px; border-radius:8px; overflow:hidden; border:2px solid var(--sumi-soft); }
  .bar .seg { display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:20px; white-space:nowrap; overflow:hidden; }
  .note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 28px; font-size:25px; line-height:1.45; }
  .note b { color:#fff; }
  .note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe tp-safe">
    <div class="tp-left">
      <span class="kicker" data-at="0"><span class="num">ノート2</span>　農業②・水産業</span>
      <span class="tp-badge" data-at="0">福岡・佐賀・長崎・熊本</span>
      <div class="tp-name" data-at="0">有明海</div>
      <div class="tp-sub" data-at="1">干潟が広がる、<span class="imp">日本一の干満差</span>の海。<br>筑後川が土砂を運びこむ。</div>
      <div class="figure tp-fig" data-at="0" data-anim="pop"><img src="assets/ariake_higata.webp" alt="有明海の干潟 ── 潮が引いて現れた広い泥の干潟と、沖に並ぶのりの養殖ひび"></div>
      <div class="fig2" data-at="2" data-anim="pop">
        <svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="560" height="190" fill="#FBFBFA"/>
          <text x="280" y="26" font-size="21" font-weight="900" fill="#141414" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">③＝海をしめ切って農地にする</text>
          <rect x="30" y="44" width="500" height="70" fill="#9CC6DE"/>
          <path d="M30,114 L530,114 L530,150 L30,150 Z" fill="#B9AE97"/>
          <rect x="30" y="44" width="240" height="70" fill="#D6C9A8" stroke="#8a7d5a" stroke-width="2"/>
          <text x="150" y="86" font-size="22" font-weight="900" fill="#6b5f42" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">新しい農地</text>
          <rect x="268" y="40" width="12" height="78" fill="#4A4947"/>
          <text x="288" y="108" font-size="17" font-weight="700" fill="#1c4a66" text-anchor="start" style="font-family:'Zen Kaku Gothic New',sans-serif">堤防でしめ切る</text>
          <text x="400" y="86" font-size="22" font-weight="900" fill="#1c4a66" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">海</text>
          <text x="280" y="176" font-size="19" font-weight="900" fill="#C4161C" text-anchor="middle" style="font-family:'Zen Kaku Gothic New',sans-serif">水をぬいて陸地に → 農地が広がる</text>
        </svg>
      </div>
    </div>
    <div class="tp-rows">
      <div class="row" style="--c:#8a6410" data-at="3" data-anim="left"><span class="n">③</span><span class="b"><span class="h">古くから<span class="blank" data-fill="3"><b>干拓</b></span>を行い農地を広げる</span><span class="d">遠浅の海をしめ切って水をぬき、耕地にする</span></span></div>
      <div class="row" style="--c:#2C6489" data-at="4" data-anim="left"><span class="n">④</span><span class="b"><span class="h">また<span class="blank" data-fill="4"><b>のり</b></span>の養殖も盛ん</span><span class="d">この養殖の生産量は佐賀県が全国第1位</span></span></div>
      <div class="bar" data-at="5" data-anim="pop">
        <div class="bt">養殖の生産量　2022年</div>
        <div class="track">
          <div class="seg" style="width:23.4%;background:#C4161C">佐賀 23.4%</div>
          <div class="seg" style="width:21.6%;background:#2C6489">兵庫 21.6</div>
          <div class="seg" style="width:17.0%;background:#3f7a52">福岡 17.0</div>
          <div class="seg" style="width:38.0%;background:#8B8A88">その他</div>
        </div>
      </div>
      <div class="note" data-at="5" data-anim="fade"><span>セットで覚える</span><span>この海は<b>①</b>＋<b>②の養殖</b>。この2つは必ずいっしょに出る。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 九州地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
