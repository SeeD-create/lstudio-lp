<!DOCTYPE html>

<head>

<title>都市と工業 ── 福岡市・大分市・長崎市｜中2地理 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ct-safe { inset: 84px 130px 84px; align-content: center; gap: 30px; }
  .ct-head { display: grid; gap: 10px; }
  .ct-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .cc { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--c); box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 26px 24px; display: grid; gap: 12px; align-content: start; min-height: 400px; }
  .cc .cn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color: var(--sumi); line-height:1.1; }
  .cc .cp { font-size: 20px; font-weight:900; color:#fff; background:var(--c); border-radius:999px; padding:5px 14px; justify-self:start; }
  .cc .cb { font-size: 25px; line-height: 1.45; color: var(--sumi-soft); font-weight:700; }
  .cc .cb .blank { font-size: 27px; min-width: 180px; }
  .ct-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; font-size:25px; line-height:1.45; }
  .ct-note b { color:#fff; }
  .ct-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ct-safe">
    <div class="ct-head" data-at="0">
      <span class="kicker"><span class="num">ノート3</span>　都市の特色</span>
      <h1 class="headline" style="font-size:56px;">その都市で、<span class="em">何がさかん</span>か</h1>
    </div>
    <div class="ct-row">
      <div class="cc" style="--c:#1F5FA8" data-at="1" data-anim="pop">
        <span class="cp">福岡県</span>
        <div class="cn">福岡市</div>
        <div class="cb"><span class="blank" data-fill="1"><b>地方中枢都市</b></span>の1つで、<span class="imp">九州の中心都市</span>。人口160万人をこえ、山陽・九州新幹線も通る。</div>
      </div>
      <div class="cc" style="--c:#8C6BB1" data-at="2" data-anim="pop">
        <span class="cp">大分県</span>
        <div class="cn">大分市</div>
        <div class="cb"><span class="blank" data-fill="2"><b>鉄鋼業</b></span>・<span class="blank" data-fill="2"><b>石油化学工業</b></span>などが盛ん。海ぞいのコンビナート。</div>
      </div>
      <div class="cc" style="--c:#1F7A3F" data-at="3" data-anim="pop">
        <span class="cp">長崎県</span>
        <div class="cn">長崎市</div>
        <div class="cb"><span class="blank" data-fill="3"><b>造船業</b></span>が盛ん。<br>第二次世界大戦中に<span class="imp">原爆</span>を投下された都市でもある。</div>
      </div>
      <div class="cc" style="--c:#1F7A3F" data-at="4" data-anim="pop">
        <span class="cp">長崎県</span>
        <div class="cn">佐世保市</div>
        <div class="cb"><span class="blank" data-fill="4"><b>造船業</b></span>が盛ん。<br>長崎市とセットで「造船の2都市」として覚える。</div>
      </div>
    </div>
    <div class="ct-note" data-at="5" data-anim="fade"><span>ここが頻出</span><span>「<b>九州の中心都市＝福岡市</b>」「<b>造船＝長崎市・佐世保市</b>」「<b>鉄鋼・石油化学＝大分市</b>」。<br>北九州市（金属工業）と福岡市（中心都市）を混ぜないこと。</span></div>
  </div>
  <div class="seed-foot"><span>第13章 九州地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
