<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tp-safe { inset: 80px 130px 80px; grid-template-columns: 620px 1fr; align-content: center; gap: 56px; align-items: center; }
  .tp-left { display: grid; gap: 24px; align-content: center; }
  .tp-badge { justify-self:start; background: var(--cat); color:#fff; font-weight:900; font-size:24px; padding:8px 22px; border-radius:999px; letter-spacing:.08em; }

  .tp-sub .imp { color: var(--imp); }
  .tp-rows { display: grid; gap: 20px; }
  .row { display:flex; align-items:flex-start; gap:20px; background: var(--paper-hi); border-left: 9px solid var(--c); border-radius: 0 16px 16px 0; padding: 22px 28px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }

  .row .b { display:grid; gap:6px; }
  .row .b .h { font-size:30px; font-weight:900; color:var(--sumi); line-height:1.3; }
  .row .b .h .blank { font-size:32px; min-width:250px; }
  .row .b .d { font-size:23px; line-height:1.45; color:var(--sumi-mute); font-weight:600; }
  .fig2 { background: var(--paper-hi); border: 3px solid var(--sumi-mute); border-radius: 18px; padding: 16px 20px; }
  .fig2 svg { display:block; width:100%; height:auto; }
  .tp-fig { height: 280px; border-radius: 22px; border: 3px solid var(--cat); box-shadow: 0 16px 36px rgba(40,30,10,.13); }
  .note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 28px; font-size:25px; line-height:1.45; }
  .note b { color:#fff; }
  .note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
