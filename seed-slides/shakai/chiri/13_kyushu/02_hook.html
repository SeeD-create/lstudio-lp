<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>九州ってどんな地方？｜中2地理 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hk-safe { inset: 110px 150px 100px; align-content: center; gap: 46px; }
  .hk-head { display: grid; gap: 14px; }
  .hk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .fact { background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--sumi); box-shadow: 0 16px 34px rgba(40,30,10,.10); padding: 40px 40px; display: grid; gap: 14px; align-content: start; }
  .fact .fnum { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; color: var(--imp); }
  .fact .fttl { font-size: 34px; font-weight: 900; color: var(--sumi); }
  .fact .fbody { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); }
  .hk-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:26px 40px; font-size:29px; line-height:1.5; }
  .hk-note b { color: var(--gold-soft); }
  .hk-note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hk-safe">
    <div class="hk-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　導入</span>
      <h1 class="headline" style="font-size:70px;">九州は、<span class="em">火山</span>で始まって<span class="em">工場</span>で終わる</h1>
    </div>
    <div class="hk-row">
      <div class="fact" data-at="1" data-anim="pop"><div class="fnum">火山</div><div class="fttl">火山だらけの地方</div><div class="fbody">阿蘇山・雲仙岳・霧島山・桜島。世界一大きなカルデラもここ。温泉と地熱発電の宝庫でもある。</div></div>
      <div class="fact" data-at="2" data-anim="pop"><div class="fnum">食料</div><div class="fttl">日本の食料基地</div><div class="fbody">米・野菜・畜産・養殖。さつまいも・豚・ブロイラー・トマト…全国1位が山ほどある。</div></div>
      <div class="fact" data-at="3" data-anim="pop"><div class="fnum">工業</div><div class="fttl">アジアの玄関口</div><div class="fbody">明治の八幡製鉄所から始まった北九州工業地域。いまはIC工場が集まる「シリコンアイランド」。</div></div>
    </div>
    <div class="hk-note" data-at="3"><span>この単元のねらい</span><span>九州は<b>「火山（自然）→農業→工業」</b>が1本の線でつながる。ここを追いかければ、丸暗記しなくても答えが出る。</span></div>
  </div>
  <div class="seed-foot"><span>第13章 九州地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
