      <div class="mp-head" data-at="0">
        <span class="kicker"><span class="num">ノート1</span>　自然災害</span>
        <h1 class="headline" style="font-size:48px;">九州をおそう<span class="em">3つの災害</span></h1>
      </div>
      <div class="sg" style="--c:#C4161C" data-at="1" data-anim="left"><span class="ic">風</span><span class="b"><span class="h">台風</span><span class="d">九州南部は<span class="imp">台風の進路</span>にあたり、大きな被害をうけることがある。夏から秋にかけて何度も通る。</span></span></div>
      <div class="sg" style="--c:#2C6489" data-at="2" data-anim="left"><span class="ic">雨</span><span class="b"><span class="h">梅雨の集中豪雨</span><span class="d"><span class="imp">6月ごろから始まる梅雨</span>の集中豪雨で、<span class="imp">土砂くずれ</span>などの災害も多い。</span></span></div>
      <div class="sg" style="--c:#8E4B8E" data-at="3" data-anim="left"><span class="ic">火</span><span class="b"><span class="h">火山の噴火</span><span class="d">雲仙岳・阿蘇山・霧島山・桜島など火山が多く、<span class="imp">噴火による被害</span>をうけることがある。</span></span></div>
      <div class="mp-note" data-at="4" data-anim="fade"><span>裏がえすと</span><span>火山は災害だけではない。<b>温泉</b>と<b>地熱発電</b>という九州の宝でもある（あとで出てくる）。</span></div>
