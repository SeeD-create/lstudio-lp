<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>沖縄の産業 ── 観光と自然のジレンマ｜中2地理 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ok-safe { inset: 84px 140px 84px; align-content: center; gap: 34px; }
  .ok-head { display: grid; gap: 10px; }
  .chain { display: grid; grid-template-columns: 1fr 60px 1fr 60px 1fr; align-items: center; gap: 10px; }
  .st { background: var(--paper-hi); border: 3px solid var(--c); border-radius: 20px; padding: 26px 24px; display: grid; gap: 12px; align-content: start; min-height: 300px; box-shadow: 0 14px 30px rgba(40,30,10,.10); }
  .st .sn { font-size: 20px; font-weight:900; color:#fff; background:var(--c); border-radius:999px; padding:5px 14px; justify-self:start; }
  .st .sh { font-size: 34px; font-weight: 900; color: var(--sumi); line-height:1.25; }
  .st .sh .blank { font-size: 34px; min-width: 250px; }
  .st .sb { font-size: 23px; line-height: 1.45; color: var(--sumi-soft); font-weight:600; }
  .arw { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:60px; color: var(--imp); text-align:center; line-height:1; }
  .note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; font-size:25px; line-height:1.45; }
  .note b { color:#fff; }
  .note > span:first-child { flex:none; white-space:nowrap; font-weight:900; color:var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe ok-safe">
    <div class="ok-head" data-at="0">
      <span class="kicker"><span class="num">ノート3</span>　沖縄の産業と環境</span>
      <h1 class="headline" style="font-size:56px;">きれいな海が<span class="em">仕事</span>を生み、<span class="em">問題</span>も生む</h1>
    </div>
    <div class="chain">
      <div class="st" style="--c:#2C6489" data-at="1" data-anim="pop">
        <span class="sn">⑭</span>
        <div class="sh">工業が発達せず<br><span class="blank" data-fill="1"><b>観光</b></span>産業が盛ん</div>
        <div class="sb">あたたかい気候と美しい海。ホテル・飲食などの<span class="imp">サービス業</span>で働く人が多い。</div>
      </div>
      <div class="arw" data-at="2">→</div>
      <div class="st" style="--c:#3f7a52" data-at="2" data-anim="pop">
        <span class="sn">⑮</span>
        <div class="sh">開発が進み<br><span class="blank" data-fill="2"><b>自然（さんご礁）</b></span>が破壊される</div>
        <div class="sb">ホテルや道路をつくるため森や海岸をけずり、赤土が海に流れこんでさんご礁が弱る。</div>
      </div>
      <div class="arw" data-at="3">→</div>
      <div class="st" style="--c:#C4161C" data-at="3" data-anim="pop">
        <span class="sn">⑯</span>
        <div class="sh"><span class="blank" data-fill="3"><b>環境問題</b></span>が問題となっている</div>
        <div class="sb">この産業のもとである自然を守りながら発展する道（エコツーリズムなど）が探されている。</div>
      </div>
    </div>
    <div class="note" data-at="4" data-anim="fade"><span>流れで覚える</span><span><b>工業が育たない → サービス業がのびる → 開発 → 自然の破壊 → 課題へ</b>。この1本の線で書けるようにする。</span></div>
  </div>
  <div class="seed-foot"><span>第13章 九州地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
