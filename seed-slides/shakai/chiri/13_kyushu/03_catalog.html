<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>九州地方カタログ ── 集める4枚｜中2地理 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 100px 150px 100px; align-content: start; gap: 44px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 32px 26px 34px; min-height: 470px; display: grid; align-content: start; gap: 16px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--cat); opacity:.35; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:42px; color:var(--sumi); line-height:1.15; margin-top:4px; }
  .cc__ess { font-size:25px; color:var(--sumi-soft); line-height:1.45; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:7px 16px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:20px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　九州地方カタログ</span>
      <h1 class="headline" style="font-size:62px;">集めるカードは、大きく<span class="em">4枚</span></h1>
    </div>
    <div class="deck-row">
      <div class="cc" data-cat="eq"  data-at="1" data-anim="pop"><div class="cc__no">Ⅰ</div><div class="cc__ttl">自然</div><div class="cc__ess">山地・平野・台地・川。火山とカルデラ。台風と梅雨。太平洋側の気候と南西諸島の気候。</div><span class="cc__pill">阿蘇山・シラス台地</span></div>
      <div class="cc" data-cat="lib" data-at="2" data-anim="pop"><div class="cc__no">Ⅱ</div><div class="cc__ttl">農林水産業</div><div class="cc__ess">筑紫平野の稲作、宮崎平野の促成栽培、シラス台地の畑作と畜産、有明海ののり。</div><span class="cc__pill">日本の食料基地</span></div>
      <div class="cc" data-cat="soc" data-at="3" data-anim="pop"><div class="cc__no">Ⅲ</div><div class="cc__ttl">商工業</div><div class="cc__ess">北九州工業地域と八幡製鉄所。地方中枢都市の福岡市。水俣病。IC工場と地熱発電。</div><span class="cc__pill">シリコンアイランド</span></div>
      <div class="cc" data-cat="par" data-at="4" data-anim="pop"><div class="cc__no">Ⅳ</div><div class="cc__ttl">沖縄と環境</div><div class="cc__ess">1972年の返還とアメリカ軍基地。観光産業と自然破壊。北九州市のエコタウン。</div><span class="cc__pill">持続可能な社会</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 九州地方</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
