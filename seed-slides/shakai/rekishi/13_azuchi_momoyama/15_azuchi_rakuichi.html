<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ks-safe { inset: 92px 150px 92px; align-content: center; gap: 38px; }
  .ks-head { display: grid; gap: 12px; }
  .ks-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .dcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 32px 40px;
           box-shadow: 0 18px 40px rgba(40,30,10,.12); display: grid; gap: 16px; position: relative; align-content:start; }
  .dcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .dcard .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); }
  .dcard .dt { font-size: 42px; font-weight: 700; color: var(--sumi); line-height:1.4; }
  .dcard .dt .blank { font-size: 46px; min-width: 340px; }
  .dcard .nt { font-size: 27px; color: var(--sumi-soft); line-height:1.45; }
  .dcard .nt b { color: var(--imp); }
  .ks-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 40px; }
  .ks-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .ks-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.92); }
  .ks-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ks-safe">
    <div class="ks-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　信長の国づくり</span>
      <h1 class="headline" style="font-size:60px;">城を築き、<span class="em">商売の自由</span>を広げる</h1>
    </div>
    <div class="ks-row">
      <div class="dcard" data-at="1" data-anim="left">
        <div class="lb">1576年・琵琶湖のほとり</div>
        <div class="dt"><span class="blank" data-fill="2"><span class="bnum">＊</span><b>安土城</b></span>を築く</div>
        <div class="nt">高くそびえる天守閣をもつ城を築き、ここを拠点とした。時代の名「安土」の由来。</div>
      </div>
      <div class="dcard" data-at="3" data-anim="right">
        <div class="lb">城下町の政策</div>
        <div class="dt"><span class="blank" data-fill="4"><span class="bnum">⑫</span><b>楽市・楽座</b></span>令</div>
        <div class="nt">城下で<b>だれでも自由に商工業ができる</b>ようにした。座（同業組合）の特権をなくし、商売をさかんにした。</div>
      </div>
    </div>
    <div class="ks-bar" data-at="4" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">「だれでも自由に商工業ができる法令」と「琵琶湖のほとりに築いた城」は<b>セットで問われる</b>。城の名は時代の名前にもなっている。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
