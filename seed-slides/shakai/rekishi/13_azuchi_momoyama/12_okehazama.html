<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>桶狭間の戦い ── 1560年｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ev-safe { inset: 96px 160px 96px; align-content: center; gap: 40px; justify-items:start; }
  .ev-head { display:grid; gap:12px; }
  .yr { display:inline-flex; align-items:center; gap:14px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; padding:10px 30px; border-radius:14px; letter-spacing:.06em; }
  .ev-line { font-size: 52px; line-height: 1.65; color: var(--sumi); font-weight:700; max-width:1560px; }
  .ev-line .blank { font-size: 56px; min-width: 340px; }
  .ev-line .imp { color:var(--imp); }
  .ev-bar { display:flex; align-items:center; gap:26px; background:var(--paper-hi); border-left:10px solid var(--imp); border-radius:0 16px 16px 0; padding:24px 34px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .ev-bar .bt { flex:none; font-weight:900; color:var(--imp); font-size:27px; letter-spacing:.08em; }
  .ev-bar .bb { font-size:29px; line-height:1.5; color:var(--sumi-soft); }
  .ev-bar .bb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe ev-safe">
    <div class="ev-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　尾張の大名、動く</span>
      <h1 class="headline" style="font-size:66px;">信長、天下取りの<span class="em">第一歩</span></h1>
    </div>
    <span class="yr" data-at="1" data-anim="pop">1560年</span>
    <p class="ev-line" data-at="1">尾張（今の愛知県）の大名<span class="blank" data-fill="2"><span class="bnum">⑧</span><b>織田信長</b></span>が、<br><span class="blank" data-fill="3"><span class="bnum">⑦</span><b>桶狭間</b></span>の戦いで<span class="imp">今川義元</span>を破り、全国統一に乗り出した。</p>
    <div class="ev-bar" data-at="3" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">1560年、少ない兵で今川の大軍を破った一戦。信長の名を一気に上げた。<b>戦いの地名は漢字で書ける</b>ようにしておくこと。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
