<title>長篠の戦い ── 1575年・鉄砲隊｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 92px 140px 92px; grid-template-columns: 640px 1fr; gap: 56px; align-content: center; align-items: center; }
  .cn-fig { height: 600px; border-radius: 26px; display:grid; place-items:center; background:var(--paper-hi); box-shadow:0 16px 36px rgba(40,30,10,.12); }
  .cn-fig svg { width: 92%; height: 92%; }
  .ln { fill:none; stroke:var(--sumi); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
  .lnf { fill:var(--paper-lo); stroke:var(--sumi); stroke-width:4; stroke-linejoin:round; }
  .cn-txt { display:grid; gap:26px; align-content:center; }
  .cn-head { display:grid; gap:12px; }
  .yr { display:inline-flex; align-items:center; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:42px; padding:8px 28px; border-radius:14px; letter-spacing:.06em; align-self:start; }
  .cn-line { font-size: 40px; line-height: 1.7; color: var(--sumi); font-weight:700; }
  .cn-line .blank { font-size: 44px; min-width: 260px; }
  .cn-line .imp { color:var(--imp); }
  .starbar { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border-left:10px solid var(--imp); border-radius:0 16px 16px 0; padding:22px 32px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .starbar .st { flex:none; font-weight:900; color:var(--imp); font-size:26px; letter-spacing:.08em; }
  .starbar .sb { font-size:28px; line-height:1.5; color:var(--sumi-soft); }
  .starbar .sb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe cn-safe">
    <div class="figure cn-fig" data-at="0" data-anim="left">
      <img src="assets/nagashino.webp" alt="1575年 長篠の戦い ── 馬防柵と鉄砲隊">
    </div>
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　織田信長</span>
        <h1 class="headline" style="font-size:60px;">鉄砲で<span class="em">戦い方</span>を変えた</h1>
      </div>
      <span class="yr" data-at="1" data-anim="pop">1575年</span>
      <p class="cn-line" data-at="1"><span class="blank" data-fill="2"><span class="bnum">⑪</span><b>長篠</b></span>の戦いで、<br><span class="blank" data-fill="3"><span class="bnum">＊</span><b>鉄砲隊</b></span>の活躍により<span class="imp">武田氏</span>を破った。</p>
      <div class="starbar" data-at="4" data-anim="fade">
        <span class="st">★ テスト頻出</span>
        <span class="sb">1575年、強かった武田の騎馬隊が<b>新しい武器の一斉射撃</b>の前に敗れた。<b>年号・戦いの地名・用いた武器</b>の3点をセットで覚える。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
