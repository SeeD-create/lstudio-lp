<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>鉄砲の伝来 ── 1543年・種子島｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 92px 140px 92px; grid-template-columns: 640px 1fr; gap: 56px; align-content: center; align-items: center; }
  .cn-fig { height: 620px; border-radius: 26px; display:grid; place-items:center; background:var(--paper-hi); box-shadow:0 16px 36px rgba(40,30,10,.12); }
  .cn-fig svg { width: 90%; height: 90%; }
  .ln { fill:none; stroke:var(--sumi); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
  .lnf { fill:var(--paper-lo); stroke:var(--sumi); stroke-width:4; stroke-linejoin:round; }
  .cn-txt { display:grid; gap:28px; align-content:center; }
  .cn-head { display:grid; gap:12px; }
  .yr { display:inline-flex; align-items:center; gap:14px; align-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; padding:8px 26px; border-radius:14px; letter-spacing:.06em; }
  .cn-line { font-size: 40px; line-height: 1.7; color: var(--sumi); font-weight:700; }
  .cn-line .blank { font-size: 44px; min-width: 300px; }
  .starbar { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border-left:10px solid var(--imp); border-radius:0 16px 16px 0; padding:24px 32px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .starbar .st { flex:none; font-weight:900; color:var(--imp); font-size:26px; letter-spacing:.08em; }
  .starbar .sb { font-size:28px; line-height:1.5; color:var(--sumi-soft); }
  .starbar .sb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe cn-safe">
    <div class="figure cn-fig" data-at="0" data-anim="left">
      <img src="assets/nanban_arrival.webp" alt="1543年 種子島に着いた南蛮船と鉄砲の伝来">
    </div>
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　南蛮の到来</span>
        <h1 class="headline" style="font-size:62px;">まず<span class="em">新しい武器</span>が海をこえて来た</h1>
      </div>
      <span class="yr" data-at="1" data-anim="pop">1543年</span>
      <p class="cn-line" data-at="1">ポルトガル人が<span class="blank" data-fill="3"><span class="bnum">②</span><b>種子島</b></span>に流れ着き、<br>日本に<span class="blank" data-fill="2"><span class="bnum">①</span><b>鉄砲</b></span>が伝わった。</p>
      <div class="starbar" data-at="4" data-anim="fade">
        <span class="st">★ テスト頻出</span>
        <span class="sb"><b>1543年・流れ着いた島・ポルトガル人・新兵器</b>の4点セットで。以後この武器は堺・国友などでつくられ、戦い方を大きく変えた。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
