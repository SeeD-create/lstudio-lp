<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>城と天守閣 ── 桃山文化｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { inset: 92px 150px 92px; align-content: center; gap: 34px; }
  .tk-head { display:grid; gap:12px; }
  .tk-line { font-size: 38px; line-height:1.6; color:var(--sumi); font-weight:700; }
  .tk-line .blank { font-size:44px; min-width:280px; }
  .castles { display:grid; grid-template-columns: repeat(3,1fr); gap:28px; }
  .castle { position:relative; background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:26px 30px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:8px; }
  .castle::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:19px 19px 0 0; }
  .castle .cn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .castle .cd { font-size:25px; color:var(--sumi-soft); line-height:1.4; }
  .castle .cd b { color:var(--imp); }
  .tk-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 40px; }
  .tk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .tk-bar .bb { font-size:27px; line-height:1.5; color:rgba(251,251,250,.92); }
  .tk-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe tk-safe">
    <div class="tk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　安土桃山の文化</span>
      <h1 class="headline" style="font-size:56px;">大名と商人の勢いを映す<span class="em">雄大な文化</span></h1>
    </div>
    <p class="tk-line" data-at="1">新興の大名や商人の勢いを反映した、雄大で豪華な文化を<span class="blank" data-fill="1"><span class="bnum">④</span><b>桃山文化</b></span>という。各地には高くそびえる<span class="blank" data-fill="2"><span class="bnum">②</span><b>天守閣</b></span>をもつ城がつくられた。</p>
    <div class="castles" data-at="3">
      <div class="castle"><div class="cn">安土城</div><div class="cd">織田信長が築いた城。</div></div>
      <div class="castle"><div class="cn">大阪城</div><div class="cd">豊臣秀吉が築いた城。</div></div>
      <div class="castle"><div class="cn">姫路城</div><div class="cd"><b>世界文化遺産</b>に登録。白鷺城とも。</div></div>
    </div>
    <div class="tk-bar" data-at="4" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">「この時代の文化の名前」と「城の高い建物の名前」の2語が問われる。信長＝安土城／秀吉＝大阪城／世界文化遺産＝姫路城で対応させる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
