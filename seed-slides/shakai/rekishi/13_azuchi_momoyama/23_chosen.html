<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>朝鮮出兵 ── 文禄の役／慶長の役｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cs-safe { inset: 90px 150px 90px; align-content: center; gap: 30px; }
  .cs-head { display:grid; gap:12px; }
  .cs-lead { font-size:36px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .cs-lead .blank { font-size:42px; min-width:300px; }
  .cs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .dcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 28px 36px;
           box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 12px; position: relative; align-content:start; }
  .dcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:21px 0 0 21px; }
  .dcard .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--cat); }
  .dcard .yr small { font-size:24px; color:var(--sumi-mute); margin-left:12px; }
  .dcard .nt { font-size: 28px; color: var(--sumi-soft); line-height:1.5; }
  .dcard .nt b { color: var(--imp); }
  .cs-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 40px; }
  .cs-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .cs-bar .bb { font-size:27px; line-height:1.5; color:rgba(251,251,250,.92); }
  .cs-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe cs-safe">
    <div class="cs-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　豊臣秀吉</span>
      <h1 class="headline" style="font-size:56px;">海をこえた ── <span class="em">2度の出兵</span></h1>
    </div>
    <p class="cs-lead" data-at="1">全国統一のあと、秀吉は明の征服をめざして<span class="blank" data-fill="1"><span class="bnum">⑳</span><b>朝鮮出兵</b></span>を行った。</p>
    <div class="cs-row">
      <div class="dcard" data-at="2" data-anim="left">
        <div class="yr">1592年<small>文禄の役</small></div>
        <div class="nt">1回目の出兵。朝鮮の水軍を率いる<b>李舜臣</b>の抵抗などで<b>苦戦</b>した。</div>
      </div>
      <div class="dcard" data-at="4" data-anim="right">
        <div class="yr">1597年<small>慶長の役</small></div>
        <div class="nt">2回目の出兵。翌年、<b>秀吉が病死</b>したため、途中で<b>中止</b>となった。</div>
      </div>
    </div>
    <div class="cs-bar" data-at="5" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">「出兵した国」＝<b>朝鮮</b>、「抵抗した人物」＝<b>李舜臣</b>。1592＝文禄の役、1597＝慶長の役。この戦いは豊臣氏が弱る原因にもなった。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
