<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>キリスト教の伝来 ── 1549年・ザビエル｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 92px 140px 92px; grid-template-columns: 600px 1fr; gap: 56px; align-content: center; align-items: center; }
  .cn-fig { height: 620px; border-radius: 26px; display:grid; place-items:center; background:var(--paper-hi); box-shadow:0 16px 36px rgba(40,30,10,.12); }
  .cn-fig svg { width: 84%; height: 84%; }
  .ln { fill:none; stroke:var(--sumi); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
  .lnf { fill:var(--paper-lo); stroke:var(--sumi); stroke-width:4; stroke-linejoin:round; }
  .cn-txt { display:grid; gap:24px; align-content:center; }
  .cn-head { display:grid; gap:12px; }
  .yr { display:inline-flex; align-items:center; gap:14px; align-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; padding:8px 26px; border-radius:14px; letter-spacing:.06em; }
  .cn-line { font-size: 38px; line-height: 1.7; color: var(--sumi); font-weight:700; }
  .cn-line .blank { font-size: 42px; min-width: 260px; }
  .cn-line .imp { color:var(--imp); }
  .starbar { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border-left:10px solid var(--imp); border-radius:0 16px 16px 0; padding:22px 32px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .starbar .st { flex:none; font-weight:900; color:var(--imp); font-size:26px; letter-spacing:.08em; }
  .starbar .sb { font-size:27px; line-height:1.5; color:var(--sumi-soft); }
  .starbar .sb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe cn-safe">
    <div class="figure cn-fig" data-at="0" data-anim="left">
      <img src="assets/christianity.webp" alt="1549年 ザビエルがキリスト教を伝える">
    </div>
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　南蛮の到来</span>
        <h1 class="headline" style="font-size:60px;">次に<span class="em">新しい神</span>が来た</h1>
      </div>
      <span class="yr" data-at="1" data-anim="pop">1549年</span>
      <p class="cn-line" data-at="1"><span class="imp">イエズス会</span>の宣教師<span class="blank" data-fill="2"><span class="bnum">④</span><b>フランシスコ＝ザビエル</b></span>が<br>鹿児島に来て<span class="blank" data-fill="3"><span class="bnum">③</span><b>キリスト教</b></span>を伝えた。<br>信者は<span class="blank" data-fill="4"><span class="bnum">⑤</span><b>キリシタン</b></span>とよばれ、西日本に多かった。</p>
      <div class="starbar" data-at="5" data-anim="fade">
        <span class="st">★ テスト頻出</span>
        <span class="sb">「何という会の宣教師か」＝<b>イエズス会</b>。<b>信者の呼び名</b>もカタカナで書けるように。1549・鹿児島・ザビエルもセットで。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
