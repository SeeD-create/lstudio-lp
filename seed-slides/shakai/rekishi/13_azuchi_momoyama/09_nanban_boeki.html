<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>南蛮貿易 ── 輸入と輸出｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nb-safe { inset: 90px 140px 90px; align-content: center; gap: 34px; }
  .nb-head { display:grid; gap:12px; }
  .nb-lead { font-size:34px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .nb-lead .blank { font-size:40px; min-width:280px; }
  .nb-lead .imp { color:var(--imp); }
  .flow { display:grid; grid-template-columns: 1fr 150px 1fr; gap:26px; align-items:stretch; }
  .fcard { position:relative; background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:28px 34px; box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:14px; align-content:start; }
  .fcard .fh { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--cat); }
  .fcard .fh small { font-size:24px; color:var(--sumi-mute); margin-left:12px; letter-spacing:0; }
  .items { display:flex; flex-wrap:wrap; gap:12px; }
  .items span { font-size:30px; font-weight:900; color:var(--sumi); background:var(--paper-lo); border-radius:12px; padding:10px 22px; }
  .items span.gin { color:var(--imp); background:var(--imp-bg); box-shadow:inset 0 0 0 2px var(--imp); }
  .arrow { display:grid; place-items:center; }
  .arrow .jp { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); text-align:center; line-height:1.2; }
  .arrow svg { width:120px; height:60px; }
  .nb-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 40px; }
  .nb-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .nb-bar .bb { font-size:27px; line-height:1.5; color:rgba(251,251,250,.92); }
  .nb-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe nb-safe">
    <div class="nb-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　南蛮の到来</span>
      <h1 class="headline" style="font-size:58px;">ヨーロッパ人との<span class="em">新しい貿易</span></h1>
    </div>
    <p class="nb-lead" data-at="0">16世紀中ごろ、日本に来た<span class="imp">スペイン人</span>・ポルトガル人を<span class="imp">南蛮人</span>とよび、彼らとの貿易を<span class="blank" data-fill="1"><span class="bnum">①</span><b>南蛮貿易</b></span>という。</p>
    <div class="flow">
      <div class="fcard" data-at="2" data-anim="left">
        <div class="fh">輸入<small>日本が買った物</small></div>
        <div class="items"><span>鉄砲</span><span>火薬</span><span>中国製の絹織物</span></div>
      </div>
      <div class="arrow" data-at="3">
        <div class="jp">日本</div>
        <svg viewBox="0 0 120 60"><path class="a" d="M4 30 h96 M78 12 l24 18 l-24 18" fill="none" stroke="var(--imp)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="jp" style="font-size:24px;color:var(--imp)">銀を輸出</div>
      </div>
      <div class="fcard" data-at="3" data-anim="right">
        <div class="fh">輸出<small>日本が売った物</small></div>
        <div class="items"><span class="gin">銀</span></div>
        <div style="font-size:25px;color:var(--sumi-soft);line-height:1.5">当時の日本は世界有数の銀の産地。ヨーロッパ人は日本の<b style="color:var(--imp)">銀</b>を持ち帰った。</div>
      </div>
    </div>
    <div class="nb-bar" data-at="5" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">「持ち帰った物は？」＝<b>銀</b>。輸入＝鉄砲・火薬・絹、輸出＝銀。「南蛮人＝スペイン・ポルトガル人」もセットで。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
