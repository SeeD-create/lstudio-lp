<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>キリシタン大名と少年使節 ── 1582年｜中1歴史 第13章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ks-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .ks-head { display: grid; gap: 12px; }
  .ks-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .dcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 34px 40px;
           box-shadow: 0 18px 40px rgba(40,30,10,.12); display: grid; gap: 16px; position: relative; align-content:start; }
  .dcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .dcard .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); letter-spacing:.06em; }
  .dcard .dt { font-size: 40px; font-weight: 700; color: var(--sumi); line-height:1.4; }
  .dcard .dt .blank { font-size: 44px; min-width: 380px; }
  .dcard .nt { font-size: 27px; color: var(--sumi-soft); line-height:1.45; }
  .dcard .nt b { color: var(--imp); }
  .names { display:flex; gap:12px; flex-wrap:wrap; }
  .names span { background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; border-radius:10px; padding:6px 18px; }
  .ks-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 40px; }
  .ks-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .ks-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.92); }
  .ks-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ks-safe">
    <div class="ks-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　南蛮の到来</span>
      <h1 class="headline" style="font-size:60px;">大名まで信者に ── そして<span class="em">ローマ</span>へ使いを送る</h1>
    </div>
    <div class="ks-row">
      <div class="dcard" data-at="1" data-anim="left">
        <div class="lb">信者になった大名</div>
        <div class="dt"><span class="blank" data-fill="1"><span class="bnum">◆</span><b>キリシタン大名</b></span></div>
        <div class="nt">大名の中にもキリスト教の信者になる者がいた。彼らをこう呼ぶ。</div>
      </div>
      <div class="dcard" data-at="2" data-anim="right">
        <div class="lb">1582年・ローマ教皇へ</div>
        <div class="dt">4人の<span class="blank" data-fill="3"><span class="bnum">⑥</span><b>少年使節</b></span></div>
        <div class="nt">九州の3大名が、ローマ教皇のもとへ4人の少年を送った（天正遣欧の使い）。</div>
        <div class="names" data-at="4"><span>大友</span><span>大村</span><span>有馬</span></div>
      </div>
    </div>
    <div class="ks-bar" data-at="4" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">「3大名は？」＝<b>大友・大村・有馬</b>。ローマへ送ったのは1582年。<b>信者そのもの</b>と<b>信者になった大名</b>で呼び名がちがうので区別に注意。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第13章 安土桃山時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
