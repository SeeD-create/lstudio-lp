<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bm-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 520px; align-content: center; gap: 54px; align-items: center; }
  .bm-txt { display: grid; gap: 24px; }
  .bm-fig { height: 560px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }

  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:26px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; text-align:center; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 28px 38px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 33px; line-height: 1.65; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 35px; min-width: 240px; }
  .def b.im { color: var(--imp); font-weight:900; }
  .chips { display:flex; flex-wrap:wrap; gap:14px; }
  .chip { background:var(--paper-hi); border:3px solid var(--cat); border-radius:14px; padding:14px 22px; font-size:28px; font-weight:900; color:var(--sumi); box-shadow:0 8px 20px rgba(40,30,10,.08); }
  .chip b { color: var(--imp); }
</style>
</head>

<div class="seed-stage"><div class="seed-slide" data-cat="new">
