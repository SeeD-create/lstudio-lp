<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>地租改正のしくみ ── 年貢から地租へ、収入が安定｜中2歴史 第19章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cz-safe { inset: 96px 150px 96px; align-content: center; gap: 36px; }
  .cz-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .cz-row { display: grid; grid-template-columns: 1fr 110px 1fr; align-items: stretch; gap: 0; }
  .box { border-radius: 24px; padding: 32px 40px; display: grid; gap: 16px; box-shadow: 0 16px 36px rgba(40,30,10,.10); }
  .box.old { background: var(--paper-hi); border: 3px solid var(--sumi-mute); }
  .box.new { background: var(--paper-hi); border: 3px solid var(--imp); }
  .box .bh { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; }
  .box.old .bh { color: var(--sumi-mute); }
  .box.new .bh { color: var(--imp); }
  .box ul { margin:0; padding:0; display:grid; gap:12px; }
  .box li { list-style:none; font-size:30px; line-height:1.4; color:var(--sumi); font-weight:700; display:flex; gap:14px; }
  .box li::before { content:"—"; color:var(--sumi-mute); }
  .box li b { color: var(--imp); }
  .cz-arrow { display:flex; align-items:center; justify-content:center; font-size:56px; color:var(--imp); font-weight:900; }
  .cz-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 36px; font-size:28px; }
  .cz-note b { color: var(--gold-soft); }
  .box ul li .blank { min-width:0; white-space:normal; padding:0 8px 3px; margin:0 2px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe cz-safe">
    <div class="cz-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　しくみの比較</span>
      <h1 class="headline" style="font-size:54px;"><span class="em">年貢</span>から<span class="em">地租</span>へ ── どう変わった？</h1>
    </div>
    <div class="cz-row">
      <div class="box old" data-at="1" data-anim="left">
        <div class="bh">江戸時代（年貢）</div>
        <ul>
          <li>納めるもの＝<b style="color:var(--sumi)">米</b></li>
          <li>基準＝その年の<b style="color:var(--sumi)">収穫高</b></li>
          <li>豊作・凶作で収入が<b style="color:var(--sumi)">変動</b></li>
        </ul>
      </div>
      <div class="cz-arrow" data-at="2">→</div>
      <div class="box new" data-at="2" data-anim="right">
        <div class="bh">明治（地租）</div>
        <ul>
          <li>納めるもの＝<span class="blank" data-fill="2"><b>貨幣（現金）</b></span></li>
          <li>基準＝<span class="blank" data-fill="2"><b>地価</b></span>の<span class="blank" data-fill="2"><b>3％</b></span></li>
          <li>毎年決まった額で収入が<span class="blank" data-fill="2"><b>安定</b></span></li>
        </ul>
      </div>
    </div>
    <div class="cz-note" data-at="3" data-anim="fade"><span>結果</span><span>政府の収入は毎年一定になった。いっぽう農民の負担は江戸時代と<b>あまり変わらず重い</b>ままで、各地で反対の一揆も起きた。</span></div>
  </div>
  <div class="seed-foot"><span>第19章 明治維新</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
