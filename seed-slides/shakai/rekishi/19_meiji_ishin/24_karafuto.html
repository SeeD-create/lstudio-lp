<div class="seed-stage"><div class="seed-slide" data-cat="soc">

    <div class="kf-txt">

        <span class="blank" data-fill="2"><span class="bnum">①</span><b>樺太・千島交換条約</b></span>を結んだ。<br>
        <b class="im">樺太をロシア領</b>、<b class="im">千島列島を日本領</b>とした。
      </div>
      <div class="kf-note" data-at="4" data-anim="fade"><span>覚え方</span><span>名前のとおり<b>「樺太」と「千島」を交換</b>。樺太→ロシア／千島→日本。1875年。</span></div>
