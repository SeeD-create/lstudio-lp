<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3つの条約くらべ ── 対等・領土・不平等｜中2歴史 第19章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jh-safe { inset: 88px 140px 88px; align-content: center; gap: 32px; }
  .jh-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .jh-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .col { background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c); box-shadow: 0 16px 34px rgba(40,30,10,.10);
         overflow:hidden; display:grid; align-content:start; min-height: 430px; }
  .col-h { background: var(--paper-hi); color: var(--sumi); border-bottom: 6px solid var(--c); padding: 20px 26px; display:grid; gap:6px; }
  .col-h .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; opacity:.85; }
  .col-h .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; line-height:1.15; }
  .col-b { padding: 22px 28px; display:grid; gap:16px; }
  .col-b .who { font-size: 28px; color: var(--sumi); font-weight:900; }
  .col-b .who b { color: var(--imp); }
  .col-b .kind { justify-self:start; padding:8px 22px; border-radius:999px; font-weight:900; font-size:26px; }
  .kind.eq { background:#E6EFE6; color:#2f6b2f; border:2.5px solid #4c9a4c; }
  .kind.uneq { background:var(--imp-bg); color:var(--imp); border:2.5px solid var(--imp); }
  .kind.terr { background:#E4ECF5; color:#2c6489; border:2.5px solid #3d84bb; }
  .col-b .ds { font-size: 25px; color: var(--sumi-soft); line-height:1.45; font-weight:600; }
  .jh-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; font-size:27px; }
  .jh-note b { color: var(--gold-soft); }
  .col-h .nm .blank { min-width:0; width:100%; white-space:normal; padding:0 8px 3px; margin:0; font-size:26px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe jh-safe">
    <div class="jh-head" data-at="0">
      <span class="kicker"><span class="num">整理</span>　外交の3条約</span>
      <h1 class="headline" style="font-size:52px;">相手が変われば、<span class="em">立場</span>も変わる</h1>
    </div>
    <div class="jh-row">
      <div class="col" style="--c:#3A3A39" data-at="1" data-anim="pop">
        <div class="col-h"><div class="yr">1871年・清</div><div class="nm"><span class="blank" data-fill="1"><b>日清修好条規</b></span></div></div>
        <div class="col-b"><div class="who">相手＝<b>清</b></div><span class="kind eq">対等</span><div class="ds">たがいに対等な立場で認め合う条約。</div></div>
      </div>
      <div class="col" style="--c:#535250" data-at="2" data-anim="pop">
        <div class="col-h"><div class="yr">1875年・ロシア</div><div class="nm"><span class="blank" data-fill="2"><b>樺太・千島交換条約</b></span></div></div>
        <div class="col-b"><div class="who">相手＝<b>ロシア</b></div><span class="kind terr">領土</span><div class="ds">樺太→ロシア領、千島列島→日本領。国境を確定。</div></div>
      </div>
      <div class="col" style="--c:#1A1A1A" data-at="3" data-anim="pop">
        <div class="col-h"><div class="yr">1876年・朝鮮</div><div class="nm"><span class="blank" data-fill="3"><b>日朝修好条規</b></span></div></div>
        <div class="col-b"><div class="who">相手＝<b>朝鮮</b></div><span class="kind uneq">不平等</span><div class="ds">江華島事件（1875）を口実に結ばせた不平等条約。</div></div>
      </div>
    </div>
    <div class="jh-note" data-at="4" data-anim="fade"><span>ここで差がつく</span><span>「<b>日清＝対等</b>」「<b>日朝＝不平等</b>」の対比が最頻出。樺太・千島は<b>ロシアと領土交換</b>と覚える。</span></div>
  </div>
  <div class="seed-foot"><span>第19章 明治維新</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
