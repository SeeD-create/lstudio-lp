<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>福沢諭吉と中江兆民 ── 新しい思想の紹介者｜中2歴史 第19章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fn-safe { inset: 96px 150px 96px; align-content: center; gap: 32px; }
  .fn-head { display: grid; gap: 12px; }
  .fn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .pc { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 40px;
        box-shadow: 0 16px 36px rgba(40,30,10,.10); display: grid; grid-template-columns: 120px 1fr; align-items:center; gap: 28px; }
  .pc .av { width: 120px; height: 120px; border-radius: 50%; background: var(--cat-bg); border: 3px solid var(--cat);
            display:grid; place-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--cat); }
  .pc .info { display:grid; gap:10px; }
  .pc .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .pc .nm .blank { font-size: 36px; min-width: 240px; }
  .pc .wk { font-size: 28px; color: var(--sumi-soft); font-weight:700; }
  .pc .wk b { color: var(--imp); font-weight:900; }
  .fn-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 36px; font-size:28px; }
  .fn-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe fn-safe">
    <div class="fn-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート4</span>　新しい思想</span>
      <h1 class="headline" style="font-size:56px;">西洋の考え方を、<span class="em">日本に紹介</span>した2人</h1>
    </div>
    <div class="fn-row">
      <div class="pc" data-at="1" data-anim="left">
        <span class="av">諭</span>
        <div class="info">
          <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>福沢諭吉</b></span></div>
          <div class="wk">『<b>学問のすゝめ</b>』を著し、<br>人間の平等と学ぶことの大切さを説いた。</div>
        </div>
      </div>
      <div class="pc" data-at="3" data-anim="right">
        <span class="av">兆</span>
        <div class="info">
          <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>中江兆民</b></span></div>
          <div class="wk"><b>ルソー</b>の思想（人民主権）を紹介し、<br>「東洋のルソー」と呼ばれた。</div>
        </div>
      </div>
    </div>
    <div class="fn-note" data-at="4" data-anim="fade"><span>ペアで暗記</span><span><b>『学問のすゝめ』の著者</b>と<b>ルソーを紹介した人物</b>。作品と人物のひもづけで問われる。</span></div>
  </div>
  <div class="seed-foot"><span>第19章 明治維新</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
