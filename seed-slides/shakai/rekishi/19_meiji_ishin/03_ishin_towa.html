<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　明治維新とは</span>
      <h1 class="headline" style="font-size:62px;">江戸幕府が倒れ、<span class="em">天皇中心の新国家</span>ができる大変革</h1>
    </div>
    <p class="tw-def" data-at="1">江戸幕府が倒れて<span class="em">新しい国家</span>ができた、政治・社会の大改革をまとめて<span class="em">明治維新</span>という。<br>政府は「欧米に追いつく」ことを目標に、政治・軍事・経済・文化を一気に造りかえた。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">政治の改革</div><div class="ds">御誓文・<b>版籍奉還</b>・<b>廃藩置県</b>で、国をひとつにまとめる。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">富国強兵</div><div class="ds"><b>学制・徴兵令・地租改正</b>と殖産興業で、国を富ませ兵を強く。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">外交と文明開化</div><div class="ds">北海道開拓・近隣国との条約と、<b>西洋化した生活・文化</b>。</div></div>
    </div>
  </div>
