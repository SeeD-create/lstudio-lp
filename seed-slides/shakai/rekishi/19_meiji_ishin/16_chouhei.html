<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>徴兵令 ── 1873年、20歳以上の男子に兵役｜中2歴史 第19章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sd-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 520px; align-content: center; gap: 58px; align-items: center; }
  .sd-txt { display: grid; gap: 26px; }
  .sd-fig { height: 520px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:200px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:26px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; text-align:center; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 38px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 36px; line-height: 1.7; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 38px; min-width: 200px; }
  .def b.im { color: var(--imp); font-weight:900; }
  .sd-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .sd-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .sd-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .sd-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sd-safe">
    <div class="sd-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート2　軍事</span>
        <h1 class="headline" style="font-size:52px;margin-top:16px;">近代的な<span class="em">軍隊</span>を国民からつくる</h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        <span class="blank" data-fill="2"><span class="bnum">①</span><b>1873</b></span>年、
        <span class="blank" data-fill="2"><span class="bnum">②</span><b>徴兵令</b></span>を出し、<br>
        <b class="im">満20歳以上の男子</b>を兵役につかせた。
      </div>
      <div class="sd-note" data-at="3" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb"><b>明治6年・20歳以上の男子</b>と、法令の名前。武士だけでなく<b>国民から兵をつのる</b>のが近代軍のポイント。</span>
      </div>
    </div>
    <div class="figure sd-fig" data-at="0" data-anim="right"><img src="assets/chouhei.webp" alt="徴兵令"></div>
  </div>
  <div class="seed-foot"><span>第19章 明治維新</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
