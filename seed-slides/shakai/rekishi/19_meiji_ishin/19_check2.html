<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 地租改正｜中2歴史 第19章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 40px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: grid; gap: 18px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 33px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:30px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av .r { color:#ff8a8f; }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 地租改正</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext" data-at="0">① 土地所有者に発行された、所有権を認める証明書は？<br>② 地租は地価の<span class="u">何％</span>を、③ 米と貨幣の<span class="u">どちら</span>で納めた？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">地券</span>　── 土地の所有権を認める証明書。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">3％</span>　── 収穫高ではなく「地価」を基準にする。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">貨幣（現金）</span>　── これで政府の収入が安定した。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第19章 明治維新</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
