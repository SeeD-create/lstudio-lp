<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hh-safe">
    <div class="hh-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　中央集権への2ステップ</span>
      <h1 class="headline" style="font-size:54px;">まず<span class="em">土地と人民</span>を返させ、次に<span class="em">藩</span>をなくす</h1>
    </div>
    <div class="hh-row">
      <div class="pc" data-at="1" data-anim="left">
        <span class="yr" data-at="2">1869年</span>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>版籍奉還</b></span></div>
        <div class="bd">大名が、これまで治めてきた<b>土地（版）と人民（籍）</b>を天皇に返した。</div>
      </div>
      <div class="mid-arrow" data-at="3">→</div>
      <div class="pc" data-at="3" data-anim="right">

        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>廃藩置県</b></span></div>
        <div class="bd">藩を廃止して<b>府・県</b>をおき、府に<b>府知事</b>・県に<b>県令</b>を中央から任命した。</div>
      </div>
    </div>
    <div class="hh-note" data-at="5" data-anim="fade"><span>ここが山場</span><span>1869年の改革だけでは大名がまだ土地を治めていた。1871年の改革で藩そのものをなくし、国が全国を直接治める＝<b>中央集権</b>が完成した。年号 <b>1869→1871</b> の順をセットで。</span></div>
  </div>
