<head>

<title>登場人物カード ── まず3人を覚える｜中2歴史 第23章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jn-safe { inset: 96px 180px 96px; align-content: start; gap: 34px; }
  .jn-head { display: grid; gap: 12px; }
  .jn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .pc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 34px 34px 38px; min-height: 540px; display: grid; align-content: start; gap: 18px; }
  .pc__seal { position:absolute; right:24px; top:20px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:140px; color:var(--c); opacity:.10; line-height:1; }
  .pc__from { font-weight:900; font-size:23px; color:var(--c); letter-spacing:.08em; }
  .pc__name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); line-height:1.1; }
  .pc__yomi { font-size:23px; color:var(--sumi-mute); font-weight:600; margin-top:-6px; }
  .pc__role { font-size:28px; color:var(--sumi-soft); line-height:1.55; font-weight:600; margin-top:6px; }
  .pc__role b { color:var(--imp); font-weight:900; }
  .pc__tag { justify-self:start; margin-top:auto; padding:8px 20px; border-radius:10px; background:var(--c); color:#fff; font-weight:900; font-size:22px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe jn-safe">
    <div class="jn-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　この単元の登場人物</span>
      <h1 class="headline" style="font-size:60px;">まず、この<span class="em">3人</span>の顔ぶれを覚える</h1>
    </div>
    <div class="jn-row">
      <div class="pc" style="--c:#7A2E2E" data-at="1" data-anim="pop">
        <span class="pc__seal">露</span>
        <span class="pc__from">ロシア</span>
        <span class="pc__name">レーニン</span>
        <span class="pc__yomi">Lenin</span>
        <span class="pc__role"><b>ロシア革命</b>を指導し、<br>世界初の社会主義国をつくる。</span>
        <span class="pc__tag">ロシア革命</span>
      </div>
      <div class="pc" style="--c:#2E4A7A" data-at="2" data-anim="pop">
        <span class="pc__seal">米</span>
        <span class="pc__from">アメリカ大統領</span>
        <span class="pc__name">ウィルソン</span>
        <span class="pc__yomi">Wilson</span>
        <span class="pc__role"><b>民族自決</b>をとなえ、<br><b>国際連盟</b>の設立を提唱する。</span>
        <span class="pc__tag">国際連盟</span>
      </div>
      <div class="pc" style="--c:#2E6B4A" data-at="3" data-anim="pop">
        <span class="pc__seal">印</span>
        <span class="pc__from">インド</span>
        <span class="pc__name">ガンディー</span>
        <span class="pc__yomi">Gandhi</span>
        <span class="pc__role"><b>非暴力・不服従</b>をとなえ、<br>イギリスからの独立を求める。</span>
        <span class="pc__tag">インド独立運動</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第23章 第一次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
