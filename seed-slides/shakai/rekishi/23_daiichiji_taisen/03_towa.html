<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　第一次世界大戦とは</span>
      <h1 class="headline" style="font-size:58px;">列強の<span class="em">同盟の対立</span>が、世界を巻きこむ<span class="em">総力戦</span>に</h1>
    </div>
    <p class="tw-def" data-at="1">20世紀のはじめ、ヨーロッパの列強は<span class="em">三国同盟</span>と<span class="em">三国協商</span>にわかれて対立していた。<br>その火種が<span class="em">バルカン半島</span>で爆発し、世界を二分する<span class="em">第一次世界大戦</span>へ。戦争はロシア革命を生み、終わったあとには<span class="em">国際協調</span>の時代が始まる。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">同盟の対立</div><div class="ds"><b>三国同盟</b>と<b>三国協商</b>。火薬庫バルカンで対立が激化。</div></div>
      <div class="arrow" data-at="2">→</div>
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">大戦の勃発</div><div class="ds"><b>サラエボ事件</b>から開戦。日本も参戦し総力戦に。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">ロシア革命</div><div class="ds"><b>レーニン</b>が指導。世界初の社会主義国が生まれる。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">終結と協調</div><div class="ds"><b>ベルサイユ条約</b>・<b>国際連盟</b>で戦後秩序をつくる。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第23章 第一次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
