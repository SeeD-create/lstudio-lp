<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 終結と講和｜中2歴史 第23章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 37px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .ans { margin-top: 34px; display: grid; gap: 18px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 32px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:30px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 終結と講和</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext">① 1919年、パリ講和会議で結ばれた講和条約は？<br>② 1920年、ウィルソンの提唱でつくられた国際組織は？　③ 1921年に開かれた軍備縮小の会議は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">ベルサイユ条約</span>　── 民族自決で東欧諸国が独立。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">国際連盟</span>　── アメリカ・ソ連は不参加。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">ワシントン会議</span>　── 軍艦の制限・日英同盟の廃止。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第23章 第一次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
