<!DOCTYPE html>

<head>

<title>第一次世界大戦 ── 同盟国と連合国の総力戦｜中2歴史 第23章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 90px 160px 90px; align-content: center; gap: 32px; }
  .lc-head { display: grid; gap: 12px; }
  .lc-q { font-size: 41px; font-weight: 700; color: var(--sumi); line-height: 1.55; }
  .lc-q .blank { font-size: 45px; min-width: 300px; }
  .yeartag { display:inline-flex; align-items:center; gap:12px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; padding:7px 20px; border-radius:12px; }
  .vs { display:grid; grid-template-columns:1fr 90px 1fr; align-items:center; gap:0; }
  .army { background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:20px 26px; display:grid; gap:6px; box-shadow:0 8px 20px rgba(40,30,10,.08); }
  .army .an { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi); }
  .army .am { font-size:25px; color:var(--sumi-soft); font-weight:700; }
  .army .am b { color:var(--imp); }
  .vsmk { text-align:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi-mute); }
  .note { font-size:29px; line-height:1.5; color:var(--sumi); font-weight:600; }
  .note b { color:var(--imp); font-weight:900; }
  .hit { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe lc-safe">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 大戦の勃発　<span class="yeartag" style="margin-left:12px;">1914〜1918</span></span>
      <h1 class="headline" style="font-size:50px;margin-top:14px;">世界を二つに割った、4年間の大戦</h1>
    </div>
    <p class="lc-q" data-at="1" data-anim="fade">サラエボ事件をきっかけに始まった戦争を
      <span class="blank" data-fill="2"><span class="bnum">◆</span><b>第一次世界大戦</b></span> という。</p>
    <div class="vs" data-at="2" data-anim="pop">
      <div class="army"><span class="an">同盟国</span><span class="am"><b>ドイツ</b>を中心（同盟側）</span></div>
      <div class="vsmk">VS</div>
      <div class="army"><span class="an">連合国</span><span class="am"><b>イギリス</b>を中心（協商側）</span></div>
    </div>
    <p class="note" data-at="3" data-anim="left">国民や資源をすべて動員する<b>総力戦</b>となり、戦争は世界中に広がった（1914〜1918）。</p>
    <div class="hit" data-at="4" data-anim="fade">
      <span class="bt">★ 頻出</span>
      <span class="bb"><b>ドイツ中心＝同盟国</b>／<b>イギリス中心＝連合国</b>。1914〜1918の4年間、国をあげての<b>総力戦</b>。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第23章 第一次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
