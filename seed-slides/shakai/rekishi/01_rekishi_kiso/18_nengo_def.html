<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>年号とは｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 90px 150px 90px; grid-template-columns: 1fr 520px; align-items: center; gap: 66px; }
  .df-left { display: grid; gap: 30px; }
  .df-fig { height: 560px; border-radius: 26px; }
  .df-card { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 36px 44px;
             box-shadow: 0 18px 40px rgba(40,30,10,.12); position: relative; }
  .df-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .df-lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--cat); letter-spacing:.08em; margin-bottom:14px; }
  .df-tx { font-size: 38px; line-height: 1.55; color: var(--sumi); font-weight:500; }
  .df-tx .blank { font-size: 40px; min-width: 260px; }
  .chips { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .chip { display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--paper-hi); border:2.5px solid var(--cat);
          border-radius:16px; padding:14px 24px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .chip small { font-size:18px; color:var(--sumi-mute); font-weight:700; letter-spacing:.05em; }
  .chip.now { background:var(--cat); color:#fff; } .chip.now small { color:rgba(255,255,255,.8); }
  .arrow { font-size:30px; color:var(--sumi-mute); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe df-safe">
    <div class="df-left">
      <div data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　③ 年号</span>
        <h1 class="headline" style="font-size:60px; margin-top:12px;">年号は<span class="em">日本ならでは</span>の数え方</h1>
      </div>
      <div class="df-card" data-at="1" data-anim="left">
        <div class="df-lb">年号（ねんごう）とは</div>
        <div class="df-tx">明治・大正・昭和・平成・令和など、<br><span class="blank" data-fill="2"><b>日本独自</b></span>の年代の表し方。</div>
      </div>
      <div class="chips" data-at="3" data-anim="fade">
        <span class="chip">明治</span><span class="arrow">→</span>
        <span class="chip">大正</span><span class="arrow">→</span>
        <span class="chip">昭和</span><span class="arrow">→</span>
        <span class="chip">平成</span><span class="arrow">→</span>
        <span class="chip now">令和<small>いま</small></span>
      </div>
    </div>
    <div class="figure df-fig" data-at="0" data-anim="right"><img src="assets/nengo_fuda.webp" alt="年号の立て札"></div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
