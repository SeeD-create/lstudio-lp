<style>
  .iz-safe { inset: 96px 130px 96px; align-content: center; gap: 40px; }

  .grid16 { display:grid; grid-template-columns: repeat(8, 1fr); gap: 18px; }
  .it { position:relative; background:var(--paper-hi); border:2.5px solid var(--cat); border-radius:16px; padding:18px 10px 16px; text-align:center;

  .it .no { position:absolute; top:-14px; left:50%; transform:translateX(-50%); background:var(--cat); color:#fff;

            display:flex; align-items:center; justify-content:center; }

  .it .nm .blank { min-width:0; padding:0 6px 3px; margin:0; gap:0; border-bottom-width:4px; }
  .it small { display:block; font-size:16px; color:var(--sumi-mute); font-weight:700; margin-top:4px; }
  .iz-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 40px; }
  .iz-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }

</style>
