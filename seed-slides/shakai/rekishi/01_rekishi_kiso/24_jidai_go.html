<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>時代の並び② 鎌倉から令和まで｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jd-safe { inset: 96px 150px 96px; align-content: center; gap: 44px; }
  .jd-head { display: grid; gap: 12px; }
  .chain { display:flex; flex-wrap:wrap; align-items:center; gap:20px 16px; }
  .ec { display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--paper-hi); border:3px solid var(--cat);
        border-radius:18px; padding:20px 24px; box-shadow:0 10px 24px rgba(40,30,10,.10); min-width:150px; }
  .ec .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); }
  .ec .nm .blank { font-size:36px; min-width:140px; padding:2px 12px 4px; }
  .ec small { font-size:19px; color:var(--sumi-mute); font-weight:700; }
  .ar { font-size:30px; color:var(--sumi-mute); font-family:'Zen Old Mincho',serif; font-weight:900; }
  .endlb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe jd-safe">
    <div class="jd-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　④ 時代</span>
      <h1 class="headline" style="font-size:56px;">時代の並び② ── 室町から<span class="em">現代</span>まで</h1>
    </div>
    <div class="chain" data-at="1" data-anim="fade">
      <div class="ec"><div class="nm">室町</div><small>むろまち</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">安土桃山</div><small>あづちももやま</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm"><span class="blank" data-fill="2"><b>江戸</b></span></div><small>えど</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm"><span class="blank" data-fill="3"><b>明治</b></span></div><small>めいじ</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">大正</div><small>たいしょう</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">昭和</div><small>しょうわ</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">平成</div><small>へいせい</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm"><span class="blank" data-fill="4"><b>令和</b></span></div><small>れいわ</small></div>
      <span class="endlb">◀ 新しい</span>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
