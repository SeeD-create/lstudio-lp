<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世紀とは｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .df-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-items: center; gap: 70px; }
  .df-left { display: grid; gap: 34px; }
  .df-fig { height: 560px; border-radius: 26px; }
  .df-card { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 40px 46px;
             box-shadow: 0 18px 40px rgba(40,30,10,.12); position: relative; display: grid; gap: 20px; }
  .df-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .df-lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--cat); letter-spacing:.08em; }
  .df-tx { font-size: 40px; line-height: 1.55; color: var(--sumi); font-weight:500; }
  .df-tx .blank { font-size: 42px; min-width: 220px; }
  .df-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; font-size:28px; line-height:1.45; }
  .df-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe df-safe">
    <div class="df-left">
      <div data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　② 世紀</span>
        <h1 class="headline" style="font-size:66px; margin-top:14px;">世紀は年を<span class="em">束ねた</span>めもり</h1>
      </div>
      <div class="df-card" data-at="1" data-anim="left">
        <div class="df-lb">世紀（せいき）とは</div>
        <div class="df-tx">西暦で<span class="blank" data-fill="2"><b>100年</b></span>をひとまとめにした言い方。</div>
      </div>
      <div class="df-note" data-at="1"><span>★</span><span>「◯◯年」より大まかに、時代のかたまりで語りたいときに使う。</span></div>
    </div>
    <div class="figure df-fig" data-at="0" data-anim="right"><img src="assets/century_bundle.webp" alt="100年の束"></div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(3);</script>
</body>
</html>
