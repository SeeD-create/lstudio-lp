<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>確認② 紀元前3世紀は西暦何年から何年か｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .q-safe { inset: 96px 150px 96px; align-content: center; gap: 44px; }
  .q-head { display: grid; gap: 14px; }
  .q-num { display:inline-flex; align-items:center; justify-content:center; width:70px; height:70px; border-radius:50%;
           background:var(--new); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; }
  .q-ttl { display:flex; align-items:center; gap:26px; }
  .q-ask { font-size: 54px; line-height:1.4; font-weight:700; color:var(--sumi); }
  .q-ans { display:flex; align-items:center; justify-content:center; gap:20px; font-size:50px; font-weight:700; color:var(--sumi); }
  .q-ans .blank { font-size:54px; min-width:400px; }
  .q-note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:26px 40px; }
  .q-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .q-note .bb { font-size:29px; line-height:1.5; } .q-note .bb b { color:#fff; } .q-note .bb .imp { color:var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe q-safe">
    <div class="q-head" data-at="0">
      <span class="kicker"><span class="num">確認問題</span>　授業ノート1</span>
      <div class="q-ttl"><span class="q-num">②</span><span class="q-ask">紀元前3世紀とは西暦何年から何年までのことか。</span></div>
    </div>
    <div class="q-ans" data-at="1" data-anim="pop">
      <span class="blank" data-fill="1"><b>紀元前201</b></span>年　～　<span class="blank" data-fill="1"><b>紀元前300</b></span>年
    </div>
    <div class="q-note" data-at="2" data-anim="fade">
      <span class="bt">解き方</span>
      <span class="bb">数え方は紀元後と同じで201〜300年。ただし紀元前は<span class="imp">数字が大きいほど昔</span>なので、古い方が300年・新しい方が201年。<b>紀元前は必ず「紀元前」をつける</b>。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(3);</script>
</body>
</html>
