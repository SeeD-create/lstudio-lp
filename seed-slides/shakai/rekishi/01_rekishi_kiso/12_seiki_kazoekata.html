<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世紀の数え方｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .sk-head { display: grid; gap: 12px; }
  .sk-row { display: grid; gap: 26px; }
  .srow { display:grid; grid-template-columns: 300px 1fr; align-items:center; gap:34px;
          background:var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:30px 40px; box-shadow:0 14px 32px rgba(40,30,10,.10); position:relative; }
  .srow::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .srow .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--cat); }
  .srow .rg { font-size:40px; font-weight:500; color:var(--sumi); }
  .srow .rg .blank { font-size:42px; min-width:230px; }
  .srow .rg .imp { color:var(--imp); font-weight:900; }
  .sk-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 40px; }
  .sk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .sk-bar .bb { font-size:28px; line-height:1.5; } .sk-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　② 世紀</span>
      <h1 class="headline" style="font-size:60px;">「◯世紀」の<span class="em">中身</span>を見る</h1>
    </div>
    <div class="sk-row">
      <div class="srow" data-at="1" data-anim="left">
        <div class="nm">1世紀</div>
        <div class="rg">紀元後 <span class="blank" data-fill="2"><b>1年</b></span> ～ <span class="blank" data-fill="2"><b>100年</b></span> まで</div>
      </div>
      <div class="srow" data-at="3" data-anim="left">
        <div class="nm">15世紀</div>
        <div class="rg"><span class="blank" data-fill="4"><b>1401年</b></span> ～ <span class="blank" data-fill="4"><b>1500年</b></span> まで</div>
      </div>
    </div>
    <div class="sk-bar" data-at="4" data-anim="fade">
      <span class="bt">★ ここが要</span>
      <span class="bb">世紀の区切りは<b>0年からではない</b>。だから15世紀のはじまりは1400年ではなく、その<b>次の年</b>。終わりは<b>ちょうど◯00の年</b>になる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
