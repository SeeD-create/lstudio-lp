<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rei-safe { inset: 96px 150px 96px; align-content: center; gap: 44px; }
  .rei-head { display: grid; gap: 12px; }
  .rei-row { display: grid; gap: 30px; }
  .exq { display:flex; align-items:center; gap:30px; background:var(--paper-hi); border-left:12px solid var(--cat);
         border-radius:0 20px 20px 0; padding:34px 44px; box-shadow:0 12px 30px rgba(40,30,10,.10); }
  .exq .ex-tag { flex:none; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--cat); font-size:30px; letter-spacing:.1em; white-space:nowrap; }

  .exq .ex-tx .imp { color: var(--imp); font-weight:900; }
  .exq .blank { font-size:42px; min-width:300px; }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe rei-safe">
    <div class="rei-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　① 西暦</span>
      <h1 class="headline" style="font-size:60px;">こう<span class="em">使う</span> ── 起きた年をそのまま数字で</h1>
    </div>
    <div class="rei-row">
      <div class="exq" data-at="1" data-anim="left">
        <span class="ex-tag">例1</span>
        <span class="ex-tx"><span class="blank" data-fill="2"><b>紀元前221</b></span>年に、<span class="imp">秦</span>（しん）が中国を統一。</span>
      </div>
      <div class="exq" data-at="2" data-anim="left">
        <span class="ex-tag">例2</span>
        <span class="ex-tx"><span class="blank" data-fill="3"><b>1894</b></span>年に、<span class="imp">日清戦争</span>が始まる。</span>
      </div>
    </div>
    <p class="lead" data-at="3" style="text-align:center; justify-self:center; font-size:32px;">紀元前は「紀元前◯年」、紀元後は数字だけ。この2つの書き分けができればOK。</p>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
