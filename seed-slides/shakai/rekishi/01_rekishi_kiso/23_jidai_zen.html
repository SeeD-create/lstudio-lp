<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>時代の並び① 先土器から平安まで｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jd-safe { inset: 96px 150px 96px; align-content: center; gap: 44px; }
  .jd-head { display: grid; gap: 12px; }
  .chain { display:flex; flex-wrap:wrap; align-items:center; gap:20px 16px; }
  .ec { display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--paper-hi); border:3px solid var(--cat);
        border-radius:18px; padding:20px 26px; box-shadow:0 10px 24px rgba(40,30,10,.10); min-width:150px; }
  .ec .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  .ec .nm .blank { font-size:38px; min-width:150px; padding:2px 12px 4px; }
  .ec small { font-size:19px; color:var(--sumi-mute); font-weight:700; }
  .ar { font-size:32px; color:var(--sumi-mute); font-family:'Zen Old Mincho',serif; font-weight:900; }
  .startlb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe jd-safe">
    <div class="jd-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　④ 時代</span>
      <h1 class="headline" style="font-size:56px;">時代の並び① ── <span class="em">古い順</span>に、先土器から平安まで</h1>
    </div>
    <div class="chain" data-at="1" data-anim="fade">
      <span class="startlb">古い ▶</span>
      <div class="ec"><div class="nm">先土器</div><small>せんどき</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm"><span class="blank" data-fill="2"><b>縄文</b></span></div><small>じょうもん</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">弥生</div><small>やよい</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">古墳</div><small>こふん</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">飛鳥</div><small>あすか</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm"><span class="blank" data-fill="3"><b>奈良</b></span></div><small>なら</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm">平安</div><small>へいあん</small></div>
      <span class="ar">→</span>
      <div class="ec"><div class="nm"><span class="blank" data-fill="4"><b>鎌倉</b></span></div><small>かまくら</small></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
