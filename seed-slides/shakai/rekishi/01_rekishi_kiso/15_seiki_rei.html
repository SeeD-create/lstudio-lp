<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>世紀の使い方｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rei-safe { inset: 96px 150px 96px; align-content: center; gap: 44px; }
  .rei-head { display: grid; gap: 12px; }
  .exq { display:flex; align-items:center; gap:30px; background:var(--paper-hi); border-left:12px solid var(--cat);
         border-radius:0 20px 20px 0; padding:40px 48px; box-shadow:0 12px 30px rgba(40,30,10,.10); }
  .exq .ex-tag { flex:none; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--cat); font-size:30px; letter-spacing:.1em; white-space:nowrap; }
  .exq .ex-tx { font-size:44px; line-height:1.55; color:var(--sumi); font-weight:500; }
  .exq .ex-tx .imp { color: var(--imp); font-weight:900; }
  .exq .blank { font-size:44px; min-width:250px; }
  .note { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:26px 40px; }
  .note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .note .bb { font-size:29px; line-height:1.5; } .note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe rei-safe">
    <div class="rei-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　② 世紀</span>
      <h1 class="headline" style="font-size:60px;">世紀と西暦を<span class="em">セット</span>で使う</h1>
    </div>
    <div class="exq" data-at="1" data-anim="left">
      <span class="ex-tag">例</span>
      <span class="ex-tx"><span class="blank" data-fill="2"><b>12世紀</b></span>後半の1192年に、<span class="blank" data-fill="3"><b>源頼朝</b></span>（みなもとのよりとも）が<span class="imp">征夷大将軍</span>となる。</span>
    </div>
    <div class="note" data-at="3" data-anim="fade">
      <span class="bt">★ 読み方</span>
      <span class="bb">1192年は「11｜92 → 11＋1」で答えが出る。1150〜1200年あたりだから、その<b>後半</b>。世紀で大まかに、西暦でぴったりを言い分ける。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
