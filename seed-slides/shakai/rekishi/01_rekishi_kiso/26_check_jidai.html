<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 時代の順番｜中1歴史 §1</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cj-safe { align-content: center; gap: 46px; justify-items: center; }
  .cj-head { display: grid; gap: 16px; justify-items: center; text-align: center; }
  .given { display:flex; gap:20px; }
  .given .g { background:var(--paper-hi); border:3px solid var(--sumi-mute); border-radius:16px; padding:16px 30px;
              font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi-soft); box-shadow:0 8px 20px rgba(40,30,10,.08); }
  .chain { display:flex; align-items:center; gap:20px; }
  .chain .box { background:var(--paper-hi); border:3px solid var(--par); border-radius:18px; padding:18px 20px 22px; min-width:230px; text-align:center;
                box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .chain .box .odr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:22px; color:var(--par); opacity:.6; }
  .chain .box .blank { font-size:44px; min-width:180px; margin-top:6px; }
  .chain .ar { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi-mute); }
  .cj-exp { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 40px; max-width:1500px; }
  .cj-exp .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .cj-exp .bb { font-size:28px; line-height:1.5; } .cj-exp .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe cj-safe">
    <div class="cj-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>ミニ確認</span>
      <h1 class="headline" style="font-size:52px;">次の4つを<span class="em">古い順</span>に並べよう</h1>
      <div class="given"><span class="g">江戸</span><span class="g">奈良</span><span class="g">室町</span><span class="g">鎌倉</span></div>
    </div>
    <div class="chain">
      <div class="box" data-at="1" data-anim="pop"><div class="odr">古い</div><div class="blank" data-fill="1"><b>奈良時代</b></div></div>
      <span class="ar" data-at="1">→</span>
      <div class="box" data-at="1" data-anim="pop"><div class="odr">↓</div><div class="blank" data-fill="1"><b>鎌倉時代</b></div></div>
      <span class="ar" data-at="2">→</span>
      <div class="box" data-at="2" data-anim="pop"><div class="odr">↓</div><div class="blank" data-fill="2"><b>室町時代</b></div></div>
      <span class="ar" data-at="2">→</span>
      <div class="box" data-at="2" data-anim="pop"><div class="odr">新しい</div><div class="blank" data-fill="2"><b>江戸時代</b></div></div>
    </div>
    <div class="cj-exp" data-at="3" data-anim="fade">
      <span class="bt">★ 締め</span>
      <span class="bb">奈良（8世紀）→ 鎌倉 → 室町 → 江戸 の順。<b>全16区分の並び</b>が頭に入っていれば、どの時代の前後もすぐ言える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
