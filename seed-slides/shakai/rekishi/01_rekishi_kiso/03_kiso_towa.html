<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kt-safe { inset: 96px 140px 96px; grid-template-columns: 620px 1fr; align-items: center; gap: 70px; }

  .kt-right { display: grid; gap: 22px; }
  .mono { display:flex; align-items:flex-start; gap:24px; background:var(--paper-hi); border-left:10px solid var(--cat);
          border-radius:0 16px 16px 0; padding:24px 30px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .mono .no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--cat); line-height:1; flex:none; width:60px; }
  .mono .tx { display:grid; gap:4px; }
  .mono .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .mono .ds { font-size:27px; color:var(--sumi-soft); line-height:1.4; }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kt-safe">
    <div class="kt-left">
      <div data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　歴史学習の基礎</span>
        <h1 class="headline" style="font-size:60px; margin-top:14px;">年代の数え方は<span class="em">4つ</span></h1>
      </div>
      <div class="figure kt-fig" data-at="0" data-anim="left"><img src="assets/timeline_ruler.webp" alt="時間のものさし"></div>
    </div>

      <div class="mono" data-at="1" data-anim="right"><div class="no">①</div><div class="tx"><div class="nm"><span class="blank" data-fill="1"><b>西暦</b></span></div><div class="ds">世界共通のものさし。1年きざみで数える。</div></div></div>
      <div class="mono" data-at="2" data-anim="right"><div class="no">②</div><div class="tx"><div class="nm"><span class="blank" data-fill="2"><b>世紀</b></span></div><div class="ds">100年をひとまとめにした、大きなめもり。</div></div></div>

      <div class="mono" data-at="4" data-anim="right"><div class="no">④</div><div class="tx"><div class="nm"><span class="blank" data-fill="4"><b>時代</b></span></div><div class="ds">縄文・江戸など、歴史を分ける区切り。</div></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第1章 歴史学習の基礎</span><span class="brand">SEED EDUCATION</span></div>
