<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>幕府のしくみ ── 授業ノート1｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 80px 120px 84px; align-content: start; gap: 22px; }
  .sk-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .org { display: grid; justify-items: center; gap: 14px; }
  .node { background: var(--sumi); color: var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900;
          border-radius: 16px; padding: 14px 46px; font-size: 40px; box-shadow: 0 12px 28px rgba(40,30,10,.16); }
  .node.sub { background: var(--paper-hi); color: var(--sumi); border: 3px solid var(--cat); font-size: 34px; padding: 12px 34px; }
  .node.sub .blank { font-size: 34px; min-width: 190px; }
  .link { width: 4px; height: 22px; background: var(--sumi-mute); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; }
  .col { background: var(--paper-hi); border-radius: 20px; border: 2px solid var(--hair); box-shadow: 0 12px 28px rgba(40,30,10,.09);
         padding: 20px 26px; display: grid; gap: 12px; }
  .col-t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); text-align:center;
           border-bottom: 2px solid var(--hair); padding-bottom: 10px; }
  .item { display: grid; grid-template-columns: 260px 1fr; align-items: center; gap: 18px; }
  .item .k { display:flex; align-items:baseline; gap:8px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:33px; color:var(--sumi); }
  .item .k .blank { font-size: 33px; min-width: 180px; }
  .item .v { font-size: 25px; line-height: 1.35; color: var(--sumi-soft); font-weight: 600; }
  .item .v .em { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　鎌倉幕府のしくみ</span>
      <h1 class="headline" style="font-size:50px;">将軍の下に、役所がきれいに分かれる</h1>
    </div>

    <div class="org">
      <div class="node" data-at="1" data-anim="pop">将軍（源頼朝）</div>
      <div class="link" data-at="1"></div>
      <div class="node sub" data-at="1" data-anim="pop"><span class="blank" data-fill="1"><span class="bnum">①</span><b>執権</b></span>　…将軍の補佐</div>
    </div>

    <div class="cols">
      <div class="col" data-at="2" data-anim="left">
        <div class="col-t">中央（鎌倉）</div>
        <div class="item"><span class="k"><span class="blank" data-fill="2"><span class="bnum">②</span><b>侍所</b></span></span><span class="v"><span class="em">御家人をまとめる</span>役所</span></div>
        <div class="item"><span class="k"><span class="blank" data-fill="3"><span class="bnum">③</span><b>政所</b></span></span><span class="v">幕府の<span class="em">政治・財政</span>を行う</span></div>
        <div class="item"><span class="k"><span class="blank" data-fill="4"><span class="bnum">④</span><b>問注所</b></span></span><span class="v">御家人からの<span class="em">訴えをさばく</span></span></div>
      </div>
      <div class="col" data-at="5" data-anim="right">
        <div class="col-t">地方</div>
        <div class="item"><span class="k"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>守護</b></span></span><span class="v">国ごとに置き、<span class="em">軍事・警察</span></span></div>
        <div class="item"><span class="k"><span class="blank" data-fill="6"><span class="bnum">⑥</span><b>地頭</b></span></span><span class="v">荘園からの<span class="em">年貢の取り立て</span></span></div>
        <div class="item"><span class="k" style="opacity:.55;font-size:27px;">京都：六波羅探題</span><span class="v" style="font-size:22px;">承久の乱の後に設置（→CARD Ⅲ）</span></div>
      </div>
    </div>
    <div style="justify-self:center;" data-at="7"><span class="tag tag--gold">★ 頻出 ── 中央の3つの役所と、それぞれの仕事</span></div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(8);</script>
</body>
</html>
