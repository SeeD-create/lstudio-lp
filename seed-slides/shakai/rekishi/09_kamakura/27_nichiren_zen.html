<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>題目と禅 ── 日蓮・栄西・道元｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nz-safe { inset: 90px 140px 90px; align-content: center; gap: 26px; }
  .nz-head { display: grid; gap: 10px; }
  .nz-nichiren { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 28px;
                 background: var(--paper-hi); border-left: 12px solid var(--cat); border-radius: 0 20px 20px 0;
                 padding: 26px 36px; box-shadow: 0 12px 28px rgba(40,30,10,.09); }
  .nz-nichiren .kk { font-family:'Zen Old Mincho',serif; font-weight:900; }
  .nz-nichiren .kk .lab { display:block; font-size:22px; color:var(--sumi-mute); font-weight:700; letter-spacing:.1em; }
  .nz-nichiren .kk .p { font-size:36px; color:var(--sumi-mute); }
  .nz-nichiren .kk .p .blank { font-size:38px; min-width:150px; }
  .nz-nichiren .kk .s { font-size:52px; color:var(--sumi); margin-top:4px; }
  .nz-nichiren .kk .s .blank { font-size:48px; min-width:220px; }
  .nz-nichiren .dd { font-size: 30px; line-height: 1.5; color: var(--sumi-soft); font-weight: 600; }
  .nz-nichiren .dd .em { color: var(--imp); font-weight: 900; }
  .zen-wrap { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.09);
              padding: 24px 34px; display: grid; gap: 16px; }
  .zen-t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); display:flex; align-items:baseline; gap:10px; }
  .zen-t .blank { font-size:34px; min-width:170px; }
  .zen-t small { font-size:24px; color:var(--sumi-mute); font-weight:500; }
  .zen-row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .zen-box { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 18px;
             background: var(--paper); border-radius: 14px; padding: 16px 24px; }
  .zen-box .kaiso { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .zen-box .info { font-size: 26px; line-height: 1.35; color: var(--sumi); font-weight: 700; }
  .zen-box .info .blank { font-size: 30px; min-width: 170px; }
  .zen-box .info small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:500; }
  .zen-box .info .em { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe nz-safe">
    <div class="nz-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅴ 新しい仏教・題目と禅</span>
      <h1 class="headline" style="font-size:46px;">題目をとなえる／座禅でさとる</h1>
    </div>

    <div class="nz-nichiren" data-at="1" data-anim="left">
      <div class="kk"><span class="lab">開祖</span><span class="p"><span class="blank" data-fill="1"><span class="bnum">①</span><b>日蓮</b></span></span>
        <span class="s"><span class="blank" data-fill="2"><span class="bnum">②</span><b>日蓮宗</b></span></span></div>
      <div class="dd"><span class="em">法華経</span>だけが真実の教えと説き、<span class="em">題目</span>（南無妙法蓮華経）をとなえれば救われるとした。</div>
    </div>

    <div class="zen-wrap" data-at="3" data-anim="fade">
      <div class="zen-t"><span class="blank" data-fill="3"><span class="bnum">③</span><b>禅宗</b></span><small>座禅によって自分でさとりを開く仏教（宋から伝わる）</small></div>
      <div class="zen-row">
        <div class="zen-box" data-at="4"><div class="kaiso">栄西</div>
          <div class="info"><span class="blank" data-fill="4"><span class="bnum">④</span><b>臨済宗</b></span><small><span class="em">位の高い武士</span>の間に広まった</small></div></div>
        <div class="zen-box" data-at="5"><div class="kaiso">道元</div>
          <div class="info"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>曹洞宗</b></span><small><span class="em">地方の武士</span>の間に広まった</small></div></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
