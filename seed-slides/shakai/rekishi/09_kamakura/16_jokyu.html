<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>承久の乱 ── 1221年・後鳥羽上皇｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jk-safe { inset: 96px 150px 96px; align-content: center; gap: 30px; }
  .jk-head { display: grid; gap: 12px; }
  .jk-lead { display:flex; align-items:baseline; gap:22px; }
  .jk-lead .y { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:110px; line-height:.9; color:var(--sumi); }
  .jk-lead .y .blank { font-size: 96px; min-width: 360px; }
  .jk-lead .nm { font-size: 44px; font-weight: 900; color: var(--sumi-soft); }
  .jk-lead .nm .blank { font-size: 44px; }
  .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .fbox { background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--cat); box-shadow: 0 12px 30px rgba(40,30,10,.10);
          padding: 26px 30px; display: grid; gap: 12px; position: relative; }
  .fbox .ph { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .fbox .bd { font-size: 30px; line-height: 1.45; color: var(--sumi); font-weight: 700; }
  .fbox .bd small { display:block; font-size:24px; color:var(--sumi-mute); font-weight:500; margin-top:6px; }
  .fbox .bd .em { color: var(--imp); font-weight: 900; }
  .fbox .bd .blank { font-size: 32px; }
  .jk-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .jk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .jk-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .jk-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe jk-safe">
    <div class="jk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 執権政治</span>
      <h1 class="headline" style="font-size:52px;">朝廷が幕府にいどんだ ── そして敗れた</h1>
    </div>
    <div class="jk-lead" data-at="1" data-anim="left">
      <span class="y"><span class="blank" data-fill="1"><span class="bnum">①</span><b>1221</b></span>年</span>
      <span class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>後鳥羽上皇</b></span>が挙兵</span>
    </div>
    <div class="flow">
      <div class="fbox" data-at="2" data-anim="pop"><div class="ph">きっかけ</div>
        <div class="bd">上皇が「幕府を倒せ」と兵をあげる<small>幕府の混乱を好機とみた</small></div></div>
      <div class="fbox" data-at="3" data-anim="pop"><div class="ph">結果</div>
        <div class="bd">幕府（北条氏）が<span class="em">勝利</span><small>上皇は隠岐（おき）に流された</small></div></div>
      <div class="fbox" data-at="4" data-anim="pop"><div class="ph">名前</div>
        <div class="bd">この争いを<span class="blank" data-fill="4"><span class="bnum">③</span><b>承久の乱</b></span>という<small>「じょうきゅうのらん」</small></div></div>
    </div>
    <div class="jk-bar" data-at="5" data-anim="fade">
      <span class="bt">意味が大きい</span>
      <span class="bb">この勝利で、幕府の力は<b>朝廷（京都）より上</b>だと全国にはっきり示された。武士の世が本物になった瞬間。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
