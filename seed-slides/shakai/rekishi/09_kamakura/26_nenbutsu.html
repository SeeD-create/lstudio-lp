<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>念仏の教え ── 法然・親鸞・一遍｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .nb-safe { inset: 90px 130px 90px; align-content: center; gap: 28px; }
  .nb-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .nb-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .nb-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 14px 32px rgba(40,30,10,.10); padding: 30px 32px; display: grid; gap: 14px; align-content: start; min-height: 430px; }
  .nb-card::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .nb-card .kaiso { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi-mute); }
  .nb-card .kaiso .blank { font-size: 40px; min-width: 170px; }
  .nb-card .kaiso .lab { display:block; font-size:22px; color:var(--sumi-mute); font-weight:700; margin-bottom:6px; letter-spacing:.1em; }
  .nb-card .shu { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:50px; color:var(--sumi); display:flex; align-items:baseline; gap:8px; }
  .nb-card .shu .blank { font-size: 46px; min-width: 220px; }
  .nb-card .desc { font-size: 27px; line-height: 1.5; color: var(--sumi-soft); font-weight: 600; margin-top: auto; }
  .nb-card .desc .em { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe nb-safe">
    <div class="nb-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅴ 新しい仏教・念仏系</span>
      <h1 class="headline" style="font-size:48px;">「念仏をとなえれば救われる」3つの教え</h1>
    </div>
    <div class="nb-row">
      <div class="nb-card" data-at="1" data-anim="pop">
        <div class="kaiso"><span class="lab">開祖</span><span class="blank" data-fill="1"><span class="bnum">①</span><b>法然</b></span></div>
        <div class="shu"><span class="blank" data-fill="2"><span class="bnum">②</span><b>浄土宗</b></span></div>
        <div class="desc"><span class="em">阿弥陀仏</span>を信じて念仏をとなえれば救われる、と説いた。</div>
      </div>
      <div class="nb-card" data-at="3" data-anim="pop">
        <div class="kaiso"><span class="lab">開祖（左の宗派の弟子）</span><span class="blank" data-fill="3"><span class="bnum">③</span><b>親鸞</b></span></div>
        <div class="shu"><span class="blank" data-fill="4"><span class="bnum">④</span><b>浄土真宗</b></span></div>
        <div class="desc"><span class="em">悪人でさえ</span>念仏をとなえれば救われる、と説いた。</div>
      </div>
      <div class="nb-card" data-at="5" data-anim="pop">
        <div class="kaiso"><span class="lab">開祖</span><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>一遍</b></span></div>
        <div class="shu"><span class="blank" data-fill="6"><span class="bnum">⑥</span><b>時宗</b></span></div>
        <div class="desc">各地を回って<span class="em">踊り念仏</span>を広めた。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
