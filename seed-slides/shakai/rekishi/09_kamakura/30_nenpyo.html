<title>年表で総ざらい ── 1185→1232の一本道｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { inset: 96px 130px 96px; align-content: center; gap: 44px; }
  .np-head { display: grid; gap: 12px; justify-items: center; text-align: center; }
  .tl { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .tl::before { content:""; position: absolute; left: 40px; right: 40px; top: 92px; height: 6px; background: var(--sumi-mute); border-radius: 3px; }
  .tnode { display: grid; justify-items: center; gap: 0; position: relative; }
  .tyr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 56px; color: var(--sumi); line-height: 1; }
  .tdot { width: 28px; height: 28px; border-radius: 50%; background: var(--sumi); margin: 20px 0 24px; border: 5px solid var(--paper); box-shadow: 0 0 0 3px var(--sumi); }
  .tcard { background: var(--paper-hi); border-radius: 18px; border: 3px solid var(--cat); box-shadow: 0 12px 28px rgba(40,30,10,.10);
           padding: 22px 24px; width: 100%; min-height: 200px; display: grid; align-content: start; gap: 10px; }
  .tcard .ev { font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 30px; color: var(--sumi); line-height: 1.3; }
  .tcard .ev .blank { font-size: 30px; min-width: 150px; }
  .tcard .sub { font-size: 24px; line-height: 1.4; color: var(--sumi-soft); font-weight: 600; }
  .np-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .np-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .np-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .np-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">練習問題</span>　鎌倉時代の年表</span>
      <h1 class="headline" style="font-size:52px;">4つの年号で、鎌倉が一本道になる</h1>
    </div>
    <div class="tl">
      <div class="tnode" data-at="1" data-anim="pop"><div class="tyr">1185</div><div class="tdot"></div>
        <div class="tcard"><div class="ev"><span class="blank" data-fill="1"><span class="bnum">①</span><b>壇ノ浦</b></span>の戦い</div><div class="sub">平氏が滅亡。守護・地頭を置く。</div></div></div>
      <div class="tnode" data-at="2" data-anim="pop"><div class="tyr">1192</div><div class="tdot"></div>
        <div class="tcard"><div class="ev">源頼朝が<span class="blank" data-fill="2"><span class="bnum">②</span><b>征夷大将軍</b></span>に</div><div class="sub">鎌倉幕府が名実ともに成立。</div></div></div>
      <div class="tnode" data-at="3" data-anim="pop"><div class="tyr">1221</div><div class="tdot"></div>
        <div class="tcard"><div class="ev"><span class="blank" data-fill="3"><span class="bnum">③</span><b>承久の乱</b></span></div><div class="sub">後鳥羽上皇が挙兵→敗北。六波羅探題を設置。</div></div></div>
      <div class="tnode" data-at="4" data-anim="pop"><div class="tyr">1232</div><div class="tdot"></div>
        <div class="tcard"><div class="ev"><span class="blank" data-fill="4"><span class="bnum">④</span><b>御成敗式目</b></span></div><div class="sub">北条泰時が制定。日本初の武家法。</div></div></div>
    </div>
    <div class="np-bar" data-at="5" data-anim="fade">
      <span class="bt">語呂で固定</span>
      <span class="bb"><b>1185・1192・1221・1232</b>の4つの年号に、できごとをぶら下げる。この順番が問われる。矢印で一本につないで覚える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
