<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>鎌倉時代｜ 第9章 全31スライド</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #2a2018;
      font-family: 'BIZ UDPGothic', 'Hiragino Sans', sans-serif; overflow: hidden; }
    .viewer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    .frame-wrap { flex: 1; position: relative; overflow: hidden; background: white; }
    iframe.slide-frame { width: 100%; height: 100%; border: 0; display: block; }

    /* 上部の一覧バー（スライド名＋ドット）は出さない。
       投影中に画面の上へかぶって授業の邪魔になるため撤去（8/28 平野さん指示）。
       移動は下のボタンと PageUp/Down で足りる。 */

    /* ─── 下部コントロール ─── */
    .controls { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px); padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
    .ctrl-btn { background: white; border: 0; padding: 8px 14px; border-radius: 999px; font-family: inherit;
      font-size: 14px; font-weight: 700; color: #422C18; cursor: pointer; transition: background .2s, transform .15s; }
    .ctrl-btn:hover { background: #fff7e0; }
    .ctrl-btn:active { transform: scale(.96); }
    .ctrl-btn[disabled] { opacity: .4; cursor: not-allowed; }
    .ctrl-info { color: white; font-weight: 700; font-size: 13px; min-width: 70px; text-align: center; letter-spacing: .04em; }
    .help-hint { color: rgba(255,255,255,.7); font-size: 12px; margin-left: 4px; }

  </style>
</head>
<body>
  <div class="viewer">
    <div class="frame-wrap">
      <iframe class="slide-frame" id="frame" src="about:blank"></iframe>
    </div>

    <div class="controls"><a class="ctrl-btn" id="seed-catalog-link" href="../../../index.html" style="text-decoration:none;white-space:nowrap">↩ 教材一覧へ戻る</a>
      <button class="ctrl-btn" id="prev-btn">◀ 前のスライド</button>
      <span class="ctrl-info" id="counter">1 / 31</span>
      <button class="ctrl-btn" id="next-btn">次のスライド ▶</button>
      <span class="help-hint">スライド内: ←→ ／ スライド切替: PageUp/Down</span>
    </div>

  </div>

  <script>
    const SLIDES = [
  {
    "file": "01_cover.html",
    "title": "表紙 ── 武士が開いた、はじめての本格政権",
    "sub": ""
  },
  {
    "file": "02_hook.html",
    "title": "もし戦いに強い武士が、政治のトップになったら？",
    "sub": ""
  },
  {
    "file": "03_kamakura_towa.html",
    "title": "鎌倉時代とは ── 源頼朝が鎌倉に開いた武家政権",
    "sub": ""
  },
  {
    "file": "04_catalog.html",
    "title": "鎌倉時代カタログ ── 集める5枚",
    "sub": ""
  },
  {
    "file": "05_sec_seiritsu.html",
    "title": "CARD Ⅰ 鎌倉幕府の成立",
    "sub": ""
  },
  {
    "file": "06_genpei.html",
    "title": "平氏の滅亡 ── 1185年・壇ノ浦の戦い（源義経）",
    "sub": ""
  },
  {
    "file": "07_shugo_jito.html",
    "title": "守護と地頭 ── 1185年、国ごと・荘園ごとに置く",
    "sub": ""
  },
  {
    "file": "08_shogun.html",
    "title": "征夷大将軍 ── 1192年、源頼朝が幕府を開く",
    "sub": ""
  },
  {
    "file": "09_check1.html",
    "title": "ミニ確認 ── 壇ノ浦・守護と地頭",
    "sub": ""
  },
  {
    "file": "10_sec_shikumi.html",
    "title": "CARD Ⅱ 鎌倉幕府のしくみ",
    "sub": ""
  },
  {
    "file": "11_chusuu.html",
    "title": "幕府のしくみ ── 執権・侍所・政所・問注所・守護・地頭（授業ノート1）",
    "sub": ""
  },
  {
    "file": "12_goon_houkou.html",
    "title": "御恩と奉公 ── 将軍と御家人の主従関係",
    "sub": ""
  },
  {
    "file": "13_check2.html",
    "title": "ミニ確認 ── 御恩と奉公",
    "sub": ""
  },
  {
    "file": "14_sec_shikken.html",
    "title": "CARD Ⅲ 執権政治",
    "sub": ""
  },
  {
    "file": "15_hojo.html",
    "title": "執権政治のはじまり ── 北条政子と北条氏",
    "sub": ""
  },
  {
    "file": "16_jokyu.html",
    "title": "承久の乱 ── 1221年・後鳥羽上皇の挙兵（授業ノート1）",
    "sub": ""
  },
  {
    "file": "17_rokuhara.html",
    "title": "六波羅探題 ── 承久の乱後、京都に置く",
    "sub": ""
  },
  {
    "file": "18_goseibai.html",
    "title": "御成敗式目 ── 1232年・北条泰時（日本初の武家法）",
    "sub": ""
  },
  {
    "file": "19_check3.html",
    "title": "ミニ確認 ── 承久の乱・御成敗式目",
    "sub": ""
  },
  {
    "file": "20_sec_bunka.html",
    "title": "CARD Ⅳ 鎌倉時代の文化",
    "sub": ""
  },
  {
    "file": "21_gunki.html",
    "title": "軍記物 ── 平家物語と琵琶法師（授業ノート2）",
    "sub": ""
  },
  {
    "file": "22_zuihitsu_waka.html",
    "title": "随筆と和歌集 ── 方丈記・徒然草・新古今和歌集",
    "sub": ""
  },
  {
    "file": "23_choukoku.html",
    "title": "彫刻と建築 ── 金剛力士像・運慶と快慶・東大寺南大門",
    "sub": ""
  },
  {
    "file": "24_check4.html",
    "title": "ミニ確認 ── 作者と作品",

  },
  {
    "file": "25_sec_bukkyo.html",
    "title": "CARD Ⅴ 鎌倉の新しい仏教",

  },
  {
    "file": "26_nenbutsu.html",
    "title": "念仏の教え ── 法然・親鸞・一遍（授業ノート3）",
    "sub": ""
  },
  {
    "file": "27_nichiren_zen.html",
    "title": "題目と禅 ── 日蓮・栄西・道元",
    "sub": ""
  },
  {
    "file": "28_bukkyo_table.html",
    "title": "新しい仏教まとめ表 ── 6つの宗派と開祖",
    "sub": ""
  },
  {
    "file": "29_check5.html",
    "title": "ミニ確認 ── 開祖と宗派",
    "sub": ""
  },
  {
    "file": "30_nenpyo.html",
    "title": "年表で総ざらい ── 1185→1232の一本道",
    "sub": ""
  },
  {
    "file": "31_summary.html",
    "title": "壇ノ浦・征夷大将軍・執権政治 ── 鎌倉の背骨",
    "sub": ""
  }
];

    const frame    = document.getElementById('frame');
    const counter  = document.getElementById('counter');
    const prevBtn  = document.getElementById('prev-btn');
    const nextBtn  = document.getElementById('next-btn');
    let cur = 0;

    function show(i) {
      cur = Math.max(0, Math.min(SLIDES.length - 1, i));
      frame.src = SLIDES[cur].file;
      counter.textContent = `${cur + 1} / ${SLIDES.length}`;
      prevBtn.disabled = (cur === 0);
      nextBtn.disabled = (cur === SLIDES.length - 1);
      setTimeout(() => { try { frame.contentWindow.focus(); } catch(e) {} }, 200);
    }

    prevBtn.addEventListener('click', () => show(cur - 1));
    nextBtn.addEventListener('click', () => show(cur + 1));

    // 目次（ホーム画面）は出さない。授業のたびに一覧が挟まって邪魔になるため撤去（8/21 平野さん指示）。
    // 移動はドット・前後ボタン・PageUp/Downで足りる。
    function handleKey(e) {
      if (e.key === 'PageDown') { if (cur < SLIDES.length - 1) show(cur + 1); e.preventDefault(); }
      else if (e.key === 'PageUp') { if (cur > 0) show(cur - 1); e.preventDefault(); }
    }
    window.addEventListener('keydown', handleKey);

    frame.addEventListener('load', () => {
      // フォーカスはスライド側へ（←→でステップが動くように）
      try { frame.contentWindow.focus(); } catch(e) {}
    });

    // スライド側（nav.js）から届く PageUp/PageDown を受けてスライドを送る。
    // file:// では iframe のキーを親から直接拾えないので、この経路が本線。
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.seed !== 'slide-nav') return;
      if (d.dir === 'next' && cur < SLIDES.length - 1) show(cur + 1);
      else if (d.dir === 'prev' && cur > 0) show(cur - 1);
    });

    // 開いたらそのまま1枚目から始める（目次は挟まない）
    show(0);
  </script>
</body>
</html>
