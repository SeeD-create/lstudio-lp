<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>御恩と奉公 ── 主従関係｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gh-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .gh-head { display: grid; gap: 12px; justify-items: center; text-align: center; }
  .rel { display: grid; grid-template-columns: 1fr 660px 1fr; align-items: center; gap: 20px; }
  .party { background: var(--paper-hi); color: var(--sumi); border-radius: 24px; padding:43px 17px; text-align: center;
           box-shadow: 0 16px 36px rgba(40,30,10,.18); border: 3px solid var(--sumi);}
  .party .role { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; }
  .party .role .blank { font-size: 58px; }
  .party .sub { font-size: 26px; color: var(--sumi); margin-top: 8px; }
  .arrows { display: grid; gap: 18px; }
  .arw { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 18px;
         border-radius: 14px; padding: 16px 26px; background: var(--paper-hi); box-shadow: 0 8px 20px rgba(40,30,10,.08);
         border: 3px solid var(--cat); }
  .arw.down { border-color: var(--imp); }
  .arw .dir { font-size: 44px; font-weight: 900; line-height: 1; color: var(--cat); text-align: center; }
  .arw.down .dir { color: var(--imp); }
  .arw .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color: var(--sumi); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .arw .lab .blank { font-size: 34px; min-width: 150px; }
  .arw .lab small { font-family:'Zen Kaku Gothic New',sans-serif; font-size: 24px; color: var(--sumi-mute); font-weight:600; }
  .midbadge { justify-self:center; font-size: 30px; }
  .gh-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .gh-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .gh-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .gh-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe gh-safe">
    <div class="gh-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 幕府のしくみ</span>
      <h1 class="headline" style="font-size:54px;">土地でつながる、将軍と武士</h1>
    </div>
    <div class="rel">
      <div class="party" data-at="1" data-anim="left"><div class="role">将軍</div><div class="sub">頼朝（幕府）</div></div>
      <div class="arrows">
        <div class="arw down" data-at="2" data-anim="fade"><div class="dir">▶</div>
          <div class="lab"><span class="blank" data-fill="2"><span class="bnum">②</span><b>御恩</b></span><small>領地（土地）を与える</small></div></div>
        <span class="cat-badge midbadge" data-at="3" data-anim="pop">結びつき＝<span class="blank" data-fill="3" style="font-size:30px;"><span class="bnum">③</span><b>主従関係</b></span></span>
        <div class="arw up" data-at="4" data-anim="fade"><div class="dir">◀</div>
          <div class="lab"><span class="blank" data-fill="4"><span class="bnum">④</span><b>奉公</b></span><small>将軍のためにつくす（戦う）</small></div></div>
      </div>
      <div class="party" data-at="1" data-anim="right"><div class="role"><span class="blank" data-fill="1"><span class="bnum">①</span><b>御家人</b></span></div><div class="sub">将軍に仕える武士</div></div>
    </div>
    <div class="gh-bar" data-at="5" data-anim="fade">
      <span class="bt">記述で出る</span>
      <span class="bb">将軍が武士に土地を与えるのが②、その代わりに武士が将軍のためにつくすのが④。この2つで成り立つ結びつきが③。<b>与える／つくす</b>の向きで区別する。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
