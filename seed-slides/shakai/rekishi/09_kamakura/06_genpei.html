<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>平氏の滅亡 ── 壇ノ浦の戦い｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gp-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 620px; align-content: center; gap: 66px; align-items: center; }
  .gp-txt { display: grid; gap: 26px; }
  .gp-fig { height: 660px; border-radius: 30px; }
  .flow { display: grid; gap: 14px; }
  .fstep { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 24px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 20px 30px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .yr { font-family:'Zen Old Mincho',serif;font-weight:900;font-size:34px;color:var(--sumi); }
  .fstep .yr small { display:block; font-size:19px; color:var(--sumi-mute); font-weight:500; letter-spacing:0; }
  .fstep .tx { font-size: 30px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .tx .blank { font-size: 32px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe gp-safe">
    <div class="gp-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 幕府の成立</span>
        <h1 class="headline" style="font-size:56px;margin-top:16px;">平氏をたおした、<br>源氏の兄と弟</h1>
      </div>
      <div class="flow">
        <div class="fstep" data-at="1" data-anim="left"><div class="yr">1180年<small>治承4年</small></div>
          <div class="tx">伊豆の<span class="blank" data-fill="1"><span class="bnum">①</span><b>源頼朝</b></span>ら源氏が挙兵<small>「平氏を倒せ」の命令が伝えられた</small></div></div>
        <div class="fstep" data-at="2" data-anim="left"><div class="yr">活躍</div>
          <div class="tx">頼朝の弟<span class="blank" data-fill="2"><span class="bnum">②</span><b>源義経</b></span>が各地で平氏を破る<small>「みなもとのよしつね」・兄にかわって戦った</small></div></div>
        <div class="fstep" data-at="3" data-anim="left"><div class="yr">1185年<small>文治元年</small></div>
          <div class="tx">平氏は<span class="blank" data-fill="3"><span class="bnum">③</span><b>壇ノ浦</b></span>の戦いで滅亡<small>「だんのうら」・山口県沖の海の上での戦い</small></div></div>
      </div>
      <div data-at="4"><span class="tag tag--gold">★ テスト頻出 ── 平氏が滅んだ場所（海戦）を答えさせる</span></div>
    </div>
    <div class="figure gp-fig" data-at="0" data-anim="right"><img src="assets/dannoura.webp" alt="壇ノ浦の戦い"></div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
