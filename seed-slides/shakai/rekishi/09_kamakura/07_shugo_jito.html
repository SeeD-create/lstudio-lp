<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>守護と地頭 ── 1185年｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sj-safe { inset: 96px 150px 96px; align-content: center; gap: 30px; }
  .sj-head { display: grid; gap: 12px; }
  .sj-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .sj-card { position: relative; background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--cat);
             box-shadow: 0 16px 36px rgba(40,30,10,.12); padding: 36px 44px; display: grid; gap: 16px; }
  .sj-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:21px 0 0 21px; }
  .sj-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi); display:flex; align-items:baseline; gap:14px; }
  .sj-card .nm .blank { font-size: 56px; min-width: 240px; }
  .sj-card .where { font-size:29px; color:var(--cat); font-weight:900; }
  .sj-card .role { font-size:31px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .sj-card .role .em { color: var(--imp); font-weight: 900; }
  .sj-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .sj-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .sj-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .sj-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sj-safe">
    <div class="sj-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 幕府の成立</span>
      <h1 class="headline" style="font-size:56px;">1185年、全国に<span class="em">2つの役職</span>を置く</h1>
    </div>
    <div class="sj-row">
      <div class="sj-card" data-at="1" data-anim="left">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>守護</b></span></div>
        <div class="where">国ごとに置く</div>
        <div class="role"><span class="em">軍事・警察</span>の仕事。<br>その国の武士をまとめ、治安を守る。</div>
      </div>
      <div class="sj-card" data-at="3" data-anim="right">
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>地頭</b></span></div>
        <div class="where">荘園・公領ごとに置く</div>
        <div class="role"><span class="em">年貢の取り立て</span>と土地の管理。<br>荘園から税を集める役目。</div>
      </div>
    </div>
    <div class="sj-bar" data-at="5" data-anim="fade">
      <span class="bt">セットで覚える</span>
      <span class="bb"><b>国ごとの役職＝軍事警察／荘園ごとの役職＝年貢の取り立て</b>。頼朝はこれを朝廷に認めさせ、全国支配の足場を作った。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
