<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>執権政治のはじまり ── 北条政子・北条氏｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hj-safe { inset: 96px 150px 96px; align-content: center; gap: 30px; }
  .hj-head { display: grid; gap: 12px; }
  .flow { display: grid; gap: 16px; }
  .fstep { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 24px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 22px 34px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:70px;height:70px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 34px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:26px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .tx .blank { font-size: 36px; }
  .fstep .tx .em { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe hj-safe">
    <div class="hj-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 幕府の実権はだれに</span>
      <h1 class="headline" style="font-size:56px;">将軍にかわって、<span class="em">補佐役</span>が実権をにぎる</h1>
    </div>
    <div class="flow">
      <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
        <div class="tx">源頼朝の死後、源氏の将軍は<span class="em">3代</span>で終わる<small>あとをつぐ源氏の男子がいなくなった</small></div></div>
      <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
        <div class="tx">頼朝の妻<span class="blank" data-fill="2"><span class="bnum">①</span><b>北条政子</b></span>の実家が力をもつ<small>「尼将軍」ともよばれ、御家人をまとめた</small></div></div>
      <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
        <div class="tx">その実家<span class="blank" data-fill="3"><span class="bnum">②</span><b>北条氏</b></span>が代々<span class="blank" data-fill="4"><span class="bnum">③</span><b>執権</b></span>となり、幕府の実権をにぎる<small>この役職による政治が続いた</small></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
