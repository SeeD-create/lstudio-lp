<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>御成敗式目 ── 1232年・北条泰時｜中1歴史 第9章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gs-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 620px; align-content: center; gap: 60px; align-items: center; }
  .gs-txt { display: grid; gap: 26px; }
  .gs-line { font-size: 40px; line-height: 1.55; color: var(--sumi-soft); font-weight: 600; }
  .gs-line .blank { font-size: 42px; }
  .gs-line .em { color: var(--imp); font-weight: 900; }
  .gs-fact { display: grid; gap: 14px; }
  .frow { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 18px;
          background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 14px 14px 0;
          padding: 18px 28px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .frow .k { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .frow .v { font-size: 32px; font-weight: 900; color: var(--sumi); display:flex; align-items:baseline; gap:8px; }
  .frow .v .blank { font-size: 34px; min-width: 200px; }
  .scroll { align-self: center; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
            padding: 44px 48px; box-shadow: 0 18px 40px rgba(40,30,10,.14); }
  .scroll .st { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); letter-spacing:.1em; }
  .scroll .sq { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:32px; line-height:1.8; color:var(--sumi); margin-top:16px; }
  .scroll .sq .em { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe gs-safe">
    <div class="gs-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅲ 執権政治</span>
        <h1 class="headline" style="font-size:52px;margin-top:14px;">武士のための、<br>日本初のルールブック</h1>
      </div>
      <div class="gs-fact">
        <div class="frow" data-at="1" data-anim="left"><div class="k">年　代</div><div class="v"><span class="blank" data-fill="1"><span class="bnum">①</span><b>1232</b></span>年</div></div>
        <div class="frow" data-at="2" data-anim="left"><div class="k">定めた人</div><div class="v">3代執権　<span class="blank" data-fill="2"><span class="bnum">②</span><b>北条泰時</b></span></div></div>
        <div class="frow" data-at="3" data-anim="left"><div class="k">名　前</div><div class="v"><span class="blank" data-fill="3"><span class="bnum">③</span><b>御成敗式目</b></span></div></div>
      </div>
    </div>
    <div class="scroll" data-at="4" data-anim="right">
      <div class="st">この法とは</div>
      <p class="sq">日本で<span class="em">初めての武家法</span>。<br>御家人に対する<span class="em">裁判の基準</span>を示し、武家政治のよりどころとなった。</p>
      <div style="margin-top:22px;"><span class="tag tag--gold">★ 記述 ── 「日本初の武家法」</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第9章 鎌倉時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
