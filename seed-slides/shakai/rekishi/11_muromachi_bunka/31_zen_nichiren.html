<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>題目と禅 ── 日蓮宗・臨済宗・曹洞宗｜社会（歴史）§11</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .zn-safe { inset: 90px 130px 90px; align-content: center; gap: 30px; }
  .zn-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .zn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .card { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px;
          padding: 26px 28px 30px; box-shadow: 0 14px 32px rgba(40,30,10,.12); display: grid; align-content: start; gap: 12px; min-height: 420px; }
  .card::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:20px 20px 0 0; }
  .card .kind { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--cat); text-align:center; }
  .card .shu { text-align:center; } .card .shu .blank { font-size: 36px; min-width: 100%; }
  .card .kaiso { text-align:center; font-size: 24px; color: var(--sumi-soft); }
  .card .kaiso .blank { font-size: 30px; min-width: 78%; margin-top:4px; }
  .card .ds { font-size: 23px; line-height: 1.5; color: var(--sumi-soft); text-align:center; margin-top:auto; } .card .ds b{color:var(--imp);}
  .zn-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .zn-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .zn-bar .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.94); } .zn-bar .bb b{color:#fff;}
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe zn-safe">
    <div class="zn-head" data-at="0">
      <span class="kicker"><span class="num">仏教 ③</span>　鎌倉時代（題目・禅）</span>
      <h1 class="headline" style="font-size:54px;"><span class="em">題目</span>と、座禅の<span class="em">禅宗</span></h1>
    </div>
    <div class="zn-row">
      <div class="card" data-at="1" data-anim="pop">
        <div class="kind">題目</div>
        <div class="shu"><span class="blank" data-fill="1"><span class="bnum">①</span><b>日蓮宗</b></span></div>
        <div class="kaiso">開いた人：<span class="blank" data-fill="1"><b>日蓮</b></span></div>
        <div class="ds"><b>題目</b>（南無妙法蓮華経）を唱えれば救われる。</div>
      </div>
      <div class="card" data-at="2" data-anim="pop">
        <div class="kind">禅宗</div>
        <div class="shu"><span class="blank" data-fill="2"><span class="bnum">②</span><b>臨済宗</b></span></div>
        <div class="kaiso">開いた人：<span class="blank" data-fill="2"><b>栄西</b></span></div>
        <div class="ds"><b>座禅</b>によってさとりを開く禅宗の1つ。</div>
      </div>
      <div class="card" data-at="3" data-anim="pop">
        <div class="kind">禅宗</div>
        <div class="shu"><span class="blank" data-fill="3"><span class="bnum">③</span><b>曹洞宗</b></span></div>
        <div class="kaiso">開いた人：<span class="blank" data-fill="3"><b>道元</b></span></div>
        <div class="ds"><b>座禅</b>によってさとりを開く禅宗の1つ。</div>
      </div>
    </div>
    <div class="zn-bar" data-at="4" data-anim="fade">
      <span class="bt">★ 覚え方</span>
      <span class="bb">1つ目は<b>題目</b>を唱える宗派。禅宗は<b>2つ</b>あり、どちらも<b>座禅</b>。この2つの開祖の組み合わせが入れかわりやすい。</span>
    </div>
  </div>
  <div class="seed-foot"><span>社会（歴史）　｜　第11章 室町時代までの文化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
