<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>天平文化の書物｜社会（歴史）§11</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bk-safe { inset: 92px 130px 92px; align-content: center; gap: 34px; }
  .bk-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .bk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .bc { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px;
        padding: 26px 26px 30px; box-shadow: 0 14px 32px rgba(40,30,10,.12); display: grid; align-content: start; gap: 14px; min-height: 470px; }
  .bc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:20px 20px 0 0; }
  .bc .kind { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); }
  .bc .nm { text-align:center; margin-top:6px; } .bc .nm .blank { font-size: 36px; min-width: 100%; }
  .bc .ds { font-size: 25px; line-height: 1.5; color: var(--sumi-soft); } .bc .ds b{color:var(--imp);}
  .bk-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .bk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .bk-bar .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.94); } .bk-bar .bb b{color:#fff;}
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe bk-safe">
    <div class="bk-head" data-at="0">
      <span class="kicker"><span class="num">古代 ②</span>　天平文化の書物</span>
      <h1 class="headline" style="font-size:54px;">この時代に生まれた<span class="em">4つの本</span></h1>
    </div>
    <div class="bk-row">
      <div class="bc" data-at="1" data-anim="pop">
        <div class="kind">歴史書</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>古事記</b></span></div>
        <div class="ds"><b>神話中心</b>の<b>日本最古</b>の歴史書。</div>
      </div>
      <div class="bc" data-at="2" data-anim="pop">
        <div class="kind">歴史書</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>日本書紀</b></span></div>
        <div class="ds"><b>神話中心</b>の歴史書。国の正式な歴史書。</div>
      </div>
      <div class="bc" data-at="3" data-anim="pop">
        <div class="kind">地理書</div>
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">③</span><b>風土記</b></span></div>
        <div class="ds"><b>地名や産物</b>などを<b>国ごと</b>にまとめた地理書。</div>
      </div>
      <div class="bc" data-at="4" data-anim="pop">
        <div class="kind">和歌集</div>
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">④</span><b>万葉集</b></span></div>
        <div class="ds"><b>万葉がな</b>で書かれた和歌集。天皇から庶民まで。</div>
      </div>
    </div>
    <div class="bk-bar" data-at="4" data-anim="fade">
      <span class="bt">★ 覚え方</span>
      <span class="bb">歴史書は<b>2つ</b>（どちらも神話中心／先に成立したほうが最古）、地理書は<b>1つ</b>、和歌集は<b>1つ</b>（万葉がな）。「歴史2・地理1・和歌1」で仕分ける。</span>
    </div>
  </div>
  <div class="seed-foot"><span>社会（歴史）　｜　第11章 室町時代までの文化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

<script>SeedDeck.init(5);</script>
</body>
</html>
