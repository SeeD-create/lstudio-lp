<title>ミニ確認 ── 宗派と開祖｜社会（歴史）§11</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1420px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 38px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size: 31px; line-height: 1.5; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 空らんに答えよ</div>
      <p class="qtext" data-at="0">法然の弟子で、「<span class="u">悪人でさえも救われる</span>」と説き、<br>浄土真宗を開いたのはだれか。</p>
      <div class="ans" data-at="1">
        <span class="mark" data-at="1" data-anim="pop">A.</span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b><span class="hl">親鸞</span>。師の<span class="hl">法然</span>（浄土宗）とセットで覚える。<br>「念仏」は法然→親鸞→一遍、「禅」は栄西・道元 ── 開祖の組が命。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>社会（歴史）　｜　第11章 室町時代までの文化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
