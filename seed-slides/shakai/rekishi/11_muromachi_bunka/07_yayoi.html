<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .yy-safe { inset: 96px 130px 96px; grid-template-columns: 1fr 480px; align-content: center; align-items: center; gap: 50px; }
  .yy-txt { display: grid; gap: 36px; }
  .yy-fig { height: 600px; border-radius: 28px; }
  .yy-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .yy-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .yc { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
        padding: 30px 32px 34px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; align-content: start; gap: 16px; min-height: 470px; }
  .yc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:21px 21px 0 0; }
  .yc .ic { height: 130px; display:flex; align-items:center; justify-content:center; }
  .yc .ic svg { height: 130px; width:auto; }
  .yc .nm { text-align:center; } .yc .nm .blank { font-size: 40px; min-width: 100%; }
  .yc .ds { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); text-align:center; } .yc .ds b{color:var(--imp);}
  .yy-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 38px; }
  .yy-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .yy-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.94); } .yy-bar .bb b{color:#fff;}
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe yy-safe">
    <div class="yy-txt">
    <div class="yy-head" data-at="0">
      <span class="kicker"><span class="num">原始 ②</span>　弥生文化</span>
      <h1 class="headline" style="font-size:56px;">米づくりが広がった時代の<span class="em">道具</span></h1>
    </div>
    <div class="yy-row">
      <div class="yc" data-at="1" data-anim="pop">
        <div class="ic"><svg viewBox="0 0 100 130" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"><path d="M32,30 L68,30 M36,30 L34,14 M64,30 L66,14"/><path d="M24,34 Q18,100 34,116 L66,116 Q82,100 76,34 Z"/></svg></div>

        <div class="ds"><b>うすくてかざりが少ない</b>。縄文土器よりシンプル。</div>
      </div>
      <div class="yc" data-at="2" data-anim="pop">
        <div class="ic"><svg viewBox="0 0 100 130" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40,14 Q50,4 60,14"/><path d="M34,20 Q50,12 66,20 L74,110 Q50,120 26,110 Z"/><path d="M34,42 h32 M32,66 h36 M30,90 h40"/></svg></div>

        <div class="ds"><b>神の祭り</b>などに使用した青銅製のつりがね形の道具。</div>
      </div>
      <div class="yc" data-at="3" data-anim="pop">
        <div class="ic"><svg viewBox="0 0 130 130" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M65,20 L112,52 L18,52 Z"/><rect x="30" y="52" width="70" height="40"/><path d="M30,72 h70"/><line x1="42" y1="92" x2="42" y2="120"/><line x1="88" y1="92" x2="88" y2="120"/><ellipse cx="42" cy="98" rx="12" ry="4"/><ellipse cx="88" cy="98" rx="12" ry="4"/></svg></div>
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">③</span><b>高床倉庫</b></span></div>
        <div class="ds">収穫した<b>米</b>を貯蔵。床を高くしてしめり・ねずみを防ぐ。</div>
      </div>
    </div>
    <div class="yy-bar" data-at="3" data-anim="fade">
      <span class="bt">★ ここで差がつく</span>
      <span class="bb">前の時代の土器は<b>厚くて縄目模様</b>／この時代の土器は<b>うすくてかざりが少ない</b>。米の貯蔵は<b>床の高い倉</b>。この対比が最頻出。</span>
    </div>
    </div>
    <div class="figure yy-fig" data-at="0" data-anim="right"><img src="assets/tateana_takayuka.webp" alt="たて穴住居（縄文）と高床倉庫（弥生）の比較"></div>
  </div>

</div></div>
