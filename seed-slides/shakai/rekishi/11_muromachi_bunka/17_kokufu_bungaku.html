<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>国風の文学｜社会（歴史）§11</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lt-safe { inset: 90px 120px 90px; align-content: center; gap: 32px; }
  .lt-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .lt-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .lc { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px;
        padding: 26px 24px 28px; box-shadow: 0 14px 32px rgba(40,30,10,.12); display: grid; align-content: start; gap: 14px; min-height: 430px; }
  .lc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:20px 20px 0 0; }
  .lc .kind { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color:var(--cat); text-align:center; }
  .lc .work { text-align:center; } .lc .work .blank { font-size: 34px; min-width: 100%; }
  .lc .auth { text-align:center; font-size: 24px; color: var(--sumi-soft); }
  .lc .auth .blank { font-size: 27px; min-width: 90%; margin-top:6px; }
  .lc .ds { font-size: 22px; line-height: 1.45; color: var(--sumi-soft); text-align:center; margin-top:auto; }
  .lt-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .lt-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .lt-bar .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.94); } .lt-bar .bb b{color:#fff;}
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe lt-safe">
    <div class="lt-head" data-at="0">
      <span class="kicker"><span class="num">古代 ③</span>　国風文化の文学</span>
      <h1 class="headline" style="font-size:54px;">かな文字で花ひらいた<span class="em">4つの名作</span></h1>
    </div>
    <div class="lt-row">
      <div class="lc" data-at="1" data-anim="pop">
        <div class="kind">物語</div>
        <div class="work"><span class="blank" data-fill="1"><span class="bnum">①</span><b>源氏物語</b></span></div>
        <div class="auth">作者：<span class="blank" data-fill="1"><b>紫式部</b></span></div>
        <div class="ds">世界的に有名な長編物語。</div>
      </div>
      <div class="lc" data-at="2" data-anim="pop">
        <div class="kind">随筆</div>
        <div class="work"><span class="blank" data-fill="2"><span class="bnum">②</span><b>枕草子</b></span></div>
        <div class="auth">作者：<span class="blank" data-fill="2"><b>清少納言</b></span></div>
        <div class="ds">「春はあけぼの」で有名な随筆。</div>
      </div>
      <div class="lc" data-at="3" data-anim="pop">
        <div class="kind">和歌集</div>
        <div class="work"><span class="blank" data-fill="3"><span class="bnum">③</span><b>古今和歌集</b></span></div>
        <div class="auth">まとめた人：<span class="blank" data-fill="3"><b>紀貫之</b></span></div>
        <div class="ds">天皇の命令でまとめた和歌集。</div>
      </div>
      <div class="lc" data-at="4" data-anim="pop">
        <div class="kind">日記</div>
        <div class="work"><span class="blank" data-fill="4"><span class="bnum">④</span><b>土佐日記</b></span></div>
        <div class="auth">作者：<span class="blank" data-fill="4"><b>紀貫之</b></span></div>
        <div class="ds">かなで書いた日記文学。</div>
      </div>
    </div>
    <div class="lt-bar" data-at="4" data-anim="fade">
      <span class="bt">★ 超頻出の落とし穴</span>
      <span class="bb">物語と随筆の<b>作者の入れかえ</b>が一番出る。和歌集と日記は<b>同じ人物</b>が手がけている点も要注意。</span>
    </div>
  </div>
  <div class="seed-foot"><span>社会（歴史）　｜　第11章 室町時代までの文化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
