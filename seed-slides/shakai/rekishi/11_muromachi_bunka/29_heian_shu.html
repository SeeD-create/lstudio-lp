<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hs-safe { inset: 92px 150px 92px; align-content: center; gap: 34px; }
  .hs-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .hs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .card { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
          padding: 30px 40px 34px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display:grid; gap:18px; align-content:start; min-height: 400px; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .card .shu { text-align:center; } .card .shu .blank { font-size: 46px; min-width: 100%; }
  .row2 { display:grid; grid-template-columns: 150px 1fr; gap:14px; align-items:center; font-size: 27px; color: var(--sumi-soft); }
  .row2 .lbl { font-weight:900; color: var(--cat); }
  .row2 .blank { font-size: 30px; min-width: 100%; }
  .hs-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 38px; }
  .hs-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .hs-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.94); } .hs-bar .bb b{color:#fff;}
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe hs-safe">
    <div class="hs-head" data-at="0">
      <span class="kicker"><span class="num">仏教 ①</span>　平安時代</span>
      <h1 class="headline" style="font-size:56px;">山にこもって修行する<span class="em">2つの宗派</span></h1>
    </div>
    <div class="hs-row">
      <div class="card" data-at="1" data-anim="left">
        <div class="shu"><span class="blank" data-fill="1"><span class="bnum">①</span><b>天台宗</b></span></div>
        <div class="row2"><span class="lbl">開いた人</span><span class="blank" data-fill="1"><b>最澄</b></span></div>
        <div class="row2"><span class="lbl">寺・山</span><span class="blank" data-fill="1"><b>比叡山の延暦寺</b></span></div>
      </div>
      <div class="card" data-at="2" data-anim="right">

        <div class="row2"><span class="lbl">開いた人</span><span class="blank" data-fill="2"><b>空海</b></span></div>
        <div class="row2"><span class="lbl">寺・山</span><span class="blank" data-fill="2"><b>高野山の金剛峯寺</b></span></div>
      </div>
    </div>
    <div class="hs-bar" data-at="3" data-anim="fade">
      <span class="bt">★ 覚え方</span>
      <span class="bb">1つ目は<b>比叡山・延暦寺</b>、2つ目は<b>高野山・金剛峯寺</b>。「さい」と「ひえい」、「くう」と「こうや」で頭文字をそろえると入れかわらない。</span>
    </div>
  </div>
  <div class="seed-foot"><span>社会（歴史）　｜　第11章 室町時代までの文化</span><span class="brand">SEED EDUCATION</span></div>
