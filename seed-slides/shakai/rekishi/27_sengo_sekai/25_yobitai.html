<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>警察予備隊 ── 1950年、のちの自衛隊が生まれる｜中2歴史 第28章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .yb-safe { inset: 90px 150px 90px; align-content: center; gap: 30px; }
  .yb-head { display:grid; gap:12px; justify-items:center; text-align:center; }
  .evo { display:grid; grid-template-columns: 1fr 130px 1fr; align-items:center; gap:0; }
  .ecard { background: var(--paper-hi); border:4px solid var(--cat); border-radius:22px; padding:34px 40px; display:grid; gap:14px; align-content:start; box-shadow:0 16px 34px rgba(40,30,10,.12); text-align:center; }
  .ecard .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .ecard .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); }
  .ecard .nm .blank { font-size:44px; min-width:230px; }
  .ecard .nm .blank b { color:var(--imp); }
  .ecard .ds { font-size:23px; font-weight:700; color:var(--sumi-soft); line-height:1.4; }
  .arw { display:flex; align-items:center; justify-content:center; font-size:56px; color:var(--sumi-mute); font-weight:900; }
  .yb-note { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:19px 33px; font-size:25px; line-height:1.5; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .yb-note b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe yb-safe">
    <div class="yb-head" data-at="0">
      <span class="kicker"><span class="num">世界の動き③</span>　日本の再武装</span>
      <h1 class="headline" style="font-size:50px;">半島での戦争がきっかけで、<span class="em">新しい組織</span>ができた</h1>
    </div>
    <div class="evo">
      <div class="ecard" data-at="1" data-anim="left">
        <div class="yr">1950</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">⑦</span><b>警察予備隊</b></span></div>
        <div class="ds">朝鮮戦争でアメリカ軍が朝鮮へ。日本国内の治安を守るためGHQの指示でつくられた。</div>
      </div>
      <div class="arw" data-at="2">→</div>
      <div class="ecard" data-at="3" data-anim="right" style="border-color:var(--imp);">
        <div class="yr" style="color:var(--imp);">のちに</div>
        <div class="nm"><span class="blank" data-fill="3"><b>自衛隊</b></span></div>
        <div class="ds">この組織は強化され、やがて今の組織になった。</div>
      </div>
    </div>
    <div class="yb-note" data-at="4" data-anim="fade"><span>★頻出</span><span><span class="blank blank--para" data-fill="4"><b>「<span class="hl">警察予備隊（1950）</span> → のちの <span class="hl">自衛隊</span>」の流れをセットで。きっかけが<span class="hl">朝鮮戦争</span>だった点も問われる。</b></span></span></div>
  </div>
  <div class="seed-foot"><span>第28章 第二次世界大戦後の世界</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
