<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe dk-safe">
    <div class="dk-head" data-at="0">
      <span class="kicker"><span class="num">世界の動き①</span>　植民地の独立</span>
      <h1 class="headline" style="font-size:52px;">戦争が終わると、<span class="em">アジアの独立運動</span>が一気に高まった</h1>
    </div>
    <div class="dk-row">
      <div class="pcard" data-at="1" data-anim="pop">
        <div class="pn">なぜ？</div>
        <div class="pt">支配国が弱った</div>
        <div class="pd">大戦でヨーロッパ諸国や日本が力を失い、植民地を<span class="blank" data-fill="1"><b>おさえきれなくなった</b></span>。</div>
      </div>
      <div class="pcard" data-at="2" data-anim="pop">
        <div class="pn">いつ？</div>
        <div class="pt">1945〜1949</div>
        <div class="pd">わずか数年の間に、<span class="blank" data-fill="2"><b>インドネシア・インド・中国</b></span>など多くの国が独立・統一した。</div>
      </div>
      <div class="pcard" data-at="3" data-anim="pop">
        <div class="pn">だれが？</div>
        <div class="pt">独立の指導者</div>
        <div class="pd">インドでは<span class="blank" data-fill="3"><b>ネルー</b></span>らが独立運動を進めた。人々が「自分たちの国を」と立ち上がった。</div>
      </div>
    </div>
