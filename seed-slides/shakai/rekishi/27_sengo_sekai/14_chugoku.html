<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 80px 140px 80px; align-content: center; gap: 26px; }

  .cn-row { display:grid; grid-template-columns: 1fr 110px 1fr; align-items:stretch; gap:0; }

  .camp.win .grp { color:#9c2f2b; }

  .camp .ldr .blank b { color:var(--imp); }

  .result .rb .blank { font-size:32px; min-width:220px; background:rgba(255,255,255,.22); }
  .result .rb .blank b { color:#fff; }
  .cn-note { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:17px 33px; font-size:25px; line-height:1.5; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}

</style>

<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe cn-safe">

      <span class="kicker"><span class="num">世界の動き①</span>　中国の統一</span>
      <h1 class="headline" style="font-size:48px;">内戦に勝った<span class="em">中国共産党</span>が、中国を統一した</h1>
