<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>国際連合の成立 ── 1945年、51か国が集まる｜中2歴史 第28章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kr-safe { inset: 84px 140px 84px; grid-template-columns: 1fr 560px; align-content: center; gap: 56px; align-items: center; }
  .kr-txt { display: grid; gap: 20px; }
  .kr-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:130px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:18px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--cat); text-align:center; line-height:1.15; }
  .step .tx { font-size:28px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:30px; min-width:180px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .embox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 24px; box-shadow: 0 16px 38px rgba(40,30,10,.12); padding: 22px; display:grid; gap:14px; justify-items:center; }
  .embox svg { display:block; width:100%; height:auto; }
  .emcap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); }
  .emcap b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kr-safe">
    <div class="kr-txt">
      <div class="kr-head" data-at="0">
        <span class="kicker"><span class="num">世界の動き①</span>　平和を守る組織が生まれる</span>
        <h1 class="headline" style="font-size:46px;">大戦の反省から、<span class="em">新しい国際組織</span>ができる</h1>
      </div>
      <div class="step" data-at="1" data-anim="left">
        <span class="yr">1945</span>
        <span class="tx">大戦に勝った<span class="blank" data-fill="1"><span class="bnum">①</span><b>51か国</b></span>の代表が集まる。</span>
      </div>
      <div class="step" data-at="2" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">成立</span>
        <span class="tx"><span class="blank" data-fill="2"><span class="bnum">②</span><b>国際連合</b></span>が成立する（世界の平和を守る組織）。</span>
      </div>
      <div class="step" data-at="3" data-anim="left">
        <span class="yr">本部</span>
        <span class="tx">本部はアメリカの<span class="blank" data-fill="3"><span class="bnum">③</span><b>ニューヨーク</b></span>に置かれる。</span>
      </div>
      <div class="step" data-at="4" data-anim="left">
        <span class="yr">ねらい</span>
        <span class="tx">国際紛争を話し合いで解決し、<b>二度と大戦を起こさない</b>ことをめざす。</span>
      </div>
    </div>
    <div class="embox" data-at="2" data-anim="right">
      <svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="180" cy="140" r="92" fill="none" stroke="#4a4a48" stroke-width="3"/>
        <circle cx="180" cy="140" r="60" fill="none" stroke="#8a8a88" stroke-width="2"/>
        <circle cx="180" cy="140" r="28" fill="none" stroke="#8a8a88" stroke-width="2"/>
        <line x1="88" y1="140" x2="272" y2="140" stroke="#8a8a88" stroke-width="2"/>
        <line x1="180" y1="48" x2="180" y2="232" stroke="#8a8a88" stroke-width="2"/>
        <path d="M112 90 Q180 118 248 90" fill="none" stroke="#8a8a88" stroke-width="2"/>
        <path d="M112 190 Q180 162 248 190" fill="none" stroke="#8a8a88" stroke-width="2"/>
        <!-- olive branches -->
        <path d="M180 245 Q110 240 96 175" fill="none" stroke="#5c7a4c" stroke-width="4"/>
        <path d="M180 245 Q250 240 264 175" fill="none" stroke="#5c7a4c" stroke-width="4"/>
        <g fill="#6f8f5c"><ellipse cx="110" cy="205" rx="9" ry="4" transform="rotate(-40 110 205)"/><ellipse cx="100" cy="188" rx="9" ry="4" transform="rotate(-55 100 188)"/><ellipse cx="250" cy="205" rx="9" ry="4" transform="rotate(40 250 205)"/><ellipse cx="260" cy="188" rx="9" ry="4" transform="rotate(55 260 188)"/></g>
        <text x="180" y="152" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900" font-size="30" fill="#C4161C">UN</text>
      </svg>
      <div class="emcap">United Nations ＝ その日本語名</div>
    </div>
  </div>
  <div class="seed-foot"><span>第28章 第二次世界大戦後の世界</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
