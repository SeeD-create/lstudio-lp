      <p class="gm-lead" data-at="1">アメリカとソ連に占領された<span class="blank" data-fill="1"><span class="bnum">⑤</span><b>ドイツ</b></span>は、そのまま東西に分断された。</p>
      <div class="sidecard west" data-at="2" data-anim="right"><div class="lab">西側の国</div><div class="ds">アメリカ側（西側）が管理。資本主義の国に。</div></div>
      <div class="sidecard east" data-at="3" data-anim="right"><div class="lab">東側の国</div><div class="ds">ソ連側（東側）が管理。社会主義の国に。首都ベルリンも東西に分けられた。</div></div>
      <div class="gm-note" data-at="4" data-anim="fade"><span>ポイント</span><span><span class="blank blank--para" data-fill="4"><b>冷戦の対立が、<span class="hl">一つの国を真っ二つ</span>にした。この分断は、東西対立の象徴として問われやすい。</b></span></span></div>
    </div>
