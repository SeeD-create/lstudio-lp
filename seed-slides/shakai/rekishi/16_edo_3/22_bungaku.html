<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>文学 ── 俳諧と小説｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 80px 150px 78px; align-content: center; gap: 24px; }
  .lc-head { display: grid; gap: 10px; }
  .strip { background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0; padding: 22px 34px; box-shadow: 0 10px 24px rgba(40,30,10,.08); display:flex; align-items:center; gap:22px; }
  .strip .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); white-space:nowrap; }
  .strip .bd { font-size: 30px; color: var(--sumi); font-weight: 600; line-height:1.4; }
  .strip .bd .blank { font-size: 32px; min-width: 200px; }
  .strip .bd b { color: var(--imp); font-weight:900; }
  .prow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .ncard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 18px; padding: 24px 32px; box-shadow: 0 12px 26px rgba(40,30,10,.09); display:grid; gap:10px; }
  .ncard .au { font-size: 34px; font-weight: 700; color: var(--sumi); }
  .ncard .au .blank { font-size: 36px; min-width: 240px; }
  .ncard .wk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 32px; color: var(--imp); }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:27px; line-height:1.4; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe lc-safe">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 化政文化</span>
      <h1 class="headline" style="font-size:50px;margin-top:10px;">俳諧と、人気の小説</h1>
    </div>
    <div class="strip" data-at="1" data-anim="left">
      <span class="lb">俳諧</span>
      <span class="bd"><span class="blank" data-fill="2"><span class="bnum">④</span><b>小林一茶</b></span> や 与謝蕪村 が、俳諧を民衆に広めた。</span>
    </div>
    <div class="prow2">
      <div class="ncard" data-at="3" data-anim="left">
        <div class="au"><span class="blank" data-fill="4"><span class="bnum">⑤</span><b>十返舎一九</b></span></div>
        <div class="wk">『東海道中膝栗毛』</div>
      </div>
      <div class="ncard" data-at="3" data-anim="right">
        <div class="au"><span class="blank" data-fill="5"><span class="bnum">⑥</span><b>滝沢馬琴</b></span>（曲亭馬琴）</div>
        <div class="wk">『南総里見八犬伝』</div>
      </div>
    </div>
    <div class="hit" data-at="6" data-anim="fade">
      <span class="bt">★ 作品と作者をセットで</span>
      <span class="bb">『東海道中膝栗毛』と『南総里見八犬伝』、それぞれの作者を答える。<b>作品名から作者</b>を答えさせる問題が定番。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(7);</script>
</body>
</html>
