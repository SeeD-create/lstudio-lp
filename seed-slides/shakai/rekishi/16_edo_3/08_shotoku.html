<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>正徳の治 ── 新井白石｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 90px 150px 88px; align-content: center; gap: 30px; }
  .lc-head { display: grid; gap: 12px; }
  .defbox { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 30px 40px;
            box-shadow: 0 16px 34px rgba(40,30,10,.10); position: relative; }
  .defbox::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:19px 0 0 19px; }
  .defbox .dl { font-size: 40px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .defbox .dl .blank { font-size: 42px; min-width: 320px; }
  .pts { display: grid; gap: 14px; margin: 0; padding: 0; }
  .pts li { list-style: none; display: grid; grid-template-columns: 40px 1fr; gap: 18px; align-items: baseline;
            background: var(--paper-hi); border-left: 8px solid var(--cat); border-radius: 0 14px 14px 0;
            padding: 18px 28px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .pts li .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .pts li .tx { font-size: 30px; line-height: 1.45; color: var(--sumi); font-weight: 600; }
  .pts li .tx b { color: var(--imp); font-weight: 900; }
  .pts li .tx .blank { font-size: 32px; min-width: 200px; }
  .hit { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe lc-safe">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 幕府の改革</span>
      <h1 class="headline" style="font-size:54px;margin-top:14px;">乱れたお金を、元に戻す</h1>
    </div>
    <div class="defbox" data-at="1" data-anim="fade">
      <div class="dl">6・7代将軍につかえた儒学者
        <span class="blank" data-fill="2"><span class="bnum">③</span><b>新井白石</b></span> が行った政治を
        <span class="blank" data-fill="3"><span class="bnum">②</span><b>正徳の治</b></span> という。</div>
    </div>
    <ul class="pts">
      <li data-at="4" data-anim="left"><span class="mk">1</span><span class="tx">綱吉が下げた<b>金貨・銀貨の質を元に戻し</b>、物価を落ち着かせようとした。</span></li>
      <li data-at="5" data-anim="left"><span class="mk">2</span><span class="tx"><span class="blank" data-fill="5"><span class="bnum">④</span><b>長崎</b></span> での貿易を制限し、<b>金や銀の流出を防いだ</b>。</span></li>
    </ul>
    <div class="hit" data-at="5" data-anim="fade">
      <span class="bt">★ ここがポイント</span>
      <span class="bb">綱吉＝質を<b>下げる</b>／白石＝質を<b>元に戻す</b>。反対の動きをセットで覚える。貿易を制限した港の名前も答えられるように。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
