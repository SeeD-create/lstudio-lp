<div class="seed-stage"><div class="seed-slide" data-cat="eq">

      <h1 class="headline" style="font-size:64px;">くり返す<span class="em">改革</span>と、円熟する<span class="em">町人文化</span></h1>
    </div>

      <div class="tw-card" data-at="1" data-anim="left">
        <div class="lb">政治 ── ゆらぐ財政と改革</div>
        <div class="bd">5代将軍<b>綱吉</b>のころから財政が悪化。以後、<b>享保・寛政・天保</b>の三大改革や田沼の政治で、幕府は立て直しをくり返す。</div>
      </div>

        <div class="lb">文化・学問 ── 江戸で花ひらく</div>
        <div class="bd">19世紀前半、江戸の町人が主役の<b>化政文化</b>が栄え、<b>国学・蘭学</b>などの新しい学問も発達した。</div>
      </div>
    </div>
    <div class="tw-bar" data-at="3" data-anim="fade">
      <span class="bt">この単元の背骨</span>
