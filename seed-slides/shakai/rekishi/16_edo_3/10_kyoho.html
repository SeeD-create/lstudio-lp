<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>享保の改革 ── 徳川吉宗｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 74px 150px 72px; align-content: start; gap: 20px 46px; grid-template-columns: 1fr 400px; }
  .lc-txt { display: grid; gap: 20px; }
  .lc-fig { height: 500px; border-radius: 26px; align-self: center; }
  .lc-head { display: grid; gap: 10px; }
  .defbox { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 22px 34px;
            box-shadow: 0 14px 30px rgba(40,30,10,.10); position: relative; }
  .defbox::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:17px 0 0 17px; }
  .defbox .dl { font-size: 38px; line-height: 1.5; color: var(--sumi); font-weight: 700; }
  .defbox .dl .yeartag { display:inline-flex; align-items:center; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; padding:5px 18px; border-radius:10px; margin-right:10px; }
  .defbox .dl .blank { font-size: 40px; min-width: 300px; }
  .pts { display: grid; gap: 11px; margin: 0; padding: 0; }
  .pts li { list-style: none; display: grid; grid-template-columns: 36px 1fr; gap: 16px; align-items: baseline;
            background: var(--paper-hi); border-left: 8px solid var(--cat); border-radius: 0 12px 12px 0;
            padding: 14px 26px; box-shadow: 0 6px 16px rgba(40,30,10,.06); }
  .pts li .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--cat); }
  .pts li .tx { font-size: 28px; line-height: 1.4; color: var(--sumi); font-weight: 600; }
  .pts li .tx b { color: var(--imp); font-weight: 900; }
  .pts li .tx .blank { font-size: 30px; min-width: 200px; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 32px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe lc-safe">
    <div class="lc-txt">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 幕府の改革</span>
      <h1 class="headline" style="font-size:50px;margin-top:10px;">三大改革① 1716年からの改革</h1>
    </div>
    <div class="defbox" data-at="1" data-anim="fade">
      <div class="dl"><span class="yeartag">1716</span>8代将軍
        <span class="blank" data-fill="2"><span class="bnum">⑥</span><b>徳川吉宗</b></span> が行った改革を
        <span class="blank" data-fill="3"><span class="bnum">⑤</span><b>享保の改革</b></span> という。</div>
    </div>
    <ul class="pts">
      <li data-at="4" data-anim="left"><span class="mk">1</span><span class="tx"><b>新田開発</b>をすすめ、豊作・不作に関係なく<b>一定の年貢</b>を取った。</span></li>
      <li data-at="4" data-anim="left"><span class="mk">2</span><span class="tx"><span class="blank" data-fill="5"><span class="bnum">⑦</span><b>目安箱</b></span> を設置し、<b>民衆の意見</b>を政治に取り入れた。</span></li>
      <li data-at="4" data-anim="left"><span class="mk">3</span><span class="tx"><span class="blank" data-fill="6"><span class="bnum">⑧</span><b>公事方御定書</b></span> を定め、<b>裁判の基準</b>とした。</span></li>
      <li data-at="4" data-anim="left"><span class="mk">4</span><span class="tx"><b>上げ米の制</b>…大名の江戸在住の期間を減らす代わりに米を納めさせた。</span></li>
    </ul>
    <div class="hit" data-at="6" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">吉宗が置いた<b>意見箱</b>と、定めた<b>裁判の基準の法令集</b>。この2つの名前は記号選びで狙われる。</span>
    </div>
    </div>
    <div class="figure lc-fig" data-at="0" data-anim="right"><img src="assets/meyasubako.webp" alt="目安箱 民衆の意見を投書する箱"></div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
