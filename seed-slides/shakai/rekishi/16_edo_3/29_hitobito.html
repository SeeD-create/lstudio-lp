<style>
  .lc-safe { inset: 78px 130px 76px; align-content: center; gap: 24px 44px; grid-template-columns: 1fr 360px; align-items: center; }

  .acard .dt { font-size: 27px; color: var(--sumi-soft); font-weight: 600; line-height:1.4; margin-top:auto; }
  .acard .dt b { color: var(--imp); font-weight:900; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
