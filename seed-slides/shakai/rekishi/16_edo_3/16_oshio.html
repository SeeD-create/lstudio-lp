<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>天保の大ききんと大塩の乱｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 84px 150px 82px; align-content: center; gap: 26px; }
  .lc-head { display: grid; gap: 10px; }
  .ev2 { display: grid; gap: 20px; }
  .evb { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 26px 36px;
         box-shadow: 0 14px 30px rgba(40,30,10,.10); position: relative; display:grid; gap:10px; }
  .evb::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:17px 0 0 17px; }
  .evb .eh { display:flex; align-items:center; gap:16px; }
  .evb .yeartag { display:inline-flex; align-items:center; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; padding:6px 20px; border-radius:10px; }
  .evb .et { font-size: 40px; font-weight: 700; color: var(--sumi); }
  .evb .et .blank { font-size: 42px; min-width: 240px; }
  .evb .en { font-size: 28px; color: var(--sumi-soft); line-height: 1.4; font-weight: 500; }
  .evb .en b { color: var(--imp); font-weight: 900; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:27px; line-height:1.4; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe lc-safe">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 幕府の改革</span>
      <h1 class="headline" style="font-size:50px;margin-top:10px;">ききんが人々を追いつめる</h1>
    </div>
    <div class="ev2">
      <div class="evb" data-at="1" data-anim="left">
        <div class="eh"><span class="yeartag">1833</span>
          <span class="et"><span class="blank" data-fill="2"><span class="bnum">⑯</span><b>天保</b></span> の大ききん</span></div>
        <div class="en">多くの人が飢え死にし、<b>百姓一揆</b>や<b>打ちこわし</b>が多発した。</div>
      </div>
      <div class="evb" data-at="3" data-anim="left">
        <div class="eh"><span class="yeartag">1837</span>
          <span class="et"><span class="blank" data-fill="4"><span class="bnum">⑰</span><b>大塩</b></span> の乱</span></div>
        <div class="en">もと大阪町奉行所の役人が、貧しい人を救おうと大阪で乱を起こした。</div>
      </div>
    </div>
    <div class="hit" data-at="5" data-anim="fade">
      <span class="bt">★ ここがポイント</span>
      <span class="bb">この乱は<b>もと大阪町奉行所の役人</b>（幕府側の人物）が起こした反乱、という点が問われる。ききん → 乱 → 次の改革、と流れでつながる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
