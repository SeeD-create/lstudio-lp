<title>5代将軍 徳川綱吉 ── 財政難と貨幣の質｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 90px 150px 88px; align-content: center; gap: 34px; grid-template-columns: 1fr 460px; align-items: center; }
  .lc-txt { display: grid; gap: 34px; }
  .lc-fig { height: 560px; border-radius: 28px; }
  .lc-head { display: grid; gap: 12px; }
  .lc-q { font-size: 46px; font-weight: 700; color: var(--sumi); line-height: 1.5; }
  .lc-q .blank { font-size: 50px; min-width: 360px; }
  .pts { display: grid; gap: 14px; margin: 0; padding: 0; }
  .pts li { list-style: none; display: grid; grid-template-columns: 40px 1fr; gap: 18px; align-items: baseline;
            background: var(--paper-hi); border-left: 8px solid var(--cat); border-radius: 0 14px 14px 0;
            padding: 18px 28px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .pts li .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .pts li .tx { font-size: 30px; line-height: 1.45; color: var(--sumi); font-weight: 600; }
  .pts li .tx b { color: var(--imp); font-weight: 900; }
  .hit { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
  .yeartag { display:inline-flex; align-items:center; gap:12px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; padding:8px 22px; border-radius:12px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe lc-safe">
    <div class="lc-txt">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 幕府の改革</span>
      <h1 class="headline" style="font-size:56px;margin-top:14px;">1680年、財政難のはじまり</h1>
    </div>
    <p class="lc-q" data-at="1" data-anim="fade"><span class="yeartag">1680</span>　5代将軍となったのは
      <span class="blank" data-fill="2"><span class="bnum">①</span><b>徳川綱吉</b></span> 。</p>
    <ul class="pts">
      <li data-at="3" data-anim="left"><span class="mk">1</span><span class="tx">財政難のため<b>金貨・銀貨の質を下げた</b>が、そのぶんお金があふれ<b>物価が上がって</b>しまった。</span></li>
      <li data-at="4" data-anim="left"><span class="mk">2</span><span class="tx">極端な動物愛護令（<b>生類憐みの令</b>）を出し、人々の反感をかった。</span></li>
    </ul>
    <div class="hit" data-at="4" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">「貨幣の質を下げる → 物価が上がる」は綱吉。あとで<b>新井白石</b>が“元に戻す”とセットで問われる。</span>
    </div>
    </div>
    <div class="figure lc-fig" data-at="0" data-anim="right"><img src="assets/bad_coin.webp" alt="質を落とした小判と物価の上昇"></div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
