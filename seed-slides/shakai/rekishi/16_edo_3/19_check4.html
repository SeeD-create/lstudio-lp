<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 三大改革と大塩の乱｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 57px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--gold-soft); letter-spacing:.1em; }
  .qcard .qtext { font-size: 42px; line-height: 1.5; font-weight: 700; margin-top: 14px; }
  .qrow { display:flex; gap:34px; margin-top:30px; }
  .qi { flex:1; background: linear-gradient(180deg, rgba(200,162,75,.10), rgba(200,162,75,.02)); border-radius:16px; padding:24px 28px; }
  .qi .ql { font-size:26px; color: var(--sumi); font-weight:700; line-height:1.4; }
  .qi .qa { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:42px; color:var(--imp); margin-top:12px; }
  .qi .qa .blank { min-width:0; width:100%; font-size:36px; padding:0 10px 4px; margin:0; white-space:normal; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 改革と人物</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <p class="qtext">次の改革を行った中心人物は、それぞれ誰か。</p>
      <div class="qrow">
        <div class="qi" data-at="1" data-anim="pop"><div class="ql">享保の改革</div><div class="qa"><span class="blank" data-fill="1"><b>徳川吉宗</b></span></div></div>
        <div class="qi" data-at="2" data-anim="pop"><div class="ql">寛政の改革</div><div class="qa"><span class="blank" data-fill="2"><b>松平定信</b></span></div></div>
        <div class="qi" data-at="3" data-anim="pop"><div class="ql">天保の改革</div><div class="qa"><span class="blank" data-fill="3"><b>水野忠邦</b></span></div></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
