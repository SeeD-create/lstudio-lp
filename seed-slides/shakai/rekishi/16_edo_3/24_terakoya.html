<!DOCTYPE html>
<html lang="ja">
<head>

<title>寺子屋 ── 民衆の教育｜中2歴史 第16章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 96px 150px 92px; align-content: center; gap: 40px; justify-items:center; text-align:center; }
  .lc-head { display: grid; gap: 12px; justify-items:center; }
  .bigdef { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 46px 60px;
            box-shadow: 0 18px 40px rgba(40,30,10,.12); max-width: 1300px; }
  .bigdef .dl { font-size: 46px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .bigdef .dl .blank { font-size: 52px; min-width: 300px; }
  .bigdef .dl b { color: var(--imp); font-weight: 900; }
  .hit { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 40px; max-width:1300px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); text-align:left; }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe lc-safe">
    <div class="lc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 化政文化</span>
      <h1 class="headline" style="font-size:56px;margin-top:14px;">学びが、民衆にも広がった</h1>
    </div>
    <div class="bigdef" data-at="1" data-anim="pop">
      <div class="dl">民衆に<b>読み・書き・そろばん</b>を教える
        <span class="blank" data-fill="2"><span class="bnum">⑩</span><b>寺子屋</b></span> が増えた。</div>
    </div>
    <div class="hit" data-at="3" data-anim="fade">
      <span class="bt">★ ここがポイント</span>
      <span class="bb">この施設の広まりで庶民の教育が進み、文化の担い手も増えた。<b>「読み・書き・そろばん」</b>がキーワード。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第16章 江戸時代（３）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
