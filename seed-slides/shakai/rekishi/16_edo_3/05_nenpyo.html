<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">05</span>　江戸時代（３）年表</span>
      <h1 class="headline" style="font-size:46px;">8つの年号で、改革を通して見る</h1>
    </div>
    <div class="np-list">
      <div class="np-row" data-at="1" data-anim="left"><span class="yr">1680</span><span class="ev"><span class="blank" data-fill="1"><b>徳川綱吉</b></span>が5代将軍に<small>財政難のはじまり</small></span></div>
      <div class="np-row" data-at="2" data-anim="left"><span class="yr">1716</span><span class="ev"><span class="blank" data-fill="2"><b>徳川吉宗</b></span>が8代将軍に<small>享保の改革</small></span></div>
      <div class="np-row" data-at="3" data-anim="left"><span class="yr">1772</span><span class="ev"><span class="blank" data-fill="3"><b>田沼意次</b></span>が老中に<small>株仲間・わいろ</small></span></div>
      <div class="np-row" data-at="4" data-anim="left"><span class="yr">1787</span><span class="ev"><span class="blank" data-fill="4"><b>松平定信</b></span>が老中に<small>寛政の改革</small></span></div>
      <div class="np-row" data-at="5" data-anim="left"><span class="yr">1825</span><span class="ev"><span class="blank" data-fill="5"><b>異国船打払令</b></span>を出す<small>外国船の接近</small></span></div>
      <div class="np-row" data-at="6" data-anim="left"><span class="yr">1833</span><span class="ev"><span class="blank" data-fill="6"><b>天保の大ききん</b></span><small>百姓一揆・打ちこわし</small></span></div>
      <div class="np-row" data-at="7" data-anim="left"><span class="yr">1837</span><span class="ev"><span class="blank" data-fill="7"><b>大塩の乱</b></span><small>もと大阪町奉行所の役人</small></span></div>
      <div class="np-row" data-at="8" data-anim="left"><span class="yr">1841</span><span class="ev"><span class="blank" data-fill="8"><b>水野忠邦</b></span>が老中に<small>天保の改革</small></span></div>
    </div>
  </div>
