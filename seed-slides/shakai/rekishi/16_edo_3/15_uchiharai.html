<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lc-safe { inset: 82px 150px 80px; align-content: center; gap: 26px 46px; grid-template-columns: 1fr 430px; align-items: center; }
  .lc-txt { display: grid; gap: 26px; }
  .lc-fig { height: 540px; border-radius: 28px; }
  .lc-head { display: grid; gap: 10px; }
  .defbox { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 24px 36px;

  .defbox::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:17px 0 0 17px; }
  .defbox .dl { font-size: 38px; line-height: 1.5; color: var(--sumi); font-weight: 700; }
  .defbox .dl .yeartag { display:inline-flex; align-items:center; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; padding:5px 18px; border-radius:10px; margin-right:10px; }
  .defbox .dl .blank { font-size: 40px; min-width: 460px; }
  .pts { display: grid; gap: 13px; margin: 0; padding: 0; }
  .pts li { list-style: none; display: grid; grid-template-columns: 38px 1fr; gap: 16px; align-items: baseline;
            background: var(--paper-hi); border-left: 8px solid var(--cat); border-radius: 0 12px 12px 0;
            padding: 16px 26px; box-shadow: 0 6px 16px rgba(40,30,10,.06); }
  .pts li .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .pts li .tx { font-size: 29px; line-height: 1.42; color: var(--sumi); font-weight: 600; }
  .pts li .tx b { color: var(--imp); font-weight: 900; }
  .pts li .tx .blank { font-size: 31px; min-width: 220px; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:27px; line-height:1.4; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>

<div class="seed-stage"><div class="seed-slide" data-cat="eq">

    </div>
    <ul class="pts">
      <li data-at="3" data-anim="left"><span class="mk">1</span><span class="tx">ロシア・アメリカ・イギリスなどの<b>外国船</b>が、日本の沿岸に現れはじめた。</span></li>
      <li data-at="3" data-anim="left"><span class="mk">2</span><span class="tx">これを批判した蘭学者の

    </div>
