<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>データで見る農地改革 ── 1939年と1949年の農家｜中2歴史 第27章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gr-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .grow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 26px; }
  .glabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); }
  .gbar { display:flex; height: 130px; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 28px rgba(40,30,10,.14); }
  .seg { display:grid; place-content:center; text-align:center; font-weight:900; font-size:23px; line-height:1.3; }
  .seg.s1 { background:#2F6F4F; color:#fff; }
  .seg.s2 { background:#C9A227; color:#231f16; }
  .seg.s3 { background:#8C3B3B; color:#fff; }
  .gread { display:flex; align-items:center; gap:26px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .gread .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--sumi); white-space:nowrap; }
  .gread .rb { font-size:26px; line-height:1.5; color: var(--sumi); }
  .gread .rb b { color: var(--imp); }
  .gread .rb .blank { min-width:0; white-space:normal; padding:0 9px 3px; margin:0 2px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe gr-safe">
    <div data-at="0">
      <span class="cat-badge"><span class="dot"></span>授業ノート1　資料　農家の経営形態の変化</span>
      <h1 class="headline" style="font-size:56px;margin-top:14px;">10年で、<span class="em">自作農</span>が半分以上になった</h1>
    </div>
    
      <div class="grow" data-at="1" data-anim="fade">
        <div class="glabel">1939年</div>
        <div class="gbar">
          <div class="seg s1" style="width:30.9%"><span>自作農家<br>30.9％</span></div>
          <div class="seg s2" style="width:42.5%"><span>自小作農家<br>42.5％</span></div>
          <div class="seg s3" style="width:26.6%"><span>小作農家<br>26.6％</span></div>
        </div>
      </div>
    
      <div class="grow" data-at="2" data-anim="fade">
        <div class="glabel">1949年</div>
        <div class="gbar">
          <div class="seg s1" style="width:57.1%"><span>自作農家<br>57.1％</span></div>
          <div class="seg s2" style="width:35.1%"><span>自小作農家<br>35.1％</span></div>
          <div class="seg s3" style="width:7.8%"><span>小作農家<br>7.8％</span></div>
        </div>
      </div>
    <div class="gread" data-at="3" data-anim="fade">
      <span class="rt">グラフの読み方</span>
      <span class="rb">自作農家は <b>30.9％ → 57.1％</b> にふえ、小作農家は <b>26.6％ → 7.8％</b> に減った。<br>これが<span class="blank" data-fill="3"><b>農地改革</b></span>の結果。「自作農がふえ、小作農が減った」と言えるようにする。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第27章 日本の民主化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
