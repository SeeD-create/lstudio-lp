<style>
  .ky-safe { inset: 88px 150px 88px; align-content: center; gap: 26px; }

  .item .tx b { color:var(--imp); font-weight:900; }
  .item .tx small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:600; margin-top:2px; }
  .ky-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; font-size:26px; line-height:1.45; }
  .ky-note b { color: var(--gold-soft); }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe ky-safe">
    <div class="ky-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　教育と暮らしの改革</span>
      <h1 class="headline" style="font-size:48px;">学校も、家族も、地域も<span class="em">新しく</span></h1>
    </div>
    <div class="item" data-at="1" data-anim="left">
      <span class="yr">1947</span>
      <span class="tx"><span class="blank" data-fill="1"><span class="bnum">①</span><b>教育基本法</b></span><small>教育勅語が廃止され、六・三制の義務教育が始まる。</small></span>
    </div>
    <div class="item" data-at="2" data-anim="left">
      <span class="yr">改正</span>
      <span class="tx"><span class="blank" data-fill="2"><span class="bnum">②</span><b>民法</b></span>の改正<small>戸主（こしゅ）の制度が廃止され、家族の平等へ。</small></span>
    </div>
    <div class="item" data-at="3" data-anim="left">
      <span class="yr">地域</span>
      <span class="tx"><span class="blank" data-fill="3"><span class="bnum">③</span><b>地方自治法</b></span><small>都道府県知事や市町村長を、住民が直接選挙で選ぶ。</small></span>
    </div>
    <div class="ky-note" data-at="4" data-anim="fade"><span>まとめて覚える</span><span>教育は<b>六・三制を定めた法</b>、家族は<b>家族の法の改正（戸主制の廃止）</b>、地域は<b>地方の法（首長の直接選挙）</b>。「学校・家・地域」の3点で整理。</span></div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
