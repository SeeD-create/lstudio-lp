<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1945年へ ── ヤルタ会談・ドイツ降伏・沖縄戦｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .yl-safe { inset: 88px 150px 88px; align-content: center; gap: 26px; }
  .yl-head { display: grid; gap: 12px; }
  .step { display:grid; grid-template-columns:150px 1fr; gap:24px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:22px 30px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); text-align:center; line-height:1.2; }
  .step .tx { font-size:31px; line-height:1.45; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:33px; min-width:240px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .step .tx small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:600; margin-top:4px; }
  .yl-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.45; }
  .yl-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe yl-safe">
    <div class="yl-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　1945年・終戦への道</span>
      <h1 class="headline" style="font-size:50px;">連合国が<span class="em">勝利へ</span>、戦火は<span class="em">日本本土</span>へ</h1>
    </div>
    <div class="step" data-at="1" data-anim="left">
      <span class="yr">1945<br>2月</span>
      <span class="tx"><span class="blank" data-fill="1"><span class="bnum">①</span><b>ヤルタ会談</b></span><small>アメリカ・イギリス・ソ連の代表が、ソ連の対日参戦と敗戦国の戦後処理を密約した。</small></span>
    </div>
    <div class="step" data-at="2" data-anim="left">
      <span class="yr">1945<br>5月</span>
      <span class="tx"><span class="blank" data-fill="2"><span class="bnum">②</span><b>ドイツ</b></span>が降伏。<small>ヨーロッパでの戦争が終わり、連合国は日本に集中する。</small></span>
    </div>
    <div class="step" data-at="3" data-anim="left" style="border-color:var(--imp);">
      <span class="yr" style="color:var(--imp);">1945<br>4月</span>
      <span class="tx">アメリカ軍が<span class="blank" data-fill="3"><span class="bnum">③</span><b>沖縄</b></span>に上陸（地上戦が始まる）。<small>住民を巻きこむ地上戦となり、多くの命が失われた。</small></span>
    </div>
    <div class="yl-note" data-at="4" data-anim="fade"><span>ここが要注意</span><span><b>2月の会談＝米英ソ</b>／ソ連の参戦が密約された。<b>4月＝日本本土への上陸</b>で、日本で唯一の大規模な地上戦。順番は「会談→上陸→ヨーロッパの降伏」と同時期に進む。</span></div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
