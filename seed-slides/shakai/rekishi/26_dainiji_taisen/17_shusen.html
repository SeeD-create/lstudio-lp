<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>原爆と終戦 ── 広島・長崎、そして玉音放送（8月）｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ss-safe { inset: 80px 150px 80px; align-content: center; gap: 22px; }
  .ss-head { display: grid; gap: 10px; }
  .drow { display:grid; grid-template-columns:180px 1fr; gap:24px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:16px; padding:18px 28px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .drow .dt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--imp); text-align:center; }
  .drow .tx { font-size:30px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .drow .tx .blank { font-size:32px; min-width:200px; }
  .drow .tx b { color:var(--imp); font-weight:900; }
  .drow.win { border-color:var(--imp); background:var(--imp-bg); }
  .ss-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.45; }
  .ss-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ss-safe">
    <div class="ss-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　1945年8月・終戦</span>
      <h1 class="headline" style="font-size:48px;">わずか<span class="em">10日</span>のあいだに、戦争が終わる</h1>
    </div>
    <div class="drow" data-at="1" data-anim="left">
      <span class="dt">8月6日</span>
      <span class="tx">アメリカが<span class="blank" data-fill="1"><span class="bnum">①</span><b>広島</b></span>に、世界で初めて<b>原子爆弾</b>を投下。</span>
    </div>
    <div class="drow" data-at="2" data-anim="left">
      <span class="dt">8月8日</span>
      <span class="tx">ソ連が<b>日ソ中立条約を破って</b>日本を攻撃（参戦）。</span>
    </div>
    <div class="drow" data-at="3" data-anim="left">
      <span class="dt">8月9日</span>
      <span class="tx">アメリカが<span class="blank" data-fill="3"><span class="bnum">②</span><b>長崎</b></span>に、2度目の<b>原子爆弾</b>を投下。</span>
    </div>
    <div class="drow win" data-at="4" data-anim="left">
      <span class="dt">8月15日</span>
      <span class="tx"><span class="blank" data-fill="4"><span class="bnum">③</span><b>ポツダム宣言</b></span>を受諾し、日本が<b>降伏</b>（終戦）。</span>
    </div>
    <div class="ss-note" data-at="5" data-anim="fade"><span>玉音放送</span><span>8月15日、天皇がラジオで戦争の終わりを国民に伝えた<b>玉音放送（ぎょくおんほうそう）</b>が流れた。<b>8/6と8/9に原爆・8/15に降伏</b>の日付はそのまま問われる。</span></div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
