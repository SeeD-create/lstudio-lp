<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>二つの陣営 ── 枢軸国と連合国｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jn-safe { inset: 92px 140px 92px; align-content: center; gap: 34px; }
  .jn-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .jn-row { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: stretch; gap: 0; }
  .camp { border-radius: 24px; padding: 34px 40px; display: grid; gap: 18px; align-content: start; box-shadow: 0 16px 36px rgba(40,30,10,.12); }
  .camp.axis { background:#F3E4E2; border:4px solid #B5433f; }
  .camp.ally { background:#E1E9F0; border:4px solid #3a6b90; }
  .camp .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:42px; }
  .camp.axis .lab { color:#9c2f2b; }
  .camp.ally .lab { color:#2b5878; }
  .camp .sub { font-size:25px; font-weight:700; color:var(--sumi-soft); }
  .nations { display:flex; flex-wrap:wrap; gap:14px; }
  .nation { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; padding:12px 24px; border-radius:14px; background:#fff; box-shadow:0 6px 16px rgba(40,30,10,.10); }
  .camp.axis .nation { color:#9c2f2b; border:2px solid #d79b98; }
  .camp.ally .nation { color:#2b5878; border:2px solid #9bb6cc; }
  .vs { display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; color:var(--sumi-mute); }
  .jn-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.5; }
  .jn-note b { color: var(--gold-soft); }
  .jn-note .r { color:#ff8a8f; font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe jn-safe">
    <div class="jn-head" data-at="0">
      <span class="kicker"><span class="num">導入</span>　二つの陣営</span>
      <h1 class="headline" style="font-size:58px;">世界は<span class="em">枢軸国</span>と<span class="em">連合国</span>に分かれて戦った</h1>
    </div>
    <div class="jn-row">
      <div class="camp axis" data-at="1" data-anim="left">
        <div class="lab">枢軸国（すうじく）</div>
        <div class="sub">日独伊三国同盟（1940）で結んだ側</div>
        <div class="nations"><span class="nation">ドイツ</span><span class="nation">イタリア</span><span class="nation">日本</span></div>
      </div>
      <div class="vs" data-at="2">VS</div>
      <div class="camp ally" data-at="3" data-anim="right">
        <div class="lab">連合国</div>
        <div class="sub">枢軸国と戦った側（後に51か国）</div>
        <div class="nations"><span class="nation">アメリカ</span><span class="nation">イギリス</span><span class="nation">ソ連</span><span class="nation">中国</span></div>
      </div>
    </div>
    <div class="jn-note" data-at="4" data-anim="fade"><span>この図が地図</span><span>日本は<b>ドイツ・イタリア</b>と組んで（＝<span class="r">枢軸国</span>）、<b>アメリカ・イギリス・ソ連・中国</b>（＝<span class="r">連合国</span>）と戦った。「どちらの側か」を最初にはっきりさせておくと、これからの流れが一気に分かる。</span></div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
