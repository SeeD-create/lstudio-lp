<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }

  .qcard .qtext { font-size: 39px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: grid; gap: 18px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 33px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:30px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 大戦の始まり</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext" data-at="0">① ドイツが<span class="u">ポーランド</span>を侵略して始まった戦争は？<br>② 1940年、日本がドイツ・イタリアと結んだ軍事同盟は？　③ 日本の<span class="u">真珠湾攻撃</span>で始まった戦争は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">第二次世界大戦</span>　── 1939年、英仏がドイツに宣戦布告。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">日独伊三国同盟</span>　── 1940年、日本が枢軸国側に立つ。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">太平洋戦争</span>　── 1941年12月8日、対アメリカ・イギリス。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
