<title>戦時下の国民生活 ── 学徒出陣・勤労動員・疎開｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sj-safe { inset: 90px 130px 90px; align-content: center; gap: 32px; }
  .sj-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .sj-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 30px; }
  .sc { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 32px 34px; display:grid; gap:14px; align-content:start; box-shadow: 0 16px 34px rgba(40,30,10,.10); min-height: 340px; }
  .sc .kw { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--imp); line-height:1.1; }
  .sc .rd { font-size:22px; color:var(--sumi-mute); font-weight:700; }
  .sc .bd { font-size:27px; line-height:1.55; color:var(--sumi-soft); font-weight:600; }
  .sc .bd b { color:var(--sumi); font-weight:900; }
  .sj-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.45; }
  .sj-note b { color: var(--gold-soft); }
  .sc .kw .blank { min-width:0; width:100%; white-space:normal; padding:0 10px 3px; margin:0; font-size:32px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sj-safe">
    <div class="sj-head" data-at="0">
      <span class="kicker"><span class="num">資料</span>　戦争と国民のくらし</span>
      <h1 class="headline" style="font-size:50px;">戦争が長びき、<span class="em">国民の生活</span>も戦場に</h1>
    </div>
    <div class="sj-row">
      <div class="sc" data-at="1" data-anim="pop">
        <div class="kw"><span class="blank" data-fill="1"><b>学徒出陣</b></span></div>
        <div class="rd">がくと しゅつじん</div>
        <div class="bd">兵力が不足し、それまで免除されていた<b>大学生</b>も戦場へ送られた。</div>
      </div>
      <div class="sc" data-at="2" data-anim="pop">
        <div class="kw"><span class="blank" data-fill="2"><b>勤労動員</b></span></div>
        <div class="rd">きんろう どういん</div>
        <div class="bd">働き手が足りず、<b>中学生や女学生</b>まで軍需工場で働かされた。</div>
      </div>
      <div class="sc" data-at="3" data-anim="pop">
        <div class="kw"><span class="blank" data-fill="3"><b>疎開</b></span></div>
        <div class="rd">そかい（学童○○）</div>
        <div class="bd">空襲がはげしくなり、<b>都市の子ども</b>が地方へ集団で避難した。</div>
      </div>
    </div>
    <div class="sj-note" data-at="4" data-anim="fade"><span>ここもねらわれる</span><span>戦局が悪くなるほど、この3つのように国民全体が戦争に巻きこまれた。都市への<b>空襲</b>や食料の<b>配給制</b>も、この時期の暮らしの特徴。</span></div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
