<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>独ソ戦と大西洋憲章 ── 1941、東部戦線が開く｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .dk-safe { inset: 90px 150px 90px; align-content: center; gap: 34px; }
  .dk-head { display: grid; gap: 12px; }
  .dk-row { display: grid; grid-template-columns: 1fr 90px 1fr; align-items: stretch; gap: 0; }
  .pc { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 38px;
        box-shadow: 0 16px 36px rgba(40,30,10,.10); display: grid; gap: 14px; align-content: start; }
  .pc .yr { justify-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; padding:6px 20px; border-radius:10px; }
  .pc .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .pc .nm .blank { font-size: 34px; min-width: 260px; }
  .pc .bd { font-size: 29px; line-height: 1.55; color: var(--sumi-soft); font-weight:600; }
  .pc .bd b { color: var(--imp); font-weight:900; }
  .mid-arrow { display:flex; align-items:center; justify-content:center; font-size:52px; color:var(--sumi-mute); font-weight:900; }
  .dk-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 34px; font-size:27px; line-height:1.45; }
  .dk-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe dk-safe">
    <div class="dk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　ヨーロッパの戦況（1941）</span>
      <h1 class="headline" style="font-size:52px;">ドイツが<span class="em">東</span>へ攻め、英米が<span class="em">援助</span>を始める</h1>
    </div>
    <div class="dk-row">
      <div class="pc" data-at="1" data-anim="left">
        <span class="yr">1941年6月</span>
        <div class="nm">ドイツが<span class="blank" data-fill="2"><span class="bnum">①</span><b>ソ連</b></span>に侵攻</div>
        <div class="bd">ドイツは<b>不可侵条約を破って</b>東へ攻めこんだ。東側にも戦線が広がる。</div>
      </div>
      <div class="mid-arrow" data-at="3">→</div>
      <div class="pc" data-at="3" data-anim="right">
        <span class="yr">同じころ</span>
        <div class="nm">英米が<span class="blank" data-fill="3"><span class="bnum">②</span><b>大西洋憲章</b></span></div>
        <div class="bd">イギリスとアメリカが共同の宣言を出し、<b>東の国への援助</b>を進めた。</div>
      </div>
    </div>
    <div class="dk-note" data-at="4" data-anim="fade"><span>流れをつかむ</span><span>「不可侵の約束を破って東を攻める」→「英米がその国を助ける」。これで連合国が団結し、ドイツはしだいに追いつめられていく。</span></div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
