<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>経済の民主化② ── 労働三法・農地改革（自作農がふえる）｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kz-safe { inset: 84px 140px 84px; grid-template-columns: 1fr 640px; align-content: center; gap: 50px; align-items: center; }
  .kz-txt { display: grid; gap: 18px; }
  .kz-head { display:grid; gap:10px; }
  .item { display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:16px; padding:18px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .item .yr { justify-self:start; background:var(--sumi); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:22px; padding:5px 16px; border-radius:9px; }
  .item .tx { font-size:27px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .item .tx .blank { font-size:29px; min-width:230px; }
  .item .tx b { color:var(--imp); font-weight:900; }
  .item .tx small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:600; }
  .chart { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 24px; box-shadow: 0 16px 38px rgba(40,30,10,.12); padding: 20px 24px; }
  .chart h3 { margin:0 0 6px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); }
  .chart svg { display:block; width:100%; height:auto; }
  .cl { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:19px; }
  .kz-note { display:flex; align-items:center; gap:18px; background:var(--sumi); color:var(--paper-hi); border-radius:14px; padding:16px 26px; font-size:24px; line-height:1.4; }
  .kz-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe kz-safe">
    <div class="kz-txt">
      <div class="kz-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート2</span>　経済の民主化 ②</span>
        <h1 class="headline" style="font-size:44px;">働く人と、<span class="em">農民</span>を守る改革</h1>
      </div>
      <div class="item" data-at="1" data-anim="left">
        <span class="yr">1945</span>
        <span class="tx"><span class="blank" data-fill="1"><span class="bnum">①</span><b>労働組合法</b></span><small>労働者の団結を認める。</small></span>
      </div>
      <div class="item" data-at="2" data-anim="left">
        <span class="yr">1947</span>
        <span class="tx"><span class="blank" data-fill="2"><span class="bnum">②</span><b>労働基準法</b></span><small>労働条件の基準を定める。</small></span>
      </div>
      <div class="item" data-at="3" data-anim="left">
        <span class="yr">1946〜</span>
        <span class="tx"><span class="blank" data-fill="3"><span class="bnum">③</span><b>農地改革</b></span><small>地主の土地を安く小作農民に売りわたす。</small></span>
      </div>
      <div class="kz-note" data-at="5" data-anim="fade"><span>効果</span><span>この改革で<b>自作農が大きく増え</b>、多くの農民が自分の土地をもてた。</span></div>
    </div>
    <div class="chart" data-at="4" data-anim="right">
      <h3>農家の形態の変化（この改革の効果）</h3>
      <svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg">
        <!-- legend -->
        <rect x="40" y="14" width="22" height="18" fill="#4c7a4c"/><text class="cl" x="68" y="29" fill="#333">自作</text>
        <rect x="150" y="14" width="22" height="18" fill="#c9a24b"/><text class="cl" x="178" y="29" fill="#333">自小作</text>
        <rect x="290" y="14" width="22" height="18" fill="#C4161C"/><text class="cl" x="318" y="29" fill="#333">小作</text>
        <!-- 1939 -->
        <text class="cl" x="40" y="95" fill="#333" font-size="22">1939年</text>
        <g>
          <rect x="40" y="105" width="142" height="46" fill="#4c7a4c"/><text class="cl" x="111" y="134" fill="#fff" text-anchor="middle">30.9%</text>
          <rect x="182" y="105" width="196" height="46" fill="#c9a24b"/><text class="cl" x="280" y="134" fill="#fff" text-anchor="middle">42.5%</text>
          <rect x="378" y="105" width="122" height="46" fill="#C4161C"/><text class="cl" x="439" y="134" fill="#fff" text-anchor="middle">26.6%</text>
        </g>
        <!-- 1949 -->
        <text class="cl" x="40" y="205" fill="#333" font-size="22">1949年</text>
        <g>
          <rect x="40" y="215" width="263" height="46" fill="#4c7a4c"/><text class="cl" x="171" y="244" fill="#fff" text-anchor="middle">57.1%</text>
          <rect x="303" y="215" width="161" height="46" fill="#c9a24b"/><text class="cl" x="383" y="244" fill="#fff" text-anchor="middle">35.1%</text>
          <rect x="464" y="215" width="36" height="46" fill="#C4161C"/><text class="cl" x="482" y="244" fill="#fff" text-anchor="middle">7.8</text>
        </g>
        <text class="cl" x="40" y="300" fill="#9c2f2b" font-size="21">→ 自作農が 30.9% から 57.1% に大きく増えた</text>
      </svg>
    </div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
