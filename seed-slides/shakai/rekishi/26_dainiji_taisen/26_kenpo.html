<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日本国憲法 ── 1946年公布・1947年施行｜中2歴史 第26章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kp-safe { inset: 90px 150px 90px; grid-template-columns: 1fr 600px; align-content: center; gap: 54px; align-items: center; }
  .kp-txt { display: grid; gap: 24px; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 38px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 34px; line-height: 1.7; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 38px; min-width: 320px; }
  .def b.im { color: var(--imp); font-weight:900; }
  .kp-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; font-size:26px; line-height:1.45; }
  .kp-note b { color: var(--gold-soft); }
  .dates { display:grid; gap:26px; }
  .dcard { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 22px; padding: 28px 34px; box-shadow: 0 16px 38px rgba(40,30,10,.12); display:grid; gap:8px; }
  .dcard .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .dcard .dt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--imp); }
  .dcard .ds { font-size:24px; color:var(--sumi-mute); font-weight:700; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kp-safe">
    <div class="kp-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート2　新しい国の土台</span>
        <h1 class="headline" style="font-size:48px;margin-top:14px;">民主化の<span class="em">総仕上げ</span>となった1つの法</h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        戦後の日本の土台となる<br>
        <span class="blank" data-fill="1"><span class="bnum">①</span><b>日本国憲法</b></span>が定められた。<br>
        国民が主権をもつ、新しい国のかたち。
      </div>
      <div class="kp-note" data-at="4" data-anim="fade"><span>語呂で覚える</span><span>公布<b>1946年11月3日</b>（今の「文化の日」）→半年後に施行<b>1947年5月3日</b>（今の「憲法記念日」）。この2つの日付はそのまま問われる。</span></div>
    </div>
    <div class="dates">
      <div class="dcard" data-at="2" data-anim="right">
        <div class="lb">公布</div>
        <div class="dt">1946年11月3日</div>
        <div class="ds">国民に発表された日（現在の文化の日）</div>
      </div>
      <div class="dcard" data-at="3" data-anim="right">
        <div class="lb">施行</div>
        <div class="dt">1947年5月3日</div>
        <div class="ds">実際に使われ始めた日（現在の憲法記念日）</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第26章 第二次世界大戦</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
