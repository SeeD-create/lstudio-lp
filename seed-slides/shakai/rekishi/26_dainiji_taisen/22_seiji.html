  .hl { display:flex; align-items:center; gap:22px; background:var(--imp-bg); border:3px solid var(--imp); border-radius:16px; padding:20px 34px; font-size:29px; color:var(--sumi); font-weight:700; }
  .hl b { color:var(--imp); font-weight:900; }

<div class="seed-stage"><div class="seed-slide" data-cat="soc">
