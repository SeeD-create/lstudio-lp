      <p class="qtext" data-at="0">① 政治活動の自由のため廃止された法律は？　② <span class="u">満20歳以上の男女</span>にあたえられたのは？<br>③ 三井・三菱・住友などを解体したことは？　④ 地主の土地を小作農民に売りわたした改革は？</p>
      <div class="ans">

        <div class="row" data-at="2"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">農地改革</span>　── 自作農が大きく増えた。</b></span></span></div>
