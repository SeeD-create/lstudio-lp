<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　この単元とは</span>
      <h1 class="headline" style="font-size:60px;">世界を巻き込む<span class="em">大戦</span>と、その後の<span class="em">日本の民主化</span></h1>
    </div>
    <p class="tw-def" data-at="1">1939年、ドイツのポーランド侵略から<span class="em">第二次世界大戦</span>が始まり、日本も1941年に<span class="em">太平洋戦争</span>へ突入した。1945年に日本は降伏し、その後、<span class="em">占領のもとで新しい国</span>へと造りかえられていく。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">大戦の勃発</div><div class="ds">ヨーロッパで<b>第二次世界大戦</b>／日本は<b>日独伊三国同盟</b>で参戦。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">戦局と終戦</div><div class="ds"><b>真珠湾</b>→<b>ミッドウェー</b>→<b>原爆・ポツダム宣言</b>で敗戦。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">戦後の民主化</div><div class="ds"><b>GHQ</b>の改革と<b>日本国憲法</b>で、日本が生まれ変わる。</div></div>
    </div>
  </div>
