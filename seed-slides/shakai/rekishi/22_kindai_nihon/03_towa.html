<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　近代日本とは</span>
      <h1 class="headline" style="font-size:60px;">機械で作る国へ ── <span class="em">産業革命</span>が社会も文化も変えた</h1>
    </div>
    <p class="tw-def" data-at="1">明治になって工業がおこると、日本でも機械で大量に物を作る<span class="em">産業革命</span>が始まった。<br>豊かさが進む一方で<span class="em">公害や労働問題</span>が生まれ、<span class="em">教育や文化</span>も欧米に学んで近代化した。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">産業革命</div><div class="ds">官営工場の払い下げ→<b>軽工業</b>から<b>重工業</b>へ。八幡製鉄所・財閥。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">生まれた問題</div><div class="ds"><b>足尾鉱毒事件</b>・労働争議・小作人。社会主義運動と<b>大逆事件</b>。</div></div>
      <div class="arrow" data-at="4">→</div>
      <div class="fb" data-at="4" data-anim="pop"><div class="ttl">教育と文化</div><div class="ds"><b>義務教育</b>の広がり、<b>近代文学</b>・美術・音楽・科学の発展。</div></div>
    </div>
  </div>
