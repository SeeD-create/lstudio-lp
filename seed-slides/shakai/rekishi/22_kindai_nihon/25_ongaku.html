<style>
  .sd-safe { inset: 90px 150px 90px; grid-template-columns: 1fr 500px; align-content: center; gap: 54px; align-items: center; }
  .sd-txt { display: grid; gap: 26px; }
  .sd-fig { height: 520px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:18px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }

  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:26px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; text-align:center; }
  .def { font-size: 40px; font-weight: 700; color: var(--sumi); line-height: 1.6; }
  .def .blank { font-size: 44px; min-width: 300px; }
  .def .em { color: var(--imp); font-weight:900; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
