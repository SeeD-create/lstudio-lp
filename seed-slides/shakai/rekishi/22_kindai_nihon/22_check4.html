<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 作品と作者｜中2歴史 第22章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:45px 57px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 36px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .ans { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
  .ans .row { display:flex; align-items:baseline; gap: 16px; font-size: 30px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:28px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 作品と作者</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. この作品を書いたのはだれ？</div>
      <p class="qtext" data-at="0">①『小説神髄』　②『浮雲』　③『舞姫』<br>④『坊っちゃん』　⑤『みだれ髪』　⑥『一握の砂』</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">坪内逍遙</span></b></span></span></div>
        <div class="row" data-at="1"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">夏目漱石</span></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">二葉亭四迷</span></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">⑤</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">与謝野晶子</span></b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">森鷗外</span></b></span></span></div>
        <div class="row" data-at="3"><span class="qn">⑥</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">石川啄木</span></b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第22章 近代日本</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
