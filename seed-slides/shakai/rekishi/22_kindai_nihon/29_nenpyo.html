  .np-head { display: grid; gap: 6px; }
  .np-list { display: grid; gap: 12px; }
  .np-row { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 28px;
            background: var(--paper-hi); border-left: 9px solid var(--cat); border-radius: 0 13px 13px 0;
            padding: 12px 30px; box-shadow: 0 6px 15px rgba(40,30,10,.06); }
  .np-row .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); letter-spacing:.02em; line-height:1.1; }
  .np-row .ev { font-size: 29px; font-weight: 700; color: var(--sumi); line-height:1.25; }
  .np-row .ev small { color: var(--sumi-mute); font-weight:500; font-size:22px; margin-left:12px; }
  .np-row .ev b { color: var(--imp); font-weight:900; }
  .np-row .ev .blank { min-width:0; white-space:normal; padding:0 9px 3px; margin:0 2px; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">29</span>　近代日本 年表</span>
      <h1 class="headline" style="font-size:46px;">1880から1910へ ── 産業革命と社会の変化をひとつなぎ</h1>
    </div>
    <div class="np-list">
      <div class="np-row" data-at="1" data-anim="left"><span class="yr">1880ごろ</span><span class="ev"><span class="blank" data-fill="1"><b>官営工場の払い下げ</b></span><small>綿糸紡績業が発達し、産業革命が始まる（軽工業）</small></span></div>
      <div class="np-row" data-at="2" data-anim="left"><span class="yr">1886</span><span class="ev"><span class="blank" data-fill="2"><b>学校令</b></span><small>義務教育を4年とする</small></span></div>
      <div class="np-row" data-at="3" data-anim="left"><span class="yr">1890</span><span class="ev"><span class="blank" data-fill="3"><b>教育勅語</b></span><small>忠君愛国・教育のよりどころ</small></span></div>
      <div class="np-row" data-at="4" data-anim="left"><span class="yr">1891</span><span class="ev"><span class="blank" data-fill="4"><b>足尾鉱毒事件</b></span><small>田中正造が公害反対運動（1901に天皇へ直訴）</small></span></div>
      <div class="np-row" data-at="5" data-anim="left"><span class="yr">1897</span><span class="ev"><span class="blank" data-fill="5"><b>八幡製鉄所を建設</b></span><small>日清戦争の賠償金がもと・重工業の中心へ</small></span></div>
      <div class="np-row" data-at="6" data-anim="left"><span class="yr">1901ごろ</span><span class="ev"><span class="blank" data-fill="6"><b>重工業・財閥の発達</b></span><small>機械・造船／三井・三菱・住友</small></span></div>
      <div class="np-row" data-at="7" data-anim="left"><span class="yr">1910</span><span class="ev"><span class="blank" data-fill="7"><b>大逆事件</b></span><small>幸徳秋水らを死刑・社会主義運動を弾圧</small></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第22章 近代日本</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
