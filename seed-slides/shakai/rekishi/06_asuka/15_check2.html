<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }

  .ans { margin-top: 38px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:80px; line-height:1.1; color: var(--sumi); }

<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ②</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 一問一答</div>
      <p class="qtext" data-at="0">聖徳太子が建てた、<span class="u">現存する世界最古の木造建築</span>である<br>寺の名前は？　また、その世界遺産にふさわしい理由は？</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-at="1" data-fill="1" data-anim="pop"><b>法隆寺</b></span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>理由 ＝ <span class="hl">現存する世界最古の木造建築</span>だから。<br>時代の文化は<span class="hl">飛鳥文化</span>（仏教中心・ヘレニズムの影響）。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
