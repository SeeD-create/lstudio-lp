<title>飛鳥時代 年表 ── 593→630→645→672｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { inset: 80px 200px 80px; align-content: center; gap: 28px; }
  .np-head { display: grid; gap: 10px; justify-items:center; text-align:center; }
  .tl { display: grid; gap: 12px; }
  .ev { display:flex; align-items:center; gap:30px; background:var(--paper-hi); border:2.5px solid var(--hair); border-radius:16px; padding:18px 34px; box-shadow:0 8px 20px rgba(40,30,10,.06); }
  .ev .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); width:150px; text-align:right; flex:none; }
  .ev .yr .imp { color: var(--imp); }
  .ev .bar { width:14px; height:14px; border-radius:50%; background:var(--sumi); flex:none; }
  .ev .tx { font-size:34px; font-weight:700; }
  .ev .tx small { color:var(--sumi-mute); font-weight:500; font-size:25px; }
  .ev.hot { border-color: var(--imp); }
  .ev.hot .bar { background: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">まとめ</span>　飛鳥時代の年表</span>
      <h1 class="headline" style="font-size:54px;">この4つの<span class="em">年号</span>で流れをつかむ</h1>
    </div>
    <div class="tl">
      <div class="ev" data-at="1" data-anim="left"><span class="yr">593</span><span class="bar"></span><span class="tx">聖徳太子が推古天皇の<span class="blank" data-fill="1"><b>摂政</b></span>となる<small>　冠位十二階・十七条の憲法・中国へ使者</small></span></div>
      <div class="ev" data-at="2" data-anim="left"><span class="yr">607</span><span class="bar"></span><span class="tx"><span class="blank" data-fill="2"><b>遣隋使</b></span>（小野妹子）を隋に送る<small>　対等の立場で</small></span></div>
      <div class="ev" data-at="3" data-anim="left"><span class="yr">618</span><span class="bar"></span><span class="tx">隋が滅び、<b>唐</b>が成立<small>　やがて中国を統一</small></span></div>
      <div class="ev" data-at="4" data-anim="left"><span class="yr">630</span><span class="bar"></span><span class="tx"><span class="blank" data-fill="4"><b>遣唐使</b></span>を唐に送る<small>　唐のすぐれた制度を学ぶ</small></span></div>
      <div class="ev hot" data-at="5" data-anim="left"><span class="yr"><span class="imp">645</span></span><span class="bar"></span><span class="tx"><span class="blank" data-fill="5"><b>大化改新</b></span>（中大兄皇子・中臣鎌足が蘇我氏をたおす）<small>　公地公民</small></span></div>
      <div class="ev hot" data-at="6" data-anim="left"><span class="yr"><span class="imp">672</span></span><span class="bar"></span><span class="tx"><span class="blank" data-fill="6"><b>壬申の乱</b></span> → 大海人皇子が<span class="blank" data-fill="6"><b>天武天皇</b></span>に<small>　あとつぎ争い</small></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
