<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>冠位十二階 ── 家がらでなく才能で役人を選ぶ｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kn-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-content: center; gap: 60px; align-items: center; }
  .kn-txt { display: grid; gap: 30px; }
  .kn-fig { height: 560px; border-radius: 28px; }
  .kn-name { font-size: 60px; font-weight: 700; }
  .kn-name .blank { font-size: 60px; min-width: 380px; }
  .kn-def { font-size:34px; line-height:1.6; color:var(--sumi-soft); }
  .kn-def .imp { color: var(--imp); font-weight: 900; }
  .kn-vs { display:flex; gap:20px; }
  .vsbox { flex:1; background:var(--paper-hi); border-radius:18px; border:2.5px solid var(--hair); padding:22px 26px; }
  .vsbox .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi-mute); }
  .vsbox.now { border-color: var(--cat); }
  .vsbox.now .h { color: var(--cat); }
  .vsbox .t { font-size:28px; line-height:1.4; margin-top:8px; font-weight:700; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kn-safe">
    <div class="kn-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>聖徳太子の政治 ①</span>
        <h1 class="headline" style="font-size:52px;margin-top:16px;">才能で役人を選ぶしくみ</h1>
      </div>
      <div class="kn-name" data-at="1" data-anim="pop"><span class="blank" data-fill="1"><span class="bnum">④</span><b>冠位十二階</b></span></div>
      <div class="kn-def" data-at="2" data-anim="fade">家がらに関係なく、<span class="imp">才能によって役人を採用する</span>制度。位を12に分け、能力のある人を取り立てた。</div>
      <div class="kn-vs" data-at="3" data-anim="fade">
        <div class="vsbox"><div class="h">これまで</div><div class="t">家がらで決まる<br>（生まれで一生決定）</div></div>
        <div class="vsbox now"><div class="h">この制度</div><div class="t">才能で決まる<br>（実力で上へ）</div></div>
      </div>
    </div>
    <div class="figure kn-fig" data-at="0" data-anim="right"><img src="assets/shotoku_govern.webp" alt="冠位十二階のしくみ"></div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
