<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .zt-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .zt-head { display: grid; gap: 14px; }
  .zt-flow { display: grid; grid-template-columns: 1fr 90px 1fr; align-items: center; gap: 20px; }
  .ecard { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px;
           padding: 34px 38px 38px; box-shadow: 0 16px 34px rgba(40,30,10,.12); display: grid; gap: 14px; text-align:center; min-height: 260px; align-content:center; }

  .ecard .nm { font-size: 64px; font-weight: 700; }
  .ecard .nm .blank { font-size: 64px; min-width: 200px; }
  .ecard .ds { font-size:27px; line-height:1.45; color:var(--sumi-soft); }
  .arw { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi-mute); text-align:center; }
  .zt-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .zt-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .zt-note .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .zt-note .bb b { color:#fff; }
</style>

<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe zt-safe">
    <div class="zt-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　中国の動き</span>
      <h1 class="headline" style="font-size:58px;">中国を統一した国が<span class="em">交代</span>する</h1>
    </div>
    <div class="zt-flow">
      <div class="ecard" data-at="1" data-anim="pop">
        <div class="yr">6世紀の末</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">②</span><b>隋</b></span></div>
        <div class="ds">中国を統一。聖徳太子はこの隋に遣隋使を送った。</div>
      </div>
      <div class="arw" data-at="2">▶</div>
      <div class="ecard" data-at="2" data-anim="pop">

        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">⑫</span><b>唐</b></span></div>

      </div>
    </div>

      <span class="bt">★入れかわりに注意</span>
      <span class="bb">聖徳太子のころ＝<b>隋</b>（遣隋使）。少しあと、大化改新のころ＝<b>唐</b>（遣唐使）。「隋→唐」の順をまちがえない。</span>
    </div>
  </div>
