<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>改新の詔 ── 公地公民と3つの制度｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mk-safe { inset: 84px 130px 84px; align-content: start; gap: 28px; }
  .mk-head { display: grid; gap: 10px; }
  .koti { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 26px 40px;
          box-shadow: 0 14px 30px rgba(40,30,10,.10); display:flex; align-items:center; gap:28px; }
  .koti .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); white-space:nowrap; }
  .koti .v { font-size:40px; font-weight:700; }
  .koti .v .blank { font-size:44px; min-width:280px; }
  .koti .v .imp { color: var(--imp); font-weight: 900; }
  .mk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .sc { position: relative; background: var(--paper-hi); border-radius: 18px; border: 2.5px solid var(--hair);
        padding: 24px 26px 28px; display: grid; align-content: start; gap: 10px; min-height: 210px; }
  .sc .sh { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi); }
  .sc .sd { font-size:25px; line-height:1.45; color:var(--sumi-soft); }
  .sc .sd .imp { color: var(--imp); font-weight: 900; }
  .mk-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 32px; }
  .mk-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .mk-note .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.92); }
  .mk-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe mk-safe">
    <div class="mk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　改新の詔（みことのり）</span>
      <h1 class="headline" style="font-size:56px;">改革でうち出された<span class="em">新しいきまり</span></h1>
    </div>
    <div class="koti" data-at="1" data-anim="pop">
      <span class="lab">いちばん大事</span>
      <span class="v"><span class="blank" data-fill="1"><span class="bnum">⑮</span><b>公地公民</b></span> … <span class="imp">土地と人民を国のもの</span>とし、天皇が支配する</span>
    </div>
    <div class="mk-row">
      <div class="sc" data-at="2" data-anim="pop"><div class="sh">班田収授の法</div><div class="sd">戸籍を作り、人々に<span class="imp">土地を貸す</span>制度。</div></div>
      <div class="sc" data-at="3" data-anim="pop"><div class="sh">国郡制度</div><div class="sd">日本を<span class="imp">国・郡</span>に分けて治める制度。</div></div>
      <div class="sc" data-at="4" data-anim="pop"><div class="sh">租・庸・調</div><div class="sd"><span class="imp">税を納める</span>制度（租・庸・調の3つ）。</div></div>
    </div>
    <div class="mk-note" data-at="5" data-anim="fade">
      <span class="bt">その後</span>
      <span class="bb">これらの制度は、<b>701年の大宝律令</b>で整えられ、天皇中心の「律令国家」が完成へと向かう。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
