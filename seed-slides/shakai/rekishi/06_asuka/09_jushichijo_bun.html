<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>十七条の憲法（条文）── 和・三宝・詔｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bn-safe { inset: 96px 150px 96px; grid-template-columns: 640px 1fr; align-content: center; gap: 60px; align-items: center; }
  .quote { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 40px 46px;
           box-shadow: 0 16px 36px rgba(40,30,10,.10); font-family:'Zen Old Mincho',serif; font-weight:700;
           font-size: 40px; line-height: 2.0; color: var(--sumi); }
  .quote .qlab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); letter-spacing:.12em; display:block; margin-bottom:18px; }
  .quote .em { color: var(--imp); font-weight: 900; }
  .bn-txt { display: grid; gap: 24px; }
  .rd { background:var(--paper-hi); border-left:10px solid var(--cat); border-radius:0 16px 16px 0; padding:24px 30px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .rd .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .rd .t { font-size:29px; line-height:1.5; color:var(--sumi-soft); margin-top:8px; }
  .rd .t .imp { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe bn-safe">
    <div class="quote" data-at="0" data-anim="fade">
      <span class="qlab">十七条の憲法（一部）</span>
      一に曰く、<span class="em">和</span>をもって貴しとなし、さかふることなきを宗となせ。<br>
      二に曰く、あつく<span class="em">三宝</span>を敬え。三宝とは仏法僧なり。<br>
      三に曰く、<span class="em">詔</span>を承りては、必ず謹め。
    </div>
    <div class="bn-txt">
      <div class="rd" data-at="1" data-anim="fade"><div class="h">一条 ── 和</div><div class="t">「みんな<span class="blank" data-fill="1"><b>仲よく</b></span>、争うな」。役人どうしの争いをいましめた。</div></div>
      <div class="rd" data-at="2" data-anim="fade"><div class="h">二条 ── 三宝</div><div class="t">三宝＝<span class="blank" data-fill="2"><b>仏・法・僧</b></span>。仏教をあつく敬え、という仏教保護の宣言。</div></div>
      <div class="rd" data-at="3" data-anim="fade"><div class="h">三条 ── 詔</div><div class="t">詔＝<span class="blank" data-fill="3"><b>天皇の命令</b></span>。これには必ず従え＝天皇中心の考え方。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
