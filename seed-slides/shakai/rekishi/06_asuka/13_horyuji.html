<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>法隆寺 ── 現存する世界最古の木造建築｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hj-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 600px; align-content: center; gap: 60px; align-items: center; }
  .hj-txt { display: grid; gap: 26px; }
  .hj-fig { height: 620px; border-radius: 28px; }
  .hj-name { font-size: 60px; font-weight: 700; }
  .hj-name .blank { font-size: 62px; min-width: 300px; }
  .hj-def { font-size:34px; line-height:1.6; color:var(--sumi-soft); }
  .hj-def .imp { color: var(--imp); font-weight: 900; }
  .hj-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 32px; }
  .hj-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hj-note .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hj-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe hj-safe">
    <div class="hj-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>飛鳥文化 ①</span>
        <h1 class="headline" style="font-size:54px;margin-top:16px;">聖徳太子が建てた寺</h1>
      </div>
      <div class="hj-name" data-at="1" data-anim="pop"><span class="blank" data-fill="2"><span class="bnum">⑩</span><b>法隆寺</b></span></div>
      <div class="hj-def" data-at="3" data-anim="fade">聖徳太子が、大和（奈良県）の<span class="imp">斑鳩</span>地方に建てた寺。飛鳥文化を代表する寺院。</div>
      <div class="hj-note" data-at="4" data-anim="fade">
        <span class="bt">★最重要</span>
        <span class="bb">この寺は、現存する<b>世界最古の木造建築</b>。だから世界遺産に登録されている ── ここが記述で問われる。</span>
      </div>
    </div>
    <div class="figure hj-fig" data-at="0" data-anim="right"><img src="assets/horyuji_pagoda.webp" alt="法隆寺の五重塔"></div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
