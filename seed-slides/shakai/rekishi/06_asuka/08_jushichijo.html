<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>十七条の憲法 ── 役人の心得を示す・仏教を保護｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jc-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .jc-head { display: grid; gap: 14px; }
  .jc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .pcard { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
           padding: 36px 40px 40px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 16px; min-height: 320px; align-content: start; }
  .pcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); }
  .pcard .no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .pcard .nm { font-size: 46px; font-weight: 700; }
  .pcard .nm .blank { font-size: 48px; min-width: 340px; }
  .pcard .ds { font-size:29px; line-height:1.5; color:var(--sumi-soft); }
  .pcard .ds .imp { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe jc-safe">
    <div class="jc-head" data-at="0">
      <span class="kicker"><span class="num">聖徳太子の政治 ②③</span>　二つのしくみ</span>
      <h1 class="headline" style="font-size:60px;">役人の<span class="em">心得</span>と、<span class="em">ある宗教</span>の保護</h1>
    </div>
    <div class="jc-row">
      <div class="pcard" data-at="1" data-anim="pop">
        <div class="no">其の一</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">⑤</span><b>十七条の憲法</b></span></div>
        <div class="ds"><span class="imp">役人の心得</span>を示したきまり。天皇の命令に従うこと、仲よく（和を大切に）することなどを定めた。</div>
      </div>
      <div class="pcard" data-at="3" data-anim="pop">
        <div class="no">其の二</div>
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">⑥</span><b>仏教</b></span>を保護</div>
        <div class="ds">聖徳太子はこれを厚く敬い、政治や文化の中心にすえた。のちの<span class="imp">飛鳥文化</span>につながる。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
