<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>改新の二人 ── 後の天智天皇・後の藤原鎌足｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ft-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .ft-head { display: grid; gap: 14px; justify-items: center; text-align: center; }
  .ft-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
  .pcard { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
           padding: 40px 44px 44px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 18px; min-height: 340px; align-content: center; text-align:center; }
  .pcard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:21px 21px 0 0; }
  .pcard .role { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .pcard .now { font-size: 48px; font-weight: 700; }
  .pcard .arw { font-size: 40px; color: var(--sumi-mute); }
  .pcard .after { font-size: 30px; color: var(--sumi-soft); }
  .pcard .after .imp { color: var(--imp); font-weight: 900; font-size:44px; }
  .pcard .after .blank { font-size: 44px; min-width: 260px; }
  .ft-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .ft-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .ft-note .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .ft-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ft-safe">
    <div class="ft-head" data-at="0">
      <span class="kicker"><span class="num">整理</span>　改新の二人</span>
      <h1 class="headline" style="font-size:58px;">だれが、のちに<span class="em">何</span>になったか</h1>
    </div>
    <div class="ft-row">
      <div class="pcard" data-at="1" data-anim="pop">
        <div class="role">中心人物 その一</div>
        <div class="now">中大兄皇子</div>
        <div class="arw">▼ のちに</div>
        <div class="after"><span class="imp">天智天皇</span>（次のスライドで確認）</div>
      </div>
      <div class="pcard" data-at="2" data-anim="pop">
        <div class="role">中心人物 その二</div>
        <div class="now">中臣鎌足</div>
        <div class="arw">▼ のちに</div>
        <div class="after"><span class="blank" data-fill="2"><span class="bnum">⑬</span><b>藤原鎌足</b></span></div>
      </div>
    </div>
    <div class="ft-note" data-at="3" data-anim="fade">
      <span class="bt">★ここで差がつく</span>
      <span class="bb">中臣鎌足は、のちに<b>藤原</b>の名をもらい<b>藤原氏</b>の祖となる。平安時代に大きな力をふるう藤原氏は、ここが出発点。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
