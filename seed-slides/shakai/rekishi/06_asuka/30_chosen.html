<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>朝鮮半島の動き ── 新羅・百済・高句麗｜中学 歴史 §6</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cs-safe { inset: 90px 140px 90px; grid-template-columns: 720px 1fr; align-content: center; gap: 56px; align-items: center; }
  .cs-map { background: var(--paper-hi); border-radius: 24px; border:2.5px solid var(--hair); box-shadow: 0 16px 36px rgba(40,30,10,.10); padding: 20px; }
  .cs-r { display: grid; gap: 20px; }
  .cs-head { display: grid; gap: 10px; }
  .krow { display:flex; align-items:center; gap:20px; background:var(--paper-hi); border:2.5px solid var(--hair); border-radius:16px; padding:18px 24px; }
  .krow .sw { width:34px; height:34px; border-radius:8px; flex:none; }
  .krow .v { font-size:32px; font-weight:700; }
  .krow .v .blank { font-size:34px; min-width:200px; }
  .krow .v small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:500; }
  .cs-note { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 28px; }
  .cs-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color:var(--gold-soft); white-space:nowrap; }
  .cs-note .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.92); }
  .cs-note .bb b { color:#fff; }
  .maplab { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:26px; fill:#fff; }
  .maplab2 { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:24px; fill:var(--sumi); }
  .mapmk { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:34px; fill:var(--sumi); text-anchor:middle; dominant-baseline:central; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe cs-safe">
    <div class="cs-map" data-at="0">
      <svg viewBox="0 0 680 520" width="100%" height="480" role="img" aria-label="朝鮮半島の三国">
        <!-- 唐（中国大陸） -->
        <path d="M20,40 L250,40 L250,300 Q170,340 120,480 L20,480 Z" fill="#DCDBD7" stroke="#8B8A88" stroke-width="2"/>
        <text x="90" y="150" class="maplab2">唐</text>
        <text x="60" y="185" style="font-size:19px;fill:#8B8A88;">（中国）</text>
        <!-- 高句麗（北部）＝A -->
        <path d="M250,40 L520,40 L520,190 L250,190 Z" fill="#6B6A67" stroke="#4A4947" stroke-width="2"/>
        <circle cx="385" cy="115" r="30" fill="#fff" stroke="#4A4947" stroke-width="3"/>
        <text x="385" y="115" class="mapmk">A</text>
        <!-- 百済（南西）＝B -->
        <path d="M250,190 L385,190 L385,400 Q320,430 300,470 L250,320 Z" fill="#C4161C" stroke="#8f1015" stroke-width="2"/>
        <circle cx="313" cy="285" r="30" fill="#fff" stroke="#8f1015" stroke-width="3"/>
        <text x="313" y="285" class="mapmk">B</text>
        <!-- 新羅（南東）＝C -->
        <path d="M385,190 L520,190 L520,400 Q460,440 400,460 L385,400 Z" fill="#3A3A39" stroke="#141414" stroke-width="2"/>
        <circle cx="452" cy="285" r="30" fill="#fff" stroke="#141414" stroke-width="3"/>
        <text x="452" y="285" class="mapmk">C</text>
        <!-- 日本 -->
        <path d="M580,300 Q640,330 650,420 Q600,470 560,460 Q590,380 580,300 Z" fill="#DCDBD7" stroke="#8B8A88" stroke-width="2"/>
        <text x="588" y="400" class="maplab2">日本</text>
      </svg>
    </div>
    <div class="cs-r">
      <div class="cs-head" data-at="0">
        <span class="kicker"><span class="num">練習問題</span>　朝鮮半島</span>
        <h1 class="headline" style="font-size:50px;">半島の<span class="em">三つの国</span></h1>
      </div>
      <div class="krow" data-at="1" data-anim="pop"><span class="sw" style="background:#6B6A67;"></span><span class="v"><span class="blank" data-fill="1"><span class="bnum">A</span><b>高句麗</b></span><small>北部の国</small></span></div>
      <div class="krow" data-at="2" data-anim="pop"><span class="sw" style="background:#C4161C;"></span><span class="v"><span class="blank" data-fill="2"><span class="bnum">B</span><b>百済</b></span><small>南西の国 ＝ 日本と関係が深い</small></span></div>
      <div class="krow" data-at="3" data-anim="pop"><span class="sw" style="background:#3A3A39;"></span><span class="v"><span class="blank" data-fill="3"><span class="bnum">C</span><b>新羅</b></span><small>南東の国 ＝ 唐と結ぶ</small></span></div>
      <div class="cs-note" data-at="4" data-anim="fade">
        <span class="bt">★ここが問われる</span>
        <span class="bb">唐は<b>C</b>と結び、<b>A・B</b>を滅ぼした。日本と関係が深かったのは<b>B</b>の国。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第6章 飛鳥時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
