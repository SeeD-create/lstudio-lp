<title>藤原氏の全盛 ── 道長・頼通と望月の歌｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mn-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-content: center; gap: 60px; align-items: center; }

  .mn-fig { height: 620px; border-radius: 30px; }

  .mn-lead .blank { font-size: 40px; min-width: 210px; }
  .quote { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 38px;
           box-shadow: 0 16px 36px rgba(40,30,10,.10); }
  .quote .qlab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); letter-spacing:.1em; display:block; margin-bottom:12px; }
  .quote .qtx { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:33px; line-height:1.5; color:var(--sumi); }

</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe mn-safe">
    <div class="mn-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 都と政治　授業ノート1</span>
        <h1 class="headline" style="font-size:54px;margin-top:14px;">藤原氏の<span class="em">全盛期</span></h1>
      </div>
      <p class="mn-lead" data-at="1" data-anim="fade">摂関政治の全盛期は<span class="blank" data-fill="1"><span class="bnum">①</span><b>11</b></span>世紀前半、<span class="blank" data-fill="2"><span class="bnum">②</span><b>藤原道長</b></span>と、その子の<span class="blank" data-fill="3"><span class="bnum">③</span><b>藤原頼通</b></span>の時代だった。</p>
      <div class="quote" data-at="4" data-anim="fade">
        <span class="qlab">②の人物がよんだ歌</span>
        <div class="qtx">この世をば わが世とぞ思ふ <b>望月</b>の 欠けたることも なしと思へば</div>
        <div class="qds">「満月のように、何も欠けたところがない」＝自分の思いどおりの世だ、という道長の絶頂ぶりを表す歌。</div>
      </div>
    </div>
    <div class="figure mn-fig" data-at="0" data-anim="right"><img src="assets/fujiwara_moon.webp" alt="望月と盃"></div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
