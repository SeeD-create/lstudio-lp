<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 96px 150px 96px; align-content: center; gap: 34px; }
  .sk-head { display: grid; gap: 14px; }
  .sk-lead { font-size: 36px; line-height:1.6; color:var(--sumi-soft); font-weight:700; }
  .sk-lead .blank { font-size: 40px; min-width: 200px; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .pcard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
           box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 32px 36px; display:grid; gap:14px; text-align:center; }
  .pcard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .pcard .cond { font-size:30px; color:var(--sumi-soft); font-weight:700; }
  .pcard .role { font-family:'Zen Old Mincho',serif; font-weight:900; }
  .pcard .role .blank { font-size: 56px; min-width: 240px; }
  .sk-bar { display:flex; align-items:center; gap:26px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .sk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--imp); white-space:nowrap; }
  .sk-bar .bb { font-size:28px; line-height:1.45; color: var(--sumi); }
  .sk-bar .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 都と政治　授業ノート1</span>
      <h1 class="headline" style="font-size:56px;">貴族の<span class="em">ある一族</span>が政治の実権をにぎる</h1>
    </div>
    <p class="sk-lead" data-at="1" data-anim="fade">9世紀の中ごろから<span class="blank" data-fill="1"><span class="bnum">①</span><b>藤原氏</b></span>が力をつけ、天皇に代わって政治を動かすようになった。</p>
    <div class="two">
      <div class="pcard" data-at="2" data-anim="pop">
        <div class="cond">天皇が幼い（小さい）とき</div>
        <div class="role"><span class="blank" data-fill="2"><span class="bnum">②</span><b>摂政</b></span></div>
      </div>
      <div class="pcard" data-at="3" data-anim="pop">
        <div class="cond">天皇が成人したあと</div>
        <div class="role"><span class="blank" data-fill="3"><span class="bnum">③</span><b>関白</b></span></div>
      </div>
    </div>
    <div class="sk-bar" data-at="4" data-anim="fade">
      <span class="bt">用語</span>
      <span class="bb">②③の役職について実権をにぎるこの政治を<span class="blank" data-fill="4" style="font-size:32px;"><span class="bnum">④</span><b>摂関政治</b></span>という。<b>幼いとき／成人後</b>で役職名が変わる点をセットで区別する。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
