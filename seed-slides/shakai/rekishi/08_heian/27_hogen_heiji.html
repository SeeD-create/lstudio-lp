<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>保元の乱・平治の乱 ── 源氏と平氏の争い｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hh-safe { inset: 92px 150px 92px; align-content: center; gap: 30px; }
  .hh-head { display: grid; gap: 12px; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .ecard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
           box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 28px 34px 32px; display:grid; gap:14px; }
  .ecard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .ecard .top { display:flex; align-items:center; gap:20px; }
  .ecard .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--imp); line-height:1; }
  .ecard .nm { font-family:'Zen Old Mincho',serif; font-weight:900; }
  .ecard .nm .blank { font-size: 44px; min-width: 250px; }
  .ecard .ds { font-size: 27px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .ecard .ds .blank { font-size: 30px; min-width: 200px; }
  .ecard .ds b { color: var(--sumi); }
  .hh-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .hh-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .hh-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hh-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe hh-safe">
    <div class="hh-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 武士のおこり　授業ノート3</span>
      <h1 class="headline" style="font-size:54px;">貴族の争いに、<span class="em">源氏と平氏</span>が加わる</h1>
    </div>
    <div class="two">
      <div class="ecard" data-at="1" data-anim="pop">
        <div class="top"><span class="yr">1156</span><span class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>保元の乱</b></span></span></div>
        <div class="ds"><b>上皇と天皇</b>のあとつぎ争い。ここに源氏と平氏の武士団が加わって戦った。</div>
      </div>
      <div class="ecard" data-at="2" data-anim="pop">
        <div class="top"><span class="yr">1159</span><span class="nm"><span class="blank" data-fill="3"><span class="bnum">②</span><b>平治の乱</b></span></span></div>
        <div class="ds"><span class="blank" data-fill="4"><span class="bnum">③</span><b>平清盛</b></span>と<span class="blank" data-fill="4"><span class="bnum">④</span><b>源義朝</b></span>の戦い。</div>
      </div>
    </div>
    <div class="hh-bar" data-at="5" data-anim="fade">
      <span class="bt">★ 勝ったのは</span>
      <span class="bb">1159年の乱に勝ったのは<b>③の人物</b>。ここから、武士が政治の主役になっていく。<b>1156→1159</b>の順番を混同しない。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
