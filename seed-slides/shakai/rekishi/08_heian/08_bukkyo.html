<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>新しい仏教 ── 最澄の天台宗・空海の真言宗｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bk-safe { inset: 90px 150px 90px; grid-template-columns: 560px 1fr; align-content: center; gap: 56px; align-items: center; }
  .bk-fig { height: 620px; border-radius: 30px; }
  .bk-right { display: grid; gap: 30px; }
  .bk-head { display: grid; gap: 12px; }
  .tbl { display: grid; grid-template-columns: 150px 1fr 1fr 1fr; border: 3px solid var(--sumi); border-radius: 18px; overflow: hidden;
         box-shadow: 0 16px 36px rgba(40,30,10,.14); background: var(--paper-hi); }
  .tbl > div { padding: 16px 14px; border-bottom: 2px solid var(--hair); display: flex; align-items: center; justify-content:center; text-align:center; }
  .tbl .th { background: var(--sumi); color: var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 27px; border-bottom: none; }
  .tbl .rh { background: var(--paper-lo); font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 30px; color: var(--sumi); }
  .tbl .cell { font-size: 27px; font-weight: 700; color: var(--sumi); border-left: 2px solid var(--hair); }
  .tbl .cell .blank { font-size: 28px; min-width: 150px; margin: 0; }
  .tbl .rlast > div, .tbl .rlast { border-bottom: none; }
  .bk-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 30px; }
  .bk-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .bk-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .bk-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe bk-safe">
    <div class="figure bk-fig" data-at="0" data-anim="left"><img src="assets/buddhism_mountain.webp" alt="山の寺と僧"></div>
    <div class="bk-right">
      <div class="bk-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 都と政治　授業ノート1</span>
        <h1 class="headline" style="font-size:50px;">唐から帰った2人が<span class="em">新しい仏教</span>を</h1>
      </div>
      <div class="tbl" data-at="0" data-anim="fade">
        <div class="th"></div><div class="th">僧</div><div class="th">開いた宗派</div><div class="th">建てた寺・山</div>
        <div class="rh">1</div>
        <div class="cell"><span class="blank" data-fill="1"><span class="bnum">①</span><b>最澄</b></span></div>
        <div class="cell"><span class="blank" data-fill="2"><span class="bnum">②</span><b>天台宗</b></span></div>
        <div class="cell"><span class="blank" data-fill="3"><span class="bnum">③</span><b>延暦寺</b></span>／比叡山</div>
        <div class="rh rlast">2</div>
        <div class="cell rlast"><span class="blank" data-fill="4"><span class="bnum">④</span><b>空海</b></span></div>
        <div class="cell rlast"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>真言宗</b></span></div>
        <div class="cell rlast"><span class="blank" data-fill="6"><span class="bnum">⑥</span><b>金剛峰寺</b></span>／高野山</div>
      </div>
      <div class="bk-note" data-at="6" data-anim="fade">
        <span class="bt">混同注意</span>
        <span class="bb">1行目は<b>比叡山</b>のセット、2行目は<b>高野山</b>のセット。「さいちょう・てんだい・えんりゃく」のように、僧・宗派・寺を3つひとかたまりで覚える。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
