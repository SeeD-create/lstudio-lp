<head>

<title>平安時代カタログ ── 集める3枚｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 34px 32px 38px; min-height: 460px; display: grid; align-content: start; gap: 18px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--cat); opacity:.35; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); line-height:1.15; margin-top:6px; }
  .cc__ess { font-size:28px; color:var(--sumi-soft); line-height:1.5; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:8px 20px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:23px; }
  .anchor { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:28px 40px; }
  .anchor .k-ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--gold-soft); white-space:nowrap; }
  .anchor .k-body { font-size:29px; line-height:1.5; color:rgba(251,251,250,.92); }
  .anchor .k-body b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　平安時代カタログ</span>
      <h1 class="headline" style="font-size:66px;">この単元で集めるのは<span class="goldem">3枚</span></h1>
    </div>
    <div class="deck-row">
      <div class="cc" data-cat="eq"  data-at="1" data-anim="pop"><div class="cc__no">Ⅰ</div><div class="cc__ttl">都と政治の<br>うつりかわり</div><div class="cc__ess">遷都・摂関政治・院政・荘園制。だれが政治を動かしたか。</div><span class="cc__pill">794／1086</span></div>
      <div class="cc" data-cat="lib" data-at="2" data-anim="pop"><div class="cc__no">Ⅱ</div><div class="cc__ttl">国風文化</div><div class="cc__ess">遣唐使をやめ、日本独自の文化へ。かな文字と貴族の文学。</div><span class="cc__pill">894／かな文字</span></div>
      <div class="cc" data-cat="soc" data-at="3" data-anim="pop"><div class="cc__no">Ⅲ</div><div class="cc__ttl">武士のおこり</div><div class="cc__ess">反乱をしずめて力をつけ、ついに平清盛が政権をにぎる。</div><span class="cc__pill">保元・平治／日宋貿易</span></div>
    </div>
    <div class="anchor" data-at="4" data-anim="fade">
      <span class="k-ttl">背骨は年号</span>
      <span class="k-body">この単元は<b>年号で流れをつかむ</b>のが最短ルート。<b>794（遷都）・894（遣唐使停止）・1086（院政）・1167（平清盛）</b>。この4つを軸に、事件をぶら下げていこう。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
