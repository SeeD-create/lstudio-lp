<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}

  .ans { margin-top: 38px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:96px; line-height:1; color: var(--sumi); }

<div class="seed-stage"><div class="seed-slide" data-cat="soc">

    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. ○か×か</div>

      <div class="ans" data-at="1">

        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>関東で乱を起こしたのは<span class="hl">平将門</span>（935年）。<br><span class="hl">藤原純友</span>は瀬戸内地方（939年）。<span class="hl">関東＝将門／瀬戸内＝純友</span>で場所とセットに。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
