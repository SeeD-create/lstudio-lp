<title>荘園制 ── 公地公民から荘園制へ／荘園の4つの立場｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sh-safe { inset: 78px 150px 78px; align-content: center; gap: 24px; }
  .sh-head { display: grid; gap: 10px; }
  .sh-top { display:flex; align-items:center; gap: 22px; flex-wrap:wrap; font-size:30px; font-weight:700; color:var(--sumi-soft); }
  .sh-top .arrow { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--cat); }
  .sh-top .blank { font-size:32px; min-width:200px; }
  .sh-top .権 { background:var(--imp-bg); color:var(--imp); font-weight:900; font-size:26px; padding:6px 16px; border-radius:10px; }
  .tiers { display:grid; gap:12px; }
  .tier { display:grid; grid-template-columns: 300px 1fr; align-items:center; gap:22px;
          background: var(--paper-hi); border-left: 12px solid var(--cat); border-radius: 0 16px 16px 0;
          padding: 16px 30px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .tier .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .tier .nm .blank { font-size: 36px; min-width: 220px; }
  .tier .ds { font-size: 28px; line-height:1.4; color:var(--sumi-soft); font-weight:600; }
  .tier .ds b { color: var(--imp); }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sh-safe">
    <div class="sh-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 都と政治　授業ノート1</span>
      <h1 class="headline" style="font-size:52px;">土地のしくみが<span class="em">大きく変わる</span></h1>
    </div>
    <div class="sh-top" data-at="1" data-anim="fade">
      土地制度は<span class="blank" data-fill="1"><span class="bnum">①</span><b>公地公民</b></span>制から
      <span class="arrow">→</span>
      <span class="blank" data-fill="2"><span class="bnum">②</span><b>荘園制</b></span>へ。
      荘園（貴族・寺社の私有地）は<span class="権">不輸の権</span>（税をかけさせない）・<span class="権">不入の権</span>（国司を入らせない）を得た。
    </div>
    <div class="tiers">
      <div class="tier" data-at="3" data-anim="left"><div class="nm"><span class="blank" data-fill="3"><span class="bnum">③</span><b>荘園領主</b></span></div><div class="ds">貴族や寺社。荘園を所有し、年貢を受け取る一番上。</div></div>
      <div class="tier" data-at="4" data-anim="left"><div class="nm"><span class="blank" data-fill="4"><span class="bnum">④</span><b>荘官</b></span></div><div class="ds">荘園を<b>管理</b>し、現地で<b>年貢を取り立てる</b>役人。</div></div>
      <div class="tier" data-at="5" data-anim="left"><div class="nm"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>名主</b></span></div><div class="ds">年貢を納める責任をもつ<b>有力な農民</b>。</div></div>
      <div class="tier" data-at="6" data-anim="left"><div class="nm"><span class="blank" data-fill="6"><span class="bnum">⑥</span><b>作人</b></span>・下人</div><div class="ds">⑤のもとで実際に土地を耕作する農民。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
