<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>東北の戦乱 ── 前九年の役・後三年の役と源義家｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .th-safe { inset: 96px 150px 96px; align-content: center; gap: 34px; }
  .th-head { display: grid; gap: 14px; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .ycard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
           box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 30px 34px 34px; display:grid; gap:12px; text-align:center; }
  .ycard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .ycard .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:60px; color:var(--imp); line-height:1; }
  .ycard .nm { font-family:'Zen Old Mincho',serif; font-weight:900; }
  .ycard .nm .blank { font-size: 46px; min-width: 300px; }
  .ycard .ds { font-size: 25px; color:var(--sumi-soft); font-weight:600; }
  .th-bar { display:flex; align-items:center; gap:26px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .th-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--imp); white-space:nowrap; }
  .th-bar .bb { font-size:28px; line-height:1.45; color: var(--sumi); }
  .th-bar .bb b { color: var(--imp); }
  .th-bar .bb .blank { font-size:30px; min-width:220px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe th-safe">
    <div class="th-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 武士のおこり　授業ノート3</span>
      <h1 class="headline" style="font-size:56px;">東北地方でおきた、2つの<span class="em">戦乱</span></h1>
    </div>
    <div class="two">
      <div class="ycard" data-at="1" data-anim="pop">
        <div class="yr">1051</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>前九年の役</b></span></div>
        <div class="ds">東北地方でおきた戦乱</div>
      </div>
      <div class="ycard" data-at="2" data-anim="pop">
        <div class="yr">1083</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>後三年の役</b></span></div>
        <div class="ds">東北地方でおきた戦乱</div>
      </div>
    </div>
    <div class="th-bar" data-at="3" data-anim="fade">
      <span class="bt">共通点</span>
      <span class="bb">どちらも<span class="blank" data-fill="4"><span class="bnum">③</span><b>源義家</b></span>（みなもとのよしいえ）がしずめた。これで<b>源氏</b>が東国（関東・東北）で信頼を集めていく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
