<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>武士の反乱 ── 平将門の乱・藤原純友の乱｜中1歴史 第8章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hn-safe { inset: 92px 150px 92px; grid-template-columns: 540px 1fr; align-content: center; gap: 56px; align-items: center; }
  .hn-fig { height: 620px; border-radius: 30px; }
  .hn-right { display: grid; gap: 26px; }
  .hn-head { display: grid; gap: 12px; margin-bottom: 2px; }
  .ecard { position:relative; background: var(--paper-hi); border-left: 12px solid var(--cat); border-radius: 0 18px 18px 0;
           padding: 22px 30px; box-shadow: 0 10px 26px rgba(40,30,10,.08); display:grid; grid-template-columns: 130px 1fr; align-items:center; gap:24px; }
  .ecard .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:50px; color:var(--cat); line-height:1; text-align:center; }
  .ecard .bd .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .ecard .bd .nm .blank { font-size: 36px; min-width: 220px; }
  .ecard .bd .ds { font-size: 26px; line-height:1.4; color:var(--sumi-soft); font-weight:600; margin-top:6px; }
  .ecard .bd .ds b { color: var(--imp); }
  .hn-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 30px; }
  .hn-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hn-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hn-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe hn-safe">
    <div class="figure hn-fig" data-at="0" data-anim="left"><img src="assets/samurai_rise.webp" alt="武士のおこり"></div>
    <div class="hn-right">
      <div class="hn-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅲ 武士のおこり　授業ノート3</span>
        <h1 class="headline" style="font-size:48px;">地方でおきた、2つの<span class="em">反乱</span></h1>
      </div>
      <div class="ecard" data-at="1" data-anim="left">
        <div class="yr">935</div>
        <div class="bd">
          <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>平将門</b></span>の乱</div>
          <div class="ds"><b>関東地方</b>でおきた反乱。</div>
        </div>
      </div>
      <div class="ecard" data-at="3" data-anim="left">
        <div class="yr">939</div>
        <div class="bd">
          <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>藤原純友</b></span>の乱</div>
          <div class="ds"><b>瀬戸内地方</b>（瀬戸内海）でおきた反乱。</div>
        </div>
      </div>
      <div class="hn-note" data-at="4" data-anim="fade">
        <span class="bt">ここが大事</span>
        <span class="bb">朝廷はこれらの反乱を、<b>地方の武士の力を借りて</b>しずめた。これで<b>武士の力が認められて</b>いく。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第8章 平安時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
