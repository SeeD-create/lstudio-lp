<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>漁業 ── 紀伊のくじら漁・蝦夷のにしん／こんぶ漁｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gy-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .gy-head { display: grid; gap: 12px; }
  .gy-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .fcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 34px 40px;
           box-shadow: 0 16px 36px rgba(40,30,10,.10); display: grid; gap: 14px; position:relative; }
  .fcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .fcard .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); }
  .fcard .lb small { font-size:24px; color:var(--sumi-mute); margin-left:12px; }
  .fcard .tx { font-size: 34px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .fcard .tx .blank { font-size: 36px; min-width: 200px; }
  .fcard .tx b { color: var(--imp); }
  .gy-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .gy-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .gy-bar .bb { font-size:27px; line-height:1.5; color:rgba(251,251,250,.92); }
  .gy-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe gy-safe">
    <div class="gy-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　漁業</span>
      <h1 class="headline" style="font-size:58px;">海の恵みも、<span class="em">地方ごと</span>に盛んに</h1>
    </div>
    <div class="gy-row">
      <div class="fcard" data-at="1" data-anim="left">
        <div class="lb">紀伊・土佐<small>和歌山・高知</small></div>
        <div class="tx"><span class="blank" data-fill="2"><span class="bnum">①</span><b>くじら</b></span>漁が盛んになった。</div>
      </div>
      <div class="fcard" data-at="3" data-anim="right">
        <div class="lb">蝦夷地<small>えぞち／北海道</small></div>
        <div class="tx"><span class="blank" data-fill="4"><span class="bnum">②</span><b>にしん・こんぶ</b></span>漁が盛んになった。</div>
      </div>
    </div>
    <div class="gy-bar" data-at="4" data-anim="fade">
      <span class="bt">地方の特産</span>
      <span class="bb">和歌山・高知でとれたもの、北海道でとれたものを言えるように。<b>地方と産物をセット</b>で。とれた産物も航路で全国へ運ばれた。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
