<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>五街道 ── 江戸を中心に整備し、要所に関所｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gk-safe { inset: 96px 150px 96px; align-content: center; gap: 34px; }
  .gk-head { display: grid; gap: 12px; }
  .gk-def { font-size: 40px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .gk-def .blank { font-size: 42px; min-width: 240px; }
  .gk-def .em { color: var(--imp); font-weight: 900; }
  .roads { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .rd { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 18px; padding: 22px 18px; text-align: center;
        box-shadow: 0 12px 26px rgba(40,30,10,.10); }
  .rd .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .rd .ds { font-size: 21px; color: var(--sumi-mute); margin-top: 8px; line-height:1.3; }
  .gk-bar { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 33px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .gk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--imp); white-space:nowrap; }
  .gk-bar .bb { font-size:28px; line-height:1.5; color: var(--sumi); }
  .gk-bar .bb .blank { font-size:30px; min-width:150px; }
  .gk-bar .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe gk-safe">
    <div class="gk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　陸の交通</span>
      <h1 class="headline" style="font-size:58px;">陸の道は、<span class="em">江戸から</span>のびていく</h1>
    </div>
    <p class="gk-def" data-at="1">江戸を中心に整備された5つの主要な道を、<span class="blank" data-fill="2"><span class="bnum">①</span><b>五街道</b></span>という。</p>
    <div class="roads" data-at="3" data-anim="pop">
      <div class="rd"><div class="nm">東海道</div><div class="ds">江戸〜京都<br>（太平洋側）</div></div>
      <div class="rd"><div class="nm">中山道</div><div class="ds">江戸〜京都<br>（内陸）</div></div>
      <div class="rd"><div class="nm">甲州街道</div><div class="ds">江戸〜甲府</div></div>
      <div class="rd"><div class="nm">日光街道</div><div class="ds">江戸〜日光</div></div>
      <div class="rd"><div class="nm">奥州街道</div><div class="ds">江戸〜東北</div></div>
    </div>
    <div class="gk-bar" data-at="4" data-anim="fade">
      <span class="bt">要所には</span>
      <span class="bb">街道の要所には<span class="blank" data-fill="4"><span class="bnum">②</span><b>関所</b></span>を設け、<b>江戸へ出入りする人や荷物を調べた</b>（「入り鉄砲に出女」を取りしまる）。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
