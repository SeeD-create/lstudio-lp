<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>肥料と商品作物 ── 干鰯・綿・茶・菜種｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hs-safe { inset: 96px 150px 96px; align-content: center; gap: 36px; }
  .hs-head { display: grid; gap: 12px; }
  .hs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: stretch; }
  .hcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 32px 38px;
           box-shadow: 0 16px 36px rgba(40,30,10,.10); display: grid; gap: 14px; }
  .hcard .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--cat); }
  .hcard .tx { font-size: 34px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .hcard .tx .blank { font-size: 38px; min-width: 260px; }
  .hcard .tx .em { color: var(--imp); font-weight: 900; }
  .hcard .sub { font-size: 26px; color: var(--sumi-soft); line-height: 1.4; }
  .hs-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 38px; }
  .hs-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .hs-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.92); }
  .hs-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hs-safe">
    <div class="hs-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　肥料と売る作物</span>
      <h1 class="headline" style="font-size:60px;">米だけでなく、<span class="em">売るための作物</span>も作る</h1>
    </div>
    <div class="hs-row">
      <div class="hcard" data-at="1" data-anim="left">
        <div class="lb">肥料の進歩</div>
        <div class="tx">いわしを干して肥料にした<br><span class="blank" data-fill="2"><span class="bnum">①</span><b>干鰯</b></span>を使うようになった。</div>
        <div class="sub">「ほしか」と読む。買って使う肥料＝<b>金肥（きんぴ）</b>の代表。</div>
      </div>
      <div class="hcard" data-at="3" data-anim="right">
        <div class="lb">売るための作物</div>
        <div class="tx">綿・茶・菜種などの<br><span class="blank" data-fill="4"><span class="bnum">②</span><b>商品作物</b></span>の栽培が盛んに。</div>
        <div class="sub">自分で食べるためでなく、<b>売ってお金にする</b>ために作る作物。</div>
      </div>
    </div>
    <div class="hs-bar" data-at="5" data-anim="fade">
      <span class="bt">つながりで覚える</span>
      <span class="bb">田を増やす → 農具で作業が進む → <b>いわしの肥料</b>でよく実る → 余裕ができて<b>売るための作物</b>を作る。この一本の流れで農業が発達した。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
