      <div class="mp-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　交通の全体像</span>
        <h1 class="headline" style="font-size:46px;">陸は<span class="em">江戸から</span>、海は<span class="em">全国から</span></h1>
      </div>
      <div class="lgrow" style="--c:#1A1A1A" data-at="1" data-anim="left">
        <span class="num2">①</span><i class="sw"></i>
        <span class="lt"><span class="blank" data-fill="1"><b>五街道</b></span>
          <small>江戸を中心に5本。要所の◆に関所を置いた</small></span>
      </div>
      <div class="lgrow" style="--c:#2C6489" data-at="2" data-anim="left">
        <span class="num2">②</span><i class="sw dash"></i>
        <span class="lt"><span class="blank" data-fill="2"><b>東廻り航路</b></span>
          <small>東北の日本海側 → 津軽海峡 → 太平洋 → 江戸</small></span>
      </div>
      <div class="lgrow" style="--c:#3F7A3F" data-at="3" data-anim="left">
        <span class="num2">③</span><i class="sw dash"></i>
        <span class="lt"><span class="blank" data-fill="3"><b>西廻り航路</b></span>
          <small>東北の日本海側 → 下関 → 瀬戸内海 → 大阪</small></span>
      </div>
      <div class="lgrow" style="--c:#C4161C" data-at="4" data-anim="left">
        <span class="num2">④</span><i class="sw dash"></i>
        <span class="lt">江戸上方間の航路
          <small>菱垣廻船・樽廻船が定期的に往復した</small></span>
      </div>
      <div class="mp-note" data-at="4" data-anim="fade">
        <span class="k">読み方</span>
        <span>実線＝<b>陸の道</b>、破線＝<b>海の道</b>。米や産物は海で<b>大阪</b>へ、人と情報は陸で<b>江戸</b>へ集まった。</span>
