<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>鉱業 ── 佐渡の金山・石見の銀山・足尾の銅山｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kg-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .kg-head { display: grid; gap: 12px; }
  .kg-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .mcard { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
           padding: 34px 34px; box-shadow: 0 16px 34px rgba(40,30,10,.12); display: grid; gap: 12px; text-align:center; }
  .mcard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:21px 21px 0 0; }
  .mcard .metal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi); }
  .mcard .mine { font-size: 40px; font-weight: 700; color: var(--sumi); }
  .mcard .mine .blank { font-size: 42px; min-width: 200px; }
  .mcard .place { font-size: 26px; color: var(--sumi-mute); }
  .kg-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .kg-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .kg-bar .bb { font-size:27px; line-height:1.5; color:rgba(251,251,250,.92); }
  .kg-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe kg-safe">
    <div class="kg-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　鉱業</span>
      <h1 class="headline" style="font-size:58px;">幕府は<span class="em">鉱山の開発</span>にも力を入れた</h1>
    </div>
    <div class="kg-row">
      <div class="mcard" data-at="1" data-anim="pop">
        <div class="metal">金</div>
        <div class="mine"><span class="blank" data-fill="2"><span class="bnum">①</span><b>佐渡</b></span>金山</div>
        <div class="place">新潟県</div>
      </div>
      <div class="mcard" data-at="3" data-anim="pop">
        <div class="metal">銀</div>
        <div class="mine"><span class="blank" data-fill="4"><span class="bnum">②</span><b>石見</b></span>銀山</div>
        <div class="place">島根県（生野銀山は兵庫県）</div>
      </div>
      <div class="mcard" data-at="4" data-anim="pop">
        <div class="metal">銅</div>
        <div class="mine">足尾銅山</div>
        <div class="place">栃木県</div>
      </div>
    </div>
    <div class="kg-bar" data-at="4" data-anim="fade">
      <span class="bt">★ 場所とセット</span>
      <span class="bb">金は新潟、銀は島根と兵庫（生野）、銅は栃木（足尾）。地図で「何県の何鉱山」を問われる。<b>県名と鉱山名をセット</b>で覚える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
