<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 38px;

  .def .em { color: var(--imp); font-weight: 900; }

  .en-flow b { color: var(--imp); }
  .en-flow .ar { color: var(--sumi-mute); font-weight:900; }
  .en-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .en-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .en-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }

</style>

<div class="seed-stage"><div class="seed-slide" data-cat="soc">
