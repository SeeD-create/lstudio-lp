<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 28px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:37px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 42px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .ans { margin-top: 34px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 33px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 都市・交通・鉱業</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 4つに答えよう</div>
      <p class="qtext" data-at="0">① 全国の米が集まった大阪の呼び名は？　② 大名が大阪に建てた倉庫は？<br>③ 江戸を中心に整備された5つの道は？　④ 佐渡（新潟）にある鉱山は何金山？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">天下の台所</span>（江戸＝将軍のおひざもと）</b></span></span></div>
        <div class="row" data-at="1"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">蔵屋敷</span>　── 金銀を扱う大商人は両替商。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">五街道</span>　── 要所には関所を置いた。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">佐渡金山</span>　── 石見（島根）は銀山。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
