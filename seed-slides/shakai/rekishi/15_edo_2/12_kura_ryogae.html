<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kr-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 540px; align-content: center; gap: 56px; align-items: center; }
  .kr-txt { display: grid; gap: 24px; }
  .kr-fig { height: 560px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:240px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:28px; color:var(--sumi-mute); letter-spacing:.12em; z-index:1; }
  .rcard2 { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 28px 34px;
            box-shadow: 0 14px 32px rgba(40,30,10,.10); display: grid; gap: 10px; position:relative; }
  .rcard2::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:20px 0 0 20px; }
  .rcard2 .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .rcard2 .tx { font-size: 32px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .rcard2 .tx .blank { font-size: 34px; min-width: 240px; }
  .rcard2 .tx b { color: var(--imp); }
  .kr-bar { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; }
  .kr-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .kr-bar .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .kr-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe kr-safe">
    <div class="kr-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート1　商業のしくみ</span>
        <h1 class="headline" style="font-size:50px;margin-top:16px;">米とお金が、大阪に<span class="em">集まる</span></h1>
      </div>
      <div class="rcard2" data-at="1" data-anim="left">
        <div class="lb">米を売るための倉庫</div>
        <div class="tx">各地の大名が大阪に置いた、年貢米などを保管し売りさばくための倉庫を<span class="blank" data-fill="2"><span class="bnum">①</span><b>蔵屋敷</b></span>という。全国の米が集まる大阪は<b>天下の台所</b>とよばれた。</div>
      </div>
      <div class="rcard2" data-at="3" data-anim="left">
        <div class="lb">金銀を扱う大商人</div>
        <div class="tx">お金が流通するようになり、金と銀の両替などを行う<span class="blank" data-fill="4"><span class="bnum">②</span><b>両替商</b></span>という大商人が現れた。</div>
      </div>
      <div class="kr-bar" data-at="5" data-anim="fade">
        <span class="bt">★ 頻出</span>
        <span class="bb">「大名以上の財力を持った大商人」と「大名が米を売るために大阪に建てた倉庫」の2語がセットで問われる。どちらも漢字で書けるように。</span>
      </div>
    </div>

  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
