<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>三都 ── 江戸・大阪・京都｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .st-safe { inset: 90px 140px 90px; align-content: center; gap: 34px; }
  .st-head { display: grid; gap: 12px; }
  .st-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .tcard { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
           padding: 30px 30px 34px; box-shadow: 0 16px 34px rgba(40,30,10,.12); display: grid; gap: 14px; align-content: start; min-height: 460px; }
  .tcard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:21px 21px 0 0; }
  .tcard .cty { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi); }
  .tcard .nick { font-size: 28px; font-weight:900; color: var(--imp); }
  .tcard .tx { font-size: 26px; line-height: 1.5; color: var(--sumi-soft); }
  .tcard .tx .blank { font-size: 28px; min-width: 170px; margin: 2px 4px; }
  .tcard .tx b { color: var(--imp); }
  .st-defs { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .db { display:flex; align-items:center; gap:20px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:17px 27px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .db .k { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--sumi); white-space:nowrap; }
  .db .v { font-size:26px; line-height:1.4; }
  .db .v .blank { font-size:28px; min-width:150px; }
  .db .v b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe st-safe">
    <div class="st-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　3つの大都市</span>
      <h1 class="headline" style="font-size:56px;">3つの大都市が、日本の中心になる</h1>
    </div>
    <div class="st-row">
      <div class="tcard" data-at="1" data-anim="pop">
        <div class="cty"><span class="blank" data-fill="1"><span class="bnum">①</span><b>江戸</b></span></div>
        <div class="nick">将軍のおひざもと</div>
        <div class="tx">人口<b>約100万人</b>の大都市。政治の中心で、日本最大の城下町になった。</div>
      </div>
      <div class="tcard" data-at="2" data-anim="pop">
        <div class="cty"><span class="blank" data-fill="2"><span class="bnum">②</span><b>大阪</b></span></div>
        <div class="nick">天下の台所</div>
        <div class="tx">全国の米や産物が集まる<b>商業の中心</b>。各藩が蔵屋敷を置いた。</div>
      </div>
      <div class="tcard" data-at="3" data-anim="pop">
        <div class="cty"><span class="blank" data-fill="3"><span class="bnum">③</span><b>京都</b></span></div>
        <div class="nick">文化の中心</div>
        <div class="tx">清水焼や<span class="blank" data-fill="3"><span class="bnum">④</span><b>西陣織</b></span>など手工業が盛ん。</div>
      </div>
    </div>
    <div class="st-defs">
      <div class="db" data-at="4" data-anim="left"><span class="k">3都市</span><span class="v">この3つの大都市を合わせて<span class="blank" data-fill="4"><span class="bnum">⑤</span><b>三都</b></span>という。</span></div>
      <div class="db" data-at="5" data-anim="right"><span class="k">2都市</span><span class="v">そのうち西の2都市を合わせて<span class="blank" data-fill="5"><span class="bnum">⑥</span><b>上方</b></span>という。</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
