<title>江戸時代（２）とは ── 産業・交通が発達し、町人文化が花開く｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tw-safe { inset: 100px 150px 100px; align-content: center; gap: 42px; }
  .tw-head { display: grid; gap: 14px; }
  .tw-def { font-size: 44px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .tw-def .em { color: var(--imp); font-weight: 900; }
  .flow { display: grid; grid-template-columns: 1fr 60px 1fr 60px 1fr; align-items: stretch; gap: 0; }
  .fb { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 26px 30px; display: grid; gap: 10px; box-shadow: 0 12px 28px rgba(40,30,10,.10); }
  .fb .ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  .fb .ds { font-size: 26px; color: var(--sumi-soft); line-height: 1.4; }
  .fb .ds b { color: var(--imp); }
  .arrow { display:flex; align-items:center; justify-content:center; font-size:46px; color:var(--sumi-mute); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　江戸時代（２）とは</span>
      <h1 class="headline" style="font-size:64px;">世が安定し、<span class="em">産業・交通・文化</span>がいっせいに伸びた</h1>
    </div>
    <p class="tw-def" data-at="1">戦がやんで平和が続くと、人びとは田畑をひらき、品物を作り、道と船で運んで売った。<br>お金が全国を回りだし、都市とそこに暮らす<span class="em">町人</span>が新しい文化の担い手になった。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">産業の発達</div><div class="ds">新田開発・農具・肥料で<b>農業</b>が伸び、鉱業・漁業も盛んに。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">都市と交通</div><div class="ds">三都が栄え、<b>五街道</b>と<b>航路</b>が全国をつなぐ。</div></div>
      <div class="arrow" data-at="4">→</div>
      <div class="fb" data-at="4" data-anim="pop"><div class="ttl">元禄文化と学問</div><div class="ds">上方の<b>町人文化</b>と、儒学など学問が花開く。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
