<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>農具の改良 ── 備中ぐわ・千歯こき｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ng-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .ng-head { display: grid; gap: 12px; }
  .ng-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .ncard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 34px 40px;
           box-shadow: 0 18px 40px rgba(40,30,10,.12); display: grid; gap: 16px; position: relative; }
  .ncard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:23px 0 0 23px; }
  .ncard .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); letter-spacing:.06em; }
  .ncard .lb small { font-size:24px; color:var(--sumi-mute); letter-spacing:0; margin-left:12px; }
  .ncard .nm { font-size: 44px; font-weight: 700; color: var(--sumi); }
  .ncard .nm .blank { font-size: 46px; min-width: 340px; }
  .ncard .ds { font-size: 27px; color: var(--sumi-soft); line-height:1.45; }
  .ncard .ds b { color: var(--imp); }
  .ng-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 38px; }
  .ng-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .ng-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.92); }
  .ng-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ng-safe">
    <div class="ng-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　農具の改良</span>
      <h1 class="headline" style="font-size:60px;">道具が進めば、農作業が<span class="em">はかどる</span></h1>
    </div>
    <div class="ng-row">
      <div class="ncard" data-at="1" data-anim="left">
        <div class="lb">耕す<small>土を深く掘りおこす</small></div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>備中ぐわ</b></span></div>
        <div class="ds">刃が数本に分かれた鍬。土を<b>深く耕せる</b>ようになった。</div>
      </div>
      <div class="ncard" data-at="3" data-anim="right">
        <div class="lb">脱穀<small>穂からもみを外す</small></div>
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>千歯こき</b></span></div>
        <div class="ds">鉄の歯で稲の穂をしごく道具。<b>素早く脱穀</b>できる。</div>
      </div>
    </div>
    <div class="ng-bar" data-at="4" data-anim="fade">
      <span class="bt">★ 絵で出る</span>
      <span class="bb">練習問題では絵を見て道具名を答える。<b>くしのような鉄の歯なら脱穀の道具</b>／<b>刃が数本に分かれた鍬なら耕す道具</b>、と形で見分ける。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
