<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 学問の発達｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 42px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .ans { margin-top: 34px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 33px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 学問の発達</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 4つに答えよう</div>
      <p class="qtext" data-at="0">① 徳川綱吉が奨励した儒学のうち、この時代広まった学問は？<br>② 和算を確立したのは？　③ 『農業全書』を書いたのは？　④ 『西洋紀聞』を書いたのは？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">朱子学</span>　── 忠義や孝行を重んじる。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">関孝和</span>　③<span class="hl">宮崎安貞</span></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">新井白石</span>　── 『大日本史』の編集は徳川光圀。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
