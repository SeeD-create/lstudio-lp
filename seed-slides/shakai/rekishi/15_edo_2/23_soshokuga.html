<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>装飾画 ── 俵屋宗達のあと尾形光琳が大成する｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ss-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 500px; align-content: center; gap: 56px; align-items: center; }
  .ss-txt { display: grid; gap: 24px; }
  .ss-fig { height: 580px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:220px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:26px; color:var(--sumi-mute); letter-spacing:.08em; z-index:1; text-align:center; }
  .flow2 { display: grid; gap: 16px; }
  .fb { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 24px 32px;
        box-shadow: 0 14px 30px rgba(40,30,10,.10); display:flex; align-items:baseline; gap:20px; }
  .fb .k { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); white-space:nowrap; }
  .fb .v { font-size: 32px; font-weight:700; color: var(--sumi); }
  .fb .v .blank { font-size: 34px; min-width: 220px; }
  .fb .v small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:500; }
  .ss-arrow { text-align:center; font-size:34px; color:var(--sumi-mute); font-weight:900; }
  .ss-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 32px; }
  .ss-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .ss-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .ss-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ss-safe">
    <div class="ss-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート2　絵画②</span>
        <h1 class="headline" style="font-size:52px;margin-top:16px;">はなやかな<span class="em">金屏風の絵</span>を大成する</h1>
      </div>
      <div class="flow2">
        <div class="fb" data-at="1" data-anim="left"><span class="k">はじまり</span><span class="v">俵屋宗達<small>『風神雷神図』をえがく</small></span></div>
        <div class="ss-arrow" data-at="2">▼ その後を受けて</div>
        <div class="fb" data-at="3" data-anim="left"><span class="k">大成</span><span class="v"><span class="blank" data-fill="4"><span class="bnum">①</span><b>尾形光琳</b></span>が<span class="blank" data-fill="4"><span class="bnum">②</span><b>装飾画</b></span>を大成<small>『紅白梅図』などをえがく</small></span></div>
      </div>
      <div class="ss-note" data-at="4" data-anim="fade">
        <span class="bt">★ 順番で出る</span>
        <span class="bb">この絵は<b>俵屋宗達 → その後継者</b>の順で発展した。「大成したのは誰か」と「絵の呼び名」の2つが問われる。</span>
      </div>
    </div>
    <div class="figure ss-fig" data-at="0" data-anim="right"><img src="assets/fujin_raijin.webp" alt="装飾画 金屏風 風神雷神図"></div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
