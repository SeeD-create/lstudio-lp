<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>海の道 ── 東廻り・西廻り・江戸上方間｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kr-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 520px; align-content: center; gap: 54px; align-items: center; }
  .kr-txt { display: grid; gap: 22px; }
  .kr-fig { height: 540px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:230px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:27px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; }
  .cline { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 18px; padding: 22px 30px;
           box-shadow: 0 12px 28px rgba(40,30,10,.10); display:flex; align-items:baseline; gap:18px; }
  .cline .k { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); white-space:nowrap; min-width: 90px; }
  .cline .v { font-size: 30px; line-height: 1.45; color: var(--sumi); font-weight:700; }
  .cline .v .blank { font-size: 32px; min-width: 200px; }
  .cline .v b { color: var(--imp); }
  .cline .v small { display:block; font-size: 23px; color: var(--sumi-mute); font-weight:500; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe kr-safe">
    <div class="kr-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート1　海の交通</span>
        <h1 class="headline" style="font-size:50px;margin-top:16px;">海の道が、全国を<span class="em">ひとつ</span>にする</h1>
      </div>
      <div class="cline" data-at="1" data-anim="left"><span class="k">東廻り</span><span class="v"><span class="blank" data-fill="2"><span class="bnum">①</span><b>東廻り航路</b></span><small>東北の日本海側 → 太平洋 → 江戸</small></span></div>
      <div class="cline" data-at="2" data-anim="left"><span class="k">西廻り</span><span class="v"><span class="blank" data-fill="3"><span class="bnum">②</span><b>西廻り航路</b></span><small>東北の日本海側 → 下関 → 大阪</small></span></div>
      <div class="cline" data-at="4" data-anim="left"><span class="k">江戸上方間</span><span class="v">江戸と上方を結ぶ<b>菱垣廻船・樽廻船</b><small>ひがきかいせん・たるかいせん が定期的に往復した</small></span></div>
    </div>
    <div class="figure kr-fig" data-at="0" data-anim="right"><img src="assets/kaisen.webp" alt="菱垣廻船・樽廻船 大型木造帆船"></div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
