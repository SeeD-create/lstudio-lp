<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>新田開発 ── 100年で田畑が約2倍に｜中1歴史 第15章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sd-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-content: center; gap: 58px; align-items: center; }
  .sd-txt { display: grid; gap: 26px; }
  .sd-fig { height: 560px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:240px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:28px; color:var(--sumi-mute); letter-spacing:.12em; z-index:1; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 38px;
         box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 38px; line-height: 1.8; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 40px; min-width: 300px; }
  .def .em { color: var(--imp); font-weight: 900; }
  .sd-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .sd-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .sd-note .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .sd-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sd-safe">
    <div class="sd-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート1　農業</span>
        <h1 class="headline" style="font-size:56px;margin-top:16px;">荒れ地をひらいて、<span class="em">田を増やす</span></h1>
      </div>
      <div class="def" data-at="1" data-anim="fade">
        ため池や用水などをつくり、荒れ地を開墾することを<br>
        <span class="blank" data-fill="2"><span class="bnum">①</span><b>新田開発</b></span>という。<br>
        これにより、約100年で田畑の面積は約<span class="blank" data-fill="3"><span class="bnum">②</span><b>2</b></span>倍になった。
      </div>
      <div class="sd-note" data-at="4" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb">「荒れ地をひらいて農地を増やしたこと」を4文字で答える。増えた倍率は<b>約2倍</b>（豊臣秀吉のころとの比較で問われる）。</span>
      </div>
    </div>
    <div class="figure sd-fig" data-at="0" data-anim="right"><img src="assets/shinden.webp" alt="新田開発 用水を引き荒れ地を開墾する"></div>
  </div>
  <div class="seed-foot"><span>第15章 江戸時代（２）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
