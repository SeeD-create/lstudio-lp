<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>二つの大震災 ── 阪神・淡路（1995）と東日本（2011）｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ss-safe { inset: 90px 140px 90px; align-content: center; gap: 34px; }
  .ss-head { display:grid; gap:12px; justify-items:center; text-align:center; }
  .ss-row { display:grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .sc { background: var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:40px 44px; display:grid; gap:18px; box-shadow:0 16px 34px rgba(40,30,10,.12); align-content:start; }
  .sc .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--cat); }
  .sc .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); line-height:1.15; }
  .sc .nm .blank { font-size:46px; min-width:280px; }
  .sc .nm b { color:var(--imp); }
  .sc .ds { font-size:26px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .ss-note { display:flex; align-items:center; gap:20px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:15px 31px; font-size:25px; line-height:1.45; justify-self:center; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .ss-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--imp); white-space:nowrap; }
  .ss-note b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ss-safe">
    <div class="ss-head" data-at="0">
      <span class="kicker"><span class="num">CARD Ⅱ</span>　現代日本の災害</span>
      <h1 class="headline" style="font-size:50px;">忘れてはいけない、<span class="em">二つの大震災</span></h1>
    </div>
    <div class="ss-row">
      <div class="sc" data-at="1" data-anim="pop">
        <div class="yr">1995</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>阪神・淡路大震災</b></span></div>
        <div class="ds">近畿地方（兵庫県）を中心に大きな被害。</div>
      </div>
      <div class="sc" data-at="2" data-anim="pop" style="border-color:var(--imp);">
        <div class="yr" style="color:var(--imp);">2011</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>東日本大震災</b></span></div>
        <div class="ds">東北・関東地方を津波がおそい、大きな被害。</div>
      </div>
    </div>
    <div class="ss-note" data-at="3" data-anim="fade"><span class="bt">★ 年号でペア</span><span><span class="blank blank--para" data-fill="3"><b><b>1995＝阪神・淡路（近畿）</b>／<b>2011＝東日本（東北・関東）</b>。年号と地域をセットで覚える。</b></span></span></div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
