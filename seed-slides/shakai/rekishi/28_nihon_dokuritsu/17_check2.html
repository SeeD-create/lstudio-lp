<div class="seed-stage"><div class="seed-slide" data-cat="eq">

    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext" data-at="0">① 1965年、<span class="u">韓国</span>と結び大韓民国を認めた条約は？<br>② 1972年、田中角栄内閣が<span class="u">中国</span>と発表した声明は？　③ 1972年にアメリカから日本に<span class="u">返還</span>されたのはどこ？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">日韓基本条約</span>　── 大韓民国を朝鮮半島唯一の政府と認める。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">日中共同声明</span>　── これで中国と国交正常化（1978に平和友好条約）。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">沖縄</span>　── 佐藤栄作内閣。非核三原則を打ち出した首相。</b></span></span></div>
      </div>
    </div>
  </div>
