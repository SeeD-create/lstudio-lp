<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 独立と国際社会への復帰｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 38px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: grid; gap: 18px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 33px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:30px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av .r { color:#ff8a8f; }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 独立と国連加盟</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext" data-at="0">① 1951年、日本が48か国と結び<span class="u">独立を回復</span>した条約は？<br>② ①と同時に<span class="u">アメリカ</span>と結んだ条約は？　③ 1956年、日本が<span class="u">ソ連と国交回復</span>して加盟できた国際組織は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">サンフランシスコ平和条約</span>　── 1951年、全権は吉田茂。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">日米安全保障条約</span>　── 独立後も米軍が残る。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">国際連合（国連）</span>　── 日ソ共同宣言（1956）が加盟を後押し。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
