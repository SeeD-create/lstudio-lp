<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>サンフランシスコ平和条約 ── 1951、独立回復（吉田茂）｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 84px 140px 84px; grid-template-columns: 1fr 560px; align-content: center; gap: 50px; align-items: center; }
  .cn-txt { display: grid; gap: 20px; }
  .cn-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:140px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:18px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--cat); text-align:center; line-height:1.15; }
  .step .tx { font-size:29px; line-height:1.45; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:31px; min-width:250px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .panel { background: var(--paper-hi); color: var(--sumi); border-radius: 24px; padding:31px 35px; box-shadow: 0 16px 38px rgba(40,30,10,.18); display:grid; gap:18px; border: 3px solid var(--sumi);}
  .panel .pt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color: var(--sumi); letter-spacing:.06em; }
  .panel .pbig { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; line-height:1.14; }
  .panel .pbig b { color:#ff8a8f; }
  .panel .pnote { font-size:24px; line-height:1.5; color: var(--sumi); }
  .panel .pnote b { color: var(--imp); }
  .tagbadge { display:inline-flex; align-items:center; gap:10px; align-self:start; background:var(--gold-soft); color:var(--sumi); font-weight:900; font-size:22px; padding:6px 16px; border-radius:999px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe cn-safe">
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">CARD Ⅰ</span>　独立の回復</span>
        <h1 class="headline" style="font-size:46px;">敗戦から6年、<span class="em">独立</span>を取りもどす</h1>
      </div>
      <div class="step" data-at="1" data-anim="left">
        <span class="yr">1951</span>
        <span class="tx">日本は48か国と<span class="blank" data-fill="1"><span class="bnum">①</span><b>サンフランシスコ平和条約</b></span>を結ぶ。</span>
      </div>
      <div class="step" data-at="2" data-anim="left">
        <span class="yr">首相</span>
        <span class="tx">日本側の代表は<span class="blank" data-fill="2"><span class="bnum">②</span><b>吉田茂</b></span>首相。</span>
      </div>
      <div class="step" data-at="3" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">1952</span>
        <span class="tx">条約が発効し、日本は<span class="blank" data-fill="3"><span class="bnum">③</span><b>独立（主権）</b></span>を回復した。</span>
      </div>
      <div class="step" data-at="4" data-anim="left">
        <span class="yr">課題</span>
        <span class="tx"><span class="blank" data-fill="4"><span class="bnum">④</span><b>ソ連</b></span>や中国とは結ばれず、国交回復は後に持ちこされた。</span>
      </div>
    </div>
    <div class="panel" data-at="1" data-anim="right">
      <span class="tagbadge">★ テスト頻出</span>
      <div class="pt">1951年・48か国と講和</div>
      <div class="pbig"><b>サンフランシスコ<br>平和条約</b></div>
      <div class="pnote on-dark"><span class="blank blank--para" data-fill="1"><b>これで日本は連合国の<b>占領から独立を回復</b>。全権は<b>吉田茂</b>首相。「1951・48か国・吉田茂」をセットで覚える。</b></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
