<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>バブル経済と民営化 ── 国鉄→JR・消費税（1989）｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 84px 140px 84px; grid-template-columns: 1fr 560px; align-content: center; gap: 50px; align-items: center; }
  .cn-txt { display: grid; gap: 18px; }
  .cn-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:160px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:16px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--cat); text-align:center; line-height:1.15; }
  .step .tx { font-size:27px; line-height:1.42; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:29px; min-width:210px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .panel { background: var(--paper-hi); color: var(--sumi); border-radius: 24px; padding:31px 35px; box-shadow: 0 16px 38px rgba(40,30,10,.18); display:grid; gap:18px; border: 3px solid var(--sumi);}
  .panel .pt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color: var(--sumi); letter-spacing:.06em; }
  .panel .pbig { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; line-height:1.14; }
  .panel .pbig b { color:#ff8a8f; }
  .panel .pnote { font-size:24px; line-height:1.5; color: var(--sumi); }
  .panel .pnote b { color: var(--imp); }
  .tagbadge { display:inline-flex; align-items:center; gap:10px; align-self:start; background:var(--gold-soft); color:var(--sumi); font-weight:900; font-size:22px; padding:6px 16px; border-radius:999px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe cn-safe">
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">CARD Ⅱ</span>　バブルと国営事業の見直し</span>
        <h1 class="headline" style="font-size:44px;">好景気の裏で進んだ、<span class="em">公企業の見直し</span>と新しい税</h1>
      </div>
      <div class="step" data-at="1" data-anim="left">
        <span class="yr">1980年代</span>
        <span class="tx">好景気が続き<span class="blank" data-fill="1"><span class="bnum">①</span><b>バブル経済</b></span>とよばれた。</span>
      </div>
      <div class="step" data-at="2" data-anim="left">
        <span class="yr">財政再建</span>
        <span class="tx">赤字を立て直すため、国鉄をJRにするなど公企業の<span class="blank" data-fill="2"><span class="bnum">②</span><b>民営化</b></span>を行った。</span>
      </div>
      <div class="step" data-at="3" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">1989</span>
        <span class="tx">税制改革で<span class="blank" data-fill="3"><span class="bnum">③</span><b>消費税</b></span>（当初3％）が導入された。</span>
      </div>
      <div class="step" data-at="4" data-anim="left">
        <span class="yr">1990年代</span>
        <span class="tx">バブルがはじけ、日本経済は<span class="blank" data-fill="4"><span class="bnum">④</span><b>不景気</b></span>に入っていった。</span>
      </div>
    </div>
    <div class="panel" data-at="1" data-anim="right">
      <span class="tagbadge">★ 年号に注意</span>
      <div class="pt">1989・税制改革</div>
      <div class="pbig"><b>新しい税（3％）<br>の導入</b></div>
      <div class="pnote on-dark"><span class="blank blank--para" data-fill="1"><b>好景気＝<b>バブル経済</b>／立て直しで<b>国鉄→JRの民営化</b>／そして<b>1989年に消費税3％</b>。1990年代に<b>不景気</b>へ。</b></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
