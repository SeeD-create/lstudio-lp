<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>成長の光 ── 東京オリンピック（1964）と経済の急成長｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 84px 130px 84px; grid-template-columns: 1fr 660px; align-content: center; gap: 54px; align-items: center; }
  .cn-txt { display: grid; gap: 20px; }
  .cn-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:18px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); text-align:center; line-height:1.15; }
  .step .tx { font-size:28px; line-height:1.42; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:30px; min-width:230px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .graphbox { background: var(--paper-hi); border: 3px solid var(--sumi); border-radius: 24px; box-shadow: 0 16px 38px rgba(40,30,10,.12); padding: 22px 26px; }
  .graphbox svg { display:block; width:100%; height:auto; }
  .gtitle { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); text-align:center; margin-bottom:6px; }
  .ml { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:800; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe cn-safe">
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">CARD Ⅱ</span>　成長の光</span>
        <h1 class="headline" style="font-size:44px;">豊かさの<span class="em">象徴</span>となった、東京五輪</h1>
      </div>
      <div class="step" data-at="2" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">1964</span>
        <span class="tx">アジア初の<span class="blank" data-fill="2"><span class="bnum">①</span><b>東京オリンピック</b></span>が開かれた。</span>
      </div>
      <div class="step" data-at="3" data-anim="left">
        <span class="yr">同じ年</span>
        <span class="tx">開幕に合わせて<span class="blank" data-fill="3"><span class="bnum">②</span><b>東海道新幹線</b></span>が開通した。</span>
      </div>
    </div>
    <div class="graphbox" data-at="1" data-anim="right">
      <div class="gtitle">日本の経済成長（イメージ）</div>
      <svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg">
        <!-- axes -->
        <line x1="70" y1="40" x2="70" y2="340" stroke="#555" stroke-width="3"/>
        <line x1="70" y1="340" x2="590" y2="340" stroke="#555" stroke-width="3"/>
        <text class="ml" x="40" y="60" fill="#555" font-size="18" text-anchor="middle">高</text>
        <text class="ml" x="40" y="330" fill="#555" font-size="18" text-anchor="middle">低</text>
        <!-- bars -->
        <rect x="110" y="300" width="46" height="40" fill="#7BAF6E"/>
        <rect x="190" y="255" width="46" height="85" fill="#7BAF6E"/>
        <rect x="270" y="200" width="46" height="140" fill="#5C9E7A"/>
        <rect x="350" y="140" width="46" height="200" fill="#4E8FC0"/>
        <rect x="430" y="95" width="46" height="245" fill="#4E8FC0"/>
        <rect x="510" y="60" width="46" height="280" fill="#C4161C"/>
        <!-- trend line -->
        <polyline points="133,300 213,255 293,200 373,140 453,95 533,60" fill="none" stroke="#C4161C" stroke-width="4"/>
        <!-- x labels -->
        <text class="ml" x="133" y="365" fill="#555" font-size="17" text-anchor="middle">1955</text>
        <text class="ml" x="293" y="365" fill="#555" font-size="17" text-anchor="middle">1964</text>
        <text class="ml" x="533" y="365" fill="#9c2f2b" font-size="17" text-anchor="middle">1970</text>
        <!-- annotation -->
        <text class="ml" x="533" y="48" fill="#9c2f2b" font-size="18" text-anchor="middle">世界2位</text>
      </svg>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
