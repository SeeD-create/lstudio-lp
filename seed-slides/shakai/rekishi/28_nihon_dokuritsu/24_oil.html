<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>石油危機 ── 1973、第四次中東戦争と狂乱物価｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 84px 140px 84px; grid-template-columns: 1fr 560px; align-content: center; gap: 50px; align-items: center; }
  .cn-txt { display: grid; gap: 18px; }
  .cn-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:16px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); text-align:center; line-height:1.15; }
  .step .tx { font-size:27px; line-height:1.42; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:29px; min-width:230px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .panel { background: var(--paper-hi); color: var(--sumi); border-radius: 24px; padding:31px 35px; box-shadow: 0 16px 38px rgba(40,30,10,.18); display:grid; gap:18px; border: 3px solid var(--sumi);}
  .panel .pt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color: var(--sumi); letter-spacing:.06em; }
  .panel .pbig { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; line-height:1.14; }
  .panel .pbig b { color:#ff8a8f; }
  .panel .pnote { font-size:24px; line-height:1.5; color: var(--sumi); }
  .panel .pnote b { color: var(--imp); }
  .tagbadge { display:inline-flex; align-items:center; gap:10px; align-self:start; background:var(--gold-soft); color:var(--sumi); font-weight:900; font-size:22px; padding:6px 16px; border-radius:999px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe cn-safe">
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">CARD Ⅱ</span>　成長の終わり</span>
        <h1 class="headline" style="font-size:44px;">中東の戦争が、日本の<span class="em">物価</span>を直撃する</h1>
      </div>
      <div class="step" data-at="1" data-anim="left">
        <span class="yr">1973</span>
        <span class="tx"><span class="blank" data-fill="1"><span class="bnum">①</span><b>第四次中東戦争</b></span>が起こる。</span>
      </div>
      <div class="step" data-at="2" data-anim="left">
        <span class="yr">原油</span>
        <span class="tx"><span class="blank" data-fill="2"><span class="bnum">②</span><b>ＯＰＥＣ</b></span>（石油輸出国機構）が石油価格を大きく値上げした。</span>
      </div>
      <div class="step" data-at="3" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">日本は</span>
        <span class="tx"><span class="blank" data-fill="3"><span class="bnum">③</span><b>石油危機（オイルショック）</b></span>になった。</span>
      </div>
      <div class="step" data-at="4" data-anim="left">
        <span class="yr">影響</span>
        <span class="tx">物価が急上昇する<span class="blank" data-fill="4"><span class="bnum">④</span><b>狂乱物価</b></span>となり、高度経済成長は終わった。</span>
      </div>
    </div>
    <div class="panel" data-at="1" data-anim="right">
      <span class="tagbadge">★ テスト頻出</span>
      <div class="pt">1973・中東の戦争が引き金</div>
      <div class="pbig"><b>石油危機<br>（オイルショック）</b></div>
      <div class="pnote on-dark"><span class="blank blank--para" data-fill="1"><b>日本はエネルギーを石油の輸入にたよっていた。だから中東の戦争→値上げが<b>狂乱物価</b>を生み、<b>高度経済成長が終わった</b>。</b></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
