<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日米安保条約の改定 ── 1960、安保闘争と岸内閣総辞職｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cn-safe { inset: 84px 140px 84px; grid-template-columns: 1fr 560px; align-content: center; gap: 50px; align-items: center; }
  .cn-txt { display: grid; gap: 18px; }
  .cn-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:140px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:16px 26px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); text-align:center; line-height:1.15; }
  .step .tx { font-size:28px; line-height:1.42; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:30px; min-width:230px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .panel { background: var(--paper-hi); color: var(--sumi); border-radius: 24px; padding:31px 35px; box-shadow: 0 16px 38px rgba(40,30,10,.18); display:grid; gap:18px; border: 3px solid var(--sumi);}
  .panel .pt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color: var(--sumi); letter-spacing:.06em; }
  .panel .pbig { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; line-height:1.14; }
  .panel .pbig b { color:#ff8a8f; }
  .panel .pnote { font-size:24px; line-height:1.5; color: var(--sumi); }
  .panel .pnote b { color: var(--imp); }
  .tagbadge { display:inline-flex; align-items:center; gap:10px; align-self:start; background:var(--gold-soft); color:var(--sumi); font-weight:900; font-size:22px; padding:6px 16px; border-radius:999px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe cn-safe">
    <div class="cn-txt">
      <div class="cn-head" data-at="0">
        <span class="kicker"><span class="num">CARD Ⅰ</span>　安保条約の改定</span>
        <h1 class="headline" style="font-size:44px;">条約の<span class="em">改定</span>に、国民が激しく反対する</h1>
      </div>
      <div class="step" data-at="1" data-anim="left">
        <span class="yr">1960</span>
        <span class="tx">日本は<span class="blank" data-fill="1"><span class="bnum">①</span><b>日米安全保障条約</b></span>の改定に調印した。</span>
      </div>
      <div class="step" data-at="2" data-anim="left">
        <span class="yr">首相</span>
        <span class="tx">このときの首相は<span class="blank" data-fill="2"><span class="bnum">②</span><b>岸信介</b></span>。</span>
      </div>
      <div class="step" data-at="3" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">反発</span>
        <span class="tx">戦争に巻き込まれると<span class="blank" data-fill="3"><span class="bnum">③</span><b>激しい反対運動（安保闘争）</b></span>が全国で起こった。</span>
      </div>
      <div class="step" data-at="4" data-anim="left">
        <span class="yr">結果</span>
        <span class="tx">条約は成立したが、岸内閣は<span class="blank" data-fill="4"><span class="bnum">④</span><b>総辞職</b></span>した。</span>
      </div>
    </div>
    <div class="panel" data-at="1" data-anim="right">
      <span class="tagbadge">★ テスト頻出</span>
      <div class="pt">1960・当時の内閣</div>
      <div class="pbig"><b>日米安保条約<br>の改定</b></div>
      <div class="pnote on-dark"><span class="blank blank--para" data-fill="1"><b>「1951の締結」と「1960の改定」を混同しない。改定に反対して起きた<b>安保闘争</b>で、<b>岸内閣は総辞職</b>した。</b></span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
