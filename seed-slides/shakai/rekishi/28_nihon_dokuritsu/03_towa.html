<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　この単元とは</span>
      <h1 class="headline" style="font-size:58px;">敗戦国からの<span class="em">独立回復</span>と、<span class="em">経済大国</span>への歩み</h1>
    </div>
    <p class="tw-def" data-at="1">1951年の<span class="em">サンフランシスコ平和条約</span>で独立を回復した日本は、韓国・中国・ソ連と<span class="em">国交を回復</span>していく。同時に<span class="em">高度経済成長</span>で豊かになる一方、<span class="em">公害</span>という影も生まれた。この単元は、戦後から現代までの日本を年号で追う。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">独立の回復</div><div class="ds"><b>サンフランシスコ平和条約</b>と<b>日米安全保障条約</b>（1951）。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">外交・国交回復</div><div class="ds"><b>ソ連・韓国・中国</b>と国交をひらき、<b>沖縄</b>も日本へ復帰。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">経済成長と現代</div><div class="ds"><b>高度経済成長</b>と<b>公害</b>、そして現代の日本へ。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
