<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 四大公害病｜中2歴史 第29章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:43px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 35px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 30px; display: grid; gap: 14px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 31px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:28px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av .r { color:#ff8a8f; }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 四大公害病</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 地域・原因から病名を答えよう</div>
      <p class="qtext" data-at="0">① 熊本県・<span class="u">有機水銀</span>　② 三重県・<span class="u">大気汚染</span><br>③ 富山県・<span class="u">カドミウム</span>　④ 新潟県・<span class="u">有機水銀</span></p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">水俣病</span>（熊本・水俣）</b></span></span></div>
        <div class="row" data-at="1"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">四日市ぜんそく</span>（三重・四日市）</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">イタイイタイ病</span>（富山）</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">新潟水俣病</span>（新潟）</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第29章 日本の独立</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
