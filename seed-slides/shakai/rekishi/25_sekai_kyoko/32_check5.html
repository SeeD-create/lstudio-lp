<div class="seed-stage"><div class="seed-slide" data-cat="new">

    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の4つに答えよう</div>
      <p class="qtext">① 1937年、盧溝橋事件から始まった戦争は？　② 中国の国民政府と共産党が結んだものは？<br>③ 1938年、人も物も戦争に動員できる法律は？　④ 1940年、政党が解散して結成されたのは？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">日中戦争</span>　── 北京郊外の盧溝橋で衝突。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">抗日民族統一戦線</span>　── 蔣介石と毛沢東が協力。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">国家総動員法</span>　── 議会の承認なしに国民を動員。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">大政翼賛会</span>　── すべての政党が解散させられた。</b></span></span></div>
      </div>
    </div>
