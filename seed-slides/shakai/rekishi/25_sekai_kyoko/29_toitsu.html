<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .st-safe { inset: 84px 150px 84px; align-content: center; gap: 28px; }
  .st-head { display: grid; gap: 10px; }
  .party-row { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 0; align-items: center; }
  .party { position: relative; background: var(--paper-hi); border: 3px solid var(--c); border-radius: 24px; padding: 28px 34px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 12px; }

  .party .pname { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .party .pname .blank { font-size: 46px; min-width: 260px; }
  .party .ruby { font-size:21px; color:var(--sumi-mute); font-weight:600; }
  .plus { display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi-mute); }
  .result { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:23px 37px; justify-content:center; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .result .rt { font-size:34px; font-weight:700; }
  .result .blank { font-size: 48px; min-width: 380px; }
  .result .blank b { color: var(--imp); }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 30px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:24px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
