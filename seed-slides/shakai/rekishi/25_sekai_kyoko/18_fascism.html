<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ファシズムとは ── 軍事力を背景とした独裁政治｜中2歴史 第25章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fc-safe { inset: 96px 160px 96px; align-content: center; gap: 40px; }
  .fc-head { display: grid; gap: 12px; }
  .fc-def { font-size: 46px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .fc-def .blank { font-size: 50px; min-width: 300px; }
  .fc-def .em { color: var(--imp); font-weight:900; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .card { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 30px 36px; display: grid; gap: 12px; box-shadow: 0 14px 30px rgba(40,30,10,.10); }
  .card .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); }
  .card .b { font-size: 28px; line-height: 1.5; color: var(--sumi-soft); font-weight: 700; }
  .card .b b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe fc-safe">
    <div class="fc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 独裁の広がり ── まとめ</span>
      <h1 class="headline" style="font-size:54px;">イタリアとドイツに共通する「かたち」</h1>
    </div>
    <p class="fc-def" data-at="1" data-anim="fade">イタリアやドイツで行われた、
      <span class="em">軍事力を背景とした独裁政治</span>を
      <span class="blank" data-fill="2"><span class="bnum">⑬</span><b>ファシズム</b></span> という。</p>
    <div class="two">
      <div class="card" data-at="3" data-anim="pop">
        <div class="h">イタリア</div>
        <div class="b"><b>ムッソリーニ</b>／ファシスト党<br>エチオピアを侵略</div>
      </div>
      <div class="card" data-at="3" data-anim="pop">
        <div class="h">ドイツ</div>
        <div class="b"><b>ヒトラー</b>／ナチス<br>再軍備・ユダヤ人迫害</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第25章 世界恐慌</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
