<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 84px 150px 84px; grid-template-columns: 1fr 500px; align-content: center; gap: 54px; align-items: center; }
  .sk-txt { display: grid; gap: 20px; }
  .sk-fig { height: 530px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:18px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:200px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:25px; color:var(--sumi-mute); letter-spacing:.08em; z-index:1; text-align:center; }
  .def { font-size: 36px; font-weight: 700; color: var(--sumi); line-height: 1.5; }
  .def .blank { font-size: 40px; min-width: 220px; }
  .def .em { color: var(--imp); font-weight:900; }
  .hit { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 28px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:23px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
