<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ソ連解体とEU ── 1991〜1993・冷戦後の世界へ｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .so-safe { inset: 78px 150px 78px; align-content: center; gap: 22px; }
  .so-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:120px 1fr; gap:22px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:16px; padding:16px 28px; box-shadow:0 10px 22px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); text-align:center; }
  .step .tx { font-size:28px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:30px; min-width:200px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .so-note { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:17px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .so-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color: var(--imp); white-space:nowrap; }
  .so-note .bb { font-size:25px; line-height:1.45; }
  .so-note .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe so-safe">
    <div class="so-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　冷戦後の世界へ</span>
      <h1 class="headline" style="font-size:48px;">東の超大国が消え、<span class="em">新しい世界</span>が動き出す</h1>
    </div>
    <div class="step" data-at="1" data-anim="left">
      <span class="yr">1991</span>
      <span class="tx">イラクがクウェートに侵攻→多国籍軍との<span class="blank" data-fill="1"><span class="bnum">①</span><b>湾岸戦争</b></span>が起こる。</span>
    </div>
    <div class="step" data-at="2" data-anim="left" style="border-color:var(--imp);">
      <span class="yr" style="color:var(--imp);">1991</span>
      <span class="tx"><span class="blank" data-fill="2"><span class="bnum">②</span><b>ソ連</b></span>が<span class="blank" data-fill="2"><span class="bnum">③</span><b>解体</b></span>される→こうして冷戦は終結した。</span>
    </div>
    <div class="step" data-at="3" data-anim="left">
      <span class="yr">1993</span>
      <span class="tx">ECが発展し<span class="blank" data-fill="3"><span class="bnum">④</span><b>EU</b></span>（ヨーロッパ連合）が発足する。</span>
    </div>
    <div class="so-note" data-at="4" data-anim="fade">
      <span class="bt">冷戦の終わり方</span>
      <span class="bb"><span class="blank blank--para" data-fill="4"><b><span class="hl">ベルリンの壁崩壊（1989）→ 冷戦終結宣言（マルタ会談）→ ドイツ統一（1990）→ ソ連解体（1991）</span>。二極のうち片方（ソ連）が消えて、冷戦は完全に終わった。</b></span></span>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
