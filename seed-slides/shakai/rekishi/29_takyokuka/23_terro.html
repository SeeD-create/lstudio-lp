<link rel="stylesheet" href="../../../_shared/deck.css">
<style>

  .tbox .nm .blank { font-size:38px; min-width:250px; }
  .tbox .nm b { color:var(--imp); }
  .tbox .ds { font-size:24px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .tgrow { display:flex; align-items:center; justify-content:center; font-size:54px; color:var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe te-safe">
    <div class="te-head" data-at="0">

      <h1 class="headline" style="font-size:50px;">冷戦が終わっても、世界の<span class="em">争い</span>は続いた</h1>
    </div>

        <div class="ds">テロの報復として、この国を空爆した。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
