<title>ミニ確認 ── 冷戦はどう終わったか｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1500px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:45px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 35px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--gold-soft); border-bottom: 4px solid var(--gold-deep); }
  .ans { margin-top: 30px; display: grid; gap: 15px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 31px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av .r { color:#ff8a8f; }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 冷戦はどう終わったか</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の4つに答えよう</div>
      <p class="qtext" data-at="0">① 1986年、ソ連でゴルバチョフが始めた社会主義の改革は？　② 1989年、こわされた冷戦の象徴は？<br>③ 1989年、マルタ会談で冷戦の終結を宣言した2つの国は？　④ 1991年に解体され、冷戦を完全に終わらせた国は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">ペレストロイカ</span>　── ゴルバチョフの改革。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">ベルリンの壁</span>　── 東西ドイツを分けていた。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">アメリカとソ連</span>　── マルタ会談で冷戦終結を宣言。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">ソ連</span>　── 1991年に解体された。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
