<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ベルリンの壁とマルタ会談 ── 1989・冷戦の終結｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bl-safe { inset: 78px 140px 78px; grid-template-columns: 1fr 500px; align-content: center; gap: 48px; align-items: center; }
  .bl-txt { display:grid; gap:16px; }
  .bl-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:120px 1fr; gap:20px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:16px; padding:16px 26px; box-shadow:0 10px 22px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--cat); text-align:center; }
  .step .tx { font-size:27px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:29px; min-width:190px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .wallbox { background:var(--paper-hi); border: 3px solid var(--sumi); border-radius: 24px; box-shadow: 0 16px 38px rgba(40,30,10,.12); padding: 16px; }
  .wallbox svg { display:block; width:100%; height:auto; }
  .ml { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe bl-safe">
    <div class="bl-txt">
      <div class="bl-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　東西対立の終わり</span>
        <h1 class="headline" style="font-size:44px;">東西を分けた<span class="em">壁</span>がくずれ、対立が終わる</h1>
      </div>
      <div class="step" data-at="1" data-anim="left" style="border-color:var(--imp);">
        <span class="yr" style="color:var(--imp);">1989</span>
        <span class="tx">東西対立の象徴だった、その国の<span class="blank" data-fill="1"><span class="bnum">①</span><b>ベルリンの壁</b></span>がとりこわされる。</span>
      </div>
      <div class="step" data-at="2" data-anim="left">
        <span class="yr">1989</span>
        <span class="tx">米ソ首脳が<span class="blank" data-fill="2"><span class="bnum">②</span><b>マルタ会談</b></span>で<span class="blank" data-fill="2"><span class="bnum">③</span><b>冷戦</b></span>の終結を宣言する。</span>
      </div>
      <div class="step" data-at="3" data-anim="left">
        <span class="yr">1990</span>
        <span class="tx">東西<span class="blank" data-fill="3"><span class="bnum">④</span><b>ドイツ</b></span>が<span class="blank" data-fill="3"><span class="bnum">⑤</span><b>統一</b></span>される。</span>
      </div>
      <div class="step" data-at="4" data-anim="left">
        <span class="yr">意味</span>
        <span class="tx">アメリカとソ連の対立の時代が、ついに終わりを告げた。</span>
      </div>
    </div>
    <div class="wallbox" data-at="1" data-anim="right">
      <svg viewBox="0 0 460 440" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="460" height="440" fill="#EDECEA"/>
        <!-- West side (blue) -->
        <rect x="0" y="0" width="215" height="440" fill="#DCE7EF"/>
        <text class="ml" x="105" y="60" fill="#1f4e82" font-size="24" text-anchor="middle">西側</text>
        <!-- East side (red) -->
        <rect x="245" y="0" width="215" height="440" fill="#F2DADA"/>
        <text class="ml" x="355" y="60" fill="#8a2b2b" font-size="24" text-anchor="middle">東側</text>
        <!-- wall (crumbling) -->
        <g fill="#8B8A88" stroke="#4A4947" stroke-width="2">
          <rect x="215" y="120" width="30" height="34"/>
          <rect x="215" y="158" width="30" height="34"/>
          <rect x="215" y="196" width="30" height="34" transform="rotate(8 230 213)"/>
          <rect x="215" y="234" width="30" height="34"/>
          <rect x="222" y="300" width="30" height="34" transform="rotate(-14 237 317)"/>
          <rect x="205" y="345" width="30" height="30" transform="rotate(20 220 360)"/>
        </g>
        <!-- rubble -->
        <g fill="#B9B8B5">
          <rect x="180" y="392" width="34" height="20" transform="rotate(-10 197 402)"/>
          <rect x="250" y="398" width="30" height="18" transform="rotate(12 265 407)"/>
          <rect x="150" y="405" width="26" height="16"/>
        </g>
        <circle cx="230" cy="176" r="22" fill="#C4161C"/><text x="230" y="186" fill="#fff" font-size="26" text-anchor="middle" font-family="'Zen Old Mincho',serif" font-weight="900">①</text>
        <text class="ml" x="352" y="205" fill="#C4161C" font-size="26" text-anchor="middle">①が崩壊</text>
      </svg>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
