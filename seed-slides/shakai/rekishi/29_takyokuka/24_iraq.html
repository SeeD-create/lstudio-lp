<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>イラク戦争と軍縮 ── 2003イラク戦争・2011新START｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .iq-safe { inset: 84px 155px 84px; align-content: center; gap: 26px; }
  .iq-head { display:grid; gap:10px; }
  .step { display:grid; grid-template-columns:120px 1fr; gap:22px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:16px; padding:18px 28px; box-shadow:0 10px 22px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); text-align:center; }
  .step .tx { font-size:28px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:30px; min-width:200px; }
  .step .tx b { color:var(--imp); font-weight:900; }
  .step .tx small { display:block; font-size:22px; color:var(--sumi-mute); font-weight:600; margin-top:4px; }
  .iq-note { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:17px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .iq-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color: var(--imp); white-space:nowrap; }
  .iq-note .bb { font-size:25px; line-height:1.45; }
  .iq-note .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe iq-safe">
    <div class="iq-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　戦争、そして軍縮へ</span>
      <h1 class="headline" style="font-size:48px;">21世紀の<span class="em">戦争</span>と、核兵器を減らす約束</h1>
    </div>
    <div class="step" data-at="1" data-anim="left" style="border-color:var(--imp);">
      <span class="yr" style="color:var(--imp);">2003</span>
      <span class="tx">アメリカがイギリスとともに<span class="blank" data-fill="1"><span class="bnum">①</span><b>イラク戦争</b></span>をおこす。<small>ある兵器を保有するとして攻撃。しかし戦後も見つからなかった。</small></span>
    </div>
    <div class="step" data-at="2" data-anim="left">
      <span class="yr">背景</span>
      <span class="tx">攻撃の理由は、イラクが<span class="blank" data-fill="2"><span class="bnum">②</span><b>大量破壊兵器</b></span>を持っているという主張だった。</span>
    </div>
    <div class="step" data-at="3" data-anim="left">
      <span class="yr">2011</span>
      <span class="tx">アメリカとロシアが<span class="blank" data-fill="3"><span class="bnum">③</span><b>新START</b></span>（新戦略兵器削減条約）に調印する。<small>核兵器を減らす軍縮の取り決め。</small></span>
    </div>
    <div class="iq-note" data-at="4" data-anim="fade">
      <span class="bt">時代のしめくくり</span>
      <span class="bb"><span class="blank blank--para" data-fill="4"><b>冷戦後も戦争は続いたが、一方で<span class="hl">核兵器を減らす動き（軍縮）</span>も進んだ。世界は今も、多くの国が主役の<span class="hl">多極化</span>の中にある。</b></span></span>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
