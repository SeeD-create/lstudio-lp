<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>多極化とは ── 二極（米ソ）から、多くの極へ｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { inset: 90px 150px 90px; align-content: center; gap: 40px; }
  .tk-head { display: grid; gap: 12px; }
  .tk-def { font-size: 34px; line-height: 1.5; color: var(--sumi-soft); font-weight: 700; }
  .tk-def b { color: var(--imp); }
  .poles { display:grid; grid-template-columns: 470px 90px 1fr; align-items:center; gap:20px; }
  .two { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:22px; padding:26px; display:grid; gap:16px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .two .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); text-align:center; letter-spacing:.1em; }
  .two .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .pchip { border-radius:16px; padding:18px 12px; text-align:center; font-weight:900; font-size:27px; color:#fff; }
  .grow { display:flex; align-items:center; justify-content:center; font-size:52px; color:var(--imp); font-weight:900; }
  .multi { background:var(--paper-hi); border:3px solid var(--imp); border-radius:22px; padding:24px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .mchip { border-radius:16px; padding:16px 10px; text-align:center; font-weight:900; font-size:23px; color:#fff; line-height:1.2; }
  .mchip small { display:block; font-size:16px; font-weight:700; opacity:.9; margin-top:4px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe tk-safe">
    <div class="tk-head" data-at="0">
      <span class="kicker"><span class="num">概念</span>　多極化とは</span>
      <h1 class="headline" style="font-size:56px;">世界を動かす「<span class="em">極</span>」が、二つから<span class="em">たくさん</span>に</h1>
    </div>
    <p class="tk-def" data-at="1">戦後しばらく、世界は<b>アメリカ（資本主義）とソ連（社会主義）</b>という<b>二つの超大国</b>が対立する「冷戦」の時代だった。ところが力の中心が複数に分かれていく──これが<b>多極化</b>。</p>
    <div class="poles">
      <div class="two" data-at="2" data-anim="left">
        <div class="cap">二極（冷戦）</div>
        <div class="pair">
          <div class="pchip" style="background:#2f6fb0;">アメリカ<br><span style="font-size:18px;">資本主義</span></div>
          <div class="pchip" style="background:#b23b3b;">ソ連<br><span style="font-size:18px;">社会主義</span></div>
        </div>
      </div>
      <div class="grow" data-at="3">➡</div>
      <div class="multi" data-at="4" data-anim="right">
        <div class="mchip" style="background:#2f6fb0;">アメリカ</div>
        <div class="mchip" style="background:#b23b3b;">ソ連</div>
        <div class="mchip" style="background:#3d8c4e;">ヨーロッパ<small>EC→EU</small></div>
        <div class="mchip" style="background:#c99a24;">中国</div>
        <div class="mchip" style="background:#4a4947;">アフリカ・アジア<small>独立国（第三世界）</small></div>
        <div class="mchip" style="background:#c9772a;">中東<small>石油（OPEC）</small></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
