<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>米中接近とアフガニスタン ── 1979・ゆらぐ二極｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bc-safe { inset: 78px 150px 78px; align-content: center; gap: 22px; }
  .bc-head { display:grid; gap:10px; }
  .bc-def { font-size:28px; line-height:1.45; color:var(--sumi-soft); font-weight:700; }
  .bc-def b { color:var(--imp); }
  .step { display:grid; grid-template-columns:120px 1fr; gap:22px; align-items:center; background: var(--paper-hi); border:3px solid var(--cat); border-radius:16px; padding:16px 28px; box-shadow:0 10px 22px rgba(40,30,10,.08); }
  .step .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); text-align:center; }
  .step .tx { font-size:28px; line-height:1.4; color:var(--sumi); font-weight:700; }
  .step .tx .blank { font-size:30px; min-width:210px; }
  .step .tx b { color:var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe bc-safe">
    <div class="bc-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　ゆらぐ二極</span>
      <h1 class="headline" style="font-size:48px;">米ソの力が弱まり、<span class="em">二極</span>がくずれ始める</h1>
    </div>
    <p class="bc-def" data-at="1">ベトナム戦争で苦しんだアメリカは中国に近づき、東の超大国もまた失敗をくり返す。二つの超大国の力がおとろえていく。</p>
    <div class="step" data-at="2" data-anim="left">
      <span class="yr">1979</span>
      <span class="tx">アメリカと中国が<span class="blank" data-fill="2"><span class="bnum">①</span><b>国交正常化</b></span>する（米中接近）。</span>
    </div>
    <div class="step" data-at="3" data-anim="left">
      <span class="yr">1979</span>
      <span class="tx"><span class="blank" data-fill="3"><span class="bnum">②</span><b>ソ連</b></span>が<span class="blank" data-fill="3"><span class="bnum">③</span><b>アフガニスタン</b></span>に侵攻するが、失敗に終わる。</span>
    </div>
    <div class="step" data-at="4" data-anim="left">
      <span class="yr">1980</span>
      <span class="tx"><span class="blank" data-fill="4"><span class="bnum">④</span><b>イラン・イラク戦争</b></span>が始まる（1988年まで続く）。</span>
    </div>
    <div class="step" data-at="5" data-anim="left" style="border-color:var(--imp);">
      <span class="yr" style="color:var(--imp);">流れ</span>
      <span class="tx">二つの超大国が力を失い、<b>冷戦の終わり</b>へと向かっていく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
