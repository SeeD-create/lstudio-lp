<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>歴史のゴール ── 古代から現代まで、走りきった｜中2歴史 第30章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fn-safe { inset: 84px 140px 84px; align-content: center; gap: 40px; justify-items: center; text-align:center; }
  .fn-head { display:grid; gap:14px; justify-items:center; }
  .fn-lead { font-size: 34px; color: var(--sumi-soft); font-weight: 700; max-width: 1480px; line-height:1.55; }
  .fn-lead .em { color: var(--imp); font-weight: 900; }
  .era-row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 16px; width: 100%; }
  .era { background:var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:22px 16px; display:grid; gap:8px; box-shadow:0 12px 26px rgba(40,30,10,.09); }
  .era .en { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .era .ed { font-size:19px; color:var(--sumi-soft); font-weight:700; line-height:1.35; }
  .era .ed b { color:var(--imp); }
  .fn-seal { display:inline-flex; align-items:center; gap:18px; font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--imp); font-size:34px; letter-spacing:.04em; }
  .fn-seal .ring { width:70px;height:70px;border-radius:50%;border:5px solid var(--imp);display:inline-flex;align-items:center;justify-content:center;font-size:34px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fn-safe">
    <div class="fn-head" data-at="0">
      <span class="kicker"><span class="num">歴史 完</span>　最終章をこえて</span>
      <h1 class="headline" style="font-size:60px;">古代から現代まで、<span class="em">歴史</span>を走りきった</h1>
    </div>
    <p class="fn-lead" data-at="1">文明のはじまりから、武士の世、天下統一、明治の近代化、二つの世界大戦をこえて──いま、<span class="em">冷戦の終わり</span>までたどり着いた。人類は「争い」と「協力」をくり返しながら、世界を作ってきた。</p>
    <div class="era-row">
      <div class="era" data-at="2" data-anim="pop"><div class="en">古代</div><div class="ed">文明のおこり〜<b>律令国家</b>・平安</div></div>
      <div class="era" data-at="2" data-anim="pop"><div class="en">中世</div><div class="ed"><b>鎌倉・室町</b>の武士の世</div></div>
      <div class="era" data-at="3" data-anim="pop"><div class="en">近世</div><div class="ed"><b>天下統一・江戸</b>の平和</div></div>
      <div class="era" data-at="3" data-anim="pop"><div class="en">近代</div><div class="ed"><b>明治維新</b>〜二つの世界大戦</div></div>
      <div class="era" data-at="4" data-anim="pop" style="border-color:var(--imp);"><div class="en" style="color:var(--imp);">現代</div><div class="ed">戦後の民主化〜<b>冷戦の終結</b></div></div>
    </div>
    <span class="fn-seal" data-at="4"><span class="ring">完</span>ここから先の歴史は、きみたちが作っていく</span>
  </div>
  <div class="seed-foot"><span>第30章 世界の多極化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
