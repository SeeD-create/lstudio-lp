<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>鎖国の完成 ── 1639ポルトガル禁止・1641出島｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 600px; align-items: center; gap: 56px; align-content: center; }
  .sk-txt { display: grid; gap: 24px; }
  .sk-head { display: grid; gap: 12px; }
  .sk-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 26px 34px; display:flex; align-items:center; gap:24px; }
  .sk-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .sk-card .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--cat); white-space:nowrap; }
  .sk-card .tx { font-size: 32px; line-height:1.45; color:var(--sumi); font-weight:700; }
  .sk-card .tx .blank { font-size: 34px; min-width: 220px; }
  .sk-card .tx .im { color: var(--imp); font-weight: 900; }
  .sk-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .sk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .sk-bar .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.94); }
  .sk-bar .bb b { color:#fff; }
  .sk-fig { height: 660px; border-radius: 26px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe sk-safe">
    <div class="sk-txt">
      <div class="sk-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅱ 外への扉が閉じるまで</span>
        <h1 class="headline" style="font-size:52px;">ついに、外への<span class="em">扉を閉じる</span></h1>
      </div>
      <div class="sk-card" data-at="1" data-anim="left">
        <span class="yr">1639</span>
        <div class="tx"><span class="blank" data-fill="2"><span class="bnum">①</span><b>ポルトガル</b></span>船の来航を禁止し、<span class="blank" data-fill="2"><span class="bnum">②</span><b>鎖国</b></span>が完成した。</div>
      </div>
      <div class="sk-card" data-at="3" data-anim="left">
        <span class="yr">1641</span>
        <div class="tx"><span class="im">オランダ</span>商館を長崎の<span class="blank" data-fill="4"><span class="bnum">③</span><b>出島</b></span>に移した。</div>
      </div>
      <div class="sk-bar" data-at="4" data-anim="fade">
        <span class="bt">★ 頻出：2つの年号</span>
        <span class="bb"><b>1639＝ある国の船の来航を禁止／1641＝オランダ商館を長崎の人工島へ</b>。「日本人の海外渡航も禁止」した対外制限のことを何というか、も答えられるように。</span>
      </div>
    </div>
    <div class="figure sk-fig" data-at="0" data-anim="right"><img src="assets/dejima.webp" alt="長崎・出島"></div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
