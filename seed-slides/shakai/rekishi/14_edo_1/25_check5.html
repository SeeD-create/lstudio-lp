<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1420px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size: 31px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. ○か×か</div>
      <p class="qtext" data-at="0">鎖国が完成したあとも、<span class="u">ポルトガル・オランダ・清</span>の<br>3か国とは国交が続いていた。</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-at="1" data-anim="pop" data-fill="1"><b>×</b></span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b>ポルトガルは<span class="hl">1639年に来航禁止</span>。国交が続いたのは<br><span class="hl">オランダ・清・朝鮮</span>の3か国。朝鮮からは<span class="hl">通信使</span>が来た。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
