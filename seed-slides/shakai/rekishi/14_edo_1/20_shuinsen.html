<title>朱印船貿易 ── 徳川家康・朱印状・日本町｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ss-safe { inset: 96px 150px 96px; align-content: center; gap: 30px; }
  .ss-head { display: grid; gap: 12px; }
  .ss-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 30px 40px; font-size: 36px; line-height:1.55; color:var(--sumi); font-weight:700; }
  .ss-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .ss-card .blank { font-size: 38px; min-width: 280px; }
  .ss-card .im { color: var(--imp); font-weight: 900; }
  .ss-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 36px; }
  .ss-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
  .ss-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .ss-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ss-safe">
    <div class="ss-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 鎖国の完成</span>
      <h1 class="headline" style="font-size:54px;">はじめは、外国と<span class="em">さかんに貿易</span>していた</h1>
    </div>
    <div class="ss-card" data-at="1" data-anim="left">
      徳川家康は、大名や大商人に海外渡航の許可証である <span class="blank" data-fill="2"><span class="bnum">①</span><b>朱印状</b></span> を与えた。
    </div>
    <div class="ss-card" data-at="3" data-anim="left">
      この貿易を <span class="blank" data-fill="4"><span class="bnum">②</span><b>朱印船貿易</b></span> といい、東南アジア各地に <span class="im">日本町</span> ができた。
    </div>
    <div class="ss-bar" data-at="4" data-anim="fade">
      <span class="bt">流れの出発点</span>
      <span class="bb"><b>許可証 → その船による貿易 → 東南アジアの日本町</b>という順。最初は開いていた貿易が、キリスト教を理由に閉じていく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
