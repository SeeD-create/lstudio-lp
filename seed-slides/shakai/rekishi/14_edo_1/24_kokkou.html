<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>鎖国下の窓口 ── 国交のあった国｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kc-safe { inset: 88px 150px 88px; align-content: center; gap: 26px; }
  .kc-head { display: grid; gap: 12px; }
  .kc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .kc-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 30px 30px 34px; display: grid; gap: 14px; min-height: 340px; align-content: start; }
  .kc-card::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .kc-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; }
  .kc-card .nm .blank { font-size:46px; min-width:200px; }
  .kc-card .tag2 { justify-self:start; font-size:24px; font-weight:900; color:var(--cat); background:var(--cat-bg); border-radius:999px; padding:6px 18px; }
  .kc-card .b { font-size:28px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .kc-card .b .em { color: var(--imp); font-weight: 900; }
  .kc-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; }
  .kc-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .kc-bar .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.94); }
  .kc-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kc-safe">
    <div class="kc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 鎖国の完成</span>
      <h1 class="headline" style="font-size:52px;">閉じても、<span class="em">3つの窓口</span>は開いていた</h1>
    </div>
    <div class="kc-row">
      <div class="kc-card" data-at="1" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>オランダ</b></span></div>
        <span class="tag2">ヨーロッパの国</span>
        <div class="b">キリスト教を広めなかったため貿易を許された。窓口は<span class="em">長崎の出島</span>。</div>
      </div>
      <div class="kc-card" data-at="1" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">②</span><b>清</b></span></div>
        <span class="tag2">中国の王朝</span>
        <div class="b"><span class="em">1644年に明がほろびて</span>成立した王朝。長崎で貿易を続けた。</div>
      </div>
      <div class="kc-card" data-at="1" data-anim="pop">
        <div class="nm">朝鮮</div>
        <span class="tag2">使節を送る</span>
        <div class="b">将軍が代わるごとに <span class="blank" data-fill="4"><span class="bnum">③</span><b>通信使</b></span> という使節が江戸を訪れた。</div>
      </div>
    </div>
    <div class="kc-bar" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出＋補足</span>
      <span class="bb">国交が続いたのは<b>3つの国</b>。ほかに<b>薩摩藩が琉球王国と貿易</b>を行っていた。朝鮮から来た使節の名前も答えられるように。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
