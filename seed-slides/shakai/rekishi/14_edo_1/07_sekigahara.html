<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>関ヶ原の戦い ── 1600年・天下分け目｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 560px; align-items: center; gap: 56px; align-content: center; }
  .sk-txt { display: grid; gap: 26px; }
  .sk-head { display: grid; gap: 12px; }
  .yeartag { justify-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900;
             font-size:34px; padding:8px 26px; border-radius:12px; letter-spacing:.06em; }
  .sk-line { font-size: 40px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .sk-line .blank { font-size: 42px; min-width: 300px; }
  .vs { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border:3px solid var(--hair); border-radius:18px; padding:22px 30px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .vs .side { text-align:center; flex:1; }
  .vs .side .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); }
  .vs .side .sub { font-size:24px; color:var(--sumi-mute); font-weight:700; margin-top:4px; }
  .vs .mid { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--imp); }
  .sk-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .sk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .sk-bar .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.94); }
  .sk-bar .bb b { color:#fff; }
  .sk-fig { height: 640px; border-radius: 26px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sk-safe">
    <div class="sk-txt">
      <div class="sk-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 江戸幕府の成立</span>
        <span class="yeartag">1600年</span>
      </div>
      <div class="sk-line" data-at="0">「天下分け目」とよばれる<br><span class="blank" data-fill="1"><span class="bnum">①</span><b>関ヶ原の戦い</b></span>が起こる。</div>
      <div class="vs" data-at="2" data-anim="pop">
        <div class="side"><div class="nm"><span class="blank" data-fill="3"><span class="bnum">②</span><b>徳川家康</b></span></div><div class="sub">東軍 ／ 勝利</div></div>
        <div class="mid">VS</div>
        <div class="side"><div class="nm">石田三成</div><div class="sub">西軍・豊臣氏側</div></div>
      </div>
      <div class="sk-bar" data-at="4" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb"><b>1600年・家康が三成を破った天下分け目の一戦</b>。戦いの地名は漢字で書けるように。この勝利が幕府の出発点になる。</span>
      </div>
    </div>
    <div class="figure sk-fig" data-at="0" data-anim="right"><img src="assets/sekigahara.webp" alt="関ヶ原の合戦"></div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
