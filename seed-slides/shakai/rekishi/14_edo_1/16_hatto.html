<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大名と朝廷の統制 ── 武家諸法度・禁中並公家諸法度｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hd-safe { inset: 84px 150px 84px; align-content: center; gap: 26px; }
  .hd-head { display: grid; gap: 10px; }
  .yeartag { justify-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900;
             font-size:30px; padding:6px 24px; border-radius:12px; letter-spacing:.06em; }
  .hd-row { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .hd-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 28px 34px; display: grid; gap: 12px; }
  .hd-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .hd-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; }
  .hd-card .nm .blank { font-size:40px; min-width:280px; }
  .hd-card .r { font-size:27px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .hd-card .r .em { color: var(--imp); }
  .arts { background: var(--paper-hi); border: 3px dashed var(--sumi-mute); border-radius: 18px; padding: 20px 30px; display:grid; gap:10px; }
  .arts .at { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--sumi); letter-spacing:.1em; }
  .arts .al { font-size:25px; color:var(--sumi-soft); font-weight:600; line-height:1.4; display:flex; gap:14px; }
  .arts .al .no { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--imp); }
  .hd-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; }
  .hd-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .hd-bar .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.94); }
  .hd-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hd-safe">
    <div class="hd-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 江戸幕府の成立</span>
      <span class="yeartag">1615年</span>
    </div>
    <div class="hd-row">
      <div class="hd-card" data-at="1" data-anim="left">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>武家諸法度</b></span></div>
        <div class="r"><span class="em">大名を統制</span>するための法律。<br>違反した大名はきびしく処罰された。</div>
      </div>
      <div class="hd-card" data-at="1" data-anim="right">
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">②</span><b>禁中並公家諸法度</b></span></div>
        <div class="r"><span class="em">天皇・公家を統制</span>するための法律。<br>朝廷の力をおさえた。</div>
      </div>
    </div>
    <div class="arts" data-at="4" data-anim="fade">
      <div class="at">── 大名へのおもなきまり</div>
      <div class="al"><span class="no">三</span>新しい城を造ることは固く禁止する。修理のときも必ず届け出ること。</div>
      <div class="al"><span class="no">八</span>大名は、幕府の許可なく勝手に結婚してはいけない。</div>
    </div>
    <div class="hd-bar" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出：2つの法度</span>
      <span class="bb">どちらも1615年。<b>大名を縛る法</b>と<b>天皇・公家を縛る法</b>で名前がちがう。「誰を縛る法か」でセット暗記。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
