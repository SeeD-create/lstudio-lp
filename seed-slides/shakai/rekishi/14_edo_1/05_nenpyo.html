<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>江戸時代（１）年表 ── 8つの年号｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { inset: 62px 150px 62px; align-content: center; gap: 16px; }
  .np-head { display: grid; gap: 6px; justify-items:center; text-align:center; }
  .np-list { display: grid; gap: 11px; }
  .np-row { display: grid; grid-template-columns: 210px 1fr; align-items: center; gap: 30px;
            background: var(--paper-hi); border: 3px solid var(--hair); border-left: 12px solid var(--cat);
            border-radius: 14px; padding: 11px 30px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .np-row .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); letter-spacing:.02em; }
  .np-row .ev { font-size: 30px; font-weight: 700; color: var(--sumi-soft); line-height:1.3; }
  .np-row .ev .em { color: var(--imp); font-weight: 900; }
  .np-row .ev .blank { min-width:0; white-space:normal; padding:0 10px 3px; margin:0 2px; }
  .np-row.hot { border-left-color: var(--imp); }
  .np-row.hot .yr { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe np-safe">
    <div class="np-head">
      <span class="kicker"><span class="num">年表</span>　江戸時代（１）</span>
      <h1 class="headline" style="font-size:46px;">まず<span class="em">8つの年号</span>を通しでつかむ</h1>
    </div>
    <div class="np-list">
      <div class="np-row hot" data-at="0" data-anim="left"><span class="yr">1600</span><span class="ev"><span class="blank" data-fill="1"><b>関ヶ原の戦い</b></span> ── 天下分け目。徳川家康が石田三成を破る</span></div>
      <div class="np-row hot" data-at="1" data-anim="left"><span class="yr">1603</span><span class="ev">徳川家康が征夷大将軍となり<span class="blank" data-fill="1"><b>江戸幕府</b></span>を開く</span></div>
      <div class="np-row" data-at="2" data-anim="left"><span class="yr">1614〜15</span><span class="ev">大阪冬の陣・夏の陣 ── <span class="blank" data-fill="2"><b>豊臣氏がほろびる</b></span></span></div>
      <div class="np-row hot" data-at="3" data-anim="left"><span class="yr">1615</span><span class="ev"><span class="blank" data-fill="3"><b>武家諸法度</b></span>・禁中並公家諸法度を定める（大名・朝廷の統制）</span></div>
      <div class="np-row hot" data-at="4" data-anim="left"><span class="yr">1635</span><span class="ev"><span class="blank" data-fill="4"><b>参勤交代</b></span>を制度化（3代将軍・徳川家光）</span></div>
      <div class="np-row" data-at="5" data-anim="left"><span class="yr">1637</span><span class="ev"><span class="blank" data-fill="5"><b>島原・天草一揆</b></span>（キリスト教徒の一揆）</span></div>
      <div class="np-row hot" data-at="6" data-anim="left"><span class="yr">1639</span><span class="ev"><span class="blank" data-fill="6"><b>鎖国の完成</b></span> ── ポルトガル船の来航を禁止</span></div>
      <div class="np-row" data-at="7" data-anim="left"><span class="yr">1641</span><span class="ev">オランダ商館を長崎の<span class="blank" data-fill="7"><b>出島</b></span>へ移す</span></div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
