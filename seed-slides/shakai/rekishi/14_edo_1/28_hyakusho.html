<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>百姓のくらし ── 本百姓と水呑百姓｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hy-safe { inset: 92px 150px 92px; grid-template-columns: 600px 1fr; align-items: center; gap: 56px; align-content: center; }
  .hy-txt { display: grid; gap: 24px; }
  .hy-head { display: grid; gap: 12px; }
  .hy-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 28px 36px; display: grid; gap: 10px; }
  .hy-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .hy-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; }
  .hy-card .nm .blank { font-size:44px; min-width:260px; }
  .hy-card .r { font-size:29px; color:var(--sumi-soft); font-weight:700; }
  .hy-card .r .em { color: var(--imp); font-weight:900; }
  .hy-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .hy-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .hy-bar .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.94); }
  .hy-bar .bb b { color:#fff; }
  .hy-fig { height: 660px; border-radius: 26px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe hy-safe">
    <div class="figure hy-fig" data-at="0" data-anim="left"><img src="assets/noson.webp" alt="百姓の村"></div>
    <div class="hy-txt">
      <div class="hy-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅲ 身分制度</span>
        <h1 class="headline" style="font-size:50px;">百姓は<span class="em">土地の有無</span>で分けられた</h1>
      </div>
      <div class="hy-card" data-at="1" data-anim="right">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>本百姓</b></span></div>
        <div class="r"><span class="em">土地を持つ</span>百姓。年貢を納め、村役人にもなった。</div>
      </div>
      <div class="hy-card" data-at="3" data-anim="right">
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>水呑百姓</b></span></div>
        <div class="r"><span class="em">土地を持たない</span>百姓。他人の田畑を借りて働いた。</div>
      </div>
      <div class="hy-bar" data-at="4" data-anim="fade">
        <span class="bt">★ 対で覚える</span>
        <span class="bb">分けかたは<b>土地を持っているかどうか</b>。村役人は、土地を持つほうの中から選ばれた。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
