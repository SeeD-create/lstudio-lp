<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>旗本と御家人 ── 将軍直属の武士｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ht-safe { inset: 96px 150px 96px; align-content: center; gap: 30px; }
  .ht-head { display: grid; gap: 12px; }
  .ht-def { font-size: 32px; font-weight: 700; color: var(--sumi-soft); }
  .ht-def .im { color: var(--imp); font-weight: 900; }
  .ht-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .ht-card { position: relative; background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--cat);
             box-shadow: 0 16px 36px rgba(40,30,10,.12); padding: 34px 42px; display: grid; gap: 14px; }
  .ht-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:21px 0 0 21px; }
  .ht-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:54px; color:var(--sumi); display:flex; align-items:baseline; gap:14px; }
  .ht-card .nm .blank { font-size: 52px; min-width: 240px; }
  .ht-card .role { font-size:31px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .ht-card .role .em { color: var(--imp); font-weight: 900; }
  .ht-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .ht-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .ht-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .ht-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ht-safe">
    <div class="ht-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 江戸幕府の成立</span>
      <h1 class="headline" style="font-size:54px;">将軍<span class="em">直属</span>で1万石未満の武士</h1>
    </div>
    <div class="ht-def" data-at="1">分かれ目は<span class="im">「将軍に直接会えるかどうか」</span>。</div>
    <div class="ht-row">
      <div class="ht-card" data-at="2" data-anim="left">
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">①</span><b>旗本</b></span></div>
        <div class="role">将軍に<span class="em">直接会える</span>武士。<br>1万石未満の将軍直属の家臣。</div>
      </div>
      <div class="ht-card" data-at="2" data-anim="right">
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>御家人</b></span></div>
        <div class="role">将軍に<span class="em">直接会えない</span>武士。<br>同じく1万石未満の将軍直属の家臣。</div>
      </div>
    </div>
    <div class="ht-bar" data-at="4" data-anim="fade">
      <span class="bt">★ ひっかけ注意</span>
      <span class="bb"><b>将軍に会えるか、会えないか</b>で名前が変わる。どちらも「1万石未満・将軍直属」。1万石以上は大名、と数字でセット整理。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
