<!DOCTYPE html>

<head>

<title>キリスト教の禁止 ── 島原・天草一揆・絵踏・宗門改帳｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 84px 150px 84px; align-content: center; gap: 24px; }
  .kk-head { display: grid; gap: 10px; }
  .yeartag { justify-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900;
             font-size:30px; padding:6px 24px; border-radius:12px; letter-spacing:.06em; }
  .kk-top { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
            box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 26px 36px; display:flex; align-items:center; gap:28px; }
  .kk-top::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .kk-top .yr2 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--cat); white-space:nowrap; }
  .kk-top .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; }
  .kk-top .nm .blank { font-size:42px; min-width:340px; }
  .kk-top .r { font-size:26px; color:var(--sumi-soft); font-weight:700; }
  .kk-top .r .im { color: var(--imp); font-weight:900; }
  .kk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .kk-card { position: relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--hair);
             box-shadow: 0 12px 28px rgba(40,30,10,.10); padding: 26px 32px; display: grid; gap: 10px; }
  .kk-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; }
  .kk-card .nm .blank { font-size:40px; min-width:220px; }
  .kk-card .r { font-size:27px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .kk-card .r .em { color: var(--imp); }
  .kk-card .sub { font-size:23px; color:var(--sumi-mute); font-weight:700; }
  .kk-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 32px; }
  .kk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .kk-bar .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.94); }
  .kk-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 鎖国の完成</span>
      <span class="yeartag">3代 徳川家光の時代</span>
    </div>
    <div class="kk-top" data-at="1" data-anim="left">
      <span class="yr2">1637年</span>
      <div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>島原・天草一揆</b></span></div>
        <div class="r">重い年貢と禁教に苦しんだ<span class="im">キリスト教徒の一揆</span>（九州）。幕府は禁教を強めた。</div>
      </div>
    </div>
    <div class="kk-row">
      <div class="kk-card" data-at="3" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>絵踏</b></span></div>
        <div class="r">キリストなどの絵を踏ませ、<span class="em">キリスト教徒を見つける</span>。</div>
      </div>
      <div class="kk-card" data-at="3" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">③</span><b>宗門改帳</b></span></div>
        <div class="r"><span class="em">キリスト教徒でないこと</span>を寺に証明させ記帳。</div>
        <div class="sub">＝寺請制度ともいう</div>
      </div>
    </div>
    <div class="kk-bar" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出：取りしまり</span>
      <span class="bb"><b>絵を踏ませて見つける</b>／<b>寺に仏教徒だと証明させて帳簿に記す</b>（寺請制度）。きっかけは<b>1637年に九州で起きた一揆</b>。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
