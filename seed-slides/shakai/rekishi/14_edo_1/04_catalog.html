<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>江戸時代（１）カタログ ── 集める3枚｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 100px 150px 100px; align-content: center; gap: 44px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 36px 34px 40px; min-height: 430px; display: grid; align-content: start; gap: 18px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--cat); opacity:.35; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); line-height:1.15; margin-top:6px; }
  .cc__ess { font-size:28px; color:var(--sumi-soft); line-height:1.5; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:8px 20px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:23px; }
  .anchor { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:28px 40px; }
  .anchor .k-ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--gold-soft); white-space:nowrap; }
  .anchor .k-body { font-size:29px; line-height:1.5; color:rgba(251,251,250,.92); }
  .anchor .k-body b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">02</span>　江戸時代（１）カタログ</span>
      <h1 class="headline" style="font-size:66px;">この単元で集めるのは<span class="goldem">3枚</span></h1>
    </div>

    <div class="deck-row">
      <div class="cc" data-cat="eq"  data-at="1" data-anim="pop"><div class="cc__no">Ⅰ</div><div class="cc__ttl">江戸幕府の<br>成立</div><div class="cc__ess">関ヶ原→開府。大名・旗本のしくみ、法度と参勤交代で全国を支配する。</div><span class="cc__pill">1600／1603／1635</span></div>
      <div class="cc" data-cat="soc" data-at="2" data-anim="pop"><div class="cc__no">Ⅱ</div><div class="cc__ttl">鎖国の<br>完成</div><div class="cc__ess">朱印船貿易→キリスト教禁止→鎖国。開いた窓口はどこか。</div><span class="cc__pill">1637／1639／1641</span></div>
      <div class="cc" data-cat="new" data-at="3" data-anim="pop"><div class="cc__no">Ⅲ</div><div class="cc__ttl">身分<br>制度</div><div class="cc__ess">武士・百姓・町人。人口の85％を占める百姓を、村ごと固定した。</div><span class="cc__pill">本百姓・五人組</span></div>
    </div>

    <div class="anchor" data-at="4" data-anim="fade">
      <span class="k-ttl">背骨は「支配」</span>
      <span class="k-body">3枚に共通するのは<b>「二度と戦乱を起こさせないための支配」</b>。大名を縛り、外を閉じ、身分を固める ── この3手をセットで押さえる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
