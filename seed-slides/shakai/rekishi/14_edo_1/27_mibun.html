<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>身分制度 ── 武士・百姓・町人・えた・ひにん｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mb-safe { inset: 84px 150px 84px; align-content: center; gap: 24px; justify-items:center; }
  .mb-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .pyr { display: grid; gap: 14px; justify-items: center; }
  .tier { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 16px; box-shadow: 0 12px 28px rgba(40,30,10,.10);
          display:flex; align-items:center; justify-content:center; gap:30px; padding: 18px 30px; }
  .tier .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); display:flex; align-items:baseline; gap:10px; }
  .tier .lab .blank { font-size:40px; min-width:180px; }
  .tier .sub { font-size:24px; color:var(--sumi-mute); font-weight:800; }
  .t1 { width: 560px; background: var(--paper-hi); border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .t1 .lab { color: var(--sumi); } .t1 .lab .blank b { color: var(--imp); }
  .t2 { width: 900px; }
  .t3 { width: 1180px; }
  .t3 .lab .blank { min-width: 150px; }
  .mb-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; width:100%; }
  .mb-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .mb-bar .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.94); }
  .mb-bar .bb b { color:#fff; }
</style>
<style data-swrepair>
.tier.t1 .sub{color:var(--sumi) !important;}</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe mb-safe">
    <div class="mb-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 身分制度</span>
      <h1 class="headline" style="font-size:50px;">身分で人々を<span class="em">上下に固定</span>した</h1>
    </div>
    <div class="pyr">
      <div class="tier t1" data-at="1" data-anim="pop">
        <div class="lab"><span class="blank" data-fill="1"><span class="bnum">①</span><b>武士</b></span></div>
        <div class="sub" style="color:rgba(255,255,255,.7)">最も上の身分・支配層</div>
      </div>
      <div class="tier t2" data-at="2" data-anim="pop">
        <div class="lab"><span class="blank" data-fill="2"><span class="bnum">②</span><b>百姓</b></span></div>
        <div class="lab"><span class="blank" data-fill="2"><span class="bnum">③</span><b>町人</b></span></div>
      </div>
      <div class="tier t3" data-at="3" data-anim="pop">
        <div class="lab"><span class="blank" data-fill="3"><span class="bnum">④</span><b>えた</b></span></div>
        <div class="lab"><span class="blank" data-fill="3"><span class="bnum">⑤</span><b>ひにん</b></span></div>
        <div class="sub">上の身分の下におかれた人々</div>
      </div>
    </div>
    <div class="mb-bar" data-at="4" data-anim="fade">
      <span class="bt">★ 頻出：身分の順</span>
      <span class="bb">上から順に<b>3つの身分</b>、さらにその下に<b>2つの身分</b>がおかれた。人口の約<b>85％</b>は田畑を耕す人々で、この社会を根もとからささえていた。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
