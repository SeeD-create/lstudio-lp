<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>村のしくみ ── 村役人と五人組｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mr-safe { inset: 88px 150px 88px; align-content: center; gap: 26px; }
  .mr-head { display: grid; gap: 12px; }
  .mr-sub { font-size:29px; font-weight:800; color:var(--sumi-soft); }
  .mr-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .mr-chip { position: relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--cat);
             box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 26px 28px; display:grid; gap:8px; }
  .mr-chip::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:17px 17px 0 0; }
  .mr-chip .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); display:flex; align-items:baseline; gap:10px; }
  .mr-chip .nm .blank { font-size:40px; min-width:180px; }
  .mr-chip .r { font-size:25px; color:var(--sumi-soft); font-weight:700; }
  .mr-five { position: relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--cat);
             box-shadow: 0 14px 30px rgba(40,30,10,.12); padding: 26px 36px; display:flex; align-items:center; gap:28px; }
  .mr-five::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:17px 0 0 17px; }
  .mr-five .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:50px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; white-space:nowrap; }
  .mr-five .nm .blank { font-size:44px; min-width:240px; }
  .mr-five .r { font-size:29px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .mr-five .r .em { color: var(--imp); font-weight:900; }
  .mr-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; }
  .mr-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .mr-bar .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.94); }
  .mr-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe mr-safe">
    <div class="mr-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 身分制度</span>
      <h1 class="headline" style="font-size:50px;">村を通して、百姓を<span class="em">きびしく管理</span>した</h1>
    </div>
    <div class="mr-sub" data-at="1">村役人（土地を持つ百姓から選ぶ）── 3つの役</div>
    <div class="mr-row">
      <div class="mr-chip" data-at="1" data-anim="pop"><div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>庄屋</b></span></div><div class="r">村のかしら（名主ともいう）</div></div>
      <div class="mr-chip" data-at="1" data-anim="pop"><div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>組頭</b></span></div><div class="r">村のかしらを補佐する</div></div>
      <div class="mr-chip" data-at="1" data-anim="pop"><div class="nm"><span class="blank" data-fill="2"><span class="bnum">③</span><b>百姓代</b></span></div><div class="r">村人の代表として立ち会う</div></div>
    </div>
    <div class="mr-five" data-at="3" data-anim="left">
      <div class="nm"><span class="blank" data-fill="4"><span class="bnum">④</span><b>五人組</b></span></div>
      <div class="r">百姓を5戸ずつの組にし、<span class="em">年貢の納入や犯罪について共同責任</span>を負わせるしくみ。</div>
    </div>
    <div class="mr-bar" data-at="5" data-anim="fade">
      <span class="bt">★ 記述で出る</span>
      <span class="bb">5戸ずつの組は<b>年貢と犯罪の共同責任</b>を負った。さらに<b>御触書</b>で衣食まで細かく規制し、百姓の生活を管理した。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
