<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>幕府の領地 ── 全国の約4分の1｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .br-safe { inset: 96px 150px 96px; align-content: center; gap: 34px; }
  .br-head { display: grid; gap: 12px; }
  .br-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .br-card { position: relative; background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--cat);
             box-shadow: 0 16px 36px rgba(40,30,10,.12); padding: 34px 42px; display: grid; gap: 14px; }
  .br-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--cat); border-radius:21px 0 0 21px; }
  .br-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:50px; color:var(--sumi); display:flex; align-items:baseline; gap:14px; }
  .br-card .nm .blank { font-size: 50px; min-width: 260px; }
  .br-card .role { font-size:30px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .br-card .role .em { color: var(--imp); font-weight: 900; }
  .br-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 36px; }
  .br-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
  .br-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .br-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe br-safe">
    <div class="br-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 江戸幕府の成立</span>
      <h1 class="headline" style="font-size:56px;">幕府は全国の土地の<span class="em">約4分の1</span>を直接支配</h1>
    </div>
    <div class="br-row">
      <div class="br-card" data-at="1" data-anim="left">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>天領</b></span></div>
        <div class="role">幕府が<span class="em">直接支配</span>する領地（幕府領・直轄地）。全国の約4分の1をおさえた。</div>
      </div>
      <div class="br-card" data-at="3" data-anim="right">
        <div class="nm">家臣へ分配</div>
        <div class="role">残りの土地は<span class="em">大名や旗本</span>に分け与えた。大名の領地と支配のしくみが「藩」。</div>
      </div>
    </div>
    <div class="br-bar" data-at="4" data-anim="fade">
      <span class="bt">数字で覚える</span>
      <span class="bb"><b>幕府の直轄地＝全国の約4分の1</b>。よび名は2文字の漢字。これだけの直轄地と財力が、260年の支配をささえた。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
