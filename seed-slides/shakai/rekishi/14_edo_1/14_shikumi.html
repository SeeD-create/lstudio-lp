<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>江戸幕府のしくみ ── 老中を中心とした役職｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sh-safe { inset: 62px 130px 62px; align-content: start; gap: 16px; }
  .sh-head { display: grid; gap: 8px; }
  .shogun { justify-self:center; background:var(--sumi); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900;
            font-size:40px; padding:14px 60px; border-radius:16px; letter-spacing:.1em; box-shadow:0 12px 26px rgba(40,30,10,.2); }
  .sh-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .grp { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; overflow:hidden;
         box-shadow: 0 14px 30px rgba(40,30,10,.10); display:grid; align-content:start; }
  .grp .gh { background: var(--cat); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px;
             padding:12px 22px; letter-spacing:.06em; text-align:center; }
  .grp .gb { padding: 18px 20px; display:grid; gap:12px; }
  .chip { display:grid; gap:4px; background:var(--paper); border:2px solid var(--hair); border-radius:12px; padding:12px 16px; }
  .chip .n { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi); display:flex; align-items:baseline; gap:8px; }
  .chip .n .blank { font-size:30px; min-width:180px; }
  .chip .r { font-size:22px; color:var(--sumi-soft); font-weight:700; }
  .chip .r .em { color: var(--imp); }
  .chip.key { border-color: var(--imp); background: var(--imp-bg); }
  .sh-bar { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:13px 30px; }
  .sh-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .sh-bar .bb { font-size:24px; line-height:1.4; color:rgba(251,251,250,.94); }
  .sh-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sh-safe">
    <div class="sh-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　江戸幕府のしくみ</span>
      <h1 class="headline" style="font-size:44px;">将軍の下に、<span class="em">いくつもの役職</span>を置いた</h1>
    </div>
    <div class="shogun" data-at="0">将　軍</div>
    <div class="sh-row">
      <div class="grp" data-at="1" data-anim="pop">
        <div class="gh">政治の中心</div>
        <div class="gb">
          <div class="chip"><div class="n">大老</div><div class="r">臨時の職（最高位）</div></div>
          <div class="chip key"><div class="n"><span class="blank" data-fill="2"><span class="bnum">④</span><b>老中</b></span></div><div class="r"><span class="em">政治全般</span>を受け持つ</div></div>
          <div class="chip"><div class="n">若年寄</div><div class="r">上の役職の補佐</div></div>
        </div>
      </div>
      <div class="grp" data-at="3" data-anim="pop">
        <div class="gh">三奉行</div>
        <div class="gb">
          <div class="chip key"><div class="n"><span class="blank" data-fill="4"><span class="bnum">⑤</span><b>町奉行</b></span></div><div class="r"><span class="em">江戸の町政</span></div></div>
          <div class="chip key"><div class="n"><span class="blank" data-fill="4"><span class="bnum">⑥</span><b>勘定奉行</b></span></div><div class="r"><span class="em">幕府の財政</span></div></div>
          <div class="chip key"><div class="n"><span class="blank" data-fill="4"><span class="bnum">⑦</span><b>寺社奉行</b></span></div><div class="r"><span class="em">寺社の取り締まり</span></div></div>
        </div>
      </div>
      <div class="grp" data-at="5" data-anim="pop">
        <div class="gh">監視・地方</div>
        <div class="gb">
          <div class="chip"><div class="n">大目付</div><div class="r">大名の監視</div></div>
          <div class="chip key"><div class="n"><span class="blank" data-fill="6"><span class="bnum">⑧</span><b>京都所司代</b></span></div><div class="r"><span class="em">朝廷の監視</span></div></div>
          <div class="chip"><div class="n">遠国奉行</div><div class="r">京都・大阪・長崎などの支配</div></div>
          <div class="chip"><div class="n">郡代・代官</div><div class="r">幕府の直轄領を管理</div></div>
        </div>
      </div>
    </div>
    <div class="sh-bar" data-at="7" data-anim="fade">
      <span class="bt">★ 頻出：役職と仕事</span>
      <span class="bb">赤枠の5つを<b>役目とセット</b>で覚える。政治全般／江戸の町政／財政／寺社／朝廷の監視 ── この5つの役目に名前を当てられるようにする。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(8);</script>
</body>
</html>
