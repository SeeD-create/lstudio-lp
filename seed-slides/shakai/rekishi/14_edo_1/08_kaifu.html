<head>

<title>江戸幕府を開く ── 1603年・征夷大将軍｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kf-safe { inset: 92px 150px 92px; grid-template-columns: 560px 1fr; align-items: center; gap: 56px; align-content: center; }
  .kf-txt { display: grid; gap: 26px; }
  .kf-head { display: grid; gap: 12px; }
  .yeartag { justify-self:start; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900;
             font-size:34px; padding:8px 26px; border-radius:12px; letter-spacing:.06em; }
  .kf-line { font-size: 38px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .kf-line .blank { font-size: 40px; min-width: 300px; }
  .kf-line .im { color: var(--imp); font-weight: 900; }
  .kf-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .kf-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .kf-bar .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.94); }
  .kf-bar .bb b { color:#fff; }
  .kf-fig { height: 660px; border-radius: 26px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kf-safe">
    <div class="figure kf-fig" data-at="0" data-anim="left"><img src="assets/edo_castle.webp" alt="江戸城"></div>
    <div class="kf-txt">
      <div class="kf-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 徳川の政権が始まる</span>
        <span class="yeartag">1603年</span>
      </div>
      <div class="kf-line" data-at="1" data-anim="right">徳川家康は<span class="im">征夷大将軍</span>となり、江戸に<br><span class="blank" data-fill="2"><span class="bnum">①</span><b>江戸幕府</b></span>を開いた。</div>
      <div class="kf-line" data-at="3" data-anim="right">大名の領地とその支配のしくみを<br><span class="blank" data-fill="4"><span class="bnum">②</span><b>藩</b></span>という（幕府＋藩＝幕藩体制）。</div>
      <div class="kf-bar" data-at="4" data-anim="fade">
        <span class="bt">★ テスト頻出</span>
        <span class="bb"><b>1603年・徳川家康が征夷大将軍になる</b>。鎌倉・室町に続く3つ目の武家政権のスタート。年号と人物と役職をセットで。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
