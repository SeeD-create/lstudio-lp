<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>豊臣氏の滅亡 ── 大阪冬の陣・夏の陣｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ty-safe { inset: 96px 150px 96px; align-content: center; gap: 34px; }
  .ty-head { display: grid; gap: 12px; }
  .ty-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .ty-card { position: relative; background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--cat);
             box-shadow: 0 16px 36px rgba(40,30,10,.12); padding: 32px 40px; display: grid; gap: 12px; }
  .ty-card .yt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); }
  .ty-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--sumi); }
  .ty-card .nm .blank { min-width:0; width:100%; font-size:42px; padding:0 14px 4px; margin:0; }
  .ty-card .b .blank { min-width:0; white-space:normal; padding:0 10px 3px; margin:0 2px; }
  .ty-card .b { font-size:28px; color:var(--sumi-soft); font-weight:600; line-height:1.4; }
  .ty-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 36px; }
  .ty-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--gold-soft); white-space:nowrap; }
  .ty-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .ty-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ty-safe">
    <div class="ty-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 江戸幕府の成立</span>
      <h1 class="headline" style="font-size:54px;">2度の戦いで、<span class="em">豊臣氏をほろぼす</span></h1>
    </div>
    <div class="ty-row">
      <div class="ty-card" data-at="1" data-anim="left">
        <div class="yt">1614年</div>
        <div class="nm"><span class="blank" data-fill="1"><b>大阪冬の陣</b></span></div>
        <div class="b">徳川が豊臣方の大阪城を攻める第一戦。</div>
      </div>
      <div class="ty-card" data-at="2" data-anim="right">
        <div class="yt">1615年</div>
        <div class="nm"><span class="blank" data-fill="2"><b>大阪夏の陣</b></span></div>
        <div class="b"><span class="blank" data-fill="2"><b>豊臣氏がほろびる</b></span>。徳川の全国支配が固まった。</div>
      </div>
    </div>
    <div class="ty-bar" data-at="3" data-anim="fade">
      <span class="bt">流れで覚える</span>
      <span class="bb"><b>関ヶ原（1600）で勝つ → 開府（1603）→ 大阪の陣（1614〜15）で豊臣を滅ぼす</b>。ここで対抗勢力が消えた。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
