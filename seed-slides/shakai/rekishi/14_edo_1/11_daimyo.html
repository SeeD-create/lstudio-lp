<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大名の3種類 ── 親藩・譜代・外様｜中2歴史 第14章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .dm-safe { inset: 90px 150px 90px; align-content: center; gap: 30px; }
  .dm-head { display: grid; gap: 12px; }
  .dm-def { font-size: 34px; font-weight: 700; color: var(--sumi-soft); }
  .dm-def .blank { font-size: 36px; min-width: 200px; }
  .dm-def .im { color: var(--imp); font-weight: 900; }
  .dm-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .dm-card { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
             box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 30px 30px 34px; display: grid; gap: 14px; min-height: 330px; align-content: start; }
  .dm-card::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .dm-card .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--sumi); display:flex; align-items:baseline; gap:12px; }
  .dm-card .nm .blank { font-size: 46px; min-width: 220px; }
  .dm-card .when { font-size:26px; font-weight:900; color:var(--cat); }
  .dm-card .b { font-size:29px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .dm-card .b .em { color: var(--imp); font-weight: 900; }
  .dm-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .dm-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .dm-bar .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.94); }
  .dm-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe dm-safe">
    <div class="dm-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 江戸幕府の成立</span>
      <h1 class="headline" style="font-size:54px;">徳川との<span class="em">親しさ</span>で3つに分けられた</h1>
    </div>
    <div class="dm-def" data-at="1"><span class="im">1万石以上</span>の領地を与えられた武士を <span class="blank" data-fill="1"><span class="bnum">①</span><b>大名</b></span> という。</div>
    <div class="dm-row">
      <div class="dm-card" data-at="2" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>親藩</b></span></div>
        <div class="when">──</div>
        <div class="b"><span class="em">徳川家の一族</span>。尾張・紀伊・水戸の御三家などが代表。</div>
      </div>
      <div class="dm-card" data-at="3" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">③</span><b>譜代大名</b></span></div>
        <div class="when">関ヶ原<span style="color:var(--imp)">以前</span>から</div>
        <div class="b">関ヶ原の戦いの<span class="em">前</span>からの家臣。要地に置かれ幕政をになった。</div>
      </div>
      <div class="dm-card" data-at="4" data-anim="pop">
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">④</span><b>外様大名</b></span></div>
        <div class="when">関ヶ原<span style="color:var(--imp)">以後</span>から</div>
        <div class="b">関ヶ原の戦いの<span class="em">後</span>に従った家臣。江戸から遠い地に置かれた。</div>
      </div>
    </div>
    <div class="dm-bar" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出の分かれ目</span>
      <span class="bb">分類の基準は<b>「関ヶ原の戦いより前か後か」</b>。前からの家臣は信頼あつく、後からの家臣は遠くへ配置。残る1つは徳川の血縁。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第14章 江戸時代（１）</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
