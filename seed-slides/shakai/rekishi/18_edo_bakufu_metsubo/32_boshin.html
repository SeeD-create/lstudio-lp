<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>戊辰戦争 ── 1868年・鳥羽伏見から五稜郭まで｜中2歴史 第18章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bs-safe { inset: 84px 150px 84px; align-content: center; gap: 28px; }
  .bs-head { display:grid; gap:12px; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 24px 36px;
         box-shadow: 0 14px 32px rgba(40,30,10,.10); font-size: 38px; line-height: 1.6; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 40px; min-width: 240px; }
  .def .yt { font-family:'Zen Old Mincho',serif; color:var(--sumi-mute); font-size:28px; }
  .def .em { color: var(--imp); font-weight:900; }
  .battle { display:grid; grid-template-columns: 1fr 70px 1fr; align-items:center; gap: 14px; }
  .bc { background: var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:22px 30px; display:grid; gap:6px; text-align:center; box-shadow:0 12px 26px rgba(40,30,10,.10); }
  .bc .bl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--cat); }
  .bc .bn { font-size:38px; font-weight:900; color:var(--sumi); }
  .bc .bp { font-size:25px; color:var(--sumi-mute); font-weight:700; }
  .barw { text-align:center; font-size:44px; color:var(--sumi-mute); font-weight:900; }
  .vs { display:flex; align-items:center; justify-content:center; gap:26px; }
  .vs .side { background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:30px; border-radius:14px; padding:14px 30px; }
  .vs .vx { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--imp); }
  .bs-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 32px; }
  .bs-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .bs-note .bb { font-size:25px; line-height:1.4; color:rgba(251,251,250,.92); }
  .bs-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe bs-safe">
    <div class="bs-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>授業ノート2　滅亡</span>
      <h1 class="headline" style="font-size:52px;">最後の内戦 ── <span class="em">1868年からの1年半</span></h1>
    </div>
    <div class="def" data-at="1" data-anim="fade">
      <span class="yt">1868年</span>　<span class="blank" data-fill="2"><b>戊辰戦争</b></span>…新政府軍と、それに反対する旧幕府軍との戦争。
    </div>
    <div class="battle" data-at="3" data-anim="pop">
      <div class="bc"><div class="bl">始まり（1868）</div><div class="bn">鳥羽・伏見の戦い</div><div class="bp">京都</div></div>
      <div class="barw">→</div>
      <div class="bc"><div class="bl">終わり（1869）</div><div class="bn">五稜郭の戦い</div><div class="bp">函館</div></div>
    </div>
    <div class="vs" data-at="4" data-anim="fade">
      <span class="side">新政府軍（薩摩・長州など）</span><span class="vx">VS</span><span class="side">旧幕府軍</span>
    </div>
    <div class="bs-note" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出</span>
      <span class="bb">戦いは<b>鳥羽伏見（京都）</b>で始まり<b>五稜郭（函館）</b>で終わる。新政府軍が勝ち、<b>江戸幕府は滅亡</b>した。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
