<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sd-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 620px; align-content: center; gap: 58px; align-items: center; }

  .sd-fig { height: 600px; border-radius: 28px; }

  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 38px;

  .def .yt { font-family:'Zen Old Mincho',serif; color:var(--sumi-mute); font-size:28px; }
  .def .em { color: var(--imp); font-weight:900; }
  .facts { display:flex; gap:16px; flex-wrap:wrap; }
  .fact { background: var(--cat-bg); color: var(--cat); font-weight:900; font-size:27px; border-radius:12px; padding:12px 22px; }
  .sd-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .sd-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .sd-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .sd-note .bb b { color:#fff; }
</style>
