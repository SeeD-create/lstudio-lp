<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fb-safe { inset: 90px 150px 90px; grid-template-columns: 560px 1fr; align-content: center; gap: 56px; align-items: center; }
  .fb-fig { height: 560px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:20px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:240px; line-height:1; color:var(--cat); opacity:.14; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:27px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; text-align:center; line-height:1.5; }
  .fb-list { display:grid; gap: 30px; }
  .fb-head { display:grid; gap:10px; }
  .uc { background: var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:26px 34px; display:grid; gap:10px;
        box-shadow:0 14px 32px rgba(40,30,10,.10); }
  .uc .un { font-size:44px; font-weight:900; color:var(--sumi); }
  .uc .un .blank { font-size:44px; min-width:340px; }
  .uc .ud { font-size:29px; color:var(--sumi-soft); line-height:1.5; font-weight:600; }
  .uc .ud b { color: var(--imp); }
  .uc .bad { display:inline-block; margin-top:4px; background:var(--imp); color:#fff; font-weight:900; font-size:22px; border-radius:10px; padding:6px 16px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fb-safe">
    <div class="figure fb-fig" data-at="0" data-anim="left"><img src="assets/tenbin_fubyodo.webp" alt="傾く天秤 ── 日本に不平等な条約"></div>
    <div class="fb-list">
      <div class="fb-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>授業ノート1　開国</span>
        <h1 class="headline" style="font-size:50px;">2つの点で <span class="em">不平等</span></h1>
      </div>
      <div class="uc" data-at="1" data-anim="pop">
        <div class="un"><span class="blank" data-fill="2"><span class="bnum">⑬</span><b>領事裁判権</b></span> を認める</div>
        <div class="ud">日本で罪を犯した外国人を、<b>その国の人が裁く</b>権利。日本の法律で裁けない。<span class="bad">日本に不利</span></div>
      </div>
      <div class="uc" data-at="3" data-anim="pop">
        <div class="un"><span class="blank" data-fill="4"><span class="bnum">⑭</span><b>関税自主権</b></span> がない</div>
        <div class="ud">輸入品に<b>関税をかける権利がない</b>。安い外国製品が自由に入ってくる。<span class="bad">日本に不利</span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
