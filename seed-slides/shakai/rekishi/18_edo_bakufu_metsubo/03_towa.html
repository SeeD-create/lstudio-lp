  .fb { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 26px 30px; display: grid; gap: 10px; box-shadow: 0 12px 28px rgba(40,30,10,.10); }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tw-safe">
    <div class="tw-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　江戸幕府の滅亡とは</span>
      <h1 class="headline" style="font-size:62px;">黒船が来て、幕府は<span class="em">15年</span>でたおれた</h1>
    </div>
    <p class="tw-def" data-at="1">1853年、ペリーの<span class="em">黒船</span>が来航して幕府は開国。だが不平等な条約が経済を混乱させ、「外国を打ち払え」という<span class="em">攘夷</span>の声が高まる。やがて薩摩・長州が手を結び、<span class="em">倒幕</span>へ。将軍が政権を天皇に返して幕府は滅んだ。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">開国</div><div class="ds">ペリー来航 →<b>和親条約</b>で鎖国終了 →<b>修好通商条約</b>で貿易開始（不平等）。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">攘夷・ゆらぎ</div><div class="ds"><b>尊皇攘夷</b>運動が拡大。安政の大獄・桜田門外の変で幕府がゆらぐ。</div></div>
      <div class="arrow" data-at="4">→</div>
      <div class="fb" data-at="4" data-anim="pop"><div class="ttl">倒幕・滅亡</div><div class="ds"><b>薩長同盟</b>→<b>大政奉還</b>→<b>戊辰戦争</b>で新政府が勝ち、幕府は滅亡。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
