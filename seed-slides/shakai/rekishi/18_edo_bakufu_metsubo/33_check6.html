<title>ミニ確認 ── 倒幕から幕府の滅亡まで｜中2歴史 第18章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1480px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:45px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 40px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .ans { margin-top: 30px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 33px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av small { color: var(--sumi); font-weight:600; font-size:25px; }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 倒幕から幕府の滅亡まで</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の4つに答えよう</div>
      <p class="qtext">① 薩摩と長州が結んだ同盟の仲立ちをした人物は？<br>② 1867年、将軍が政権を天皇に返したことは？　③ ②を行った15代将軍は？　④ 1868年に始まった内戦は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">坂本龍馬</span>　<small>── 土佐藩出身。薩長同盟を仲立ち。</small></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">大政奉還</span></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">徳川慶喜</span>　<small>── その後、王政復古の大号令。</small></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">戊辰戦争</span>　<small>── 鳥羽伏見〜五稜郭。幕府滅亡。</small></b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
