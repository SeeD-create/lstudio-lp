<!DOCTYPE html>

<head>

<title>開いた5つの港 ── 函館・新潟・神奈川・兵庫・長崎｜中2歴史 第18章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fp-safe { inset: 96px 130px 96px; align-content: center; gap: 40px; }
  .fp-head { display:grid; gap:12px; justify-items:center; text-align:center; }
  .fp-row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
  .pc { position:relative; background: var(--paper-hi); border-radius:20px; border:3px solid var(--cat);
        box-shadow:0 14px 30px rgba(40,30,10,.12); padding:30px 20px 34px; min-height:330px; display:grid; align-content:start; gap:14px; text-align:center; }
  .pc::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:17px 17px 0 0; }
  .pc .pin { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--cat); opacity:.4; }
  .pc .pn { font-size:44px; font-weight:900; color:var(--sumi); line-height:1.1; }
  .pc .pn .blank { font-size:44px; }
  .pc .pl { font-size:24px; color:var(--sumi-mute); font-weight:700; margin-top:auto; }
  .fp-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 40px; }
  .fp-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .fp-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .fp-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fp-safe">
    <div class="fp-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>授業ノート1　開国</span>
      <h1 class="headline" style="font-size:56px;">修好通商条約で開いた<span class="em">5つの港</span></h1>
    </div>
    <div class="fp-row">
      <div class="pc" data-at="1" data-anim="pop"><div class="pin">港</div><div class="pn"><span class="blank" data-fill="1"><b>函館</b></span></div><div class="pl">北海道</div></div>
      <div class="pc" data-at="2" data-anim="pop"><div class="pin">港</div><div class="pn"><span class="blank" data-fill="2"><b>新潟</b></span></div><div class="pl">日本海側・本州</div></div>
      <div class="pc" data-at="3" data-anim="pop"><div class="pin">港</div><div class="pn"><span class="blank" data-fill="3"><b>神奈川</b></span></div><div class="pl">横浜のある県</div></div>
      <div class="pc" data-at="4" data-anim="pop"><div class="pin">港</div><div class="pn"><span class="blank" data-fill="4"><b>兵庫</b></span></div><div class="pl">神戸のある県</div></div>
      <div class="pc" data-at="5" data-anim="pop"><div class="pin">港</div><div class="pn"><span class="blank" data-fill="5"><b>長崎</b></span></div><div class="pl">九州・鎖国時代からの窓口</div></div>
    </div>
    <div class="fp-note" data-at="6" data-anim="fade">
      <span class="bt">おぼえ方</span>
      <span class="bb">頭文字で「<b>は・に・か・ひょう・なが</b>」と唱えて5つを順に思い出す。和親条約で開いた静岡の港は閉じられ、横浜が中心の貿易港になった。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
