<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>貿易の始まりと経済の混乱 ── 生糸・綿織物・金貨の流出｜中2歴史 第18章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bo-safe { inset: 84px 150px 84px; align-content: center; gap: 28px; }
  .bo-head { display:grid; gap:10px; }
  .trade { display:grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .tc { background: var(--paper-hi); border:3px solid var(--hair); border-radius:20px; padding:24px 32px; display:grid; gap:12px; box-shadow:0 12px 26px rgba(40,30,10,.08); }
  .tc .th { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; }
  .tc.out .th { color:#1f6f4e; }
  .tc.in  .th { color:#2a5d8f; }
  .tc .goods { font-size:34px; font-weight:900; color:var(--sumi); }
  .tc .eff { font-size:26px; color:var(--sumi-soft); line-height:1.4; font-weight:600; }
  .tc .eff b { color: var(--imp); }
  .gold { display:flex; align-items:center; gap:26px; background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:24px 38px; box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .gold .gn { font-size:40px; font-weight:900; color:var(--sumi); }
  .gold .gn .blank { font-size:40px; min-width:200px; }
  .gold .gd { font-size:28px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .gold .gd b { color: var(--imp); }
  .bo-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 34px; }
  .bo-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .bo-note .bb { font-size:26px; line-height:1.4; color:rgba(251,251,250,.92); }
  .bo-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe bo-safe">
    <div class="bo-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>授業ノート1　開国</span>
      <h1 class="headline" style="font-size:52px;">貿易が始まり、<span class="em">経済が混乱</span>する</h1>
    </div>
    <div class="trade">
      <div class="tc out" data-at="1" data-anim="pop"><div class="th">輸出（日本→外国）</div><div class="goods">生糸・茶 など</div><div class="eff">国内の<b>生糸が不足</b>し、<b>絹織物</b>の業者が困る。</div></div>
      <div class="tc in" data-at="2" data-anim="pop"><div class="th">輸入（外国→日本）</div><div class="goods">綿織物 など</div><div class="eff">安い綿織物が入り、国内の<b>綿織物が売れなくなる</b>。</div></div>
    </div>
    <div class="gold" data-at="3" data-anim="fade">
      <span class="gn"><span class="blank" data-fill="4"><span class="bnum">⑮</span><b>金貨</b></span> が海外に流出</span>
      <span class="gd">→ 幕府は<b>貨幣の質を落とす</b> → <b>物価が上がる</b>（人々の生活が苦しくなる）。</span>
    </div>
    <div class="bo-note" data-at="5" data-anim="fade">
      <span class="bt">★ テスト頻出</span>
      <span class="bb">貿易の中心は<b>生糸の輸出・綿織物の輸入</b>。<b>金の海外流出→物価上昇</b>が、幕府への不満（攘夷）に火をつけた。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
