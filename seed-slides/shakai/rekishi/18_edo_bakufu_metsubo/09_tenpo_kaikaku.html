<title>天保の改革 ── 1841年・老中 水野忠邦｜中2歴史 第18章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 90px 160px 90px; align-content: center; gap: 30px; }
  .kk-head { display: grid; gap: 12px; }
  .def { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px; padding: 26px 38px;
         box-shadow: 0 14px 32px rgba(40,30,10,.10); font-size: 40px; line-height: 1.6; color: var(--sumi); font-weight:700; }
  .def .blank { font-size: 42px; min-width: 260px; }
  .def .yt { font-family:'Zen Old Mincho',serif; color:var(--sumi-mute); font-size:30px; }
  .def .em { color: var(--imp); font-weight:900; }
  .pol { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .pc { background: var(--paper-hi); border:3px solid var(--hair); border-top:10px solid var(--cat); border-radius:18px;
        padding:24px 28px; display:grid; gap:12px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .pc .ph { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); }
  .pc .pd { font-size:28px; color:var(--sumi); line-height:1.45; font-weight:700; }
  .pc .pd b { color: var(--imp); }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>授業ノート1　開国</span>
      <h1 class="headline" style="font-size:56px;">1841年、老中が<span class="em">立て直しをはかる</span></h1>
    </div>
    <div class="def" data-at="1" data-anim="fade">
      <span class="yt">1841年</span>　<span class="blank" data-fill="2"><span class="bnum">③</span><b>天保の改革</b></span>…老中の <span class="blank" data-fill="2"><span class="bnum">④</span><b>水野忠邦</b></span> がおこなう。（→失敗に終わる）
    </div>
    <div class="pol">
      <div class="pc" data-at="3" data-anim="pop"><div class="ph">物価を下げる</div><div class="pd"><b>株仲間を解散</b>させる。<br>（独占をなくし物価を下げるねらい）</div></div>
      <div class="pc" data-at="4" data-anim="pop"><div class="ph">農村を立て直す</div><div class="pd">都市に出てきていた<b>農民を農村へ帰す</b>。</div></div>
      <div class="pc" data-at="5" data-anim="pop"><div class="ph">財政を立て直す</div><div class="pd">江戸や大坂の近くの土地を、幕府の<b>直轄地</b>にしようとする。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第18章 江戸幕府の滅亡</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
