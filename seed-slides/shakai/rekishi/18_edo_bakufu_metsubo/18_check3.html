<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 修好通商条約と貿易</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の4つに答えよう</div>
      <p class="qtext">① 1858年に大老 井伊直弼が結んだ条約は？<br>② 罪を犯した外国人をその国が裁く権利は？　③ 関税をかける権利がないことは？　④ 最大の輸出品は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">日米修好通商条約</span>　<small>── 相手はアメリカ総領事ハリス。5港開港。</small></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">領事裁判権（治外法権）</span>を認めた</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">関税自主権</span>がない　<small>── どちらも日本に不平等。</small></b></span></span></div>
        <div class="row" data-at="2"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">生糸</span>　<small>── 輸出で国内が不足。輸入品は綿織物。金貨も流出。</small></b></span></span></div>
      </div>
    </div>
  </div>
