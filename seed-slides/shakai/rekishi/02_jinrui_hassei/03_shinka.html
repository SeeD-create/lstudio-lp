<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>人類は猿の祖先から進化した ── アフリカで生まれた｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 660px; align-content: center; gap: 70px; align-items: center; }
  .sk-txt { display: grid; gap: 30px; }
  .sk-fig { height: 640px; border-radius: 30px; }
  .pt { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 24px;
        background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
        padding: 22px 32px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .pt .no { width:62px;height:62px;border-radius:50%;background:var(--sumi);color:#fff;
            font-family:'Zen Old Mincho',serif;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center; }
  .pt .tx { font-size: 33px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .pt .tx small { display:block; font-size:25px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .pt .tx .em { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sk-safe">
    <div class="sk-txt">
      <div data-at="0">
        <span class="kicker"><span class="num">02</span>　人類のはじまり</span>
        <h1 class="headline" style="font-size:60px;margin-top:16px;">人類は、いつ・どこで<br><span class="em">生まれた</span>のか</h1>
      </div>
      <div class="pt" data-at="1" data-anim="left"><div class="no">1</div>
        <div class="tx">人類は<span class="blank" data-fill="1"><b>猿の祖先</b></span>から進化したと考えられている<small>いきなり今の姿で現れたわけではない</small></div></div>
      <div class="pt" data-at="2" data-anim="left"><div class="no">2</div>
        <div class="tx">最初の人類は<span class="blank" data-fill="2"><b>アフリカ</b></span>で生まれた<small>約700万年前の地層から発見されている</small></div></div>
      <div class="pt" data-at="3" data-anim="left"><div class="no">3</div>
        <div class="tx">やがて<span class="blank" data-fill="3"><b>世界中</b></span>へ広がっていった<small>猿人 → 原人 → 新人と進化しながら</small></div></div>
    </div>
    <div class="figure sk-fig" data-at="0" data-anim="right"><img src="assets/hero_shinka.webp" alt="人類の進化"></div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
