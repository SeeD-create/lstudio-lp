<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>確認問題まるごと ── 8問チェック｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rc-safe { inset: 84px 130px 84px; align-content: center; gap: 26px; justify-items: center; }
  .rc-head { display:grid; gap:6px; justify-items:center; text-align:center; }
  .rc-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px 40px; width: 1620px; }
  .qr { display:grid; grid-template-columns: 48px 1fr auto; align-items:center; gap:16px; background:var(--paper-hi); border-left:8px solid var(--cat); border-radius:0 14px 14px 0; padding:16px 24px; box-shadow:0 6px 16px rgba(40,30,10,.06); }
  .qr .no { width:48px; height:48px; border-radius:50%; background:var(--sumi); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; display:flex; align-items:center; justify-content:center; }
  .qr .q { font-size:24px; font-weight:700; color:var(--sumi); line-height:1.3; }
  .qr .blank { min-width: 150px; font-size: 28px; }
  .qr.wide { grid-column: 1 / -1; }
  .qr.wide .blank { min-width: 620px; font-size: 30px; }
  .rc-note { font-size:25px; color:var(--sumi-soft); font-weight:700; }
  .rc-note .imp { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe rc-safe">
    <div class="rc-head" data-at="0">
      <span class="kicker"><span class="num">確認問題</span>　まるごとチェック</span>
      <h1 class="headline" style="font-size:46px;">この8問が全部言えたら、合格</h1>
    </div>
    <div class="rc-grid">
      <div class="qr"><div class="no">①</div><div class="q">約700万年前にアフリカに現れた最古の人類</div><span class="blank" data-fill="1"><b>猿人</b></span></div>
      <div class="qr"><div class="no">②</div><div class="q">約240万年前に現れた人類</div><span class="blank" data-fill="1"><b>原人</b></span></div>
      <div class="qr"><div class="no">③</div><div class="q">約20万年前に現れた、直接の祖先</div><span class="blank" data-fill="2"><b>新人</b></span></div>
      <div class="qr"><div class="no">④</div><div class="q">①〜③の人類がいた時代</div><span class="blank" data-fill="2"><b>旧石器時代</b></span></div>
      <div class="qr"><div class="no">⑤</div><div class="q">④の時代に使っていた石器</div><span class="blank" data-fill="3"><b>打製石器</b></span></div>
      <div class="qr"><div class="no">⑥</div><div class="q">約1万年前から始まった時代</div><span class="blank" data-fill="3"><b>新石器時代</b></span></div>
      <div class="qr"><div class="no">⑦</div><div class="q">⑥の時代に使っていた石器</div><span class="blank" data-fill="4"><b>磨製石器</b></span></div>
      <div class="qr wide"><div class="no">⑧</div><div class="q">人類が他の動物と大きく違う点を4つ</div><span class="blank" data-fill="5"><b>直立歩行・道具・火・言葉</b></span></div>
    </div>
    <p class="rc-note" data-at="5">つまずきやすいのは <span class="imp">④⑤（旧石器・打製）</span> と <span class="imp">⑥⑦（新石器・磨製）</span> の対応。ここを最後まで混ぜない。</p>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
