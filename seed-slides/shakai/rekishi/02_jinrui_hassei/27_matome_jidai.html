<!DOCTYPE html>

<title>早見表② ── 二つの時代くらべ｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mt-safe { align-content: center; gap: 34px; justify-items: center; }
  .mt-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  table.mt { border-collapse: separate; border-spacing: 0; width: 1520px; background:var(--paper-hi); border-radius:20px; overflow:hidden; box-shadow:0 16px 36px rgba(40,30,10,.12); }
  table.mt th, table.mt td { padding: 24px 30px; text-align:center; border-bottom:2px solid var(--hair); border-right:2px solid var(--hair); }
  table.mt thead th { background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; }
  table.mt tbody th { background:var(--cat-bg); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  table.mt td { font-size:38px; color:var(--sumi); font-weight:700; }
  table.mt td .imp { color:var(--imp); font-weight:900; }
  table.mt td .blank { min-width:0; padding:0 10px 3px; margin:0 2px; }
  table.mt tr:last-child th, table.mt tr:last-child td { border-bottom:none; }
  table.mt th:last-child, table.mt td:last-child { border-right:none; }
  .mt-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 40px; width: 1520px; }
  .mt-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .mt-bar .bb { font-size:27px; line-height:1.4; color:rgba(251,251,250,.94); }
  .mt-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe mt-safe">
    <div class="mt-head" data-at="0">
      <span class="kicker"><span class="num">まとめ②</span>　二つの時代くらべ</span>
      <h1 class="headline" style="font-size:54px;">石器と暮らしで、時代を見分ける</h1>
    </div>
    <table class="mt">
      <thead><tr><th style="width:360px;">くらべる点</th><th>旧石器時代</th><th>新石器時代</th></tr></thead>
      <tbody>
        <tr><th>使った石器</th><td data-at="1"><span class="blank" data-fill="1"><b>打製</b></span>石器<br><span style="font-size:26px;color:var(--sumi-mute);font-weight:600;">打ち割って作る</span></td><td data-at="2"><span class="blank" data-fill="2"><b>磨製</b></span>石器<br><span style="font-size:26px;color:var(--sumi-mute);font-weight:600;">みがいて整える</span></td></tr>
        <tr><th>暮らし方</th><td data-at="3"><span class="blank" data-fill="3"><b>狩りと採集</b></span></td><td data-at="4"><span class="blank" data-fill="4"><b>農耕と牧畜</b></span></td></tr>
        <tr><th>始まり</th><td data-at="3">約700万年前〜</td><td data-at="4">約<span class="blank" data-fill="4"><b>1万</b></span>年前〜<br><span style="font-size:26px;color:var(--sumi-mute);font-weight:600;">温暖化がきっかけ</span></td></tr>
      </tbody>
    </table>
    <div class="mt-bar" data-at="4" data-anim="fade">
      <span class="bt">合言葉</span>
      <span class="bb"><b>打＝旧・狩り／磨＝新・農耕</b>。石器と暮らしはいつもセットで動く。入れかえ問題はこれで全部解ける。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
