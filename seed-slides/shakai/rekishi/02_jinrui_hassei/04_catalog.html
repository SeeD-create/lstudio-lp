<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>人類の発生カタログ ── 集める3枚｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 96px 150px 96px; align-content: start; gap: 44px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 34px 32px 38px; min-height: 440px; display: grid; align-content: start; gap: 18px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--cat); opacity:.35; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--sumi); line-height:1.15; margin-top:6px; }
  .cc__ess { font-size:29px; color:var(--sumi-soft); line-height:1.5; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:8px 20px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:24px; }
  .anchor { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:28px 40px; }
  .anchor .k-ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--gold-soft); white-space:nowrap; }
  .anchor .k-body { font-size:30px; line-height:1.5; color:rgba(251,251,250,.92); }
  .anchor .k-body b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　人類の発生カタログ</span>
      <h1 class="headline" style="font-size:66px;">この単元で集めるのは<span class="goldem">3枚</span></h1>
    </div>

    <div class="deck-row">
      <div class="cc" data-cat="eq"  data-at="1" data-anim="pop"><div class="cc__no">Ⅰ</div><div class="cc__ttl">三つの<br>人類</div><div class="cc__ess">猿人・原人・新人。いつ現れ、何ができるようになったか。</div><span class="cc__pill">700万・240万・20万年前</span></div>
      <div class="cc" data-cat="soc" data-at="2" data-anim="pop"><div class="cc__no">Ⅱ</div><div class="cc__ttl">二つの<br>時代</div><div class="cc__ess">旧石器時代と新石器時代。石器と暮らし方がちがう。</div><span class="cc__pill">打製 ／ 磨製</span></div>
      <div class="cc" data-cat="par" data-at="3" data-anim="pop"><div class="cc__no">Ⅲ</div><div class="cc__ttl">人類の<br>特色</div><div class="cc__ess">他の動物と大きく違う4つの点。人が生き残れた理由。</div><span class="cc__pill">直立・道具・火・言葉</span></div>
    </div>

    <div class="anchor" data-at="4" data-anim="fade">
      <span class="k-ttl">この単元の背骨</span>
      <span class="k-body">主役は<b>4つの年号</b>と<b>2つの石器</b>だ。<b>猿人→原人→新人</b>の順と、<b>打製（旧石器）／磨製（新石器）</b>のセット。まずここを体に入れる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
