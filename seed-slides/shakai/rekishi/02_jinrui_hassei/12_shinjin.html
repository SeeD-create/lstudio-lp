<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>新人 ── 約20万年前、私たちの直接の祖先｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ft-safe { align-content: center; gap: 40px; }
  .ft-head { display:grid; gap:10px; }
  .headrow { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .ft-quote { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 34px 44px;
              box-shadow: 0 16px 36px rgba(40,30,10,.10); font-family:'Zen Old Mincho',serif; font-weight:700;
              font-size: 40px; line-height: 1.9; color: var(--sumi); }
  .ft-quote .em { color: var(--imp); font-weight:900; }
  .ft-quote .blank { font-size: 42px; min-width: 200px; }
  .qlab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--cat); letter-spacing:.12em; display:block; margin-bottom:14px; }
  .ft-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .ft-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .ft-note .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.92); }
  .ft-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ft-safe">
    <div class="ft-head" data-at="0">
      <div class="headrow">
        <span class="cat-badge"><span class="dot"></span>三つの人類 ③</span>
        <span class="tag tag--article">約20万年前</span>
      </div>
      <h1 class="headline" style="font-size:56px;margin-top:8px;">私たちの<span class="em">直接の祖先</span>は、なんと呼ぶ？</h1>
    </div>
    <div class="ft-quote" data-at="1" data-anim="fade">
      <span class="qlab">授業ノート1</span>
      現在の人類の<span class="em">直接の祖先</span>といわれる
      <span class="blank" data-fill="2"><span class="bnum">⑧</span><b>新人</b></span>
      （ホモ・サピエンス）が現れる。
    </div>
    <div class="ft-note" data-at="3" data-anim="fade">
      <span class="bt">整理</span>
      <span class="bb">答え＝<b>ホモ・サピエンス</b>＝今の私たちの<b>直接の祖先</b>。この言いかえ3つはワンセット。三段階の<b>最後</b>にくるのがこれ。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
