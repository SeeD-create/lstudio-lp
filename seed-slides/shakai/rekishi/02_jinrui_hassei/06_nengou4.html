<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>覚える年号は4つ ── 700万・240万・20万・1万年前｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ng-safe { align-content: center; gap: 46px; justify-items: center; }
  .ng-head { display:grid; gap:12px; justify-items:center; text-align:center; }
  .ng-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; width: 1560px; }
  .ncard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
           box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 30px 24px 34px; display:grid; gap:14px; justify-items:center; text-align:center; min-height: 330px; align-content:start; }
  .ncard::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:19px 19px 0 0; }
  .ncard .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); line-height:1.1; }
  .ncard .yr .num { font-size:58px; color:var(--imp); }
  .ncard .lb { font-size:26px; color:var(--sumi-mute); font-weight:700; letter-spacing:.05em; }
  .ncard .who { margin-top:6px; }
  .ncard .blank { min-width: 190px; font-size: 40px; }
  .ng-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 40px; width: 1560px; }
  .ng-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .ng-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .ng-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ng-safe">
    <div class="ng-head" data-at="0">
      <span class="kicker"><span class="num">04</span>　年号の背骨</span>
      <h1 class="headline" style="font-size:60px;">覚える年号は、たった<span class="em">4つ</span></h1>
    </div>
    <div class="ng-row">
      <div class="ncard" data-at="0" data-anim="pop">
        <div class="yr">約<span class="num">700</span>万年前</div>
        <div class="lb">最古の人類</div>
        <div class="who"><span class="blank" data-fill="1"><span class="bnum">①</span><b>猿人</b></span></div>
      </div>
      <div class="ncard" data-at="0" data-anim="pop">
        <div class="yr">約<span class="num">240</span>万年前</div>
        <div class="lb">火・言葉を使う</div>
        <div class="who"><span class="blank" data-fill="2"><span class="bnum">②</span><b>原人</b></span></div>
      </div>
      <div class="ncard" data-at="0" data-anim="pop">
        <div class="yr">約<span class="num">20</span>万年前</div>
        <div class="lb">直接の祖先</div>
        <div class="who"><span class="blank" data-fill="3"><span class="bnum">③</span><b>新人</b></span></div>
      </div>
      <div class="ncard" data-at="0" data-anim="pop">
        <div class="yr">約<span class="num">1</span>万年前</div>
        <div class="lb">温暖化・農耕へ</div>
        <div class="who"><span class="blank" data-fill="4"><span class="bnum">④</span><b>新石器時代</b></span></div>
      </div>
    </div>
    <div class="ng-bar" data-at="4" data-anim="fade">
      <span class="bt">語呂の順に</span>
      <span class="bb"><b>700万 → 240万 → 20万 → 1万</b>。数がどんどん小さくなる＝現代に近づく。人類は<b>左から順に</b>進化していった。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
