<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>早見表① ── 三つの人類｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mt-safe { align-content: center; gap: 36px; justify-items: center; }
  .mt-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  table.mt { border-collapse: separate; border-spacing: 0; width: 1560px; background:var(--paper-hi); border-radius:20px; overflow:hidden; box-shadow:0 16px 36px rgba(40,30,10,.12); }
  table.mt th, table.mt td { padding: 22px 28px; text-align:center; border-bottom:2px solid var(--hair); border-right:2px solid var(--hair); }
  table.mt thead th { background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; }
  table.mt tbody th { background:var(--cat-bg); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  table.mt td { font-size:30px; color:var(--sumi-soft); font-weight:600; line-height:1.35; }
  table.mt td .imp { color:var(--imp); font-weight:900; }
  table.mt td .blank { min-width:0; padding:0 10px 3px; margin:0 2px; }
  table.mt tr:last-child th, table.mt tr:last-child td { border-bottom:none; }
  table.mt th:last-child, table.mt td:last-child { border-right:none; }
  .mt-note { font-size:28px; color:var(--sumi-soft); font-weight:700; }
  .mt-note .imp { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe mt-safe">
    <div class="mt-head" data-at="0">
      <span class="kicker"><span class="num">まとめ①</span>　三つの人類</span>
      <h1 class="headline" style="font-size:54px;">古い順に、できることが増えていく</h1>
    </div>
    <table class="mt">
      <thead><tr><th style="width:280px;">人類</th><th style="width:300px;">現れた年代</th><th>できごと・特徴</th></tr></thead>
      <tbody>
        <tr data-at="1"><th>猿人</th><td>約<span class="blank" data-fill="1"><b>700万</b></span>年前</td><td><span class="blank" data-fill="1"><b>最古の人類</b></span>／アフリカ／直立して歩き道具を使う</td></tr>
        <tr data-at="2"><th>原人</th><td>約<span class="blank" data-fill="2"><b>240万</b></span>年前</td><td><span class="blank" data-fill="2"><b>火・言葉</b></span>を使う／ユーラシア大陸へ移住</td></tr>
        <tr data-at="3"><th>新人</th><td>約<span class="blank" data-fill="3"><b>20万</b></span>年前</td><td>直接の祖先＝<span class="blank" data-fill="3"><b>ホモ・サピエンス</b></span>／クロマニヨン人・ラスコー壁画</td></tr>
      </tbody>
    </table>
    <p class="mt-note" data-at="3">並べかえは <span class="imp">猿人 → 原人 → 新人</span>。3つの年代がすらすら言えれば全部つながる。</p>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
