<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>分類ドリル ── 旧石器（A）か新石器（B）か｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .dr-safe { align-content: center; gap: 30px; justify-items: center; }
  .dr-head { display:grid; gap:8px; justify-items:center; text-align:center; }
  .dr-legend { display:flex; gap:34px; font-size:27px; font-weight:800; color:var(--sumi-soft); }
  .dr-legend b { color: var(--imp); }
  .dr-grid { display:grid; grid-template-columns: repeat(3, 490px); gap: 20px; }
  .dc { position:relative; background:var(--paper-hi); border:3px solid var(--hair); border-radius:16px; padding:20px 24px; display:grid; grid-template-columns: 54px 1fr 96px; align-items:center; gap:18px; box-shadow:0 8px 20px rgba(40,30,10,.07); min-height:96px; }
  .dc .no { width:54px; height:54px; border-radius:50%; background:var(--sumi); color:#fff; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; display:flex; align-items:center; justify-content:center; }
  .dc .it { font-size:29px; font-weight:800; color:var(--sumi); line-height:1.25; }
  .dc .badge { justify-self:end; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--imp); width:96px; text-align:center; opacity:0; transition:opacity .4s, transform .4s; transform:scale(.5); }
  .dc .badge small { display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:17px; color:var(--sumi-mute); font-weight:700; }
  .dc.hit .badge { opacity:1; transform:scale(1); }
  .dc .badge.blank { min-width:0; width:96px; padding:0 0 4px; margin:0; justify-content:center; }
  .dc.hit { border-color:var(--imp); }
  .dr-bar { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:17px 33px; width: 1518px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .dr-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color: var(--imp); white-space:nowrap; }
  .dr-bar .bb { font-size:26px; line-height:1.4; color: var(--sumi); }
  .dr-bar .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe dr-safe">
    <div class="dr-head" data-at="0">
      <span class="kicker"><span class="num">練習問題</span>　分類ドリル</span>
      <h1 class="headline" style="font-size:48px;">旧石器時代なら<span class="em">A</span>、新石器時代なら<span class="em">B</span></h1>
    </div>
    <div class="dr-legend" data-at="0"><span><b>A</b>＝旧石器時代（打製・狩りと採集）</span><span><b>B</b>＝新石器時代（磨製・農耕と牧畜）</span></div>
    <div class="dr-grid">
      <div class="dc" id="q1"><div class="no">①</div><div class="it">狩りや採集の生活</div><div class="badge blank" data-fill="1"><b>A</b></div></div>
      <div class="dc" id="q2"><div class="no">②</div><div class="it">磨製石器</div><div class="badge blank" data-fill="1"><b>B</b></div></div>
      <div class="dc" id="q3"><div class="no">③</div><div class="it">約1万年前に始まった</div><div class="badge blank" data-fill="1"><b>B</b></div></div>
      <div class="dc" id="q4"><div class="no">④</div><div class="it">原人</div><div class="badge blank" data-fill="2"><b>A</b></div></div>
      <div class="dc" id="q5"><div class="no">⑤</div><div class="it">農耕と牧畜の生活</div><div class="badge blank" data-fill="2"><b>B</b></div></div>
      <div class="dc" id="q6"><div class="no">⑥</div><div class="it">ラスコー洞くつの壁画</div><div class="badge blank" data-fill="2"><b>A</b></div></div>
      <div class="dc" id="q7"><div class="no">⑦</div><div class="it">打製石器</div><div class="badge blank" data-fill="3"><b>A</b></div></div>
      <div class="dc" id="q8"><div class="no">⑧</div><div class="it">新人</div><div class="badge blank" data-fill="3"><b>A</b></div></div>
      <div class="dc" id="q9"><div class="no">⑨</div><div class="it">猿人</div><div class="badge blank" data-fill="3"><b>A</b></div></div>
    </div>
    <div class="dr-bar" data-at="5" data-anim="fade">
      <span class="bt">見分けのコツ</span>
      <span class="bb blank blank--para" data-fill="5"><b>迷ったら「<span class="hl">約1万年前より後か</span>」。<span class="hl">B は ②磨製・③1万年前・⑤農耕牧畜の3つだけ</span>、あとは全部 <span class="hl">A</span>。クロマニヨン人（⑥新人）も旧石器だから注意。</b></span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>
SeedDeck.init(6, function(step){
  var reveal = { 1:['q1','q2','q3'], 2:['q4','q5','q6'], 3:['q7','q8','q9'] };
  document.querySelectorAll('.dc').forEach(function(el){ el.classList.remove('hit'); });
  for (var s=1; s<=step; s++){
    (reveal[s]||[]).forEach(function(id){ var e=document.getElementById(id); if(e) e.classList.add('hit'); });
  }
});
</script>
</body>
</html>
