<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>猿人 ── 約700万年前、最古の人類｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hh-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 560px; align-content: center; gap: 60px; align-items: center; }
  .hh-txt { display: grid; gap: 26px; }
  .hh-fig { height: 620px; border-radius: 28px; }
  .headrow { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .quote { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 40px;
           box-shadow: 0 16px 36px rgba(40,30,10,.10); font-family:'Zen Old Mincho',serif; font-weight:700;
           font-size: 37px; line-height: 1.9; color: var(--sumi); }
  .quote .em { color: var(--imp); font-weight: 900; }
  .quote .blank { font-size: 40px; min-width: 190px; }
  .qlab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--cat); letter-spacing:.12em; display:block; margin-bottom:12px; }
  .hh-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .hh-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .hh-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hh-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hh-safe">
    <div class="hh-txt">
      <div class="headrow" data-at="0">
        <span class="cat-badge"><span class="dot"></span>三つの人類 ①</span>
        <span class="tag tag--article">約700万年前</span>
      </div>
      <h1 class="headline" data-at="0" style="font-size:60px;">最古の人類は、なんと呼ぶ？</h1>
      <div class="quote" data-at="1" data-anim="fade">
        <span class="qlab">授業ノート1</span>
        アフリカに、サヘラントロプス・チャデンシスといわれる
        <span class="blank" data-fill="2"><span class="bnum">①</span><b>猿人</b></span>
        が現れる。
      </div>
      <div class="hh-note" data-at="3" data-anim="fade">
        <span class="bt">ここが要</span>
        <span class="bb">「サヘラントロプス・チャデンシス」がその一種。約<b>700万年前</b>・<b>アフリカ</b>・<b>最古の人類</b>の3点セットで覚える。</span>
      </div>
    </div>
    <div class="figure hh-fig" data-at="0" data-anim="right"><img src="assets/enjin.webp" alt="猿人"></div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
