<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 他の動物と大きく違う4点｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 14px; }
  .arow { margin-top: 34px; display:flex; justify-content:center; gap:20px; }
  .ab { background: var(--paper-hi); color: var(--sumi); border-radius: 16px; padding: 22px 30px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; }
  .arow .blank { min-width:160px; }
  .exp { margin-top: 30px; font-size: 31px; line-height: 1.5; color: var(--sumi); text-align:center; }
  .exp b { color: var(--imp); }
</style>
<style data-swrepair>
.qtext span{color:var(--sumi) !important;}</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 4つ答えよ</div>
      <p class="qtext">人類が他の動物と大きく違う点を<span style="color:var(--gold-soft);">4つ</span>すべて答えよう。</p>
      <div class="arow">
        <span class="ab blank" data-at="1" data-fill="1" data-anim="pop"><b>直立歩行</b></span>
        <span class="ab blank" data-at="1" data-fill="1" data-anim="pop"><b>道具</b></span>
        <span class="ab blank" data-at="2" data-fill="2" data-anim="pop"><b>火</b></span>
        <span class="ab blank" data-at="2" data-fill="2" data-anim="pop"><b>言葉</b></span>
      </div>
      <p class="exp blank blank--para" data-at="3" data-fill="3"><b>〈<span class="hl">立・具・火・言</span>〉で確認。1つでも抜けたら不正解になりやすい。<br>「両手が自由 → 道具 → 火・言葉」と流れで思い出そう。</b></p>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
