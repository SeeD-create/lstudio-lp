<link rel="stylesheet" href="../../../_shared/deck.css">

<div class="seed-stage"><div class="seed-slide" data-cat="eq">

      <div class="quote" data-at="1" data-anim="fade">

        彼らは<span class="blank" data-fill="2"><span class="bnum">⑥</span><b>火</b></span>を使い、
        <span class="blank" data-fill="3"><span class="bnum">⑦</span><b>言葉</b></span>もかなり話していたと考えられている。
      </div>
      <div class="hh-note" data-at="4" data-anim="fade">
        <span class="bt">猿人との差</span>
        <span class="bb">猿人になかった新兵器は<b>火</b>と<b>ことば</b>。火で寒さをしのぎ、ことばで仲間と協力できた。だから<b>世界へ広がれた</b>。</span>
      </div>
    </div>
    <div class="figure hh-fig" data-at="0" data-anim="right"><img src="assets/genjin.webp" alt="原人"></div>
  </div>
