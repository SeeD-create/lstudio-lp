<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>三段階の大年表 ── 猿人・原人・新人｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tl-safe { align-content: center; gap: 40px; }
  .tl-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .tl { position: relative; margin: 20px 40px 0; }
  .tl-line { position:absolute; left:0; right:0; top:64px; height:8px; background:linear-gradient(90deg,var(--sumi),var(--sumi-mute)); border-radius:4px; }
  .tl-row { display:grid; grid-template-columns: repeat(3,1fr); gap:60px; position:relative; }
  .tl-item { display:grid; justify-items:center; gap:0; }
  .tl-yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--imp); }
  .tl-dot { width:34px; height:34px; border-radius:50%; background:var(--sumi); border:6px solid var(--paper); margin:14px 0; box-shadow:0 0 0 4px var(--sumi); }
  .tl-card { background:var(--paper-hi); border:3px solid var(--cat); border-radius:20px; box-shadow:0 14px 30px rgba(40,30,10,.10); padding:26px 30px; width:100%; display:grid; gap:10px; justify-items:center; text-align:center; }
  .tl-card .who { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); }
  .tl-card .who .blank { min-width:150px; }
  .tl-card .desc .blank { min-width:0; padding:0 10px 3px; margin:0 2px; }
  .tl-card .desc { font-size:27px; color:var(--sumi-soft); font-weight:600; line-height:1.4; }
  .tl-card .desc .imp { color: var(--imp); }
  .tl-tag { margin-top:6px; padding:6px 18px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:22px; }
  .tl-foot { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 36px; margin: 4px 40px 0; }
  .tl-foot .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .tl-foot .bb { font-size:27px; line-height:1.4; color:rgba(251,251,250,.94); }
  .tl-foot .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe tl-safe">
    <div class="tl-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ</span>　三段階の大年表</span>
      <h1 class="headline" style="font-size:56px;">人類は <span class="em">三段階</span> で進化した</h1>
    </div>
    <div class="tl">
      <div class="tl-line"></div>
      <div class="tl-row">
        <div class="tl-item" data-at="1" data-anim="pop">
          <div class="tl-yr">約700万年前</div>
          <div class="tl-dot"></div>
          <div class="tl-card"><div class="who"><span class="blank" data-fill="1"><b>猿人</b></span></div><div class="desc"><span class="blank" data-fill="1"><b>最古の人類</b></span><br>直立して歩き、道具を使う</div><span class="tl-tag">アフリカ</span></div>
        </div>
        <div class="tl-item" data-at="2" data-anim="pop">
          <div class="tl-yr">約240万年前</div>
          <div class="tl-dot"></div>
          <div class="tl-card"><div class="who"><span class="blank" data-fill="2"><b>原人</b></span></div><div class="desc"><span class="blank" data-fill="2"><b>火・言葉</b></span>を使う<br>ユーラシア大陸へ移住</div><span class="tl-tag">世界へ広がる</span></div>
        </div>
        <div class="tl-item" data-at="3" data-anim="pop">
          <div class="tl-yr">約20万年前</div>
          <div class="tl-dot"></div>
          <div class="tl-card"><div class="who"><span class="blank" data-fill="3"><b>新人</b></span></div><div class="desc">今の人類の<span class="blank" data-fill="3"><b>直接の祖先</b></span><br>ホモ・サピエンス</div><span class="tl-tag">クロマニヨン人</span></div>
        </div>
      </div>
    </div>
    <div class="tl-foot" data-at="3" data-anim="fade">
      <span class="bt">テスト頻出</span>
      <span class="bb">「古い順に並べよ」は超定番。<b>年号が小さくなるほど新しい</b>ので、3つの名前を左から順に言えるようにしておく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
