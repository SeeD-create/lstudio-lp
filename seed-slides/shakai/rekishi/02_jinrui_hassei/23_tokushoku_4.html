<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>人類の特色 ── 直立歩行・道具・火・言葉｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tk-safe { align-content: center; gap: 40px; justify-items: center; }
  .tk-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .tk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; width: 1580px; }
  .tcard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
           box-shadow: 0 14px 32px rgba(40,30,10,.12); padding: 30px 24px 34px; display:grid; gap:16px; justify-items:center; text-align:center; min-height: 360px; align-content:start; }
  .tcard::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:19px 19px 0 0; }
  .tcard .no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); opacity:.4; }
  .tcard .blank { min-width: 200px; font-size: 42px; }
  .tcard .cap { font-size:26px; color:var(--sumi-soft); font-weight:700; line-height:1.4; }
  .tk-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 40px; width: 1580px; }
  .tk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .tk-bar .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .tk-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe tk-safe">
    <div class="tk-head" data-at="0">
      <span class="kicker"><span class="num">Ⅲ</span>　授業ノート3</span>
      <h1 class="headline" style="font-size:56px;">他の動物と大きく違う <span class="em">4つ</span> の点</h1>
    </div>
    <div class="tk-row">
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="no">①</div>
        <span class="blank" data-fill="1"><b>直立歩行</b></span>
        <div class="cap">背すじを伸ばして立つ<br>→ 両手を使えるようになった</div>
      </div>
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="no">②</div>
        <span class="blank" data-fill="2"><b>道具</b></span>
        <div class="cap">手を使って作った<br>→ 自然に働きかけられる</div>
      </div>
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="no">③</div>
        <span class="blank" data-fill="3"><b>火</b></span>
        <div class="cap">寒さをしのいだ<br>→ 夜も安全に、調理もできる</div>
      </div>
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="no">④</div>
        <span class="blank" data-fill="4"><b>言葉</b></span>
        <div class="cap">仲間たちで連絡できた<br>→ 協力して暮らせる</div>
      </div>
    </div>
    <div class="tk-bar" data-at="5" data-anim="fade">
      <span class="bt">4つまとめて</span>
      <span class="bb">この<b>4つ</b>は「4つ答えよ」でまとめて出る。頭文字で〈立・具・火・言〉と唱えると1つも落とさない。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
