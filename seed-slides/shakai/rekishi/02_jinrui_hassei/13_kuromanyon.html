<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>クロマニヨン人とラスコーの洞くつの壁画｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hh-safe { inset: 90px 150px 96px; grid-template-columns: 1fr 700px; align-content: center; gap: 60px; align-items: center; }
  .hh-txt { display: grid; gap: 26px; }
  .hh-fig { height: 620px; border-radius: 28px; }
  .quote { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 30px 40px;
           box-shadow: 0 16px 36px rgba(40,30,10,.10); font-family:'Zen Old Mincho',serif; font-weight:700;
           font-size: 34px; line-height: 1.85; color: var(--sumi); }
  .quote .em { color: var(--imp); font-weight: 900; }
  .quote .blank { font-size: 37px; min-width: 200px; }
  .qlab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--cat); letter-spacing:.12em; display:block; margin-bottom:12px; }
  .hh-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .hh-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .hh-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hh-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hh-safe">
    <div class="hh-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>三つの人類 ③ ── 新人</span>
        <h1 class="headline" style="font-size:52px;margin-top:14px;">壁画を描いた<br><span class="em">クロマニヨン人</span></h1>
      </div>
      <div class="quote" data-at="1" data-anim="fade">
        <span class="qlab">授業ノート1</span>
        ヨーロッパにいた<span class="em">クロマニヨン人</span>の描いた壁画が、フランスの
        <span class="blank" data-fill="2"><span class="bnum">⑨</span><b>ラスコー</b></span>
        の洞くつなどから発見されている。
      </div>
      <div class="hh-note" data-at="3" data-anim="fade">
        <span class="bt">頻出セット</span>
        <span class="bb">クロマニヨン人＝ヨーロッパの<b>新人</b>。壁画で有名な洞くつは<b>フランス</b>にある。人名と地名をセットで覚える。</span>
      </div>
    </div>
    <div class="figure hh-fig" data-at="0" data-anim="right"><img src="assets/cave_painting.webp" alt="ラスコーの壁画"></div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
