<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>猿人の特徴 ── 直立して歩き、道具を使う｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ft-safe { align-content: center; gap: 40px; }
  .ft-head { display:grid; gap:10px; }
  .ft-quote { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 34px 44px;
              box-shadow: 0 16px 36px rgba(40,30,10,.10); font-family:'Zen Old Mincho',serif; font-weight:700;
              font-size: 42px; line-height: 1.95; color: var(--sumi); }
  .ft-quote .blank { font-size: 44px; min-width: 200px; }
  .qlab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--cat); letter-spacing:.12em; display:block; margin-bottom:14px; }
  .ft-pills { display:flex; gap:26px; }
  .ft-pill { flex:1; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 30px; display:grid; gap:8px; }
  .ft-pill .h { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--gold-soft); }
  .ft-pill .b { font-size:27px; line-height:1.4; color:rgba(251,251,250,.92); }
  .ft-pill .b b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ft-safe">
    <div class="ft-head" data-at="0">
      <span class="kicker"><span class="num">Ⅰ①</span>　猿人の特徴</span>
      <h1 class="headline" style="font-size:56px;">猿人は、もう<span class="em">二本足</span>で立っていた</h1>
    </div>
    <div class="ft-quote" data-at="0">
      <span class="qlab">授業ノート1</span>
      彼らは<span class="blank" data-fill="1"><span class="bnum">②</span><b>直立</b></span>して歩き、
      <span class="blank" data-fill="2"><span class="bnum">③</span><b>道具</b></span>を使っていたと考えられている。<br>
      また、脳の大きさは現代人の<span class="blank" data-fill="3"><span class="bnum">④</span><b>3分の1</b></span>しかなかった。
    </div>
    <div class="ft-pills" data-at="3" data-anim="fade">
      <div class="ft-pill"><div class="h">二本足で立つ</div><div class="b">背すじを伸ばして立つ＝<b>両手が自由</b>になった。これがすべての始まり。</div></div>
      <div class="ft-pill"><div class="h">手で物を使う</div><div class="b">自由になった手で<b>物を作って</b>使う。ただし脳はまだ小さい。</div></div>
      <div class="ft-pill"><div class="h">脳はまだ小さい</div><div class="b">頭はまだ小さいが、<b>立つ・使う</b>はもう始まっていた。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
