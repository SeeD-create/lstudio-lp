<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 猿人・原人・新人を古い順に｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:49px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 46px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); }
  .order { margin-top: 36px; display:flex; align-items:center; justify-content:center; gap:20px; }
  .ob { background: var(--paper-hi); color: var(--sumi); border-radius: 16px; padding: 20px 34px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; }
  .arw { font-size: 44px; color: var(--sumi); font-weight:900; }
  .order .blank { min-width:170px; }
  .exp { margin-top: 30px; font-size: 32px; line-height: 1.5; color: var(--sumi); text-align:center; }
  .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 古い順に並べよ</div>
      <p class="qtext">人類は大きく<span class="u">3段階</span>に分けられる。現れた<span class="u">古い順</span>に、その名前を書こう。</p>
      <div class="order">
        <span class="ob blank" data-at="1" data-fill="1" data-anim="pop"><b>猿人</b></span>
        <span class="arw" data-at="2">→</span>
        <span class="ob blank" data-at="2" data-fill="2" data-anim="pop"><b>原人</b></span>
        <span class="arw" data-at="3">→</span>
        <span class="ob blank" data-at="3" data-fill="3" data-anim="pop"><b>新人</b></span>
      </div>
      <p class="exp blank blank--para" data-at="3" data-fill="3"><b>年号は <span class="hl">700万 → 240万 → 20万</span> 年前。数が小さいほど新しい。<br>だから <span class="hl">猿人 → 原人 → 新人</span>。並べかえは超定番、ここで確実に。</b></p>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
