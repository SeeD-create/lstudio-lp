<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 磨製石器はどちらの時代か｜中1歴史 §2</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 46px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 36px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size: 33px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
<style data-swrepair>
.qcard .qtext{color:var(--sumi) !important;}</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. ○か×か</div>
      <p class="qtext">みがいて形を整えた<span class="u">磨製石器</span>を使っていたのは、<br><span class="u">旧石器時代</span>である。</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-at="1" data-fill="1" data-anim="pop"><b>×</b></span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>磨製石器は<span class="hl">新石器時代</span>。<br>旧石器時代は打ち割って作った<span class="hl">打製石器</span>。<span class="hl">打＝旧／磨＝新</span>で覚える。</b></span>
      </div>
      <p class="qtext" data-at="3" style="font-size:32px;margin-top:30px;color:var(--gold-soft);">つまり ── <span class="blank" data-fill="3"><b>打製石器＝旧石器時代／磨製石器＝新石器時代</b></span></p>
    </div>
  </div>
  <div class="seed-foot"><span>第2章 人類の発生</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
