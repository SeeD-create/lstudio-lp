<head>

<title>写真・国名・地名の識別 ── まとめワーク｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .id-safe { inset: 92px 130px 92px; align-content: center; gap: 34px; }
  .id-head { display: grid; gap: 12px; justify-items: center; text-align: center; }
  .id-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .ic { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px;
        padding: 24px 24px 28px; box-shadow: 0 14px 30px rgba(40,30,10,.10); display: grid; gap: 14px;
        justify-items: center; text-align: center; min-height: 250px; align-content: start; }
  .ic::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:17px 17px 0 0; }
  .ic .lb { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--cat); letter-spacing:.06em; }
  .ic .hint { font-size: 25px; color: var(--sumi-soft); line-height: 1.4; font-weight: 600; }
  .ic .blank { font-size: 38px; min-width: 220px; margin-top: 4px; }
  .id-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 34px; }
  .id-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .id-note .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .id-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe id-safe">
    <div class="id-head" data-at="0">
      <span class="kicker"><span class="num">まとめワーク</span>　写真・国名・地名</span>
      <h1 class="headline" style="font-size:52px;">この6つ、ぜんぶ<span class="em">言えるか</span>？</h1>
    </div>
    <div class="id-row">
      <div class="ic" data-at="1" data-anim="pop"><span class="lb">写真 ①</span><span class="hint">古墳のまわりに並べた、人形や動物の素焼き</span><span class="blank" data-fill="1"><span class="bnum">①</span><b>はにわ</b></span></div>
      <div class="ic" data-at="2" data-anim="pop"><span class="lb">写真 ②</span><span class="hint">四角と丸を合わせた、日本最大の古墳の形</span><span class="blank" data-fill="2"><span class="bnum">②</span><b>前方後円墳</b></span></div>
      <div class="ic" data-at="3" data-anim="pop"><span class="lb">国名 ③（北部）</span><span class="hint">朝鮮半島の北部にあった国</span><span class="blank" data-fill="3"><span class="bnum">③</span><b>高句麗</b></span></div>
    </div>
    <div class="id-row">
      <div class="ic" data-at="4" data-anim="pop"><span class="lb">国名 ④（南西部）</span><span class="hint">日本に仏教を伝えた国</span><span class="blank" data-fill="4"><span class="bnum">④</span><b>百済</b></span></div>
      <div class="ic" data-at="5" data-anim="pop"><span class="lb">国名 ⑤（南東部）</span><span class="hint">562年に伽耶をほろぼした国</span><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>新羅</b></span></div>
      <div class="ic" data-at="6" data-anim="pop"><span class="lb">地名 ⑥（間）</span><span class="hint">④と⑤にはさまれた小国の集まり</span><span class="blank" data-fill="6"><span class="bnum">⑥</span><b>伽耶諸国</b></span></div>
    </div>
    <div class="id-note" data-at="6" data-anim="fade">
      <span class="bt">読みも一緒に</span>
      <span class="bb">読みは③＝<b>こうくり</b>／④＝<b>くだら</b>／⑤＝<b>しらぎ</b>／⑥＝<b>かや</b>。国名は読みで問われることも多い。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
