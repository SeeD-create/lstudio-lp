  .ds-facts .f .lb { background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; border-radius:8px; padding:6px 16px; white-space:nowrap; }

<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ds-safe">
    <div class="ds-txt">

      <p class="ds-def" data-at="1">大阪府堺市にある、日本で最も大きい前方後円墳を
        <span class="blank" data-fill="2"><span class="bnum">④</span><b>大山（大仙）古墳</b></span>という。</p>

      </div>
    </div>
