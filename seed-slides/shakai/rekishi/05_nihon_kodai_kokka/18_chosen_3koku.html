  .pin.p1 { left:360px; top:70px; }

  .pin.p3 { left:500px; top:340px; }
  .pin.p4 { left:415px; top:470px; }
  .pin.p4 .blank { min-width:96px; }
  .cm-legend { display: grid; gap: 16px; }
  .lg { display:flex; align-items:flex-start; gap:16px; background:var(--paper-hi); border-left:8px solid var(--cat);

<div class="seed-stage"><div class="seed-slide" data-cat="soc">
