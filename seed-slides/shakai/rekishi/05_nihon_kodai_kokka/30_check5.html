<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ミニ確認 ── 頻出まとめ｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:49px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 42px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:54px; line-height:1.2; color: var(--sumi); white-space:nowrap; }
  .ans .exp { font-size: 32px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ⑤ ── 総しあげ</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 一問一答（3つ）</div>
      <p class="qtext" data-at="0">大阪府堺市にある日本最大の古墳は<span class="u">（　　）</span>。<br>その形は<span class="u">（　　）</span>。仏教を伝えた朝鮮の国は<span class="u">（　　）</span>。</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-at="1" data-fill="1" data-anim="pop"><b>大山古墳・<br>前方後円墳・百済</b></span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>日本最大＝<span class="hl">大山（大仙）古墳</span>／形＝<span class="hl">前方後円墳</span>／仏教を伝えた国＝<span class="hl">百済</span>。<br>技術を伝えた人々＝<span class="hl">渡来人</span>、まわりに並べた素焼き＝<span class="hl">はにわ</span>も要チェック。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
