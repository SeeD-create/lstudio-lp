<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>古墳時代とは ── 4〜6世紀、巨大な墓の時代｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kt-safe { inset: 100px 150px 100px; align-content: center; gap: 46px; }
  .kt-head { display: grid; gap: 14px; }
  .kt-def { font-size: 44px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .kt-def .em { color: var(--imp); font-weight: 900; }
  .band { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 3px solid var(--sumi); border-radius: 18px; overflow: hidden; box-shadow: 0 14px 32px rgba(40,30,10,.12); }
  .band > div { padding: 22px 18px; text-align: center; border-right: 2px solid var(--hair); background: var(--paper-hi); }
  .band > div:last-child { border-right: none; }
  .band .era { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .band .yr { font-size: 22px; color: var(--sumi-mute); margin-top:6px; }
  .band .hot { background: var(--sumi); }
  .band .hot .era { color:#fff; } .band .hot .yr { color: var(--gold-soft); }
  .kt-bar { display:flex; align-items:center; gap:26px; background:var(--paper-hi); border-left:10px solid var(--cat);
            border-radius:0 16px 16px 0; padding:24px 34px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .kt-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); white-space:nowrap; }
  .kt-bar .bb { font-size:29px; line-height:1.45; color:var(--sumi-soft); }
  .kt-bar .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kt-safe">
    <div class="kt-head" data-at="0">
      <span class="kicker"><span class="num">導入</span>　古墳時代とは</span>
      <h1 class="headline" style="font-size:62px;">王や豪族が<span class="em">巨大な墓</span>をつくった時代</h1>
    </div>
    <p class="kt-def" data-at="1">今から約1600年前、<span class="blank" data-fill="1"><b>4世紀から6世紀</b></span>にかけて、王や豪族の大きな墓（古墳）が盛んに造られた。<br>それは近畿地方から発達し、しだいに全国へ広まっていった。</p>
    <div class="band" data-at="2" data-anim="fade">
      <div><div class="era">弥生時代</div><div class="yr">〜3世紀</div></div>
      <div class="hot"><div class="era">古墳時代</div><div class="yr">4〜6世紀</div></div>
      <div class="hot"><div class="era">（この単元）</div><div class="yr">大王・大和王権</div></div>
      <div class="hot"><div class="era">（この単元）</div><div class="yr">仏教・渡来人</div></div>
      <div><div class="era">飛鳥時代</div><div class="yr">6世紀末〜</div></div>
    </div>
    <div class="kt-bar" data-at="3" data-anim="fade">
      <span class="bt">この章の見どころ</span>
      <span class="bb">墓（古墳）から <b>国のしくみ（大和王権）</b> へ、そして <b>大陸との交流（仏教・渡来人）</b> へ。3つを1本の線でつなぐ。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
