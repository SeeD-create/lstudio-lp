<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>渡来人 ── 技術を伝えた大陸からの人々｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tr-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 660px; align-content: center; gap: 74px; align-items: center; }
  .tr-fig { height: 700px; border-radius: 30px; }
  .tr-txt { display: grid; gap: 30px; }
  .tr-def { font-size: 42px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .tr-def .blank { font-size: 48px; }
  .tr-def .em { color: var(--imp); font-weight: 900; }
  .tr-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 36px; }
  .tr-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .tr-bar .bb { font-size:27px; line-height:1.5; color:rgba(251,251,250,.92); }
  .tr-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe tr-safe">
    <div class="tr-txt">
      <span class="cat-badge" data-at="0"><span class="dot"></span>授業ノート2</span>
      <p class="tr-def" data-at="1">このころ、朝鮮や中国から日本に移り住み、進んだ技術や文化を伝えた人々を
        <span class="blank" data-fill="2"><span class="bnum">⑪</span><b>渡来人</b></span>という。</p>
      <div class="tr-bar" data-at="3" data-anim="fade">
        <span class="bt">読み ＝ とらいじん</span>
        <span class="bb">須恵器・絹織物などの<b>技術</b>のほか、<b>漢字</b>や<b>仏教</b>を伝える橋わたし役にもなった。</span>
      </div>
      <div class="tr-bar" data-at="4" data-anim="fade" style="background:var(--paper-hi);color:var(--sumi-soft);border-left:10px solid var(--cat);border-radius:0 16px 16px 0;">
        <span class="bt" style="color:var(--cat);">★ テスト頻出</span>
        <span class="bb" style="color:var(--sumi-soft);">「大陸から来て多くのことを伝えた人々は何とよぶか」がそのまま出る。<b style="color:var(--imp);">仏教</b>とセットで問われる。</span>
      </div>
    </div>
    <div class="figure tr-fig" data-at="0" data-anim="right"><img src="assets/toraijin.webp" alt="海を渡ってきた渡来人"></div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
