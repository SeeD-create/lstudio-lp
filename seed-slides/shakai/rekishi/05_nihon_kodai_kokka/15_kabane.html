<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kb-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 640px; align-content: center; gap: 70px; align-items: center; }

  /* 身分のしくみ図（大王→姓→氏） */
  .pyr { display: grid; gap: 14px; justify-items: center; }
  .pyr .lv { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 16px; padding: 18px 26px;
             text-align: center; box-shadow: 0 10px 24px rgba(40,30,10,.10); }

  .pyr .l1 .rl, .pyr .l1 .nm { color: var(--imp); }

  .pyr .l3 { width: 600px; }
  .pyr .arrow { font-size: 26px; color: var(--sumi-mute); font-weight:900; }
  .kb-def { font-size: 42px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .kb-def .blank { font-size: 46px; }
  .kb-def .em { color: var(--imp); font-weight: 900; }

  .kb-ren .p .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .kb-ren .p .t .blank { font-size:30px; min-width:120px; }
  .kb-ren .p .s { font-size: 22px; color: var(--sumi-mute); margin-top:6px; }
  .kb-bar { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 30px; }
  .kb-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .kb-bar .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .kb-bar .bb b { color:#fff; }

<div class="seed-stage"><div class="seed-slide" data-cat="lib">

      <div class="kb-ren">
