<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 朝鮮の三国｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:49px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 42px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; line-height:1; color: var(--sumi); white-space:nowrap; }
  .ans .exp { font-size: 32px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ③</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 一問一答</div>
      <p class="qtext" data-at="0">朝鮮半島の<span class="u">北部</span>の国は？　／　<span class="u">南西部</span>の国は？<br>百済と新羅の<span class="u">間</span>にあった小国の集まりは？</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-at="1" data-fill="1" data-anim="pop"><b>高句麗・百済・伽耶</b></span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>北＝<span class="hl">高句麗</span>／南西＝<span class="hl">百済</span>／南東＝<span class="hl">新羅</span>／間＝<span class="hl">伽耶</span>。<br>中国はこのころ<span class="hl">南北朝</span>に分かれていた。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
