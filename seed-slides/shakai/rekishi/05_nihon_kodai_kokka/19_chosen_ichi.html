<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>それぞれの位置 ── 伽耶は大和王権と結ぶ｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ci-safe { inset: 92px 150px 92px; align-content: center; gap: 32px; }
  .ci-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .ci-wrap { display: grid; grid-template-columns: 900px 1fr; gap: 56px; align-items: center; }
  .tbl { display: grid; grid-template-columns: 200px 220px 1fr; border: 3px solid var(--sumi); border-radius: 18px; overflow: hidden;
         box-shadow: 0 14px 32px rgba(40,30,10,.12); background: var(--paper-hi); }
  .tbl > div { padding: 16px 20px; border-bottom: 2px solid var(--hair); display: flex; align-items: center; }
  .tbl .th { background: var(--sumi); color: var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 26px; justify-content:center; border-bottom:none; }
  .tbl .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size: 32px; color: var(--sumi); border-left: 2px solid var(--hair); }
  .tbl .rd { font-size: 26px; color: var(--sumi-soft); border-left: 2px solid var(--hair); }
  .tbl .ps { font-size: 27px; font-weight:700; color: var(--sumi); border-left: 2px solid var(--hair); }
  .tbl .last > div, .tbl > div.last { border-bottom: none; }
  .ci-card { background: var(--paper-hi); color: var(--sumi); border-radius: 22px; padding:31px 37px; display:grid; gap:18px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .ci-card .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color: var(--sumi); }
  .ci-card .b { font-size: 30px; line-height:1.55; }
  .ci-card .b .blank { font-size:32px; }
  .ci-card .b b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ci-safe">
    <div class="ci-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　位置と読み</span>
      <h1 class="headline" style="font-size:52px;">読みと位置を、<span class="em">一気に整理</span></h1>
    </div>
    <div class="ci-wrap">
      <div class="tbl" data-at="1" data-anim="fade">
        <div class="th">国 名</div><div class="th">読 み</div><div class="th">位 置</div>
        <div class="nm">高句麗</div><div class="rd">こうくり</div><div class="ps">北 部</div>
        <div class="nm">百済</div><div class="rd">くだら</div><div class="ps">南西部</div>
        <div class="nm">新羅</div><div class="rd">しらぎ</div><div class="ps">南東部</div>
        <div class="nm last">伽　耶</div><div class="rd last">か　や</div><div class="ps last">上2国の間</div>
      </div>
      <div class="ci-card" data-at="2" data-anim="right">
        <div class="t">半島南部と大和王権</div>
        <div class="b">半島南部の2国にはさまれた
          <span class="blank" data-fill="3"><span class="bnum">⑤</span><b>伽耶</b></span>諸国は、<br><b>大和王権とつながり</b>を持ち、両国に対抗した。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
