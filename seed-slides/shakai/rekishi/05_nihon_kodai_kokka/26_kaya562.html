<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>562年、伽耶が新羅へ ── 影響力が弱まる｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ky-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .ky-head { display: grid; gap: 14px; }
  .ky-flow { display: grid; gap: 18px; }
  .fstep { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 30px;
           background: var(--paper-hi); border-left: 12px solid var(--cat); border-radius: 0 18px 18px 0;
           padding: 24px 36px; box-shadow: 0 10px 26px rgba(40,30,10,.08); }
  .fstep .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--cat); text-align:center; }
  .fstep .tx { font-size: 34px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx .blank { font-size: 38px; }
  .fstep .tx .em { color: var(--imp); font-weight: 900; }
  .fstep.hot { border-color: var(--imp); background: var(--imp-bg); }
  .fstep.hot .yr { color: var(--imp); }
  .ky-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 38px; }
  .ky-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .ky-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.92); }
  .ky-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe ky-safe">
    <div class="ky-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　伽耶のその後</span>
      <h1 class="headline" style="font-size:56px;">伽耶がほろび、日本の<span class="em">影響力が弱まる</span></h1>
    </div>
    <div class="ky-flow">
      <div class="fstep" data-at="1" data-anim="left">
        <div class="yr">6世紀</div>
        <div class="tx">伽耶諸国は、大和王権と結んで半島南部の2国に対抗していた</div>
      </div>
      <div class="fstep hot" data-at="2" data-anim="left">
        <div class="yr">562年</div>
        <div class="tx">伽耶諸国が<span class="blank" data-fill="3"><span class="bnum">⑭</span><b>新羅</b></span>にほろぼされ、その領地に組み入れられた</div>
      </div>
      <div class="fstep" data-at="4" data-anim="left">
        <div class="yr">これ以降</div>
        <div class="tx">大和王権の朝鮮半島への<span class="em">影響力が弱まった</span></div>
      </div>
    </div>
    <div class="ky-bar" data-at="4" data-anim="fade">
      <span class="bt">★ ここで整理</span>
      <span class="bb">伽耶をほろぼした国は<b>しらぎ</b>、仏教を伝えた国は<b>くだら</b>。読みと漢字をそろえて、この2つを取りちがえない。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
</html>
