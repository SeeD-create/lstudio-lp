<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>古墳の形 ── 方墳・円墳・前方後円墳｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kt-safe { inset: 96px 130px 96px; align-content: center; gap: 40px; }
  .kt-head { display: grid; gap: 12px; justify-items: center; text-align: center; }
  .kt-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .fcard { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px;
           padding: 30px 30px 34px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 14px; min-height: 430px; align-content: start; justify-items: center; text-align: center; }
  .fcard::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:21px 21px 0 0; }
  .fcard svg { width: 220px; height: 150px; }
  .fcard svg path, .fcard svg circle, .fcard svg rect { fill: var(--paper-lo); stroke: var(--sumi); stroke-width: 4; }
  .fcard .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .fcard .nm .blank { font-size:40px; }
  .fcard .ds { font-size:26px; line-height:1.45; color:var(--sumi-soft); }
  .fcard.big { border-color: var(--imp); }
  .fcard.big::before { background: var(--imp); }
  .fcard.big svg path { fill: var(--imp-bg); stroke: var(--imp); }
  .kt-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:24px 38px; }
  .kt-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .kt-bar .bb { font-size:28px; line-height:1.5; color:rgba(251,251,250,.92); }
  .kt-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kt-safe">
    <div class="kt-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート1</span>　古墳の形</span>
      <h1 class="headline" style="font-size:58px;">古墳には、いくつかの<span class="em">形</span>がある</h1>
    </div>
    <div class="kt-row">
      <div class="fcard" data-at="1" data-anim="pop">
        <svg viewBox="0 0 220 150"><rect x="55" y="35" width="110" height="90" rx="6"/></svg>
        <div class="nm">方墳</div>
        <div class="ds">四角い形の古墳。<br>（ほうふん）</div>
      </div>
      <div class="fcard" data-at="2" data-anim="pop">
        <svg viewBox="0 0 220 150"><circle cx="110" cy="80" r="60"/></svg>
        <div class="nm">円墳</div>
        <div class="ds">丸い形の古墳。<br>（えんぷん）</div>
      </div>
      <div class="fcard big" data-at="3" data-anim="pop">
        <svg viewBox="0 0 220 150"><path d="M20 75 L20 45 L95 45 A55 55 0 1 1 95 105 L20 105 Z"/></svg>
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">③</span><b>前方後円墳</b></span></div>
        <div class="ds">四角と丸を合わせた鍵穴形。<br>日本独特で最も大きい。</div>
      </div>
    </div>
    <div class="kt-bar" data-at="3" data-anim="fade">
      <span class="bt">★ 記述で出る</span>
      <span class="bb">③の形＝「四角い部分（前方）と丸い部分（後円）を合わせた、日本独特の雄大な形」と説明できるように。大王の墓の多くはこの形。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
