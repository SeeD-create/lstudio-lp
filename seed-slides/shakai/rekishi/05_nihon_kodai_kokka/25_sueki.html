<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>須恵器・絹織物 ── 渡来人が伝えた技術｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .su-safe { inset: 100px 150px 100px; grid-template-columns: 660px 1fr; align-content: center; gap: 74px; align-items: center; }
  .su-fig { height: 700px; border-radius: 30px; }
  .su-txt { display: grid; gap: 30px; }
  .su-def { font-size: 42px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .su-def .blank { font-size: 48px; }
  .su-def .em { color: var(--imp); font-weight: 900; }
  .su-facts { display: grid; gap: 14px; }
  .su-facts .f { display:flex; align-items:center; gap:20px; font-size:30px; font-weight:700; color:var(--sumi); }
  .su-facts .f .lb { background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; border-radius:8px; padding:6px 16px; white-space:nowrap; }
  .su-bar { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border-left:10px solid var(--cat);
            border-radius:0 16px 16px 0; padding:22px 32px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .su-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); white-space:nowrap; }
  .su-bar .bb { font-size:27px; line-height:1.5; color:var(--sumi-soft); }
  .su-bar .bb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe su-safe">
    <div class="figure su-fig" data-at="0" data-anim="left"><img src="assets/sueki.webp" alt="須恵器"></div>
    <div class="su-txt">
      <span class="cat-badge" data-at="0"><span class="dot"></span>渡来人が伝えた技術</span>
      <p class="su-def" data-at="1">渡来人が伝えた技術でつくられた、うすくてかたい青灰色の土器を
        <span class="blank" data-fill="2"><span class="bnum">⑫</span><b>須恵器</b></span>という。</p>
      <div class="su-facts">
        <div class="f" data-at="3"><span class="lb">つくり方</span><span>カマの中で高温で焼く（青灰色・かたい）</span></div>
        <div class="f" data-at="3"><span class="lb">ほかの技術</span><span class="blank" data-fill="3"><span class="bnum">⑬</span><b>絹織物</b></span></div>
      </div>
      <div class="su-bar" data-at="3" data-anim="fade">
        <span class="bt">ここがポイント</span>
        <span class="bb">「かまで高温で焼いた、<b>うすくてかたい青灰色</b>の土器」と説明できるように。渡来人はこの土器や織物の技術を日本に伝えた。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
