<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>年表で総整理 ── 4世紀から6世紀まで｜中1歴史 第5章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { inset: 84px 150px 84px; align-content: center; gap: 26px; }
  .np-head { display: grid; gap: 10px; }
  .np-rows { display: grid; gap: 16px; }
  .np-r { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 32px;
          background: var(--paper-hi); border-radius: 16px; border-left: 12px solid var(--c);
          box-shadow: 0 10px 24px rgba(40,30,10,.09); padding: 20px 34px; }
  .np-r .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--c); text-align:center; }
  .np-r .ev { font-size: 30px; color: var(--sumi); font-weight:700; line-height:1.4; }
  .np-r .ev .blank { font-size: 32px; }
  .np-r .ev .em { color: var(--imp); font-weight:900; }
  .np-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 34px; font-size:27px; line-height:1.4; }
  .np-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">総整理</span>　古代国家の年表</span>
      <h1 class="headline" style="font-size:54px;">4世紀 → 6世紀を、<span class="em">1本の線</span>でつなぐ</h1>
    </div>
    <div class="np-rows">
      <div class="np-r" style="--c:#1A1A1A" data-at="1" data-anim="left">
        <span class="yr">4世紀</span>
        <span class="ev"><span class="blank" data-fill="1"><span class="bnum">①</span><b>大和王権</b></span>が近畿地方に成立／朝鮮半島は三国に分立</span>
      </div>
      <div class="np-r" style="--c:#3A3A39" data-at="2" data-anim="left">
        <span class="yr">4〜5世紀</span>
        <span class="ev">この政権が、ほぼ全国を<span class="em">ゆるやかに統一</span></span>
      </div>
      <div class="np-r" style="--c:#535250" data-at="3" data-anim="left">
        <span class="yr">5世紀</span>
        <span class="ev">日本最大の前方後円墳＝<span class="blank" data-fill="3"><span class="bnum">②</span><b>大山（大仙）古墳</b></span>（大阪府堺市）</span>
      </div>
      <div class="np-r" style="--c:#6B6A67" data-at="4" data-anim="left">
        <span class="yr">6世紀</span>
        <span class="ev">中国は<span class="blank" data-fill="4"><span class="bnum">③</span><b>南北朝</b></span>／百済から<span class="blank" data-fill="4"><span class="bnum">④</span><b>仏教</b></span>が伝わる（538・552）／渡来人が技術を伝える</span>
      </div>
      <div class="np-r" style="--c:#848380" data-at="5" data-anim="left">
        <span class="yr">562年</span>
        <span class="ev">伽耶諸国が<span class="blank" data-fill="5"><span class="bnum">⑤</span><b>新羅</b></span>にほろぼされる → 日本の影響力が弱まる</span>
      </div>
    </div>
    <div class="np-note" data-at="6" data-anim="fade"><span>覚える数字</span><span>古墳＝<b>4〜6世紀</b>／大山古墳＝<b>5世紀</b>／伝来の年＝<b>538・552</b>／伽耶ほろぶ＝<b>562年</b>。この4つで得点が決まる。</span></div>
  </div>
  <div class="seed-foot"><span>第5章 日本の古代国家</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
</html>
