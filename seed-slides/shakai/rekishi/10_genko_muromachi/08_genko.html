<div class="seed-stage"><div class="seed-slide" data-cat="eq">

        この2度の襲来をまとめて<span class="blank" data-fill="5"><span class="bnum">④</span><b>元寇</b></span>といい、
        このときの執権は<span class="blank" data-fill="6"><span class="bnum">⑤</span><b>北条時宗</b></span>だった。
