<head>

<title>ミニ確認 ── 徳政令｜中1歴史 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:51px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .ans { margin-top: 36px; display: flex; align-items: center; gap: 32px; }
  .ans .big { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:88px; line-height:1; color: var(--sumi); white-space:nowrap; }
  .ans .exp { font-size: 31px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認・一問一答</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 何というか</div>
      <p class="qtext" data-at="0">元寇の後、生活が苦しくなった御家人を救うために、鎌倉幕府が出した「借金の帳消し」を命じる法令を何というか。</p>
      <div class="ans" data-at="1">
        <span class="big blank" data-at="1" data-fill="1" data-anim="pop"><b>徳政令</b></span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>読みは<span class="hl">とくせいれい</span>。ねらいは御家人の救済だったが<span class="hl">効果はなく</span>、かえって経済を混乱させ、幕府の信用を落とした。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第10章 元寇から室町時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
