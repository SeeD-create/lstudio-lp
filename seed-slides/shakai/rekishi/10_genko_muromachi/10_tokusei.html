<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>元寇の後 ── 御家人の困窮と徳政令｜中1歴史 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .st-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 540px; align-content: center; gap: 54px; align-items: center; }
  .st-txt { display: grid; gap: 26px; }
  .st-fig { height: 620px; border-radius: 30px; }
  .qbox { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 40px;
          box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 38px; line-height: 1.85; color: var(--sumi); font-weight:700; }
  .qbox .blank { font-size: 40px; min-width: 200px; }
  .qbox .tag--article { margin-bottom:14px; }
  .cause { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:16px; }
  .cause .cbx { background:var(--paper-hi); border:3px solid var(--sumi); border-radius:16px; padding:16px 20px; text-align:center; font-size:27px; font-weight:900; color:var(--sumi); line-height:1.35; box-shadow:0 10px 22px rgba(40,30,10,.08); }
  .cause .cbx small { display:block; font-size:21px; color:var(--sumi-mute); font-weight:600; margin-top:4px; }
  .cause .ar { font-size:34px; color:var(--imp); font-weight:900; }
  .st-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 30px; }
  .st-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .st-note .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .st-note .bb b { color:#fff; }
  .emblem { width:100%; height:100%; display:grid; place-content:center; justify-items:center; gap:16px;
            background: radial-gradient(120% 90% at 50% 0%, var(--paper-hi), var(--paper-lo)); }
  .emblem svg { width:270px; height:270px; }
  .emblem .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:29px; color:var(--sumi-soft); letter-spacing:.14em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe st-safe">
    <div class="st-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 元寇　授業ノート1</span>
        <h1 class="headline" style="font-size:50px;margin-top:12px;">勝ったのに、幕府がゆらぐ</h1>
      </div>
      <div class="cause" data-at="1" data-anim="fade">
        <div class="cbx">元寇で戦う<small>命がけで防衛</small></div>
        <div class="ar">▶</div>
        <div class="cbx">恩賞が出ない<small>新しい領地がない</small></div>
      </div>
      <div class="qbox" data-at="2" data-anim="fade">
        御家人の生活は苦しくなった。幕府は救うため
        <span class="blank" data-fill="3"><span class="bnum">①</span><b>徳政令</b></span>（借金の帳消し）を出したが、効果はなかった。
      </div>
      <div class="st-note" data-at="4" data-anim="fade">
        <span class="bt">この後どうなる</span>
        <span class="bb">御家人の不満はたまり、<b>鎌倉幕府はしだいにおとろえ</b>、やがて倒れる（1333）。「元寇＝勝ったのに損した戦い」がポイント。</span>
      </div>
    </div>
    <div class="figure st-fig" data-at="0" data-anim="right"><img src="assets/gokenin_broke.webp" alt="恩賞をもらえず困窮した御家人"></div>
  </div>
  <div class="seed-foot"><span>第10章 元寇から室町時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
