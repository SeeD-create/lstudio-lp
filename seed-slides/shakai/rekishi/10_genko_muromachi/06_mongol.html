<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>モンゴルの登場 ── チンギス=ハンとモンゴル帝国｜中1歴史 第10章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .st-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 600px; align-content: center; gap: 60px; align-items: center; }
  .st-txt { display: grid; gap: 30px; }
  .st-fig { height: 620px; border-radius: 30px; }
  .qbox { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 34px 40px;
          box-shadow: 0 16px 36px rgba(40,30,10,.10); font-size: 40px; line-height: 1.9; color: var(--sumi); font-weight:700; }
  .qbox .blank { font-size: 42px; min-width: 210px; }
  .qbox .tag--article { margin-bottom:18px; }
  .st-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .st-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .st-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .st-note .bb b { color:#fff; }
  .emblem { width:100%; height:100%; display:grid; place-content:center; justify-items:center; gap:14px;
            background: radial-gradient(120% 90% at 50% 0%, var(--paper-hi), var(--paper-lo)); }
  .emblem svg { width:300px; height:300px; }
  .emblem .cap { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi-soft); letter-spacing:.14em; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe st-safe">
    <div class="st-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 元寇　授業ノート1</span>
        <h1 class="headline" style="font-size:54px;margin-top:16px;">ユーラシアの大帝国が生まれる</h1>
      </div>
      <div class="qbox" data-at="1" data-anim="fade">
        <span class="tag tag--article">★ 1200年代・大陸の動き</span><br>
        <span class="blank" data-fill="2"><span class="bnum">①</span><b>13世紀</b></span>の初め、モンゴル民族の
        <span class="blank" data-fill="3"><span class="bnum">②</span><b>チンギス=ハン</b></span>が民族を統一し、
        広大な<span class="blank" data-fill="4"><span class="bnum">③</span><b>モンゴル帝国</b></span>をきずいた。
      </div>
      <div class="st-note" data-at="5" data-anim="fade">
        <span class="bt">スケール感</span>
        <span class="bb">この帝国は<b>ユーラシア大陸をまたぐ史上最大級</b>のもの。この巨大な力が、やがて海をこえて日本にも向かってくる。</span>
      </div>
    </div>
    <div class="figure st-fig" data-at="0" data-anim="right"><img src="assets/mongol_rider.webp" alt="草原を駆けるモンゴルの騎馬弓兵"></div>
  </div>
  <div class="seed-foot"><span>第10章 元寇から室町時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
