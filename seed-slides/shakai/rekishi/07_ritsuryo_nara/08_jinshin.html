<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .js-safe { align-content: center; justify-items: center; text-align: center; gap: 40px; }
  .js-head { display: grid; gap: 16px; justify-items:center; }
  .fact { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 26px; padding: 46px 66px; max-width: 1400px;
          box-shadow: 0 18px 40px rgba(40,30,10,.12); font-size: 48px; line-height: 1.85; color: var(--sumi); font-weight:700; }
  .fact .blank { font-size: 50px; }
  .fact .yr { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--imp); }
  .js-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; max-width:1200px; }
  .js-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .js-note .bb { font-size:28px; line-height:1.45; color:rgba(251,251,250,.94); }
  .js-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe js-safe">
    <div class="js-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>672年　壬申の乱</span>
      <h1 class="headline" style="font-size:62px;">つぎは、<span class="em">あとつぎ</span>をめぐる争い</h1>
    </div>
    <div class="fact" data-at="1" data-anim="pop">
      <span class="yr">672</span>年、<span class="blank" data-fill="1"><span class="bnum">②</span><b>天智天皇</b></span>の死後、<br>
      あとつぎをめぐって起こった大きな内乱。
    </div>
    <div class="js-note" data-at="2" data-anim="fade">
      <span class="bt">流れで覚える</span>
      <span class="bb">この争いに勝った側が天皇の力を強め、<b>701年の大宝律令</b>で国のしくみが完成へと進んでいく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
