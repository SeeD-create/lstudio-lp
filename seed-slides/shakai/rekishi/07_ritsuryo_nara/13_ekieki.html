<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>労役と兵役 ── 雑徭・衛士・防人｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ee-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 500px; align-content: center; gap: 56px; align-items: center; }
  .ee-fig { height: 560px; border-radius: 28px; }
  .ee-txt { display: grid; gap: 26px; }
  .ee-head { display: grid; gap: 12px; }
  .ee-head .tags { display:flex; gap:14px; }
  .ee-list { display: grid; gap: 16px; }
  .er { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 22px;
        background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
        padding: 20px 30px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .er .lab { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--cat); text-align:center; }
  .er .nm { font-size: 33px; line-height: 1.35; color: var(--sumi); font-weight: 700; }
  .er .nm .blank { font-size: 36px; }
  .er .nm small { display:block; font-size:24px; color:var(--sumi-mute); font-weight:500; margin-top:2px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ee-safe">
    <div class="ee-txt">
      <div class="ee-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>農民の負担②　労役と兵役</span>
        <h1 class="headline" style="font-size:52px;">税のほかに、<span class="em">働き</span>と<span class="em">兵役</span></h1>
        <div class="tags"><span class="tag tag--gold">★ 表で問われる</span></div>
      </div>
      <div class="ee-list">
        <div class="er" data-at="1" data-anim="left"><div class="lab">労役</div>
          <div class="nm"><span class="blank" data-fill="1"><b>雑徭</b></span><small>国司のもとで60日以内の労働</small></div></div>
        <div class="er" data-at="2" data-anim="left"><div class="lab">兵役</div>
          <div class="nm"><span class="blank" data-fill="2"><b>衛士</b></span><small>1年間、都の警備につく</small></div></div>
        <div class="er" data-at="3" data-anim="left"><div class="lab">兵役</div>
          <div class="nm"><span class="blank" data-fill="3"><span class="bnum">⑪</span><b>防人</b></span><small>3年間、北九州の警備につく</small></div></div>
      </div>
    </div>
    <div class="figure ee-fig" data-at="0" data-anim="right"><img src="assets/sakimori.webp" alt="北九州の守りにつく防人"></div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
