<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>政治のしくみ ── 2官8省・国郡里・大宰府｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 92px 150px 92px; align-content: center; gap: 34px; }
  .sk-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .sk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .panel { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 32px 38px;
           box-shadow: 0 14px 32px rgba(40,30,10,.10); display: grid; gap: 18px; align-content:start; }
  .panel h2 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--cat); margin:0; letter-spacing:.06em; }
  .center-box { text-align:center; font-size:34px; font-weight:800; color:var(--sumi); line-height:1.4; }
  .center-box .imp { color: var(--imp); }
  .chain { display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
  .node { background: var(--paper-lo); border-radius:14px; padding:14px 22px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); text-align:center; }
  .node .role { display:block; font-size:24px; color:var(--sumi-mute); font-weight:700; margin-top:4px; }
  .node .role .blank { font-size:28px; min-width:130px; }
  .arw { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi-mute); }
  .dazai { display:flex; align-items:center; gap:22px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:19px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .dazai .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--imp); white-space:nowrap; }
  .dazai .bb { font-size:29px; line-height:1.4; color: var(--sumi); }
  .dazai .bb .blank { font-size:31px; }
  .dazai .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>律令国家のしくみ</span>
      <h1 class="headline" style="font-size:56px;">中央と地方に、役人を置く</h1>
    </div>
    <div class="sk-grid">
      <div class="panel" data-at="1" data-anim="left">
        <h2>中央（都）</h2>
        <div class="center-box"><span class="imp">2官8省</span>の役所<br><small style="font-size:26px;color:var(--sumi-mute)">神祇官・太政官の2官と、その下の8つの省</small></div>
      </div>
      <div class="panel" data-at="2" data-anim="right">
        <h2>地方</h2>
        <div class="chain">
          <div class="node">国<span class="role"><span class="blank" data-fill="2"><span class="bnum">⑬</span><b>国司</b></span></span></div>
          <div class="arw">→</div>
          <div class="node">郡<span class="role"><span class="blank" data-fill="3"><span class="bnum">⑭</span><b>郡司</b></span></span></div>
          <div class="arw">→</div>
          <div class="node">里<span class="role"><span class="blank" data-fill="4"><b>里長</b></span></span></div>
        </div>
        <div style="text-align:center;font-size:24px;color:var(--sumi-mute);font-weight:600;">国の役人は都から派遣され、郡の役人には地方の豪族が任命された</div>
      </div>
    </div>
    <div class="dazai" data-at="5" data-anim="fade">
      <span class="bt">九州には特別な役所</span>
      <span class="bb">九州には <span class="blank" data-fill="5"><span class="bnum">⑮</span><b>大宰府</b></span> が置かれ、<b>唐や新羅との外交の窓口</b>となった。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
</html>
