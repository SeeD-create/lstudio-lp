  .lc .ds b { color: var(--imp); }
  .kt-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 38px; }
  .kt-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }

<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe kt-safe">

      <h1 class="headline" style="font-size:56px;">唐の文化は、<span class="em">人</span>が運んできた</h1>

      <div class="lc" data-at="1" data-anim="left">

      <span class="bb"><b>阿倍仲麻呂＝日本から唐へ</b>、もう一人は<b>唐から日本へ</b>。向きが逆になる。「盲目になっても日本に来た唐の僧」が誰かを答えられるように。</span>
    </div>
