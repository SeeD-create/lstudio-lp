<title>記述で出る ── 墾田永年私財法と大仏づくりの理由｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kr-safe { inset: 90px 150px 90px; align-content: center; gap: 30px; }
  .kr-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .kr-row { display: grid; gap: 24px; }
  .qa { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 22px;
        padding: 28px 40px; box-shadow: 0 14px 30px rgba(40,30,10,.12); display: grid; gap: 14px; }
  .qa::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .qa .q { font-size: 32px; font-weight: 800; color: var(--sumi); }
  .qa .q .qm { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--cat); margin-right:14px; }
  .qa .a { display:flex; align-items:baseline; gap:18px; font-size: 30px; line-height:1.5; color:var(--sumi-soft); font-weight:700; }
  .qa .a .am { font-family:'Zen Old Mincho',serif; font-weight:900; color:var(--imp); flex:none; }
  .qa .a .txt { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe kr-safe">
    <div class="kr-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>記述で差がつく</span>
      <h1 class="headline" style="font-size:54px;">この<span class="em">3つ</span>は、文で書けるように</h1>
    </div>
    <div class="kr-row">
      <div class="qa" data-at="1" data-anim="left">
        <div class="q"><span class="qm">問1</span>墾田永年私財法とは、どんな内容の法か。</div>
        <div class="a" data-at="2"><span class="am">答</span><span class="txt blank blank--para" data-fill="2"><b>新たに開墾した土地の永久私有を認めた法。</b></span></div>
      </div>
      <div class="qa" data-at="2" data-anim="left">
        <div class="q"><span class="qm">問2</span>この法が出された理由を答えよ。</div>
        <div class="a" data-at="3"><span class="am">答</span><span class="txt blank blank--para" data-fill="3"><b>農民の逃亡や人口増加で口分田が不足したため。</b></span></div>
      </div>
      <div class="qa" data-at="3" data-anim="left">
        <div class="q"><span class="qm">問3</span>聖武天皇が大仏をつくった理由を答えよ。</div>
        <div class="a" data-at="3"><span class="am">答</span><span class="txt blank blank--para" data-fill="3"><b>仏教の力で国家を守り、政治を安定させようとしたため。</b></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
