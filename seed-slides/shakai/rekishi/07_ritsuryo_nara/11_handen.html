<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>班田収授法 ── 戸籍・口分田・6歳以上｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hd-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 580px; align-content: center; gap: 60px; align-items: center; }
  .hd-fig { height: 600px; border-radius: 28px; }
  .hd-txt { display: grid; gap: 26px; }
  .hd-head { display: grid; gap: 12px; }
  .hd-head .tags { display:flex; gap:14px; }
  .flow { display: grid; gap: 14px; }
  .fstep { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 22px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 18px 28px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:62px;height:62px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 31px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx .blank { font-size: 33px; }
  .fstep .tx small { display:block; font-size:24px; color:var(--sumi-mute); font-weight:500; margin-top:2px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe hd-safe">
    <div class="hd-txt">
      <div class="hd-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>田を貸すしくみ</span>
        <h1 class="headline" style="font-size:52px;">国が田を貸し、<br>死んだら返させる</h1>
        <div class="tags"><span class="tag tag--gold">★ テスト頻出</span></div>
      </div>
      <div class="flow">
        <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
          <div class="tx"><span class="blank" data-fill="1"><span class="bnum">④</span><b>戸籍</b></span>を作る<small>どこの家に誰がいるかを調べる</small></div></div>
        <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
          <div class="tx"><span class="blank" data-fill="2"><span class="bnum">⑤</span><b>6</b></span>歳以上の男女に田を貸す<small>この田の名前は次の行で</small></div></div>
        <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
          <div class="tx">貸す田＝<span class="blank" data-fill="3"><span class="bnum">⑥</span><b>口分田</b></span><small>死んだら国に返させる</small></div></div>
        <div class="fstep" data-at="4" data-anim="left"><div class="no">4</div>
          <div class="tx">このしくみ＝<span class="blank" data-fill="4"><span class="bnum">⑦</span><b>班田収授</b></span>法<small>名簿にもとづいて田を配り直す</small></div></div>
      </div>
    </div>
    <div class="figure hd-fig" data-at="0" data-anim="right"><img src="assets/handen_ta.webp" alt="区画された口分田"></div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
