<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>身分制度 ── 良民と賤民（奴婢）｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mb-safe { align-content: center; justify-items:center; text-align:center; gap: 40px; }
  .mb-head { display: grid; gap: 14px; justify-items:center; }
  .mb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 1300px; }
  .mc { position: relative; background: var(--paper-hi); border-radius: 24px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 40px 36px; display: grid; gap: 16px; min-height: 320px; align-content:center; }
  .mc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:21px 21px 0 0; }
  .mc .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); }
  .mc .nm .blank { font-size: 48px; }
  .mc .ds { font-size: 30px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .mc .ds .blank { font-size: 34px; }
  .mc .ds .imp { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe mb-safe">
    <div class="mb-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>身分制度</span>
      <h1 class="headline" style="font-size:58px;">人々は<span class="em">2つ</span>に分けられた</h1>
    </div>
    <div class="mb-row">
      <div class="mc" data-at="1" data-anim="left">
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">⑫</span><b>良民</b></span></div>
        <div class="ds">農民など、ふつうの人々。<br>田を与えられ、税を負担した。</div>
      </div>
      <div class="mc" data-at="2" data-anim="right">
        <div class="nm">賤民</div>
        <div class="ds">その中の <span class="blank" data-fill="3"><b>奴婢</b></span> は<br><span class="imp">奴隷</span>としてあつかわれた。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
