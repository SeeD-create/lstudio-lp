<title>古事記・日本書紀・風土記 ── 歴史書と地理書｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rk-safe { inset: 96px 140px 96px; align-content: center; gap: 40px; }
  .rk-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .rk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .rc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 14px 30px rgba(40,30,10,.12); padding: 32px 30px 36px; min-height: 380px; display: grid; align-content: start; gap: 16px; text-align:center; }
  .rc::before { content:""; position:absolute; left:0; top:0; right:0; height:11px; background:var(--cat); border-radius:19px 19px 0 0; }
  .rc .kind { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); opacity:.55; }
  .rc .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  .rc .nm .blank { font-size:40px; min-width:200px; }
  .rc .ds { font-size:26px; line-height:1.5; color:var(--sumi-soft); font-weight:600; }
  .rc .ds b { color: var(--imp); }
  .rk-bar { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 38px; }
  .rk-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .rk-bar .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.94); }
  .rk-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe rk-safe">
    <div class="rk-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 天平文化　書物</span>
      <h1 class="headline" style="font-size:56px;">国のなりたちを、<span class="em">書き残す</span></h1>
    </div>
    <div class="rk-row">
      <div class="rc" data-at="1" data-anim="pop">
        <div class="kind">歴史書①</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>古事記</b></span></div>
        <div class="ds">神話を中心にした<br><b>日本最古</b>の歴史書</div>
      </div>
      <div class="rc" data-at="2" data-anim="pop">
        <div class="kind">歴史書②</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>日本書紀</b></span></div>
        <div class="ds">神話を中心にした<br>もう一つの歴史書</div>
      </div>
      <div class="rc" data-at="3" data-anim="pop">
        <div class="kind">地理書</div>
        <div class="nm"><span class="blank" data-fill="3"><span class="bnum">③</span><b>風土記</b></span></div>
        <div class="ds">地名や産物などを<br>国ごとにまとめた地理書</div>
      </div>
    </div>
    <div class="rk-bar" data-at="4" data-anim="fade">
      <span class="bt">区別のコツ</span>
      <span class="bb">①②＝<b>歴史書（神話）</b>／③＝<b>地理書（地名・産物）</b>。「日本最古の歴史書は？」「地理をまとめたのは？」の2問がそのまま出る。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
