<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>農民の税 ── 租・庸・調｜中1歴史 §7</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .zc-safe { inset: 96px 150px 96px; grid-template-columns: 480px 1fr; align-content: center; gap: 56px; align-items: center; }
  .zc-fig { height: 500px; border-radius: 26px; }
  .zc-right { display: grid; gap: 30px; }
  .zc-head { display: grid; gap: 12px; }
  .zc-head .tags { display:flex; gap:14px; }
  .zc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .zc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 14px 30px rgba(40,30,10,.12); padding: 28px 22px 32px; min-height: 300px; display: grid; align-content: start; gap: 14px; text-align:center; }
  .zc::before { content:""; position:absolute; left:0; top:0; right:0; height:11px; background:var(--cat); border-radius:19px 19px 0 0; }
  .zc .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); }
  .zc .nm .blank { font-size: 40px; min-width: 120px; }
  .zc .ds { font-size:26px; line-height:1.45; color:var(--sumi-soft); font-weight:600; }
  .zc .ic { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--cat); opacity:.4; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe zc-safe">
    <div class="figure zc-fig" data-at="0" data-anim="left"><img src="assets/tax_three.webp" alt="租庸調の三つの税"></div>
    <div class="zc-right">
      <div class="zc-head" data-at="0">
        <span class="cat-badge"><span class="dot"></span>農民の負担①　税</span>
        <h1 class="headline" style="font-size:54px;">納める税は<span class="em">3種類</span></h1>
        <div class="tags"><span class="tag tag--gold">★ テスト頻出</span></div>
      </div>
      <div class="zc-row">
        <div class="zc" data-at="1" data-anim="pop"><div class="ic">其の一</div><div class="nm"><span class="blank" data-fill="1"><span class="bnum">⑧</span><b>租</b></span></div><div class="ds">稲を<br>おさめる</div></div>
        <div class="zc" data-at="2" data-anim="pop"><div class="ic">其の二</div><div class="nm"><span class="blank" data-fill="2"><span class="bnum">⑨</span><b>庸</b></span></div><div class="ds">布を<br>おさめる</div></div>
        <div class="zc" data-at="3" data-anim="pop"><div class="ic">其の三</div><div class="nm"><span class="blank" data-fill="3"><span class="bnum">⑩</span><b>調</b></span></div><div class="ds">特産物を<br>おさめる</div></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第7章 律令政治と奈良時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
