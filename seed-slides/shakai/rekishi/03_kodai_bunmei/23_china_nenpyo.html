<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中国王朝の流れ ── 殷→周→春秋戦国→秦→漢｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .t-safe { inset: 96px 120px 96px; align-content: center; gap: 44px; }
  .t-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .t-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-items: stretch; }
  .dyn { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px;
         padding: 24px 20px; box-shadow: 0 14px 30px rgba(40,30,10,.10); display: grid; gap: 12px; align-content: start; min-height: 360px; }
  .dyn .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:22px; color:var(--cat); }
  .dyn .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi); line-height:1; }
  .dyn .ds { font-size:22px; line-height:1.4; color:var(--sumi-soft); }
  .dyn .ds b { color: var(--imp); }
  .dyn .nm .blank { min-width:0; padding:0 10px 3px; margin:0; }
  .dyn .ds .blank { min-width:0; white-space:normal; padding:0 6px 2px; margin:0 2px; }
  .arrow { position:absolute; right:-14px; top:50%; transform:translateY(-50%); z-index:2;
           font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi-mute); }
  .t-note { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:17px 33px; justify-content:center; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .t-note .bb { font-size:27px; color: var(--sumi); } .t-note .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe t-safe">
    <div class="t-head" data-at="0">
      <span class="kicker"><span class="num">まとめ</span>　中国王朝の流れ</span>
      <h1 class="headline" style="font-size:56px;">この順番が、そのまま出る</h1>
    </div>
    <div class="t-row">
      <div class="dyn" data-at="1" data-anim="pop"><div class="yr">紀元前1600ごろ</div><div class="nm"><span class="blank" data-fill="1"><b>殷</b></span></div><div class="ds">最初の国。<span class="blank" data-fill="1"><b>甲骨文字</b></span>・青銅器。黄河流域。</div><span class="arrow">→</span></div>
      <div class="dyn" data-at="2" data-anim="pop"><div class="yr">紀元前1100ごろ</div><div class="nm"><span class="blank" data-fill="2"><b>周</b></span></div><div class="ds">殷にかわって中国を支配した。</div><span class="arrow">→</span></div>
      <div class="dyn" data-at="3" data-anim="pop"><div class="yr">紀元前8世紀〜</div><div class="nm" style="font-size:34px;"><span class="blank" data-fill="3"><b>春秋<br>戦国時代</b></span></div><div class="ds">周が滅び、各地が争う<span class="blank" data-fill="3"><b>戦乱の世</b></span>。孔子・儒教。</div><span class="arrow">→</span></div>
      <div class="dyn" data-at="4" data-anim="pop"><div class="yr">紀元前221</div><div class="nm"><span class="blank" data-fill="4"><b>秦</b></span></div><div class="ds">中国を統一。<span class="blank" data-fill="4"><b>始皇帝</b></span>・万里の長城。</div><span class="arrow">→</span></div>
      <div class="dyn" data-at="5" data-anim="pop"><div class="yr">紀元前202</div><div class="nm"><span class="blank" data-fill="5"><b>漢</b></span></div><div class="ds">紙の発明。<span class="blank" data-fill="5"><b>シルクロード</b></span>でローマと交流。</div></div>
    </div>
    <div class="t-note" data-at="5">
      <span class="bb blank blank--para" data-fill="5"><b>練習問題の年表はこの並び。<span class="hl">殷→周→春秋戦国→秦→漢</span>。A〜Dの王朝は、殷・周・秦・漢が入ることが多い。</b></span>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
