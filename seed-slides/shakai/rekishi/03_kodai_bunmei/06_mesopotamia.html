<link rel="stylesheet" href="../../../_shared/deck.css">

<div class="seed-stage"><div class="seed-slide" data-cat="eq">

    </div>
    <div class="n-row">
      <div class="note" data-at="0">
        紀元前<span class="blank" data-fill="1"><span class="bnum">①</span><b>3300</b></span>年ごろ、メソポタミア地方の<span class="blank" data-fill="2"><span class="bnum">②</span><b>チグリス・ユーフラテス</b></span>川流域では、王が権力を持ち神殿がつくられた。人々は独特な<span class="blank" data-fill="3"><span class="bnum">③</span><b>くさび形文字</b></span>を使った。この文明を<span class="blank" data-fill="4"><span class="bnum">④</span><b>メソポタミア文明</b></span>という。
      </div>
      <div class="figure n-fig" data-at="0" data-anim="right"><img src="assets/mesopotamia_zigg.webp" alt="メソポタミアの神殿とくさび形文字の粘土板"></div>

      <span class="bb">「川の名前」と「文字の名前」はワンセットで問われる。2本の川と、粘土板にきざんだ文字を必ず対にして覚える。</span>
    </div>
  </div>
