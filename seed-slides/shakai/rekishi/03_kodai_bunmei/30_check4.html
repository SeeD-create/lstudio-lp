<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ミニ確認 ── ローマ・イスラム｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1440px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:49px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:80px; line-height:1.1; color: var(--sumi); }
  .ans .exp { font-size: 31px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 開いた人と宗教をむすべ</div>
      <p class="qtext" data-at="0">キリスト教を開いたユダヤ人は<span class="u">（　　）</span>。<br>イスラム教を開いたのは<span class="u">（　　）</span>、その聖典は<span class="u">（　　）</span>、聖地は<span class="u">（　　）</span>。</p>
      <div class="ans" data-at="1">
        <span class="mark" data-at="1" data-anim="pop">A.</span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>キリスト教＝<span class="hl">イエス=キリスト</span>／イスラム教＝<span class="hl">ムハンマド</span>。<br>イスラム教の聖典＝<span class="hl">コーラン</span>、聖地＝<span class="hl">メッカ</span>。人と宗教の組み合わせで出る。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
