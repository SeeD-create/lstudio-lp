<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>四大文明マップ ── 4つの大河と文明｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .m-safe { inset: 92px 130px 90px; align-content: center; gap: 38px; }
  .m-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .m-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .mcard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c);
           box-shadow: 0 16px 34px rgba(40,30,10,.12); overflow: hidden; display: grid; align-content: start; min-height: 480px; }
  .mcard .mh { background: var(--c); color: #fff; padding: 20px 24px; }
  .mcard .mh .rv { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; line-height:1.05; }
  .mcard .mh .rr { font-size:22px; opacity:.85; margin-top:4px; }
  .mcard .mb { padding: 24px 26px; display: grid; gap: 16px; }
  .row2 { display: grid; gap: 4px; }
  .row2 .lab { font-size: 21px; color: var(--sumi-mute); font-weight:700; letter-spacing:.05em; }
  .row2 .val { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color: var(--sumi); line-height:1.1; }
  .row2 .val .imp { color: var(--imp); }
  .row2 .val .blank { min-width:0; white-space:normal; padding:0 8px 3px; margin:0; }
  .m-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 36px; justify-content:center; }
  .m-note .bb { font-size:27px; color:rgba(251,251,250,.94); text-align:center; } .m-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe m-safe">
    <div class="m-head" data-at="0">
      <span class="kicker"><span class="num">まとめ</span>　四大文明</span>
      <h1 class="headline" style="font-size:58px;">4つの大河 × 文明 × 文字</h1>
    </div>
    <div class="m-row">
      <div class="mcard" style="--c:#1A1A1A" data-at="1" data-anim="pop">
        <div class="mh"><div class="rv">メソポタミア<br>文明</div><div class="rr">紀元前3300ごろ</div></div>
        <div class="mb">
          <div class="row2"><span class="lab">川</span><span class="val"><span class="blank" data-fill="1"><b>チグリス・<br>ユーフラテス川</b></span></span></div>
          <div class="row2"><span class="lab">文字</span><span class="val"><span class="blank" data-fill="1"><b>くさび形文字</b></span></span></div>
        </div>
      </div>
      <div class="mcard" style="--c:#3A3A39" data-at="2" data-anim="pop">
        <div class="mh"><div class="rv">エジプト<br>文明</div><div class="rr">紀元前3000ごろ</div></div>
        <div class="mb">
          <div class="row2"><span class="lab">川</span><span class="val"><span class="blank" data-fill="2"><b>ナイル川</b></span></span></div>
          <div class="row2"><span class="lab">文字</span><span class="val"><span class="blank" data-fill="2"><b>象形文字</b></span></span></div>
          <div class="row2"><span class="lab">特徴</span><span class="val" style="font-size:28px;"><span class="blank" data-fill="2"><b>ピラミッド</b></span></span></div>
        </div>
      </div>
      <div class="mcard" style="--c:#535250" data-at="3" data-anim="pop">
        <div class="mh"><div class="rv">インダス<br>文明</div><div class="rr">紀元前2500ごろ</div></div>
        <div class="mb">
          <div class="row2"><span class="lab">川</span><span class="val"><span class="blank" data-fill="3"><b>インダス川</b></span></span></div>
          <div class="row2"><span class="lab">特徴</span><span class="val" style="font-size:28px;"><span class="blank" data-fill="3"><b>れんがの都市<br>のちにカースト制</b></span></span></div>
        </div>
      </div>
      <div class="mcard" style="--c:#6B6A67" data-at="4" data-anim="pop">
        <div class="mh"><div class="rv">中国<br>文明</div><div class="rr">紀元前1600ごろ</div></div>
        <div class="mb">
          <div class="row2"><span class="lab">川</span><span class="val"><span class="blank" data-fill="4"><b>黄河</b></span></span></div>
          <div class="row2"><span class="lab">文字</span><span class="val"><span class="blank" data-fill="4"><b>甲骨文字</b></span></span></div>
          <div class="row2"><span class="lab">最初の国</span><span class="val" style="font-size:30px;"><span class="blank" data-fill="4"><b>殷</b></span></span></div>
        </div>
      </div>
    </div>
    <div class="m-note" data-at="5">
      <span class="bb">四大文明はどれも<b>大きな川の流域</b>。練習問題は「川 → 文明名 → 文字」の対応をそのまま問う。<b>川と文字はワンセット</b>で覚える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
