<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 川と文字（メソポタミア・エジプト）｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1420px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:49px 61px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 46px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 34px; display: flex; align-items: center; gap: 28px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:92px; line-height:1; color: var(--sumi); }
  .ans .exp { font-size: 32px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. ○か×か</div>
      <p class="qtext" data-at="0">くさび形文字が使われたのはエジプト文明で、<br>ピラミッドがつくられたのは<span class="u">メソポタミア文明</span>である。</p>
      <div class="ans" data-at="1">
        <span class="mark blank" data-at="1" data-fill="1" data-anim="pop"><b>×</b></span>
        <span class="exp blank blank--para" data-at="2" data-fill="2"><b>逆。<span class="hl">くさび形文字＝メソポタミア</span>（チグリス・ユーフラテス川）、<br><span class="hl">ピラミッド・象形文字＝エジプト</span>（ナイル川）。川と文字はワンセットで。</b></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
