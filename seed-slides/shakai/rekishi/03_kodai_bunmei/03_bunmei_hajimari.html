<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>文明のはじまり ── 農耕・牧畜から王・文字へ｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .bh-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 620px; align-content: center; gap: 68px; align-items: center; }
  .bh-txt { display: grid; gap: 30px; }
  .bh-fig { height: 660px; border-radius: 30px; }
  .flow { display: grid; gap: 14px; }
  .fstep { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 24px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 20px 30px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:62px;height:62px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 32px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:25px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .tx .em { color: var(--imp); font-weight: 900; }
  .fstep .tx .blank { min-width:0; padding:0 12px 3px; margin:0 3px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe bh-safe">
    <div class="bh-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>文明とは</span>
        <h1 class="headline" style="font-size:56px;margin-top:18px;">文明は、こうして<br>おこってきた</h1>
      </div>
      <div class="flow">
        <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
          <div class="tx"><span class="blank" data-fill="1"><b>農耕と牧畜</b></span>が発展して生活が安定<small>食べ物をたくわえられるようになった</small></div></div>
        <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
          <div class="tx">力をにぎった<span class="blank" data-fill="2"><b>王</b></span>が人々を支配<small>むらから、大きな国へ</small></div></div>
        <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
          <div class="tx"><span class="blank" data-fill="3"><b>文字</b></span>や<span class="blank" data-fill="3"><b>金属器</b></span>が使われはじめる<small>これが「文明のはじまり」</small></div></div>
      </div>
    </div>
    <div class="figure bh-fig" data-at="0" data-anim="right"><img src="assets/river_civ.webp" alt="大河のほとりの農耕と集落"></div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
