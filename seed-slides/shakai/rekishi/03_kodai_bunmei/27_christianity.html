<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>イエス=キリストとキリスト教｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .f-safe { inset: 88px 150px 86px; align-content: center; gap: 30px; }
  .f-head { display: grid; gap: 10px; }
  .flow { display: grid; gap: 15px; }
  .fstep { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 26px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 22px 34px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:66px;height:66px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 34px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:25px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .blank { font-size: 34px; min-width: 110px; }
  .fstep .tx .em { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe f-safe">
    <div class="f-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート5</span>　ローマ文明</span>
      <h1 class="headline" style="font-size:56px;">世界に広がる宗教のはじまり</h1>
    </div>
    <div class="flow">
      <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
        <div class="tx">1世紀ごろ、ローマ帝国の支配に苦しむユダヤ人の中から<span class="blank" data-fill="1"><span class="bnum">①</span><b>イエス=キリスト</b></span>が現れた</div></div>
      <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
        <div class="tx">イエスは<span class="blank" data-fill="2"><span class="bnum">②</span><b>キリスト教</b></span>を開いた<small>はじめローマ帝国は認めなかった</small></div></div>
      <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
        <div class="tx">4世紀末、ローマ帝国がこれを<span class="em">国教</span>として認めた</div></div>
      <div class="fstep" data-at="4" data-anim="left"><div class="no">4</div>
        <div class="tx">この宗教は、のちの<span class="em">ヨーロッパ文化のもと</span>になった</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
