<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>周と春秋戦国時代｜中1歴史 §3</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .f-safe { inset: 92px 150px 90px; align-content: center; gap: 34px; }
  .f-head { display: grid; gap: 10px; }
  .flow { display: grid; gap: 16px; }
  .fstep { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 26px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 24px 34px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:66px;height:66px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 35px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:26px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .blank { font-size: 35px; min-width: 110px; }
  .fstep .tx .em { color: var(--imp); font-weight:900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe f-safe">
    <div class="f-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート4</span>　中国文明</span>
      <h1 class="headline" style="font-size:56px;">殷のつぎは、乱れの時代へ</h1>
    </div>
    <div class="flow">
      <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
        <div class="tx">殷にかわって<span class="em">周</span>という国が中国を支配した</div></div>
      <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
        <div class="tx">やがて周が滅ぶ<small>各地の勢力が争うようになった</small></div></div>
      <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
        <div class="tx">戦乱の世となる ── <span class="blank" data-fill="3"><span class="bnum">①</span><b>春秋戦国時代</b></span><small>この乱れの中から、孔子の教えが生まれる</small></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第3章 古代文明</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
