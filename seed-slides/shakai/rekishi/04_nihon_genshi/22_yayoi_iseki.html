<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>弥生時代⑤ ── 登呂遺跡・吉野ヶ里遺跡｜中1歴史 §4</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .iseki-safe { inset: 104px 160px 104px; align-content: center; gap: 40px; }
  .iseki-head { display: grid; gap: 14px; }
  .iseki-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; }
  .ic { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 40px 44px; display: grid; gap: 14px; }
  .ic::before { content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--cat); border-radius:19px 0 0 19px; }
  .ic .pref { font-size: 30px; color: var(--sumi-mute); font-weight: 700; }
  .ic .nm { font-size: 44px; font-weight: 700; color: var(--sumi); }
  .ic .nm .blank { font-size: 48px; }
  .iseki-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:22px 36px; font-size:29px; }
  .iseki-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe iseki-safe">
    <div class="iseki-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>弥生時代</span>
      <h1 class="headline" style="font-size:58px;">覚えておきたい、2つの遺跡</h1>
    </div>
    <div class="iseki-row">
      <div class="ic" data-at="1" data-anim="pop">
        <div class="pref">静岡県</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>登呂遺跡</b></span></div>
      </div>
      <div class="ic" data-at="2" data-anim="pop">
        <div class="pref">佐賀県</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>吉野ヶ里遺跡</b></span></div>
      </div>
    </div>
    <div class="iseki-note" data-at="3" data-anim="fade"><span>ここも大事</span><span>米づくりが始まると、収穫の差から<b>身分や貧富の差</b>が生まれ、むら同士の争いも起きた。</span></div>
  </div>
  <div class="seed-foot"><span>第4章 日本の原始時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
