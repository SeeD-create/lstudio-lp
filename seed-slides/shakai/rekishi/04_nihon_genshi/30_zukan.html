<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>原始時代 道具図鑑 ── 名前をあてよう｜中1歴史 §4</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .zk-safe { inset: 84px 120px 84px; align-content: start; gap: 30px; }
  .zk-head { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .zk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .zk-c { position: relative; background: var(--paper-hi); border-radius: 20px; border: 3px solid var(--sumi-mute);
          box-shadow: 0 14px 30px rgba(40,30,10,.10); padding: 26px 24px 28px; min-height: 300px;
          display: grid; align-content: start; gap: 14px; }
  .zk-c .no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi-mute); }
  .zk-c .hint { font-size: 26px; line-height: 1.4; color: var(--sumi-soft); font-weight: 600; min-height: 110px; }
  .zk-c .name { margin-top: auto; }
  .zk-c .name .blank { font-size: 40px; min-width: 240px; }
  .zk-c .name .blank b { font-family:'Zen Old Mincho',serif; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe zk-safe">
    <div class="zk-head" data-at="0">
      <span class="kicker"><span class="num">まとめワーク</span>　道具図鑑</span>
      <h1 class="headline" style="font-size:58px;">この8つ、<span class="em">名前</span>を言えるか？</h1>
    </div>
    <div class="zk-grid">
      <div class="zk-c" data-at="0"><div class="no">①</div><div class="hint">女性の姿をした、土でできた人形。まじないに使った。</div>
        <div class="name"><span class="blank" data-fill="1"><b>土偶</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">②</div><div class="hint">縄目の文様がついた、かざりの多い土器。</div>
        <div class="name"><span class="blank" data-fill="2"><b>縄文土器</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">③</div><div class="hint">うすくて、かざりの少ない実用的な土器。</div>
        <div class="name"><span class="blank" data-fill="3"><b>弥生土器</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">④</div><div class="hint">地面を掘り下げて作った、縄文・弥生の住居。</div>
        <div class="name"><span class="blank" data-fill="4"><b>たて穴住居</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">⑤</div><div class="hint">高い床の上に米を貯蔵した、弥生の倉。</div>
        <div class="name"><span class="blank" data-fill="5"><b>高床倉庫</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">⑥</div><div class="hint">稲の穂をかりとるのに使った石器。</div>
        <div class="name"><span class="blank" data-fill="6"><b>石包丁</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">⑦</div><div class="hint">つりがね形の青銅器。神の祭りに使った。</div>
        <div class="name"><span class="blank" data-fill="7"><b>銅鐸</b></span></div></div>
      <div class="zk-c" data-at="0"><div class="no">⑧</div><div class="hint">銅でできたかがみ。祭りや権威を表す青銅器。</div>
        <div class="name"><span class="blank" data-fill="8"><b>銅鏡</b></span></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 日本の原始時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</body>
</html>
