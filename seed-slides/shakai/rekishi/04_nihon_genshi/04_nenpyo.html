<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3つの時代の年表 ── いつからいつまで｜中1歴史 §4</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { inset: 96px 150px 96px; align-content: center; gap: 34px; }
  .np-head { display: grid; gap: 12px; }
  .np-rows { display: grid; gap: 22px; }
  .np-r { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 34px;
          background: var(--paper-hi); border-radius: 18px; border-left: 12px solid var(--c);
          box-shadow: 0 12px 28px rgba(40,30,10,.10); padding: 26px 40px; }
  .np-r .era { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--c); }
  .np-r .per { font-size: 36px; color: var(--sumi-soft); font-weight:700; line-height:1.4; }
  .np-r .per .blank { font-size: 40px; }
  .np-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 36px; font-size:29px; }
  .np-note b { color: var(--gold-soft); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">04</span>　年表</span>
      <h1 class="headline" style="font-size:64px;">3つの時代は、<span class="em">いつ</span>のこと？</h1>
    </div>
    <div class="np-rows">
      <div class="np-r" style="--c:#1A1A1A" data-at="1" data-anim="left">
        <span class="era">旧石器時代</span>
        <span class="per"><span class="blank" data-fill="1"><span class="bnum">①</span><b>1万年</b></span>以前</span>
      </div>
      <div class="np-r" style="--c:#3A3A39" data-at="2" data-anim="left">
        <span class="era">縄文時代</span>
        <span class="per">前の時代の終わり　～　紀元前<span class="blank" data-fill="2"><span class="bnum">②</span><b>4世紀</b></span>ごろ</span>
      </div>
      <div class="np-r" style="--c:#535250" data-at="3" data-anim="left">
        <span class="era">弥生時代</span>
        <span class="per">前の時代の終わり　～　紀元後<span class="blank" data-fill="3"><span class="bnum">③</span><b>3世紀</b></span>ごろ</span>
      </div>
    </div>
    <div class="np-note" data-at="4" data-anim="fade"><span>覚え方</span><span>古い順に <b>旧石器 → 縄文 → 弥生</b>。境目の年号は<b>紀元前の4番目の世紀</b>。ここで縄文と弥生が分かれる。</span></div>
  </div>
  <div class="seed-foot"><span>第4章 日本の原始時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>

</html>
