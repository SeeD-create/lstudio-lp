<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe gt-safe">
    <div class="gt-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　原始時代とは</span>
      <h1 class="headline" style="font-size:66px;">時代を分ける手がかりは、<span class="em">道具</span></h1>
      <p class="lead gt-lead">文字の記録が残る前の時代。人々は<span class="strong">道具を進化させながら</span>、くらしを大きく変えていった。</p>
    </div>
    <div class="gt-row">
      <div class="gt-c" data-at="1" data-anim="pop"><span class="gt-arrow">→</span><div class="no">Ⅰ</div><div class="nm">旧石器</div><div class="ky">石を<span class="blank" data-fill="1"><b>打ち欠いて</b></span>作った道具。動物を追う。</div></div>
      <div class="gt-c" data-at="2" data-anim="pop"><span class="gt-arrow">→</span><div class="no">Ⅱ</div><div class="nm">縄文</div><div class="ky">石を<span class="blank" data-fill="2"><b>磨いて</b></span>作り、<span class="blank" data-fill="2"><b>土器</b></span>を使う。</div></div>
      <div class="gt-c" data-at="3" data-anim="pop"><div class="no">Ⅲ</div><div class="nm">弥生</div><div class="ky"><span class="blank" data-fill="3"><b>米づくり</b></span>が始まり、<span class="blank" data-fill="3"><b>金属器</b></span>を使う。</div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 日本の原始時代</span><span class="brand">SEED EDUCATION</span></div>
