<title>縄文時代④ ── 土偶（女性の姿の土製人形）｜中1歴史 §4</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .eq-safe { inset: 104px 150px 104px; grid-template-columns: 640px 1fr; align-content: center; gap: 74px; align-items: center; }
  .eq-fig { height: 720px; border-radius: 30px; }
  .eq-txt { display: grid; gap: 32px; }
  .eq-def { font-size: 42px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .eq-def .blank { font-size: 46px; }
  .eq-tags { display: flex; gap: 18px; flex-wrap: wrap; }
  .eq-note { font-size: 30px; color: var(--sumi-soft); line-height: 1.55; }
  .eq-note .em { color: var(--imp); font-weight: 900; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe eq-safe">
    <div class="figure eq-fig" data-at="0" data-anim="left"><img src="assets/dogu.webp" alt="土偶"></div>
    <div class="eq-txt">
      <span class="cat-badge" data-at="0"><span class="dot"></span>土の人形と時代名</span>
      <p class="eq-def" data-at="1">女性の姿をした土製の人形を
        <span class="blank" data-fill="1"><span class="bnum">①</span><b>土偶</b></span>という。</p>
      <p class="eq-def" data-at="2">この時代を
        <span class="blank" data-fill="2"><span class="bnum">②</span><b>縄文時代</b></span>といい、紀元前
        <span class="blank" data-fill="3"><span class="bnum">③</span><b>4世紀</b></span>ごろまで続いた。</p>
      <div class="eq-tags" data-at="3">
        <span class="tag tag--article">まじない・豊かな実りの願い</span>
      </div>
      <p class="eq-note" data-at="3">この人形は、えものや子孫が<span class="em">豊かにふえる</span>ことを願って作られたと考えられている。</p>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 日本の原始時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
