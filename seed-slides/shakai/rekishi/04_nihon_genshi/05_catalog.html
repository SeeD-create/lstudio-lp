<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>原始時代カタログ ── 集める4枚｜中1歴史 §4</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cat-safe { inset: 100px 130px 100px; align-content: start; gap: 40px; }
  .cat-head { display: grid; gap: 12px; }
  .deck-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
  .cc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 32px 28px 36px; min-height: 460px; display: grid; align-content: start; gap: 16px; }
  .cc::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--cat); border-radius:19px 19px 0 0; }
  .cc__no { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--cat); opacity:.35; }
  .cc__ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); line-height:1.15; margin-top:6px; }
  .cc__ess { font-size:27px; color:var(--sumi-soft); line-height:1.5; font-weight:500; }
  .cc__pill { justify-self:start; margin-top:auto; padding:7px 18px; border-radius:999px; background:var(--cat-bg); color:var(--cat); font-weight:900; font-size:22px; }
  .cat-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi); border-radius:20px; padding:26px 40px; }
  .cat-bar .k-ttl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--gold-soft); white-space:nowrap; }
  .cat-bar .k-body { font-size:29px; line-height:1.5; color:rgba(251,246,236,.94); }
  .cat-bar .k-body b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide">
  <div class="seed-safe cat-safe">
    <div class="cat-head" data-at="0">
      <span class="kicker"><span class="num">05</span>　原始時代カタログ</span>
      <h1 class="headline" style="font-size:66px;">集めるカードは、全部で<span class="goldem">4枚</span></h1>
    </div>
    <div class="deck-row">
      <div class="cc" data-cat="eq"  data-at="1" data-anim="pop"><div class="cc__no">Ⅰ</div><div class="cc__ttl">旧石器<br>時代</div><div class="cc__ess">打製石器でゾウを追う。まだ土器はない。</div><span class="cc__pill">1万年以前</span></div>
      <div class="cc" data-cat="lib" data-at="2" data-anim="pop"><div class="cc__no">Ⅱ</div><div class="cc__ttl">縄文<br>時代</div><div class="cc__ess">縄文土器・磨製石器。たて穴住居のむら。</div><span class="cc__pill">〜紀元前4世紀</span></div>
      <div class="cc" data-cat="soc" data-at="3" data-anim="pop"><div class="cc__no">Ⅲ</div><div class="cc__ttl">弥生<br>時代</div><div class="cc__ess">米づくりが始まり、青銅器を使う。</div><span class="cc__pill">紀元前4世紀〜3世紀</span></div>
      <div class="cc" data-cat="par" data-at="4" data-anim="pop"><div class="cc__no">Ⅳ</div><div class="cc__ttl">中国の<br>歴史書</div><div class="cc__ess">大陸の書物に残る「倭」＝日本のすがた。</div><span class="cc__pill">漢書・後漢書・魏志</span></div>
    </div>
    <div class="cat-bar" data-at="4" data-anim="fade">
      <span class="k-ttl">ひとことで</span>
      <span class="k-body">道具が<b>石 → 磨いた石＋土器 → 金属＋米</b>と進むと、くらしも「とる」から「つくる」へ。この流れを追えば全部つながる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第4章 日本の原始時代</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
