<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>市民革命とは ── 自由と平等の近代社会への道｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 100px 150px 100px; align-content: center; gap: 40px; }
  .sk-head { display: grid; gap: 14px; justify-items:center; text-align:center; }
  .sk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .nation-chip { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 26px 20px;
                 box-shadow: 0 12px 28px rgba(40,30,10,.10); display: grid; gap: 8px; justify-items:center; text-align:center; }
  .nation-chip .n { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); }
  .nation-chip .e { font-size:25px; color:var(--sumi-mute); font-weight:700; line-height:1.35; }
  .sk-arrow { justify-self:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi-mute); }
  .sk-result { display:flex; align-items:center; justify-content:center; gap:28px; background: var(--paper-hi); color: var(--sumi);
               border-radius:22px; padding:31px 45px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .sk-result .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color: var(--sumi); white-space:nowrap; }
  .sk-result .rb { font-size:36px; font-weight:700; line-height:1.4; }
  .sk-result .rb .blank { font-size:44px; min-width:240px; }
  .sk-result .rb b.hi { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe sk-safe">
    <div class="sk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート4</span>　まとめ ── 3つの革命の共通点</span>
      <h1 class="headline" style="font-size:60px;">3つの動きは、じつは<span class="em">1本の道</span></h1>
    </div>
    <div class="sk-row" data-at="1" data-anim="pop">
      <div class="nation-chip"><div class="n">イギリス</div><div class="e">ピューリタン革命<br>名誉革命</div></div>
      <div class="nation-chip"><div class="n">アメリカ</div><div class="e">独立戦争<br>独立宣言</div></div>
      <div class="nation-chip"><div class="n">フランス</div><div class="e">フランス革命<br>人権宣言</div></div>
    </div>
    <div class="sk-arrow" data-at="2">▼　どれも「王の支配をたおし、自由と平等の近代社会への道を開く」ため　▼</div>
    <div class="sk-result" data-at="3" data-anim="fade">
      <span class="rt">これらをまとめて</span>
      <span class="rb"><span class="blank" data-fill="3"><b>市民革命</b></span>という</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
