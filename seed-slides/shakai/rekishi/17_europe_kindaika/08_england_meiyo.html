<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>名誉革命と権利章典 ── 1688／1689｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .my-safe { inset: 96px 150px 96px; grid-template-columns: 1fr 520px; align-content: center; gap: 56px; align-items: center; }
  .my-txt { display: grid; gap: 22px; }
  .my-fig { height: 560px; border-radius: 28px; }
  .my-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .my-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .my-head { display: grid; gap: 12px; }
  .fbox { background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 18px 18px 0;
          padding: 22px 30px; box-shadow: 0 10px 26px rgba(40,30,10,.08); display: grid; gap: 6px; }
  .fbox .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--sumi); display:flex; align-items:center; gap:16px; }
  .fbox .t .yr { background:var(--sumi); color:var(--paper-hi); border-radius:10px; padding:3px 14px; font-size:24px; }
  .fbox .b { font-size:29px; line-height:1.55; color:var(--sumi); font-weight:700; }
  .fbox .b .blank { font-size: 32px; min-width: 200px; }
  .arrow { font-family:'Zen Old Mincho',serif; font-size:28px; color:var(--cat); justify-self:center; line-height:.6; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe my-safe">
    <div class="my-txt">
      <div class="my-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート1</span>　イギリスの革命 ②</span>
        <h1 class="headline" style="font-size:52px;">血を流さず、<span class="em">約束</span>を勝ちとる</h1>
      </div>
      <div class="fbox" data-at="1" data-anim="left">
        <div class="t"><span class="yr">1688</span>新しい国王を迎える</div>
        <div class="b">議会が<span class="blank" data-fill="2"><span class="bnum">①</span><b>オランダ</b></span>から新しい国王を迎え、前の国王を追放。これを<span class="blank" data-fill="3"><span class="bnum">②</span><b>名誉革命</b></span>という</div>
      </div>
      <span class="arrow" data-at="4">▼</span>
      <div class="fbox" data-at="4" data-anim="left">
        <div class="t"><span class="yr">1689</span>国王に約束させる</div>
        <div class="b">国王に、国民の自由と権利を守ることを約束させた。これを<span class="blank" data-fill="5"><span class="bnum">③</span><b>権利章典</b></span>という</div>
      </div>
    </div>
    <div class="figure my-fig" data-at="0" data-anim="right" data-ph="権利章典"><img src="assets/parliament_rights.webp" alt="権利章典（議会の建物・巻物・天秤）" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
