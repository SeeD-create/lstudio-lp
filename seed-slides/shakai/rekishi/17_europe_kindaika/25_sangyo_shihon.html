<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>資本主義と社会主義 ── 資本家・労働者・労働組合｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ss-safe { inset: 90px 150px 90px; align-content: center; gap: 24px; }
  .ss-head { display: grid; gap: 12px; }
  .ss-two { display: grid; grid-template-columns: 1fr 90px 1fr; align-items: center; gap: 20px; }
  .pcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 24px 30px;
           box-shadow: 0 12px 28px rgba(40,30,10,.10); display: grid; gap: 6px; justify-items:center; text-align:center; }
  .pcard .role { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--sumi-mute); }
  .pcard .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .pcard .nm .blank { font-size:38px; min-width:190px; }
  .pcard .de { font-size:24px; color:var(--sumi-soft); font-weight:700; line-height:1.35; }
  .ss-mid { justify-self:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi-mute); text-align:center; line-height:1.2; }
  .fbox { background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 18px 18px 0;
          padding: 20px 30px; box-shadow: 0 10px 26px rgba(40,30,10,.08); display: grid; gap: 4px; }
  .fbox .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); }
  .fbox .b { font-size:30px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .fbox .b .blank { font-size: 33px; min-width: 210px; }
  .arrow { font-family:'Zen Old Mincho',serif; font-size:26px; color:var(--cat); justify-self:center; line-height:.5; }
  .result { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:19px 31px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .result .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--sumi); white-space:nowrap; }
  .result .rb { font-size:30px; font-weight:700; }
  .result .blank { font-size:34px; min-width:210px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe ss-safe">
    <div class="ss-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート5</span>　産業革命 ②</span>
      <h1 class="headline" style="font-size:48px;">工場が生んだ、<span class="em">2つの立場</span></h1>
    </div>
    <div class="ss-two">
      <div class="pcard" data-at="1" data-anim="pop">
        <div class="role">工場を経営して利益を得る</div>
        <div class="nm"><span class="blank" data-fill="1"><span class="bnum">①</span><b>資本家</b></span></div>
        <div class="de">お金と工場を持つ側</div>
      </div>
      <div class="ss-mid" data-at="2">が<br>やとう<br>▶</div>
      <div class="pcard" data-at="2" data-anim="pop">
        <div class="role">工場ではたらいて賃金を得る</div>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">②</span><b>労働者</b></span></div>
        <div class="de">労働条件は悪かった</div>
      </div>
    </div>
    <div class="result" data-at="3" data-anim="fade">
      <span class="rt">このしくみを</span>
      <span class="rb"><span class="blank" data-fill="3"><span class="bnum">③</span><b>資本主義</b></span>という</span>
    </div>
    <div class="fbox" data-at="4" data-anim="left">
      <div class="t">やとわれた側の反撃</div>
      <div class="b">条件が悪いので、やとわれた側は<span class="blank" data-fill="4"><span class="bnum">④</span><b>労働組合</b></span>を作り、労働運動を始める</div>
    </div>
    <span class="arrow" data-at="5">▼　これが…</span>
    <div class="result" data-at="5" data-anim="fade" style="background:var(--imp);">
      <span class="rt" style="color:#fff;">やがて</span>
      <span class="rb"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>社会主義</b></span>思想のもとになった</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>

</body>
</html>
