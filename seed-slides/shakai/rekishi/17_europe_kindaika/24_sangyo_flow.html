<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>産業革命 ── イギリスで始まる／ワットの蒸気機関｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sf-safe { inset: 90px 150px 90px; grid-template-columns: 1fr 480px; align-content: center; gap: 54px; align-items: center; }
  .sf-txt { display: grid; gap: 20px; }
  .sf-fig { height: 560px; border-radius: 28px; }
  .sf-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .sf-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .sf-head { display: grid; gap: 12px; }
  .fbox { background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 18px 18px 0;
          padding: 20px 30px; box-shadow: 0 10px 26px rgba(40,30,10,.08); display: grid; gap: 4px; }
  .fbox .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--sumi); }
  .fbox .b { font-size:29px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .fbox .b .blank { font-size: 32px; min-width: 180px; }
  .arrow { font-family:'Zen Old Mincho',serif; font-size:26px; color:var(--cat); justify-self:center; line-height:.5; }
  .result { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:16px; padding:19px 29px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .result .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color: var(--sumi); white-space:nowrap; }
  .result .rb { font-size:30px; font-weight:700; }
  .result .blank { font-size:34px; min-width:220px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe sf-safe">
    <div class="sf-txt">
      <div class="sf-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート5</span>　機械が変えた世界 ①　<span style="background:var(--sumi);color:var(--paper-hi);border-radius:10px;padding:3px 14px;font-family:'Zen Old Mincho',serif;font-weight:900;font-size:24px;">1700年代の中ごろ</span></span>
        <h1 class="headline" style="font-size:48px;">機械が、世界を変えはじめた</h1>
      </div>
      <div class="fbox" data-at="1" data-anim="left">
        <div class="t">1. どこで・いつ</div>
        <div class="b"><span class="blank" data-fill="1"><span class="bnum">①</span><b>イギリス</b></span>で、<span class="blank" data-fill="2"><span class="bnum">②</span><b>18世紀</b></span>の中ごろから始まる</div>
      </div>
      <span class="arrow" data-at="3">▼</span>
      <div class="fbox" data-at="3" data-anim="left">
        <div class="t">2. 何がおきた</div>
        <div class="b">綿織物の需要が高まり、紡績機や<span class="blank" data-fill="3"><span class="bnum">③</span><b>蒸気機関</b></span>（ワットが改良）が発達</div>
      </div>
      <span class="arrow" data-at="4">▼</span>
      <div class="fbox" data-at="4" data-anim="left">
        <div class="t">3. 結果</div>
        <div class="b">綿織物が<span class="blank" data-fill="4"><span class="bnum">④</span><b>大量生産</b></span>され、商工業が発展</div>
      </div>
      <div class="result" data-at="5" data-anim="fade">
        <span class="rt">この変化を</span>
        <span class="rb"><span class="blank" data-fill="5"><span class="bnum">⑤</span><b>産業革命</b></span>という</span>
      </div>
    </div>
    <div class="figure sf-fig" data-at="0" data-anim="right" data-ph="産業革命"><img src="assets/industrial_revolution.webp" alt="産業革命（れんが工場・煙突・蒸気機関のはずみ車と歯車）" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
