<head>

<title>絶対王政 ── エリザベス1世の時代に全盛｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .zt-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 600px; align-content: center; gap: 66px; align-items: center; }
  .zt-txt { display: grid; gap: 28px; }
  .zt-fig { height: 620px; border-radius: 30px; }
  .zt-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .zt-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .fstep { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 24px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 22px 32px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:62px;height:62px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 32px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:25px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .tx .em { color: var(--imp); font-weight: 900; }
  .fstep .tx .blank { min-width:0; white-space:normal; padding:0 10px 3px; margin:0 2px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe zt-safe">
    <div class="zt-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ イギリスの革命　授業ノート1</span>
        <h1 class="headline" style="font-size:56px;margin-top:16px;">まずは、王が<span class="em">全部ひとりで決めた</span>時代</h1>
      </div>
      <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
        <div class="tx"><span class="blank" data-fill="1"><b>絶対王政</b></span>＝王が軍隊を強化し、思いのままに政治を行う<small>国王ひとりに権力が集中した政治のかたち</small></div></div>
      <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
        <div class="tx">16世紀後半、<span class="blank" data-fill="2"><b>エリザベス1世</b></span>の時代に全盛<small>イギリスの王の力が最も強かった時期</small></div></div>
      <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
        <div class="tx">その後、王が議会を無視し重い税をかける<small>やがて議会派が立ち上がり、革命へ…</small></div></div>
    </div>
    <div class="figure zt-fig" data-at="0" data-anim="right" data-ph="絶対王政"><img src="assets/absolute_monarchy.webp" alt="絶対王政（豪華な玉座と王冠）" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
