<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>三角貿易 ── 綿織物・紅茶・銀・アヘン｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .tr-safe { inset: 84px 130px 84px; grid-template-columns: 1fr 620px; align-content: center; gap: 56px; align-items: center; }
  .tr-txt { display: grid; gap: 18px; }
  .tr-head { display: grid; gap: 12px; }
  .fstep { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 22px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 18px 28px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:58px;height:58px;border-radius:50%;background:var(--sumi);color:#fff;
               font-family:'Zen Old Mincho',serif;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center; }
  .fstep .tx { font-size: 29px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx .blank { font-size:31px; min-width:170px; }
  .fstep .tx small { color:var(--sumi-mute); font-weight:600; }
  .tr-fig { position: relative; height: 600px; border-radius: 28px; background:var(--paper-hi); }
  .tr-fig svg { position:absolute; inset:0; width:100%; height:100%; }
  .node { position:absolute; transform:translate(-50%,-50%); background:var(--sumi); color:#fff; border-radius:14px;
          padding:12px 26px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.2); }
  .glabel { position:absolute; transform:translate(-50%,-50%); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:24px; color:var(--sumi); background:#fff; border:2px solid var(--line); border-radius:999px; padding:4px 16px; }
  .glabel.imp { color:var(--imp); border-color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe tr-safe">
    <div class="tr-txt">
      <div class="tr-head" data-at="0">
        <span class="kicker"><span class="num">授業ノート7</span>　アジア進出 ①</span>
        <h1 class="headline" style="font-size:48px;">3つの国をまわる、<span class="em">三角貿易</span></h1>
      </div>
      <div class="fstep" data-at="1" data-anim="left"><div class="no">1</div>
        <div class="tx">イギリスは<b>インド</b>へ<span class="blank" data-fill="1"><span class="bnum">①</span><b>綿織物</b></span>を輸出<small>（インドの手工業に打撃）</small></div></div>
      <div class="fstep" data-at="2" data-anim="left"><div class="no">2</div>
        <div class="tx">イギリスは<b>清</b>から<span class="blank" data-fill="2"><span class="bnum">②</span><b>紅茶</b></span>を大量に輸入</div></div>
      <div class="fstep" data-at="3" data-anim="left"><div class="no">3</div>
        <div class="tx">支払いに使う<span class="blank" data-fill="3"><span class="bnum">③</span><b>銀</b></span>が不足してしまう</div></div>
      <div class="fstep" data-at="4" data-anim="left"><div class="no">4</div>
        <div class="tx">そこで<b>インド</b>から<b>清</b>へ<span class="blank" data-fill="4"><span class="bnum">④</span><b>アヘン</b></span>を輸出させる</div></div>
      <div class="fstep" data-at="5" data-anim="fade" style="border-left-color:var(--imp);background:var(--sumi);"><div class="no" style="background:var(--imp);">!</div>
        <div class="tx" style="color:#fff;">④が清に広まって大問題に ── これが次のカードの<b style="color:var(--gold-soft);">戦争</b>の火種になる</div></div>
    </div>
    <div class="tr-fig" data-at="0" data-anim="right">
      <svg viewBox="0 0 620 600" fill="none">
        <path d="M310 130 L150 470" stroke="#535250" stroke-width="4"/>
        <path d="M150 470 L470 470" stroke="#C0392B" stroke-width="4"/>
        <path d="M470 470 L310 130" stroke="#535250" stroke-width="4"/>
        <path d="M232 296 l-20 -4 8 -19 z" fill="#535250"/>
        <path d="M320 470 l-22 -10 0 20 z" fill="#C0392B"/>
        <path d="M388 302 l12 -17 8 19 z" fill="#535250"/>
      </svg>
      <div class="node" style="left:50%; top:22%;">イギリス</div>
      <div class="node" style="left:24%; top:78%;">インド</div>
      <div class="node" style="left:76%; top:78%;">清</div>
      <div class="glabel" style="left:29%; top:49%;">①</div>
      <div class="glabel" style="left:71%; top:49%;">②／③</div>
      <div class="glabel imp" style="left:50%; top:80%;">④</div>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
