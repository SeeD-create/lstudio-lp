<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .a1-safe { inset: 100px 150px 100px; grid-template-columns: 1fr 600px; align-content: center; gap: 66px; align-items: center; }
  .a1-txt { display: grid; gap: 26px; }
  .a1-fig { height: 600px; border-radius: 30px; }
  .a1-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }

  .fstep { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 24px;

           padding: 22px 32px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .no { width:62px;height:62px;border-radius:50%;background:var(--sumi);color:#fff;

  .fstep .tx { font-size: 32px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:25px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .fstep .tx .em { color: var(--imp); font-weight: 900; }

<div class="seed-stage"><div class="seed-slide" data-cat="lib">
