<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3人の思想家 ── ロック・ルソー・モンテスキュー｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .th-safe { inset: 88px 100px 88px; align-content: center; gap: 30px; }
  .th-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .th-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .tcard { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
           box-shadow: 0 14px 30px rgba(40,30,10,.12); padding: 30px 32px 34px; display: grid; align-content: start; gap: 16px; min-height: 460px; }
  .tcard::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:19px 19px 0 0; }
  .tcard .nation { font-size:23px; color:var(--sumi-mute); font-weight:700; letter-spacing:.06em; }
  .tcard .name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); line-height:1.05; }
  .tcard .name .blank { font-size:44px; min-width:210px; }
  .tcard .work { display:inline-flex; align-items:center; gap:10px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .tcard .work .blank { font-size:30px; min-width:220px; }
  .tcard .idea { font-size:29px; line-height:1.5; color:var(--sumi); font-weight:700; margin-top:4px; }
  .tcard .idea .em { color:var(--imp); font-weight:900; }
  .th-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .th-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .th-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .th-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe th-safe">
    <div class="th-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート4</span>　市民革命を支えた思想家</span>
      <h1 class="headline" style="font-size:56px;">革命の<span class="em">設計図</span>を書いた3人</h1>
    </div>
    <div class="th-row">
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="nation">イギリスの思想家</div>
        <div class="name"><span class="blank" data-fill="1"><b>ロック</b></span></div>
        <div class="work">著書 ── 『統治二論』</div>
        <div class="idea">人間は生まれながらにして<span class="em">自由で平等</span>な権利を持つと説く（国民中心の政治）</div>
      </div>
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="nation">フランスの思想家</div>
        <div class="name"><span class="blank" data-fill="2"><b>ルソー</b></span></div>
        <div class="work">著書 ── <span class="blank" data-fill="4"><b>『社会契約論』</b></span></div>
        <div class="idea"><span class="em">人民（国民）の主権</span>を主張する</div>
      </div>
      <div class="tcard" data-at="0" data-anim="pop">
        <div class="nation">フランスの思想家</div>
        <div class="name"><span class="blank" data-fill="3"><b>モンテスキュー</b></span></div>
        <div class="work">著書 ── <span class="blank" data-fill="5"><b>『法の精神』</b></span></div>
        <div class="idea"><span class="em">三権分立</span>を主張する</div>
      </div>
    </div>
    <div class="th-note" data-at="6" data-anim="fade">
      <span class="bt">セットで覚える</span>
      <span class="bb">フランスの2人は<b>名前・著書・主張の3点セット</b>でよく出る。「国民主権を唱えたのは誰の何という本か」の形で問われるので、3つを結んで覚える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
