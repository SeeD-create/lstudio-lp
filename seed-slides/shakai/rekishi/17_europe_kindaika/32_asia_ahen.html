<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アヘン戦争と南京条約 ── 1840／1842・ホンコン｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .pf-safe { inset: 80px 160px 80px; align-content: center; gap: 16px; }
  .pf-head { display: grid; gap: 12px; }
  .fbox { background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 18px 18px 0;
          padding: 22px 32px; box-shadow: 0 10px 26px rgba(40,30,10,.08); display: grid; gap: 6px; }
  .fbox .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--sumi); display:flex; align-items:center; gap:16px; }
  .fbox .t .yr { background:var(--sumi); color:var(--paper-hi); border-radius:10px; padding:4px 16px; font-size:25px; letter-spacing:.05em; }
  .fbox .b { font-size:32px; line-height:1.55; color:var(--sumi); font-weight:700; }
  .fbox .b .blank { font-size: 34px; min-width: 220px; }
  .arrow { font-family:'Zen Old Mincho',serif; font-size:28px; color:var(--cat); justify-self:center; line-height:.5; }
  .result { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:21px 35px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .result .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color: var(--sumi); white-space:nowrap; }
  .result .rb { font-size:32px; font-weight:700; }
  .result .blank { font-size:36px; min-width:210px; }
  .pf-note { display:flex; align-items:center; gap:22px; background:var(--paper-hi); border:3px solid var(--imp); border-radius:16px; padding:12px 30px; }
  .pf-note .nt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--imp); white-space:nowrap; }
  .pf-note .nb { font-size:26px; line-height:1.4; color:var(--sumi); font-weight:700; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe pf-safe">
    <div class="pf-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート7</span>　アジア進出 ②</span>
      <h1 class="headline" style="font-size:50px;">アヘンをめぐって、<span class="em">戦争</span>へ</h1>
    </div>
    <div class="fbox" data-at="1" data-anim="left">
      <div class="t">1. きっかけ</div>
      <div class="b">清がアヘンの輸入を禁止し、取り締まる</div>
    </div>
    <span class="arrow" data-at="2">▼</span>
    <div class="fbox" data-at="2" data-anim="left">
      <div class="t"><span class="yr">1840</span>戦争がおこる</div>
      <div class="b"><span class="blank" data-fill="2"><span class="bnum">①</span><b>アヘン戦争</b></span>がおこり、清がイギリスに降伏する</div>
    </div>
    <span class="arrow" data-at="3">▼</span>
    <div class="fbox" data-at="3" data-anim="left">
      <div class="t"><span class="yr">1842</span>条約を結ぶ</div>
      <div class="b"><span class="blank" data-fill="3"><span class="bnum">②</span><b>南京条約</b></span>を結び、清を開国させる</div>
    </div>
    <div class="result" data-at="4" data-anim="fade">
      <span class="rt">イギリスは</span>
      <span class="rb"><span class="blank" data-fill="4"><span class="bnum">③</span><b>ホンコン</b></span>を植民地として手に入れる</span>
    </div>
    <div class="pf-note" data-at="5" data-anim="fade">
      <span class="nt">その後</span>
      <span class="nb">清は半植民地状態となり、社会が大きく混乱していく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
