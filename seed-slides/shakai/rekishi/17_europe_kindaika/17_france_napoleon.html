<!DOCTYPE html>

<head>

<title>ナポレオン ── 1804年に皇帝／ロシア遠征で失敗｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .pf-safe { inset: 96px 160px 96px; align-content: center; gap: 26px; }
  .pf-head { display: grid; gap: 12px; }
  .fbox { background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 18px 18px 0;
          padding: 26px 34px; box-shadow: 0 10px 26px rgba(40,30,10,.08); display: grid; gap: 6px; }
  .fbox .t { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--sumi); display:flex; align-items:center; gap:18px; }
  .fbox .t .yr { background:var(--sumi); color:var(--paper-hi); border-radius:10px; padding:4px 16px; font-size:26px; letter-spacing:.05em; }
  .fbox .b { font-size:34px; line-height:1.6; color:var(--sumi); font-weight:700; }
  .fbox .b .blank { font-size: 36px; min-width: 240px; }
  .fbox .b .em { color: var(--imp); font-weight: 900; }
  .arrow { font-family:'Zen Old Mincho',serif; font-size:30px; color:var(--cat); justify-self:center; line-height:.6; }
  .result { display:flex; align-items:center; gap:26px; background: var(--paper-hi); color: var(--sumi); border-radius:18px; padding:23px 37px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .result .rt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--sumi); white-space:nowrap; }
  .result .rb { font-size:34px; font-weight:700; }
  .result .blank { font-size:38px; min-width:220px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe pf-safe">
    <div class="pf-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート2</span>　フランス革命 ③</span>
      <h1 class="headline" style="font-size:54px;">革命が生んだ<span class="em">英雄</span>、そして没落</h1>
    </div>
    <div class="fbox" data-at="1" data-anim="left">
      <div class="t">1. 外国軍との戦いで活躍</div>
      <div class="b">革命の影響をおそれて攻めてきた外国軍との戦いで活躍した<span class="blank" data-fill="1"><span class="bnum">①</span><b>ナポレオン</b></span>が登場</div>
    </div>
    <span class="arrow" data-at="2">▼</span>
    <div class="fbox" data-at="2" data-anim="left">
      <div class="t"><span class="yr">1804</span>頂点に立つ</div>
      <div class="b"><span class="blank" data-fill="2"><span class="bnum">②</span><b>皇帝</b></span>となり、ヨーロッパの大部分を支配する</div>
    </div>
    <span class="arrow" data-at="3">▼</span>
    <div class="result" data-at="3" data-anim="fade">
      <span class="rt">しかし…</span>
      <span class="rb"><span class="blank" data-fill="3"><span class="bnum">③</span><b>ロシア遠征</b></span>で失敗し、フランスは王政にもどった</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
