<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hr-safe { inset: 90px 130px 90px; align-content: center; gap: 34px; }
  .hr-head { display: grid; gap: 12px; justify-items:center; text-align:center; }
  .hr-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
  .rcd { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--cat);
         box-shadow: 0 14px 30px rgba(40,30,10,.12); padding: 30px 36px 34px; display: grid; gap: 16px; align-content: start; min-height: 380px; }
  .rcd::before { content:""; position:absolute; left:0; top:0; right:0; height:10px; background:var(--cat); border-radius:19px 19px 0 0; }
  .rcd .yr { display:inline-block; background:var(--sumi); color:#fff; border-radius:10px; padding:4px 18px;
             font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; justify-self:start; }
  .rcd .place { font-size:24px; color:var(--sumi-mute); font-weight:700; }
  .rcd .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--sumi); line-height:1.1; }
  .rcd .nm .blank { font-size:42px; min-width:230px; }
  .rcd .de { font-size:29px; line-height:1.5; color:var(--sumi); font-weight:700; }
  .rcd .de .blank { font-size:31px; min-width:180px; }
  .rcd .de .em { color:var(--imp); font-weight:900; }
  .hr-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 36px; }
  .hr-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .hr-note .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hr-note .bb b { color:#fff; }
</style>
</head>

<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe hr-safe">
    <div class="hr-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート7</span>　アジア進出 ③</span>
      <h1 class="headline" style="font-size:50px;">おさえこまれた、<span class="em">2つの反乱</span></h1>
    </div>
    <div class="hr-row">
      <div class="rcd" data-at="1" data-anim="pop">

        <div class="de"><span class="blank" data-fill="2"><b>洪秀全</b></span>が、漢民族による新しい政府をつくろうとした</div>
      </div>

        <span class="yr">1857</span>
        <div class="place">インドでおきる</div>
        <div class="nm"><span class="blank" data-fill="3"><b>インド大反乱</b></span></div>
        <div class="de" data-at="4">インド兵の反乱。おさえられ、<span class="em">イギリスのインド支配が強まった</span></div>
      </div>
    </div>
    <div class="hr-note" data-at="5" data-anim="fade">
      <span class="bt">共通点</span>
      <span class="bb">どちらもイギリスなどの力に<b>おさえられた</b>。清もインドも、ヨーロッパの支配が強まっていく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
