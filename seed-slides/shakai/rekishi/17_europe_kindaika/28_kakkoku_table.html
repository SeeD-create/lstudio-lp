<title>各国の近代化 ── ロシア・イタリア・アメリカ・ドイツ｜中2歴史 第17章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .kk-safe { inset: 76px 120px 76px; align-content: start; gap: 22px; }
  .kk-head { display: grid; gap: 8px; }
  .kk-tbl { display: grid; gap: 14px; }
  .krow { display: grid; grid-template-columns: 250px 1fr; align-items: stretch; gap: 0;
          background: var(--paper-hi); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 24px rgba(40,30,10,.09); border: 2px solid var(--line); }
  .krow .cty { background: var(--sumi); color: var(--paper-hi); display: grid; align-content:center; gap:4px; padding: 16px 24px; }
  .krow .cty .cn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; }
  .krow .cty .cy { font-size:20px; color:var(--gold-soft); font-weight:700; }
  .krow .ev { padding: 14px 26px; display: grid; align-content:center; gap:8px; }
  .krow .ev .line { font-size:27px; line-height:1.4; color:var(--sumi); font-weight:700; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .krow .ev .line .yr { background:var(--sumi-mute); color:#fff; border-radius:8px; padding:2px 12px; font-size:21px; font-family:'Zen Old Mincho',serif; font-weight:900; }
  .krow .ev .line .blank { font-size:29px; min-width:190px; }
  .kk-note { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 32px; }
  .kk-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:25px; color:var(--gold-soft); white-space:nowrap; }
  .kk-note .bb { font-size:23px; line-height:1.4; color:rgba(251,251,250,.92); }
  .kk-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe kk-safe">
    <div class="kk-head" data-at="0">
      <span class="kicker"><span class="num">授業ノート6</span>　各国の近代化</span>
      <h1 class="headline" style="font-size:46px;">同じころ、世界の国々も<span class="em">生まれ変わる</span></h1>
    </div>
    <div class="kk-tbl">
      <div class="krow" data-at="1" data-anim="left">
        <div class="cty"><div class="cn">ロシア</div><div class="cy">1853 / 1861</div></div>
        <div class="ev">
          <div class="line"><span class="yr">1853</span><span class="blank" data-fill="1"><span class="bnum">①</span><b>クリミア戦争</b></span>で英・仏に敗れる</div>
          <div class="line"><span class="yr">1861</span>近代化のため<span class="blank" data-fill="1"><span class="bnum">②</span><b>農奴解放令</b></span>を出す</div>
        </div>
      </div>
      <div class="krow" data-at="2" data-anim="left">
        <div class="cty"><div class="cn">イタリア</div><div class="cy">1861</div></div>
        <div class="ev">
          <div class="line"><span class="yr">1861</span><span class="blank" data-fill="2"><span class="bnum">③</span><b>イタリア王国</b></span>が成立する</div>
        </div>
      </div>
      <div class="krow" data-at="3" data-anim="left">
        <div class="cty"><div class="cn">アメリカ</div><div class="cy">1861</div></div>
        <div class="ev">
          <div class="line"><span class="yr">1861</span><span class="blank" data-fill="3"><span class="bnum">④</span><b>南北戦争</b></span>が始まる</div>
          <div class="line"><span class="blank" data-fill="4"><span class="bnum">⑤</span><b>リンカン</b></span>大統領の北軍が勝ち、<span class="blank" data-fill="5"><span class="bnum">⑥</span><b>奴隷解放宣言</b></span>を出す</div>
        </div>
      </div>
      <div class="krow" data-at="6" data-anim="left">
        <div class="cty"><div class="cn">ドイツ</div><div class="cy">1871</div></div>
        <div class="ev">
          <div class="line"><span class="yr">1871</span><span class="blank" data-fill="6"><span class="bnum">⑦</span><b>ドイツ帝国</b></span>が成立し、<span class="blank" data-fill="6"><span class="bnum">⑧</span><b>ビスマルク</b></span>が首相となる</div>
        </div>
      </div>
    </div>
    <div class="kk-note" data-at="6" data-anim="fade">
      <span class="bt">数字で整理</span>
      <span class="bb"><b>1861年</b>にロシア・イタリア・アメリカの3つが集中。<b>1871年</b>にドイツ。年号から国と出来事を言えるようにする。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第17章 ヨーロッパの近代化</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
