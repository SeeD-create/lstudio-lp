<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>登場人物カード ── まず４人を覚える｜中2歴史 第20章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .jn-safe { inset: 96px 140px 96px; align-content: start; gap: 34px; }
  .jn-head { display: grid; gap: 12px; }
  .jn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .pc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c);
        box-shadow: 0 16px 34px rgba(40,30,10,.12); padding: 30px 30px 34px; min-height: 520px; display: grid; align-content: start; gap: 16px; }
  .pc__seal { position:absolute; right:22px; top:18px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:120px; color:var(--c); opacity:.10; line-height:1; }
  .pc__from { font-weight:900; font-size:22px; color:var(--c); letter-spacing:.08em; }
  .pc__name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:48px; color:var(--sumi); line-height:1.1; }
  .pc__yomi { font-size:22px; color:var(--sumi-mute); font-weight:600; margin-top:-6px; }
  .pc__role { font-size:26px; color:var(--sumi-soft); line-height:1.55; font-weight:600; margin-top:4px; }
  .pc__role b { color:var(--imp); font-weight:900; }
  .pc__tag { justify-self:start; margin-top:auto; padding:7px 18px; border-radius:10px; background:var(--c); color:#fff; font-weight:900; font-size:20px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe jn-safe">
    <div class="jn-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　この単元の登場人物</span>
      <h1 class="headline" style="font-size:60px;">まず、この<span class="em">4人</span>の顔ぶれを覚える</h1>
    </div>
    <div class="jn-row">
      <div class="pc" style="--c:#1A1A1A" data-at="1" data-anim="pop">
        <span class="pc__seal">西</span>
        <span class="pc__from">薩摩藩 出身</span>
        <span class="pc__name">西郷隆盛</span>
        <span class="pc__yomi">さいごう たかもり</span>
        <span class="pc__role">征韓論を主張して政府を去り、<br>のち<b>西南戦争</b>を起こす。</span>
        <span class="pc__tag">士族の反乱</span>
      </div>
      <div class="pc" style="--c:#3A3A39" data-at="2" data-anim="pop">
        <span class="pc__seal">板</span>
        <span class="pc__from">土佐藩 出身</span>
        <span class="pc__name">板垣退助</span>
        <span class="pc__yomi">いたがき たいすけ</span>
        <span class="pc__role"><b>建白書</b>を提出し立志社を結成。<br>のち<b>自由党</b>をつくる。</span>
        <span class="pc__tag">自由民権運動</span>
      </div>
      <div class="pc" style="--c:#535250" data-at="3" data-anim="pop">
        <span class="pc__seal">大</span>
        <span class="pc__from">肥前藩 出身</span>
        <span class="pc__name">大隈重信</span>
        <span class="pc__yomi">おおくま しげのぶ</span>
        <span class="pc__role">おだやかな議会政治をめざす<br><b>立憲改進党</b>をつくる。</span>
        <span class="pc__tag">立憲改進党</span>
      </div>
      <div class="pc" style="--c:#6B6A67" data-at="4" data-anim="pop">
        <span class="pc__seal">伊</span>
        <span class="pc__from">長州藩 出身</span>
        <span class="pc__name">伊藤博文</span>
        <span class="pc__yomi">いとう ひろぶみ</span>
        <span class="pc__role">ドイツ憲法を調べ、<b>初代総理大臣</b>に。<br>憲法づくりの中心。</span>
        <span class="pc__tag">憲法・内閣</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第20章 自由民権運動と憲法</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
