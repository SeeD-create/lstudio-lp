<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2つの政党 ── 自由党（板垣）と立憲改進党（大隈）｜中2歴史 第20章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .st-safe { inset: 92px 150px 92px; align-content: center; gap: 32px; }
  .st-head { display: grid; gap: 12px; }
  .party-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .party { position: relative; background: var(--paper-hi); border: 3px solid var(--c); border-radius: 24px; padding: 34px 40px 38px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 18px; }
  .party::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:21px 21px 0 0; }
  .party .pname { display:flex; align-items:baseline; gap:16px; }
  .party .pname .lab { font-weight:900; font-size:26px; color:var(--c); white-space:nowrap; }
  .party .pname .blank { font-size: 46px; min-width: 320px; }
  .party .leader { font-size: 32px; font-weight: 700; color: var(--sumi); }
  .party .leader b { color: var(--imp); }
  .party .stance { background: var(--cat-bg); border-radius: 14px; padding: 18px 24px; font-size: 28px; line-height: 1.45; color: var(--sumi); font-weight: 600; }
  .party .stance b { color: var(--imp); font-weight: 900; }
  .yeartag { display:inline-flex; align-items:center; gap:12px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; padding:7px 20px; border-radius:12px; }
  .hit { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe st-safe">
    <div class="st-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 政党と国会開設　<span class="yeartag" style="margin-left:12px;">1882</span></span>
      <h1 class="headline" style="font-size:52px;margin-top:10px;">国会に備えて、2つの政党が生まれる</h1>
    </div>
    <div class="party-row">
      <div class="party" style="--c:#3A3A39" data-at="1" data-anim="pop">
        <div class="pname"><span class="lab">板垣退助が結成</span>
          <span class="blank" data-fill="2"><span class="bnum">⑨</span><b>自由党</b></span></div>
        <div class="leader">党首 ── <b>板垣退助</b>（土佐）</div>
        <div class="stance"><b>急進的</b>な議会政治をめざす。フランス流の考えの影響。</div>
      </div>
      <div class="party" style="--c:#535250" data-at="3" data-anim="pop">
        <div class="pname"><span class="lab">大隈重信が結成</span>
          <span class="blank" data-fill="4"><span class="bnum">⑩</span><b>立憲改進党</b></span></div>
        <div class="leader">党首 ── <b>大隈重信</b>（肥前）</div>
        <div class="stance"><b>おだやか</b>な議会政治をめざす。イギリス流・財産家が中心。</div>
      </div>
    </div>
    <div class="hit" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出</span>
      <span class="bb">セットで覚える ── <b>急進的な党＝板垣退助</b>／<b>おだやかな党＝大隈重信</b>。人物と党名をひもづける。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第20章 自由民権運動と憲法</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
