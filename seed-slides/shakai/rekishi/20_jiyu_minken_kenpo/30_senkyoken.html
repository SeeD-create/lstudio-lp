<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 90px 150px 90px; grid-template-columns: 1fr 480px; align-content: center; gap: 54px; align-items: center; }
  .sk-txt { display: grid; gap: 24px; }
  .sk-fig { height: 540px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:18px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:220px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:26px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; text-align:center; }
  .def { font-size: 38px; font-weight: 700; color: var(--sumi); line-height: 1.6; }
  .def .blank { font-size: 44px; min-width: 150px; }
  .def .imp { color: var(--imp); font-weight:900; }
  .cond { display:flex; gap:16px; }
  .chip { flex:1; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 16px; padding: 16px 12px; text-align:center; box-shadow: 0 10px 24px rgba(40,30,10,.08); }
  .chip .cv { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--imp); line-height:1.1; }
  .chip .cl { font-size: 20px; color: var(--sumi-soft); font-weight:600; margin-top:4px; }
  .hit { display:flex; align-items:center; gap:20px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 28px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:24px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe sk-safe">
    <div class="sk-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅴ はじめての国会と選挙権</span>
        <h1 class="headline" style="font-size:48px;margin-top:12px;">投票できたのは、ごく一部の人だけ</h1>
      </div>
      <p class="def" data-at="1" data-anim="fade">衆議院議員の選挙権は、
        <span class="blank" data-fill="2"><span class="bnum">⑲</span><b>25歳</b></span>以上で、直接国税を
        <span class="blank" data-fill="2"><span class="bnum">⑳</span><b>15円</b></span>以上納める <span class="imp">男子</span> に限られた。</p>
      <div class="cond" data-at="3" data-anim="pop">
        <div class="chip"><div class="cv">⑲以上</div><div class="cl">年齢の条件</div></div>
        <div class="chip"><div class="cv">⑳以上</div><div class="cl">直接国税（納税）</div></div>
        <div class="chip"><div class="cv">男子</div><div class="cl">女性に選挙権なし</div></div>
      </div>
      <div class="hit" data-at="4" data-anim="fade">

        <span class="bb">3条件は「<b>年齢・直接国税の額・男子</b>」。投票できたのは全人口の<b>約1.1％</b>だけ。2つの数字を正確に。</span>
      </div>
    </div>
    <div class="figure sk-fig" data-at="0" data-anim="right"><img src="assets/senkyo.webp" alt="一票を持てたのはごく限られた人（第1回総選挙）"></div>
  </div>
  <div class="seed-foot"><span>第20章 自由民権運動と憲法</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
