<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>二院制 ── 貴族院と衆議院のちがい｜中2歴史 第20章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .st-safe { inset: 92px 150px 92px; align-content: center; gap: 32px; }
  .st-head { display: grid; gap: 12px; }
  .party-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .party { position: relative; background: var(--paper-hi); border: 3px solid var(--c); border-radius: 24px; padding: 34px 40px 38px; box-shadow: 0 16px 36px rgba(40,30,10,.12); display: grid; gap: 18px; }
  .party::before { content:""; position:absolute; left:0; top:0; right:0; height:12px; background:var(--c); border-radius:21px 21px 0 0; }
  .party .pname { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .party .pname .lab { font-weight:900; font-size:26px; color:var(--c); white-space:nowrap; }
  .party .pname .blank { font-size: 46px; min-width: 300px; }
  .party .how { background: var(--cat-bg); border-radius: 14px; padding: 20px 24px; font-size: 30px; line-height: 1.5; color: var(--sumi); font-weight: 700; }
  .party .how b { color: var(--imp); font-weight: 900; }
  .hit { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:27px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe st-safe">
    <div class="st-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅴ はじめての国会と選挙権</span>
      <h1 class="headline" style="font-size:52px;margin-top:10px;">国会は、2つの院でできていた</h1>
    </div>
    <div class="party-row">
      <div class="party" style="--c:#535250" data-at="1" data-anim="pop">
        <div class="pname"><span class="lab">選挙で選ばない</span>
          <span class="blank" data-fill="2"><span class="bnum">⑰</span><b>貴族院</b></span></div>
        <div class="how">議員は<b>皇族・華族・高額納税者</b>など。<br>国民の選挙では選ばれない。</div>
      </div>
      <div class="party" style="--c:#848380" data-at="3" data-anim="pop">
        <div class="pname"><span class="lab">選挙で選ぶ</span>
          <span class="blank" data-fill="4"><span class="bnum">⑱</span><b>衆議院</b></span></div>
        <div class="how">議員は<b>国民の選挙で選ぶ</b>。<br>ただし投票できる人は限られていた。</div>
      </div>
    </div>
    <div class="hit" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出</span>
      <span class="bb">見分け方 ── <b>皇族・華族・高額納税者からなる院は選挙で選ばれない</b>／<b>国民の選挙で選ばれる院がもう一方</b>。「選ばれなかった院は？」がよく出る。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第20章 自由民権運動と憲法</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
