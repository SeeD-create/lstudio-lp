<div class="seed-stage"><div class="seed-slide" data-cat="eq">

      <h1 class="headline" style="font-size:60px;">「不満」から「運動」へ、そして<span class="em">憲法と国会</span>へ</h1>
    </div>
    <p class="tw-def" data-at="1">明治のはじめ、政治は薩摩・長州の出身者が独占していた（<span class="em">藩閥政治</span>）。<br>特権を失った士族はまず刀で反乱を起こし、やがて板垣退助らが「<span class="em">国会を開け</span>」と言論で政府にせまった。この流れの終着点が、<span class="em">大日本帝国憲法</span>と<span class="em">帝国議会</span>だ。</p>
    <div class="flow">
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">士族の反乱</div><div class="ds">征韓論の政変・<b>西南戦争</b>。刀での抵抗は敗れる。</div></div>
      <div class="arrow" data-at="2">→</div>
      <div class="fb" data-at="2" data-anim="pop"><div class="ttl">自由民権運動</div><div class="ds">建白書・国会期成同盟。<b>言論</b>で国会開設を求める。</div></div>
      <div class="arrow" data-at="3">→</div>
      <div class="fb" data-at="3" data-anim="pop"><div class="ttl">政党と準備</div><div class="ds"><b>自由党・立憲改進党</b>。内閣制度で憲法を準備。</div></div>
      <div class="arrow" data-at="3">→</div>

    </div>
  </div>
