      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext">① 1874年に板垣退助が出した国会開設の要求（意見書）は？<br>② 板垣が土佐でつくった政治団体は？　③ 1880年に大阪でつくられた全国組織は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">民撰議院設立建白書</span>　── 国会開設を政府に求めた。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">立志社</span>　── 板垣が高知県（土佐）で結成。</b></span></span></div>

      </div>
    </div>
  </div>
