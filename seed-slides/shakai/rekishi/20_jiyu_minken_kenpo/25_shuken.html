    </div>
    <p class="def" data-at="1" data-anim="fade">大日本帝国憲法では、主権（国の政治を最終的に決める力）は
      <span class="blank" data-fill="2"><span class="bnum">⑮</span><b>天皇</b></span> にあった。</p>
    <ul class="pts">
      <li data-at="2" data-anim="left"><span class="mk">1</span><span class="tx">軍隊の指揮や条約の締結など、大きな権限をひとりでもった。</span></li>
      <li data-at="2" data-anim="left"><span class="mk">2</span><span class="tx">国民の自由や権利は、<b>法律の範囲内</b>でのみ認められた。</span></li>
    </ul>
    <div class="hit" data-at="3" data-anim="fade">
      <span class="bt">★ 頻出</span>
      <span class="bb">主権をもったのは国民ではない（＝今の日本国憲法の「国民主権」とは正反対）。権利は“法律の範囲内”という点も問われる。</span>
    </div>
  </div>
