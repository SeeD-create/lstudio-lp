<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>スペインの征服 ── アステカ帝国・インカ帝国を滅ぼす｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cq-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 560px; align-content: center; gap: 56px; align-items: center; }
  .cq-txt { display: grid; gap: 24px; }
  .cq-fig { height: 620px; border-radius: 28px; }
  .cq-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .cq-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .yrtag { display:inline-flex; align-items:center; gap:14px; background:var(--sumi); color:#fff; border-radius:14px; padding:12px 26px;
           font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; }
  .yrtag .lbl { font-size:22px; color:var(--gold-soft); letter-spacing:.1em; font-family:'Zen Kaku Gothic New',sans-serif; }
  .cq-def { font-size: 38px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .cq-def .em { color: var(--imp); font-weight: 900; }
  .cq-def .blank { font-size:38px; min-width:170px; }
  .empires { display:grid; gap:14px; }
  .emp { display:grid; grid-template-columns: 1fr 170px; align-items:center; gap:20px;
         background: var(--paper-hi); border-left:10px solid var(--cat); border-radius:0 16px 16px 0; padding:20px 30px; box-shadow:0 8px 22px rgba(40,30,10,.07); }
  .emp .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color:var(--sumi); }
  .emp .nm .blank { font-size:36px; min-width:230px; }
  .emp .loc { text-align:center; font-weight:900; font-size:26px; color:var(--cat); }
  .emp .loc small { display:block; font-size:20px; color:var(--sumi-mute); font-weight:500; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe cq-safe">
    <div class="cq-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅴ 大航海時代</span>
        <h1 class="headline" style="font-size:52px;margin-top:14px;">海のむこうの<span class="em">帝国を、滅ぼした</span></h1>
      </div>
      <span class="yrtag" data-at="1" data-anim="left"><span class="lbl">TIME</span>16世紀中ごろ</span>
      <p class="cq-def" data-at="2"><span class="blank" data-fill="2"><span class="bnum">①</span><b>スペイン</b></span> は、アメリカ大陸に進出して、<br>2つの帝国を武力で滅ぼした。</p>
      <div class="empires">
        <div class="emp" data-at="3" data-anim="left"><div class="nm"><span class="blank" data-fill="3"><span class="bnum">②</span><b>アステカ帝国</b></span></div><div class="loc">メキシコ<small>あたり</small></div></div>
        <div class="emp" data-at="4" data-anim="left"><div class="nm"><span class="blank" data-fill="4"><span class="bnum">③</span><b>インカ帝国</b></span></div><div class="loc">ペルー<small>あたり</small></div></div>
      </div>
    </div>
    <div class="figure cq-fig" data-at="0" data-anim="right" data-ph="スペインの征服"><img src="assets/conquest.webp" alt="スペインの征服" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
