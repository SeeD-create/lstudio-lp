<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ルネサンス（文芸復興）── 14世紀・北イタリア｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rn-safe { inset: 96px 150px 96px; align-content: center; gap: 38px; }
  .rn-head { display: grid; gap: 14px; }
  .rn-def { font-size: 42px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .rn-def .em { color: var(--imp); font-weight: 900; }
  .rn-def .blank { font-size: 42px; min-width: 210px; }
  .facts { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
  .fx { background: var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:24px 26px;
        box-shadow:0 12px 28px rgba(40,30,10,.10); display:grid; gap:6px; }
  .fx .lb { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:24px; color:var(--cat); letter-spacing:.08em; }
  .fx .vl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .fx .vl small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .rn-mean { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .rn-mean .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .rn-mean .bb { font-size:29px; line-height:1.45; }
  .rn-mean .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe rn-safe">
    <div class="rn-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 自由な文化の芽ばえ</span>
      <h1 class="headline" style="font-size:58px;">教会の枠をこえた、<span class="em">人間らしい文化</span></h1>
    </div>
    <p class="rn-def" data-at="1">14世紀ごろから、キリスト教にとらわれない自由な文化が生まれた。<br>この動きを <span class="blank" data-fill="2"><span class="bnum">①</span><b>ルネサンス</b></span>（文芸復興）という。</p>
    <div class="facts">
      <div class="fx" data-at="3" data-anim="pop"><div class="lb">いつ</div><div class="vl">14世紀ごろ<small>15〜16世紀に各地へ広まる</small></div></div>
      <div class="fx" data-at="4" data-anim="pop"><div class="lb">どこで</div><div class="vl">北イタリア<small>都市の商人たちがささえた</small></div></div>
      <div class="fx" data-at="5" data-anim="pop"><div class="lb">とくちょう</div><div class="vl">人間らしさ<small>自由と生き生きした美しさを求める</small></div></div>
    </div>
    <div class="rn-mean" data-at="5" data-anim="fade">
      <span class="bt">意味</span>
      <span class="bb">この語は<b>「文芸復興」</b>と訳す。ギリシャ・ローマの文化をよみがえらせ、人間そのものを見つめ直した。<b>キリスト教にとらわれない</b>のがポイント。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
