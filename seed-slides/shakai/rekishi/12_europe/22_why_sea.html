<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>なぜ海へ？ ── こしょう・絹織物を求めて｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ws-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 580px; align-content: center; gap: 60px; align-items: center; }
  .ws-txt { display: grid; gap: 26px; }
  .ws-fig { height: 620px; border-radius: 28px; }
  .ws-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .ws-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .ws-def { font-size: 40px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .ws-def .em { color: var(--imp); font-weight: 900; }
  .ws-def .blank { font-size: 40px; min-width: 180px; }
  .want { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
  .wt { background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:22px 26px; text-align:center;
        box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .wt .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--imp); }
  .wt .ds { font-size:23px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
  .ws-who { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:24px 34px; }
  .ws-who .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .ws-who .bb { font-size:29px; line-height:1.45; }
  .ws-who .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe ws-safe">
    <div class="ws-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅴ 大航海時代</span>
        <h1 class="headline" style="font-size:56px;margin-top:16px;">ほしいのは、<span class="em">アジアの香辛料</span>だった</h1>
      </div>
      <p class="ws-def" data-at="1">ヨーロッパの国々は、<span class="blank" data-fill="2"><span class="bnum">①</span><b>こしょう</b></span> や絹織物を求めて、<br>アジアへの航路を直接開こうとした。</p>
      <div class="want">
        <div class="wt" data-at="3" data-anim="pop"><div class="nm">香辛料</div><div class="ds">肉の保存や味つけに欠かせない。とくに①がねらい</div></div>
        <div class="wt" data-at="3" data-anim="pop"><div class="nm">絹織物</div><div class="ds">アジアでしか手に入らない高級品</div></div>
      </div>
      <div class="ws-who" data-at="4" data-anim="fade">
        <span class="bt">先頭に立った国</span>
        <span class="bb">海に近い <b>スペイン</b> と <b>ポルトガル</b> が、いち早く大西洋へ船をこぎ出した。</span>
      </div>
    </div>
    <div class="figure ws-fig" data-at="0" data-anim="right" data-ph="大航海時代の船"><img src="assets/age_of_sail.webp" alt="大航海時代の帆船" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
