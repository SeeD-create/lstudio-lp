<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ゲルマン人の大移動 ── ローマ帝国の崩壊｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .gm-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 620px; align-content: center; gap: 62px; align-items: center; }
  .gm-txt { display: grid; gap: 26px; }
  .gm-fig { height: 640px; border-radius: 28px; }
  .gm-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .gm-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .flow { display: grid; gap: 13px; }
  .fstep { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 22px;
           background: var(--paper-hi); border-left: 10px solid var(--cat); border-radius: 0 16px 16px 0;
           padding: 18px 28px; box-shadow: 0 8px 22px rgba(40,30,10,.07); }
  .fstep .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:42px; color:var(--sumi); text-align:center; letter-spacing:.02em; }
  .fstep .tx { font-size: 31px; line-height: 1.4; color: var(--sumi); font-weight: 700; }
  .fstep .tx small { display:block; font-size:23px; color:var(--sumi-mute); font-weight:500; margin-top:3px; }
  .fstep .tx .em { color: var(--imp); font-weight: 900; }
  .blank { font-size:31px; min-width:150px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe gm-safe">
    <div class="gm-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ ローマ帝国と北方の民族</span>
        <h1 class="headline" style="font-size:54px;margin-top:16px;">大移動が、古代ローマを<span class="em" style="color:var(--imp)">終わらせた</span></h1>
      </div>
      <div class="flow">
        <div class="fstep" data-at="1" data-anim="left"><div class="yr">375</div>
          <div class="tx"><span class="blank" data-fill="2"><span class="bnum">①</span><b>ゲルマン人</b></span>の大移動が始まる<small>北方の民族が、あたたかい南のローマ領へ移動を開始</small></div></div>
        <div class="fstep" data-at="3" data-anim="left"><div class="yr">395</div>
          <div class="tx"><span class="em">ローマ帝国</span>が東西に分裂する<small>広すぎる帝国を東と西に分けて統治</small></div></div>
        <div class="fstep" data-at="4" data-anim="left"><div class="yr">476</div>
          <div class="tx"><span class="em">西ローマ帝国</span>が滅ぶ<small>北から来た民族に滅ぼされ、古代がおわる</small></div></div>
      </div>
    </div>
    <div class="figure gm-fig" data-at="0" data-anim="right" data-ph="ゲルマン人の大移動"><img src="assets/germanic_migration.webp" alt="ゲルマン人の大移動" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
