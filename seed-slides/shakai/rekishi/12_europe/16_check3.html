<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── ルネサンス｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 44px; justify-items: center; }
  .qcard { width: 1460px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:49px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 44px; line-height: 1.5; font-weight: 700; margin-top: 16px; }
  .qcard .qtext .u { color: var(--sumi); border-bottom: 4px solid var(--imp); }
  .ans { margin-top: 30px; display: flex; align-items: baseline; gap: 26px; }
  .ans .mark { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; line-height:1; color: var(--sumi); white-space:nowrap; }
  .ans .exp { font-size: 32px; line-height: 1.45; color: var(--sumi); }
  .ans .exp b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 一問一答</div>
      <p class="qtext" data-at="0">14世紀ごろから、<span class="u">キリスト教にとらわれない</span>自由な文化が生まれた。<br>この動きを何というか。（別名も答えよ）</p>
      <div class="ans" data-at="1">
        <span class="mark" data-at="1" data-anim="pop">答え</span>
        <span class="exp" data-at="2"><span class="blank blank--para" data-fill="2"><b><span class="hl">ルネサンス（文芸復興）</span>　──　北イタリアが中心。代表作は<span class="hl">モナリザ像</span>と<span class="hl">ダビデ像</span>。「人間」を主役にした文化。</b></span></span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
