<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3人の航路 ── 西へ・南へ・世界一周（模式図）｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .mp-safe { inset: 90px 120px 90px; align-content: center; gap: 24px; }
  .mp-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .mp-wrap { display:grid; grid-template-columns: 1fr 400px; gap:34px; align-items:center; }
  .mapbox { background: var(--paper-hi); border:3px solid var(--hair); border-radius:24px; padding:14px; box-shadow:0 14px 32px rgba(40,30,10,.10); }
  .mapbox svg { display:block; width:100%; height:auto; }
  .land { fill: var(--paper-lo); stroke: var(--sumi-mute); stroke-width:2.5; }
  .land-lbl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; fill: var(--sumi); }
  .port { fill: var(--sumi); }
  .route { fill:none; stroke-width:6; stroke-linecap:round; }
  .r1 { stroke: var(--sumi); stroke-dasharray: 2 16; }
  .r2 { stroke: var(--sumi-soft); stroke-dasharray: 18 12; }
  .r3 { stroke: var(--imp); stroke-width:7; }
  .rlbl { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; }
  .legend { display:grid; gap:18px; }
  .lg { display:grid; grid-template-columns: 74px 1fr; align-items:center; gap:18px;
        background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:18px 22px; box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .lg .swatch { height:0; border-top-width:7px; border-top-style:solid; border-radius:4px; }
  .lg .s1 { border-color: var(--sumi); border-top-style:dotted; }
  .lg .s2 { border-color: var(--sumi-soft); border-top-style:dashed; }
  .lg .s3 { border-color: var(--imp); }
  .lg .tx { font-size:26px; font-weight:700; color:var(--sumi); line-height:1.3; }
  .lg .tx b { color:var(--imp); }
  .lg .tx .blank { min-width:0; white-space:normal; padding:0 10px 3px; margin:0 2px; font-size:24px; }
  .lg .tx small { display:block; font-size:21px; color:var(--sumi-mute); font-weight:500; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe mp-safe">
    <div class="mp-head" data-at="0">
      <span class="kicker"><span class="num">Ⅴ</span>　大航海時代</span>
      <h1 class="headline" style="font-size:56px;">3人の航路を、方向で覚える</h1>
    </div>
    <div class="mp-wrap">
      <div class="mapbox" data-at="0" data-anim="fade">
        <svg viewBox="0 0 1500 720" role="img" aria-label="3人の探検家の航路の模式図">
          <!-- landmasses (schematic, not to scale) -->
          <ellipse class="land" cx="250" cy="360" rx="120" ry="180"/>
          <text class="land-lbl" x="250" y="370" text-anchor="middle">アメリカ<tspan x="250" dy="34">大陸</tspan></text>
          <ellipse class="land" cx="820" cy="185" rx="140" ry="90"/>
          <text class="land-lbl" x="820" y="195" text-anchor="middle">ヨーロッパ</text>
          <ellipse class="land" cx="820" cy="500" rx="120" ry="150"/>
          <text class="land-lbl" x="820" y="480" text-anchor="middle">アフリカ</text>
          <ellipse class="land" cx="1250" cy="330" rx="110" ry="120"/>
          <text class="land-lbl" x="1250" y="340" text-anchor="middle">インド</text>
          <!-- start port -->
          <circle class="port" cx="820" cy="270" r="12"/>

          <!-- route 1: Columbus, west to America -->
          <path class="route r1" data-at="1" style="opacity:0;transition:opacity .5s" d="M 800 275 C 620 340, 470 300, 385 330"/>
          <polygon class="port" data-at="1" style="opacity:0;transition:opacity .5s" points="385,330 415,316 412,346"/>
          <text class="rlbl" data-at="1" style="opacity:0;transition:opacity .5s;fill:var(--sumi)" x="560" y="300" text-anchor="middle">① 西へ</text>

          <!-- route 2: Vasco da Gama, south around Africa to India -->
          <path class="route r2" data-at="2" style="opacity:0;transition:opacity .5s" d="M 830 280 C 700 470, 760 650, 900 640 C 1080 628, 1160 470, 1200 385"/>
          <polygon class="port" data-at="2" style="opacity:0;transition:opacity .5s" points="1200,385 1180,410 1214,412"/>
          <text class="rlbl" data-at="2" style="opacity:0;transition:opacity .5s;fill:var(--sumi-soft)" x="690" y="600" text-anchor="middle">② 南回り</text>

          <!-- route 3: Magellan, world loop (red) -->
          <path class="route r3" data-at="3" style="opacity:0;transition:opacity .5s" d="M 812 285 C 500 250, 120 470, 300 620 C 620 780, 1200 760, 1360 560 C 1470 420, 1200 210, 880 262"/>
          <polygon class="port" data-at="3" style="opacity:0;transition:opacity .5s;fill:var(--imp)" points="880,262 858,246 856,282"/>
          <text class="rlbl" data-at="3" style="opacity:0;transition:opacity .5s;fill:var(--imp)" x="750" y="710" text-anchor="middle">③ ぐるり一周</text>
        </svg>
      </div>
      <div class="legend">
        <div class="lg" data-at="1" data-anim="right"><div class="swatch s1"></div><div class="tx">① <span class="blank" data-fill="1"><b>コロンブス</b></span> ＝ 西<small>西インド諸島に到達（15世紀末）</small></div></div>
        <div class="lg" data-at="2" data-anim="right"><div class="swatch s2"></div><div class="tx">② <span class="blank" data-fill="2"><b>バスコ=ダ=ガマ</b></span> ＝ 南<small>アフリカ回りでインド航路を開く</small></div></div>
        <div class="lg" data-at="3" data-anim="right"><div class="swatch s3"></div><div class="tx">③ <span class="blank" data-fill="3"><b>マゼラン一行</b></span> ＝ 一周<small>世界一周に成功（16世紀初め）</small></div></div>
        <div class="lg" data-at="4" data-anim="fade" style="border-color:var(--sumi);background:var(--sumi);"><div class="swatch" style="border:none;height:auto;font-family:'Zen Old Mincho',serif;font-weight:900;font-size:34px;color:var(--gold-soft);">★</div><div class="tx" style="color:#fff;">方向でセットに<small style="color:rgba(251,251,250,.8)">①西へ ②南回り ③ぐるり一周、の3方向で3人を区別</small></div></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5, function(step){
  document.querySelectorAll('svg [data-at]').forEach(function(el){
    el.style.opacity = (step >= +el.dataset.at) ? 1 : 0;
  });
});</script>
</body>
</html>
