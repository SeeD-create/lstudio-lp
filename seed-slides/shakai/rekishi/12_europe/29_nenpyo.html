<title>年表で総ざらい ── 375 → 16世紀の一本道｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .np-safe { inset: 84px 120px 84px; align-content: center; gap: 30px; }
  .np-head { display:grid; gap:10px; justify-items:center; text-align:center; }
  .tl { position:relative; display:grid; gap:14px; }
  .tl::before { content:""; position:absolute; left:250px; top:8px; bottom:8px; width:5px; background:var(--hair); border-radius:3px; }
  .ev { display:grid; grid-template-columns: 230px 44px 1fr; align-items:center; gap:22px; }
  .ev .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:38px; color:var(--sumi); text-align:right; }
  .ev .dot { width:26px; height:26px; border-radius:50%; background:var(--sumi); justify-self:center; box-shadow:0 0 0 6px var(--paper); z-index:1; }
  .ev.hot .dot { background:var(--imp); }
  .ev.hot .yr { color:var(--imp); }
  .ev .tx { font-size:30px; font-weight:700; color:var(--sumi); line-height:1.35; }
  .ev .tx b { color:var(--imp); font-weight:900; }
  .ev .tx .blank { min-width:0; white-space:normal; padding:0 12px 3px; margin:0 3px; }
  .ev .tx small { color:var(--sumi-mute); font-weight:500; font-size:24px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe np-safe">
    <div class="np-head" data-at="0">
      <span class="kicker"><span class="num">まとめ</span>　年表で総ざらい</span>
      <h1 class="headline" style="font-size:54px;">375年から16世紀まで、<span class="em">一本の道</span></h1>
    </div>
    <div class="tl">
      <div class="ev" data-at="1" data-anim="left"><div class="yr">375</div><div class="dot"></div><div class="tx"><span class="blank" data-fill="1"><b>ゲルマン人</b></span>の大移動が始まる</div></div>
      <div class="ev" data-at="1" data-anim="left"><div class="yr">395 → 476</div><div class="dot"></div><div class="tx">ローマ帝国が東西に分裂 → <span class="blank" data-fill="1"><b>西ローマ帝国</b></span>が滅ぶ</div></div>
      <div class="ev" data-at="2" data-anim="left"><div class="yr">486</div><div class="dot"></div><div class="tx"><span class="blank" data-fill="2"><b>フランク王国</b></span>成立　<small>9世紀後半に伊・仏・独へ3分裂</small></div></div>
      <div class="ev hot" data-at="3" data-anim="left"><div class="yr">11世紀後半</div><div class="dot"></div><div class="tx"><span class="blank" data-fill="3"><b>十字軍</b></span>の遠征　<small>聖地エルサレム奪回のため（教皇のよびかけ）</small></div></div>
      <div class="ev hot" data-at="4" data-anim="left"><div class="yr">14世紀</div><div class="dot"></div><div class="tx"><span class="blank" data-fill="4"><b>ルネサンス</b></span>（文芸復興）　<small>キリスト教にとらわれない自由な文化</small></div></div>
      <div class="ev hot" data-at="5" data-anim="left"><div class="yr">16世紀</div><div class="dot"></div><div class="tx"><span class="blank" data-fill="5"><b>宗教改革</b></span>（ルター・カルバン）　<small>プロテスタント誕生／イエズス会結成</small></div></div>
      <div class="ev hot" data-at="5" data-anim="left"><div class="yr">15〜16世紀</div><div class="dot"></div><div class="tx"><span class="blank" data-fill="5"><b>大航海時代</b></span>　<small>コロンブス・バスコ=ダ=ガマ・マゼラン一行</small></div></div>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
