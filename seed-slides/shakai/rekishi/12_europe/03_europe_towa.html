<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>この単元とは ── 中世ヨーロッパから大航海時代まで｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .et-safe { inset: 100px 150px 100px; align-content: center; gap: 44px; }
  .et-head { display: grid; gap: 14px; }
  .et-def { font-size: 44px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .et-def .em { color: var(--imp); font-weight: 900; }
  .arc { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 20px; align-items: stretch; }
  .arc .st { position: relative; background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px;
             padding: 26px 28px; box-shadow: 0 12px 28px rgba(40,30,10,.10); display: grid; gap: 8px; align-content: start; }
  .arc .st .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); letter-spacing:.06em; }
  .arc .st .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); line-height:1.15; }
  .arc .st .ds { font-size:24px; color:var(--sumi-mute); line-height:1.35; font-weight:500; }
  .arc .arw { display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--gold); font-weight:900; }
  .et-bar { display:flex; align-items:center; gap:26px; background:var(--sumi); color:var(--paper-hi);
            border-radius:18px; padding:24px 34px; }
  .et-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--gold-soft); white-space:nowrap; }
  .et-bar .bb { font-size:29px; line-height:1.45; color:rgba(251,251,250,.92); }
  .et-bar .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe et-safe">
    <div class="et-head" data-at="0">
      <span class="kicker"><span class="num">01</span>　この単元とは</span>
      <h1 class="headline" style="font-size:64px;">ローマの崩壊から、<span class="em">世界が海でつながる</span>まで</h1>
    </div>
    <p class="et-def" data-at="1">主役は<span class="em">キリスト教（教会）</span>。教会が世界の中心だった中世から、<br>やがて人々が<span class="em">自由</span>を求め、<span class="em">海</span>をこえて世界へ広がっていく流れをつかむ。</p>
    <div class="arc">
      <div class="st" data-at="2" data-anim="pop"><div class="yr">4〜5世紀</div><div class="nm">古代の<br>おわり</div><div class="ds">ゲルマン人の大移動でローマ帝国がくずれる</div></div>
      <div class="arw" data-at="2">→</div>
      <div class="st" data-at="3" data-anim="pop"><div class="yr">11〜14世紀</div><div class="nm">教会の<br>時代</div><div class="ds">教皇・十字軍、そしてルネサンス（自由な文化）</div></div>
    </div>
    <div class="arc" style="grid-template-columns:1fr;">
      <div class="et-bar" data-at="4" data-anim="fade">
        <span class="bt">16世紀＝転換点</span>
        <span class="bb"><b>宗教改革</b>で教会が二つに分かれ、<b>大航海時代</b>でヨーロッパ人が世界各地へ。ここから「近代」が始まる。この一本道を、これから5枚のカードで集めていく。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
