<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>キリスト教とローマ教皇 ── 国王以上の権力｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cp-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 580px; align-content: center; gap: 60px; align-items: center; }
  .cp-txt { display: grid; gap: 26px; }
  .cp-fig { height: 620px; border-radius: 28px; }
  .cp-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .cp-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .cp-def { font-size: 40px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .cp-def .em { color: var(--imp); font-weight: 900; }
  .cp-def .blank { font-size: 40px; min-width: 200px; }
  .rank2 { display: grid; gap: 12px; }
  .rk { display:grid; grid-template-columns: 92px 1fr; align-items:center; gap:22px;
        background: var(--paper-hi); border-left:10px solid var(--cat); border-radius:0 16px 16px 0; padding:18px 28px; box-shadow:0 8px 22px rgba(40,30,10,.07); }
  .rk .badge { width:92px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:#fff; background:var(--sumi); border-radius:12px; text-align:center; padding:8px 0; }
  .rk.top .badge { background:var(--imp); }
  .rk .tx { font-size:32px; font-weight:700; color:var(--sumi); }
  .rk .tx small { display:block; font-size:24px; color:var(--sumi-mute); font-weight:500; margin-top:3px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe cp-safe">
    <div class="cp-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅱ 教会と聖地への遠征</span>
        <h1 class="headline" style="font-size:54px;margin-top:16px;">教会のトップが、<span class="em">国王より強い</span></h1>
      </div>
      <p class="cp-def" data-at="1">ヨーロッパ中に <span class="blank" data-fill="2"><span class="bnum">①</span><b>キリスト教</b></span> が広まると、<br>その頂点に立つ <span class="blank" data-fill="3"><span class="bnum">②</span><b>ローマ教皇</b></span> は、<br><span class="em">国王以上の権力</span>を持つようになった。</p>
      <div class="rank2">
        <div class="rk top" data-at="4" data-anim="left"><div class="badge">1位</div><div class="tx">教会のトップ<small>信仰の頂点。国王でも逆らえない</small></div></div>
        <div class="rk" data-at="4" data-anim="left"><div class="badge">2位</div><div class="tx">国王・貴族<small>教皇の権威のもとで国を治める</small></div></div>
      </div>
    </div>
    <div class="figure cp-fig" data-at="0" data-anim="right" data-ph="ローマ教皇の権力"><img src="assets/pope_power.webp" alt="ローマ教皇" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
