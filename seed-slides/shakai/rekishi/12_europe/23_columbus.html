<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>コロンブス ── 15世紀末、西インド諸島に到達｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ex-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .ex-head { display:grid; gap:14px; }
  .ex-card { display:grid; grid-template-columns: 300px 1fr; gap:40px; align-items:center;
             background: var(--paper-hi); border:3px solid var(--cat); border-radius:26px; padding:40px 48px;
             box-shadow:0 16px 36px rgba(40,30,10,.12); }
  .ex-badge { text-align:center; }
  .ex-badge .dir { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:120px; line-height:1; color:var(--cat); opacity:.9; }
  .ex-badge .yr { display:inline-block; margin-top:14px; background:var(--sumi); color:#fff; border-radius:12px; padding:8px 22px;
                  font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; }
  .ex-badge .yr small { display:block; font-size:20px; color:var(--gold-soft); font-family:'Zen Kaku Gothic New',sans-serif; letter-spacing:.06em; margin-bottom:2px; }
  .ex-info { display:grid; gap:18px; }
  .ex-info .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .ex-info .nm .blank { font-size:46px; min-width:240px; }
  .ex-info .ac { font-size:34px; line-height:1.5; color:var(--sumi-soft); font-weight:700; }
  .ex-info .ac .imp { color:var(--imp); font-weight:900; }
  .ex-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 34px; }
  .ex-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .ex-note .bb { font-size:28px; line-height:1.45; }
  .ex-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe ex-safe">
    <div class="ex-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅴ 大航海時代　─　探検家①</span>
      <h1 class="headline" style="font-size:56px;">西へ進んで、<span class="em">新大陸</span>にぶつかった</h1>
    </div>
    <div class="ex-card" data-at="1" data-anim="pop">
      <div class="ex-badge">
        <div class="dir">西</div>
        <div class="yr"><small>15世紀末</small>1492年</div>
      </div>
      <div class="ex-info">
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>コロンブス</b></span></div>
        <div class="ac" data-at="3">西回りでインドをめざし、<span class="imp">西インド諸島</span>に到達した。</div>
      </div>
    </div>
    <div class="ex-note" data-at="4" data-anim="fade">
      <span class="bt">ここに注意</span>
      <span class="bb">本人はインドに着いたと思いこんでいたが、実は<b>アメリカ大陸の近く</b>。だから「西インド」諸島とよばれる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
