<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>十字軍 ── 聖地エルサレム奪回の遠征｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .cr-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 600px; align-content: center; gap: 60px; align-items: center; }
  .cr-txt { display: grid; gap: 26px; }
  .cr-fig { height: 630px; border-radius: 28px; }
  .cr-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .cr-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .yrtag { display:inline-flex; align-items:center; gap:14px; background:var(--sumi); color:#fff; border-radius:14px; padding:12px 26px;
           font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; }
  .yrtag .lbl { font-size:24px; color:var(--gold-soft); letter-spacing:.1em; font-family:'Zen Kaku Gothic New',sans-serif; }
  .cr-def { font-size: 40px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .cr-def .em { color: var(--imp); font-weight: 900; }
  .cr-def .blank { font-size: 40px; min-width: 200px; }
  .cr-bar { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border-left:10px solid var(--cat);
            border-radius:0 16px 16px 0; padding:22px 32px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .cr-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); white-space:nowrap; }
  .cr-bar .bb { font-size:28px; line-height:1.45; color:var(--sumi-soft); }
  .cr-bar .bb b { color:var(--imp); }
  .star { display:inline-flex; align-items:center; gap:8px; background:var(--imp); color:#fff; font-weight:900; font-size:24px; border-radius:999px; padding:6px 18px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe cr-safe">
    <div class="cr-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅱ 教会と聖地への遠征</span>
        <h1 class="headline" style="font-size:56px;margin-top:16px;">聖地を取り返せ ── <span class="em">教皇のよびかけ</span></h1>
      </div>
      <span class="yrtag" data-at="1" data-anim="left"><span class="lbl">TIME</span>11世紀後半 〜</span>
      <p class="cr-def" data-at="2">キリスト教の聖地 <span class="em">エルサレム</span> を奪回するため、<br>ローマ教皇のよびかけで <span class="blank" data-fill="3"><span class="bnum">①</span><b>十字軍</b></span> の遠征が始まった。</p>
      <div class="cr-bar" data-at="4" data-anim="fade">
        <span class="bt">結果</span>
        <span class="bb">遠征は何度もくり返されたが、聖地の奪回は<b>失敗</b>。長い遠征で教皇の力はしだいに弱まり、次の「自由な時代」への入口になった。</span>
      </div>
      <span class="star" data-at="4">★ テスト頻出：目的＝聖地エルサレムの奪回</span>
    </div>
    <div class="figure cr-fig" data-at="0" data-anim="right" data-ph="十字軍の遠征"><img src="assets/crusade.webp" alt="十字軍" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
