<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>プロテスタントとカトリック ── イエズス会の結成｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .pc-safe { inset: 96px 150px 96px; align-content: center; gap: 36px; }
  .pc-head { display: grid; gap: 12px; }
  .versus { display: grid; grid-template-columns: 1fr 96px 1fr; align-items: stretch; gap: 24px; }
  .side { background: var(--paper-hi); border:3px solid var(--cat); border-radius:24px; padding:32px 34px;
          box-shadow:0 14px 32px rgba(40,30,10,.10); display:grid; gap:14px; align-content:start; }
  .side .tag2 { justify-self:start; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:24px; letter-spacing:.1em; color:#fff; background:var(--sumi); border-radius:999px; padding:6px 20px; }
  .side .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:56px; color:var(--sumi); line-height:1.1; }
  .side .nm .blank { font-size:52px; min-width:230px; }
  .side .ds { font-size:29px; color:var(--sumi-soft); line-height:1.5; font-weight:500; }
  .side .ds .imp { color: var(--imp); font-weight:900; }
  .vs { display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:64px; color:var(--gold); }
  .pc-org { display:flex; align-items:center; gap:24px; background: var(--paper-hi); color: var(--sumi); border-radius:20px; padding:23px 33px; border: 3px solid var(--sumi); box-shadow: 0 8px 20px rgba(40,30,10,.07);}
  .pc-org .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); white-space:nowrap; }
  .pc-org .bb { font-size:30px; line-height:1.45; }
  .pc-org .bb .blank { font-size:32px; min-width:200px; }
  .pc-org .bb b { color: var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe pc-safe">
    <div class="pc-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅳ 教会を批判する動き</span>
      <h1 class="headline" style="font-size:56px;">キリスト教が、<span class="em">二つに分かれた</span></h1>
    </div>
    <div class="versus">
      <div class="side" data-at="1" data-anim="left">
        <span class="tag2">改革した側</span>
        <div class="nm"><span class="blank" data-fill="2"><span class="bnum">①</span><b>プロテスタント</b></span></div>
        <div class="ds">ルターやカルバンを支持した<span class="imp">改革派</span>のキリスト教徒。多くの人々の支持を集めた。</div>
      </div>
      <div class="vs" data-at="3">⇔</div>
      <div class="side" data-at="3" data-anim="right">
        <span class="tag2">批判された側</span>
        <div class="nm"><span class="blank" data-fill="4"><span class="bnum">②</span><b>カトリック教会</b></span></div>
        <div class="ds">これまでの教会。勢力を<span class="imp">回復</span>しようと反撃に出る。</div>
      </div>
    </div>
    <div class="pc-org" data-at="5" data-anim="fade">
      <span class="bt">反撃</span>
      <span class="bb">批判された側は、勢力回復のため <span class="blank" data-fill="5"><span class="bnum">③</span><b>イエズス会</b></span> を結成し、世界各地へキリスト教を広めようとした。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
