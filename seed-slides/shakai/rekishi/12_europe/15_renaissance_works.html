<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ルネサンスの作品 ── モナリザ像・ダビデ像｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rw-safe { inset: 92px 150px 92px; grid-template-columns: 620px 1fr; align-content: center; gap: 60px; align-items: center; }
  .rw-fig { height: 640px; border-radius: 28px; }
  .rw-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .rw-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .rw-txt { display: grid; gap: 26px; }
  .works { display: grid; gap: 18px; }
  .wk { background: var(--paper-hi); border:3px solid var(--cat); border-radius:22px; padding:28px 32px;
        box-shadow:0 12px 28px rgba(40,30,10,.10); display:grid; gap:8px; }
  .wk .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); }
  .wk .nm .imp { color: var(--imp); }
  .wk .nm .blank { min-width: 300px; font-size: 46px; padding: 0 16px 4px; }
  .wk .ds { font-size:28px; color:var(--sumi-soft); line-height:1.4; font-weight:500; }
  .rw-note { display:flex; align-items:center; gap:24px; background:var(--sumi); color:var(--paper-hi); border-radius:18px; padding:22px 32px; }
  .rw-note .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--gold-soft); white-space:nowrap; }
  .rw-note .bb { font-size:27px; line-height:1.45; }
  .rw-note .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe rw-safe">
    <div class="figure rw-fig" data-at="0" data-anim="left" data-ph="ルネサンスの美術"><img src="assets/renaissance_art.webp" alt="ルネサンスの作品" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
    <div class="rw-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅲ ルネサンス</span>
        <h1 class="headline" style="font-size:52px;margin-top:14px;">代表作は、<span class="em" style="color:var(--imp)">この2つ</span></h1>
      </div>
      <div class="works">
        <div class="wk" data-at="1" data-anim="right"><div class="nm"><span class="blank" data-fill="1"><b>モナリザ</b></span>像</div><div class="ds">ほほえむ女性をえがいた絵画。人間らしい表情が生き生きとえがかれる。</div></div>
        <div class="wk" data-at="2" data-anim="right"><div class="nm"><span class="blank" data-fill="2"><b>ダビデ</b></span>像</div><div class="ds">大理石でつくられた青年の彫刻。人間の体の美しさをそのまま表現。</div></div>
      </div>
      <div class="rw-note" data-at="3" data-anim="fade">
        <span class="bt">覚え方</span>
        <span class="bb">ルネサンス＝<b>「人間」を主役にした</b>文化。神ではなく、<b>人の顔と人の体</b>を美しくえがいた2作品。どちらも名前を漢字・カタカナで書けるように。</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
