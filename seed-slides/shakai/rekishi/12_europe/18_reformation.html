<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>宗教改革 ── ルターとカルバンが教会を批判｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .rf-safe { inset: 92px 150px 92px; grid-template-columns: 1fr 580px; align-content: center; gap: 60px; align-items: center; }
  .rf-txt { display: grid; gap: 26px; }
  .rf-fig { height: 620px; border-radius: 28px; }
  .rf-fig.ph { display:flex; align-items:center; justify-content:center;
    background: repeating-linear-gradient(45deg, var(--paper-lo) 0 2px, transparent 2px 24px), var(--paper-hi);
    border: 3px dashed var(--gold-soft); }
  .rf-fig.ph::after { content: attr(data-ph); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color:var(--sumi-mute); text-align:center; padding:0 30px; line-height:1.5; }
  .yrtag { display:inline-flex; align-items:center; gap:14px; background:var(--sumi); color:#fff; border-radius:14px; padding:12px 26px;
           font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; }
  .yrtag .lbl { font-size:24px; color:var(--gold-soft); letter-spacing:.1em; font-family:'Zen Kaku Gothic New',sans-serif; }
  .rf-def { font-size: 40px; line-height: 1.6; color: var(--sumi); font-weight: 700; }
  .rf-def .em { color: var(--imp); font-weight: 900; }
  .rf-def .blank { font-size: 40px; min-width: 200px; }
  .two-men { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
  .man { background: var(--paper-hi); border:3px solid var(--cat); border-radius:18px; padding:20px 24px; text-align:center;
         box-shadow:0 10px 24px rgba(40,30,10,.08); }
  .man .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--imp); }
  .man .ds { font-size:23px; color:var(--sumi-mute); font-weight:500; margin-top:4px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe rf-safe">
    <div class="rf-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅳ 教会を批判する動き</span>
        <h1 class="headline" style="font-size:56px;margin-top:16px;">教会を、正面から<span class="em">批判した</span></h1>
      </div>
      <span class="yrtag" data-at="1" data-anim="left"><span class="lbl">TIME</span>16世紀</span>
      <p class="rf-def" data-at="2">16世紀、教会のあり方を批判し改める動き ── <span class="blank" data-fill="3"><span class="bnum">①</span><b>宗教改革</b></span> が起こった。</p>
      <div class="two-men">
        <div class="man" data-at="4" data-anim="pop"><div class="nm">ルター</div><div class="ds">教会のやり方を批判した中心人物</div></div>
        <div class="man" data-at="4" data-anim="pop"><div class="nm">カルバン</div><div class="ds">同じく改革を進めた中心人物</div></div>
      </div>
    </div>
    <div class="figure rf-fig" data-at="0" data-anim="right" data-ph="宗教改革（ルター）"><img src="assets/reformation.webp" alt="宗教改革" onerror="this.style.display='none';this.parentElement.classList.add('ph')"></div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
