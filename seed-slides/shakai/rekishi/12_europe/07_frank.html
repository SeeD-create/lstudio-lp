<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>フランク王国 ── 486年成立、9世紀後半に3分裂｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .fr-safe { inset: 96px 150px 96px; align-content: center; gap: 40px; }
  .fr-head { display: grid; gap: 14px; }
  .fr-def { font-size: 40px; line-height: 1.55; color: var(--sumi); font-weight: 700; }
  .fr-def .em { color: var(--imp); font-weight: 900; }
  .fr-def .blank { font-size: 40px; min-width: 210px; }
  .split { display: grid; grid-template-columns: 240px 60px 1fr; align-items: center; gap: 26px; }
  .origin { background: var(--sumi); color:#fff; border-radius: 22px; padding: 30px 26px; text-align:center;
            box-shadow: 0 14px 30px rgba(40,30,10,.16); }
  .origin .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--gold-soft); }
  .origin .nm { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; margin-top:6px; line-height:1.15; }
  .fork { display:flex; align-items:center; justify-content:center; font-size:52px; color:var(--gold); font-weight:900; }
  .three { display:grid; grid-template-columns: repeat(3,1fr); gap:22px; }
  .nation { background: var(--paper-hi); border:3px solid var(--cat); border-radius:20px; padding:26px 24px; text-align:center;
            box-shadow:0 12px 28px rgba(40,30,10,.10); }
  .nation .now { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--imp); }
  .nation .ds { font-size:24px; color:var(--sumi-mute); font-weight:500; margin-top:8px; line-height:1.35; }
  .fr-bar { display:flex; align-items:center; gap:24px; background:var(--paper-hi); border-left:10px solid var(--cat);
            border-radius:0 16px 16px 0; padding:22px 32px; box-shadow:0 10px 26px rgba(40,30,10,.08); }
  .fr-bar .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color:var(--cat); white-space:nowrap; }
  .fr-bar .bb { font-size:28px; line-height:1.45; color:var(--sumi-soft); }
  .fr-bar .bb b { color:var(--imp); }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe fr-safe">
    <div class="fr-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ ローマ帝国と北方の民族</span>
      <h1 class="headline" style="font-size:60px;margin-top:6px;">西ローマのあとに、<span class="em">新しい王国</span>ができた</h1>
    </div>
    <p class="fr-def" data-at="1">486年、ゲルマン人が西ローマ帝国のあとに <span class="blank" data-fill="2"><span class="bnum">①</span><b>フランク王国</b></span> を建てた。</p>
    <div class="split">
      <div class="origin" data-at="3" data-anim="left"><div class="yr">9世紀後半</div><div class="nm">この王国が<br>3つに分裂</div></div>
      <div class="fork" data-at="3">▶</div>
      <div class="three">
        <div class="nation" data-at="4" data-anim="pop"><div class="now"><span class="blank" data-fill="4"><span class="bnum">②</span><b>イタリア</b></span></div><div class="ds">のもと</div></div>
        <div class="nation" data-at="4" data-anim="pop"><div class="now"><span class="blank" data-fill="4"><span class="bnum">③</span><b>フランス</b></span></div><div class="ds">のもと</div></div>
        <div class="nation" data-at="4" data-anim="pop"><div class="now"><span class="blank" data-fill="4"><span class="bnum">④</span><b>ドイツ</b></span></div><div class="ds">のもと</div></div>
      </div>
    </div>
    <div class="fr-bar" data-at="4" data-anim="fade">
      <span class="bt">つながる</span>
      <span class="bb">この3分裂が、いまの<b>ヨーロッパの3つの国</b>のもとになった。国のかたちは、ここから始まる。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
