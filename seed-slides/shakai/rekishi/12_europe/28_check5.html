<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 探検家と航路｜中1歴史 第12章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1500px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:43px 57px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:30px; color: var(--imp); letter-spacing:.1em; }
  .rows { margin-top: 22px; display:grid; gap:16px; }
  .qr { display:grid; grid-template-columns: 1fr 360px; align-items:center; gap:26px; border-bottom:2px solid rgba(251,251,250,.18); padding-bottom:14px; }
  .qr .q { font-size:34px; font-weight:700; line-height:1.4; }
  .qr .a { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:36px; color: var(--sumi); text-align:right; }
  .qr .a .blank { min-width: 300px; font-size: 34px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="new">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 探検家と航路</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. だれ？（航路・場所から答える）</div>
      <div class="rows">
        <div class="qr"><div class="q">西回りで西インド諸島に到達した</div><div class="a" data-at="1"><span class="blank" data-fill="1"><b>コロンブス</b></span></div></div>
        <div class="qr"><div class="q">アフリカを回ってインド航路を開いた</div><div class="a" data-at="2"><span class="blank" data-fill="2"><b>バスコ=ダ=ガマ</b></span></div></div>
        <div class="qr"><div class="q">世界一周に成功した一行</div><div class="a" data-at="3"><span class="blank" data-fill="3"><b>マゼラン一行</b></span></div></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第12章 ヨーロッパ</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
