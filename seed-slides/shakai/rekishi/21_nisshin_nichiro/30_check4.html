<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ミニ確認 ── 条約改正｜中2歴史 第21章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1500px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 38px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .ans { margin-top: 34px; display: grid; gap: 18px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 32px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:30px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="par">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 条約改正</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の3つに答えよう</div>
      <p class="qtext">① 1894年にイギリスとの間で撤廃された権利と、その外務大臣は？<br>② 1911年にアメリカとの間で回復された権利と、その外務大臣は？　③ 2つを合わせて何をなしとげた？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">領事裁判権（治外法権）</span>／<span class="hl">陸奥宗光</span>　── イギリスと交渉。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">関税自主権</span>／<span class="hl">小村寿太郎</span>　── アメリカと交渉。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">不平等条約の改正</span>　── 幕末以来の不平等条約をなくした。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第21章 日清・日露戦争</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(4);</script>
</body>
</html>
