<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .hs-safe { inset: 88px 150px 88px; align-content: center; gap: 28px; }
  .hs-head { display: grid; gap: 10px; }
  .def { font-size: 36px; font-weight: 700; color: var(--sumi); line-height: 1.55; }
  .def .blank { font-size: 40px; min-width: 240px; }
  .def .em { color: var(--imp); font-weight:900; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .pcard { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 26px 32px; box-shadow: 0 12px 28px rgba(40,30,10,.10); display:grid; gap:10px; }
  .pcard .pn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:40px; color:var(--sumi); }
  .pcard .py { font-size:20px; color:var(--sumi-mute); font-weight:600; margin-top:-6px; }
  .pcard .pd { font-size:25px; color:var(--sumi-soft); font-weight:600; line-height:1.5; }
  .pcard .pd b { color: var(--imp); }
  .quote { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--cat); border-left:6px solid var(--cat); padding-left:16px; line-height:1.4; }
</style>

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="lib">
  <div class="seed-safe hs-safe">
    <div class="hs-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅱ 日露戦争　戦争への反対の声</span>
      <h1 class="headline" style="font-size:48px;margin-top:6px;">「戦争はいやだ」と、声をあげた人もいた</h1>
    </div>
    <p class="def" data-at="1" data-anim="fade">大きな犠牲を出した日露戦争には、<span class="em">反対する意見</span>もあった。その代表がこの2人。</p>
    <div class="two">
      <div class="pcard" data-at="2" data-anim="pop">
        <div class="pn"><span class="blank" data-fill="3" style="font-size:38px;"><span class="bnum">⑨</span><b>与謝野晶子</b></span></div>
        <div class="py">よさの あきこ ／ 歌人</div>
        <div class="pd">戦場の弟を思う詩を発表して戦争を批判した。</div>
        <div class="quote">「君死にたまふ<br>　ことなかれ」</div>
      </div>
      <div class="pcard" data-at="4" data-anim="pop">
        <div class="pn">内村鑑三</div>
        <div class="py">うちむら かんぞう ／ キリスト教徒</div>
        <div class="pd">信仰の立場から、戦争そのものに<b>反対</b>した。</div>
        <div class="quote">戦争に反対する<br>　　キリスト者</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第21章 日清・日露戦争</span><span class="brand">SEED EDUCATION</span></div>
