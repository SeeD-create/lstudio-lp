<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>下関条約の中身 ── 独立・領土・賠償金｜中2歴史 第21章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .ls-safe { inset: 84px 160px 84px; align-content: center; gap: 30px; }
  .ls-head { display: grid; gap: 10px; }
  .ls-list { display: grid; gap: 20px; }
  .lrow { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 28px;
          background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 24px 34px; box-shadow: 0 12px 28px rgba(40,30,10,.10); }
  .lrow .ln { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:44px; color:var(--cat); text-align:center; }
  .lrow .lx { font-size: 34px; font-weight: 700; color: var(--sumi); line-height: 1.5; }
  .lrow .lx .blank { font-size: 38px; min-width: 220px; }
  .lrow .lx .em { color: var(--imp); font-weight: 900; }
  .yeartag { display:inline-flex; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; padding:6px 18px; border-radius:11px; margin-left:12px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe ls-safe">
    <div class="ls-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 日清戦争　下関条約の中身<span class="yeartag">1895</span></span>
      <h1 class="headline" style="font-size:50px;margin-top:6px;">清が日本にゆずったのは、この<span class="em">3つ</span></h1>
    </div>
    <div class="ls-list">
      <div class="lrow" data-at="1" data-anim="left">
        <div class="ln">①</div>
        <div class="lx">清は <span class="blank" data-fill="2"><span class="bnum">ア</span><b>朝鮮</b></span> の独立を認める。</div>
      </div>
      <div class="lrow" data-at="3" data-anim="left">
        <div class="ln">②</div>
        <div class="lx"><span class="blank" data-fill="3"><span class="bnum">イ</span><b>リャオトン半島</b></span> と <span class="blank" data-fill="3"><span class="bnum">ウ</span><b>台湾</b></span> を日本にゆずる。</div>
      </div>
      <div class="lrow" data-at="4" data-anim="left">
        <div class="ln">③</div>
        <div class="lx">日本に3億円あまりの <span class="blank" data-fill="4"><span class="bnum">エ</span><b>賠償金</b></span> を払う。</div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第21章 日清・日露戦争</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(5);</script>
</body>
</html>
