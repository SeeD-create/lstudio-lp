<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>三国干渉 ── ロシア・フランス・ドイツが返還を要求｜中2歴史 第21章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sg-safe { inset: 90px 150px 90px; align-content: center; gap: 30px; }
  .sg-head { display: grid; gap: 10px; }
  .def { font-size: 38px; font-weight: 700; color: var(--sumi); line-height: 1.55; }
  .def .blank { font-size: 42px; min-width: 240px; }
  .def .em { color: var(--imp); font-weight:900; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .nat { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 20px; padding: 26px; text-align:center; box-shadow: 0 12px 28px rgba(40,30,10,.10); }
  .nat .nn { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:52px; color:var(--sumi); }
  .nat .nb { font-size: 22px; color: var(--sumi-mute); font-weight:600; margin-top:8px; }
  .yeartag { display:inline-flex; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; padding:6px 18px; border-radius:11px; margin-left:12px; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sg-safe">
    <div class="sg-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅰ 清との戦争　勝利のあと<span class="yeartag">1895</span></span>
      <h1 class="headline" style="font-size:50px;margin-top:6px;">「リャオトン半島を清に返せ」と迫られる</h1>
    </div>
    <p class="def" data-at="1" data-anim="fade">3つの国が、日本が手に入れた<span class="em">リャオトン半島</span>を清に返すよう要求した。これを
      <span class="blank" data-fill="2"><span class="bnum">⑧</span><b>三国干渉</b></span> という。</p>
    <div class="three">
      <div class="nat" data-at="3" data-anim="pop"><div class="nn">ロシア</div><div class="nb">中心となって要求</div></div>
      <div class="nat" data-at="3" data-anim="pop"><div class="nn">フランス</div><div class="nb">ロシアに同調</div></div>
      <div class="nat" data-at="3" data-anim="pop"><div class="nn">ドイツ</div><div class="nb">ロシアに同調</div></div>
    </div>
    <div class="hit" data-at="4" data-anim="fade">
      <span class="bt">その後</span>
      <span class="bb">力の差で日本は要求を受け入れ、リャオトン半島を<b>清に返した</b>。この屈辱から、日本の<b>ロシアへの対抗心</b>が高まっていく。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第21章 日清・日露戦争</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>

</body>
