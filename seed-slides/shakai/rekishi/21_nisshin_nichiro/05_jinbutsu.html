<style>

  .jn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .pc { position: relative; background: var(--paper-hi); border-radius: 22px; border: 3px solid var(--c);

  .pc__seal { position:absolute; right:22px; top:18px; font-family:'Zen Old Mincho',serif; font-weight:900; font-size:120px; color:var(--c); opacity:.10; line-height:1; }
  .pc__from { font-weight:900; font-size:22px; color:var(--c); letter-spacing:.06em; }
  .pc__name { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:46px; color:var(--sumi); line-height:1.1; }
  .pc__yomi { font-size:22px; color:var(--sumi-mute); font-weight:600; margin-top:-6px; }
  .pc__role { font-size:26px; color:var(--sumi-soft); line-height:1.55; font-weight:600; margin-top:4px; }
  .pc__role b { color:var(--imp); font-weight:900; }
  .pc__tag { justify-self:start; margin-top:auto; padding:7px 18px; border-radius:10px; background:var(--c); color:#fff; font-weight:900; font-size:20px; }

<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe jn-safe">
    <div class="jn-head" data-at="0">
      <span class="kicker"><span class="num">03</span>　この単元の登場人物</span>
      <h1 class="headline" style="font-size:60px;">まず、この<span class="em">4人</span>の顔ぶれを覚える</h1>
    </div>
    <div class="jn-row">
      <div class="pc" style="--c:#1A1A1A" data-at="1" data-anim="pop">
        <span class="pc__seal">陸</span>
        <span class="pc__from">外務大臣</span>
        <span class="pc__name">陸奥宗光</span>
        <span class="pc__yomi">むつ むねみつ</span>
        <span class="pc__role">1894年、イギリスと交渉し<br><b>領事裁判権の撤廃</b>に成功。</span>
        <span class="pc__tag">条約改正①</span>
      </div>
      <div class="pc" style="--c:#3A3A39" data-at="2" data-anim="pop">
        <span class="pc__seal">小</span>
        <span class="pc__from">外務大臣</span>
        <span class="pc__name">小村寿太郎</span>
        <span class="pc__yomi">こむら じゅたろう</span>
        <span class="pc__role">1911年、アメリカと交渉し<br><b>関税自主権の回復</b>に成功。</span>
        <span class="pc__tag">条約改正②</span>
      </div>
      <div class="pc" style="--c:#535250" data-at="3" data-anim="pop">
        <span class="pc__seal">孫</span>
        <span class="pc__from">中国 革命家</span>
        <span class="pc__name">孫文</span>
        <span class="pc__yomi">そんぶん</span>
        <span class="pc__role"><b>三民主義</b>をとなえ辛亥革命を指導。<br><b>中華民国</b>の臨時大総統に。</span>
        <span class="pc__tag">辛亥革命</span>
      </div>
      <div class="pc" style="--c:#6B6A67" data-at="4" data-anim="pop">
        <span class="pc__seal">与</span>
        <span class="pc__from">歌人</span>
        <span class="pc__name">与謝野晶子</span>
        <span class="pc__yomi">よさの あきこ</span>
        <span class="pc__role">日露戦争に出た弟を思う詩で<br><b>戦争に反対</b>した（内村鑑三も）。</span>
        <span class="pc__tag">反戦の声</span>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第21章 日清・日露戦争</span><span class="brand">SEED EDUCATION</span></div>
