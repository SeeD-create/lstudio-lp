<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大戦景気と成金 ── 第一次世界大戦で好景気（1914〜）｜中2歴史 第24章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .sk-safe { inset: 90px 150px 90px; grid-template-columns: 1fr 500px; align-content: center; gap: 54px; align-items: center; }
  .sk-txt { display: grid; gap: 24px; }
  .sk-fig { height: 560px; border-radius: 28px; }
  .figph { display:grid; place-content:center; justify-items:center; gap:18px;
    background: radial-gradient(120% 90% at 30% 10%, var(--paper-hi), var(--paper-lo));
    border:3px solid var(--cat); box-shadow:0 18px 40px rgba(40,30,10,.14); position:relative; overflow:hidden; }
  .figph::before { content:""; position:absolute; inset:14px; border:2px solid var(--hair); border-radius:22px; }
  .fseal { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:220px; line-height:1; color:var(--cat); opacity:.15; }
  .fcap { font-family:'Zen Old Mincho',serif; font-weight:700; font-size:26px; color:var(--sumi-mute); letter-spacing:.1em; z-index:1; text-align:center; }
  .def { font-size: 40px; font-weight: 700; color: var(--sumi); line-height: 1.55; }
  .def .blank { font-size: 44px; min-width: 260px; }
  .def .em { color: var(--imp); font-weight:900; }
  .yeartag { display:inline-flex; align-items:center; gap:12px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; padding:7px 20px; border-radius:12px; }
  .pts { display: grid; gap: 13px; margin: 0; padding: 0; }
  .pts li { list-style: none; display: grid; grid-template-columns: 36px 1fr; gap: 16px; align-items: baseline;
            background: var(--paper-hi); border-left: 8px solid var(--cat); border-radius: 0 14px 14px 0;
            padding: 15px 26px; box-shadow: 0 8px 20px rgba(40,30,10,.07); }
  .pts li .mk { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; color:var(--cat); }
  .pts li .tx { font-size: 26px; line-height: 1.4; color: var(--sumi); font-weight: 600; }
  .pts li .tx b { color: var(--imp); font-weight: 900; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 30px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:25px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="eq">
  <div class="seed-safe sk-safe">
    <div class="sk-txt">
      <div data-at="0">
        <span class="cat-badge"><span class="dot"></span>Ⅰ 大戦景気と米騒動　<span class="yeartag" style="margin-left:12px;">1914</span></span>
        <h1 class="headline" style="font-size:48px;margin-top:14px;">戦争の輸出で、日本は大もうけ</h1>
      </div>
      <p class="def" data-at="1" data-anim="fade">第一次世界大戦が始まると、軍需品などの輸出で日本は好景気となり、急に大金持ちになった
        <span class="blank" data-fill="2"><span class="bnum">③</span><b>成金</b></span> が生まれた。</p>
      <ul class="pts">
        <li data-at="3" data-anim="left"><span class="mk">1</span><span class="tx">三井・三菱・住友などの<b>財閥</b>も大きく成長した。</span></li>
        <li data-at="3" data-anim="left"><span class="mk">2</span><span class="tx">好景気で<b>物価が上昇</b>し、人々の生活は苦しくなっていった。</span></li>
      </ul>
      <div class="hit" data-at="3" data-anim="fade">
        <span class="bt">★ 頻出</span>
        <span class="bb">「第一次世界大戦の好景気で急に大金持ちになった人」の呼び名が問われる。物価高が次のカードの騒動につながる。</span>
      </div>
    </div>
    <div class="figure sk-fig" data-at="0" data-anim="right"><img src="assets/narikin.webp" alt="戦争の輸出でにわかに大金持ち"></div>
  </div>
  <div class="seed-foot"><span>第24章 大正デモクラシー</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
