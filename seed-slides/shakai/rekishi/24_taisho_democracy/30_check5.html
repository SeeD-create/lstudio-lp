      <div class="qlabel">Q. 次の4つに答えよう</div>
      <p class="qtext">① 『暗夜行路』を書いた白樺派の作家は？　② 『羅生門』『鼻』を書いた作家は？<br>③ 『蟹工船』を書いたプロレタリア文学者は？　④ 1925年に始まった放送は？</p>

        <div class="row" data-at="3"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">ラジオ放送</span>　── 大衆文化が広がる。</b></span></span></div>
      </div>
    </div>
