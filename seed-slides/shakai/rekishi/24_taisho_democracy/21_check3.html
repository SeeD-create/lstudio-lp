<title>ミニ確認 ── 社会運動の高まり｜中2歴史 第24章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .chk-safe { align-content: center; gap: 40px; justify-items: center; }
  .qcard { width: 1460px; background: var(--paper-hi); color: var(--sumi); border-radius: 28px; padding:47px 59px; box-shadow: 0 22px 50px rgba(40,30,10,.22); border: 3px solid var(--sumi);}
  .qcard .qlabel { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:32px; color: var(--imp); letter-spacing:.1em; }
  .qcard .qtext { font-size: 35px; line-height: 1.5; font-weight: 700; margin-top: 18px; }
  .ans { margin-top: 32px; display: grid; gap: 16px; }
  .ans .row { display:flex; align-items:baseline; gap: 20px; font-size: 31px; }
  .ans .row .qn { font-family:'Zen Old Mincho',serif; font-weight:900; color: var(--sumi); font-size:29px; white-space:nowrap; }
  .ans .row .av { color: var(--sumi); font-weight:900; }
  .ans .row .av b { color: var(--imp); }
  .ans .row .av .blank--para { display:inline-block; min-width:520px; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe chk-safe">
    <span class="cat-badge" data-at="0"><span class="dot"></span>ミニ確認 ── 社会運動の高まり</span>
    <div class="qcard" data-at="0" data-anim="pop">
      <div class="qlabel">Q. 次の4つに答えよう</div>
      <p class="qtext">① 1920年に日本で初めて行われた労働者の祭典は？　② 1922年、農民の団結をめざした組織は？<br>③ 1911年に青鞜社をつくり女性解放を主張したのは？　④ 部落解放をめざし1922年に結成された組織は？</p>
      <div class="ans">
        <div class="row" data-at="1"><span class="qn">①</span><span class="av"><span class="blank blank--para" data-fill="1"><b><span class="hl">メーデー</span>　── 不景気の中で労働争議も増えた。</b></span></span></div>
        <div class="row" data-at="2"><span class="qn">②</span><span class="av"><span class="blank blank--para" data-fill="2"><b><span class="hl">日本農民組合</span>　── 小作争議を背景に結成。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">③</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">平塚らいてう</span>　── 青鞜社を結成した。</b></span></span></div>
        <div class="row" data-at="3"><span class="qn">④</span><span class="av"><span class="blank blank--para" data-fill="3"><b><span class="hl">全国水平社</span>　── 部落差別からの解放をめざす。</b></span></span></div>
      </div>
    </div>
  </div>
  <div class="seed-foot"><span>第24章 大正デモクラシー</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
