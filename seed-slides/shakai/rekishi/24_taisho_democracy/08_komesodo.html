<style>
  .sk-safe { inset: 88px 150px 88px; grid-template-columns: 1fr 480px; align-content: center; gap: 54px; align-items: center; }

  .sk-fig { height: 580px; border-radius: 28px; }

  .def { font-size: 38px; font-weight: 700; color: var(--sumi); line-height: 1.5; }
  .def .blank { font-size: 42px; min-width: 240px; }
  .yeartag { display:inline-flex; align-items:center; gap:12px; background:var(--sumi); color:var(--paper-hi); font-family:'Zen Old Mincho',serif; font-weight:900; font-size:28px; padding:7px 20px; border-radius:12px; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:18px 30px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:24px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
