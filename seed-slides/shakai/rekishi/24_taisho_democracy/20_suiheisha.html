<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>解放を求める声 ── 全国水平社・平塚らいてうと青鞜社｜中2歴史 第24章</title>
<link rel="stylesheet" href="../../../_shared/deck.css">
<style>
  .lr-safe { inset: 92px 140px 92px; align-content: start; gap: 30px; }
  .lr-head { display: grid; gap: 12px; }
  .lr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .panel { background: var(--paper-hi); border: 3px solid var(--cat); border-radius: 24px; padding: 34px 40px; box-shadow: 0 14px 32px rgba(40,30,10,.10); display: grid; gap: 20px; align-content: start; }
  .panel .ph { display:flex; align-items:center; gap:16px; }
  .panel .ph .yr { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:26px; color:#fff; background:var(--cat); border-radius:10px; padding:5px 16px; }
  .panel .ph .pt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:34px; color:var(--sumi); }
  .panel .pd { font-size: 33px; font-weight: 700; color: var(--sumi); line-height: 1.55; }
  .panel .pd .blank { font-size: 37px; min-width: 220px; }
  .hit { display:flex; align-items:center; gap:22px; background:var(--sumi); color:var(--paper-hi); border-radius:16px; padding:20px 34px; }
  .hit .bt { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:27px; color:var(--gold-soft); white-space:nowrap; }
  .hit .bb { font-size:26px; line-height:1.45; color:rgba(251,251,250,.92); }
  .hit .bb b { color:#fff; }
</style>
</head>
<body>
<div class="seed-stage"><div class="seed-slide" data-cat="soc">
  <div class="seed-safe lr-safe">
    <div class="lr-head" data-at="0">
      <span class="cat-badge"><span class="dot"></span>Ⅲ 社会運動の高まり ── 差別からの解放</span>
      <h1 class="headline" style="font-size:52px;">「私たちにも平等を」という2つの声</h1>
    </div>
    <div class="lr-row">
      <div class="panel" data-at="1" data-anim="pop">
        <div class="ph"><span class="yr">1911</span><span class="pt">女性の解放</span></div>
        <p class="pd"><span class="blank" data-fill="2"><span class="bnum">①</span><b>平塚らいてう</b></span> が
          <span class="blank" data-fill="2"><span class="bnum">②</span><b>青鞜社</b></span> をつくり、女性の解放を主張した。</p>
      </div>
      <div class="panel" data-at="3" data-anim="pop">
        <div class="ph"><span class="yr">1922</span><span class="pt">部落の解放</span></div>
        <p class="pd">部落差別からの解放をめざして
          <span class="blank" data-fill="4"><span class="bnum">⑮</span><b>全国水平社</b></span> が結成された。</p>
      </div>
    </div>
    <div class="hit" data-at="5" data-anim="fade">
      <span class="bt">★ 頻出</span>
      <span class="bb">女性解放は<b>1911年</b>、部落解放は<b>1922年</b>。人物名と組織名を年号とセットで覚える。</span>
    </div>
  </div>
  <div class="seed-foot"><span>第24章 大正デモクラシー</span><span class="brand">SEED EDUCATION</span></div>
</div></div>
<script src="../../../_shared/nav.js"></script>
<script src="../../../_shared/deck.js"></script>
<script>SeedDeck.init(6);</script>
</body>
</html>
