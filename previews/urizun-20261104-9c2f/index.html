<!DOCTYPE html>

<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="noindex,nofollow,noarchive" name="robots"/><title>うりずん｜改修前後の確認</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#edf2f4;color:#173b4a}.tools{padding:14px 20px;background:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #d5e1e6}.tools strong{font-size:14px}.switch{display:flex;border:1px solid #b8cdd5;border-radius:7px;overflow:hidden}.tools button,.tools select{padding:11px 14px;border:0;background:#fff;color:#173b4a;font:inherit;font-size:13px;cursor:pointer}.tools select{border:1px solid #b8cdd5;border-radius:7px}.tools button:disabled{cursor:wait;opacity:.65}.tools button[aria-pressed=true]{background:#007fad;color:#fff}.tools a{color:#007fad;font-size:13px;text-underline-offset:4px}.note{font-size:12px;padding:10px 20px;color:#54707c;margin:0;line-height:1.7}.current{color:#173b4a;font-weight:700;margin-right:12px}.stage{padding:0 10px 14px;overflow:auto}iframe{display:block;margin:auto;width:390px;height:calc(100dvh - 125px);min-height:420px;border:0;background:#fff;box-shadow:0 6px 32px #173b4a18}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ed533e;outline-offset:2px}@media(max-width:600px){.tools{gap:9px;padding:12px}.tools strong{width:100%}.tools button,.tools select{padding:10px;font-size:12px}.note{padding:9px 12px}iframe{height:calc(100dvh - 195px)}}
#page-select{max-width:240px}@media(max-width:600px){#page-select{max-width:100%;flex:1 1 180px}iframe{height:calc(100dvh - 235px)}} </style></head><body><div class="tools"><strong>うりずん｜サイトの改修案</strong><div aria-label="改修前後の切替" class="switch" role="group"><button aria-pressed="true" id="after">改修後</button><button aria-pressed="false" id="before">改修前</button></div><select aria-label="確認するページ" id="page-select"><option value="after.html">トップページ</option><option value="about.html">現場と実務。二つの視点で、会社を支える。</option><option value="access.html">アクセス</option><option value="columns.html">コラム＆ブログ</option><option value="company.html">事務所案内</option><option value="consultation.html">60分無料相談のお申し込み</option><option value="contact.html">一般のお問い合わせ</option><option value="diagnosis--safety.html">改善基準告示・安全管理のリスク診断</option><option value="diagnosis--wages.html">未払い賃金リスク診断</option><option value="faq.html">よくあるご質問</option><option value="fees.html">料金</option><option value="news.html">お知らせ</option><option value="privacy.html">個人情報の取り扱い</option><option value="profiles--seijo.html">前西原 清城</option><option value="profiles--tami.html">前西原 民</option><option value="services--freight.html">運賃交渉</option><option value="services--gmark.html">Gマーク・監査</option><option value="services--hours.html">改善基準告示</option><option value="services--labor.html">労務全般</option><option value="services--permit.html">新規許可</option><option value="services--renewal.html">緑ナンバー更新</option></select><select aria-label="冒頭イラスト" id="hero-select"><option value="truck">A：トラックのみ</option><option value="support">B：お二人がサポート</option></select><select aria-label="表示幅"><option value="390">スマホ 390px</option><option value="375">スマホ 375px</option><option value="320">小型スマホ 320px</option><option value="768">タブレット 768px</option><option value="1200">PC 1200px</option><option value="1280">PC 1280px</option><option value="1440">PC 1440px</option></select><a href="after.html" id="full" rel="noopener" target="_blank">このページを大きく開く ↗</a></div><p class="note"><span aria-live="polite" class="current" id="current">改修後 · トップページ</span>メニューから下層ページも比較できます。確認用のため送信・保存は行いません。</p><div class="stage"><iframe id="site" src="after.html?v=teamheading1" title="サイトの改修前後の確認"></iframe></div><script>const frame=document.querySelector('iframe');let mode='after',page='after.html',pending=false;
const buttons=['before','after'].map(k=>document.getElementById(k));
function busy(value){pending=value;buttons.forEach(b=>b.disabled=value);document.querySelector('#page-select').disabled=value;frame.setAttribute('aria-busy',String(value))}
function sync(){try{const d=frame.contentDocument,w=frame.contentWindow;const name=w.location.pathname.split('/').pop();if(!name||!name.endsWith('.html'))return;mode=name.startsWith('before')?'before':'after';page=name==='before.html'?'after.html':name.replace(/^before--/,'');document.querySelector('#page-select').value=page;document.querySelector('#full').href=name+w.location.search+w.location.hash;for(const k of ['before','after'])document.getElementById(k).setAttribute('aria-pressed',String(k===mode));const title=page==='after.html'?'トップページ':d.querySelector('h1')?.textContent.trim().replace(/\s+/g,' ')||d.title;document.querySelector('#current').textContent=(mode==='before'?'改修前':'改修後')+' · '+title}catch(e){}}
function loaded(){sync();busy(false);const d=frame.contentDocument;d.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||a.target==='_blank')return;const u=new URL(a.getAttribute('href'),frame.contentWindow.location.href);if(u.origin===location.origin&&u.pathname.endsWith('.html')&&u.pathname!==frame.contentWindow.location.pathname)busy(true)},true);frame.contentWindow.addEventListener('hashchange',sync)}
document.querySelector('#page-select').onchange=e=>{const target=e.target.value;busy(true);frame.src=mode==='before'?(target==='after.html'?'before.html':'before--'+target):target+'?v=teamheading1'};frame.addEventListener('load',loaded);for(const k of ['before','after'])document.getElementById(k).onclick=()=>{if(pending)return;sync();if(k===mode)return;const w=frame.contentWindow;const suffix='?v=teamheading1'+w.location.hash;busy(true);frame.src=(k==='before'?(page==='after.html'?'before.html':'before--'+page):page)+suffix};document.querySelector('select[aria-label="表示幅"]').onchange=e=>frame.style.width=e.target.value+'px';if(frame.contentDocument?.readyState==='complete'&&frame.contentWindow.location.pathname.endsWith('.html'))loaded();</script><script>
const heroSelect=document.getElementById('hero-select');
heroSelect.value=new URLSearchParams(location.search).get('hero')==='support'?'support':'truck';
function applyIllustration(){const d=frame.contentDocument;const image=d?.getElementById('hero-variant-image');heroSelect.disabled=!image;if(!image)return;const support=heroSelect.value==='support';image.src=support?'assets/hero-support-b.webp':'assets/hero-truck-a.webp';image.alt=support?'前西原清城・民が運送会社の相談者を支えるイラスト':'人物のいない青いトラックのイラスト';document.getElementById('full').href='after.html?hero='+heroSelect.value;document.getElementById('current').textContent='改修後 · トップページ · '+(support?'B：お二人がサポート':'A：トラックのみ');}
heroSelect.addEventListener('change',applyIllustration);frame.addEventListener('load',applyIllustration);if(frame.contentDocument?.readyState==='complete')applyIllustration();
</script></body></html>
