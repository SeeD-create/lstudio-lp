<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>うりずん｜改修後のサイト全体</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#e9eef1;color:#173b4a}.tools{padding:12px 18px;background:white;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #d1dce1}.tools strong{font-size:14px}.tools button,.tools select{padding:9px 12px;border:1px solid #b8cdd5;border-radius:5px;background:white;color:#173b4a;font:inherit;font-size:12px;cursor:pointer}.tools button[aria-pressed=true]{background:#007fad;color:white}.tools a{color:#007fad;font-size:12px}.note{font-size:11px;padding:9px 18px;color:#54707c;margin:0}.stage{padding:0 10px 10px;overflow:auto}iframe{display:block;margin:auto;width:390px;max-width:none;height:calc(100dvh - 120px);min-height:440px;border:0;background:white;box-shadow:0 5px 30px #173b4a20}@media(max-width:600px){.tools{gap:6px;padding:10px}.tools strong{width:100%}iframe{height:calc(100dvh - 165px)}.note{padding:8px 10px}}</style><div class="tools"><strong>うりずん｜改修後のサイト全体</strong><button id="after" aria-pressed="true">改修後</button><button id="before" aria-pressed="false">改修前</button><select aria-label="表示幅"><option value="390">スマホ 390px</option><option value="320">小型スマホ 320px</option><option value="768">タブレット 768px</option><option value="1200">PC 1200px</option></select><a id="full" href="after.html" target="_blank">画面いっぱいで開く ↗</a></div><p class="note">元サイトの内容を残し、スマホでの見やすさを整えた確認用ページです。メニューから下層ページもご確認いただけます。フォームの送信・保存は行いません。</p><div class="stage"><iframe id="site" title="サイト全体の確認" src="after.html"></iframe></div><script>const frame=document.querySelector('iframe');for(const mode of ['before','after'])document.getElementById(mode).onclick=()=>{frame.src=mode+'.html';document.querySelector('#full').href=mode+'.html';for(const k of ['before','after'])document.getElementById(k).setAttribute('aria-pressed',String(k===mode))};document.querySelector('select').onchange=e=>frame.style.width=e.target.value+'px';</script></html>
