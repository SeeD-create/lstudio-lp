<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>うりずん｜改修前後の確認</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#edf2f4;color:#173b4a}.tools{padding:14px 20px;background:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #d5e1e6}.tools strong{font-size:14px}.switch{display:flex;border:1px solid #b8cdd5;border-radius:7px;overflow:hidden}.tools button,.tools select{padding:11px 14px;border:0;background:#fff;color:#173b4a;font:inherit;font-size:13px;cursor:pointer}.tools select{border:1px solid #b8cdd5;border-radius:7px}.tools button[aria-pressed=true]{background:#007fad;color:#fff}.tools a{color:#007fad;font-size:13px;text-underline-offset:4px}.note{font-size:12px;padding:10px 20px;color:#54707c;margin:0;line-height:1.7}.current{color:#173b4a;font-weight:700;margin-right:12px}.stage{padding:0 10px 14px;overflow:auto}iframe{display:block;margin:auto;width:390px;height:calc(100dvh - 125px);min-height:420px;border:0;background:#fff;box-shadow:0 6px 32px #173b4a18}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ed533e;outline-offset:2px}@media(max-width:600px){.tools{gap:9px;padding:12px}.tools strong{width:100%}.tools button,.tools select{padding:10px;font-size:12px}.note{padding:9px 12px}iframe{height:calc(100dvh - 195px)}}
</style></head><body><div class="tools"><strong>うりずん｜サイトの改修案</strong><div class="switch" role="group" aria-label="改修前後の切替"><button id="after" aria-pressed="true">改修後</button><button id="before" aria-pressed="false">改修前</button></div><select aria-label="表示幅"><option value="390">スマホ 390px</option><option value="320">小型スマホ 320px</option><option value="768">タブレット 768px</option><option value="1200">PC 1200px</option><option value="1280">PC 1280px</option><option value="1440">PC 1440px</option></select><a id="full" href="after.html" target="_blank" rel="noopener">このページを大きく開く ↗</a></div><p class="note"><span class="current" id="current" aria-live="polite">改修後 · トップページ</span>メニューから下層ページも比較できます。確認用のため送信・保存は行いません。</p><div class="stage"><iframe id="site" title="サイトの改修前後の確認" src="after.html"></iframe></div><script>
const frame=document.querySelector('iframe');let mode='after';let page='after.html';
function sync(){try{const d=frame.contentDocument;const name=frame.contentWindow.location.pathname.split('/').pop();if(!name)return;mode=name.startsWith('before')?'before':'after';page=name==='before.html'?'after.html':name.replace(/^before--/,'');document.querySelector('#full').href=name+frame.contentWindow.location.hash;for(const k of ['before','after'])document.getElementById(k).setAttribute('aria-pressed',String(k===mode));const title=page==='after.html'?'トップページ':d.querySelector('h1')?.textContent.trim().replace(/\s+/g,' ')||d.title;document.querySelector('#current').textContent=(mode==='before'?'改修前':'改修後')+' · '+title}catch(e){}}
frame.addEventListener('load',sync);for(const k of ['before','after'])document.getElementById(k).onclick=()=>{sync();const hash=frame.contentWindow.location.hash;frame.src=(k==='before'?(page==='after.html'?'before.html':'before--'+page):page)+hash};document.querySelector('select').onchange=e=>frame.style.width=e.target.value+'px';
</script></body></html>
