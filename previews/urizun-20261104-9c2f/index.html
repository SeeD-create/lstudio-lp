<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うりずん｜スマホ改修 確認ページ</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef1;color:#183744;font-family:system-ui,'Yu Gothic',sans-serif}header{background:#fff;padding:16px 24px;border-bottom:1px solid #d8e0e5}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;margin:0;color:#586a75}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:15px 24px}button,select{font:inherit;font-size:13px;padding:10px 15px;border:1px solid #b9cbd3;border-radius:7px;background:white;cursor:pointer}button[aria-pressed=true]{background:#087ca4;color:white;border-color:#087ca4}.stage{padding:0 12px 22px;overflow:auto}iframe{display:block;width:390px;max-width:100%;height:calc(100dvh - 175px);min-height:460px;margin:auto;border:0;background:white;box-shadow:0 10px 40px #193d4920;border-radius:12px}a{color:#087ca4;font-size:12px}</style><header><h1>うりずん運送業サポート｜デザイン確認</h1><p>スマホ改修案 ／ 既存ロゴ・イラスト使用。下部は既存内容との接続イメージです。</p></header><div class="controls"><button id="a" aria-pressed="true">A：青背景</button><button id="b" aria-pressed="false">B：白背景</button><select id="size" aria-label="表示幅"><option value="390">スマホ 390px</option><option value="375">スマホ 375px</option><option value="320">スマホ 320px</option><option value="768">タブレット 768px</option><option value="1200">パソコン 1200px</option></select><a href="preview-site.html" target="_blank">画面いっぱいで開く ↗</a></div><div class="stage"><iframe title="デザイン案プレビュー" src="preview-site.html" id="view"></iframe></div><script>const view=document.querySelector('#view');for(const key of ['a','b'])document.getElementById(key).onclick=()=>{view.contentDocument.body.classList.toggle('light',key==='b');for(const k of ['a','b'])document.getElementById(k).setAttribute('aria-pressed',String(k===key));document.querySelector('a').href='preview-site.html'+(key==='b'?'?theme=light':'')};document.querySelector('select').onchange=e=>view.style.width=e.target.value+'px';</script></html>
