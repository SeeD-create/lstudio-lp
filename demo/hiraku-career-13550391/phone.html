<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマホ表示 | ひらく。キャリア</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#e8f0f2;color:#123447;font-family:Arial,'Noto Sans JP',sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 12px 18px}
    .preview-bar{width:min(100%,440px);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;font-size:12px;font-weight:700}
    .preview-bar strong{letter-spacing:.08em}.preview-bar nav{display:flex;gap:6px}.preview-bar a{border:1px solid #8aa5af;color:inherit;text-decoration:none;padding:6px 9px;border-radius:3px}
    .phone{width:min(390px,100%);height:min(780px,calc(100svh - 150px));min-height:0;background:white;border:9px solid #173749;border-radius:29px;overflow:hidden;box-shadow:0 16px 40px #183a4a39}
    iframe{display:block;width:100%;height:100%;border:0;background:white}
    .note{width:min(390px,100%);font-size:11px;line-height:1.6;color:#527183;margin:12px 0 0;text-align:center}
  </style>
</head>
<body>
  <div class="preview-bar"><strong>スマホ表示プレビュー</strong><nav><a href="phone.html?view=top">先頭</a><a href="phone.html?view=contact">最後のセクション</a></nav></div>
  <div class="phone"><iframe id="demo" title="LPのスマホ表示" src="./?v=career-marquee-1#contact"></iframe></div>
  <p class="note">幅約370pxの表示です。画面内をスクロールするとページ全体を確認できます。</p>
  <script>if(new URLSearchParams(location.search).get('view')==='top')document.querySelector('#demo').src='./?v=career-marquee-1#top';</script>
</body>
</html>
