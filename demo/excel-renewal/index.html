<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>修繕計画 Excel移行デモ</title><style>:root{--ink:#18201b;--g:#217346;--p:#f2f4f0;--l:#cfd7d0}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font-family:Arial,"Yu Gothic",sans-serif}.notice{background:#17251d;color:#fff;text-align:center;padding:7px;font-size:11px}header{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 3vw}header b{font-size:19px}header span{font-size:12px;color:var(--g)}main{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 96px)}aside{background:#20382b;color:#fff;padding:28px 18px}aside button{display:block;width:100%;border:0;background:none;color:#c0d4c7;padding:13px;text-align:left}aside button.active{background:#fff;color:var(--ink);font-weight:700}.sheet{padding:45px 5vw;min-width:0}.head{display:flex;justify-content:space-between;align-items:end}.kicker{font-size:10px;letter-spacing:.14em;color:var(--g)}h1{font:clamp(38px,5vw,66px)/1.1 serif;margin:10px 0 30px}.mode{border:1px solid var(--l);background:#fff;padding:5px}.mode button{border:0;padding:10px 14px;background:none}.mode button.active{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--l);padding:24px}.card h2{margin-top:0}.field{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}input,select{width:100%;padding:10px;border:1px solid var(--l)}.locked{background:#eef1ec;color:#6a736c}.result{font-size:29px;font-weight:800;color:var(--g)}table{width:100%;border-collapse:collapse;background:#fff;margin-top:22px}th,td{border:1px solid var(--l);padding:11px;text-align:left}th{background:#e7eee9}.test{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}.test button{padding:12px 16px;border:1px solid var(--g);background:#fff}.pass{padding:13px;background:#dff3e7;color:var(--g);font-weight:700}.hide{display:none}@media(max-width:700px){main{grid-template-columns:1fr}aside{display:none}.sheet{padding:35px 14px}.head{display:block}.mode{display:inline-block;margin-bottom:18px}.grid{grid-template-columns:1fr}.field{grid-template-columns:1fr;gap:5px}th:nth-child(3),td:nth-child(3){display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="notice">今回の要件に合わせた非公式モック｜建物・金額は架空｜Excelファイル・マクロ・外部サーバーには未接続</div><header><b>修繕計画シート / 移行設計デモ</b><span id="protect">配布版：数式保護</span></header><main><aside><button class="active">基本入力</button><button>修繕周期</button><button>年度別計画</button><button>印刷プレビュー</button><button>比較テスト</button></aside><section class="sheet"><div class="head"><div><p class="kicker">INPUT → CALCULATION → OUTPUT</p><h1>入力だけで、<br>長期計画を更新。</h1></div><div class="mode"><button class="active" data-mode="user">配布版</button><button data-mode="editor">編集用</button></div></div><div class="grid"><div class="card"><h2>基本入力</h2><label class="field"><span>延床面積（㎡）</span><input id="area" type="number" value="2400"></label><label class="field"><span>計画年数</span><select id="years"><option>20</option><option selected>30</option><option>40</option></select></label><label class="field"><span>外壁単価</span><input id="unit" class="locked" type="number" value="8500" disabled></label><label class="field"><span>修繕周期</span><input id="cycle" class="locked" type="number" value="12" disabled></label></div><div class="card"><h2>計算結果</h2><p>外壁修繕の概算</p><div class="result" id="total">20,400,000円</div><p id="timing">12年目・24年目に実施</p><p class="pass">✓ 入力セルと計算セルを分離</p><p class="pass">✓ 配布版は数式を非表示・保護</p></div></div><table><thead><tr><th>年度</th><th>工事項目</th><th>計算式</th><th>概算額</th></tr></thead><tbody id="rows"><tr><td>12年目</td><td>外壁修繕</td><td>2400 × 8500</td><td>20,400,000円</td></tr><tr><td>24年目</td><td>外壁修繕</td><td>2400 × 8500</td><td>20,400,000円</td></tr></tbody></table><div class="test"><button id="compare">元シートと比較テスト</button><button id="print">印刷範囲を確認</button><span id="testResult"></span></div></section></main><script>const a=document.querySelector('#area'),u=document.querySelector('#unit'),c=document.querySelector('#cycle'),y=document.querySelector('#years');function calc(){let total=a.value*u.value,arr=[];for(let n=+c.value;n<=+y.value;n+=+c.value)arr.push(n);document.querySelector('#total').textContent=total.toLocaleString()+'円';document.querySelector('#timing').textContent=arr.map(n=>n+'年目').join('・')+'に実施';document.querySelector('#rows').innerHTML=arr.map(n=>`<tr><td>${n}年目</td><td>外壁修繕</td><td>${a.value} × ${u.value}</td><td>${total.toLocaleString()}円</td></tr>`).join('')}[a,u,c,y].forEach(x=>x.oninput=calc);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));let edit=b.dataset.mode==='editor';[u,c].forEach(x=>x.disabled=!edit);document.querySelector('#protect').textContent=edit?'編集用：変更箇所を表示':'配布版：数式保護'});document.querySelector('#compare').onclick=()=>document.querySelector('#testResult').textContent='✓ 代表値・境界値 8件一致（デモ）';document.querySelector('#print').onclick=()=>document.querySelector('#testResult').textContent='✓ A4横 1ページ想定（デモ）';</script></body></html>
