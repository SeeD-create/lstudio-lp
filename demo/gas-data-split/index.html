<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>データ分割ツール｜架空デモ</title>
  <style>
    :root{--ink:#18312d;--muted:#64746f;--paper:#f4f1e9;--card:#fff;--accent:#ef7548;--line:#d8ded9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif}header{padding:24px clamp(18px,5vw,72px);display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.04em}.tag{font-size:12px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:clamp(24px,5vw,64px)}h1{font-size:clamp(30px,6vw,64px);line-height:1.05;margin:0 0 16px}.lead{max-width:720px;color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}.panel{background:var(--card);border:1px solid var(--line);padding:22px;box-shadow:0 14px 40px #18312d0c}.label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px}textarea{width:100%;min-height:260px;border:1px solid var(--line);padding:16px;font:inherit;line-height:1.7;resize:vertical;background:#fbfcfa}button{border:0;background:var(--accent);color:#fff;padding:14px 22px;font-weight:800;cursor:pointer;margin-top:14px}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:8px}.result{overflow:auto}.result table{border-collapse:collapse;width:100%;min-width:520px}.result th,.result td{border:1px solid var(--line);padding:12px;text-align:left}.result th{background:#edf1ed;font-size:12px}.notice{margin-top:24px;padding:14px 16px;background:#fff7df;border-left:4px solid #e5a72d;font-size:13px;line-height:1.7}.status{font-size:12px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:16px}textarea{min-height:220px}}
  </style>
</head>
<body>
  <header><div class="brand">SPLIT NOTE <span class="tag">提案用・架空デモ</span></div><div class="tag">Google Sheets / GAS 想定・未接続</div></header>
  <main>
    <h1>貼り付けるだけで、<br>項目ごとに整える。</h1>
    <p class="lead">改行・タブ・全角空白が混ざった文字列を、項目名を手がかりに安全に分割する操作例です。欠けた項目は列をずらさず「要確認」として残します。</p>
    <div class="grid">
      <section class="panel"><div class="label"><span>1. 元データを貼り付け</span><span class="status" id="inputStatus">サンプル入力済み</span></div><textarea id="source">名前：青葉 みなみ
好きな食べもの：カレー
好きなアーティスト名：Lumen
おすすめのドラマ：海辺の手紙</textarea><button id="split">分割する</button><button class="secondary" id="partial">欠損例</button></section>
      <section class="panel"><div class="label"><span>2. 分割結果</span><span class="status" id="resultStatus">未処理</span></div><div class="result"><table><thead><tr><th>A 名前</th><th>B 好きな食べもの</th><th>C アーティスト</th><th>D ドラマ</th></tr></thead><tbody id="rows"><tr><td colspan="4">「分割する」を押してください</td></tr></tbody></table></div><div class="notice">非公式の提案用モックです。架空データのみを使用し、Google Sheets・GAS・外部サービスには接続していません。</div></section>
    </div>
  </main>
  <script>
    const keys=[['名前','name'],['好きな食べもの','food'],['好きなアーティスト名','artist'],['おすすめのドラマ','drama']];
    function parse(){const raw=document.querySelector('#source').value.replace(/\t/g,'\n');const out={};for(const [label,key] of keys){const m=raw.match(new RegExp(label+'[：:]\\s*([^\\n]+)'));out[key]=m?m[1].trim():'要確認';}document.querySelector('#rows').innerHTML=`<tr><td>${out.name}</td><td>${out.food}</td><td>${out.artist}</td><td>${out.drama}</td></tr>`;document.querySelector('#resultStatus').textContent=Object.values(out).includes('要確認')?'欠損あり・要確認':'4項目を分割済み'}
    document.querySelector('#split').addEventListener('click',parse);
    document.querySelector('#partial').addEventListener('click',()=>{document.querySelector('#source').value='名前：青葉 みなみ\n好きな食べもの：カレー\nおすすめのドラマ：海辺の手紙';document.querySelector('#inputStatus').textContent='アーティスト項目なし';parse()});
  </script>
</body>
</html>
