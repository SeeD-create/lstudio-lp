<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>scope. | 架空の提案用デモ</title><link rel="stylesheet" href="style.css?v=0918"><script defer src="app.js?v=0918"></script></head><body style="--accent:#286276"><div class="demo">架空の提案用デモ · データは架空／外部サービス・AI・送信には未接続</div><div class="shell"><aside class="sidebar"><div class="logo">scope.</div><small>WORKSPACE / SAMPLE</small><div class="sideitem">相談を、合意できる仕様へ。</div><div class="notice">操作内容はこのブラウザ内だけで扱います。</div></aside><main class="main"><header class="top"><div><p class="eyebrow">WORKSPACE / 01</p><h1>相談を、合意できる仕様へ。</h1><p class="muted">要望・受入条件・未確定事項を分け、開発前の認識をそろえます。</p></div></header><div class="split"><section class="panel"><h2>相談の記録</h2><label>相談内容<textarea id="request">社内資料を検索できるAIを作りたい。回答には元資料を表示し、部署外の資料は見えないようにしたい。</textarea></label><label>優先する利用場面<select id="usecase"><option value="search">社内ナレッジ検索</option><option value="reply">問い合わせ返信の下書き</option><option value="minutes">議事録の整理</option></select></label><button id="organize" class="primary">仕様のたたき台を作る</button><div class="notice">選択した用途に応じた定型の仕様項目を表示します。AIによる自由文の解析ではありません。</div><h3>追加要望</h3><label>変更の内容<input id="change" placeholder="例：英語対応も追加したい"></label><button id="addChange">変更管理へ追加</button></section><section class="panel"><h2>合意前の仕様メモ</h2><div id="spec"></div></section></div><section class="panel"><h2>変更・未確定事項</h2><div id="changes"></div><div class="actions"><button id="export">引継ぎメモを出力</button><button id="reset">初期状態に戻す</button></div></section><footer>架空の自主制作サンプルです。実績・実サービスの稼働を示すものではありません。実データを入力しないでください。</footer></main></div><dialog id="modal"><button id="close" class="close" aria-label="閉じる">閉じる</button><div id="modalBody"></div></dialog></body></html>
