<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>金属取引デスク｜検索デモ</title><style>:root{--ink:#18211d;--g:#226348;--p:#f1f3ee;--l:#d1d8d2}*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--p);color:var(--ink);font-family:Arial,"Yu Gothic",sans-serif}.note{background:#17221d;color:#fff;text-align:center;padding:7px;font-size:11px}header{height:70px;background:#fff;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}header b{font-size:20px}header span{font-size:12px;color:var(--g)}main{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 98px)}aside{background:#1d3027;color:#fff;padding:35px 22px}aside button{display:block;width:100%;padding:14px;text-align:left;background:none;border:0;color:#bdd0c4;font-weight:700}aside button.active{background:#fff;color:var(--ink)}section{min-width:0;padding:55px 6vw}.kicker{font-size:11px;letter-spacing:.14em;color:var(--g)}h1{font:clamp(38px,5vw,68px)/1.1 serif;margin:12px 0 35px}.search{display:flex;background:#fff;padding:12px;border:1px solid var(--l)}input{flex:1;min-width:0;border:0;padding:13px;font-size:18px}.search button{background:var(--g);color:#fff;border:0;padding:0 25px;font-weight:700}.panel{background:#fff;margin-top:24px;border:1px solid var(--l)}.row{display:grid;grid-template-columns:1.2fr 1fr 1fr .6fr;padding:17px 20px;border-bottom:1px solid var(--l);cursor:pointer}.row:hover{background:#e5f1e9}.row.head{font-size:11px;color:#687269;cursor:default}.empty{padding:35px;text-align:center;color:#687269}.detail{display:none}.detail.active{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--l);padding:24px}.docs button{display:block;width:100%;padding:15px;margin:8px 0;text-align:left;background:#f8faf7;border:1px solid var(--l)}.badge{padding:4px 8px;background:#dff3e7;color:var(--g);font-size:11px}.back{border:0;background:none;color:var(--g);font-weight:700;margin-bottom:20px}@media(max-width:700px){main{grid-template-columns:1fr}aside{display:none}section{padding:38px 16px}.row{grid-template-columns:1.2fr 1fr}.row span:nth-child(3),.row span:nth-child(4),.row.head span:nth-child(3),.row.head span:nth-child(4){display:none}.detail-grid{grid-template-columns:1fr}.search{padding:7px}.search button{padding:0 14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="note">今回の要件に合わせた非公式モック｜氏名・取引・書類はすべて架空｜Drive・認証・帳票出力は未接続</div><header><b>金属取引デスク</b><span>権限：管理担当（デモ）</span></header><main><aside><button class="active">売主を検索</button><button>取引を登録</button><button>書類を確認</button><button>操作履歴</button></aside><section id="list"><p class="kicker">SELLER SEARCH</p><h1>名前から、<br>取引と書類を確認。</h1><div class="search"><input id="q" placeholder="例：青木、管理番号"><button id="find">検索</button></div><div class="panel" id="results"><div class="row head"><span>売主</span><span>直近取引</span><span>管理番号</span><span>件数</span></div><div class="row item" data-name="青木"><b>青木 みのり</b><span>2026/09/28</span><span>KM-260928-04</span><span>3件</span></div><div class="row item" data-name="森川"><b>森川 透</b><span>2026/08/19</span><span>KM-260819-02</span><span>1件</span></div></div></section><section id="detail" class="detail"><button class="back">← 検索へ戻る</button><p class="kicker">TRANSACTION DETAIL</p><h1>青木 みのり</h1><div class="detail-grid"><div class="card"><span class="badge">架空取引</span><h2>2026/09/28</h2><p>管理番号：KM-260928-04</p><p>品目：銅線ほか 4品目</p><p>合計重量：128.4kg</p><p>金額：デモのため非表示</p></div><div class="card docs"><h2>関連書類</h2><button>領収書（架空）<br><small>PDFプレビュー想定</small></button><button>本人確認書類（架空）<br><small>権限確認後に表示する想定</small></button><button>取引明細（架空）<br><small>登録項目を確認</small></button></div></div></section></main><script>const items=[...document.querySelectorAll('.item')],q=document.querySelector('#q');function search(){let v=q.value.trim();items.forEach(x=>x.style.display=!v||x.dataset.name.includes(v)?'grid':'none')}document.querySelector('#find').onclick=search;q.oninput=search;items.forEach(x=>x.onclick=()=>{document.querySelector('#list').style.display='none';document.querySelector('#detail').classList.add('active')});document.querySelector('.back').onclick=()=>{document.querySelector('#list').style.display='block';document.querySelector('#detail').classList.remove('active')}</script></body></html>
