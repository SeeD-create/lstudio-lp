<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OfficeうりずんOS ご説明動画｜Lスタジオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--ink:#17201f;--muted:#5f6b68;--faint:#98a3a0;--line:#dcdfdb;--paper:#fafbf9;--green:#1E6F5C;--green-bg:#e8f2ee}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.85}
.wrap{max-width:880px;margin:0 auto;padding:40px 16px 72px}
h1{font-family:"Shippori Mincho","Yu Mincho",serif;font-weight:600;font-size:clamp(21px,4.4vw,30px);line-height:1.5;margin:0}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:700}
.rule{width:64px;height:4px;background:var(--green);margin-bottom:18px}
.lead{font-size:15px;color:var(--muted);margin-top:14px}
video{width:100%;display:block;margin-top:26px;background:#000;border:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--faint);margin-top:10px}
.box{border:1px solid var(--line);background:#fff;padding:18px 20px;margin-top:26px}
.box h2{font-family:"Shippori Mincho",serif;font-weight:600;font-size:16px;margin:0 0 8px}
.box p{margin:0;font-size:14.5px;color:var(--muted)}
.links{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-block;text-decoration:none;font-size:14.5px;font-weight:700;padding:13px 22px;border:1.5px solid var(--green);color:var(--green);background:var(--green-bg)}
a.btn.sub{background:#fff;border-color:var(--line);color:var(--ink)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
</style></head><body>
<div class="wrap">
  <div class="rule"></div>
  <div class="eyebrow">OFFICE URIZUN OS ／ ご説明</div>
  <h1>画面を動かしながら、2分36秒でご説明します。</h1>
  <p class="lead">前半は、実際に作って動かしているデモの画面です。後半は、その先にどう伸ばしていくかの見取り図です。<br>
    音声はありません。画面の中の字幕をご覧ください。</p>

  <video src="setsumei.mp4" controls playsinline preload="metadata"></video>
  <div class="meta"><span>2分36秒</span><span>1280×720</span><span>音声なし・字幕あり</span><span>6.6MB</span></div>

  <div class="box">
    <h2>ご注意</h2>
    <p>画面に出てくる事務所名・顧問先名・氏名・数字は、すべて架空のものです。納品物ではなく、ご提案のために作った検討用のデモです。</p>
  </div>

  <div class="links">
    <a class="btn" href="../">デモをご自分で触ってみる</a>
    <a class="btn sub" href="../kensho/">安全性の確認結果を見る</a>
    <a class="btn sub" href="setsumei.mp4" download>動画をダウンロード</a>
  </div>

  <footer>Lスタジオ　平野 淳一　／　https://l-studiojp.com/</footer>
</div>
</body></html>
