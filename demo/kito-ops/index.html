<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITO｜仕事をつなぐ業務デスク・架空デモ</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><aside><a class="brand" href="#">kito<span>仕事を、ひとつにつなぐ。</span></a><nav aria-label="業務メニュー"><button data-view="today" class="active">01　今日の業務</button><button data-view="projects">02　案件とタスク</button><button data-view="clients">03　取引先</button><button data-view="files">04　資料一覧</button><button data-view="history">05　変更履歴</button></nav><div class="aside-bottom">架空の業務デスク<br>ブラウザ内だけに保存<br><button id="motion">動きを停止</button></div></aside><main><header><span>WORKSPACE / DEMONSTRATION</span><label>表示権限の体験<select id="role"><option>担当者</option><option>閲覧のみ</option></select></label></header><div class="notice">提案用の架空データです。認証・実ファイル保存・メール・AI・外部サービスは未接続。実際の顧客情報は入力しないでください。</div><section class="title"><div><p class="eyebrow">A CLEARER WORKDAY</p><h1 id="heading">今日の仕事が、<br>すっと見える。</h1><p id="intro">期限と担当、次の一手をひとつの場所に。</p></div><div class="stamp">KITO<br><small>TEAM DESK</small></div></section><div id="metrics"></div><section class="workspace"><div class="toolbar"><label>案件・取引先を検索<input id="search" placeholder="例：あおば"></label><label>状態<select id="filter"><option>すべて</option><option>準備中</option><option>進行中</option><option>確認待ち</option><option>完了</option></select></label><button id="new" class="primary">＋ 案件を追加</button></div><div id="content"></div></section><section class="io"><div><h2>引き継ぎも、この場所から。</h2><p>CSVはこのブラウザの架空案件を出力します。取込は内容確認後に追加します。</p></div><button id="export">CSVを書き出す</button><button id="sample">取込サンプルを確認</button><button id="reset">デモを初期化</button></section><p id="announce" role="status"></p><footer>KITO / CONCEPT DEMO　すべて架空の企業・案件・資料です。</footer></main><dialog id="detail"><button id="close" class="close" aria-label="閉じる">×</button><div id="detail-content"></div></dialog></body></html>
