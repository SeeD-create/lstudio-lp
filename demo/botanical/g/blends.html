<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ヒーロー 10デザイン比較</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeee8;color:#293c30;font-family:system-ui,sans-serif}header{padding:16px 24px;background:#fff}h1{font-size:17px;margin:0 0 10px}nav{display:flex;gap:6px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #d5dcd4;background:#fff;color:#344b38;border-radius:5px;padding:9px 12px;font:12px system-ui}button[aria-pressed=true]{background:#294b38;color:#fff;border-color:#294b38}.tools{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px}.tools a{margin-left:auto;color:#294b38}iframe{border:0;display:block;width:100%;height:calc(100vh - 174px);min-height:690px;background:#fff}body.mobile iframe{width:390px;max-width:100%;height:844px;margin:20px auto;box-shadow:0 8px 40px #23432120}@media(max-width:600px){header{padding:12px}nav{flex-wrap:nowrap;overflow:auto}nav button{white-space:nowrap}iframe{height:calc(100dvh - 160px);min-height:600px}}</style><header><h1>写真と背景が溶け合う、10のデザイン</h1><nav><button data-id="01" aria-pressed="false">01 シルクホワイト</button><button data-id="02" aria-pressed="false">02 セージの霞</button><button data-id="03" aria-pressed="false">03 ローズの斜光</button><button data-id="04" aria-pressed="false">04 ハニーライト</button><button data-id="05" aria-pressed="false">05 フォレストナイト</button><button data-id="06" aria-pressed="false">06 和紙の余白</button><button data-id="07" aria-pressed="false">07 フロストガラス</button><button data-id="08" aria-pressed="false">08 エディトリアル</button><button data-id="09" aria-pressed="false">09 ボタニカルミスト</button><button data-id="10" aria-pressed="false">10 ピーチグロウ</button></nav><div class="tools"><button id="prev" aria-label="前の案">←</button><button id="next" aria-label="次の案">→</button><button id="size">スマホ幅で見る</button><a id="open" href="blend-01.html" target="_blank">この案を別タブで開く ↗</a></div></header><iframe title="選択したヒーローデザイン" src="blend-01.html"></iframe><script>let current=1;const frame=document.querySelector('iframe');function show(n){current=(n+9)%10+1;const id=String(current).padStart(2,'0');frame.src='blend-'+id+'.html';document.querySelector('#open').href=frame.src;document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));history.replaceState(null,'','#'+id)}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(Number(b.dataset.id)));document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#size').onclick=()=>{document.body.classList.toggle('mobile');document.querySelector('#size').textContent=document.body.classList.contains('mobile')?'PC幅で見る':'スマホ幅で見る'};show(Number(location.hash.slice(1))||1);</script></html>
